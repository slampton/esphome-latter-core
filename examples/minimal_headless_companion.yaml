# ==============================================================================
# Latter Core Example: Minimal Headless Companion Node (examples/minimal_headless_companion.yaml)
# Demonstrates a headless Latter Core node (`gui: "none"`, `latter_core` only)
# using the shared Protocol v3 + bound RPC outbox base foundation (`modules/base.yaml`).
# ==============================================================================

substitutions:
  name: "latter-headless-node"
  friendly_name: "Latter Headless Node"
  latter_asset_ref: "main"
  api_reboot_timeout: "15min"

external_components:
  - source:
      type: local
      path: ../components
    components: [latter_core]

latter_core:
  gui: "none"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0
  build_flags:
    - "-DLATTER_HAS_DISPLAY=0"
    - "-DLATTER_HAS_TOUCH=0"
    - "-DLATTER_HAS_AUDIO=0"
    - "-DLATTER_HAS_IMU=0"
    - "-DLATTER_HAS_BATTERY=0"
    - "-DLATTER_HAS_RTC=0"
    - "-DLATTER_IS_STATIONARY=1"
    - "-DLATTER_IS_WEARABLE=0"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: "MyHomeWiFi"
  password: "MyWiFiPassword"

api:
  encryption:
    key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="

ota:
  - platform: esphome
    id: ota_esphome
    encryption:

packages:
  latter_base: !include ../modules/base.yaml
