# ==============================================================================
# Latter Core Example 1: Minimal Headless / Mixin Companion Node
# Target: Any standard ESP32-S3 DevKit (Zero external peripherals required)
# Purpose: Demonstrates how to turn any bare ESP32 into an auto-discovered
#          Latter companion with BLE room presence beaconing and room context.
# ==============================================================================

substitutions:
  name: "latter-headless-demo"
  friendly_name: "Latter Headless Demo"
  version: "2.2.1"
  active_media_sensor: "sensor.latter_headless_demo_active_media"
  weather_forecast_sensor: "sensor.latter_headless_demo_weather_forecast"
  room_context_sensor: "sensor.latter_headless_demo_room_context"
  calendar_agenda_sensor: "sensor.latter_headless_demo_calendar_agenda"
  remote_config_sensor: "sensor.latter_headless_demo_remote_config"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: "MyHomeWiFi"
  password: "MyWiFiPassword"

# Include Latter Core Base, Area Room Control Client & BLE Presence Beacon
packages:
  latter_base: !include ../modules/base.yaml
  latter_room: !include ../modules/room_control.yaml
  latter_ble:  !include ../mixins/ble_beacon.yaml
