# ==============================================================================
# Latter Core Example: Minimal Headless Companion Node (examples/minimal_headless_companion.yaml)
# Demonstrates combining Latter Core base, headless Area control, and BLE presence mixin
# ==============================================================================

substitutions:
  name: "latter-headless-node"
  device_slug: "latter_headless_node"
  friendly_name: "Latter Headless Node"
  version: "2.2.0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: "MyHomeWiFi"
  password: "MyWiFiPassword"

packages:
  latter_base: !include ../modules/base.yaml
  latter_area: !include ../modules/area_control.yaml
  latter_ble:  !include ../mixins/ble_beacon.yaml
