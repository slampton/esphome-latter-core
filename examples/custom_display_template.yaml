# ==============================================================================
# Latter Core Example 2: Custom Display Porting Template (480x480 Square Panel)
# Target: Generic ESP32-S3 (or ESP32-P4) with Octal PSRAM, QSPI/SPI Display,
#         I2C Touch, and I2S Audio
# Purpose:
#   1. Copy-paste starter template for porting the full Latter C++20 UI OS
#      (Clock faces, 20 FPS Weather, Assist, Music Assistant, Area Control,
#      Home Hub, up to 10 remotes, 6 Games, 11 Tools) to a new screen.
#   2. Automated CI target verifying that all C++20 headers in include/
#      and modules/latter_display_firmware.yaml validate cleanly.
# ==============================================================================

substitutions:
  name: "latter-panel-demo"
  friendly_name: "Latter Panel Demo"
  version: "3.0.0"
  art_resize: "480x480"
  sendspin_art_resize: "480x480"
  default_clock_face: "Minimal Digital"
  default_power_profile: "Handheld Roaming"
  sendspin_buffer_size: "524288"  # PSRAM; 48 kHz holds 3x the bytes per second of 16 kHz
  mww_internal_ram: "false"  # "true" only with internal-RAM headroom (P4-class boards)
  announcement_buffer_size: "65536"
  audio_out_rate: "48000"  # full-duplex I2S bus rate; latter_mic resamples to audio_in_rate
  audio_out_channels: "1"
  audio_out_bits: "16"
  audio_in_rate: "16000"
  imu_int1_pin: GPIO17  # QMI8658 INT1 (hardware wake-on-motion); required by modules/hal/imu_qmi8658.yaml

# Load the Latter Core C++20 components (use github://slampton/esphome-latter-core@main in external repos)
external_components:
  - source:
      type: local
      path: ../components
    components: [latter_core, latter_ui, latter_beacon]

latter_core:

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0b4
  build_flags:
    - "-DLATTER_SCREEN_W=480"
    - "-DLATTER_SCREEN_H=480"
    - "-DLATTER_ROUND_DISPLAY=0"
    - "-DLATTER_HAS_DISPLAY=1"
    - "-DLATTER_HAS_TOUCH=1"
    - "-DLATTER_HAS_AUDIO=1"
    - "-DLATTER_HAS_IMU=1"
    - "-DLATTER_HAS_BATTERY=0"
    - "-DLATTER_IS_STATIONARY=1"
    - "-DLATTER_IS_WEARABLE=0"
    - "-DLATTER_PANEL_IPS=0"
    - "-DLATTER_PANEL_PPI=313"   # diagonal pixels / diagonal inches (touch thresholds are in mm)
    - "-DLATTER_CHIP_P4=0"
    - "-DLATTER_PSRAM_MB=8"
    # Audio traits for the hardware manifest; keep in step with the substitutions above
    - "-DLATTER_AUDIO_OUT_RATE=48000"
    - "-DLATTER_AUDIO_OUT_CH=1"
    - "-DLATTER_AUDIO_OUT_BITS=16"
    - "-DLATTER_AUDIO_IN_RATE=16000"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_PERF: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "256"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:
  level: INFO

wifi:
  id: wifi_ctrl
  ssid: "MyHomeWiFi"
  password: "MyWiFiPassword"

api:
  encryption:
    key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="

ota:
  - id: !extend ota_esphome
    encryption:

# Area presence iBeacon with raw HCI and no host stack (VHCI on an on-chip controller; on an ESP32-P4
# it drives the esp_hosted co-processor's controller and needs esp32_hosted).
latter_beacon:
  id: ble_ctrl
  uuid: "4C415454-4552-434F-5245-000000000220"
  major: 1
  minor: 9

update:
  - platform: http_request
    id: latter_firmware_update
    name: "Project Firmware"
    source: "https://example.com/manifest.json"
    update_interval: never

safe_mode:
  boot_is_good_after: 5s

# ==============================================================================
# REFERENCE BOARD HARDWARE ABSTRACTION LAYER (HAL)
# Replace pins & driver models below with your board's schematic
# ==============================================================================
i2c:
  - id: bus_internal
    sda: GPIO15
    scl: GPIO14
    frequency: 400kHz

spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO38
    data_pins: [GPIO4, GPIO5, GPIO6, GPIO7]

# One I2S port in full duplex: speaker (DOUT) and microphone (DIN) share BCLK/WS/MCLK at audio_out_rate.
i2s_audio:
  - id: i2s_shared_bus
    i2s_lrclk_pin: { number: GPIO45, ignore_strapping_warning: true }
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO16
    full_duplex: true

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_internal
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: ${audio_out_rate}

microphone:
  - platform: i2s_audio
    id: latter_mic_i2s
    adc_type: external
    i2s_audio_id: i2s_shared_bus
    i2s_din_pin: GPIO10
    sample_rate: ${audio_out_rate}
    bits_per_sample: 16bit
    channel: left
  # Wake word and voice listen at audio_in_rate (16 kHz)
  - platform: resampler
    id: latter_mic
    microphone: latter_mic_i2s
    sample_rate: ${audio_in_rate}

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_internal
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: ${audio_out_rate}
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: physical_speaker
    i2s_audio_id: i2s_shared_bus
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: ${audio_out_rate}
    bits_per_sample: 16bit
    channel: left
    buffer_duration: 250ms
    timeout: 4s  # longer than the 3 s idle power-down (see docs/porting-hardware.md)

# IMU sensors included via modules/hal/imu_qmi8658.yaml in packages below

switch:
  - platform: gpio
    name: "Speaker Enable"
    id: speaker_enable
    internal: true
    pin: { number: GPIO46, ignore_strapping_warning: true }

binary_sensor:
  - platform: gpio
    id: boot_button
    name: "Boot Button"
    entity_category: diagnostic
    pin: { number: GPIO0, mode: INPUT_PULLUP, inverted: true, ignore_strapping_warning: true }

display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    spi_id: display_qspi
    bus_mode: quad
    data_rate: 80MHz
    reset_pin: GPIO1
    cs_pin: GPIO12
    dimensions:
      width: 480
      height: 480
    update_interval: 1s

touchscreen:
  - platform: ft5x06
    id: touch_screen
    display: disp1
    i2c_id: bus_internal
    address: 0x38
    interrupt_pin: { number: GPIO11, mode: INPUT_PULLUP }

# Standard HAL Hook Scripts (customize for your board's power lines)
script:
  - id: hal_release_deep_sleep_holds
    mode: restart
    then:
      - lambda: |-
          id(es8311_dac).set_volume(0.90f);
          id(es8311_dac).set_mute_on();
  - id: hal_set_dac_mute
    mode: restart
    parameters:
      muted: bool
    then:
      - lambda: |-
          if (muted) {
            id(es8311_dac).set_mute_on();
          } else {
            id(es8311_dac).set_mute_off();
          }
  - id: hal_enter_hardware_hibernate
    mode: restart
    then:
      - lambda: 'return;'
  - id: hal_set_audio_codecs_standby
    mode: restart
    parameters:
      standby: bool
    then:
      - lambda: 'latter_ui::hal_set_es8311_es7210_standby(id(bus_internal), standby, true);'

