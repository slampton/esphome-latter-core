# AUTO-GENERATED by tools/new_board.py from boards/facts/waveshare_p4_35.json. Do not edit by hand:
# fix the facts file and run `python tools/new_board.py --bringup`.
# ==============================================================================
# Bench bring-up probe: Waveshare ESP32-P4-WIFI6-Touch-LCD-3.5 (Remote Assistant)
# No Latter core or GUI. Flash over USB, open the serial log, and attach it to the board PR as
# onboarding gate G2 evidence. It logs:
#   [BRINGUP:SILICON] / [BRINGUP:MEMORY]  revision, flash and PSRAM
#   [BRINGUP:I2C]                          every facts-ledger I2C device present/missing, plus strays
#   [BRINGUP:PMU]                          AXP2101 status, VBAT, gauge, rail enables (battery boards)
#   key / interrupt edges                  press each key; touch the panel (touch INT pulses)
# and exposes switches for each output net (amplifier, haptics, SD power, backlight).
# Display, touch coordinates and audio are verified by the full firmware's [PROF:*] walk (gate G5).
# ==============================================================================

substitutions:
  name: "bringup-waveshare-p4-35"
  # P4 silicon profile: rev3 -> "false" / 400MHz, rev1 -> "true" / 360MHz (binaries are not cross-compatible).
  p4_engineering_sample: "false"
  p4_cpu_frequency: "400MHz"

esphome:
  name: ${name}
  friendly_name: "Bring-up Remote Assistant"
  includes:
    - bringup.h
  on_boot:
    - priority: -100
      then:
        - lambda: 'latter_bringup::log_silicon();'
        - delay: 1s
        - script.execute: bringup_probe

esp32:
  variant: esp32p4
  engineering_sample: ${p4_engineering_sample}
  cpu_frequency: ${p4_cpu_frequency}
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  speed: 200MHz
  ignore_not_found: false

logger:
  level: DEBUG
  hardware_uart: UART0

i2c:
  - id: bus_internal
    sda: GPIO7
    scl: GPIO8
    frequency: 100kHz
    scan: false

script:
  - id: bringup_probe
    then:
      - lambda: |-
          static const uint8_t expected[] = {0x34, 0x18, 0x38};
          latter_bringup::probe_i2c(id(bus_internal), expected, sizeof(expected));
          latter_bringup::log_axp2101(id(bus_internal));
      - delay: 2s
      - logger.log: "[BRINGUP:OUT] sd_power_gate GPIO45 HIGH for 1 s"
      - switch.turn_on: out_gpio45
      - delay: 1s
      - switch.turn_off: out_gpio45
      - delay: 2s
      - logger.log: "[BRINGUP:OUT] speaker_pa GPIO53 HIGH for 1 s"
      - switch.turn_on: out_gpio53
      - delay: 1s
      - switch.turn_off: out_gpio53
      - delay: 1s
      - logger.log: "[BRINGUP:OUT] backlight 10 percent"
      - light.turn_on:
          id: backlight_light
          brightness: 10%
      - delay: 1s
      - logger.log: "[BRINGUP:OUT] backlight 50 percent"
      - light.turn_on:
          id: backlight_light
          brightness: 50%
      - delay: 1s
      - logger.log: "[BRINGUP:OUT] backlight 100 percent"
      - light.turn_on:
          id: backlight_light
          brightness: 100%

interval:
  - interval: 10s
    then:
      - lambda: 'latter_bringup::log_axp2101(id(bus_internal));'

binary_sensor:
  - platform: gpio
    name: "boot_button GPIO35"
    pin:
      number: GPIO35
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    on_state:
      then:
        - logger.log:
            format: "[BRINGUP:EDGE] boot_button GPIO35 -> %s"
            args: ['x ? "ON" : "OFF"']
  - platform: gpio
    name: "pwr_key GPIO49"
    pin:
      number: GPIO49
      mode:
        input: true
    on_state:
      then:
        - logger.log:
            format: "[BRINGUP:EDGE] pwr_key GPIO49 -> %s"
            args: ['x ? "ON" : "OFF"']
  - platform: gpio
    name: "touch_int GPIO50"
    pin:
      number: GPIO50
      inverted: true
      mode:
        input: true
        pullup: true
    on_state:
      then:
        - logger.log:
            format: "[BRINGUP:EDGE] touch_int GPIO50 -> %s"
            args: ['x ? "ON" : "OFF"']

switch:
  - platform: gpio
    id: out_gpio45
    name: "SD power OFF (gate high) GPIO45"
    pin:
      number: GPIO45
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: out_gpio53
    name: "speaker_pa GPIO53"
    pin:
      number: GPIO53
    restore_mode: ALWAYS_OFF

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO28
    frequency: 2000Hz

light:
  - platform: monochromatic
    id: backlight_light
    name: "Backlight sweep"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
