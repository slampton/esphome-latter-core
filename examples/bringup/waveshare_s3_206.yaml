# AUTO-GENERATED by tools/new_board.py from boards/facts/waveshare_s3_206.json. Do not edit by hand:
# fix the facts file and run `python tools/new_board.py --bringup`.
# ==============================================================================
# Bench bring-up probe: Waveshare ESP32-S3-Touch-AMOLED-2.06 (Wrist Assist)
# No Latter core or GUI. Flash over USB, open the serial log, and attach it to the board PR as
# onboarding gate G2 evidence. It logs:
#   [BRINGUP:SILICON] / [BRINGUP:MEMORY]  revision, flash and PSRAM
#   [BRINGUP:I2C]                          every facts-ledger I2C device present/missing, plus strays
#   [BRINGUP:PMU]                          AXP2101 status, VBAT, gauge, rail enables (battery boards)
#   key / interrupt edges                  press each key; touch the panel (touch INT pulses)
# and exposes switches for each output net (amplifier, haptics, SD power, backlight).
# Display, touch coordinates and audio are verified by the full firmware's [PROF:*] walk (gate G5).
# ==============================================================================

substitutions:
  name: "bringup-waveshare-s3-206"

esphome:
  name: ${name}
  friendly_name: "Bring-up Wrist Assist"
  includes:
    - bringup.h
  on_boot:
    - priority: -100
      then:
        - lambda: 'latter_bringup::log_silicon();'
        - delay: 1s
        - script.execute: bringup_probe

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 32MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:
  level: DEBUG

i2c:
  - id: bus_internal
    sda: GPIO15
    scl: GPIO14
    frequency: 100kHz
    scan: false

script:
  - id: bringup_probe
    then:
      - lambda: |-
          static const uint8_t expected[] = {0x34, 0x18, 0x40, 0x38, 0x6b, 0x51};
          latter_bringup::probe_i2c(id(bus_internal), expected, sizeof(expected));
          latter_bringup::log_axp2101(id(bus_internal));
          uint8_t rtc_reg = 0x04, rtc_buf[7] = {};
          if (id(bus_internal).write_readv(0x51, &rtc_reg, 1, rtc_buf, sizeof(rtc_buf)) == esphome::i2c::ERROR_OK) {
            ESP_LOGI("bringup", "[BRINGUP:RTC] pcf85063 os=%d bcd=20%02X-%02X-%02X %02X:%02X:%02X",
                     (int)((rtc_buf[0] >> 7) & 1), rtc_buf[6], rtc_buf[5] & 0x1F, rtc_buf[3] & 0x3F,
                     rtc_buf[2] & 0x3F, rtc_buf[1] & 0x7F, rtc_buf[0] & 0x7F);
          }
      - delay: 2s
      - logger.log: "[BRINGUP:OUT] haptic_motor GPIO18 HIGH for 1 s"
      - switch.turn_on: out_gpio18
      - delay: 1s
      - switch.turn_off: out_gpio18
      - delay: 2s
      - logger.log: "[BRINGUP:OUT] speaker_pa GPIO46 HIGH for 1 s"
      - switch.turn_on: out_gpio46
      - delay: 1s
      - switch.turn_off: out_gpio46

interval:
  - interval: 10s
    then:
      - lambda: 'latter_bringup::log_axp2101(id(bus_internal));'

binary_sensor:
  - platform: gpio
    name: "boot_button GPIO0"
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    on_state:
      then:
        - logger.log:
            format: "[BRINGUP:EDGE] boot_button GPIO0 -> %s"
            args: ['x ? "ON" : "OFF"']
  - platform: gpio
    name: "pwr_key GPIO10"
    pin:
      number: GPIO10
      mode:
        input: true
    on_state:
      then:
        - logger.log:
            format: "[BRINGUP:EDGE] pwr_key GPIO10 -> %s"
            args: ['x ? "ON" : "OFF"']
  - platform: gpio
    name: "imu_int1 GPIO21"
    pin:
      number: GPIO21
      mode:
        input: true
        pullup: true
    on_state:
      then:
        - logger.log:
            format: "[BRINGUP:EDGE] imu_int1 GPIO21 -> %s"
            args: ['x ? "ON" : "OFF"']
  - platform: gpio
    name: "touch_int GPIO38"
    pin:
      number: GPIO38
      inverted: true
      mode:
        input: true
        pullup: true
    on_state:
      then:
        - logger.log:
            format: "[BRINGUP:EDGE] touch_int GPIO38 -> %s"
            args: ['x ? "ON" : "OFF"']
  - platform: gpio
    name: "rtc_int GPIO39"
    pin:
      number: GPIO39
      mode:
        input: true
        pullup: true
    on_state:
      then:
        - logger.log:
            format: "[BRINGUP:EDGE] rtc_int GPIO39 -> %s"
            args: ['x ? "ON" : "OFF"']

switch:
  - platform: gpio
    id: out_gpio18
    name: "haptic_motor GPIO18"
    pin:
      number: GPIO18
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: out_gpio46
    name: "speaker_pa GPIO46"
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF
