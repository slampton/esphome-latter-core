# ==============================================================================
# Latter Core Mixin: Stationary Room BLE Scanner Proxy (mixins/ble_proxy.yaml)
# Usage:
#   packages:
#     latter.proxy: github://slampton/esphome-latter-core/mixins/ble_proxy.yaml@main
# ==============================================================================

api:
  actions:
    - action: latter_ping
      then:
        - logger.log: "Latter Stationary BLE Scanner Proxy Mixin active"

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true