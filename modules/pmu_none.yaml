# ==============================================================================
# Latter Core Module: Mains-Powered / No-PMU Power State (modules/pmu_none.yaml)
# Included by boards without a battery or PMIC (Desk Assistant P4-86-Panel).
# The power-state IDs that the shared firmware reads exist here as internal components only: there is
# no battery to report, so nothing is published to Home Assistant (no always-100% battery entity).
# ==============================================================================

binary_sensor:
  # Always on external power: behaves as "docked" for Docked Only modes and sleep policy.
  - platform: template
    id: usb_connected
    internal: true
    lambda: 'return true;'

  - platform: template
    id: batt_charging
    internal: true
    lambda: 'return false;'

sensor:
  # No battery: unknown (NaN), never a made-up level. Battery UI is compiled out (LATTER_HAS_BATTERY 0).
  - platform: template
    id: batt_level
    internal: true
    update_interval: never
    lambda: 'return NAN;'

  - platform: template
    id: batt_voltage
    internal: true
    update_interval: never
    lambda: 'return NAN;'

script:
  - id: hal_boot_battery_check
    mode: single
    then:
      - lambda: 'return;'

  - id: hal_init_pmu
    mode: restart
    then:
      - lambda: 'return;'

  - id: hal_poll_pmu_1s
    mode: restart
    then:
      - lambda: 'return;'

  - id: hal_wait_pwr_key_release
    mode: restart
    then:
      - lambda: 'return;'
