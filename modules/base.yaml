# ==============================================================================
# Latter Core Module: Base Identity, Time Sync & Contract Handshake (modules/base.yaml)
# ==============================================================================

substitutions:
  name: "latter-device"
  device_slug: "latter_device"
  friendly_name: "Latter Device"
  version: "2.2.0"
  screen_w: "466"
  screen_h: "466"
  font_time_size: "77"
  font_chrono_size: "38"
  font_date_size: "27"
  font_btn_bold_size: "26"
  font_small_size: "21"
  font_micro_size: "14"
  font_games_size: "38"
  default_clock_face: "Minimal Digital"
  default_power_profile: "Pocket Carry"
  default_pickup_wake: "Docked Only"
  default_tap_wake: "Docked Only"
  default_battery_timeout: "30s"
  default_docked_timeout: "1 min"
  default_hibernate_timeout: "15 min"
  active_media_sensor: "sensor.${device_slug}_active_media"
  weather_entity: "sensor.${device_slug}_weather_forecast"
  weather_forecast_sensor: "${weather_entity}"
  area_context_sensor: "sensor.${device_slug}_area_context"
  calendar_agenda_sensor: "sensor.${device_slug}_calendar_agenda"
  remote_config_sensor: "sensor.${device_slug}_remote_config"
  remote_1_entity: "remote.none"
  remote_1_name: ""
  remote_2_entity: "remote.none"
  remote_2_name: ""
  remote_3_entity: "remote.none"
  remote_3_name: ""
  remote_4_entity: "remote.none"
  remote_4_name: ""

api:
  actions:
    - action: latter_ping
      id: latter_ping_action
      then:
        - logger.log: "Latter companion connected"

time:
  - platform: homeassistant
    id: ha_time