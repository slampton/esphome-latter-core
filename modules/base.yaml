# ==============================================================================
# Latter Core Module: Base Identity, Time Sync & Contract Handshake (modules/base.yaml)
# ==============================================================================

substitutions:
  name: "latter-device"
  friendly_name: "Latter Device"
  version: "3.0.0"
  screen_w: "466"
  screen_h: "466"
  font_time_size: "77"
  font_chrono_size: "38"
  font_date_size: "27"
  font_btn_bold_size: "26"
  font_small_size: "21"
  font_micro_size: "14"
  font_games_size: "38"
  default_clock_face: "Minimal Digital"
  default_power_profile: "Portable Carry"
  api_reboot_timeout: "0s"
  sendspin_buffer_size: "196608"
  mww_internal_ram: "false"
  announcement_buffer_size: "65536"
  audio_out_rate: "48000"
  audio_out_channels: "1"
  audio_out_bits: "16"
  audio_in_rate: "16000"

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: 'latter_rpc::bind_sensor_sink(&id(latter_rpc_outbox));'

api:
  reboot_timeout: ${api_reboot_timeout}
  batch_delay: 0ms
  on_client_connected:
    then:
      - if:
          condition:
            lambda: 'return client_info.find("Home Assistant") != std::string::npos;'
          then:
            - lambda: 'latter_ui::reset_all_v3_rev_guards();'
            - script.execute: send_device_hello
  actions:
    - action: latter_ping
      id: latter_ping_action
      then:
        - logger.log: "Latter companion connected"
        # Latter pings every bound Device once its RPC outbox listener is attached: answer with a fresh hello.
        - script.execute: send_device_hello

    - action: latter_push_v3
      id: latter_push_v3_action
      variables:
        domain: string
        payload: string
      then:
        - lambda: |-
            const std::string_view sv_dom(domain.c_str(), domain.size());
            const std::string_view sv_pay(payload.c_str(), payload.size());
            if (sv_dom == "area_context") {
              latter_ui::parse_v3_area_ctx_payload(sv_pay, latter_ui::area_ctx_state(), latter_ui::whole_home_state());
            } else if (sv_dom == "active_media") {
              latter_ui::parse_v3_media_payload(sv_pay, latter_ui::media_state());
            } else if (sv_dom == "remote_config") {
              latter_ui::parse_v3_remote_payload(sv_pay, latter_ui::remote_state());
            } else if (sv_dom == "weather_forecast") {
              latter_ui::parse_v3_weather_payload(sv_pay, latter_ui::weather_state());
            } else if (sv_dom == "calendar_agenda") {
              latter_ui::parse_v3_calendar_payload(sv_pay, latter_ui::calendar_state());
            }

# Publish device_hello over the bound System: RPC Outbox text_sensor once Home Assistant has subscribed
# to entity states (zero allow_service_calls privilege needed).
script:
  - id: send_device_hello
    mode: restart
    then:
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 30s
      - delay: 250ms
      - lambda: |-
          const std::string contract_str = std::to_string(latter_ui::kProtocolContractVersion);
          const std::string boot_str = std::to_string(latter_ui::device_boot_id());
          const std::string manifest_str = latter_ui::build_hardware_manifest_json();
          latter_rpc::emit(&id(latter_rpc_outbox), "device_hello", {
            {"contract", contract_str},
            {"boot_id", boot_str},
            {"manifest", manifest_str},
          });

time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time

text_sensor:
  - platform: template
    name: "System: Hardware Manifest"
    id: latter_hardware_manifest
    icon: "mdi:chip"
    entity_category: diagnostic
    update_interval: 300s
    lambda: 'return latter_ui::build_hardware_manifest_state_json();'

  - platform: template
    name: "System: RPC Outbox"
    id: latter_rpc_outbox
    icon: "mdi:swap-horizontal"
    entity_category: diagnostic
    update_interval: never
