# ==============================================================================
# Latter Core Module: Base Identity, Time Sync & Contract Handshake (modules/base.yaml)
# Shared foundation for headless companions, custom display templates, and
# full Latter display firmware (included by modules/system_core.yaml).
# ==============================================================================

substitutions:
  name: "latter-device"
  friendly_name: "Latter Device"
  version: "3.0.0"
  font_time_size: "77"
  font_chrono_size: "38"
  font_date_size: "27"
  font_btn_bold_size: "26"
  font_small_size: "21"
  font_micro_size: "14"
  font_games_size: "38"
  default_clock_face: "Minimal Digital"
  default_power_profile: "Portable Carry"
  api_reboot_timeout: "0s"
  api_outgoing_delay: "10s"
  sendspin_buffer_size: "196608"
  mww_internal_ram: "false"
  announcement_buffer_size: "65536"
  audio_out_rate: "48000"
  audio_out_channels: "1"
  audio_out_bits: "16"
  audio_in_rate: "16000"

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            latter_ui::ensure_persisted_prefs_loaded();
            latter_rpc::bind_sensor_sink(&id(latter_rpc_outbox));

# Client-initiated dial-back (outgoing_connection -> HA TCP :6054, Noise PSK verified on both sides):
# ESPHome 2026.11 only skips the 60 s default delay under USE_DEEP_SLEEP, whereas Latter battery
# hibernation calls esp_deep_sleep_start() / PMU power-off directly. A 10 s delay gives normal LAN mDNS
# inbound connects a clean head start (3-8 s) while dialing HA:6054 well inside the 30 s ha_link_settling
# light-sleep awake window on hibernation wake, off-site return, or mDNS-blocked VLANs.
api:
  reboot_timeout: ${api_reboot_timeout}
  batch_delay: 0ms
  encryption:
  outgoing_connection:
    delay: ${api_outgoing_delay}
  on_client_connected:
    then:
      - lambda: |-
          const bool is_ha = client_info.find("Home Assistant") != std::string::npos;
          if (is_ha) {
            latter_ui::reset_all_v3_rev_guards();
            latter_ui::reset_hello_sync_on_connect();
            latter_ui::mark_hello_in_flight(true, millis());
          }
          auto &rs = latter_ui::runtime_state();
          if (rs.on_ha_client_connected != nullptr) {
            rs.on_ha_client_connected(client_info, client_address);
          }
      - if:
          condition:
            lambda: 'return client_info.find("Home Assistant") != std::string::npos;'
          then:
            - script.execute: send_device_hello
  on_client_disconnected:
    then:
      - lambda: |-
          if (client_info.find("Home Assistant") != std::string::npos) {
            latter_ui::mark_hello_in_flight(false);
          }
          auto &rs = latter_ui::runtime_state();
          if (rs.on_ha_client_disconnected != nullptr) {
            rs.on_ha_client_disconnected(client_info);
          }
  actions:
    - action: latter_ping
      id: latter_ping_action
      then:
        - logger.log: "Latter companion connected"
        # Latter pings every bound Device once its RPC outbox listener is attached: answer with a fresh hello
        # unless on_client_connected already has send_device_hello in flight or just completed with clean prefs.
        - if:
            condition:
              lambda: |-
                const uint32_t now_ms = millis();
                if (!latter_ui::should_trigger_hello_on_ping(now_ms, latter_ui::persisted_prefs().dirty_mask)) {
                  return false;
                }
                latter_ui::mark_hello_in_flight(true, now_ms);
                return true;
            then:
              - script.execute: send_device_hello

    - action: latter_push_v3
      id: latter_push_v3_action
      variables:
        domain: string
        payload: string
      then:
        - lambda: |-
            const std::string_view sv_dom(domain.c_str(), domain.size());
            const std::string_view sv_pay(payload.c_str(), payload.size());
            const std::string prev_dock = latter_ui::area_ctx_state().dock_apps;
            bool parsed = false;
            if (sv_dom == "area_context") {
              parsed = latter_ui::parse_v3_area_ctx_payload(sv_pay, latter_ui::area_ctx_state(), latter_ui::home_hub_state());
            } else if (sv_dom == "active_media") {
              parsed = latter_ui::parse_v3_media_payload(sv_pay, latter_ui::media_state());
            } else if (sv_dom == "remote_config") {
              parsed = latter_ui::parse_v3_remote_payload(sv_pay, latter_ui::remote_state());
            } else if (sv_dom == "weather_forecast") {
              parsed = latter_ui::parse_v3_weather_payload(sv_pay, latter_ui::weather_state());
            } else if (sv_dom == "calendar_agenda") {
              parsed = latter_ui::parse_v3_calendar_payload(sv_pay, latter_ui::calendar_state());
            } else if (sv_dom == "device_prefs") {
              uint32_t eff_mask = 0;
              parsed = latter_ui::parse_v3_device_prefs_payload(sv_pay, eff_mask, millis());
              latter_ui::device_prefs_state().last_effects = eff_mask;
            }
            auto &rs = latter_ui::runtime_state();
            if (parsed && rs.on_v3_domain_pushed != nullptr) {
              rs.on_v3_domain_pushed(sv_dom, prev_dock);
            }

    - action: latter_device_command
      id: latter_device_command_action
      variables:
        command: string
      then:
        - lambda: |-
            const std::string_view sv_cmd(command.c_str(), command.size());
            auto &rs = latter_ui::runtime_state();
            if (rs.on_device_command != nullptr) {
              rs.on_device_command(sv_cmd);
            } else if (sv_cmd == "restart") {
              latter_ui::flush_persisted_prefs_if_dirty();
              App.safe_reboot();
            }

# Publish device_hello over the bound System: RPC Outbox text_sensor once Home Assistant has subscribed
# to entity states (zero allow_service_calls privilege needed).
script:
  - id: send_device_hello
    mode: restart
    then:
      - lambda: 'latter_ui::mark_hello_in_flight(true, millis());'
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 30s
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - delay: 250ms
            - lambda: |-
                const uint32_t now_ms = millis();
                latter_rpc::bind_sensor_sink(&id(latter_rpc_outbox));
                latter_actions::emit_device_hello();
                latter_actions::check_and_emit_timer_alarm_state(now_ms, true);
                latter_ui::mark_hello_sent(now_ms, latter_ui::persisted_prefs().dirty_mask);
          else:
            - lambda: 'latter_ui::mark_hello_in_flight(false);'

time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time

text_sensor:
  - platform: template
    name: "System: Hardware Manifest"
    id: latter_hardware_manifest
    icon: "mdi:chip"
    entity_category: diagnostic
    update_interval: 300s
    lambda: 'return latter_ui::build_hardware_manifest_state_json();'

  - platform: template
    name: "System: RPC Outbox"
    id: latter_rpc_outbox
    icon: "mdi:swap-horizontal"
    entity_category: diagnostic
    update_interval: never
