# ==============================================================================
# Latter Core Module: Base Identity, Time Sync & Contract Handshake (modules/base.yaml)
# ==============================================================================

substitutions:
  name: "latter-device"
  friendly_name: "Latter Device"
  version: "2.2.0"
  screen_w: "466"
  screen_h: "466"
  font_time_size: "77"
  font_chrono_size: "38"
  font_date_size: "27"
  font_btn_bold_size: "26"
  font_small_size: "21"
  font_micro_size: "14"
  font_games_size: "38"
  default_clock_face: "Minimal Digital"
  active_media_sensor: "sensor.latter_device_active_media"
  weather_forecast_sensor: "sensor.latter_device_weather_forecast"
  area_context_sensor: "sensor.latter_device_area_context"
  calendar_agenda_sensor: "sensor.latter_device_calendar_agenda"
  remote_config_sensor: "sensor.latter_device_remote_config"

api:
  actions:
    - action: latter_ping
      id: latter_ping_action
      then:
        - logger.log: "Latter companion connected"

time:
  - platform: homeassistant
    id: ha_time