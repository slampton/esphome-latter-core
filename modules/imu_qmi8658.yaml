# ==============================================================================
# Latter Core Module: QMI8658 6-Axis IMU Sensors & Shake Detector (modules/imu_qmi8658.yaml)
# Included by boards that have a physical QMI8658 IMU @ 0x6B (1.75C, 2.06, 2.16)
# ==============================================================================

motion:
  - platform: qmi8658
    id: imu
    address: 0x6B
    accelerometer_range: 4G
    gyroscope_range: 2048DPS
    update_interval: 100ms

sensor:
  - platform: motion
    motion_id: imu
    type: acceleration_x
    name: "Accel X"
    id: accel_x
    internal: true
  - platform: motion
    motion_id: imu
    type: acceleration_y
    name: "Accel Y"
    id: accel_y
    internal: true
  - platform: motion
    motion_id: imu
    type: acceleration_z
    name: "Accel Z"
    id: accel_z
    internal: true
  - platform: motion
    motion_id: imu
    type: roll
    name: "Roll"
    id: imu_roll
    internal: true
  - platform: motion
    motion_id: imu
    type: pitch
    name: "Pitch"
    id: imu_pitch
    internal: true

  - platform: qmi8658
    name: "IMU Temperature"
    id: imu_temp
    entity_category: diagnostic
    disabled_by_default: true
    filters:
      - throttle: 180s
      - delta: 1.5

  - platform: template
    name: "Dynamic Motion Delta"
    id: motion_mag
    unit_of_measurement: "g"
    accuracy_decimals: 3
    update_interval: 200ms
    internal: true
    lambda: |-
      if (id(display_power_state) != 0) {
        auto pw_mode = id(pickup_wake_mode).current_option();
        if (pw_mode == "Disabled" || (pw_mode == "Docked Only" && !id(usb_connected).state)) {
          return 0.0f;
        }
      }
      float x = id(accel_x).state;
      float y = id(accel_y).state;
      float z = id(accel_z).state;
      if (isnan(x) || isnan(y) || isnan(z)) return NAN;

      static float grav_x = 0.0f;
      static float grav_y = 0.0f;
      static float grav_z = 1.0f;
      const float alpha = 0.20f;
      grav_x = (1.0f - alpha) * grav_x + alpha * x;
      grav_y = (1.0f - alpha) * grav_y + alpha * y;
      grav_z = (1.0f - alpha) * grav_z + alpha * z;

      float dx = x - grav_x;
      float dy = y - grav_y;
      float dz = z - grav_z;
      float delta = sqrtf(dx*dx + dy*dy + dz*dz);
      float planar_dyn = sqrtf(dx*dx + dy*dy);

      if (id(gui_page) == 8 && id(display_power_state) == 0) {
        static uint32_t last_shake_time = 0;
        uint32_t now_m = millis();
        bool is_deliberate_shake = (planar_dyn >= 0.46f || delta >= 0.49f);
        if (is_deliberate_shake && (now_m - last_shake_time > 1200)) {
          last_shake_time = now_m;
          if (id(tools_subpage) == 8 && !latter_ui::coin_state().anim_active) {
            latter_ui::trigger_coin_flip(now_m, esp_random());
          } else if (id(tools_subpage) == 4 && !latter_ui::dice_state().anim_active) {
            latter_ui::trigger_dice_roll(now_m, esp_random(), esp_random());
          }
        }
      }
      return delta;
