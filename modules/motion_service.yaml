# ==============================================================================
# Latter Core Module: Generic Motion, Raise-to-Wake & Shake UX Service
# (modules/motion_service.yaml)
# Consumes hw_accel_{x,y,z} populated by any IMU HAL (e.g., imu_qmi8658.yaml)
# and drives pickup_detected, raise-to-wake, and Coin Flip / Dice shake UX.
# Zero chip-specific register writes; poller stops at boot when LATTER_HAS_IMU=0.
# ==============================================================================

esphome:
  on_boot:
    - priority: 840
      then:
        - lambda: |-
            auto &rs = latter_core::runtime_state();
            rs.on_motion_poller_changed = +[](bool enable) {
              if (enable) {
                id(motion_mag).start_poller();
              } else {
                id(motion_mag).stop_poller();
              }
            };
            rs.on_imu_wom_wake = +[](uint32_t now_wom) {
              if (latter_core::runtime_state().nav.display_power_state == 2) {
                latter_core::raise_wake_detector().arm_from_wom(now_wom);
              }
              id(apply_power_policy).execute();
            };
            #if !LATTER_HAS_IMU
            id(motion_mag).stop_poller();
            #endif

sensor:
  - platform: template
    name: "Dynamic Motion Delta"
    id: motion_mag
    unit_of_measurement: "g"
    accuracy_decimals: 3
    update_interval: 200ms
    internal: true
    lambda: |-
      #if !LATTER_HAS_IMU
      return NAN;
      #else
      auto &rs = latter_core::runtime_state();
      if (rs.nav.display_power_state != 0) {
        const std::string_view pw_mode = latter_core::pref_pickup_to_wake_cstr();
        if (pw_mode == "Disabled" || (pw_mode == "Docked Only" && !rs.hw_usb_connected)) {
          rs.hw_motion_mag = 0.0f;
          return 0.0f;
        }
      }
      const float x = rs.hw_accel_x;
      const float y = rs.hw_accel_y;
      const float z = rs.hw_accel_z;
      if (std::isnan(x) || std::isnan(y) || std::isnan(z)) {
        rs.hw_motion_mag = NAN;
        return NAN;
      }

      static float grav_x = 0.0f;
      static float grav_y = 0.0f;
      static float grav_z = 1.0f;
      static uint32_t last_grav_ms = 0;
      const uint32_t now_m = millis();
      if (last_grav_ms == 0U || (now_m - last_grav_ms > 600U)) {
        grav_x = x;
        grav_y = y;
        grav_z = z;
      } else {
        const float alpha = 0.20f;
        grav_x = (1.0f - alpha) * grav_x + alpha * x;
        grav_y = (1.0f - alpha) * grav_y + alpha * y;
        grav_z = (1.0f - alpha) * grav_z + alpha * z;
      }
      last_grav_ms = now_m;

      const float dx = x - grav_x;
      const float dy = y - grav_y;
      const float dz = z - grav_z;
      const float delta = sqrtf(dx * dx + dy * dy + dz * dz);
      const float planar_dyn = sqrtf(dx * dx + dy * dy);

      if (rs.nav.gui_page == latter_core::PageId::TOOLS && rs.nav.display_power_state == 0) {
        static uint32_t last_shake_time = 0;
        const bool is_deliberate_shake = (planar_dyn >= 0.46f || delta >= 0.49f);
        if (is_deliberate_shake && (now_m - last_shake_time > 1200U)) {
          last_shake_time = now_m;
          if (rs.nav.tools_subpage == latter_core::ToolsSubpage::COIN_FLIP && !latter_ui::coin_state().anim_active) {
            latter_ui::trigger_coin_flip(now_m, esp_random());
            latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
            latter_core::display_lifecycle().note_activity(now_m);
            latter_ui::schedule_anim_disp_update(&id(disp1));
          } else if (rs.nav.tools_subpage == latter_core::ToolsSubpage::DICE && !latter_ui::dice_state().anim_active) {
            latter_ui::trigger_dice_roll(now_m, esp_random(), esp_random());
            latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
            latter_core::display_lifecycle().note_activity(now_m);
            latter_ui::schedule_anim_disp_update(&id(disp1));
          }
        }
      }
      rs.hw_motion_mag = delta;
      return delta;
      #endif

binary_sensor:
  - platform: template
    name: "Pickup Detected"
    id: pickup_detected
    device_class: motion
    internal: true
    lambda: |-
      #if !LATTER_HAS_IMU
      latter_core::runtime_state().hw_pickup_detected = false;
      return false;
      #else
      static uint32_t last_active_time = 0;
      static bool is_active = false;
      auto &rs = latter_core::runtime_state();

      const std::string_view pw_mode = latter_core::pref_pickup_to_wake_cstr();
      if (pw_mode == "Disabled" || (pw_mode == "Docked Only" && !rs.hw_usb_connected)) {
        is_active = false;
        rs.hw_pickup_detected = false;
        return false;
      }

      // Wake-on-Motion armed: pollers are stopped and the IMU produces no data, so cached samples are stale.
      if (latter_core::imu_wom().armed) {
        is_active = false;
        rs.hw_pickup_detected = false;
        latter_core::raise_to_wake().reset();
        return false;
      }

      const float dyn = rs.hw_motion_mag;
      if (std::isnan(dyn)) {
        rs.hw_pickup_detected = false;
        return false;
      }

      // Dual-Threshold In-Hand Detection:
      // While screen is active, 0.068g maintains active hold in hand without false-triggering on desk/USB noise.
      // While screen is sleeping/standby, 0.15g requires a deliberate pickup motion to wake (0.22g if speaker is playing).
      float thresh = latter_core::get_pickup_motion_threshold(rs.nav.display_power_state == 0);
      if (rs.nav.display_power_state != 0 && rs.audio.speaker_enabled() && thresh < 0.22f) {
        thresh = 0.22f;
      }
      const uint32_t active_ms = (rs.nav.display_power_state == 0) ? 3000U : 2000U;
      const uint32_t now_ms = millis();

      // Screen off: orientation-qualified raise-to-wake (motion spike + screen settles face-up).
      // Screen on: plain motion keeps the in-hand hold alive.
      const bool triggered = (rs.nav.display_power_state != 0)
          ? latter_core::raise_to_wake().update(dyn, thresh, rs.hw_accel_x, rs.hw_accel_y, rs.hw_accel_z, now_ms)
          : (dyn > thresh);
      if (triggered) {
        is_active = true;
        last_active_time = now_ms;
      } else if (is_active) {
        if (now_ms - last_active_time >= active_ms) {
          is_active = false;
        }
      }
      rs.hw_pickup_detected = is_active;
      return is_active;
      #endif
    on_press:
      then:
        - if:
            condition:
              lambda: |-
                #if !LATTER_HAS_IMU
                return false;
                #else
                const auto &rs = latter_core::runtime_state();
                const std::string_view mode = latter_core::pref_pickup_to_wake_cstr();
                if (mode == "Disabled") return false;
                if (mode == "Docked Only" && !rs.hw_usb_connected) return false;
                return true;
                #endif
            then:
              - if:
                  condition:
                    lambda: 'return latter_core::runtime_state().nav.display_power_state != 0 || !id(display_brightness).current_values.is_on();'
                  then:
                    - lambda: 'latter_core::note_wake_reason(latter_core::WakeReason::RAISE);'
                    - script.execute: wake_to_active_state
                  else:
                    - if:
                        condition:
                          lambda: 'const auto &rs = latter_core::runtime_state(); return !rs.hw_usb_connected && !rs.audio.speaker_enabled();'
                        then:
                          - lambda: 'latter_core::display_lifecycle().note_activity(millis());'
    on_release:
      then:
        - if:
            condition:
              lambda: |-
                const auto &rs = latter_core::runtime_state();
                return rs.nav.display_power_state == 0 && !rs.hw_usb_connected && !rs.audio.speaker_enabled();
            then:
              - lambda: 'latter_core::display_lifecycle().note_activity(millis());'
