# ==============================================================================
# Latter Core Module: Protocol v3 UI Reducer, Device Commands & Touch Runtime Sync
# (modules/system_ui_sync.yaml)
# Consumes V3DomainEffects, DeviceCommandEffects::mark_dirty_full, and
# UiTouchRuntime host command bindings in the YAML module layer.
# ==============================================================================

script:
  - id: handle_v3_domain_pushed
    mode: single
    parameters:
      domain: string
    then:
      - lambda: |-
          const std::string_view sv_dom(domain.c_str(), domain.size());
          const uint32_t now_ms = millis();
          const auto &au = latter_core::runtime_state().audio;
          latter_core::V3ReduceContext ctx{};
          ctx.now_ms = now_ms;
          ctx.friendly_name = "${friendly_name}";
          ctx.local_mp_playing = au.local_mp_playing();
          ctx.local_mp_paused = au.local_mp_paused();
          ctx.local_album_art_w = au.local_album_art_w();
          ctx.remote_art_fetch_running = id(fetch_remote_art_debounced).is_running();
          ctx.last_touch_ms = latter_ui::touch_gesture().last_touch_ms;
          ctx.pin_pad_open = latter_ui::ui::pin_pad_state().open;

          const auto eff = latter_core::v3_domain_reducer().reduce(sv_dom, ctx);
          if (eff.wake_from_screensaver) {
            latter_core::note_wake_reason(latter_core::WakeReason::MEDIA);
            id(wake_to_active_state).execute();
          }
          if (eff.mark_dirty_full) {
            latter_ui::mark_dirty_full();
          }
          if (eff.fetch_area_browse) {
            const auto &rs = latter_core::runtime_state();
            const int page = rs.slot_page_for(latter_rpc::SlotChannel::AREA_ENTITIES);
            latter_core::emit_area_browse_entities(rs.area.active_area_id, rs.area.domain_filter, page, LATTER_CARD_SLOT_COUNT);
          }
          if (eff.fetch_on_demand_camera) {
            id(fetch_on_demand_camera).execute();
          }
          if (eff.apply_theme_preset) {
            id(apply_theme_preset).execute();
          }
          if (eff.alert_triggered) {
            au.preempt_va_for_alert_now();
            latter_core::note_wake_reason(latter_core::WakeReason::NOTIFY);
            id(wake_to_active_state).execute();
            if (eff.alert_sfx_id > 0) {
              au.play_sfx(eff.alert_sfx_id);
            }
            if (latter_core::runtime_state().cameras.doorbell_live_popup_active) {
              id(sync_camera_stream).execute();
            } else if (eff.fetch_alert_camera) {
              id(fetch_camera_snapshot).execute();
            } else if (eff.release_alert_camera_art) {
              latter_ui::release_art(id(camera_snapshot_art));
            }
          }
          if (eff.stop_wallpaper_fetch) {
            id(fetch_wallpaper_debounced).stop();
          }
          if (eff.release_wallpaper_art) {
            latter_ui::release_art(id(home_wallpaper_art));
          }
          if (eff.fetch_wallpaper) {
            id(fetch_wallpaper_debounced).execute();
          }
          if (eff.stop_screensaver_photo_fetch) {
            id(fetch_screensaver_photo_now).stop();
            id(fetch_screensaver_photo_debounced).stop();
            latter_core::runtime_state().music.screensaver_photo_failed = false;
          }
          if (eff.release_screensaver_photo_art) {
            latter_ui::release_art(id(screensaver_photo_art));
          }
          if (eff.fetch_screensaver_photo) {
            latter_core::runtime_state().music.screensaver_photo_failed = false;
            id(fetch_screensaver_photo_debounced).execute();
          }
          if (eff.weather_sim_dirty) {
            latter_ui::weather_sim_dirty() = true;
          }
          if (eff.reset_ambient_frame_ms) {
            latter_ui::record_ambient_frame_ms(0);
          }
          if (eff.sync_local_volume) {
            au.sync_local_volume(eff.local_volume_0_to_1, /*update_player=*/false, /*un_duck=*/false);
          }
          if (eff.stop_remote_art_fetch) {
            id(fetch_remote_art_debounced).stop();
          }
          if (eff.release_remote_art) {
            latter_ui::release_art(id(remote_album_art));
          }
          if (eff.fetch_remote_art && !eff.wake_from_screensaver) {
            id(fetch_remote_art_debounced).execute();
          }
          if (eff.fetch_music_lyrics) {
            latter_core::emit_music_lyrics_fetch("", "", now_ms);
          }
          if (eff.navigate_home_from_remote) {
            id(sync_ui_touch_runtime).execute();
            latter_ui::touch_engine().navigate_home(now_ms);
          } else if (eff.navigate_start_screen_remote) {
            id(sync_ui_touch_runtime).execute();
            latter_ui::touch_engine().navigate_to_start_screen(now_ms);
          }
          if (eff.sync_display_brightness) {
            latter_core::runtime_state().nav.ambient_bri_ramp_pending = eff.sync_display_brightness_smooth;
            id(sync_display_brightness).execute();
          }
          if (eff.ensure_anim_poller) {
            latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
          }
          if (eff.throttled_disp_update) {
            id(throttled_disp_update).execute();
          } else if (eff.schedule_disp_update) {
            latter_ui::schedule_disp_update(&id(disp1));
          }
          if (eff.apply_device_prefs_effects) {
            id(apply_device_prefs_effects).execute();
          }

  - id: handle_device_command
    mode: single
    parameters:
      command: string
    then:
      - lambda: |-
          const std::string_view sv_cmd(command.c_str(), command.size());
          #ifdef USE_LATTER_BEACON
          const bool ble_active = id(ble_ctrl).is_active();
          #else
          const bool ble_active = false;
          #endif
          const auto d = latter_core::evaluate_device_command(
              sv_cmd, millis(), id(display_brightness).current_values.is_on(),
              ble_active, "${name}", latter_ui::SCREEN_W, latter_ui::SCREEN_H);
          if (d.restart) id(restart_button).press();
          if (d.toggle_find_my) id(toggle_find_my_device).execute();
          if (d.activate_screensaver) id(trigger_screensaver_now).execute();
          if (d.dismiss_notification) id(dismiss_notification).execute();
          if (d.stop_alarm_sound) latter_core::runtime_state().audio.stop_alarm();
          if (d.wake_to_active) id(wake_to_active_state).execute();
          if (d.turn_screen_off) id(turn_screen_off).execute();
          if (d.sync_brightness) id(sync_display_brightness).execute();
          if (d.apply_power_policy) id(apply_power_policy).execute();
          #ifdef USE_LATTER_BEACON
          if (d.set_ble_prof_log) id(ble_ctrl).set_profile_logging(d.ble_prof_log_val);
          #else
          (void)d.set_ble_prof_log;
          #endif
          if (d.publish_device_telemetry) id(publish_device_telemetry).execute();
          if (d.publish_display_state) id(publish_display_state).execute();
          if (d.start_va) latter_core::runtime_state().audio.start_va_now();
          if (d.mark_dirty_full) latter_ui::mark_dirty_full();
          if (d.schedule_disp) latter_ui::schedule_disp_update(&id(disp1));
          if (d.forward_ui_cmd) id(dispatch_device_ui_command).execute(std::string(sv_cmd));

  - id: sync_ui_touch_runtime_fast
    mode: single
    then:
      - lambda: 'latter_ui::sync_touch_runtime_fast(id(display_brightness).current_values.is_on());'

  - id: sync_ui_touch_runtime
    mode: single
    then:
      - lambda: |-
          const auto &rs = latter_core::runtime_state();
          if (rs.nav.display_power_state == 0 && !rs.nav.is_hibernating) {
            latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
          }
          auto now_t = id(ha_time).now();
          if (!now_t.is_valid()) now_t = id(sntp_time).now();
          latter_ui::sync_touch_runtime_snapshot(
              "${friendly_name}", "${version}",
              latter_core::fw_update_latest_version(&id(latter_firmware_update)),
              id(display_brightness).current_values.is_on(), now_t);

          auto &rt = latter_ui::touch_engine().runtime();
          if (rt.exec_cmd == nullptr) {
            rt.theme_primary = &id(theme_primary);
            rt.theme_secondary = &id(theme_secondary);

            rt.exec_cmd = +[](latter_ui::UiHostCmd cmd, int arg0, int arg1) {
              using C = latter_ui::UiHostCmd;
              const auto &au = latter_core::runtime_state().audio;
              switch (cmd) {
                case C::SCHEDULE_DISP_UPDATE: latter_ui::schedule_disp_update(&id(disp1)); break;
                case C::SCHEDULE_BAND_DISP_UPDATE: latter_ui::schedule_band_disp_update(&id(disp1), arg0, arg1); break;
                case C::WAKE_TO_ACTIVE: id(wake_to_active_state).execute(); break;
                case C::APPLY_POWER_POLICY: id(apply_power_policy).execute(); break;
                case C::CANCEL_VOICE_ASSISTANT: au.cancel_va_now(); break;
                case C::ABORT_VOICE_ASSISTANT: au.abort_va_now(); break;
                case C::CYCLE_PRIMARY_WAKE_WORD: au.cycle_primary_ww(); break;
                case C::SYNC_WAKE_WORD_STATE: au.sync_wake_word(); break;
                case C::DISMISS_NOTIFICATION: id(dismiss_notification).execute(); break;
                case C::STOP_ALARM_SOUND: au.stop_alarm(); break;
                case C::SYNC_DISPLAY_BRIGHTNESS: id(sync_display_brightness).execute(); break;
                case C::FLASHLIGHT_FULL_BRIGHTNESS: {
                  const auto &rs_fl = latter_core::runtime_state();
                  if (rs_fl.showcase.is_active(millis()) && rs_fl.showcase.brightness_override_pct > 0U) {
                    id(sync_display_brightness).execute();
                  } else {
                    id(display_brightness).turn_on().set_brightness(1.0f).perform();
                  }
                  break;
                }
                case C::PAUSE_LOCAL_MEDIA_PLAYER: au.pause_local_mp_now(); break;
                case C::TOGGLE_HA_MUSIC: {
                  const auto hw_act = latter_core::media_toggle_playback(au.local_mp_playing(), millis());
                  if (hw_act == latter_core::LocalMediaHwAction::PauseLocalPlayer) {
                    au.pause_local_mp_now();
                  } else if (hw_act == latter_core::LocalMediaHwAction::StopLocalMww && au.mww_running()) {
                    au.stop_mww_now();
                  }
                  latter_ui::schedule_disp_update(&id(disp1));
                  break;
                }
                case C::CLEAR_HA_MUSIC_QUEUE: {
                  const bool stop_loc = latter_core::media_clear_queue(millis());
                  au.clear_local_track_meta_now();
                  if (stop_loc) {
                    au.stop_local_mp_now();
                  }
                  latter_ui::release_art(id(remote_album_art));
                  latter_ui::schedule_disp_update(&id(disp1));
                  break;
                }
                case C::MUSIC_STEP_VOLUME: {
                  const float new_vol = latter_core::media_step_volume(arg0, au.local_mp_volume_or(0.0f), millis(), true);
                  if (new_vol > 0.0f) {
                    au.sync_local_volume(new_vol, /*update_player=*/true, /*un_duck=*/true);
                  }
                  break;
                }
                case C::PLAY_MUSIC_SLOT:
                  if (latter_core::media_play_slot(arg0, millis()) && au.mww_running()) {
                    au.stop_mww_now();
                  }
                  latter_ui::schedule_disp_update(&id(disp1));
                  break;
                case C::FETCH_REMOTE_ART_DEBOUNCED: id(fetch_remote_art_debounced).execute(); break;
                case C::SPEAKER_TRANSFER_TO_TARGET:
                case C::SPEAKER_CONTROL_TARGET: {
                  const bool xfer = (cmd == C::SPEAKER_TRANSFER_TO_TARGET);
                  auto &m_spk = latter_core::runtime_state().music;
                  const std::string &cur_spk =
                      !m_spk.active_speaker_entity.empty() ? m_spk.active_speaker_entity
                                                           : latter_core::media_state().active_speaker;
                  const bool spk_changed =
                      !m_spk.target_speaker_id.empty() && (m_spk.target_speaker_id != cur_spk);
                  if (latter_core::speaker_activate_selected(xfer, au.local_mp_playing(), au.local_mp_paused(), millis())) {
                    au.mute_speaker_now();
                  }
                  if (!xfer && spk_changed) {
                    id(fetch_remote_art_debounced).stop();
                    latter_ui::release_art(id(remote_album_art));
                    m_spk.loaded_art_url.clear();
                  } else {
                    id(fetch_remote_art_debounced).execute();
                  }
                  latter_ui::schedule_disp_update(&id(disp1));
                  break;
                }
                case C::SPEAKER_JOIN_TARGET:
                  if (latter_core::speaker_join_target(millis()) && au.mww_running()) {
                    au.stop_mww_now();
                  }
                  latter_ui::schedule_disp_update(&id(disp1));
                  break;
                case C::SPEAKER_UNJOIN_TARGET:
                  latter_core::speaker_unjoin_target("${friendly_name}", millis());
                  latter_ui::release_art(id(remote_album_art));
                  latter_ui::schedule_disp_update(&id(disp1));
                  break;
                case C::TRIGGER_SCREENSAVER_NOW: id(trigger_screensaver_now).execute(); break;
                case C::START_HIBERNATION_COUNTDOWN: id(start_hibernation_countdown).execute(); break;
                case C::START_INSTANT_HIBERNATION:
                  latter_core::battery_model().hib_reason = latter_core::HibernateReason::KEY;
                  id(start_instant_hibernation).execute();
                  break;
                case C::TURN_SCREEN_OFF: id(turn_screen_off).execute(); break;
                case C::RESTART_DEVICE: id(restart_button).press(); break;
                case C::CHECK_FIRMWARE_UPDATE: id(check_firmware_update).execute(); break;
                case C::TRIGGER_FIRMWARE_UPDATE: id(trigger_firmware_update).execute(); break;
                case C::APPLY_THEME_PRESET: id(apply_theme_preset).execute(); break;
                case C::MENU_SCROLL_TRANSITION: id(menu_scroll_transition).execute(); break;
                case C::FETCH_ON_DEMAND_CAMERA: id(fetch_on_demand_camera).execute(); break;
                case C::RELEASE_CAMERA_ART: latter_ui::release_art(id(camera_snapshot_art)); break;
                case C::SYNC_CAMERA_STREAM: id(sync_camera_stream).execute(); break;
                case C::STOP_CAMERA_STREAM: id(stop_camera_stream).execute(); break;
                case C::STOP_DOORBELL_AUDIO: au.stop_doorbell_audio_now(); break;
                case C::START_DOORBELL_PTT: au.start_doorbell_ptt_now(); break;
                case C::START_CALENDAR_DICTATION: au.start_calendar_dictation_now(); break;
                case C::START_BROADCAST_DICTATION: au.start_broadcast_dictation_now(); break;
                case C::APPLY_DEVICE_PREFS_EFFECTS: id(apply_device_prefs_effects).execute(); break;
                case C::SET_LOCAL_SPEAKER_VOL_PCT: {
                  const float target_v = static_cast<float>(std::clamp(arg0, 10, 100)) * 0.01f;
                  au.sync_local_volume(target_v, /*update_player=*/true, /*un_duck=*/false);
                  const auto &rs_v = latter_core::runtime_state();
                  if (rs_v.nav.display_power_state == 0) {
                    if (!rs_v.nav.quick_actions_open &&
                        rs_v.nav.gui_page == latter_core::PageId::MUSIC &&
                        rs_v.music.view == latter_core::MusicView::AUDIO &&
                        rs_v.music.drilldown == latter_core::MusicDrilldown::NONE &&
                        rs_v.music.takeover == latter_core::MusicTakeover::NONE) {
                      int vy0 = 0, vy1 = 0;
                      latter_ui::music_volume_dirty_band(vy0, vy1);
                      latter_ui::schedule_band_disp_update(&id(disp1), vy0, vy1);
                    } else {
                      latter_ui::schedule_disp_update(&id(disp1));
                    }
                  }
                  break;
                }
                case C::ENSURE_UI_ANIM_POLLER:
                  if (latter_core::runtime_state().nav.display_power_state == 0) {
                    latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
                  }
                  break;
              }
            };
          }

  - id: apply_device_ui_command_effects
    mode: single
    parameters:
      cmd: string
      is_showcase_tick: bool
    then:
      - lambda: |-
          id(sync_ui_touch_runtime).execute();
          const uint32_t now_eff_ms = millis();
          const auto eff = is_showcase_tick
              ? latter_ui::touch_engine().tick_showcase(now_eff_ms)
              : latter_ui::touch_engine().execute_device_ui_command(cmd, now_eff_ms);
          if (!eff.handled) return;
          if (eff.dismiss_notification) {
            id(dismiss_notification).execute();
          }
          if (eff.apply_theme) {
            id(apply_theme_preset).execute();
          }
          if (eff.mark_dirty_full) {
            latter_ui::mark_dirty_full();
          }
          const auto &rs_eff = latter_core::runtime_state();
          if (eff.turn_screen_off) {
            id(turn_screen_off).execute();
          } else if (eff.enter_screensaver) {
            id(trigger_screensaver_now).execute();
          } else if (eff.wake_display) {
            latter_core::note_wake_reason(latter_core::WakeReason::NOTIFY);
            id(wake_to_active_state).execute();
          } else if (eff.refresh_screensaver_in_place && rs_eff.nav.display_power_state == 1) {
            if (eff.apply_power) id(apply_power_policy).execute();
            const auto &ac_ss = latter_core::area_ctx_state();
            const std::string_view ss_st =
                latter_core::effective_screensaver_style_cstr(latter_core::persisted_prefs(), rs_eff, now_eff_ms);
            const bool ss_has_art = latter_ui::has_screensaver_photo_frame_art(
                id(screensaver_photo_art).get_width() > 0, id(home_wallpaper_art).get_width() > 0,
                rs_eff, ac_ss);
            const bool defer_photo_frame =
                (ss_st == "Photo Frame") && !ac_ss.screensaver_photo_url.empty() && !ss_has_art;
            if (defer_photo_frame) {
              id(publish_display_state).execute();
              id(fetch_screensaver_photo_now).execute();
            } else {
              if (eff.sync_brightness) id(sync_display_brightness).execute();
              if (eff.fetch_screensaver_photo) id(fetch_screensaver_photo_now).execute();
              if (eff.schedule_disp) latter_ui::schedule_disp_update(&id(disp1));
            }
          } else {
            if (eff.apply_power) id(apply_power_policy).execute();
            if (eff.sync_brightness) id(sync_display_brightness).execute();
            if (eff.fetch_screensaver_photo) id(fetch_screensaver_photo_now).execute();
            if (eff.ensure_anim_poller && rs_eff.nav.display_power_state == 0) {
              latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
            }
            if (eff.schedule_disp && rs_eff.nav.display_power_state != 2) {
              latter_ui::schedule_disp_update(&id(disp1));
            }
          }

  - id: dispatch_device_ui_command
    mode: queued
    max_runs: 8
    parameters:
      cmd: string
    then:
      - lambda: |-
          id(apply_device_ui_command_effects).execute(cmd, false);

  - id: tick_showcase_engine
    mode: single
    then:
      - lambda: |-
          if (!latter_core::runtime_state().showcase.active) return;
          id(apply_device_ui_command_effects).execute("", true);

  - id: apply_device_prefs_effects
    mode: restart
    then:
      - lambda: |-
          const auto &rs = latter_core::runtime_state();
          const auto &p = latter_core::persisted_prefs();
          const uint32_t now_ms = millis();
          const auto act = latter_core::evaluate_device_prefs_effects(
              now_ms, latter_ui::touch_gesture().last_touch_ms, latter_ui::is_on_anchor_root(rs, p));
          if (act.sync_wake_word) rs.audio.sync_wake_word();
          if (act.media_idle_finish) rs.audio.media_idle_finish_now();
          if (act.apply_ww_sens) rs.audio.apply_ww_sensitivities();
          if (act.apply_theme_preset) id(apply_theme_preset).execute();
          if (act.wake_to_active) id(wake_to_active_state).execute();
          if (act.turn_screen_off) id(turn_screen_off).execute();
          if (act.enter_standby) id(enter_standby_state).execute();
          if (act.apply_power_policy) id(apply_power_policy).execute();
          if (act.sync_display_brightness) id(sync_display_brightness).execute();
          if (act.fetch_screensaver_photo) id(fetch_screensaver_photo_now).execute();
          if (act.navigate_to_start_screen) {
            id(sync_ui_touch_runtime).execute();
            latter_ui::touch_engine().navigate_to_start_screen(now_ms);
          }
          if (act.sync_camera_stream) id(sync_camera_stream).execute();
          if (act.weather_sim_dirty) {
            latter_ui::weather_sim_dirty() = true;
            latter_ui::record_ambient_frame_ms(0);
          }
          if (act.ensure_anim_poller) latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
          if (act.mark_dirty_full) latter_ui::mark_dirty_full();
          if (act.schedule_disp) latter_ui::schedule_disp_update(&id(disp1));

  - id: ui_input_event
    mode: queued
    parameters:
      action: string
      delta: int
    then:
      - lambda: |-
          id(sync_ui_touch_runtime).execute();
          latter_ui::touch_engine().on_input_event(action, delta, millis());

  - id: dismiss_notification
    mode: restart
    then:
      - script.stop: fetch_camera_snapshot
      - lambda: |-
          if (latter_core::dismiss_active_alert_banner(millis())) {
            latter_core::runtime_state().audio.resume_music_after_va_now();
          }
          latter_ui::release_art(id(camera_snapshot_art));
          latter_core::runtime_state().audio.sync_wake_word();
          latter_ui::schedule_disp_update(&id(disp1));

  - id: throttled_disp_update
    mode: restart
    then:
      - delay: 150ms
      - if:
          condition:
            lambda: |-
              const auto &rs = latter_core::runtime_state();
              return rs.nav.display_power_state == 0 &&
                     (rs.nav.gui_page == 1 || rs.nav.gui_page == 2) &&
                     !rs.voice.active;
          then:
            - lambda: |-
                const auto &rs = latter_core::runtime_state();
                if (rs.nav.gui_page == 1 && rs.nav.home_subpage == 0) {
                  latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
                }
                latter_ui::schedule_anim_disp_update(&id(disp1));

  - id: apply_theme_preset
    mode: restart
    then:
      - lambda: |-
          latter_ui::apply_effective_theme_preset(
              latter_core::runtime_state(), latter_core::persisted_prefs(), millis(),
              id(theme_primary), id(theme_secondary));
          if (latter_core::runtime_state().nav.display_power_state == 0) {
            latter_ui::schedule_disp_update(&id(disp1));
          }

  - id: sync_display_brightness
    mode: restart
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) now = id(sntp_time).now();
          const bool art_active = latter_ui::has_screensaver_photo_frame_art(
              id(screensaver_photo_art).get_width() > 0, id(home_wallpaper_art).get_width() > 0);
          const auto &cv = id(display_brightness).current_values;
          const auto plan = latter_core::evaluate_display_brightness_sync(
              millis(), now.is_valid(), now.is_valid() ? now.hour : 12,
              art_active, cv.is_on(), cv.get_brightness());
          if (plan.apply_call) {
            auto call = id(display_brightness).turn_on();
            call.set_brightness(plan.target_bri);
            call.set_transition_length(plan.transition_ms);
            call.perform();
          }
          id(publish_display_state).execute();

  - id: publish_display_state
    mode: restart
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) now = id(sntp_time).now();
          (void)latter_core::publish_display_state_if_changed(
              now.is_valid(), now.is_valid() ? now.hour : 12);

  - id: apply_default_start_page
    then:
      - lambda: |-
          id(sync_ui_touch_runtime).execute();
          latter_ui::touch_engine().navigate_to_start_screen(millis());

  - id: menu_scroll_transition
    mode: restart
    then:
      - lambda: |-
          latter_core::menu_scroll_start_ms() = millis();
          latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
          latter_ui::schedule_anim_disp_update(&id(disp1));
      - delay: !lambda 'return latter_ui::kMotionMs;'
      - lambda: |-
          latter_core::commit_menu_scroll_target();
          latter_ui::schedule_disp_update(&id(disp1));
