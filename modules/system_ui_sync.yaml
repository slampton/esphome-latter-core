# ==============================================================================
# Latter Core Module: Protocol v3 UI Reducer, Device Commands & Touch Runtime Sync
# (modules/system_ui_sync.yaml)
# Consumes V3DomainEffects, DeviceCommandEffects::mark_dirty_full, and
# UiTouchRuntime host command bindings in the YAML module layer.
# ==============================================================================

script:
  - id: handle_v3_domain_pushed
    mode: single
    parameters:
      domain: string
    then:
      - lambda: |-
          const std::string_view sv_dom(domain.c_str(), domain.size());
          const uint32_t now_ms = millis();
          const auto &au = latter_core::runtime_state().audio;
          latter_core::V3ReduceContext ctx{};
          ctx.now_ms = now_ms;
          ctx.friendly_name = "${friendly_name}";
          ctx.local_mp_playing = au.local_mp_playing();
          ctx.local_mp_paused = au.local_mp_paused();
          ctx.local_album_art_w = au.local_album_art_w();
          ctx.remote_art_fetch_running = id(fetch_remote_art_debounced).is_running();
          ctx.last_touch_ms = latter_ui::touch_gesture().last_touch_ms;
          ctx.pin_pad_open = latter_ui::ui::pin_pad_state().open;

          const auto eff = latter_core::v3_domain_reducer().reduce(sv_dom, ctx);
          (void)eff.area_changed;
          if (eff.wake_from_screensaver) {
            latter_core::note_wake_reason(latter_core::WakeReason::MEDIA);
            id(wake_to_active_state).execute();
          }
          if (eff.mark_dirty_full) {
            latter_ui::mark_dirty_full();
          }
          if (eff.fetch_area_browse) {
            const auto &rs = latter_core::runtime_state();
            const int page = rs.slot_page_for(latter_rpc::SlotChannel::AREA_ENTITIES);
            latter_core::emit_area_browse_entities(rs.area.active_area_id, rs.area.domain_filter, page, LATTER_CARD_SLOT_COUNT);
          }
          if (eff.fetch_on_demand_camera) {
            id(fetch_on_demand_camera).execute();
          }
          if (eff.apply_theme_preset) {
            id(apply_theme_preset).execute();
          }
          if (eff.alert_triggered) {
            au.preempt_va_for_alert_now();
            latter_core::note_wake_reason(latter_core::WakeReason::NOTIFY);
            id(wake_to_active_state).execute();
            if (eff.alert_sfx_id > 0) {
              au.play_sfx(eff.alert_sfx_id);
            }
            if (latter_core::runtime_state().cameras.doorbell_live_popup_active) {
              id(sync_camera_stream).execute();
            } else if (eff.fetch_alert_camera) {
              id(fetch_camera_snapshot).execute();
            } else if (eff.release_alert_camera_art) {
              latter_ui::release_art(id(camera_snapshot_art));
            }
          }
          if (eff.stop_wallpaper_fetch) {
            id(fetch_wallpaper_debounced).stop();
          }
          if (eff.release_wallpaper_art) {
            latter_ui::release_art(id(home_wallpaper_art));
          }
          if (eff.fetch_wallpaper) {
            id(fetch_wallpaper_debounced).execute();
          }
          if (eff.stop_screensaver_photo_fetch) {
            id(fetch_screensaver_photo_now).stop();
            id(fetch_screensaver_photo_debounced).stop();
            latter_core::runtime_state().music.screensaver_photo_failed = false;
          }
          if (eff.release_screensaver_photo_art) {
            latter_ui::release_art(id(screensaver_photo_art));
          }
          if (eff.fetch_screensaver_photo) {
            latter_core::runtime_state().music.screensaver_photo_failed = false;
            id(fetch_screensaver_photo_debounced).execute();
          }
          if (eff.weather_sim_dirty) {
            latter_ui::weather_sim_dirty() = true;
          }
          if (eff.reset_ambient_frame_ms) {
            latter_ui::record_ambient_frame_ms(0);
          }
          if (eff.sync_local_volume) {
            au.sync_local_volume(eff.local_volume_0_to_1, /*update_player=*/false, /*un_duck=*/false);
          }
          if (eff.stop_remote_art_fetch) {
            id(fetch_remote_art_debounced).stop();
          }
          if (eff.release_remote_art) {
            latter_ui::release_art(id(remote_album_art));
          }
          if (eff.fetch_remote_art && !eff.wake_from_screensaver) {
            id(fetch_remote_art_debounced).execute();
          }
          if (eff.fetch_music_lyrics) {
            latter_core::emit_music_lyrics_fetch("", "", now_ms);
          }
          if (eff.navigate_home_from_remote) {
            id(sync_ui_touch_runtime).execute();
            latter_ui::touch_engine().navigate_home(now_ms);
          } else if (eff.navigate_start_screen_remote) {
            id(sync_ui_touch_runtime).execute();
            latter_ui::touch_engine().navigate_to_start_screen(now_ms);
          }
          if (eff.sync_display_brightness) {
            latter_core::runtime_state().nav.ambient_bri_ramp_pending = eff.sync_display_brightness_smooth;
            id(sync_display_brightness).execute();
          }
          if (eff.ensure_anim_poller) {
            latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
          }
          if (eff.throttled_disp_update) {
            id(throttled_disp_update).execute();
          } else if (eff.schedule_disp_update) {
            latter_ui::schedule_disp_update(&id(disp1));
          }
          if (eff.apply_device_prefs_effects) {
            id(apply_device_prefs_effects).execute();
          }

  - id: handle_device_command
    mode: single
    parameters:
      command: string
    then:
      - lambda: |-
          const std::string_view sv_cmd(command.c_str(), command.size());
          const uint32_t now_ms = millis();
          if (sv_cmd == "restart") {
            id(restart_button).press();
          } else if (sv_cmd == "find_my") {
            id(toggle_find_my_device).execute();
          } else if (sv_cmd == "activate_screensaver") {
            id(trigger_screensaver_now).execute();
          } else if (sv_cmd == "deactivate_screensaver") {
            auto &r = latter_core::runtime_state();
            r.nav.last_pub_display_power_state = -1;
            if (r.nav.display_power_state != 0) {
              latter_core::note_wake_reason(latter_core::WakeReason::NOTIFY);
              id(wake_to_active_state).execute();
            } else {
              id(publish_display_state).execute();
            }
          } else if (sv_cmd == "wake_screen") {
            auto &r = latter_core::runtime_state();
            r.nav.last_pub_display_power_state = -1;
            if (r.nav.display_power_state != 0 || !id(display_brightness).current_values.is_on()) {
              latter_core::note_wake_reason(latter_core::WakeReason::NOTIFY);
              id(wake_to_active_state).execute();
            } else {
              id(sync_display_brightness).execute();
              id(publish_display_state).execute();
            }
          } else if (sv_cmd == "screen_off") {
            latter_core::runtime_state().nav.last_pub_display_power_state = -1;
            id(turn_screen_off).execute();
          } else if (sv_cmd.size() > 15U && sv_cmd.substr(0, 15) == "set_screen_bri:") {
            int parsed_pct = 0;
            bool ok_pct = true;
            const std::string_view pct_sv = sv_cmd.substr(15);
            for (char ch : pct_sv) {
              if (ch < '0' || ch > '9') {
                ok_pct = false;
                break;
              }
              parsed_pct = parsed_pct * 10 + (ch - '0');
              if (parsed_pct > 1000) break;
            }
            if (ok_pct && !pct_sv.empty()) {
              const int pct = std::clamp(parsed_pct, 1, 100);
              auto &r = latter_core::runtime_state();
              if (latter_core::persisted_prefs().auto_brightness_enum() ==
                  latter_core::AutoBrightnessMode::Disabled) {
                r.nav.ambient_bri_override_pct = -1;
                uint32_t bri_eff = 0U;
                (void)latter_core::record_local_pref_edit(
                    latter_core::PrefKey::MANUAL_BRIGHTNESS, std::to_string(pct), now_ms, bri_eff);
              } else {
                r.nav.ambient_bri_override_pct = static_cast<int8_t>(pct);
              }
              r.nav.last_pub_display_power_state = -1;
              r.nav.last_pub_display_bri_pct = -1;
              if (r.nav.display_power_state != 0 || !id(display_brightness).current_values.is_on()) {
                latter_core::note_wake_reason(latter_core::WakeReason::NOTIFY);
                id(wake_to_active_state).execute();
              } else {
                id(sync_display_brightness).execute();
              }
              id(publish_display_state).execute();
            }
          } else if (sv_cmd == "set_profiler_on") {
            latter_core::profiler_start(now_ms);
            id(ble_ctrl).set_profile_logging(true);
            auto &fr = latter_core::flight_recorder();
            fr.window_frames = 0;
            fr.window_render_us = 0;
            fr.max_render_us = 0;
            fr.slow_frames = 0;
            fr.last_summary_ms = now_ms;
            LATTER_PROF_LOGI("[PROF:START] Telemetry Profiler on for '${name}' (screen=%dx%d, auto_off=24h)",
                             latter_ui::SCREEN_W, latter_ui::SCREEN_H);
            latter_core::log_boot_summary();
            (void)latter_core::link_report_log_line(now_ms, latter_core::last_reset_reason());
            latter_core::log_heap_summary();
            const auto &r = latter_core::runtime_state();
            latter_core::log_power_and_mem_profile(
                "PROFILER_ON", r.nav.display_power_state, r.hw_usb_connected, r.hw_batt_charging,
                r.hw_batt_level, r.hw_batt_voltage, r.audio.speaker_enabled(),
                r.audio.mww_running(), r.voice.active,
                r.audio.local_mp_playing(),
                id(ble_ctrl).is_active(), r.nav.active_game, r.nav.sleep_start_time);
            id(publish_device_telemetry).execute();
          } else if (sv_cmd == "set_profiler_off") {
            LATTER_PROF_LOGI("[PROF:STOP] Telemetry Profiler off");
            latter_core::profiler_stop();
            id(ble_ctrl).set_profile_logging(false);
            id(publish_device_telemetry).execute();
          } else if (sv_cmd == "request_telemetry") {
            auto &r = latter_core::runtime_state();
            r.nav.last_pub_display_power_state = -1;
            r.nav.last_pub_display_bri_pct = -1;
            id(publish_device_telemetry).execute();
            id(publish_display_state).execute();
          } else if (sv_cmd == "trigger_va") {
            latter_core::runtime_state().audio.start_va_now();
          } else if (sv_cmd == "dismiss_ringing") {
            if (latter_core::runtime_state().alert.active) {
              id(dismiss_notification).execute();
            }
            const auto eff = latter_core::handle_device_cmd_dismiss_ringing(now_ms);
            if (eff.stop_sound) latter_core::runtime_state().audio.stop_alarm();
            if (eff.sync_brightness) id(sync_display_brightness).execute();
            if (eff.apply_power) id(apply_power_policy).execute();
            latter_core::display_lifecycle().note_activity(now_ms);
            if (latter_core::runtime_state().nav.display_power_state != 2) {
              if (eff.mark_dirty_full) latter_ui::mark_dirty_full();
              latter_ui::schedule_disp_update(&id(disp1));
            }
          } else if (sv_cmd == "cancel_timer") {
            const auto eff = latter_core::handle_device_cmd_cancel_timer(now_ms);
            if (eff.stop_sound) latter_core::runtime_state().audio.stop_alarm();
            if (eff.sync_brightness) id(sync_display_brightness).execute();
            if (eff.apply_power) id(apply_power_policy).execute();
            if (latter_core::runtime_state().nav.display_power_state != 2) {
              if (eff.mark_dirty_full) latter_ui::mark_dirty_full();
              latter_ui::schedule_disp_update(&id(disp1));
            }
          } else if (sv_cmd == "reset_stopwatch") {
            const auto eff = latter_core::handle_device_cmd_reset_stopwatch(now_ms);
            if (eff.apply_power) id(apply_power_policy).execute();
            if (latter_core::runtime_state().nav.display_power_state != 2) {
              if (eff.mark_dirty_full) latter_ui::mark_dirty_full();
              latter_ui::schedule_disp_update(&id(disp1));
            }
          } else if ((sv_cmd.size() > 4U && sv_cmd.substr(0, 4) == "nav:") ||
                     (sv_cmd.size() > 11U && sv_cmd.substr(0, 11) == "nav_silent:") ||
                     (sv_cmd.size() > 9U && sv_cmd.substr(0, 9) == "showcase:")) {
            id(dispatch_device_ui_command).execute(std::string(sv_cmd));
          }

  - id: sync_ui_touch_runtime_fast
    mode: single
    then:
      - lambda: |-
          const auto &rs = latter_core::runtime_state();
          auto &rt = latter_ui::touch_engine().runtime();
          rt.usb_connected = rs.hw_usb_connected;
          rt.panel_is_on = id(display_brightness).current_values.is_on();
          rt.local_mp_playing = rs.audio.local_mp_playing();
          rt.local_mp_volume = rs.audio.local_mp_volume_or(0.0f);

  - id: sync_ui_touch_runtime
    mode: single
    then:
      - lambda: |-
          const auto &rs = latter_core::runtime_state();
          if (rs.nav.display_power_state == 0 && !rs.nav.is_hibernating) {
            latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
          }
          auto &rt = latter_ui::touch_engine().runtime();
          rt.friendly_name = "${friendly_name}";
          rt.fw_version = "${version}";
          rt.fw_latest_version = latter_core::fw_update_latest_version(&id(latter_firmware_update));
          rt.usb_connected = rs.hw_usb_connected;
          rt.panel_is_on = id(display_brightness).current_values.is_on();
          rt.local_mp_playing = rs.audio.local_mp_playing();
          rt.local_mp_volume = rs.audio.local_mp_volume_or(0.0f);
          rt.album_art_w = rs.audio.local_album_art_w();
          rt.track_title = rs.music.last_sendspin_title;
          rt.track_artist = rs.music.last_sendspin_artist;
          rt.track_album = rs.music.last_sendspin_album;
          auto now_t = id(ha_time).now();
          if (!now_t.is_valid()) now_t = id(sntp_time).now();
          rt.time_valid = now_t.is_valid();
          rt.time_year = rt.time_valid ? now_t.year : 2026;
          rt.time_month = rt.time_valid ? now_t.month : 1;
          rt.time_day = rt.time_valid ? now_t.day_of_month : 1;
          rt.time_hour = rt.time_valid ? now_t.hour : -1;
          rt.time_minute = rt.time_valid ? now_t.minute : -1;
          rt.time_day_of_week = rt.time_valid ? now_t.day_of_week : -1;
          rt.time_epoch = rt.time_valid ? static_cast<uint32_t>(now_t.timestamp) : 0U;

          if (rt.exec_cmd == nullptr) {
            rt.theme_primary = &id(theme_primary);
            rt.theme_secondary = &id(theme_secondary);

            rt.exec_cmd = +[](latter_ui::UiHostCmd cmd, int arg0, int arg1) {
              using C = latter_ui::UiHostCmd;
              const auto &au = latter_core::runtime_state().audio;
              switch (cmd) {
                case C::SCHEDULE_DISP_UPDATE: latter_ui::schedule_disp_update(&id(disp1)); break;
                case C::SCHEDULE_BAND_DISP_UPDATE: latter_ui::schedule_band_disp_update(&id(disp1), arg0, arg1); break;
                case C::WAKE_TO_ACTIVE: id(wake_to_active_state).execute(); break;
                case C::APPLY_POWER_POLICY: id(apply_power_policy).execute(); break;
                case C::CANCEL_VOICE_ASSISTANT: au.cancel_va_now(); break;
                case C::ABORT_VOICE_ASSISTANT: au.abort_va_now(); break;
                case C::CYCLE_PRIMARY_WAKE_WORD: au.cycle_primary_ww(); break;
                case C::SYNC_WAKE_WORD_STATE: au.sync_wake_word(); break;
                case C::DISMISS_NOTIFICATION: id(dismiss_notification).execute(); break;
                case C::STOP_ALARM_SOUND: au.stop_alarm(); break;
                case C::SYNC_DISPLAY_BRIGHTNESS: id(sync_display_brightness).execute(); break;
                case C::FLASHLIGHT_FULL_BRIGHTNESS: {
                  const auto &rs_fl = latter_core::runtime_state();
                  if (rs_fl.showcase.is_active(millis()) && rs_fl.showcase.brightness_override_pct > 0U) {
                    id(sync_display_brightness).execute();
                  } else {
                    id(display_brightness).turn_on().set_brightness(1.0f).perform();
                  }
                  break;
                }
                case C::PAUSE_LOCAL_MEDIA_PLAYER: au.pause_local_mp_now(); break;
                case C::TOGGLE_HA_MUSIC: {
                  const auto hw_act = latter_core::media_toggle_playback(au.local_mp_playing(), millis());
                  if (hw_act == latter_core::LocalMediaHwAction::PauseLocalPlayer) {
                    au.pause_local_mp_now();
                  } else if (hw_act == latter_core::LocalMediaHwAction::StopLocalMww && au.mww_running()) {
                    au.stop_mww_now();
                  }
                  latter_ui::schedule_disp_update(&id(disp1));
                  break;
                }
                case C::CLEAR_HA_MUSIC_QUEUE: {
                  const bool stop_loc = latter_core::media_clear_queue(millis());
                  au.clear_local_track_meta_now();
                  if (stop_loc) {
                    au.stop_local_mp_now();
                  }
                  latter_ui::release_art(id(remote_album_art));
                  latter_ui::schedule_disp_update(&id(disp1));
                  break;
                }
                case C::MUSIC_STEP_VOLUME: {
                  const float new_vol = latter_core::media_step_volume(arg0, au.local_mp_volume_or(0.0f), millis(), true);
                  if (new_vol > 0.0f) {
                    au.sync_local_volume(new_vol, /*update_player=*/true, /*un_duck=*/true);
                  }
                  latter_ui::schedule_disp_update(&id(disp1));
                  break;
                }
                case C::PLAY_MUSIC_SLOT:
                  if (latter_core::media_play_slot(arg0, millis()) && au.mww_running()) {
                    au.stop_mww_now();
                  }
                  latter_ui::schedule_disp_update(&id(disp1));
                  break;
                case C::FETCH_REMOTE_ART_DEBOUNCED: id(fetch_remote_art_debounced).execute(); break;
                case C::SPEAKER_TRANSFER_TO_TARGET:
                case C::SPEAKER_CONTROL_TARGET: {
                  const bool xfer = (cmd == C::SPEAKER_TRANSFER_TO_TARGET);
                  auto &m_spk = latter_core::runtime_state().music;
                  const std::string &cur_spk =
                      !m_spk.active_speaker_entity.empty() ? m_spk.active_speaker_entity
                                                           : latter_core::media_state().active_speaker;
                  const bool spk_changed =
                      !m_spk.target_speaker_id.empty() && (m_spk.target_speaker_id != cur_spk);
                  if (latter_core::speaker_activate_selected(xfer, au.local_mp_playing(), au.local_mp_paused(), millis())) {
                    au.mute_speaker_now();
                  }
                  if (!xfer && spk_changed) {
                    id(fetch_remote_art_debounced).stop();
                    latter_ui::release_art(id(remote_album_art));
                    m_spk.loaded_art_url.clear();
                  } else {
                    id(fetch_remote_art_debounced).execute();
                  }
                  latter_ui::schedule_disp_update(&id(disp1));
                  break;
                }
                case C::SPEAKER_JOIN_TARGET:
                  if (latter_core::speaker_join_target(millis()) && au.mww_running()) {
                    au.stop_mww_now();
                  }
                  latter_ui::schedule_disp_update(&id(disp1));
                  break;
                case C::SPEAKER_UNJOIN_TARGET:
                  latter_core::speaker_unjoin_target("${friendly_name}", millis());
                  latter_ui::release_art(id(remote_album_art));
                  latter_ui::schedule_disp_update(&id(disp1));
                  break;
                case C::TRIGGER_SCREENSAVER_NOW: id(trigger_screensaver_now).execute(); break;
                case C::START_HIBERNATION_COUNTDOWN: id(start_hibernation_countdown).execute(); break;
                case C::START_INSTANT_HIBERNATION:
                  latter_core::battery_model().hib_reason = latter_core::HibernateReason::KEY;
                  id(start_instant_hibernation).execute();
                  break;
                case C::TURN_SCREEN_OFF: id(turn_screen_off).execute(); break;
                case C::RESTART_DEVICE: id(restart_button).press(); break;
                case C::CHECK_FIRMWARE_UPDATE: id(check_firmware_update).execute(); break;
                case C::TRIGGER_FIRMWARE_UPDATE: id(trigger_firmware_update).execute(); break;
                case C::APPLY_THEME_PRESET: id(apply_theme_preset).execute(); break;
                case C::MENU_SCROLL_TRANSITION: id(menu_scroll_transition).execute(); break;
                case C::FETCH_ON_DEMAND_CAMERA: id(fetch_on_demand_camera).execute(); break;
                case C::RELEASE_CAMERA_ART: latter_ui::release_art(id(camera_snapshot_art)); break;
                case C::SYNC_CAMERA_STREAM: id(sync_camera_stream).execute(); break;
                case C::STOP_CAMERA_STREAM: id(stop_camera_stream).execute(); break;
                case C::STOP_DOORBELL_AUDIO: au.stop_doorbell_audio_now(); break;
                case C::START_DOORBELL_PTT: au.start_doorbell_ptt_now(); break;
                case C::START_CALENDAR_DICTATION: au.start_calendar_dictation_now(); break;
                case C::START_BROADCAST_DICTATION: au.start_broadcast_dictation_now(); break;
                case C::APPLY_DEVICE_PREFS_EFFECTS: id(apply_device_prefs_effects).execute(); break;
                case C::NOTIFY_WEATHER_SIM_CHANGED:
                  latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
                  latter_ui::schedule_disp_update(&id(disp1));
                  break;
                case C::SET_LOCAL_SPEAKER_VOL_PCT: {
                  const float target_v = static_cast<float>(std::clamp(arg0, 10, 100)) * 0.01f;
                  au.sync_local_volume(target_v, /*update_player=*/true, /*un_duck=*/false);
                  if (latter_core::runtime_state().nav.display_power_state == 0) {
                    latter_ui::schedule_disp_update(&id(disp1));
                  }
                  break;
                }
                case C::ENSURE_UI_ANIM_POLLER:
                  if (latter_core::runtime_state().nav.display_power_state == 0) {
                    latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
                  }
                  break;
              }
            };
          }

  - id: apply_device_ui_command_effects
    mode: single
    parameters:
      cmd: string
      is_showcase_tick: bool
    then:
      - lambda: |-
          id(sync_ui_touch_runtime).execute();
          const uint32_t now_eff_ms = millis();
          const auto eff = is_showcase_tick
              ? latter_ui::touch_engine().tick_showcase(now_eff_ms)
              : latter_ui::touch_engine().execute_device_ui_command(cmd, now_eff_ms);
          if (!eff.handled) return;
          if (eff.dismiss_notification) {
            id(dismiss_notification).execute();
          }
          if (eff.apply_theme) {
            id(apply_theme_preset).execute();
          }
          if (eff.mark_dirty_full) {
            latter_ui::mark_dirty_full();
          }
          const auto &rs_eff = latter_core::runtime_state();
          if (eff.turn_screen_off) {
            id(turn_screen_off).execute();
          } else if (eff.enter_screensaver) {
            id(trigger_screensaver_now).execute();
          } else if (eff.wake_display) {
            latter_core::note_wake_reason(latter_core::WakeReason::NOTIFY);
            id(wake_to_active_state).execute();
          } else if (eff.refresh_screensaver_in_place && rs_eff.nav.display_power_state == 1) {
            if (eff.apply_power) id(apply_power_policy).execute();
            const auto &ac_ss = latter_core::area_ctx_state();
            const std::string_view ss_st =
                latter_core::effective_screensaver_style_cstr(latter_core::persisted_prefs(), rs_eff, now_eff_ms);
            const bool ss_has_art =
                (id(screensaver_photo_art).get_width() > 0 && !ac_ss.screensaver_photo_url.empty()) ||
                latter_ui::can_reuse_wallpaper_for_photo_frame(
                    ac_ss.screensaver_photo_url, rs_eff.music.loaded_wallpaper_url,
                    id(home_wallpaper_art).get_width() > 0);
            const bool defer_photo_frame =
                (ss_st == "Photo Frame") && !ac_ss.screensaver_photo_url.empty() && !ss_has_art;
            if (defer_photo_frame) {
              id(publish_display_state).execute();
              id(fetch_screensaver_photo_now).execute();
            } else {
              if (eff.sync_brightness) id(sync_display_brightness).execute();
              if (eff.fetch_screensaver_photo) id(fetch_screensaver_photo_now).execute();
              if (eff.schedule_disp) latter_ui::schedule_disp_update(&id(disp1));
            }
          } else {
            if (eff.apply_power) id(apply_power_policy).execute();
            if (eff.sync_brightness) id(sync_display_brightness).execute();
            if (eff.fetch_screensaver_photo) id(fetch_screensaver_photo_now).execute();
            if (eff.ensure_anim_poller && rs_eff.nav.display_power_state == 0) {
              latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
            }
            if (eff.schedule_disp && rs_eff.nav.display_power_state != 2) {
              latter_ui::schedule_disp_update(&id(disp1));
            }
          }

  - id: dispatch_device_ui_command
    mode: queued
    max_runs: 8
    parameters:
      cmd: string
    then:
      - lambda: |-
          id(apply_device_ui_command_effects).execute(cmd, false);

  - id: tick_showcase_engine
    mode: single
    then:
      - lambda: |-
          if (!latter_core::runtime_state().showcase.active) return;
          id(apply_device_ui_command_effects).execute("", true);

  - id: apply_device_prefs_effects
    mode: restart
    then:
      - lambda: |-
          const uint32_t eff = latter_core::device_prefs_state().last_effects;
          latter_core::device_prefs_state().last_effects = 0;
          const auto &rs = latter_core::runtime_state();
          const auto &p = latter_core::persisted_prefs();
          if (eff & latter_core::kPrefEffectWakeWordSync) {
            rs.audio.sync_wake_word();
            if (std::string_view(latter_core::pref_wake_word_mode_cstr(p)) == "Disabled" &&
                !rs.audio.local_mp_playing() &&
                !rs.voice.active) {
              rs.audio.media_idle_finish_now();
            }
          }
          if (eff & latter_core::kPrefEffectWakeWordSens) {
            rs.audio.apply_ww_sensitivities();
          }
          if (eff & latter_core::kPrefEffectThemePreset) {
            id(apply_theme_preset).execute();
          }
          if (eff & latter_core::kPrefEffectBrightness) {
            latter_core::runtime_state().nav.ambient_bri_override_pct = -1;
            id(sync_display_brightness).execute();
          }
          if (eff & latter_core::kPrefEffectScreensaverChange) {
            if (rs.nav.display_power_state == 1 && !p.bedtime_active) {
              if (!latter_core::screensaver_allowed_for_power(
                      p.screensaver_mode, LATTER_IS_STATIONARY != 0, rs.hw_usb_connected)) {
                #if LATTER_IS_STATIONARY
                id(wake_to_active_state).execute();
                #else
                id(turn_screen_off).execute();
                #endif
              } else {
                id(apply_power_policy).execute();
                id(sync_display_brightness).execute();
                if (std::string_view(latter_core::effective_screensaver_style_cstr(p, rs, millis())) == "Photo Frame" &&
                    !latter_core::area_ctx_state().screensaver_photo_url.empty()) {
                  latter_core::runtime_state().music.screensaver_photo_failed = false;
                  id(fetch_screensaver_photo_now).execute();
                }
                latter_ui::mark_dirty_full();
                latter_ui::schedule_disp_update(&id(disp1));
              }
            }
          }
          if (eff & latter_core::kPrefEffectBedtime) {
            const uint32_t now_bt_ms = millis();
            if (p.bedtime_active) {
              if (rs.nav.display_power_state == 1) {
                if (std::string_view(latter_core::pref_bedtime_display_cstr(p)) == "Screen Off") {
                  id(turn_screen_off).execute();
                } else {
                  id(sync_display_brightness).execute();
                  latter_ui::mark_dirty_full();
                  latter_ui::schedule_disp_update(&id(disp1));
                }
              } else if (rs.nav.display_power_state == 0 && !rs.nav.is_hibernating && !rs.nav.ota_in_progress) {
                id(sync_display_brightness).execute();
                const uint32_t last_t = latter_ui::touch_gesture().last_touch_ms;
                const bool untouched_15s = (last_t == 0U) || (now_bt_ms - last_t >= latter_core::kBedtimeIdleTimeoutMs);
                const bool busy_now = rs.voice.active || rs.audio.va_running() || rs.voice.tts_received ||
                                      rs.alarms.ringing || rs.timers.ringing || rs.alarms.find_my_active ||
                                      rs.alert.active || rs.stopwatch.running || (rs.nav.active_game != 0) ||
                                      latter_core::is_camera_view_active(rs) ||
                                      (rs.nav.gui_page == 8 && (rs.nav.tools_subpage == 5 || rs.nav.tools_subpage == 7));
                if (untouched_15s && !busy_now) {
                  id(enter_standby_state).execute();
                } else {
                  latter_core::display_lifecycle().note_activity(now_bt_ms);
                }
              }
            } else {
              #if LATTER_IS_STATIONARY
              if (rs.nav.display_power_state != 0 && !rs.nav.ota_in_progress) {
                id(wake_to_active_state).execute();
              } else {
                id(sync_display_brightness).execute();
              }
              #else
              if (rs.nav.display_power_state != 2 && !rs.nav.is_hibernating) {
                if (rs.nav.display_power_state == 1 &&
                    !latter_core::screensaver_allowed_for_power(
                        p.screensaver_mode, LATTER_IS_STATIONARY != 0, rs.hw_usb_connected)) {
                  id(turn_screen_off).execute();
                } else {
                  id(apply_power_policy).execute();
                  id(sync_display_brightness).execute();
                  if (rs.nav.display_power_state == 1 &&
                      std::string_view(latter_core::effective_screensaver_style_cstr(p, rs, millis())) == "Photo Frame" &&
                      !latter_core::area_ctx_state().screensaver_photo_url.empty()) {
                    latter_core::runtime_state().music.screensaver_photo_failed = false;
                    id(fetch_screensaver_photo_now).execute();
                  }
                }
              }
              #endif
            }
          }
          if (eff & latter_core::kPrefEffectSleepTimer) {
            if (rs.nav.display_power_state == 0) {
              latter_core::display_lifecycle().note_activity(millis());
            }
          }
          if (eff & latter_core::kPrefEffectPowerPolicy) {
            id(apply_power_policy).execute();
          }
          if (eff & latter_core::kPrefEffectNavPolicy) {
            const bool cam_busy = latter_core::cam_call_active() ||
                                  latter_core::cam_listen_active() ||
                                  latter_core::cam_intercom_ptt_active();
            if (!p.home_screen_enabled && !cam_busy && !latter_ui::is_on_anchor_root(rs, p)) {
              id(sync_ui_touch_runtime).execute();
              latter_ui::touch_engine().navigate_to_start_screen(millis());
            } else {
              latter_ui::mark_dirty_full();
            }
          }
          if ((eff & latter_core::kPrefEffectRedraw) && rs.nav.display_power_state != 2 && !rs.nav.is_hibernating) {
            if (latter_core::is_camera_view_active(rs) || (rs.alert.active && rs.cameras.doorbell_live_popup_active)) {
              id(sync_camera_stream).execute();
            }
            if (eff & latter_core::kPrefEffectWeatherSky) {
              latter_ui::weather_sim_dirty() = true;
              latter_ui::record_ambient_frame_ms(0);
            }
            if (rs.nav.display_power_state == 0) {
              latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
            }
            latter_ui::schedule_disp_update(&id(disp1));
          }

  - id: ui_input_event
    mode: queued
    parameters:
      action: string
      delta: int
    then:
      - lambda: |-
          id(sync_ui_touch_runtime).execute();
          latter_ui::touch_engine().on_input_event(action, delta, millis());

  - id: dismiss_notification
    mode: restart
    then:
      - script.stop: fetch_camera_snapshot
      - lambda: |-
          auto &rs = latter_core::runtime_state();
          auto &ab = rs.alert;
          ab.active = false;
          ab.camera_url = "";
          ab.camera_entity = "";
          ab.loaded_camera_url = "";
          rs.cameras.doorbell_live_popup_active = false;
          if (!latter_core::is_camera_view_active(rs)) {
            latter_core::video_client().stop();
          }
          if (rs.voice.resume_music_after && !rs.voice.active && !rs.voice.tts_received &&
              !rs.alarms.ringing && !rs.timers.ringing && !rs.alarms.find_my_active) {
            rs.audio.resume_music_after_va_now();
          }
      - lambda: |-
          latter_ui::release_art(id(camera_snapshot_art));
          const uint32_t now_ms = millis();
          latter_core::audio_arbitrator().arm_media_idle_debounce(now_ms);
          latter_core::runtime_state().audio.sync_wake_word();
          latter_core::display_lifecycle().note_activity(now_ms);
          latter_ui::schedule_disp_update(&id(disp1));

  - id: throttled_disp_update
    mode: restart
    then:
      - delay: 150ms
      - if:
          condition:
            lambda: |-
              const auto &rs = latter_core::runtime_state();
              return rs.nav.display_power_state == 0 &&
                     (rs.nav.gui_page == 1 || rs.nav.gui_page == 2) &&
                     !rs.voice.active;
          then:
            - lambda: |-
                const auto &rs = latter_core::runtime_state();
                if (rs.nav.gui_page == 1 && rs.nav.home_subpage == 0) {
                  latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
                }
                latter_ui::schedule_anim_disp_update(&id(disp1));

  - id: apply_theme_preset
    mode: restart
    then:
      - lambda: |-
          latter_ui::apply_effective_theme_preset(
              latter_core::runtime_state(), latter_core::persisted_prefs(), millis(),
              id(theme_primary), id(theme_secondary));
          if (latter_core::runtime_state().nav.display_power_state == 0) {
            latter_ui::schedule_disp_update(&id(disp1));
          }

  - id: sync_display_brightness
    mode: restart
    then:
      - lambda: |-
          auto &rs = latter_core::runtime_state();
          const uint32_t now_bri_ms = millis();
          if (rs.nav.display_power_state == 0 && rs.nav.standby_entered_ms != 0) {
            latter_core::note_wake_from_standby(now_bri_ms);
          } else if (rs.nav.display_power_state == 1 && rs.nav.standby_entered_ms == 0) {
            rs.nav.standby_entered_ms = (now_bri_ms != 0) ? now_bri_ms : 1U;
          }
          const auto &prefs = latter_core::persisted_prefs();
          const auto &ac_bri = latter_core::area_ctx_state();
          auto now = id(ha_time).now();
          if (!now.is_valid()) now = id(sntp_time).now();
          const bool smooth_ramp = rs.nav.ambient_bri_ramp_pending;
          rs.nav.ambient_bri_ramp_pending = false;
          const auto bri_tgt = latter_core::resolve_active_brightness_target(
              prefs, latter_core::weather_state().sun_state,
              now.is_valid(), now.is_valid() ? now.hour : 12,
              ac_bri.area_ambient_pct, rs.nav.ambient_bri_override_pct);
          float b_target = static_cast<float>(bri_tgt.pct) * 0.01f;
          if ((rs.nav.gui_page == 8 && rs.nav.tools_subpage == 5) || rs.alarms.find_my_active) {
            b_target = 1.00f;
          }

          if (rs.nav.display_power_state == 0 || rs.nav.display_power_state == 1) {
            const bool photo_frame_art_active =
                (id(screensaver_photo_art).get_width() > 0 && !ac_bri.screensaver_photo_url.empty()) ||
                latter_ui::can_reuse_wallpaper_for_photo_frame(
                    ac_bri.screensaver_photo_url, rs.music.loaded_wallpaper_url,
                    id(home_wallpaper_art).get_width() > 0);
            const float target_bri = latter_core::resolve_effective_panel_brightness(
                rs, prefs, b_target, photo_frame_art_active, now_bri_ms);
            const auto &cv = id(display_brightness).current_values;
            if (!cv.is_on() || std::fabs(cv.get_brightness() - target_bri) >= 0.005f) {
              auto call = id(display_brightness).turn_on();
              call.set_brightness(target_bri);
              call.set_transition_length((smooth_ramp && cv.is_on() && rs.nav.display_power_state == 0) ? 600U : 0U);
              call.perform();
            }
          }
          id(publish_display_state).execute();

  - id: publish_display_state
    mode: restart
    then:
      - lambda: |-
          if (!latter_core::link_state().ha_connected) return;
          auto &rs = latter_core::runtime_state();
          const auto &prefs = latter_core::persisted_prefs();
          auto now = id(ha_time).now();
          if (!now.is_valid()) now = id(sntp_time).now();
          const auto bri_tgt = latter_core::resolve_active_brightness_target(
              prefs, latter_core::weather_state().sun_state,
              now.is_valid(), now.is_valid() ? now.hour : 12,
              latter_core::area_ctx_state().area_ambient_pct,
              rs.nav.ambient_bri_override_pct);
          const int pwr = std::clamp<int>(rs.nav.display_power_state, 0, 2);
          const int bri_pct = std::clamp<int>(bri_tgt.pct, 1, 100);
          if (pwr == rs.nav.last_pub_display_power_state &&
              bri_pct == rs.nav.last_pub_display_bri_pct) {
            return;
          }
          rs.nav.last_pub_display_power_state = pwr;
          rs.nav.last_pub_display_bri_pct = bri_pct;
          latter_core::emit_display_state(pwr, bri_pct, pwr == 1);

  - id: apply_default_start_page
    then:
      - lambda: |-
          id(sync_ui_touch_runtime).execute();
          latter_ui::touch_engine().navigate_to_start_screen(millis());

  - id: menu_scroll_transition
    mode: restart
    then:
      - lambda: |-
          latter_core::menu_scroll_start_ms() = millis();
          latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
          latter_ui::schedule_anim_disp_update(&id(disp1));
      - delay: !lambda 'return latter_ui::kMotionMs;'
      - lambda: |-
          auto &rs = latter_core::runtime_state();
          rs.nav.menu_scroll_active = false;
          if (rs.nav.gui_page == 4 && rs.nav.system_menu_mode == 1) {
            rs.nav.sleep_menu_page = rs.nav.menu_scroll_target_page;
          } else if (rs.nav.gui_page == 4 && rs.nav.system_menu_mode == 2) {
            rs.nav.display_menu_page = rs.nav.menu_scroll_target_page;
          } else if (rs.nav.gui_page == 4 && rs.nav.system_menu_mode == 0) {
            rs.nav.system_dashboard_page = rs.nav.menu_scroll_target_page;
          } else if (rs.nav.gui_page == 2 && rs.music.view == latter_core::MusicView::SETTINGS) {
            rs.music.settings_page = rs.nav.menu_scroll_target_page;
          } else if (rs.nav.gui_page == 3 && rs.nav.active_game == 0) {
            const int g_cnt = latter_core::active_games_launcher_count(latter_core::device_prefs());
            rs.nav.game_carousel_idx =
                (g_cnt > 0) ? std::clamp(rs.nav.menu_scroll_target_page, 0, g_cnt - 1) : 0;
          } else if (rs.nav.gui_page == 8 && rs.nav.tools_subpage == 0) {
            const int t_pgs = std::max(1, latter_core::active_tools_launcher_page_count(latter_core::device_prefs()));
            rs.nav.tools_menu_page = std::clamp(rs.nav.menu_scroll_target_page, 0, t_pgs - 1);
          } else if (rs.nav.gui_page == latter_core::PageId::PINNED) {
            const int p_pgs = std::max(1, latter_core::pinned_total_pages());
            rs.nav.pinned_menu_page = std::clamp(rs.nav.menu_scroll_target_page, 0, p_pgs - 1);
          }
          latter_ui::schedule_disp_update(&id(disp1));
