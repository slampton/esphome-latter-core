# Core Subsystem: Display Engine, Lifecycle, Latter API Contract & UI Router

substitutions:
  device_slug: "latter_device"
  version: "2.2.1"
  screen_w: "466"
  screen_h: "466"
  font_time_size: "77"
  font_chrono_size: "38"
  font_date_size: "27"
  font_btn_bold_size: "26"
  font_small_size: "21"
  font_micro_size: "14"
  font_games_size: "38"
  art_resize: "${screen_w}x${screen_h}"
  art_shape: "square"
  default_start_app: "Home"
  default_clock_face: "Minimal Digital"
  default_art_mode: "Full Screen"
  default_screensaver_style: "Aurora Borealis"
  default_album_sort: "Alphabetical"
  default_artist_album_sort: "Oldest on Top"
  default_podcast_sort: "Newest on Top"
  api_reboot_timeout: "0s"
  initial_art_url: "http://homeassistant.local:8123/static/icons/favicon-192x192.png"
  sun_entity: "sun.sun"
  moon_entity: "sensor.moon_phase"
  local_player_id: "media_player.${device_slug}"
  firmware_update_entity: "update.${device_slug}_project_firmware"
  active_media_sensor: "sensor.${device_slug}_active_media"
  weather_entity: "sensor.${device_slug}_weather_forecast"
  weather_forecast_sensor: "${weather_entity}"
  area_context_sensor: "sensor.${device_slug}_area_context"
  calendar_agenda_sensor: "sensor.${device_slug}_calendar_agenda"
  remote_config_sensor: "sensor.${device_slug}_remote_config"
  remote_1_entity: "remote.none"
  remote_1_name: ""
  remote_2_entity: "remote.none"
  remote_2_name: ""
  remote_3_entity: "remote.none"
  remote_3_name: ""
  remote_4_entity: "remote.none"
  remote_4_name: ""

packages:
  latter_pipeline: !include display_pipeline.yaml
  latter_core_system: !include features/core_system.yaml
  latter_ui_controls: !include features/ui_controls.yaml
  latter_timers_intervals: !include features/timers_intervals.yaml
  latter_ha_subscriptions: !include features/ha_subscriptions.yaml
  latter_scripts_actions: !include features/scripts_actions.yaml
