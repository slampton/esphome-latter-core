# Core Subsystem: Display Engine, Lifecycle, Latter API Contract & UI Router

esphome:
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            uint32_t cal_val = pocket_ui::hal_calibrate_rtc();
            ESP_LOGI("rtc_cal", "Hardware RTC slow clock calibrated: %lu (Q19.12)", (unsigned long)cal_val);
            id(hal_release_deep_sleep_holds).execute();
            id(sleep_start_time) = millis();
            id(is_hibernating) = false;
            id(display_power_state) = 0; // ACTIVE
            esphome::voice_assistant::ensure_wake_words_restored(id(va));

    - priority: -100
      then:
        - safe_mode.mark_successful:
        - script.execute: hal_init_pmu_irq
        - lambda: 'esphome::voice_assistant::install_sendspin_mono_downmixer(id(sendspin_source));'
        - media_player.pause: pocket_music_player
        - online_image.release: remote_album_art
        - online_image.release: home_wallpaper_art
        - online_image.release: camera_snapshot_art
        - lambda: |-
            id(current_loaded_art_url) = "";
            id(current_loaded_wallpaper_url) = "";
            id(current_loaded_camera_url) = "";
        - audio_dac.set_volume:
            id: es8311_dac
            volume: 90%
        - audio_dac.mute_on: es8311_dac
        - script.execute: route_i2s_to_mic
        - switch.turn_off: speaker_enable
        - script.execute: apply_default_start_page
        - script.execute: apply_theme_preset
        - lambda: |-
            id(clock_face_digital) = (id(clock_face_style).current_option() == "Modern Digital (Bold)");
            id(is_24h_format) = (id(time_format_select).current_option() == "24-Hour");
            if (id(ha_latter_remote_slots_summary).state.empty()) {
              id(remote_slot_0_ent) = "${tv_remote_entity}";
              id(remote_slot_1_ent) = "${tv_remote_entity_2}";
              id(remote_slot_2_ent) = "${tv_remote_entity_3}";
              id(remote_slot_3_ent) = "${tv_remote_entity_4}";
              id(remote_slot_0_name) = pocket_ui::format_remote_entity_fallback(id(remote_slot_0_ent));
              id(remote_slot_1_name) = pocket_ui::format_remote_entity_fallback(id(remote_slot_1_ent));
              id(remote_slot_2_name) = pocket_ui::format_remote_entity_fallback(id(remote_slot_2_ent));
              id(remote_slot_3_name) = pocket_ui::format_remote_entity_fallback(id(remote_slot_3_ent));
            }
            if (id(remote_slot_0_name).empty()) id(remote_slot_0_name) = "TV Remote";
        - component.update: batt_level
        - lambda: |-
            if (!id(ble_room_beacon_switch).state) {
              id(ble_room_beacon_switch).publish_state(true);
            }
            esphome::voice_assistant::ensure_wake_words_restored(id(va), true);
            id(va_active_wake_word).publish_state(
                esphome::voice_assistant::wake_word_id_to_label(esphome::voice_assistant::last_persisted_ww1()));
            auto cur_vp = id(va_visual_profile).current_option();
            if (cur_vp == "Google" || cur_vp == "Original") {
              id(va_visual_profile).publish_state(cur_vp == "Google" ? "Gemini" : "Nebula");
            }
            if (pocket_ui::is_wrist_watch_board()) {
              static bool watch_pwr_seeded = false;
              if (!watch_pwr_seeded) {
                watch_pwr_seeded = true;
                if (id(pickup_wake_mode).current_option() == "Always On") {
                  id(pickup_wake_mode).publish_state("Docked Only");
                }
                if (id(display_off_timeout).current_option() == "30s") {
                  id(display_off_timeout).publish_state("15s");
                }
                if (id(hibernate_timeout_mode).current_option() == "15 min") {
                  id(hibernate_timeout_mode).publish_state("5 min");
                }
              }
            }
        - script.execute: apply_wake_word_sensitivities
        - script.execute: sync_display_brightness
        - script.execute: screen_sleep_timer

api:
  encryption:
  outgoing_connection:
  on_client_connected:
    then:
      - lambda: |-
          esphome::voice_assistant::on_api_client_authenticated(id(va), client_info, client_address);
  actions:
    - action: set_browse_slots
      variables:
        mode: string
        page: int
        total_pages: int
        has_prev: bool
        has_next: bool
        s1_name: string
        s1_id: string
        s1_type: string
        s1_active: bool
        s2_name: string
        s2_id: string
        s2_type: string
        s2_active: bool
        s3_name: string
        s3_id: string
        s3_type: string
        s3_active: bool
        s4_name: string
        s4_id: string
        s4_type: string
        s4_active: bool
        s5_name: string
        s5_id: string
        s5_type: string
        s5_active: bool
      then:
        - lambda: |-
            (void)has_prev; (void)has_next;
            if (mode == "room_areas" || mode == "areas") {
              id(room_area_page) = page;
              id(room_area_total_pages) = total_pages;
              id(room_area_1_name) = s1_name; id(room_area_1_id) = s1_id; id(room_area_1_active) = s1_active;
              id(room_area_2_name) = s2_name; id(room_area_2_id) = s2_id; id(room_area_2_active) = s2_active;
              id(room_area_3_name) = s3_name; id(room_area_3_id) = s3_id; id(room_area_3_active) = s3_active;
              id(room_area_4_name) = s4_name; id(room_area_4_id) = s4_id; id(room_area_4_active) = s4_active;
              id(room_area_5_name) = s5_name; id(room_area_5_id) = s5_id; id(room_area_5_active) = s5_active;
            } else if (mode == "calendar_agenda") {
              id(cal_browse_page) = page;
              id(cal_browse_total_pages) = total_pages;
              id(cal_slot_1_name) = s1_name; id(cal_slot_1_id) = s1_id; id(cal_slot_1_active) = s1_active;
              id(cal_slot_2_name) = s2_name; id(cal_slot_2_id) = s2_id; id(cal_slot_2_active) = s2_active;
              id(cal_slot_3_name) = s3_name; id(cal_slot_3_id) = s3_id; id(cal_slot_3_active) = s3_active;
              id(cal_slot_4_name) = s4_name; id(cal_slot_4_id) = s4_id; id(cal_slot_4_active) = s4_active;
              id(cal_slot_5_name) = s5_name; id(cal_slot_5_id) = s5_id; id(cal_slot_5_active) = s5_active;
            } else if (mode == "entities" || mode == "home") {
              id(room_browse_mode) = "entities";
              id(room_browse_page) = page;
              id(room_browse_total_pages) = total_pages;
              id(room_slot_1_name) = s1_name; id(room_slot_1_id) = s1_id; id(room_slot_1_type) = s1_type; id(room_slot_1_active) = s1_active; id(room_slot_1_level) = -1;
              id(room_slot_2_name) = s2_name; id(room_slot_2_id) = s2_id; id(room_slot_2_type) = s2_type; id(room_slot_2_active) = s2_active; id(room_slot_2_level) = -1;
              id(room_slot_3_name) = s3_name; id(room_slot_3_id) = s3_id; id(room_slot_3_type) = s3_type; id(room_slot_3_active) = s3_active; id(room_slot_3_level) = -1;
              id(room_slot_4_name) = s4_name; id(room_slot_4_id) = s4_id; id(room_slot_4_type) = s4_type; id(room_slot_4_active) = s4_active; id(room_slot_4_level) = -1;
              id(room_slot_5_name) = s5_name; id(room_slot_5_id) = s5_id; id(room_slot_5_type) = s5_type; id(room_slot_5_active) = s5_active; id(room_slot_5_level) = -1;
            } else {
              if (millis() - pocket_ui::last_music_page_req_ms() > 350U || page == id(music_browse_page)) {
                id(music_browse_page) = page;
              }
              id(music_browse_total_pages) = total_pages;
              id(slot_1_name) = s1_name; id(slot_1_id) = s1_id; id(slot_1_type) = s1_type; id(slot_1_active) = s1_active;
              id(slot_2_name) = s2_name; id(slot_2_id) = s2_id; id(slot_2_type) = s2_type; id(slot_2_active) = s2_active;
              id(slot_3_name) = s3_name; id(slot_3_id) = s3_id; id(slot_3_type) = s3_type; id(slot_3_active) = s3_active;
              id(slot_4_name) = s4_name; id(slot_4_id) = s4_id; id(slot_4_type) = s4_type; id(slot_4_active) = s4_active;
              id(slot_5_name) = s5_name; id(slot_5_id) = s5_id; id(slot_5_type) = s5_type; id(slot_5_active) = s5_active;
            }
            pocket_ui::schedule_disp_update(&id(disp1));

    - action: set_room_slots
      variables:
        mode: string
        page: int
        total_pages: int
        has_prev: bool
        has_next: bool
        s1_name: string
        s1_id: string
        s1_type: string
        s1_active: bool
        s1_level: int
        s2_name: string
        s2_id: string
        s2_type: string
        s2_active: bool
        s2_level: int
        s3_name: string
        s3_id: string
        s3_type: string
        s3_active: bool
        s3_level: int
        s4_name: string
        s4_id: string
        s4_type: string
        s4_active: bool
        s4_level: int
        s5_name: string
        s5_id: string
        s5_type: string
        s5_active: bool
        s5_level: int
      then:
        - lambda: |-
            (void)has_prev; (void)has_next;
            id(room_browse_mode) = mode;
            id(room_browse_page) = page;
            id(room_browse_total_pages) = total_pages;
            id(room_slot_1_name) = s1_name; id(room_slot_1_id) = s1_id; id(room_slot_1_type) = s1_type; id(room_slot_1_active) = s1_active; id(room_slot_1_level) = s1_level;
            id(room_slot_2_name) = s2_name; id(room_slot_2_id) = s2_id; id(room_slot_2_type) = s2_type; id(room_slot_2_active) = s2_active; id(room_slot_2_level) = s2_level;
            id(room_slot_3_name) = s3_name; id(room_slot_3_id) = s3_id; id(room_slot_3_type) = s3_type; id(room_slot_3_active) = s3_active; id(room_slot_3_level) = s3_level;
            id(room_slot_4_name) = s4_name; id(room_slot_4_id) = s4_id; id(room_slot_4_type) = s4_type; id(room_slot_4_active) = s4_active; id(room_slot_4_level) = s4_level;
            id(room_slot_5_name) = s5_name; id(room_slot_5_id) = s5_id; id(room_slot_5_type) = s5_type; id(room_slot_5_active) = s5_active; id(room_slot_5_level) = s5_level;
            pocket_ui::schedule_disp_update(&id(disp1));

    - action: set_timer
      variables:
        seconds: int
      then:
        - lambda: |-
            if (seconds > 0) {
              uint32_t now_t = millis();
              int slot = pocket_ui::upsert_voice_timer_slot("ha_action", "", seconds, seconds, true, now_t);
              pocket_ui::timer_view_slot() = slot + 1;
              pocket_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
              id(timer_ringing) = false;
              id(gui_page) = 8;
              id(stuff_subpage) = 1;
              id(wake_to_active_state).execute();
              pocket_ui::schedule_disp_update(&id(disp1));
              ESP_LOGI("timer", "Voice/HA Timer started for %d seconds in slot %d", (int)seconds, slot + 1);
            }

    - action: cancel_timer
      then:
        - lambda: |-
            auto *slots = pocket_ui::timer_slots();
            for (int i = 0; i < 3; i++) {
              slots[i].running = false;
              slots[i].paused = false;
              slots[i].remaining_sec = slots[i].duration_sec;
            }
            pocket_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
            id(timer_ringing) = false;
            id(stop_alarm_sound).execute();
            pocket_ui::schedule_disp_update(&id(disp1));
            ESP_LOGI("timer", "Voice/HA Timers cancelled");

    - action: show_notification
      variables:
        title: string
        message: string
        priority: string
        duration: int
        chime: bool
        camera_url: string
      then:
        - lambda: |-
            id(notif_title) = std::string(title).empty() ? "Notification" : std::string(title);
            id(notif_message) = std::string(message);
            id(notif_priority) = std::string(priority).empty() ? "normal" : std::string(priority);
            int dur_s = (duration > 0) ? duration : 10;
            if (dur_s < 3) dur_s = 3;
            if (dur_s > 60) dur_s = 60;
            id(notif_duration_ms) = static_cast<uint32_t>(dur_s) * 1000U;
            id(notif_start_ms) = millis();
            id(notif_camera_url) = std::string(camera_url);
            id(notif_active) = true;
            id(wake_to_active_state).execute();
            if (chime && !id(va_active) && !id(va_tts_received)) {
              int sfx = (id(notif_priority) == "critical" || id(notif_priority) == "warning") ? 9 : 6;
              id(play_game_sfx).execute(sfx);
            }
            if (!id(notif_camera_url).empty() && id(notif_camera_url) != "none" &&
                id(notif_camera_url) != "unknown" && id(notif_camera_url) != "unavailable") {
              id(fetch_camera_snapshot).execute();
            } else {
              id(current_loaded_camera_url) = "";
              id(camera_snapshot_art).release();
            }
            pocket_ui::schedule_disp_update(&id(disp1));

ota:
  - platform: esphome
    on_begin:
      then:
        - script.stop: screen_sleep_timer
        - lambda: |-
            id(ota_in_progress) = true;
            id(ota_progress_pct) = 0;
            id(sleep_start_time) = 0;
            pocket_ui::screen_is_off_standby() = false;
            id(display_power_state) = 0;
            id(disp1).start_poller();
            id(hal_release_deep_sleep_holds).execute();
            pocket_ui::hal_set_display_brightness(&id(disp1), 230);
        - light.turn_on:
            id: display_brightness
            brightness: 90%
        - component.update: disp1
    on_progress:
      then:
        - lambda: |-
            int pct = static_cast<int>(x);
            if (pct != id(ota_progress_pct) && (pct == 100 || pct - id(ota_progress_pct) >= 2 || pct < id(ota_progress_pct))) {
              id(ota_progress_pct) = pct;
              id(disp1).update();
            }
    on_end:
      then:
        - lambda: |-
            id(ota_progress_pct) = 100;
            id(disp1).update();
            id(ota_in_progress) = false;

  - platform: http_request
    id: ota_http
    on_begin:
      then:
        - script.stop: screen_sleep_timer
        - lambda: |-
            id(ota_in_progress) = true;
            id(ota_progress_pct) = 0;
            id(sleep_start_time) = 0;
            pocket_ui::screen_is_off_standby() = false;
            id(display_power_state) = 0;
            id(disp1).start_poller();
            id(hal_release_deep_sleep_holds).execute();
            pocket_ui::hal_set_display_brightness(&id(disp1), 230);
        - light.turn_on:
            id: display_brightness
            brightness: 90%
        - component.update: disp1
    on_progress:
      then:
        - lambda: |-
            int pct = static_cast<int>(x);
            if (pct != id(ota_progress_pct) && (pct == 100 || pct - id(ota_progress_pct) >= 2 || pct < id(ota_progress_pct))) {
              id(ota_progress_pct) = pct;
              id(disp1).update();
            }
    on_end:
      then:
        - lambda: |-
            id(ota_progress_pct) = 100;
            id(disp1).update();
            id(ota_in_progress) = false;

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - lambda: |-
            if (id(display_power_state) == 0 && !id(is_hibernating)) {
              pocket_ui::record_ambient_frame_ms(0);
            }


