script:
  - id: pause_all_music
    mode: restart
    then:
      - lambda: |-
          bool local_active = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          bool remote_active = (!id(active_speaker_entity).empty() && (id(active_speaker_entity) != "${local_player_id}") && (id(ha_target_state).state == "playing"));
          if (local_active || remote_active) {
            id(va_resume_music_after) = true;
          }
          ESP_LOGI("audio", "pause_all_music: local=%d, remote=%d -> va_resume_music_after=%d", local_active, remote_active, id(va_resume_music_after));
      - if:
          condition:
            lambda: 'return id(va_resume_music_after);'
          then:
            - media_player.pause: pocket_music_player
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 50
                duration: 0.1s
            - homeassistant.action:
                action: latter.media_command
                data:
                  target_device: "${name}"
                  command: "pause"

  - id: resume_music_after_va
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(va_resume_music_after);'
          then:
            - script.execute: mp_idle_debounce
            - lambda: |-
                id(va_resume_music_after) = false;
                ESP_LOGI("audio", "resume_music_after_va: restoring playback for %s (cancelled=%d)", id(active_speaker_entity).c_str(), id(va_was_cancelled));
            - if:
                condition:
                  lambda: 'return !id(active_speaker_entity).empty() && (id(active_speaker_entity) != "${local_player_id}");'
                then:
                  - lambda: |-
                      id(va_was_cancelled) = false;
                      if (id(display_power_state) == 0 && id(ble_room_beacon_switch).state && !id(ble_ctrl).is_active() && !id(ble_ctrl).is_failed()) {
                        id(ble_ctrl).enable();
                      }
                  - homeassistant.action:
                      action: latter.media_command
                      data:
                        target_device: "${name}"
                        command: "play"
                  - audio_dac.mute_on: es8311_dac
                  - script.execute: route_i2s_to_mic
                  - script.execute: sync_wake_word_state
                else:
                  - script.execute: route_i2s_to_spk
                  - switch.turn_on: speaker_enable
                  - if:
                      condition:
                        lambda: 'return !id(alarm_ringing) && !id(timer_ringing) && !id(find_my_active);'
                      then:
                        - mixer_speaker.apply_ducking:
                            id: media_mixing_input
                            decibel_reduction: !lambda 'float v = id(pocket_music_player).volume; return (std::isnan(v) || v <= 0.05f) ? 26.0f : (v >= 1.0f ? 0.0f : -20.0f * std::log10(v));'
                            duration: 0.5s
                        - mixer_speaker.apply_ducking:
                            id: announcement_mixing_input
                            decibel_reduction: 50
                            duration: 0.1s
                  # Dispatch play via latter.media_command so it never double-triggers with the media_play interceptor
                  - homeassistant.action:
                      action: latter.media_command
                      data:
                        target_device: "${name}"
                        command: "play"
                  # If VA was terminated early, keep es8311_dac muted for 700ms while Sendspin
                  # handshakes so any residual TTS audio inside physical_speaker's 1000ms buffer
                  # drains completely silently instead of playing a 0.4s burst before music starts
                  - if:
                      condition:
                        lambda: 'return id(va_was_cancelled);'
                      then:
                        - lambda: 'id(va_was_cancelled) = false;'
                        - delay: 700ms
                  - audio_dac.mute_off: es8311_dac
          else:
            - lambda: |-
                id(va_was_cancelled) = false;
                if (id(display_power_state) == 0 && id(ble_room_beacon_switch).state && !id(ble_ctrl).is_active() && !id(ble_ctrl).is_failed()) {
                  id(ble_ctrl).enable();
                }
            - audio_dac.mute_on: es8311_dac
            - script.execute: route_i2s_to_mic
            - script.execute: sync_wake_word_state
  - id: fetch_remote_art_debounced
    mode: restart
    then:
      - delay: 650ms
      - if:
          condition:
            lambda: |-
              return (id(active_speaker_entity) != "${local_player_id}") &&
                     (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          then:
            - wait_until:
                condition:
