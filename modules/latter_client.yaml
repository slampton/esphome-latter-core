            - lambda: |-
                std::string base_map_u = pocket_ui::cal_detail_map_url();
                if (base_map_u.empty()) {
                  const std::string &w_url = id(ha_latter_wallpaper_url).state;
                  const std::string &c_url = id(ha_latter_camera_snapshot_url).state;
                  const std::string &a_url = id(ha_target_art_url).state;
                  auto extract_origin = [](const std::string &u) -> std::string {
                    if (u.rfind("http://", 0) == 0 || u.rfind("https://", 0) == 0) {
                      size_t p = u.find('/', 8);
                      if (p != std::string::npos) return u.substr(0, p);
                    }
                    return "";
                  };
                  std::string orig = extract_origin(c_url);
                  if (orig.empty()) orig = extract_origin(w_url);
                  if (orig.empty()) orig = extract_origin(a_url);
                  base_map_u = orig + "/api/latter/map/${name}?w=${screen_w}&h=${screen_h}&shape=${art_shape}&q=" +
                               pocket_ui::url_encode_query(pocket_ui::cal_detail_location());
