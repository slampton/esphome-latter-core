interval:
  - interval: 5min
    then:
      - script.execute: sync_display_brightness
  - interval: 60min
    then:
      - lambda: |-
          // Priority 1: Periodic thermal drift compensation for RTC slow clock
          extern uint32_t rtc_clk_cal(int cal_clk, uint32_t slow_clk_cycles) __asm__("rtc_clk_cal");
          uint32_t cal_val = rtc_clk_cal(0, 1024);
          ESP_LOGD("rtc_cal", "Periodic RTC slow clock calibration: %lu", (unsigned long)cal_val);

  - interval: 50ms
    then:
      - lambda: |-
          // 20 FPS high-refresh animation & physics loop for Tools Suite (Stopwatch, Dice Roll, Bubble Level, Coin Flip)
          // Coalesced against disp1's 1s background refresh via last_ambient_anim_ms() (>= 42ms gap)
          if (id(display_brightness).current_values.is_on() && id(display_power_state) == 0 && id(gui_page) == 8 && !id(va_active) && id(va_status_text).empty()) {
            if ((id(stuff_subpage) == 3 && id(stopwatch_running)) ||
                (id(stuff_subpage) == 4 && id(dice_anim_active)) ||
                (id(stuff_subpage) == 7) ||
                (id(stuff_subpage) == 8 && id(coin_anim_active))) {
              if (millis() - pocket_ui::last_ambient_anim_ms() >= 42U) {
                pocket_ui::schedule_disp_update(&id(disp1));
                pocket_ui::record_ambient_frame_ms(millis());
              }
            }
          }

          // 20 FPS high-refresh physics loop exclusively for active games (coalesced against 1s timer)
          if (id(display_brightness).current_values.is_on() && id(display_power_state) == 0 && id(gui_page) == 3 && id(active_game) > 0 && !id(va_active) && id(va_status_text).empty()) {
            if (millis() - pocket_ui::last_ambient_anim_ms() >= 42U) {
              pocket_ui::schedule_disp_update(&id(disp1));
              pocket_ui::record_ambient_frame_ms(millis());
            }
          }

          // 20 FPS Audio-Aware Fluid Voice Assistant Loop (All 5 Profiles):
          // - Listening & Thinking: Full 20 FPS (42ms cadence, coalesced with 50ms timer)
          // - Speaking (TTS FLAC playback): 75ms (~13.3 FPS, matching should_step_ambient_anim audio cadence)
          if (id(va_active) || !id(va_status_text).empty()) {
            static uint32_t last_va_anim_time = 0;
            static bool prev_tts_active = false;
            uint32_t now_va_ms = millis();

            const bool tts_audio_active =
                (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING) ||
                id(announcement_mixing_input).is_running();
            if (id(va_active) && id(va_tts_received) && tts_audio_active) {
              esphome::voice_assistant::disarm_va_speaker_timeout(id(va));
            }

            // Smooth state transition: reserve 1 quiet tick when speech starts so DAC unmutes cleanly
            if (id(va_tts_received) != prev_tts_active) {
              prev_tts_active = id(va_tts_received);
              last_va_anim_time = now_va_ms;
              return;
            }

            if (now_va_ms - last_va_anim_time >= 42U) {
              last_va_anim_time = now_va_ms;
              pocket_ui::schedule_disp_update(&id(disp1));
              pocket_ui::record_ambient_frame_ms(millis());
            }
          }

          // Dynamic Atmospheric Motion Wallpaper with Universal Audio-Aware Cadence
          // - Unlocks full 20 FPS (50ms) when local music is idle for rain, snow, lightning, and night starfield
          // - Paces smoothly at ~13.3 FPS (75ms) when local Sendspin music is playing
          // - Static daytime weather conditions run on the default 1s display refresh with near-zero CPU load
          const bool weather_sim_active = (id(weather_sim_condition).current_option() != "Live (Home Assistant)");
          if (id(display_brightness).current_values.is_on() && id(display_power_state) == 0 && (id(gui_page) == 1 && id(home_subpage) == 0 && (id(home_weather_bg_switch).state || weather_sim_active || pocket_ui::is_wake_greeting_fading(millis(), id(home_wake_greeting_switch).state) || pocket_ui::is_home_activity_carousel_animating(millis()))) && !id(va_active) && id(va_status_text).empty()) {
            static uint32_t last_cond_eval_time = 0;
            static bool cached_has_motion = false;
            uint32_t now_w_ms = millis();
            const bool sim_just_changed = pocket_ui::weather_sim_dirty() ||
                                          (pocket_ui::last_ambient_anim_ms() == 0U) ||
                                          pocket_ui::is_wake_greeting_fading(now_w_ms, id(home_wake_greeting_switch).state) ||
                                          pocket_ui::is_home_activity_carousel_animating(now_w_ms);

            if (sim_just_changed || (now_w_ms - last_cond_eval_time >= 250U)) {
              pocket_ui::weather_sim_dirty() = false;
              last_cond_eval_time = now_w_ms;
              std::string c_cond = id(ha_weather_condition).state;
              if ((c_cond.empty() || c_cond == "unknown" || c_cond == "unavailable") &&
                  !id(ha_weather_condition_fallback).state.empty()) {
                c_cond = id(ha_weather_condition_fallback).state;
              }
              std::string s_sun = id(ha_sun_state).state;
              bool is_night_time = (s_sun == "below_horizon" || c_cond == "clear-night" || c_cond == "clearnight" || (c_cond.find("night") != std::string::npos));
              apply_weather_sim_override(std::string(id(weather_sim_condition).current_option()), c_cond, is_night_time);
              cached_has_motion = pocket_ui::has_weather_motion(c_cond, is_night_time, now_w_ms);
            }

            const bool touch_busy = pocket_ui::touch_gesture().active ||
                                    (now_w_ms - pocket_ui::touch_gesture().last_touch_ms < 220U);
            if (!touch_busy && (sim_just_changed || cached_has_motion)) {
              const bool local_music_playing =
                  (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
              if (sim_just_changed || pocket_ui::should_step_ambient_anim(now_w_ms, local_music_playing,
                                                      id(va_active) || !id(va_status_text).empty(),
                                                      id(alarm_ringing) || id(timer_ringing))) {
                pocket_ui::schedule_disp_update(&id(disp1));
                pocket_ui::record_ambient_frame_ms(millis());
              }
            }
          }

  - interval: 250ms
    then:
      - lambda: |-
          // ------------------------------------------------------------------
          // 3-SLOT COUNTDOWN TIMER TICK & ALERT TRIGGER
          // ------------------------------------------------------------------
          if (id(timer_running)) {
            uint32_t now_ms = millis();
            auto *slots = pocket_ui::timer_slots();
            bool any_expired = false;
            std::string exp_name = "";
            bool sec_changed = false;

            for (int i = 0; i < 3; i++) {
              if (!slots[i].running) continue;
              if (now_ms >= slots[i].target_ms) {
                slots[i].running = false;
                slots[i].paused = false;
                slots[i].remaining_sec = slots[i].duration_sec; // Preserve duration for 1-tap reuse!
                exp_name = slots[i].name;
                any_expired = true;
              } else {
                int rem = static_cast<int>((slots[i].target_ms - now_ms + 999U) / 1000U);
                if (rem != slots[i].remaining_sec) {
                  slots[i].remaining_sec = rem;
                  sec_changed = true;
                }
              }
            }

            pocket_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));

            if (any_expired) {
              if (id(va_active) || !id(va_status_text).empty()) {
                id(cancel_voice_assistant).execute();
              }
              if (id(home_subpage) == 2) {
                id(home_subpage) = 0;
              }
              id(va_timer_name) = exp_name;
              id(timer_ringing) = true;
              id(wake_to_active_state).execute();
              id(play_alarm_sound).execute();
              ESP_LOGI("timer", "Countdown timer expired! Firing alert.");
            } else if (sec_changed) {
              if (!id(va_active) && id(va_status_text).empty()) {
                if (((id(gui_page) == 8 && id(stuff_subpage) == 1) || (id(gui_page) == 1 && (id(home_subpage) == 0 || id(home_subpage) == 2))) && id(display_power_state) == 0) {
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
              }
            }
          }

          // 60-second safety auto-stop for Find My Pocket Assistant beacon
          if (id(find_my_active) && (millis() - id(find_my_start_ms) >= 60000U)) {
            id(find_my_active) = false;
            id(stop_alarm_sound).execute();
            id(sync_display_brightness).execute();
            pocket_ui::schedule_disp_update(&id(disp1));
            id(screen_sleep_timer).execute();
          }

          // Auto-timeout & critical pulse refresh for active Latter push notifications / camera popups
          if (id(notif_active)) {
            if (millis() - id(notif_start_ms) >= id(notif_duration_ms)) {
              id(dismiss_notification).execute();
            } else if (id(notif_priority) == "critical" && id(display_power_state) == 0 &&
                       !id(va_active) && id(va_status_text).empty()) {
              pocket_ui::schedule_disp_update(&id(disp1));
            }
          }

          // Periodic display refresh during active alarm, timer, or Find My Device ringing
          if ((id(alarm_ringing) || id(timer_ringing) || id(find_my_active)) && id(display_power_state) == 0) {
            if (!id(va_active) && id(va_status_text).empty()) {
              pocket_ui::schedule_disp_update(&id(disp1));
            }
          }

          // Active Update Check state transition refresh (Page 4, Mode 5)
          if (id(gui_page) == 4 && id(system_menu_mode) == 5 && id(update_check_state) > 0 && !id(va_active) && id(va_status_text).empty()) {
            uint32_t dt_upd = millis() - id(update_check_timer);
            if ((id(update_check_state) == 1 && dt_upd > 1500U) || (id(update_check_state) == 2 && dt_upd > 3500U)) {
              pocket_ui::schedule_disp_update(&id(disp1));
            }
          }

          // Music Overlay HUD Auto-Dismissal (5.0s timeout in Full Screen / Letterbox)
          if (id(gui_page) == 2 && id(music_overlay_mode) == 0 && id(music_hud_active)) {
            if (millis() - id(music_hud_timer) >= 5000U) {
              id(music_hud_active) = false;
              pocket_ui::schedule_disp_update(&id(disp1));
            }
          }


  - interval: 1s
    then:
      - lambda: |-
          // ------------------------------------------------------------------
          // ALARM ENGINE: SCHEDULE EVALUATION & SNOOZE CHECK
          // ------------------------------------------------------------------
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            uint32_t now_epoch = now.timestamp;

            // 1. Snooze expiration check
            if (id(alarm_snooze_until) > 0 && now_epoch >= id(alarm_snooze_until)) {
              id(alarm_snooze_until) = 0;
              id(alarm_ringing) = true;
              id(wake_to_active_state).execute();
              id(play_alarm_sound).execute();
              pocket_ui::schedule_disp_update(&id(disp1));
              ESP_LOGI("alarm", "Snoozed alarm firing now!");
              return;
            }

            // 2. Regular scheduled alarms check (on second == 0)
            if (now.second == 0 && now.minute != id(alarm_last_fired_min)) {
              auto check_alarm = [&](int a_hr, int a_min, bool a_en, int a_rec, int a_num) -> bool {
                if (!a_en) return false;
                if (now.hour != a_hr || now.minute != a_min) return false;
                // Recurrence: 0=Daily, 1=Weekdays, 2=Weekends, 3=Once
                // ESPHome ESPTime::day_of_week: 1=SUN, 2=MON, ..., 6=FRI, 7=SAT
                if (a_rec == 1) { // Weekdays
                  if (now.day_of_week < 2 || now.day_of_week > 6) return false;
                } else if (a_rec == 2) { // Weekends
                  if (now.day_of_week != 1 && now.day_of_week != 7) return false;
                }
                return true;
              };

              bool triggered = false;
              int trig_idx = 0;
              if (check_alarm(id(alarm1_hour), id(alarm1_minute), id(alarm1_enabled), id(alarm1_recurrence), 1)) {
                triggered = true;
                trig_idx = 1;
                if (id(alarm1_recurrence) == 3) id(alarm1_enabled) = false; // Once: auto-disable
              } else if (check_alarm(id(alarm2_hour), id(alarm2_minute), id(alarm2_enabled), id(alarm2_recurrence), 2)) {
                triggered = true;
                trig_idx = 2;
                if (id(alarm2_recurrence) == 3) id(alarm2_enabled) = false; // Once: auto-disable
              } else if (check_alarm(id(alarm3_hour), id(alarm3_minute), id(alarm3_enabled), id(alarm3_recurrence), 3)) {
                triggered = true;
                trig_idx = 3;
                if (id(alarm3_recurrence) == 3) id(alarm3_enabled) = false; // Once: auto-disable
              }

              if (triggered) {
                if (id(va_active) || !id(va_status_text).empty()) {
                  id(cancel_voice_assistant).execute();
                }
                id(alarm_last_fired_min) = now.minute;
                id(alarm_ringing) = true;
                id(alarm_ringing_idx) = trig_idx;
                id(wake_to_active_state).execute();
                id(play_alarm_sound).execute();
                pocket_ui::schedule_disp_update(&id(disp1));
                ESP_LOGI("alarm", "Alarm %d triggered! Ringing started.", trig_idx);
              }
            }
          }



