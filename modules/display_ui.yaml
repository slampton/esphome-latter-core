                      id(fetch_calendar_browse).execute();
                      pocket_ui::schedule_disp_update(&id(disp1));
                    }
                  }
                  return;
                }
                if (touch.y <= 78 && touch.x >= 110 && touch.x <= 356) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    pocket_ui::cal_quick_add_open() = true;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                if (id(cal_slot_1_name).empty() && touch.y >= 190 && touch.y <= 255 && touch.x >= 85 && touch.x <= 381) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    pocket_ui::cal_quick_add_open() = true;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                // Event Row Tap on Agenda List is handled on_release so vertical swiping never opens an event by mistake
                return;
              } else if (id(stuff_subpage) == 10) {
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(stuff_subpage) = 0;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                int slot_idx = get_5slot_index(touch, 88, 378);
                if (slot_idx >= 0 && slot_idx <= 4 && (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON)) {
                  last_stuff_tap = now_stuff;
                  static constexpr const char *kIntercomPresets[5] = {
                    "Dinner is ready!",
                    "Time to head out!",
                    "Kids, please come downstairs!",
                    "Could use a hand in here!",
                    "Movie time in the Living Room!"
                  };
                  id(intercom_message_str) = kIntercomPresets[slot_idx];
                  id(intercom_feedback_str) = std::string("Sent: ") + kIntercomPresets[slot_idx];
                  id(intercom_feedback_ms) = now_stuff;
                  id(send_intercom_broadcast).execute();
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
              } else if (id(stuff_subpage) == 11) {
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(stuff_subpage) = 0;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                int slot_idx = get_5slot_index(touch, 88, 378);
                if (slot_idx >= 0 && slot_idx <= 4 && (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON)) {
                  last_stuff_tap = now_stuff;
                  std::string slots[5], names[5], acts[5];
                  pocket_ui::parse_custom_bindings_summary(id(ha_latter_custom_bindings_summary).state, slots, names, acts);
                  id(macro_target_slot) = slots[slot_idx];
                  id(macro_feedback_str) = std::string("Triggered: ") + names[slot_idx];
                  id(macro_feedback_ms) = now_stuff;
                  id(trigger_latter_macro).execute();
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
              } else if (id(stuff_subpage) == 12) {
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(stuff_subpage) = 0;
                    id(camera_snapshot_art).release();
                    id(sync_wake_word_state).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_SCROLL) {
                  last_stuff_tap = now_stuff;
                  id(fetch_on_demand_camera).execute();
                  pocket_ui::schedule_disp_update(&id(disp1));
