                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                }
              } else if (id(gui_page) == 6 && id(room_subpage) == 2 && gest.last_y < 404) {
                // Commit Light Color Wheel or White Kelvin / Brightness Inspector Action on Release!
                if (gest.max_travel < 24 && tp.y <= 68 && tp.x >= 110 && tp.x <= 356) {
                  pocket_ui::light_insp_mode() = (pocket_ui::light_insp_mode() == 0) ? 1 : 0;
                  pocket_ui::schedule_disp_update(&id(disp1));
                } else if (pocket_ui::light_insp_mode() == 0) {
                  int dx_w = tp.x - pocket_ui::SCREEN_CX;
                  int dy_w = tp.y - 212;
                  float dist_w = std::sqrt(static_cast<float>(dx_w * dx_w + dy_w * dy_w));
                  if (dist_w >= 44.0f && dist_w <= 154.0f) {
                    float hue = std::atan2(static_cast<float>(dy_w), static_cast<float>(dx_w)) * (180.0f / 3.14159265f);
                    if (hue < 0.0f) hue += 360.0f;
                    float sat = std::max(0.35f, std::min(1.0f, 0.35f + ((dist_w - 66.0f) / 68.0f) * 0.65f));
                    pocket_ui::light_insp_hue_deg() = hue;
                    pocket_ui::light_insp_sat() = sat;
                    esphome::Color c = pocket_ui::hsv_to_rgb(hue / 360.0f, sat, 1.0f);
                    uint32_t rgb_v = (static_cast<uint32_t>(c.r) << 16) | (static_cast<uint32_t>(c.g) << 8) | static_cast<uint32_t>(c.b);
                    pocket_ui::room_color_hex_param() = pocket_ui::format_hex_rgb(rgb_v); id(room_target_code) = pocket_ui::room_color_hex_param();
                    id(room_target_entity_id) = pocket_ui::light_insp_entity_id();
                    id(room_target_action) = "set_color";
                    id(room_target_level) = pocket_ui::light_insp_bri_pct();
                    id(execute_room_action).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                } else {
                  if (gest.start_y >= 120 && gest.start_y <= 204 && tp.x >= 84 && tp.x <= 382) {
                    int k_val = 2700 + ((tp.x - 92) * (6500 - 2700)) / 264;
                    pocket_ui::light_insp_kelvin() = std::max(2700, std::min(6500, (k_val / 100) * 100));
                    id(room_target_entity_id) = pocket_ui::light_insp_entity_id();
                    id(room_target_action) = "set_kelvin";
                    id(room_target_level) = pocket_ui::light_insp_kelvin();
                    id(execute_room_action).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  } else if (gest.start_y >= 218 && gest.start_y <= 298 && tp.x >= 84 && tp.x <= 382) {
                    int b_val = ((tp.x - 85) * 100) / 296;
                    pocket_ui::light_insp_bri_pct() = std::max(5, std::min(100, ((b_val + 2) / 5) * 5));
                    id(room_target_entity_id) = pocket_ui::light_insp_entity_id();
                    id(room_target_action) = "set_level";
                    id(room_target_level) = pocket_ui::light_insp_bri_pct();
                    id(execute_room_action).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                }
              } else if (!gest.swipe_committed && id(gui_page) == 6 && gest.last_y > 88 && gest.last_y < 404) {
                if (gest.max_travel < 24) {
                  if (is_right_chevron_zone(tp) && id(room_subpage) != 2 && ((id(room_subpage) == 1 && id(room_area_total_pages) > 1) || (id(room_subpage) == 0 && id(room_browse_total_pages) > 1))) {
                    int delta = (tp.y < 215) ? -1 : 1;
                    if (id(room_subpage) == 1 && id(room_area_total_pages) > 1) {
                      int next_pg = std::max(1, std::min(id(room_area_total_pages), id(room_area_page) + delta));
                      if (next_pg != id(room_area_page)) {
                        id(room_area_page) = next_pg;
                        id(fetch_room_areas_browse).execute();
                        pocket_ui::schedule_disp_update(&id(disp1));
                      }
                    } else if (id(room_subpage) == 0 && id(room_browse_total_pages) > 1) {
                      int next_pg = std::max(1, std::min(id(room_browse_total_pages), id(room_browse_page) + delta));
                      if (next_pg != id(room_browse_page)) {
                        id(room_browse_page) = next_pg;
                        id(fetch_room_browse).execute();
                        pocket_ui::schedule_disp_update(&id(disp1));
                      }
                    }
                  } else if (id(room_subpage) == 0 && tp.y >= 324 && tp.y <= 398 && tp.x >= 70 && tp.x <= 396) {
                    std::string cats[7];
                    int cat_cnt = pocket_ui::collect_room_categories(id(room_show_all_category_switch).state, cats);
                    int win_xs[4] = {0, 0, 0, 0};
                    bool dummy_l = false, dummy_r = false;
                    pocket_ui::get_home_dock_window_xs(cat_cnt, pocket_ui::room_cat_dock_page(), pocket_ui::SCREEN_CX, win_xs, dummy_l, dummy_r);
                    int start_idx = pocket_ui::get_home_dock_start_index(cat_cnt, pocket_ui::room_cat_dock_page());
                    int vis_count = std::min(4, cat_cnt - start_idx);
                    int best_i = -1;
                    int best_dist = (vis_count < 4) ? 50 : 42;
                    for (int i = 0; i < vis_count; i++) {
                      int d = std::abs(tp.x - win_xs[i]);
                      if (d < best_dist) {
                        best_dist = d;
                        best_i = i;
                      }
                    }
                    if (best_i >= 0) {
                      std::string new_flt = cats[start_idx + best_i];
                      if (id(room_domain_filter) != new_flt) {
                        id(room_domain_filter) = new_flt;
                        id(room_browse_mode) = "entities";
                        id(room_browse_page) = 1;
                        id(fetch_room_browse).execute();
                        pocket_ui::schedule_disp_update(&id(disp1));
                      }
                    }
                  } else if (id(room_subpage) == 1) {
                    int slot_idx = get_5slot_index(tp, 75, 385);
                    if (slot_idx >= 0) {
                      std::string s_name = (slot_idx == 0) ? id(room_area_1_name) : (slot_idx == 1) ? id(room_area_2_name) : (slot_idx == 2) ? id(room_area_3_name) : (slot_idx == 3) ? id(room_area_4_name) : id(room_area_5_name);
                      std::string s_id   = (slot_idx == 0) ? id(room_area_1_id)   : (slot_idx == 1) ? id(room_area_2_id)   : (slot_idx == 2) ? id(room_area_3_id)   : (slot_idx == 3) ? id(room_area_4_id)   : id(room_area_5_id);
                      if (!s_id.empty()) {
                        id(active_room_area_id) = s_id;
                        id(active_room_area_name) = pocket_ui::strip_trailing_paren_state(s_name);
                        pocket_ui::room_cat_dock_page() = 0;
                        id(room_domain_filter) = pocket_ui::resolve_preferred_room_category(
                            std::string(id(room_default_category_select).current_option()),
                            id(room_show_all_category_switch).state);
                        id(room_subpage) = 0;
                        id(room_browse_mode) = "entities";
                        id(room_browse_page) = 1;
                        id(room_action_feedback) = "Room: " + id(active_room_area_name);
                        id(room_feedback_timer) = now_rel;
                        id(select_active_room_latter).execute();
                        pocket_ui::schedule_disp_update(&id(disp1));
                      }
                    }
                  } else if (id(room_subpage) == 0) {
                    int card_idx = -1;
                    if (tp.y >= 94 && tp.y < 172) card_idx = 0;
                    else if (tp.y >= 172 && tp.y < 248) card_idx = 1;
                    else if (tp.y >= 248 && tp.y < 323) card_idx = 2;
                    if (card_idx >= 0 && tp.x >= 72 && tp.x <= 394) {
                      std::string s_name = (card_idx == 0) ? id(room_slot_1_name) : (card_idx == 1) ? id(room_slot_2_name) : id(room_slot_3_name);
                      std::string s_id   = (card_idx == 0) ? id(room_slot_1_id)   : (card_idx == 1) ? id(room_slot_2_id)   : (card_idx == 2) ? id(room_slot_3_id)   : (card_idx == 3) ? id(room_slot_4_id)   : id(room_slot_5_id);
                      std::string s_type = (card_idx == 0) ? id(room_slot_1_type) : (card_idx == 1) ? id(room_slot_2_type) : id(room_slot_3_type);
                      bool &s_act        = (card_idx == 0) ? id(room_slot_1_active) : (card_idx == 1) ? id(room_slot_2_active) : id(room_slot_3_active);
                      int &s_lvl         = (card_idx == 0) ? id(room_slot_1_level)  : (card_idx == 1) ? id(room_slot_2_level)  : id(room_slot_3_level);

                      if (s_id.empty() || s_type == "text") {
                        // Ignore taps on empty card slots (switching rooms is strictly via top header tap y <= 88)
                        return;
                      } else if (s_type == "media_player") {
                        id(target_speaker_id) = s_id;
                        id(target_speaker_name) = pocket_ui::strip_trailing_paren_state(s_name);
                        id(gui_page) = 2;
                        id(speaker_control_target).execute();
                      } else {
                        std::string clean_lbl = pocket_ui::strip_trailing_paren_state(s_name);
                        if (s_type == "light" && tp.x >= 316 && tp.x <= 384) {
                          // Tapping the Color/Kelvin Palette Orb (cx = 348, r = 16) opens the Light Inspector (room_subpage = 2)!
                          pocket_ui::light_insp_entity_id() = s_id;
                          pocket_ui::light_insp_name() = clean_lbl;
                          pocket_ui::light_insp_bri_pct() = (s_lvl > 0) ? s_lvl : 80;
                          id(room_subpage) = 2;
                          pocket_ui::schedule_disp_update(&id(disp1));
                          return;
                        }
                        id(room_target_entity_id) = s_id;
                        bool has_slider = ((s_type == "light" || s_type == "cover" || s_type == "fan") && s_lvl >= 0);
                        if (has_slider && tp.x > 144) {
                          int pct = ((tp.x - 144) * 100) / (384 - 144);
                          pct = std::max(5, std::min(100, ((pct + 2) / 5) * 5));
                          s_act = true;
                          s_lvl = pct;
                          id(room_target_action) = "set_level";
                          id(room_target_level) = pct;
                          id(room_action_feedback) = clean_lbl + ": " + to_string(pct) + "%";
                        } else {
                          s_act = !s_act;
                          id(room_target_action) = "toggle";
                          id(room_target_level) = s_act ? 100 : 0;
                          if (s_type == "scene" || s_type == "script") {
                            s_act = true;
                            id(room_action_feedback) = "Activated: " + clean_lbl;
                          } else if (s_type == "cover") {
                            s_lvl = s_act ? 100 : 0;
                            id(room_action_feedback) = clean_lbl + (s_act ? ": Open" : ": Closed");
                          } else {
                            if (s_act && s_lvl <= 0) s_lvl = 100;
                            id(room_action_feedback) = clean_lbl + (s_act ? ": On" : ": Off");
                          }
                        }
                        id(room_feedback_timer) = now_rel;
                        id(execute_room_action).execute();
                        pocket_ui::schedule_disp_update(&id(disp1));
                      }
                    }
                  }
                }
              } else if (!gest.swipe_committed && id(gui_page) == 9 && gest.last_y < 404) {
                if (gest.max_travel < 24) {
                  if (tp.y >= 324 && tp.y <= 398 && tp.x >= 70 && tp.x <= 396) {
                    int new_tab = (tp.x < 152) ? 0 : ((tp.x < 233) ? 1 : ((tp.x < 314) ? 2 : 3));
                    pocket_ui::whole_home_tab() = new_tab;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  } else if (pocket_ui::whole_home_tab() == 0 && tp.x >= 72 && tp.x <= 394) {
                    int a_card = -1;
                    if (tp.y >= 100 && tp.y < 168) a_card = 0;
                    else if (tp.y >= 168 && tp.y < 242) a_card = 1;
                    else if (tp.y >= 242 && tp.y < 316) a_card = 2;
                    if (a_card >= 0) {
                      if (a_card == 0) { id(room_alarm_service) = "disarm"; id(room_alarm_state) = "disarmed"; id(room_action_feedback) = "Disarmed"; }
                      else if (a_card == 1) { id(room_alarm_service) = "arm_home"; id(room_alarm_state) = "armed_home"; id(room_action_feedback) = "Armed Home"; }
                      else { id(room_alarm_service) = "arm_away"; id(room_alarm_state) = "armed_away"; id(room_action_feedback) = "Armed Away"; }
                      id(room_feedback_timer) = now_rel;
                      id(execute_alarm_action).execute();
                      pocket_ui::schedule_disp_update(&id(disp1));
                    }
                  } else if (pocket_ui::whole_home_tab() == 1) {
                    if (tp.y >= 112 && tp.y <= 200) {
                      if (tp.x >= 78 && tp.x <= 162) {
                        pocket_ui::sim_thermostat_target_f() = std::max(55, pocket_ui::sim_thermostat_target_f() - 1);
                      } else if (tp.x >= 304 && tp.x <= 388) {
                        pocket_ui::sim_thermostat_target_f() = std::min(88, pocket_ui::sim_thermostat_target_f() + 1);
                      }
                      id(room_target_entity_id) = "whole_home.thermostat";
                      id(room_target_action) = "set_level";
                      id(room_target_level) = pocket_ui::sim_thermostat_target_f();
                      id(execute_room_action).execute();
                      pocket_ui::schedule_disp_update(&id(disp1));
                    } else if (tp.y >= 234 && tp.y <= 298 && tp.x >= 60 && tp.x <= 406) {
                      const char *m_id = (tp.x < 147) ? "heat" : ((tp.x < 233) ? "cool" : ((tp.x < 319) ? "auto" : "off"));
                      pocket_ui::sim_thermostat_mode() = m_id;
                      id(room_target_entity_id) = "whole_home.thermostat";
                      id(room_target_action) = m_id;
                      id(execute_room_action).execute();
                      pocket_ui::schedule_disp_update(&id(disp1));
                    }
                  } else if (pocket_ui::whole_home_tab() == 2 && tp.x >= 72 && tp.x <= 394) {
                    if (tp.y >= 112 && tp.y < 200) {
                      pocket_ui::sim_garage_open() = !pocket_ui::sim_garage_open();
                      id(room_target_entity_id) = "whole_home.garage";
                      id(room_target_action) = pocket_ui::sim_garage_open() ? "turn_on" : "turn_off";
                      id(room_action_feedback) = pocket_ui::sim_garage_open() ? "Opening Garage..." : "Closing Garage...";
                      id(room_feedback_timer) = now_rel;
                      id(execute_room_action).execute();
                      pocket_ui::schedule_disp_update(&id(disp1));
                    } else if (tp.y >= 208 && tp.y < 298) {
                      pocket_ui::sim_front_door_locked() = !pocket_ui::sim_front_door_locked();
                      id(room_target_entity_id) = "whole_home.lock";
                      id(room_target_action) = pocket_ui::sim_front_door_locked() ? "lock" : "unlock";
                      id(room_action_feedback) = pocket_ui::sim_front_door_locked() ? "Front Door Locked" : "Front Door Unlocked";
                      id(room_feedback_timer) = now_rel;
                      id(execute_room_action).execute();
                      pocket_ui::schedule_disp_update(&id(disp1));
                    }
                  } else if (pocket_ui::whole_home_tab() == 3 && tp.x >= 72 && tp.x <= 394) {
                    int v_card = -1;
                    if (tp.y >= 100 && tp.y < 168) v_card = 0;
                    else if (tp.y >= 168 && tp.y < 242) v_card = 1;
                    else if (tp.y >= 242 && tp.y < 316) v_card = 2;
                    if (v_card >= 0) {
                      id(room_target_entity_id) = "whole_home.vacuum";
                      if (v_card == 0) { pocket_ui::sim_vacuum_state() = "Cleaning"; id(room_target_action) = "start"; id(room_action_feedback) = "Vacuum Started"; }
                      else if (v_card == 1) { pocket_ui::sim_vacuum_state() = "Paused"; id(room_target_action) = "pause"; id(room_action_feedback) = "Vacuum Paused"; }
                      else { pocket_ui::sim_vacuum_state() = "Docked"; id(room_target_action) = "dock"; id(room_action_feedback) = "Returning to Dock"; }
                      id(room_feedback_timer) = now_rel;
                      id(execute_room_action).execute();
                      pocket_ui::schedule_disp_update(&id(disp1));
                    }
                  }
                }
              } else if (!gest.swipe_committed && id(gui_page) == 8 && id(stuff_subpage) == 0 && !id(menu_scroll_active) && gest.last_y < 408) {
                if (gest.max_travel < 24) {
                  if (is_right_chevron_zone(tp)) {
                    int target_pg = (id(stuff_menu_page) == 0) ? 1 : 0;
                    id(menu_scroll_active) = true;
                    id(menu_scroll_dir) = (target_pg == 1) ? 1 : -1;
                    id(menu_scroll_target_page) = target_pg;
                    id(menu_scroll_step) = 0;
                    id(menu_scroll_transition).execute();
                  } else {
                    int row = -1;
                    if (tp.y >= 80 && tp.y < 184) row = 0;
                    else if (tp.y >= 184 && tp.y < 289) row = 1;
                    else if (tp.y >= 289 && tp.y < 406) row = 2;
                    int col = -1;
                    if (tp.x >= pocket_ui::SCREEN_CX - 145 && tp.x <= pocket_ui::SCREEN_CX) col = 0;
                    else if (tp.x > pocket_ui::SCREEN_CX && tp.x <= pocket_ui::SCREEN_CX + 145) col = 1;
                    if (row >= 0 && col >= 0) {
                      int target_subpage = 0;
                      if (id(stuff_menu_page) == 0) {
                        static constexpr int P0_MAP[3][2] = {{1, 2}, {3, 7}, {5, 6}};
                        target_subpage = P0_MAP[row][col];
                      } else if (row == 0) {
                        target_subpage = (col == 0) ? 4 : 8;
                      } else if (row == 1) {
                        target_subpage = (col == 0) ? 9 : 10;
                      } else if (row == 2) {
                        target_subpage = (col == 0) ? 11 : 12;
                      }
                      if (target_subpage > 0) {
                        id(stuff_subpage) = target_subpage;
                        if (id(stuff_subpage) == 5) {
                          id(display_brightness).turn_on().set_brightness(1.0f).perform();
                        } else if (id(stuff_subpage) == 6) {
                          id(calc_entry) = "0";
                          id(calc_history) = "";
                          id(calc_prev_val) = 0.0f;
                          id(calc_op) = 0;
                          id(calc_new_entry) = true;
                        } else if (id(stuff_subpage) == 9) {
                          pocket_ui::cal_detail_mode() = 0;
                          pocket_ui::cal_quick_add_open() = false;
                          id(cal_browse_page) = 1;
                          id(fetch_calendar_browse).execute();
                        } else if (id(stuff_subpage) == 12) {
                          id(fetch_on_demand_camera).execute();
                        }
                        pocket_ui::schedule_disp_update(&id(disp1));
                      }
                    }
                  }
                }
              } else if (!gest.swipe_committed && id(gui_page) == 8 && id(stuff_subpage) == 9 &&
                         pocket_ui::cal_detail_mode() == 2 && gest.start_y < 404) {
                // INTERACTIVE MAP VIEW: Swipe-to-Pan OR Tap +/- to Zoom OR Tap Top Header to Re-Center
                if (std::abs(dx) >= 28 || std::abs(dy) >= 28) {
                  gest.swipe_committed = true;
                  gest.last_swipe_ms = now_rel;
                  // Natural map drag: dragging finger Left (dx < 0) moves camera Right (pan_x + 1)
                  if (std::abs(dx) >= std::abs(dy)) {
                    int step_x = (std::abs(dx) >= 110) ? 2 : 1;
                    pocket_ui::cal_map_pan_x() = std::max(-25, std::min(25,
                        pocket_ui::cal_map_pan_x() + ((dx < 0) ? step_x : -step_x)));
                  } else {
                    int step_y = (std::abs(dy) >= 110) ? 2 : 1;
                    pocket_ui::cal_map_pan_y() = std::max(-25, std::min(25,
                        pocket_ui::cal_map_pan_y() + ((dy < 0) ? step_y : -step_y)));
                  }
                  id(fetch_calendar_map_snapshot).execute();
                } else if (gest.max_travel < 24) {
                  if (tp.y >= 188 && tp.y <= 278 && tp.x <= 86) {
                    // Left (-) Zoom Out Button
                    if (pocket_ui::cal_map_zoom() > 10) {
                      pocket_ui::cal_map_zoom()--;
                      pocket_ui::cal_map_pan_x() /= 2;
                      pocket_ui::cal_map_pan_y() /= 2;
                      pocket_ui::schedule_disp_update(&id(disp1));
                      id(fetch_calendar_map_snapshot).execute();
                    }
                  } else if (tp.y >= 188 && tp.y <= 278 && tp.x >= 380) {
                    // Right (+) Zoom In Button
                    if (pocket_ui::cal_map_zoom() < 18) {
                      pocket_ui::cal_map_zoom()++;
                      pocket_ui::cal_map_pan_x() = std::max(-25, std::min(25, pocket_ui::cal_map_pan_x() * 2));
                      pocket_ui::cal_map_pan_y() = std::max(-25, std::min(25, pocket_ui::cal_map_pan_y() * 2));
                      pocket_ui::schedule_disp_update(&id(disp1));
                      id(fetch_calendar_map_snapshot).execute();
                    }
                  } else if (tp.y <= 68 && tp.x >= 90 && tp.x <= 376) {
                    // Top Address Pill Tap -> Re-Center on Event Pin
                    if (pocket_ui::cal_map_pan_x() != 0 || pocket_ui::cal_map_pan_y() != 0) {
                      pocket_ui::cal_map_pan_x() = 0;
                      pocket_ui::cal_map_pan_y() = 0;
                      id(fetch_calendar_map_snapshot).execute();
                    }
                  }
                }
              } else if (!gest.swipe_committed && id(gui_page) == 8 && id(stuff_subpage) == 9 &&
                         pocket_ui::cal_detail_mode() == 0 && !pocket_ui::cal_quick_add_open() &&
                         gest.max_travel < 24 && gest.last_y >= 80 && gest.last_y < 404) {
                int slot_idx = get_5slot_index(tp, 75, 385);
                if (slot_idx >= 0) {
                  std::string s_name = (slot_idx == 0) ? id(cal_slot_1_name) : (slot_idx == 1) ? id(cal_slot_2_name) : (slot_idx == 2) ? id(cal_slot_3_name) : (slot_idx == 3) ? id(cal_slot_4_name) : id(cal_slot_5_name);
                  std::string s_id   = (slot_idx == 0) ? id(cal_slot_1_id)   : (slot_idx == 1) ? id(cal_slot_2_id)   : (slot_idx == 2) ? id(cal_slot_3_id)   : (slot_idx == 3) ? id(cal_slot_4_id)   : id(cal_slot_5_id);
                  if (!s_name.empty()) {
                    pocket_ui::parse_calendar_slot_meta(
                        s_name, s_id,
                        pocket_ui::cal_detail_time(),
                        pocket_ui::cal_detail_title(),
                        pocket_ui::cal_detail_location(),
                        pocket_ui::cal_detail_map_url());
                    pocket_ui::cal_detail_mode() = 1;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                }
              }
            }
            gest.active = false;
            ESP_LOGI("touch", "<<< Touch Released (page=%d)", id(gui_page));
