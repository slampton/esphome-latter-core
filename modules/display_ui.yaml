      - if:
          condition:
            lambda: 'return (id(active_speaker_entity) == "${local_player_id}");'
          then:
            - script.stop: mp_idle_debounce
            - script.execute: route_i2s_to_spk
            - switch.turn_on: speaker_enable
            - audio_dac.mute_off: es8311_dac
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: !lambda 'float v = id(pocket_music_player).volume; return (std::isnan(v) || v <= 0.05f) ? 26.0f : (v >= 1.0f ? 0.0f : -20.0f * std::log10(v));'
                duration: 0.2s
      - homeassistant.action:
          action: music_assistant.play_media
          data:
            entity_id: !lambda 'return id(active_speaker_entity).c_str();'
            media_id: !lambda 'return id(selected_slot_id).c_str();'
            media_type: !lambda 'return id(selected_slot_type).c_str();'
            enqueue: "replace"
      - lambda: 'pocket_ui::schedule_disp_update(&id(disp1));'

  - id: mp_idle_debounce
    mode: restart
    then:
      - delay: 3s
      - if:
          condition:
            lambda: |-
              return (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_IDLE) && 
                     !id(va).is_running() && 
                     !id(va_tts_received) && 
                     !id(announcement_mixing_input).is_running() &&
                     !id(alarm_ringing) &&
                     !id(timer_ringing) &&
                     !id(find_my_active) &&
                     (id(active_game) == 0);
          then:
            - audio_dac.mute_on: es8311_dac
            - switch.turn_off: speaker_enable
            - script.execute: route_i2s_to_mic
            - script.execute: sync_wake_word_state
            - lambda: |-
                if (id(display_power_state) == 0 && id(ble_room_beacon_switch).state && !id(ble_ctrl).is_active()) {
                  ESP_LOGI("ble", "Local audio idle: re-enabling BLE Presence Beacon");
                  id(ble_ctrl).enable();
                }
                if (id(display_power_state) == 2) {
                  auto ww_mode = id(va_wake_word_mode).current_option();
                  bool ww_act = (ww_mode == "Always On") || (ww_mode == "Docked Only" && id(usb_connected).state);
                  if (!ww_act) {
                    id(hal_set_audio_codecs_standby).execute(true);
                  }
                  if (!id(usb_connected).state) {
                    if (id(sleep_start_time) == 0) id(sleep_start_time) = millis();
                    extern int esp_wifi_set_ps(int type) __asm__("esp_wifi_set_ps");
                    esp_wifi_set_ps(1);
                  }
                }

  - id: toggle_voice_assistant
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(va_active) || !id(va_status_text).empty();'
          then:
            - script.execute: cancel_voice_assistant
          else:
            - if:
                condition:
                  lambda: 'return id(va).get_api_connection() == nullptr;'
                then:
                  - logger.log:
                      level: WARN
                      format: "Assist pipeline not connected to Home Assistant yet; ignoring PTT press"
                  - script.stop: toggle_voice_assistant
            - lambda: |-
                // If waking from screen-off or standby, honor Assist Screen Wake preference
                if (id(display_power_state) != 0 || !id(display_brightness).current_values.is_on()) {
                  if (id(va_wake_screen_switch).state) {
                    id(wake_to_active_state).execute();
                  }
                } else {
                  id(screen_sleep_timer).execute();
                }
                if (!id(va_active)) {
                  id(return_page) = id(gui_page);
                  id(va_active) = true;
                }
                id(va_tts_received) = false;
            - if:
                condition:
                  lambda: |-
                    return !id(va_resume_music_after) &&
                           ((id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                            (!id(active_speaker_entity).empty() && id(ha_target_state).state == "playing"));
                then:
                  - script.execute: pause_all_music
                  - delay: 180ms
            - if:
                condition:
                  micro_wake_word.is_running:
                then:
                  - micro_wake_word.stop:
                  - delay: 20ms
            - script.execute: route_i2s_to_mic
            - voice_assistant.start:

  - id: cancel_voice_assistant
    mode: restart
    then:
      - script.stop: va_tts_drain_and_finish
      - script.stop: mp_idle_debounce
      - audio_dac.mute_on: es8311_dac
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 50
          duration: 0.05s
      - if:
          condition:
            lambda: |-
              return (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING) ||
                     (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          then:
            - media_player.stop:
                id: pocket_music_player
                announcement: true
      - speaker.stop: announcement_mixing_input
      - voice_assistant.stop:
      - wait_until:
          condition:
            lambda: 'return id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_IDLE;'
          timeout: 450ms
      - script.stop: mp_idle_debounce
      - lambda: |-
          esphome::voice_assistant::abort_voice_assistant(id(va));
          id(va_was_cancelled) = true;
          id(va_status_text) = "";
          id(va_tts_received) = false;
          id(va_vad_active) = false;
          id(va_active) = false;
          id(gui_page) = id(return_page);
          if (id(display_power_state) == 2 && !id(usb_connected).state &&
              id(pocket_music_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) {
            extern int esp_wifi_set_ps(int type) __asm__("esp_wifi_set_ps");
            esp_wifi_set_ps(1);
          }
      - delay: 25ms
      - lambda: 'pocket_ui::schedule_disp_update(&id(disp1));'
      - delay: 160ms
      - script.execute: resume_music_after_va
      - if:
          condition:
            binary_sensor.is_off: pickup_detected
          then:
            - script.execute: screen_sleep_timer
  - id: trigger_firmware_update
    mode: restart
    then:
      - update.perform:
          id: update_pocket_assistant
      - lambda: |-
          id(system_menu_mode) = 5;
          pocket_ui::schedule_disp_update(&id(disp1));

  - id: check_firmware_update
    mode: restart
    then:
      - update.check:
          id: update_pocket_assistant


  - id: menu_scroll_transition
    mode: restart
    then:
      - lambda: |-
          // Frame 1: Render 35% eased frame (SHARED_SCROLL_EASE_*[2])
          id(menu_scroll_step) = 2;
          pocket_ui::schedule_disp_update(&id(disp1));
      - delay: 16ms
      - lambda: |-
          // Frame 2: Render 85% eased frame (SHARED_SCROLL_EASE_*[3])
          id(menu_scroll_step) = 3;
          pocket_ui::schedule_disp_update(&id(disp1));
      - delay: 16ms
      - lambda: |-
          // Frame 3: Commit target page, release scroll lock, and render settled frame
          id(menu_scroll_active) = false;
          if (id(gui_page) == 4 && id(system_menu_mode) == 1) {
            id(sleep_menu_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 4 && id(system_menu_mode) == 2) {
            id(display_menu_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 4 && id(system_menu_mode) == 0) {
            id(system_dashboard_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 2 && id(music_overlay_mode) == 2) {
            id(music_category_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 3 && id(active_game) == 0) {
            id(game_carousel_idx) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 8 && id(stuff_subpage) == 0) {
            id(stuff_menu_page) = id(menu_scroll_target_page);
          }
          id(menu_scroll_step) = 0;
          pocket_ui::schedule_disp_update(&id(disp1));

  # ==============================================================================
  # �� UNIVERSAL TV & MEDIA REMOTE COMMAND SCRIPTS (MULTI-DEVICE & MULTI-PROTOCOL)
  # ==============================================================================
  - id: remote_select_slot_latter
    mode: restart
    parameters:
      slot_num: int
    then:
      - if:
          condition:
            lambda: 'return !id(ha_latter_remote_slots_summary).state.empty();'
          then:
            - homeassistant.action:
                action: latter.remote_action
                data:
                  target_device: "${name}"
                  slot: !lambda 'return to_string(slot_num);'
                  action: "select_slot"

  - id: remote_send_key
    mode: restart
    parameters:
      key_idx: int
      target_slot: int
    then:
      - delay: 0ms
      - lambda: |-
          const std::string ents[4] = {
            id(remote_slot_0_ent), id(remote_slot_1_ent),
            id(remote_slot_2_ent), id(remote_slot_3_ent)
          };
          const std::string names[4] = {
            id(remote_slot_0_name), id(remote_slot_1_name),
            id(remote_slot_2_name), id(remote_slot_3_name)
          };
          const pocket_ui::RemoteCustomCmds custom_cmds = {
            "DPAD_UP", "DPAD_DOWN", "DPAD_LEFT", "DPAD_RIGHT",
            "DPAD_CENTER", "BACK", "HOME",
            "VOLUME_UP", "VOLUME_DOWN", "POWER"
          };
          const std::string profs[4] = {
            std::string(id(tv_remote_profile).current_option()),
            std::string(id(tv_remote_profile_2).current_option()),
            std::string(id(tv_remote_profile_3).current_option()),
            std::string(id(tv_remote_profile_4).current_option())
          };
          int res_slot = (target_slot == -1) ? pocket_ui::resolve_active_remote_slot(0, ents)
                                             : pocket_ui::resolve_active_remote_slot(target_slot, ents);
          id(remote_latter_slot_num) = res_slot + 1;

          int k = (key_idx >= 0 && key_idx < 10) ? key_idx : 0;
          id(remote_latter_act) = (k == 7) ? "volume_up" : ((k == 8) ? "volume_down" : ((k == 9) ? "toggle" : "command"));

          pocket_ui::resolve_remote_dispatch(
              k, target_slot, profs,
              ents, names, custom_cmds,
              id(remote_target_ent), id(remote_target_prof),
              id(remote_target_cmd), id(remote_action_feedback));
          id(remote_latter_cmd) = (k == 7) ? "volume_up" : ((k == 8) ? "volume_down" : ((k == 9) ? "toggle" : id(remote_target_cmd)));
          id(remote_feedback_timer) = millis();
      - if:
          condition:
            lambda: 'return key_idx >= 0 && key_idx <= 6;'
          then:
            # Direct On-Device C++ Protocol Dispatch for D-Pad, OK, Back & Home (0ms hop, 100% v2.0 compatibility)
            - if:
                condition:
                  lambda: 'return id(remote_target_prof) == "Denon / Marantz AVR";'
                then:
                  - homeassistant.action:
                      action: denonavr.get_command
                      data:
                        entity_id: !lambda 'return id(remote_target_ent);'
                        command: !lambda 'return id(remote_target_cmd);'
                else:
                  - if:
                      condition:
                        lambda: 'return id(remote_target_prof) == "LG webOS";'
                      then:
                        - homeassistant.action:
                            action: webostv.button
                            data:
                              entity_id: !lambda 'return id(remote_target_ent);'
                              button: !lambda 'return id(remote_target_cmd);'
                      else:
                        - homeassistant.action:
                            action: remote.send_command
                            data:
                              entity_id: !lambda 'return id(remote_target_ent);'
                              command: !lambda 'return id(remote_target_cmd);'
          else:
            # Keys 7..9 (Vol+, Vol-, Power): Use Latter when configured (supports paired AVR volume override),
            # otherwise fall back to direct native media_player / remote services when standalone!
            - if:
                condition:
                  lambda: 'return !id(ha_latter_remote_slots_summary).state.empty();'
                then:
                  - homeassistant.action:
                      action: latter.remote_action
                      data:
                        target_device: "${name}"
                        slot: !lambda 'return to_string(id(remote_latter_slot_num));'
                        action: !lambda 'return id(remote_latter_act);'
                        command: !lambda 'return id(remote_latter_cmd);'
                else:
                  - if:
                      condition:
                        lambda: 'return id(remote_target_ent).rfind("media_player.", 0) == 0;'
                      then:
                        - if:
                            condition:
                              lambda: 'return key_idx == 7;'
                            then:
                              - homeassistant.action:
                                  action: media_player.volume_up
                                  data:
                                    entity_id: !lambda 'return id(remote_target_ent);'
                        - if:
                            condition:
                              lambda: 'return key_idx == 8;'
                            then:
                              - homeassistant.action:
                                  action: media_player.volume_down
                                  data:
                                    entity_id: !lambda 'return id(remote_target_ent);'
                        - if:
                            condition:
                              lambda: 'return key_idx == 9;'
                            then:
                              - homeassistant.action:
                                  action: media_player.toggle
                                  data:
                                    entity_id: !lambda 'return id(remote_target_ent);'
                      else:
                        - if:
                            condition:
                              lambda: 'return key_idx == 9 && id(remote_target_prof) != "Custom";'
                            then:
                              - homeassistant.action:
                                  action: remote.toggle
                                  data:
                                    entity_id: !lambda 'return id(remote_target_ent);'
                            else:
                              - homeassistant.action:
                                  action: remote.send_command
                                  data:
                                    entity_id: !lambda 'return id(remote_target_ent);'
                                    command: !lambda 'return id(remote_target_cmd);'
display:
  - id: !extend disp1
    lambda: |-
      pocket_ui::last_disp_update_ms() = millis();
      const int cx = pocket_ui::SCREEN_CX;
      const int cy = pocket_ui::SCREEN_CY;
      const Color C_WHITE = id(col_white);
      const Color C_SOLARIS_GOLD = id(col_solaris_gold);

      // ==========================================
      // GLOBAL OVERLAY: OTA FIRMWARE UPDATE IN PROGRESS
      // ==========================================
      if (id(ota_in_progress)) {
        it.fill(id(col_bg));

        int pct = id(ota_progress_pct);
        if (pct < 0) pct = 0;
        if (pct > 100) pct = 100;
        for (int i = 0; i <= pct; i++) {
          float rad = (static_cast<float>(i) / 100.0f) * 2.0f * PI_F - HALF_PI_F;
          float s = 0.0f, c = 1.0f;
          fast_sincos(rad, s, c);
          it.line(cx + static_cast<int>(220.0f * c), cy + static_cast<int>(220.0f * s),
                  cx + static_cast<int>(228.0f * c), cy + static_cast<int>(228.0f * s), id(theme_secondary));
        }

        it.print(cx, cy - 60, id(font_date), id(theme_primary), TextAlign::CENTER, "FIRMWARE UPDATE");

        char prog_buf[32];
        snprintf(prog_buf, sizeof(prog_buf), "%d%%", pct);
        it.print(cx, cy + 8, id(font_time), id(col_white), TextAlign::CENTER, prog_buf);

        const char* status_msg = "Preparing flash...";
        if (pct >= 99) {
          status_msg = "Rebooting device...";
        } else if (pct >= 85) {
          status_msg = "Verifying image...";
        } else if (pct >= 10) {
          status_msg = "Writing flash memory...";
        }
        it.print(cx, cy + 65, id(font_small), id(col_slate), TextAlign::CENTER, status_msg);
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: HIBERNATION SHUTDOWN
      // ==========================================
      if (id(is_hibernating)) {
        it.fill(id(col_bg));

        if (id(hibernate_countdown_val) > 0) {
          it.print(cx, cy - 65, id(font_date), id(theme_primary), TextAlign::CENTER, "HIBERNATING");
          char c_buf[16];
          snprintf(c_buf, sizeof(c_buf), "%d", id(hibernate_countdown_val));
          it.print(cx, cy + 5, id(font_chrono_time), id(theme_secondary), TextAlign::CENTER, c_buf);
          it.print(cx, cy + 65, id(font_small), id(col_slate), TextAlign::CENTER, "Tap screen to stay awake");
        } else {
          it.print(cx, cy - 10, id(font_date), id(theme_primary), TextAlign::CENTER, "HIBERNATING");
          it.print(cx, cy + 30, id(font_small), id(col_slate), TextAlign::CENTER, "Shutting down...");
        }
        return;
      }

      static bool standby_black_flushed = false;
      if (!id(display_brightness).current_values.is_on() || id(display_power_state) == 2) {
        if (!standby_black_flushed) {
          it.fill(id(col_bg));
          standby_black_flushed = true;
        }
        return;
      }
      standby_black_flushed = false;

      // ==========================================
      // GLOBAL OVERLAY: VOICE ASSISTANT TAKEOVER
      // ==========================================
      if (id(va_active) || !id(va_status_text).empty()) {
        uint32_t now_ms = millis();
        bool is_speaking = id(va_tts_received);
        bool is_thinking = (!is_speaking && id(va_status_text) == "Thinking...");
        render_voice_assistant_overlay(
            it, cx, cy, now_ms, is_speaking, is_thinking, id(va_vad_active),
            id(va_visual_profile).current_option(), C_WHITE, C_SOLARIS_GOLD);
        return;
      }

      auto now = id(ha_time).now();

      // ==========================================
      // GLOBAL OVERLAY: ALARM / TIMER RINGING TAKEOVER
      // ==========================================
      if (id(alarm_ringing) || id(timer_ringing) || id(find_my_active)) {
        render_alert_ringing_overlay(
            it, cx, cy, millis(), id(alarm_ringing), id(alarm_ringing_idx),
            id(alarm1_recurrence), id(alarm2_recurrence), now, id(is_24h_format),
            id(font_time), id(font_date), id(font_small), id(font_micro),
            id(theme_primary), id(theme_secondary), id(col_bg), id(col_black),
            id(col_white), id(col_gray), id(col_red),
            id(find_my_active), id(va_timer_name));
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: LATTER PUSH NOTIFICATION & CAMERA SNAPSHOT TAKEOVER
      // ==========================================
      if (id(notif_active)) {
        render_notification_overlay(
            it, cx, cy, millis(),
            id(notif_title), id(notif_message), id(notif_priority),
            id(camera_snapshot_art), id(notif_camera_url), id(current_loaded_camera_url),
            id(font_date), id(font_small),
            id(theme_primary), id(theme_secondary),
            id(col_bg), id(col_black), id(col_white),
            id(col_slate), id(col_gold), id(col_red));
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: DOCKED SCREENSAVER (Mode 1)
      // ==========================================
      if (id(display_power_state) == 1) {
        it.fill(id(col_bg));
        render_docked_screensaver(
            it, cx, cy, millis(), now, id(is_24h_format),
            id(screensaver_style_select).current_option(),
            id(font_time), id(font_small), id(col_slate), id(col_dark_gray));
        return;
      }

      float batt = id(batt_level).state;

      // ==========================================
      // PAGE 0: WATCH FACE (ANALOG & DIGITAL)
      // ==========================================
      if (id(gui_page) == 0) {
        render_clock_page(
            it, cx, cy, now, id(clock_face_digital), id(is_24h_format),
            batt, id(batt_charging).state,
            id(font_time), id(font_date), id(font_small),
            id(theme_primary), id(theme_secondary),
            id(col_white), id(col_slate), id(col_gray), id(col_dark_gray),
            id(col_red), id(col_gold), id(col_green));

      // ==========================================
      // PAGE 1: INTERACTIVE HOME HUB
      // ==========================================
      } else if (id(gui_page) == 1) {
        uint32_t now_h_ms = millis();
        bool is_rem_h = (id(active_speaker_entity) != "${local_player_id}");
        bool loc_play_h = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
        bool mus_play_h = pocket_ui::is_music_playing_effective(is_rem_h, loc_play_h, id(ha_target_state).state, now_h_ms);
        std::string m_title_h = (is_rem_h || id(track_title).state.empty() || id(track_title).state == "None")
                                    ? id(ha_track_title).state : id(track_title).state;
        std::string m_artist_h = (is_rem_h || id(track_artist).state.empty() || id(track_artist).state == "None")
                                     ? id(ha_track_artist).state : id(track_artist).state;
        float eff_w_temp_h = !std::isnan(id(ha_weather_temperature).state)
                                 ? id(ha_weather_temperature).state
                                 : id(ha_weather_temp_fallback).state;
        std::string eff_w_cond_h = (!id(ha_weather_condition).state.empty() &&
                                    id(ha_weather_condition).state != "unknown" &&
                                    id(ha_weather_condition).state != "unavailable")
                                       ? id(ha_weather_condition).state
                                       : id(ha_weather_condition_fallback).state;
        bool eff_show_w_bg = id(home_weather_bg_switch).state ||
                             (id(weather_sim_condition).current_option() != "Live (Home Assistant)");
        render_home_page(
            it, cx, cy, now_h_ms, id(home_subpage), id(home_activity_idx),
            now, id(is_24h_format), batt, id(batt_charging).state,
            eff_show_w_bg,
            id(home_dock_music_switch).state, id(home_dock_remote_switch).state,
            id(home_dock_tools_switch).state, id(home_dock_games_switch).state,
            std::string(id(weather_sim_condition).current_option()), eff_w_temp_h,
            eff_w_cond_h, id(ha_sun_state).state, id(ha_moon_phase).state,
            id(accel_x).state, id(accel_y).state,
            id(stopwatch_running), id(stopwatch_start_time), id(stopwatch_elapsed_ms),
            mus_play_h, m_title_h, m_artist_h,
            id(alarm_snooze_until),
            id(alarm1_hour), id(alarm1_minute), id(alarm1_enabled),
            id(alarm2_hour), id(alarm2_minute), id(alarm2_enabled),
            id(alarm3_hour), id(alarm3_minute), id(alarm3_enabled),
            id(font_time), id(font_date), id(font_small),
            id(theme_primary), id(theme_secondary),
            id(col_bg), id(col_black), id(col_white), id(col_slate),
            id(col_dark_gray), id(col_gold), id(col_green),
            id(home_wake_greeting_switch).state, id(home_dock_room_switch).state,
            id(home_wallpaper_art), id(ha_latter_wallpaper_url).state,
            id(current_loaded_wallpaper_url), id(ha_calendar_agenda_raw).state,
            id(home_dock_alarm_switch).state, id(room_alarm_state));

      // ==========================================
      // PAGE 2: MUSIC PLAYER & LIBRARY BROWSER
      // ==========================================
      } else if (id(gui_page) == 2) {
        uint32_t now_p2_ms = millis();
        pocket_ui::last_page2_draw_ms() = now_p2_ms;
        if (id(music_overlay_mode) == 0) {
          bool is_remote = (id(active_speaker_entity) != "${local_player_id}");
          bool local_playing = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          bool is_playing = pocket_ui::is_music_playing_effective(
              is_remote, local_playing, id(ha_target_state).state, now_p2_ms);
          render_music_now_playing(
              it, cx, cy, now_p2_ms,
              id(music_fullscreen_art_mode).current_option().c_str(),
              id(music_overlay_style).current_option().c_str(),
              id(music_hud_active), is_remote, is_playing,
              id(album_art), id(remote_album_art),
              id(ha_target_art_url).state, id(current_loaded_art_url),
              id(active_speaker_name), "${friendly_name}",
              id(music_action_feedback), id(music_feedback_timer),
              id(active_playback_media_type),
              id(music_show_speaker_shortcut).state, id(music_show_library_shortcut).state,
              id(ha_media_duration).state, id(music_pos_base), id(music_pos_sync_time),
              id(track_title).state, id(track_artist).state, id(track_album).state,
              id(ha_track_title).state, id(ha_track_artist).state, id(ha_track_album).state,
              id(font_small), id(font_micro), id(theme_primary), id(theme_secondary),
              id(col_bg), id(col_black), id(col_white), id(col_gray), id(col_dark_gray));
        } else {
          render_music_menus(
              it, cx, id(music_overlay_mode),
              id(active_speaker_entity), id(active_speaker_name), "${local_player_id}",
              id(selected_category_mode), id(selected_category_title),
              id(music_category_page), id(music_browse_page), id(music_browse_total_pages),
              id(menu_scroll_active), id(menu_scroll_step), id(menu_scroll_dir), id(menu_scroll_target_page),
              id(slot_1_name), id(slot_1_id), id(slot_1_type), id(slot_1_active),
              id(slot_2_name), id(slot_2_id), id(slot_2_type), id(slot_2_active),
              id(slot_3_name), id(slot_3_id), id(slot_3_type), id(slot_3_active),
              id(slot_4_name), id(slot_4_id), id(slot_4_type), id(slot_4_active),
              id(slot_5_name), id(slot_5_id), id(slot_5_type), id(slot_5_active),
              id(target_speaker_id), id(target_speaker_name),
              id(font_date), id(font_small), id(font_micro),
              id(theme_primary), id(theme_secondary), id(col_bg), id(col_black),
              id(col_white), id(col_slate), id(col_dark_gray),
              now_p2_ms,
              pocket_ui::is_music_playing_effective(
                  id(active_speaker_entity) != "${local_player_id}",
                  id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING,
                  id(ha_target_state).state, now_p2_ms),
              id(ha_media_duration).state, id(music_pos_base), id(music_pos_sync_time),
              (id(active_speaker_entity) != "${local_player_id}" || id(track_title).state.empty() || id(track_title).state == "None") ? id(ha_track_title).state : id(track_title).state,
              (id(active_speaker_entity) != "${local_player_id}" || id(track_artist).state.empty() || id(track_artist).state == "None") ? id(ha_track_artist).state : id(track_artist).state,
              (id(active_speaker_entity) != "${local_player_id}" || id(track_album).state.empty() || id(track_album).state == "None") ? id(ha_track_album).state : id(track_album).state);
        }

      // ==========================================
      // PAGE 3: GAMES SUITE (LAUNCHER & 4 GAMES)
      // ==========================================
      } else if (id(gui_page) == 3) {
        static int prev_game_state = 0;
        bool game_just_entered = false;
        if (id(active_game) != prev_game_state) {
          prev_game_state = id(active_game);
          game_just_entered = true;
        }

        float roll_delta = 0.0f;
        float pitch_delta = 0.0f;
        compute_3d_game_tilt(
            id(accel_x).state, id(accel_y).state, id(accel_z).state,
            id(imu_roll).state, id(imu_pitch).state,
            game_just_entered && (id(active_game) > 0),
            roll_delta, pitch_delta);

        if (id(active_game) == 0) {
          render_games_launcher(
              it, cx, id(game_carousel_idx), id(menu_scroll_active),
              id(menu_scroll_step), id(menu_scroll_dir), id(menu_scroll_target_page),
              id(high_score_marbles), id(high_score_archery), id(high_score_breakout),
              id(high_score_chomp),
              id(font_games_title), id(font_btn_bold), id(font_small),
              id(theme_primary), id(theme_secondary),
              id(col_bg), id(col_black), id(col_white), id(col_silver),
              id(col_slate), id(col_dark_gray),
              id(col_gold), id(col_cyan), id(col_green),
              id(col_orange), id(col_red), id(col_magenta), id(game_sound_switch).state);
        } else if (id(active_game) == 1) {
          render_game_marbles(
              it, cx, cy, millis(), game_just_entered, roll_delta, pitch_delta,
              id(marble_touch_x), id(marble_touch_y), id(game_btn_pressed), id(high_score_marbles),
              id(font_date), id(font_small), id(theme_primary), id(theme_secondary),
              id(col_bg), id(col_white), id(col_gold), id(col_cyan), id(col_green),
              id(col_red), id(col_orange), id(col_magenta), id(col_slate), id(col_gray), id(col_dark_gray));
        } else if (id(active_game) == 2) {
          render_game_archery(
              it, cx, cy, millis(), game_just_entered, roll_delta, pitch_delta,
              id(marble_touch_x), id(game_btn_pressed), id(high_score_archery),
              id(font_date), id(font_small), id(theme_secondary),
              id(col_bg), id(col_white), id(col_black), id(col_gold),
              id(col_cyan), id(col_red), id(col_slate), id(col_dark_gray));
        } else if (id(active_game) == 3) {
          render_game_breakout(
              it, cx, cy, millis(), game_just_entered, roll_delta,
              id(marble_touch_x), id(game_btn_pressed), id(high_score_breakout),
              id(font_date), id(font_small), id(theme_primary), id(theme_secondary),
              id(col_bg), id(col_white), id(col_gold), id(col_cyan),
              id(col_orange), id(col_green), id(col_red), id(col_slate), id(col_dark_gray));
        } else if (id(active_game) == 4) {
          render_game_chomp(
              it, cx, cy, millis(), game_just_entered, roll_delta, pitch_delta,
              id(marble_touch_x), id(game_btn_pressed), id(high_score_chomp),
              id(font_date), id(font_small), id(col_bg), id(col_white),
              id(col_black), id(col_gold), id(col_cyan), id(col_red),
              id(col_green), id(col_magenta), id(col_orange), id(col_dark_gray));
        }
        if (id(active_game) > 0) {
          if (game_just_entered) {
            pocket_ui::pending_game_sfx() = 0;
            if (id(game_sound_switch).state) {
              id(route_i2s_to_spk).execute();
              id(speaker_enable).turn_on();
              id(es8311_dac).set_mute_off();
            }
          }
          if (pocket_ui::pending_game_sfx() > 0) {
            int sfx = pocket_ui::pending_game_sfx();
            pocket_ui::pending_game_sfx() = 0;
            if (id(game_sound_switch).state) {
              id(play_game_sfx).execute(sfx);
            }
          }
        }

      // ==========================================
      // PAGE 4: SYSTEM SETTINGS & DIAGNOSTICS
      // ==========================================
      } else if (id(gui_page) == 4) {
        int spk_vol_pct = (int)std::round(id(pocket_music_player).volume * 100.0f);
        float a_st = id(alert_volume).state;
        int alert_vol_pct = (std::isnan(a_st) || a_st < 20.0f) ? 70 : (int)std::round(a_st);
        int vol_step_pct = (int)std::round(id(volume_step_size).state);
        if (vol_step_pct < 1 || vol_step_pct > 10) vol_step_pct = 5;
        uint32_t free_heap_kb = (uint32_t)(esp_get_free_heap_size() / 1024U);

        render_system_page(
            it, cx, millis(), "${version}",
            id(system_menu_mode), id(system_dashboard_page),
            id(sleep_menu_page), id(display_menu_page),
            id(menu_scroll_active), id(menu_scroll_step), id(menu_scroll_dir), id(menu_scroll_target_page),
            id(update_check_state), id(update_check_timer),
            id(ha_firmware_latest_version).state, id(ha_firmware_release_summary).state,
            batt, id(batt_charging).state, id(batt_voltage).state,
            id(pocket_wifi_signal).state, id(pocket_ip_address).state, id(imu_temp).state,
            free_heap_kb, now.is_valid(), id(ble_ctrl).is_active(),
            id(pickup_wake_mode).current_option(), id(tap_wake_mode).current_option(),
            id(display_off_timeout).current_option(), id(docked_screensaver_switch).state,
            id(screensaver_style_select).current_option(), id(screensaver_docked_timeout).current_option(),
            id(hibernate_timeout_mode).current_option(), id(instant_crown_hibernate_switch).state,
            id(prevent_deep_sleep_switch).state,
            id(clock_face_digital), id(is_24h_format),
            id(theme_palette_select).current_option(), id(default_start_app).current_option(),
            id(auto_brightness_mode).current_option(), id(display_brightness_preset).current_option(),
            (int)id(day_start_hour).state, (int)id(night_start_hour).state,
            id(day_brightness_preset).current_option(), id(night_brightness_preset).current_option(),
            spk_vol_pct, alert_vol_pct, vol_step_pct,
            id(music_fullscreen_art_mode).current_option(), id(music_overlay_style).current_option(),
            id(music_album_sort_order).current_option(), id(music_artist_album_sort_order).current_option(),
            id(music_podcast_sort_order).current_option(),
            id(va_wake_word_mode).current_option(), id(va_active_wake_word).current_option(),
            id(ww_sens_okay_nabu).current_option(), id(ww_sens_hey_luna).current_option(),
            id(ww_sens_hey_jarvis).current_option(), id(ww_sens_hey_mycroft).current_option(),
            id(ww_sens_alexa).current_option(),
            id(va_visual_profile).current_option(), id(va_wake_screen_switch).state,
            id(font_date), id(font_small),
            id(theme_primary), id(theme_secondary),
            id(col_bg), id(col_black), id(col_white), id(col_slate),
            id(col_dark_gray), id(col_gold), id(col_red), id(game_sound_switch).state);

      // ==========================================
      // PAGE 5: SKY & WEATHER SUITE
      // ==========================================
      } else if (id(gui_page) == 5) {
        float eff_w_temp = !std::isnan(id(ha_weather_temperature).state)
                               ? id(ha_weather_temperature).state
                               : id(ha_weather_temp_fallback).state;
        float eff_w_hum  = !std::isnan(id(ha_weather_humidity).state)
                               ? id(ha_weather_humidity).state
                               : id(ha_weather_humidity_fallback).state;
        float eff_w_spd  = !std::isnan(id(ha_weather_wind_speed).state)
                               ? id(ha_weather_wind_speed).state
                               : id(ha_weather_wind_speed_fallback).state;
        float eff_w_brg  = !std::isnan(id(ha_weather_wind_bearing).state)
                               ? id(ha_weather_wind_bearing).state
                               : id(ha_weather_wind_bearing_fallback).state;
        std::string eff_w_cond = (!id(ha_weather_condition).state.empty() &&
                                  id(ha_weather_condition).state != "unknown" &&
                                  id(ha_weather_condition).state != "unavailable")
                                     ? id(ha_weather_condition).state
                                     : id(ha_weather_condition_fallback).state;
        render_weather_page(
            it, cx, cy, millis(), id(sky_weather_subpage), now, id(is_24h_format),
            std::string(id(weather_sim_condition).current_option()),
            eff_w_temp, id(ha_weather_high).state, id(ha_weather_low).state,
            eff_w_hum, eff_w_spd, eff_w_brg,
            eff_w_cond, id(ha_weather_forecast_5d).state,
            id(ha_sun_state).state, id(ha_sun_elevation).state, id(ha_sun_azimuth).state,
            id(ha_sun_next_rising).state, id(ha_sun_next_setting).state,
            id(ha_moon_phase).state,
            id(font_time), id(font_date), id(font_btn_bold), id(font_small), id(font_micro),
            id(theme_primary), id(theme_secondary),
            id(col_bg), id(col_black), id(col_white), id(col_slate),
            id(col_gray), id(col_dark_gray), id(col_warm_gold), id(accel_x).state, id(accel_y).state);

      // ==========================================
      // PAGE 6: AREA-AWARE ROOM CONTROL (LATTER)
      // ==========================================
      } else if (id(gui_page) == 6) {
        const bool is_area_picker = (id(room_subpage) == 1);
        render_room_control_page(
            it, cx, millis(), id(room_subpage), is_area_picker ? "areas" : "entities", id(room_domain_filter),
            id(active_room_area_name), id(ha_room_temperature).state, id(ha_room_humidity).state,
            id(room_alarm_entity), id(room_alarm_state),
            is_area_picker ? id(room_area_page) : id(room_browse_page),
            is_area_picker ? id(room_area_total_pages) : id(room_browse_total_pages),
            id(room_action_feedback), id(room_feedback_timer),
            is_area_picker ? id(room_area_1_name) : id(room_slot_1_name),
            is_area_picker ? id(room_area_1_id)   : id(room_slot_1_id),
            is_area_picker ? "area"               : id(room_slot_1_type),
            is_area_picker ? id(room_area_1_active) : id(room_slot_1_active), id(room_slot_1_level),
            is_area_picker ? id(room_area_2_name) : id(room_slot_2_name),
            is_area_picker ? id(room_area_2_id)   : id(room_slot_2_id),
            is_area_picker ? "area"               : id(room_slot_2_type),
            is_area_picker ? id(room_area_2_active) : id(room_slot_2_active), id(room_slot_2_level),
            is_area_picker ? id(room_area_3_name) : id(room_slot_3_name),
            is_area_picker ? id(room_area_3_id)   : id(room_slot_3_id),
            is_area_picker ? "area"               : id(room_slot_3_type),
            is_area_picker ? id(room_area_3_active) : id(room_slot_3_active), id(room_slot_3_level),
            is_area_picker ? id(room_area_4_name) : id(room_slot_4_name),
            is_area_picker ? id(room_area_4_id)   : id(room_slot_4_id),
            is_area_picker ? "area"               : id(room_slot_4_type),
            is_area_picker ? id(room_area_4_active) : id(room_slot_4_active), id(room_slot_4_level),
            is_area_picker ? id(room_area_5_name) : id(room_slot_5_name),
            is_area_picker ? id(room_area_5_id)   : id(room_slot_5_id),
            is_area_picker ? "area"               : id(room_slot_5_type),
            is_area_picker ? id(room_area_5_active) : id(room_slot_5_active), id(room_slot_5_level),
            id(font_date), id(font_small), id(theme_primary), id(theme_secondary),
            id(col_bg), id(col_black), id(col_white), id(col_slate), id(col_dark_gray),
            id(col_gold), id(col_green), id(col_red),
            id(room_show_all_category_switch).state);
        if (id(room_subpage) > 0) {
          render_back_button(it, cx, id(font_small), 426, "< Back");
        }

      // ==========================================
      // PAGE 7: UNIVERSAL TV & MEDIA REMOTE CONTROL
      // ==========================================
      } else if (id(gui_page) == 7) {
        const std::string rem_ents[4] = {
          id(remote_slot_0_ent), id(remote_slot_1_ent),
          id(remote_slot_2_ent), id(remote_slot_3_ent)
        };
        const std::string rem_names[4] = {
          id(remote_slot_0_name), id(remote_slot_1_name),
          id(remote_slot_2_name), id(remote_slot_3_name)
        };
        render_tv_remote_page(
            it, cx, cy, millis(), id(remote_subpage), id(active_remote_slot),
            rem_ents, rem_names, id(remote_action_feedback), id(remote_feedback_timer),
            id(font_date), id(font_small),
            id(theme_primary), id(theme_secondary),
            id(col_white), id(col_slate), id(col_gray), id(col_dark_gray), id(col_red));

      // ==========================================
      // PAGE 8: TOOLS SUITE (8 UTILITIES)
      // ==========================================
      } else if (id(gui_page) == 8) {
        if (id(stuff_subpage) == 0) {
          render_tools_launcher(
              it, cx, id(stuff_menu_page), id(menu_scroll_active),
              id(menu_scroll_step), id(menu_scroll_dir), id(menu_scroll_target_page),
              id(font_date), id(font_small), id(theme_primary), id(theme_secondary),
              id(col_bg), id(col_black), id(col_white));
        } else if (id(stuff_subpage) == 1) {
          render_tool_timer(
              it, cx, cy, id(timer_running), id(timer_paused),
              id(timer_remaining_sec), id(timer_duration_sec),
              id(font_time), id(font_date), id(font_btn_bold), id(font_small),
              id(theme_primary), id(theme_secondary), id(col_black),
              id(col_white), id(col_slate), id(col_dark_gray), id(col_red),
              id(va_timer_name), id(font_chrono_time), id(col_gray));
        } else if (id(stuff_subpage) == 2) {
          render_tool_alarms(
              it, cx, now, id(is_24h_format), id(alarm_edit_idx),
              id(alarm_snooze_until), id(alarm_ringing_idx),
              id(alarm1_hour), id(alarm1_minute), id(alarm1_enabled), id(alarm1_recurrence),
              id(alarm2_hour), id(alarm2_minute), id(alarm2_enabled), id(alarm2_recurrence),
              id(alarm3_hour), id(alarm3_minute), id(alarm3_enabled), id(alarm3_recurrence),
              id(font_time), id(font_chrono_time), id(font_date), id(font_small),
              id(theme_primary), id(theme_secondary), id(col_black),
              id(col_white), id(col_gray), id(col_dark_gray), id(col_gold));
        } else if (id(stuff_subpage) == 3) {
          render_tool_stopwatch(
              it, cx, cy, millis(), id(stopwatch_running),
              id(stopwatch_start_time), id(stopwatch_elapsed_ms), id(stopwatch_lap_ms),
              id(font_date), id(font_small), id(col_white), id(col_silver),
              id(col_slate), id(col_dark_gray), id(col_red));
        } else if (id(stuff_subpage) == 4) {
          render_tool_dice_roll(
              it, cx, millis(), id(dice_anim_active), id(dice_anim_start_ms),
              id(dice_val_d6), id(dice_val_d6_2), id(font_date), id(font_small),
              id(theme_primary), id(theme_secondary), id(col_white), id(col_dark_gray));
        } else if (id(stuff_subpage) == 5) {
          it.fill(id(col_white));
        } else if (id(stuff_subpage) == 6) {
          render_tool_calculator(
              it, cx, id(calc_history), id(calc_entry), id(calc_op), id(calc_new_entry),
              id(font_date), id(font_btn_bold), id(font_small),
              id(theme_primary), id(col_white), id(col_slate), id(col_dark_gray));
        } else if (id(stuff_subpage) == 7) {
          render_tool_bubble_level(
              it, cx, id(accel_x).state, id(accel_y).state, id(accel_z).state,
              id(font_date), id(font_small),
              id(theme_primary), id(theme_secondary), id(col_white),
              id(col_gray), id(col_slate), id(col_dark_gray), id(col_green));
        } else if (id(stuff_subpage) == 8) {
          render_tool_coin_flip(
              it, cx, millis(), id(coin_anim_active), id(coin_anim_start_ms),
              id(coin_side), id(font_date), id(font_small),
              id(theme_primary), id(theme_secondary), id(col_white), id(col_dark_gray));
        } else if (id(stuff_subpage) == 9) {
          render_tool_calendar(
              it, cx, id(ha_calendar_agenda_raw).state,
              id(cal_browse_page), id(cal_browse_total_pages),
              id(cal_slot_1_name), id(cal_slot_1_active),
              id(cal_slot_2_name), id(cal_slot_2_active),
              id(cal_slot_3_name), id(cal_slot_3_active),
              id(cal_slot_4_name), id(cal_slot_4_active),
              id(cal_slot_5_name), id(cal_slot_5_active),
              id(font_small), id(theme_primary), id(theme_secondary),
              id(col_bg), id(col_black), id(col_white), id(col_slate), millis(),
              id(camera_snapshot_art));
        } else if (id(stuff_subpage) == 10) {
          render_tool_intercom(
              it, cx, millis(), id(intercom_feedback_str), id(intercom_feedback_ms),
              id(font_small), id(theme_primary), id(theme_secondary),
              id(col_white), id(col_slate));
        } else if (id(stuff_subpage) == 11) {
          render_tool_macros(
              it, cx, millis(), id(ha_latter_custom_bindings_summary).state,
              id(macro_feedback_str), id(macro_feedback_ms),
              id(font_small), id(theme_primary), id(theme_secondary),
              id(col_white), id(col_slate));
        } else if (id(stuff_subpage) == 12) {
          render_tool_camera(
              it, cx, cy, id(camera_snapshot_art), id(ha_latter_camera_snapshot_url).state,
              id(font_small), id(theme_primary), id(theme_secondary),
              id(col_bg), id(col_white), id(col_slate));
        }
      } else if (id(gui_page) == 9) {
        // ==========================================
        // PAGE 9: DEDICATED HOME SECURITY ALARM APP
        // ==========================================
        render_security_alarm_page(
            it, cx, millis(), id(room_alarm_entity), id(room_alarm_state),
            id(room_action_feedback), id(room_feedback_timer),
            id(font_date), id(font_small), id(theme_primary), id(theme_secondary),
            id(col_white), id(col_slate), id(col_gold), id(col_green), id(col_red));
      }

      // UNIVERSAL GLOBAL BOTTOM HOME INDICATOR BAR (Rendered at y = 434 for all top-level apps launched from Home)
      auto current_overlay_mode = id(music_overlay_style).current_option();
      bool music_clean_art = (id(gui_page) == 2 && current_overlay_mode != "Always Visible" && !id(music_hud_active));
      bool tools_direct_root = (id(gui_page) == 8 && pocket_ui::tools_direct_home() &&
                                ((id(stuff_subpage) == 1 && pocket_ui::timer_view_slot() == 0) ||
                                 (id(stuff_subpage) == 2 && id(alarm_edit_idx) == 0) ||
                                 (id(stuff_subpage) == 3)));

      bool show_top_level_back = !id(is_hibernating) && !id(ota_in_progress) && !id(va_active) &&
                                 id(va_status_text).empty() && id(display_power_state) == 0 &&
                                 (id(gui_page) != 1) &&
                                 !(id(gui_page) == 4) &&
                                 !(id(gui_page) == 3 && id(active_game) > 0) &&
                                 !(id(gui_page) == 2 && (id(music_overlay_mode) > 0 || music_clean_art)) &&
                                 !(id(gui_page) == 6 && (id(room_subpage) > 0 || id(room_browse_mode) == "areas")) &&
                                 !(id(gui_page) == 7 && id(remote_subpage) > 0) &&
                                 !(id(gui_page) == 8 && id(stuff_subpage) > 0 && !tools_direct_root) &&
                                 !(id(alarm_ringing) || id(timer_ringing) || id(find_my_active));

      if (show_top_level_back) {
        pocket_ui::render_home_indicator_bar(it, cx, 434);
      }

      uint32_t end_draw_ms = millis();
      pocket_ui::last_disp_update_ms() = end_draw_ms;
      pocket_ui::record_ambient_frame_ms(end_draw_ms);


touchscreen:
  - id: !extend touch_screen
    on_touch:
      then:
        - lambda: |-
            ESP_LOGI("touch", ">>> Touch Down: x=%d y=%d page=%d", touch.x, touch.y, id(gui_page));
            if (id(is_hibernating)) {
              if (id(hibernate_countdown_val) > 0) {
                id(is_hibernating) = false;
                id(hibernate_countdown_val) = 0;
                id(wake_to_active_state).execute();
              }
              return;
            }
            uint32_t now_touch = millis();

            if (id(display_power_state) != 0 || !id(display_brightness).current_values.is_on()) {
              auto tw_mode = id(tap_wake_mode).current_option();
              if (tw_mode == "Disabled") return;
              if (tw_mode == "Docked Only" && !id(usb_connected).state) return;

              id(wake_to_active_state).execute();
              return;
            }

            if (now_touch - pocket_ui::last_screen_wake_ms() < TOUCH_DEBOUNCE_WAKE) {
              return;
            }

            static uint32_t last_touch_activity = 0;
            if (now_touch - last_touch_activity > 1000U) {
              last_touch_activity = now_touch;
              id(screen_sleep_timer).execute();
            }

            if (id(va_active) || !id(va_status_text).empty()) {
              pocket_ui::last_screen_wake_ms() = now_touch;
              id(cancel_voice_assistant).execute();
              return;
            }

            if (id(alarm_ringing) || id(timer_ringing) || id(find_my_active)) {
              if (id(find_my_active)) {
                id(find_my_active) = false;
                pocket_ui::last_screen_wake_ms() = now_touch;
                id(stop_alarm_sound).execute();
                id(sync_display_brightness).execute();
                pocket_ui::schedule_disp_update(&id(disp1));
                return;
              }
              if (id(alarm_ringing)) {
                if (touch.y >= 268 && touch.y <= 324 && touch.x >= 100 && touch.x <= 366) {
                  auto now = id(ha_time).now();
                  if (now.is_valid()) {
                    id(alarm_snooze_until) = now.timestamp + 300;
                  } else {
                    id(alarm_snooze_until) = (now_touch / 1000) + 300;
                  }
                  id(alarm_ringing) = false;
                  pocket_ui::last_screen_wake_ms() = now_touch;
                  id(stop_alarm_sound).execute();
                  pocket_ui::schedule_disp_update(&id(disp1));
                  return;
                }
                if (touch.y >= 336 && touch.y <= 420 && touch.x >= 95 && touch.x <= 371) {
                  id(alarm_ringing) = false;
                  pocket_ui::last_screen_wake_ms() = now_touch;
                  id(stop_alarm_sound).execute();
                  pocket_ui::schedule_disp_update(&id(disp1));
                  return;
                }
              } else if (id(timer_ringing)) {
                if (touch.y >= 290 && touch.y <= 395 && touch.x >= 90 && touch.x <= 376) {
                  id(timer_ringing) = false;
                  pocket_ui::last_screen_wake_ms() = now_touch;
                  id(stop_alarm_sound).execute();
                  pocket_ui::schedule_disp_update(&id(disp1));
                  return;
                }
              }
              return;
            }

            auto &gest = pocket_ui::touch_gesture();
            gest.start_x = touch.x;
            gest.start_y = touch.y;
            gest.last_x = touch.x;
            gest.last_y = touch.y;
            gest.max_travel = 0;
            gest.sample_count = 1;
            gest.start_ms = now_touch;
            gest.last_touch_ms = now_touch;
            gest.start_page = id(gui_page);
            gest.start_context = pocket_ui::compute_touch_context(
                id(gui_page), id(home_subpage), id(music_overlay_mode), id(active_game),
                id(system_menu_mode), id(sky_weather_subpage), id(room_subpage),
                id(remote_subpage), id(stuff_subpage));
            gest.active = true;
            gest.swipe_committed = false;

            static uint32_t last_back_tap = 0;

            bool music_clean_touch = (id(gui_page) == 2 && id(music_overlay_mode) == 0 &&
                                      id(music_overlay_style).current_option() != "Always Visible" &&
                                      !id(music_hud_active));
            bool tools_direct_root = (id(gui_page) == 8 && pocket_ui::tools_direct_home() &&
                                      ((id(stuff_subpage) == 1 && pocket_ui::timer_view_slot() == 0) ||
                                       (id(stuff_subpage) == 2 && id(alarm_edit_idx) == 0) ||
                                       (id(stuff_subpage) == 3)));
            bool is_top_level_home_bar = (id(gui_page) != 1) &&
                                         !music_clean_touch &&
                                         !(id(gui_page) == 4 && id(system_menu_mode) > 0) &&
                                         !(id(gui_page) == 3 && id(active_game) > 0) &&
                                         !(id(gui_page) == 2 && id(music_overlay_mode) > 0) &&
                                         !(id(gui_page) == 6 && (id(room_subpage) > 0 || id(room_browse_mode) == "areas")) &&
                                         !(id(gui_page) == 7 && id(remote_subpage) > 0) &&
                                         !(id(gui_page) == 8 && id(stuff_subpage) > 0 && !tools_direct_root) &&
                                         !(id(alarm_ringing) || id(timer_ringing) || id(find_my_active));

            // Top-level apps use the bottom Swipe-Up Home Indicator Bar (taps at y >= 412 are ignored so they never misfire)
            if (is_top_level_home_bar && touch.y >= (pocket_ui::SCREEN_H - 54)) {
              return;
            }

            // UNIVERSAL RIGHT-FLANK CHEVRON TAP (x >= 384, y = 70..395)
            // Steps 1 page cleanly on single taps (or 2 pages on rapid-fire <260ms taps) without erratic jumps!
            if (is_right_chevron_zone(touch)) {
              static uint32_t last_rapid_chev_ms = 0;
              int sign = (touch.y < 220) ? -1 : 1;
              if (id(gui_page) == 2 && (id(music_overlay_mode) == 1 || id(music_overlay_mode) == 3) &&
                  id(music_browse_total_pages) > 1) {
                gest.swipe_committed = true;
                gest.last_swipe_ms = now_touch;
                pocket_ui::music_scroll_tap_lockout_until_ms() = now_touch + 550U;
                uint32_t gap_c = now_touch - last_rapid_chev_ms;
                if (gap_c >= 110U) {
                  last_rapid_chev_ms = now_touch;
                  int delta = sign * ((gap_c < 260U && id(music_browse_total_pages) >= 12) ? 2 : 1);
                  bool wrap_list = (id(music_overlay_mode) == 3) &&
                                   (id(selected_category_mode) == "artist" || id(selected_category_mode) == "album");
                  int next_pg = wrap_list
                      ? step_wrap_1based(id(music_browse_page), delta, id(music_browse_total_pages))
                      : std::max(1, std::min(id(music_browse_total_pages), id(music_browse_page) + delta));
                  if (next_pg != id(music_browse_page)) {
                    id(music_browse_page) = next_pg;
                    pocket_ui::last_music_page_req_ms() = now_touch;
                    id(menu_scroll_active) = true;
                    id(menu_scroll_dir) = sign;
                    id(menu_scroll_target_page) = next_pg;
                    id(menu_scroll_step) = 0;
                    id(menu_scroll_transition).execute();
                    id(fetch_music_browse).execute();
                  }
                }
                return;
              }
            }

            if (id(gui_page) == 1) {
              static uint32_t last_home_tap = 0;
              uint32_t now_hm = millis();

              if (id(home_subpage) == 1) {
                int slot_idx = get_5slot_index(touch, 90, 376);
                if (slot_idx >= 0 && slot_idx <= 4 && (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON)) {
                  last_home_tap = now_hm;
                  if (slot_idx == 0) id(home_dock_music_switch).toggle();
                  else if (slot_idx == 1) id(home_dock_room_switch).toggle();
                  else if (slot_idx == 2) id(home_dock_remote_switch).toggle();
                  else if (slot_idx == 3) id(home_dock_games_switch).toggle();
                  else if (slot_idx == 4) id(home_dock_tools_switch).toggle();
                  pocket_ui::home_dock_page() = 0;
                  pocket_ui::schedule_disp_update(&id(disp1));
                  return;
                }
                if (is_back_button(touch) || touch.y <= 72) {
                  if (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_home_tap = now_hm;
                    id(home_subpage) = 0;
                    id(gui_page) = 4;
                    id(system_menu_mode) = 0;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                return;
              }

              // Top Date Bar & Bottom Battery Chin are intentionally non-clickable on Page 1
              if (id(home_subpage) == 0) {

              // 3. Upper-Right Sun / Moon Celestial Shortcut at (360, 86) -> Open Sun (2) or Moon (3)
              if (id(home_weather_bg_switch).state && touch.x >= 312 && touch.y <= 124) {
                if (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_home_tap = now_hm;
                  std::string s_state = id(ha_sun_state).state;
                  std::string cond = id(ha_weather_condition).state;
                  bool is_night = (s_state == "below_horizon" || cond == "clear-night" || cond == "clearnight" || (cond.find("night") != std::string::npos));
                  apply_weather_sim_override(id(weather_sim_condition).current_option(), cond, is_night);
                  id(sky_weather_subpage) = is_night ? 3 : 2;
                  id(gui_page) = 5;
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
                return;
              }

              // 4. Hero Digital Clock Tap (y in [79..175], x in [95..355]) -> Open Full Clock Page (Page 0)
              if (touch.y >= 79 && touch.y <= 175 && touch.x >= 95 && touch.x <= 355) {
                if (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_home_tap = now_hm;
                  id(gui_page) = 0;
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
                return;
              }

              // 5. Weather Temperature & Condition Line Tap (y in [176..229], x in [70..396]) -> Open Sky & Weather (Current Conditions Subpage 0)
              if (touch.y >= 176 && touch.y <= 229 && touch.x >= 70 && touch.x <= 396) {
                if (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_home_tap = now_hm;
                  id(sky_weather_subpage) = 0;
                  id(gui_page) = 5;
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
                return;
              }

              }

              pocket_ui::HomeActivityItem act_items[8];
              bool is_rem_h = (id(active_speaker_entity) != "${local_player_id}");
              bool loc_play_h = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
              bool mus_play_h = pocket_ui::is_music_playing_effective(is_rem_h, loc_play_h, id(ha_target_state).state, now_hm);
              std::string m_title_h = (is_rem_h || id(track_title).state.empty() || id(track_title).state == "None")
                                          ? id(ha_track_title).state : id(track_title).state;
              std::string m_artist_h = (is_rem_h || id(track_artist).state.empty() || id(track_artist).state == "None")
                                           ? id(ha_track_artist).state : id(track_artist).state;
              auto now_t_hm = id(ha_time).now();
              int act_count = pocket_ui::collect_home_activities(
                  now_hm, id(is_24h_format),
                  id(stopwatch_running), id(stopwatch_start_time), id(stopwatch_elapsed_ms),
                  mus_play_h, m_title_h, m_artist_h,
                  id(alarm_snooze_until),
                  id(alarm1_hour), id(alarm1_minute), id(alarm1_enabled),
                  id(alarm2_hour), id(alarm2_minute), id(alarm2_enabled),
                  id(alarm3_hour), id(alarm3_minute), id(alarm3_enabled),
                  act_items,
                  now_t_hm.is_valid() ? now_t_hm.hour : -1,
                  now_t_hm.is_valid() ? now_t_hm.minute : -1,
                  id(ha_calendar_agenda_raw).state);

              auto handle_activity_item_action = [&](int item_i, bool is_inline_btn) {
                int kind = act_items[item_i].kind;
                int s_idx = act_items[item_i].slot_idx;
                if (is_inline_btn && kind != 5) {
                  if (kind == 1) {
                    auto *t_slots = pocket_ui::timer_slots();
                    int ti = (s_idx >= 0 && s_idx < 3) ? s_idx : 0;
                    auto &s = t_slots[ti];
                    if (s.running) {
                      s.running = false;
                      s.paused = true;
                      s.remaining_sec = (s.target_ms > now_hm) ? static_cast<int>((s.target_ms - now_hm + 999U) / 1000U) : 0;
                    } else {
                      s.running = true;
                      s.paused = false;
                      s.target_ms = now_hm + static_cast<uint32_t>(s.remaining_sec) * 1000U;
                    }
                    pocket_ui::sync_multi_timer_globals(
                        id(timer_running), id(timer_paused), id(timer_remaining_sec),
                        id(timer_duration_sec), id(timer_target_ms));
                  } else if (kind == 2) {
                    if (!id(stopwatch_running)) {
                      id(stopwatch_running) = true;
                      id(stopwatch_start_time) = now_hm - id(stopwatch_elapsed_ms);
                      id(sleep_start_time) = 0;
                    } else {
                      id(stopwatch_running) = false;
                      id(stopwatch_elapsed_ms) = now_hm - id(stopwatch_start_time);
                    }
                  } else if (kind == 3) {
                    id(toggle_ha_music).execute();
                  } else if (kind == 4) {
                    if (s_idx == 0 && id(alarm_snooze_until) > 0) {
                      id(alarm_snooze_until) = 0;
                    } else if (s_idx == 1) {
                      id(alarm1_enabled) = false;
                    } else if (s_idx == 2) {
                      id(alarm2_enabled) = false;
                    } else if (s_idx == 3) {
                      id(alarm3_enabled) = false;
                    }
                  }
                  // If we're in the Translucent Activity Overlay (home_subpage == 2) and fewer than 2 items remain, return to Home!
                  if (id(home_subpage) == 2) {
                    pocket_ui::HomeActivityItem rem_items[8];
                    int rem_cnt = pocket_ui::collect_home_activities(
                        now_hm, id(is_24h_format),
                        id(stopwatch_running), id(stopwatch_start_time), id(stopwatch_elapsed_ms),
                        mus_play_h, m_title_h, m_artist_h,
                        id(alarm_snooze_until),
                        id(alarm1_hour), id(alarm1_minute), id(alarm1_enabled),
                        id(alarm2_hour), id(alarm2_minute), id(alarm2_enabled),
                        id(alarm3_hour), id(alarm3_minute), id(alarm3_enabled),
                        rem_items,
                        now_t_hm.is_valid() ? now_t_hm.hour : -1,
                        now_t_hm.is_valid() ? now_t_hm.minute : -1,
                        id(ha_calendar_agenda_raw).state);
                    if (rem_cnt < 2) {
                      id(home_subpage) = 0;
                      pocket_ui::home_activity_overlay_page() = 0;
                    }
                  }
                  pocket_ui::schedule_disp_update(&id(disp1));
                  return;
                }

                // Left Body Tap -> Open App/Subpage (with tools_direct_home() = true so bottom chin says "Home"!)
                id(home_subpage) = 0;
                pocket_ui::home_dock_page() = 0;
                if (kind == 1) {
                  pocket_ui::tools_direct_home() = true;
                  id(gui_page) = 8;
                  id(stuff_subpage) = 1;
                  pocket_ui::timer_view_slot() = (s_idx >= 0 && s_idx < 3) ? (s_idx + 1) : 0;
                } else if (kind == 2) {
                  pocket_ui::tools_direct_home() = true;
                  id(gui_page) = 8;
                  id(stuff_subpage) = 3;
                } else if (kind == 3) {
                  pocket_ui::tools_direct_home() = false;
                  id(gui_page) = 2;
                  id(music_overlay_mode) = 0;
                  id(music_hud_active) = true;
                  id(music_hud_timer) = now_hm;
                  if (id(active_speaker_entity) != "${local_player_id}" &&
                      id(ha_target_art_url).state != id(current_loaded_art_url)) {
                    id(fetch_remote_art_debounced).execute();
                  }
                } else if (kind == 4) {
                  pocket_ui::tools_direct_home() = true;
                  id(gui_page) = 8;
                  id(stuff_subpage) = 2;
                  id(alarm_edit_idx) = (s_idx >= 1 && s_idx <= 3) ? s_idx : 0;
                } else if (kind == 5) {
                  pocket_ui::tools_direct_home() = true;
                  id(gui_page) = 8;
                  id(stuff_subpage) = 9;
                  id(cal_browse_page) = 1;
                  id(fetch_calendar_browse).execute();
                }
                pocket_ui::schedule_disp_update(&id(disp1));
              };

              // SUBPAGE 2: TRANSLUCENT AUTO-CENTERED LIVE ACTIVITY OVERLAY TOUCH ROUTING
              if (id(home_subpage) == 2) {
                if (is_back_button(touch)) {
                  if (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_home_tap = now_hm;
                    id(home_subpage) = 0;
                    pocket_ui::home_activity_overlay_page() = 0;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                if (act_count > 5 && is_right_chevron_zone(touch)) {
                  if (now_hm - last_home_tap > TOUCH_DEBOUNCE_SCROLL) {
                    last_home_tap = now_hm;
                    pocket_ui::home_activity_overlay_page() = (touch.y < 220) ? 0 : 1;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                int start_i = pocket_ui::home_activity_overlay_page() * 5;
                int vis_cnt = std::min(5, act_count - start_i);
                int hit_row = -1;
                if (touch.x >= 90 && touch.x <= 376 && vis_cnt > 0) {
                  for (int r = 0; r < vis_cnt; r++) {
                    int cy_r = pocket_ui::get_activity_overlay_card_y(vis_cnt, r);
                    if (touch.y >= cy_r - 28 && touch.y <= cy_r + 32) {
                      hit_row = r;
                      break;
                    }
                  }
                }
                if (hit_row >= 0 && (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON)) {
                  last_home_tap = now_hm;
                  handle_activity_item_action(start_i + hit_row, (touch.x >= 320));
                  return;
                }
                // Tapping outside the centered cards on the translucent scrim dismisses the overlay!
                if (now_hm - last_home_tap > TOUCH_DEBOUNCE_DISMISS) {
                  last_home_tap = now_hm;
                  id(home_subpage) = 0;
                  pocket_ui::home_activity_overlay_page() = 0;
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
                return;
              }

              // 7. Live Activity Card Tap on Home (y in [232..296], only active once Wake Greeting has finished):
              //    Acts on feat_idx (the currently rotated or urgency-pinned item shown on the card!)
              const bool greet_blocking = id(home_wake_greeting_switch).state &&
                                          pocket_ui::wake_greeting_latched() &&
                                          (now_hm >= pocket_ui::wake_greeting_start_ms()) &&
                                          (now_hm - pocket_ui::wake_greeting_start_ms() < 10500U);
              if (!greet_blocking && act_count > 0 && touch.y >= 230 && touch.y <= 318 && touch.x >= 35 && touch.x <= 440) {
                if (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_home_tap = now_hm;
                  int feat_idx = pocket_ui::resolve_home_featured_activity_idx(act_items, act_count, now_hm);
                  if (act_count > 1) {
                    if (touch.x >= pocket_ui::SCREEN_CX + 127) {
                      pocket_ui::home_activity_overlay_page() = 0;
                      id(home_subpage) = 2;
                      pocket_ui::schedule_disp_update(&id(disp1));
                      return;
                    }
                    handle_activity_item_action(feat_idx, (touch.x >= pocket_ui::SCREEN_CX + 63));
                  } else {
                    handle_activity_item_action(0, (touch.x >= pocket_ui::SCREEN_CX + 123));
                  }
                }
                return;
              }

              // 8. Bottom Swipeable App Dock & Page Pips Zone (y >= 320):
              //    Handled in on_update (horizontal page swipe) and on_release (stationary icon tap)
              if (touch.y >= 320) {
                return;
              }
              return;
            } else if (id(gui_page) == 2) {
              if (id(music_overlay_mode) == 0) {
                if (touch.x >= 100 && touch.x <= 366 && touch.y <= 85) {
                  static uint32_t last_hdr_tap = 0;
                  uint32_t now_hdr = millis();
                  if (now_hdr - last_hdr_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_hdr_tap = now_hdr;
                    id(music_direct_nav) = false;
                    id(music_overlay_mode) = 5;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }

                std::string overlay_mode = id(music_overlay_style).current_option();
                if (overlay_mode.empty()) overlay_mode = "Art Only";
                bool hud_enabled = (overlay_mode != "Always Visible");
                static uint32_t hud_just_woken_time = 0;

                if (!id(music_hud_active) && overlay_mode == "Art + Metadata" &&
                    touch.x >= 135 && touch.x <= 331 && touch.y >= 340 && touch.y < 405) {
                  static uint32_t last_meta_direct_tap = 0;
                  uint32_t now_md = millis();
                  if (now_md - last_meta_direct_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_meta_direct_tap = now_md;
                    id(music_overlay_mode) = 6;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }

                if (hud_enabled && !id(music_hud_active)) {
                  id(music_hud_active) = true;
                  id(music_hud_timer) = millis();
                  hud_just_woken_time = millis();
                  id(hud_wake_finger_released) = false;
                  pocket_ui::schedule_disp_update(&id(disp1));
                  return;
                }

                if (hud_enabled && (!id(hud_wake_finger_released) || (millis() - hud_just_woken_time < 50))) {
                  return;
                }

                if (touch.x >= 182 && touch.x <= 284 && touch.y >= 180 && touch.y <= 280) {
                  static uint32_t last_pp_tap = 0;
                  uint32_t now_pp = millis();
                  if (now_pp - last_pp_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_pp_tap = now_pp;
                    bool is_remote = (id(active_speaker_entity) != "${local_player_id}");
                    bool local_playing = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
                    bool is_playing = pocket_ui::is_music_playing_effective(is_remote, local_playing, id(ha_target_state).state, now_pp);
                    id(music_action_feedback) = is_playing ? "Pausing..." : "Playing...";
                    id(music_feedback_timer) = now_pp;
                    id(music_hud_timer) = now_pp;
                    id(toggle_ha_music).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }

                if (id(music_show_speaker_shortcut).state &&
                    ((touch.x <= 130 && touch.y >= 70 && touch.y < 192) ||
                     (touch.x > 130 && touch.x <= 176 && touch.y >= 70 && touch.y < 178))) {
                  static uint32_t last_sc_spk_tap = 0;
                  uint32_t now_sc = millis();
                  if (now_sc - last_sc_spk_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_sc_spk_tap = now_sc;
                    id(selected_category_mode) = "speakers";
                    id(selected_category_title) = "SPEAKERS";
                    id(music_browse_page) = 1;
                    id(music_direct_nav) = true;
                    id(music_overlay_mode) = 1;
                    id(fetch_music_browse).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }

                if (id(music_show_library_shortcut).state &&
                    ((touch.x <= 134 && touch.y >= 280 && touch.y < 405) ||
                     (touch.x > 134 && touch.x <= 172 && touch.y >= 284 && touch.y < 360))) {
                  static uint32_t last_sc_lib_tap = 0;
                  uint32_t now_sc = millis();
                  if (now_sc - last_sc_lib_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_sc_lib_tap = now_sc;
                    id(music_category_page) = 1;
                    id(menu_scroll_active) = false;
