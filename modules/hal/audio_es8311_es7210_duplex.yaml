# ==============================================================================
# Latter Board HAL Submodule: Full-Duplex I2S Audio (ES8311 @ 0x18 + ES7210 @ 0x40)
# Parameterized by board substitutions: i2s_lrclk_pin, i2s_bclk_pin, i2s_mclk_pin,
# i2s_din_pin, i2s_dout_pin, audio_out_rate, audio_in_rate.
# ==============================================================================

i2s_audio:
  - id: i2s_shared_bus
    i2s_lrclk_pin:
      number: ${i2s_lrclk_pin}
      ignore_strapping_warning: true
    i2s_bclk_pin: ${i2s_bclk_pin}
    i2s_mclk_pin: ${i2s_mclk_pin}
    full_duplex: true

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_internal
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: ${audio_out_rate}
    mic_gain: 24dB

microphone:
  - platform: i2s_audio
    id: latter_mic_i2s
    adc_type: external
    i2s_audio_id: i2s_shared_bus
    i2s_din_pin: ${i2s_din_pin}
    sample_rate: ${audio_out_rate}
    bits_per_sample: 16bit
    channel: left
  # Converts inside the I2S reader's data callback (no task of its own), so UI load cannot starve it.
  - platform: resampler
    id: latter_mic
    microphone: latter_mic_i2s
    sample_rate: ${audio_in_rate}

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_internal
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: ${audio_out_rate}
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: physical_speaker
    i2s_audio_id: i2s_shared_bus
    i2s_dout_pin: ${i2s_dout_pin}
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: ${audio_out_rate}
    bits_per_sample: 16bit
    channel: left
    buffer_duration: 250ms
    timeout: 4s

script:
  - id: hal_set_dac_mute
    mode: restart
    parameters:
      muted: bool
    then:
      - lambda: |-
          if (muted) {
            id(es8311_dac).set_mute_on();
          } else {
            id(es8311_dac).set_mute_off();
          }

  - id: hal_set_audio_codecs_standby
    mode: restart
    parameters:
      standby: bool
    then:
      - lambda: |-
          latter_ui::hal_set_es8311_es7210_standby(id(bus_internal), standby, true);
