# ==============================================================================
# Latter Board HAL Submodule: AXP2101 PMIC Hardware Driver (modules/hal/pmu_axp2101.yaml)
# Pure chip HAL — zero Universal GUI, audio, or HA entity coupling.
# Included by boards with an AXP2101 PMU @ 0x34 alongside modules/battery_service.yaml.
#
# Board contract:
#   - No supported board routes AXP_IRQ to the SoC. All AXP2101 IRQs are masked at boot and the
#     PWR key is read directly from its GPIO (SYS_OUT / PWR_KEY net) as binary_sensor `pwr_key`,
#     defined in the board HAL with latter_core.power.pwr_key_pin / pwr_key_active_high.
#   - Optional rail / TS traits consumed by latter_core::hal_init_axp2101() (include/hal_battery.h):
#     LATTER_PMU_TS_DISABLE, LATTER_PMU_DCDC_KEEP_MASK, LATTER_PMU_LDO_KEEP_MASK.
#   - LATTER_BATTERY_MAH (the fitted cell): charge profile, state of charge, low-battery warning, and
#     cutoff all derive from it in include/hal_battery.h.
#   - Registers hardware hooks on latter_core::runtime_state() at boot priority 850 and emits
#     hardware events via on_pwr_key_*, on_usb_power_changed, on_battery_status_updated, and
#     on_battery_sample_updated callbacks (bound by modules/battery_service.yaml).
# ==============================================================================

esphome:
  on_boot:
    - priority: 850
      then:
        - lambda: |-
            auto &rs = latter_core::runtime_state();
            rs.hw_usb_connected = false;
            rs.hw_batt_charging = false;
            rs.hw_batt_level = NAN;
            rs.hw_batt_voltage = NAN;
            rs.hw_boot_battery_check = +[]() {
              id(hal_boot_battery_check).execute();
            };
            rs.hw_init_pmu = +[]() {
              id(hal_init_pmu).execute();
            };
            rs.hw_poll_pmu_1s = +[]() {
              id(hal_poll_pmu_1s).execute();
            };
            rs.hw_pwr_key_pressed = +[]() -> bool {
              return id(pwr_key).state;
            };

binary_sensor:
  # Forward PWR key edges to the platform battery/button service (modules/battery_service.yaml).
  # The AXP2101 keeps its own hardware power-on and hard power-off (PWRON long hold) behavior.
  - id: !extend pwr_key
    on_press:
      - lambda: |-
          if (auto fn = latter_core::runtime_state().on_pwr_key_press; fn != nullptr) {
            fn();
          }
    on_release:
      - lambda: |-
          if (auto fn = latter_core::runtime_state().on_pwr_key_release; fn != nullptr) {
            fn();
          }

script:
  # First thing in on_boot (system_core.yaml, priority 800): a cell clearly past the cutoff on battery powers
  # straight back off before the display and Wi-Fi start (latter_core::hal_axp2101_boot_battery_check).
  - id: hal_boot_battery_check
    mode: single
    then:
      - lambda: 'latter_core::hal_axp2101_boot_battery_check(id(bus_internal));'

  - id: hal_init_pmu
    mode: restart
    then:
      - lambda: |-
          // Mask all AXP2101 IRQs (no IRQ line is routed), apply board rail / TS / charger traits,
          // and log the resulting PMIC configuration for the board facts ledger.
          latter_core::hal_init_axp2101(id(bus_internal));

  - id: hal_poll_pmu_1s
    mode: restart
    then:
      - lambda: |-
          // AXP2101 polling from the 1 s supervisor tick (no timers of its own, never the awake lock):
          // REG00 (VBUS, battery present) every second, every 5 s in screen-off quiet on battery;
          // REG01 (charger) only while VBUS is present; VBAT into the battery model on its own cadence
          // (include/hal_battery.h: 10 s awake or docked, 60 s in quiet, 10 s again near the cutoff).
          // Skipped during an active voice turn to keep bus_internal quiet.
          auto &rs = latter_core::runtime_state();
          auto &bm = latter_core::battery_model();
          const bool near_cutoff = !rs.hw_usb_connected &&
              (bm.cutoff_below_count > 0 || (bm.has_sample && bm.vrest_mv <= latter_core::BatteryModel::kFastSampleMv));
          if ((rs.voice.active || rs.voice.tts_received) && !near_cutoff) return;
          const uint32_t now_b = millis();
          const bool audio_load = rs.audio.speaker_enabled() ||
                                  rs.audio.local_mp_playing() ||
                                  rs.audio.local_mp_announcing();
          const bool quiet = !rs.hw_usb_connected && rs.nav.display_power_state == 2 && !audio_load;

          static uint32_t last_stat0_ms = 0;
          static bool bat_present = true;
          static bool usb_seeded = false;
          bool vbus = rs.hw_usb_connected;
          if (!quiet || last_stat0_ms == 0 || (now_b - last_stat0_ms) >= 5000U) {
            last_stat0_ms = (now_b == 0) ? 1U : now_b;
            uint8_t reg0 = 0x00;
            uint8_t stat0 = 0;
            if (id(bus_internal).write_readv(0x34, &reg0, 1, &stat0, 1) == esphome::i2c::ERROR_OK) {
              const bool vbus_good = (stat0 & 0x20) != 0;
              bat_present = (stat0 & 0x08) != 0;
              // If powered via the UART USB-C port with no LiPo battery attached (bat_present == false),
              // the board is running on USB 5V power even though AXP2101 VBUS_IN is unpowered!
              vbus = vbus_good || !bat_present;
              if (!usb_seeded || rs.hw_usb_connected != vbus) {
                usb_seeded = true;
                rs.hw_usb_connected = vbus;
                if (rs.on_usb_power_changed != nullptr) {
                  rs.on_usb_power_changed(vbus);
                }
              }
            }
          }

          // Charger state (REG01, only while VBUS is present): bits 6:5 current direction (1 = charging),
          // bits 2:0 charger phase. On battery the charger is idle by definition.
          uint8_t chg_state = static_cast<uint8_t>(latter_core::ChargePhase::IDLE);
          bool is_charging = false;
          bool stat1_valid = !vbus;
          static uint8_t last_stat1 = 0xFF;
          if (vbus) {
            uint8_t reg1 = 0x01;
            uint8_t stat1 = 0;
            if (id(bus_internal).write_readv(0x34, &reg1, 1, &stat1, 1) == esphome::i2c::ERROR_OK) {
              stat1_valid = true;
              chg_state = stat1 & 0x07;
              is_charging = (((stat1 >> 5) & 0x03) == 1) && (chg_state < 4);
              if ((stat1 & 0x67) != last_stat1) {  // direction + phase (other bits may toggle)
                last_stat1 = stat1 & 0x67;
                if (!bm.fault && latter_core::profiler_enabled()) {
                  uint8_t r0 = 0, r50 = 0, r48 = 0, r36 = 0, r37 = 0;
                  uint8_t rr = 0x00;
                  id(bus_internal).write_readv(0x34, &rr, 1, &r0, 1);
                  rr = 0x50;
                  id(bus_internal).write_readv(0x34, &rr, 1, &r50, 1);
                  rr = 0x48;
                  id(bus_internal).write_readv(0x34, &rr, 1, &r48, 1);
                  rr = 0x36;
                  id(bus_internal).write_readv(0x34, &rr, 1, &r36, 1);
                  rr = 0x37;
                  id(bus_internal).write_readv(0x34, &rr, 1, &r37, 1);
                  LATTER_PROF_LOGI("[PROF:POWER] trig=CHG_STATE stat0=0x%02X stat1=0x%02X phase=%u dir=%u ts_cfg=0x%02X ts_raw=%u temp_irq=0x%X",
                           r0, stat1, (unsigned)chg_state, (unsigned)((stat1 >> 5) & 0x03), r50,
                           (unsigned)(((r36 & 0x3F) << 8) | r37), (unsigned)(r48 & 0x0F));
                }
              }
            } else {
              is_charging = rs.hw_batt_charging;
            }
          } else {
            last_stat1 = 0xFF;
          }
          if (bat_present && stat1_valid) {
            bm.note_charger_phase(vbus, static_cast<latter_core::ChargePhase>(chg_state), now_b);
          }
          static bool fault_logged = false;
          if (bm.fault && !fault_logged) {
            ESP_LOGW("PROF", "[PROF:POWER] trig=BATT_FAULT vraw=%dmV cycles=%u", bm.vraw_mv,
                     (unsigned)bm.rapid_done_cycles);
          }
          fault_logged = bm.fault;
          if (stat1_valid) {
            latter_core::hal_axp2101_thermal_charge_foldback(id(bus_internal), is_charging);
            const bool pub_charging = is_charging && !bm.fault;
            rs.hw_batt_charging = pub_charging;
            const char *chg_text =
                bat_present ? latter_core::battery_charge_state_text(!vbus, chg_state, bm.fault) : "No Battery";
            if (rs.on_battery_status_updated != nullptr) {
              rs.on_battery_status_updated(pub_charging, chg_text);
            }
          }

          // Battery model: VBAT (REG34/35), AXP2101 OTP gauge telemetry (REG A4), load class, and cutoff.
          if (bat_present && bm.sample_due(now_b, quiet)) {
            uint8_t vreg = 0x34;
            uint8_t vbuf[2] = {0, 0};
            if (id(bus_internal).write_readv(0x34, &vreg, 1, vbuf, 2) == esphome::i2c::ERROR_OK) {
              const int vbat_mv = ((vbuf[0] & 0x3F) << 8) | vbuf[1];
              const int hw_gauge = latter_core::hal_axp2101_read_gauge_pct(id(bus_internal));
              if (hw_gauge >= 0) {
                latter_core::pmu_telemetry().gauge_raw = hw_gauge;
              }
              latter_core::BattLoad load = latter_core::BattLoad::QUIET;
              if (audio_load) {
                load = latter_core::BattLoad::AUDIO;
              } else if (rs.nav.display_power_state != 2) {
                load = latter_core::BattLoad::SCREEN;
              }
              // Pass -1 for hw_gauge_pct: AXP2101 REG A4 OTP gauge is uncalibrated telemetry only.
              const bool cutoff = bm.update(
                  vbat_mv, !vbus, static_cast<latter_core::ChargePhase>(chg_state),
                  load, now_b, -1, latter_core::kBattCapacityMah,
                  latter_core::pmu_telemetry().icc_ma);
              latter_core::hal_battery_save_rtc_snapshot(bm);
              rs.hw_batt_level = std::isnan(bm.soc_display) ? NAN : std::round(bm.soc_display);
              if (bm.vraw_mv > 0) {
                rs.hw_batt_voltage = static_cast<float>(bm.vraw_mv) / 1000.0f;
              }
              if (rs.on_battery_sample_updated != nullptr) {
                rs.on_battery_sample_updated(cutoff);
              }
            }
          }
