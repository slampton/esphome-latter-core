# ==============================================================================
# Latter Board HAL Submodule: Shared ESP32-S3 SoC, Octal PSRAM & Light Sleep
# Included by ESP32-S3 battery display board HALs under boards/
# ==============================================================================

substitutions:
  pm_profiling: "false"
  wake_profiling: "n"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_PERF: "y"
      CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM: "y"
      CONFIG_FREERTOS_USE_TRACE_FACILITY: "y"  # task list for the System: Log Memory Report button
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "64"
      CONFIG_LWIP_TCP_WND_DEFAULT: "65535"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "64"
      # Maximize ESP32-S3 L1 Data & Instruction Caches (64KB D-Cache / 64B line, 32KB I-Cache)
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      # Execute instructions and read-only data from 80MHz Octal PSRAM
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      # Offload Wi-Fi/LwIP, .bss, mbedTLS, and >=256B heap allocations to 8MB Octal PSRAM
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "256"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      # Light-sleep wake pins arm inside ESP-IDF's light-sleep callbacks (include/hal_power_pm.h).
      # Keep the CPU + 32KB/64KB cache-tagmem domain clock-gated rather than rail-powered-down in light
      # sleep: avoids dual-core Octal PSRAM XIP I-cache refill wedges post-ls-out (ESP-IDF #19355) and
      # reclaims ~8.6 KB of internal SRAM otherwise reserved for CPU/tagmem retention DMA buffers.
      CONFIG_PM_LIGHT_SLEEP_CALLBACKS: "y"
      CONFIG_PM_POWER_DOWN_CPU_IN_LIGHT_SLEEP: "n"
      # Light-sleep Wi-Fi wake timing (never CONFIG_RTC_CLK_SRC_INT_8MD256)
      CONFIG_ESP_WIFI_SLP_IRAM_OPT: "y"
      CONFIG_PM_SLP_IRAM_OPT: "y"
      CONFIG_PM_RTOS_IDLE_OPT: "y"
      CONFIG_ESP_WIFI_SLP_BEACON_LOST_OPT: "y"
      CONFIG_ESP_WIFI_SLP_BEACON_LOST_OVER_THRESHOLD_RECEIVE: "y"
      CONFIG_ESP_WIFI_SLP_BEACON_LOST_THRESHOLD: "2"
      CONFIG_ESP_WIFI_SLP_PHY_ON_DELTA_EARLY_TIME: "16"
      CONFIG_ESP_WIFI_SLP_PHY_OFF_DELTA_TIMEOUT_TIME: "4"
      # Fewer periodic wakes in light sleep: lwIP DHCP coarse timer every 10 s (default 1 s) and
      # mDNS timer every 500 ms (default 100 ms).
      CONFIG_LWIP_DHCP_COARSE_TIMER_SECS: "10"
      CONFIG_MDNS_TIMER_PERIOD_MS: "500"
      CONFIG_ESP_PANIC_HANDLER_IRAM: "y"
      CONFIG_ESP_TIMER_PROFILING: ${wake_profiling}
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: ${wake_profiling}
    advanced:
      enable_idf_experimental_features: true
      nvs_cache_in_psram: true

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

# Automatic light sleep whenever no task runs and no power-management lock is held. Latter's awake lock
# (script apply_power_policy, include/hal_power_pm.h) keeps the chip awake except in screen-off quiet on
# battery. Keeping min_frequency at 80MHz avoids BBPLL/XTAL speed-mode retuning of 80MHz Octal PSRAM
# during sub-millisecond awake slices while hardware light sleep still gates PLL/clocks in idle.
power_management:
  - platform: esp32_power_management
    max_frequency: 240MHz
    min_frequency: 80MHz
    enable_light_sleep: true
    profiling: ${pm_profiling}
