# ==============================================================================
# Latter Board HAL Submodule: Shared ESP32-P4 SoC & 200MHz PSRAM
# Included by ESP32-P4 display board HALs under boards/.
# Boards with an ESP32-C6 SDIO radio also include modules/hal/radio_esp32c6_sdio.yaml;
# Ethernet-only P4 boards omit radio_esp32c6_sdio.yaml.
# ==============================================================================

substitutions:
  wake_profiling: "n"

esp32:
  variant: esp32p4
  # rev1.x builds only boot rev1.x silicon and rev3.x builds only boot rev3.x silicon (see p4_silicon).
  engineering_sample: ${p4_engineering_sample}
  cpu_frequency: ${p4_cpu_frequency}
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0: "n"
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU1: "n"
      CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM: "y"
      CONFIG_FREERTOS_USE_TRACE_FACILITY: "y"  # eTaskGetState() in Stall Guard and wake_profiling task CPU stats
      CONFIG_COMPILER_OPTIMIZATION_PERF: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "128"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      CONFIG_ESP_TIMER_IN_IRAM: "y"  # IRAM-safe touch GPIO ISR wake timer on battery quiet-loop P4 boards
      CONFIG_ESP_TIMER_PROFILING: ${wake_profiling}
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: ${wake_profiling}
    advanced:
      enable_idf_experimental_features: true
      flash_chip: generic

psram:
  speed: 200MHz
  ignore_not_found: false

logger:
  hardware_uart: UART0

esp_ldo:
  - channel: 3
    voltage: 2.5V
