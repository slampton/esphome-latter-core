# ==============================================================================
# Latter Board HAL Submodule: QMI8658 6-Axis IMU Hardware Driver
# (modules/hal/imu_qmi8658.yaml)
# Pure chip HAL — zero Universal GUI, audio, or UX coupling.
# Maps generic latter_core::ImuPowerMode onto QMI8658 CTRL7 / WoM registers.
# Included by boards with a physical QMI8658 IMU @ 0x6B (1.75C, 2.06, 2.16).
# ==============================================================================

esphome:
  on_boot:
    - priority: 850
      then:
        - lambda: |-
            latter_core::runtime_state().hw_set_imu_power_mode = +[](latter_core::ImuPowerMode mode) {
              id(hal_set_imu_power_mode).execute(static_cast<int>(mode));
            };

motion:
  - platform: qmi8658
    id: imu
    address: 0x6B
    accelerometer_range: 4G
    gyroscope_range: 2048DPS
    update_interval: 100ms

sensor:
  - platform: motion
    motion_id: imu
    type: acceleration_x
    name: "Accel X"
    id: accel_x
    internal: true
    on_value:
      - lambda: 'latter_core::runtime_state().hw_accel_x = x;'
  - platform: motion
    motion_id: imu
    type: acceleration_y
    name: "Accel Y"
    id: accel_y
    internal: true
    on_value:
      - lambda: 'latter_core::runtime_state().hw_accel_y = x;'
  - platform: motion
    motion_id: imu
    type: acceleration_z
    name: "Accel Z"
    id: accel_z
    internal: true
    on_value:
      - lambda: 'latter_core::runtime_state().hw_accel_z = x;'
  - platform: motion
    motion_id: imu
    type: roll
    name: "Roll"
    id: imu_roll
    internal: true
    on_value:
      - lambda: 'latter_core::runtime_state().hw_imu_roll = x;'
  - platform: motion
    motion_id: imu
    type: pitch
    name: "Pitch"
    id: imu_pitch
    internal: true
    on_value:
      - lambda: 'latter_core::runtime_state().hw_imu_pitch = x;'

  - platform: qmi8658
    name: "IMU Temperature"
    id: imu_temp
    entity_category: diagnostic
    disabled_by_default: true
    filters:
      - throttle: 180s
      - delta: 1.5
    on_value:
      - lambda: 'latter_core::runtime_state().hw_imu_temp = x;'

# QMI8658 INT1 (board HAL substitution imu_int1_pin). Push-pull while Wake-on-Motion is armed and
# High-Z otherwise, so the pull-down holds it low. WoM toggles the line on every event, so both edges
# are handled and STATUS1 decides whether an edge was a real event (include/hal_imu_qmi8658.h).
binary_sensor:
  - platform: gpio
    id: imu_int1
    internal: true
    pin:
      number: ${imu_int1_pin}
      mode:
        input: true
        pulldown: true
    on_state:
      then:
        - lambda: |-
            if (!latter_core::imu_wom().armed) return;
            if (!latter_core::hal_imu_wom_event(id(bus_internal))) return;
            const uint32_t now_wom = millis();
            auto &wom = latter_core::imu_wom();
            wom.events++;
            latter_core::pm_note_imu(wom.armed, wom.events);
            // Poll orientation at 50 ms for a short window so RaiseToWakeDetector confirms fast pickups (< 200 ms).
            wom.qualify_until_ms = (now_wom + 2500U) | 1U;
            LATTER_PROF_LOGI("[PROF:IMU] wom=event n=%u", static_cast<unsigned>(wom.events));
            id(hal_set_imu_power_mode).execute(static_cast<int>(latter_core::ImuPowerMode::AccelOnly));
            if (auto fn = latter_core::runtime_state().on_imu_wom_wake; fn != nullptr) {
              fn(now_wom);
            }

script:
  - id: hal_set_imu_power_mode
    mode: restart
    parameters:
      mode_id: int
    then:
      - lambda: |-
          // Maps generic latter_core::ImuPowerMode onto QMI8658 CTRL7 (REG 0x08) or hardware
          // Wake-on-Motion on INT1 (falls back to AccelOnly if the CTRL9 handshake ever fails).
          using Mode = latter_core::ImuPowerMode;
          static int last_mode = -1;
          static uint32_t last_imu_ms = 100U;
          Mode mode = static_cast<Mode>(mode_id);
          if (mode == Mode::WakeOnMotion && latter_core::imu_wom().failed) {
            mode = Mode::AccelOnly;
          }
          const bool polled = (mode == Mode::AccelOnly || mode == Mode::AccelAndGyro);
          const uint32_t want_imu_ms =
              (polled && latter_core::imu_wom_qualifying(millis())) ? 50U : 100U;
          if (polled && want_imu_ms != last_imu_ms) {
            last_imu_ms = want_imu_ms;
            id(imu).set_update_interval(want_imu_ms);
            if (static_cast<int>(mode) == last_mode) {
              id(imu).start_poller();
            }
          }
          if (static_cast<int>(mode) == last_mode) return;
          last_mode = static_cast<int>(mode);
          auto &rs = latter_core::runtime_state();
          if (mode == Mode::WakeOnMotion) {
            rs.hw_motion_mag = 0.0f;
            id(imu).stop_poller();
            if (rs.on_motion_poller_changed != nullptr) {
              rs.on_motion_poller_changed(false);
            }
            float thresh = latter_core::get_pickup_motion_threshold(false);
            if (rs.audio.speaker_enabled() && thresh < 0.22f) thresh = 0.22f;
            if (latter_core::hal_imu_wom_enter(id(bus_internal), latter_core::imu_wom_threshold_mg(thresh))) return;
            mode = Mode::AccelOnly;
            last_mode = static_cast<int>(Mode::AccelOnly);
          }
          latter_core::hal_imu_wom_exit(id(bus_internal));
          if (mode != Mode::Off) {
            if (want_imu_ms != last_imu_ms) {
              last_imu_ms = want_imu_ms;
              id(imu).set_update_interval(want_imu_ms);
            }
            id(imu).start_poller();
            if (rs.on_motion_poller_changed != nullptr) {
              rs.on_motion_poller_changed(true);
            }
          } else {
            rs.hw_motion_mag = 0.0f;
            id(imu).stop_poller();
            if (rs.on_motion_poller_changed != nullptr) {
              rs.on_motion_poller_changed(false);
            }
          }
          uint8_t qmi_ctrl7[2] = {0x08, latter_core::qmi8658_ctrl7_for_power_mode(mode)};
          id(bus_internal).write(0x6B, qmi_ctrl7, 2);
