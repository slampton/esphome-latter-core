# ==============================================================================
# Latter Board HAL Submodule: QMI8658 6-Axis IMU Sensors & Shake Detector
# (modules/hal/imu_qmi8658.yaml)
# Included by boards that have a physical QMI8658 IMU @ 0x6B (1.75C, 2.06, 2.16)
# ==============================================================================

esphome:
  on_boot:
    - priority: 850
      then:
        - lambda: |-
            latter_ui::runtime_state().hw_set_imu_power_mode = +[](int ctrl7_val) {
              id(hal_set_imu_power_mode).execute(ctrl7_val);
            };

motion:
  - platform: qmi8658
    id: imu
    address: 0x6B
    accelerometer_range: 4G
    gyroscope_range: 2048DPS
    update_interval: 100ms

sensor:
  - platform: motion
    motion_id: imu
    type: acceleration_x
    name: "Accel X"
    id: accel_x
    internal: true
    on_value:
      - lambda: 'latter_ui::runtime_state().hw_accel_x = x;'
  - platform: motion
    motion_id: imu
    type: acceleration_y
    name: "Accel Y"
    id: accel_y
    internal: true
    on_value:
      - lambda: 'latter_ui::runtime_state().hw_accel_y = x;'
  - platform: motion
    motion_id: imu
    type: acceleration_z
    name: "Accel Z"
    id: accel_z
    internal: true
    on_value:
      - lambda: 'latter_ui::runtime_state().hw_accel_z = x;'
  - platform: motion
    motion_id: imu
    type: roll
    name: "Roll"
    id: imu_roll
    internal: true
    on_value:
      - lambda: 'latter_ui::runtime_state().hw_imu_roll = x;'
  - platform: motion
    motion_id: imu
    type: pitch
    name: "Pitch"
    id: imu_pitch
    internal: true
    on_value:
      - lambda: 'latter_ui::runtime_state().hw_imu_pitch = x;'

  - platform: qmi8658
    name: "IMU Temperature"
    id: imu_temp
    entity_category: diagnostic
    disabled_by_default: true
    filters:
      - throttle: 180s
      - delta: 1.5
    on_value:
      - lambda: 'latter_ui::runtime_state().hw_imu_temp = x;'

  - platform: template
    name: "Dynamic Motion Delta"
    id: motion_mag
    unit_of_measurement: "g"
    accuracy_decimals: 3
    update_interval: 200ms
    internal: true
    lambda: |-
      auto &rs = latter_ui::runtime_state();
      if (rs.nav.display_power_state != 0) {
        const std::string_view pw_mode = latter_ui::pref_pickup_to_wake_cstr();
        if (pw_mode == "Disabled" || (pw_mode == "Docked Only" && !rs.hw_usb_connected)) {
          rs.hw_motion_mag = 0.0f;
          return 0.0f;
        }
      }
      float x = id(accel_x).state;
      float y = id(accel_y).state;
      float z = id(accel_z).state;
      if (isnan(x) || isnan(y) || isnan(z)) {
        rs.hw_motion_mag = NAN;
        return NAN;
      }

      static float grav_x = 0.0f;
      static float grav_y = 0.0f;
      static float grav_z = 1.0f;
      const float alpha = 0.20f;
      grav_x = (1.0f - alpha) * grav_x + alpha * x;
      grav_y = (1.0f - alpha) * grav_y + alpha * y;
      grav_z = (1.0f - alpha) * grav_z + alpha * z;

      float dx = x - grav_x;
      float dy = y - grav_y;
      float dz = z - grav_z;
      float delta = sqrtf(dx*dx + dy*dy + dz*dz);
      float planar_dyn = sqrtf(dx*dx + dy*dy);

      if (rs.nav.gui_page == 8 && rs.nav.display_power_state == 0) {
        static uint32_t last_shake_time = 0;
        uint32_t now_m = millis();
        bool is_deliberate_shake = (planar_dyn >= 0.46f || delta >= 0.49f);
        if (is_deliberate_shake && (now_m - last_shake_time > 1200)) {
          last_shake_time = now_m;
          if (rs.nav.tools_subpage == 8 && !latter_ui::coin_state().anim_active) {
            latter_ui::trigger_coin_flip(now_m, esp_random());
          } else if (rs.nav.tools_subpage == 4 && !latter_ui::dice_state().anim_active) {
            latter_ui::trigger_dice_roll(now_m, esp_random(), esp_random());
          }
        }
      }
      rs.hw_motion_mag = delta;
      return delta;

# QMI8658 INT1 (board HAL substitution imu_int1_pin). Push-pull while Wake-on-Motion is armed and
# High-Z otherwise, so the pull-down holds it low. WoM toggles the line on every event, so both edges
# are handled and STATUS1 decides whether an edge was a real event (include/hal_imu_qmi8658.h).
binary_sensor:
  - platform: gpio
    id: imu_int1
    internal: true
    pin:
      number: ${imu_int1_pin}
      mode:
        input: true
        pulldown: true
    on_state:
      then:
        - lambda: |-
            if (!latter_ui::imu_wom().armed) return;
            if (!latter_ui::hal_imu_wom_event(id(bus_internal))) return;
            auto &wom = latter_ui::imu_wom();
            wom.events++;
            latter_ui::pm_note_imu(wom.armed, wom.events);
            // Poll for a short window so the orientation-qualified RaiseToWakeDetector can confirm a raise.
            wom.qualify_until_ms = (millis() + 2500U) | 1U;
            LATTER_PROF_LOGI("[PROF:IMU] wom=event n=%u", static_cast<unsigned>(wom.events));
            id(hal_set_imu_power_mode).execute(0x01);

script:
  - id: hal_set_imu_power_mode
    mode: restart
    parameters:
      ctrl7_val: int
    then:
      - lambda: |-
          // 0x00 power-down, 0x01 accel, 0x03 accel + gyro (all polled), 0x80 hardware Wake-on-Motion
          // on INT1 with polling stopped (falls back to 0x01 if the CTRL9 handshake ever fails).
          static int last_ctrl7 = -1;
          int mode = ctrl7_val;
          if (mode == 0x80 && latter_ui::imu_wom().failed) mode = 0x01;
          if (mode == last_ctrl7) return;
          last_ctrl7 = mode;
          if (mode == 0x80) {
            id(imu).stop_poller();
            id(motion_mag).stop_poller();
            float thresh = latter_ui::get_pickup_motion_threshold(false);
            if (id(speaker_enable).state && thresh < 0.22f) thresh = 0.22f;
            if (latter_ui::hal_imu_wom_enter(id(bus_internal), latter_ui::imu_wom_threshold_mg(thresh))) return;
            mode = 0x01;
            last_ctrl7 = 0x01;
          }
          latter_ui::hal_imu_wom_exit(id(bus_internal));
          if (mode > 0) {
            id(imu).start_poller();
            id(motion_mag).start_poller();
          } else {
            id(imu).stop_poller();
            id(motion_mag).stop_poller();
          }
          // QMI8658 CTRL7 (0x08): 0x03 = Active (Accel+Gyro), 0x01 = Accel-only, 0x00 = Power-Down
          uint8_t qmi_ctrl7[2] = {0x08, static_cast<uint8_t>(mode)};
          id(bus_internal).write(0x6B, qmi_ctrl7, 2);
