    on_value:
      then:
        - script.execute: sync_display_brightness

  - platform: template
    name: "Display: Night Start Hour"
    id: night_start_hour
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 0
    max_value: 23
    step: 1
    unit_of_measurement: "h"
    on_value:
      then:
        - script.execute: sync_display_brightness

  - platform: template
    name: "Sound: Speaker Volume"
    id: speaker_volume
    optimistic: true
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 60
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
    icon: "mdi:volume-medium"
    entity_category: config
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x) || !latter_ui::speaker_volume_boot_synced()) return;
            float target_v = std::clamp(x / 100.0f, 0.10f, 1.00f);
            float cur_v = id(latter_media_player).volume;
            if (std::isnan(cur_v) || std::fabs(cur_v - target_v) >= 0.005f) {
              id(latter_media_player).volume = target_v;
              id(latter_media_player).make_call().set_volume(target_v).perform();
            }

  - platform: template
    name: "Sound: Volume Step Size"
    id: volume_step_size
    optimistic: true
    min_value: 1
    max_value: 10
    step: 1
    initial_value: 5
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
    icon: "mdi:volume-step"
    entity_category: config

