      - "Custom"
    set_action:
      - lambda: |-
          id(power_profile_select).publish_state(x);
          const auto prof = latter_ui::parse_power_profile(x);
          if (millis() <= 2500 || prof == latter_ui::PowerProfile::CUSTOM) {
            latter_ui::schedule_disp_update(&id(disp1));
            return;
