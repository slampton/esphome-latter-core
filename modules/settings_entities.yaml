# ==============================================================================
# Latter Core Module: User-Facing Settings & Action Entities
# (modules/settings_entities.yaml)
# Consolidated Select, Button, Switch, and Number entities across Sleep & Wake,
# Voice, Music, Display, Home, Area, Sound, and System Diagnostics.
# Zero YAML globals: reads/writes latter_ui::runtime_state() & persisted_prefs().
# ==============================================================================

select:
  # When the BLE presence beacon advertises on battery devices (see evaluate_radio_policy). The default
  # keeps Bluetooth off while docked, where the wake-word voice assistant needs the internal RAM, and
  # off with the screen off on battery, where it would block automatic light sleep. "Always" is the
  # user's override: Bluetooth then runs alongside the docked wake word.
  - platform: template
    name: "Area: Presence Beacon Mode"
    id: ble_beacon_mode_select
    icon: "mdi:bluetooth-connect"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Handheld Only"
    options:
      - "Handheld Only"
      - "Handheld + Screen Off"
      - "Always"
    set_action:
      - lambda: 'id(apply_power_policy).execute();'

  - platform: template
    name: "Voice: Wake Word Mode"
    id: va_wake_word_mode
    icon: "mdi:account-tie-voice"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Docked Only"
    options:
      - "Docked Only"
      - "Always On"
      - "Disabled"
    set_action:
      - lambda: |-
          id(va_wake_word_mode).publish_state(x);
          latter_ui::mark_power_profile_custom_if_manual(id(power_profile_select));
          latter_ui::schedule_disp_update(&id(disp1));
      - script.execute: sync_wake_word_state
      - if:
          condition:
            lambda: 'return x != "Always On";'
          then:
            - script.execute: media_idle_finish

  # Which wake words are active is Home Assistant's Assist satellite Wake Word / Wake Word 2 setting
  # (micro_wake_word keeps it across reboots); Settings > Voice changes it through the same call
  # (esphome_bridge.h cycle_primary_wake_word).

