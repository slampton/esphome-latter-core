button:
  - platform: restart
    name: "Internal Restart"
    id: internal_restart
    internal: true

  # Reset to defaults: erases the whole NVS partition (every saved setting, plus the Wi-Fi driver's
  # cached network data and RF calibration) and reboots. Wi-Fi credentials and the API key are
  # compiled in, so the device rejoins Home Assistant unchanged. Internal: Latter triggers it through
  # the latter_factory_reset action (Studio "Reset to defaults" / latter.reset_device).
  - platform: factory_reset
    name: "Internal Factory Reset"
    id: internal_factory_reset
    internal: true

  - platform: template
    name: "System: Log Memory Report"
    id: log_memory_report_button
    icon: "mdi:memory"
    entity_category: diagnostic
    on_press:
      - lambda: 'latter_ui::log_memory_report();'

  - platform: template
    name: "Actions: Restart Device"
    id: restart_button
    entity_category: diagnostic
    on_press:
      - light.turn_off: display_brightness
      - component.update: disp1
      - delay: 100ms
      - button.press: internal_restart

  - platform: template
    name: "Actions: Trigger Voice Assistant"
    id: trigger_va_button
    entity_category: config
    on_press:
      - script.execute: toggle_voice_assistant

  - platform: template
    name: "Actions: Screensaver Now"
    id: trigger_screensaver_btn
    icon: "mdi:weather-night"
    entity_category: config
    on_press:
      - script.execute: trigger_screensaver_now

  - platform: template
    name: "Actions: Find My Device"
    id: find_my_button
    icon: "mdi:radar"
    entity_category: config
    on_press:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          if (!rs.alarms.find_my_active) {
            if (rs.voice.active || !rs.voice.status_text.empty()) {
              id(cancel_voice_assistant).execute();
            }
            rs.alarms.find_my_active = true;
            rs.alarms.find_my_start_ms = millis();
            latter_ui::note_wake_reason(latter_ui::WakeReason::ALERT);
            id(wake_to_active_state).execute();
            id(play_alarm_sound).execute();
            latter_ui::schedule_disp_update(&id(disp1));
          } else {
            rs.alarms.find_my_active = false;
            id(stop_alarm_sound).execute();
            id(sync_display_brightness).execute();
            latter_ui::schedule_disp_update(&id(disp1));
            id(screen_sleep_timer).execute();
          }

switch:
  - platform: template
    name: "Sleep & Wake: Hold Crown Power Off"
    id: instant_crown_hibernate_switch
    entity_category: config
    icon: "mdi:lightning-bolt"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(instant_crown_hibernate_switch).publish_state(true);'
    turn_off_action:
      - lambda: 'id(instant_crown_hibernate_switch).publish_state(false);'

  - platform: template
    name: "Sleep & Wake: Docked Screensaver"
    id: docked_screensaver_switch
    icon: "mdi:power-sleep"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(docked_screensaver_switch).publish_state(true);
          if (latter_ui::runtime_state().nav.display_power_state == 0) {
            id(screen_sleep_timer).execute();
          }
    turn_off_action:
      - lambda: |-
          id(docked_screensaver_switch).publish_state(false);
          if (latter_ui::runtime_state().nav.display_power_state == 1) {
            #if LATTER_IS_STATIONARY
            id(wake_to_active_state).execute();
            #else
            id(turn_screen_off).execute();
            #endif
