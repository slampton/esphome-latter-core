# ==============================================================================
# Latter Core Module: AXP2101 PMIC Hardware Driver (modules/pmu_axp2101.yaml)
# Included by boards with an AXP2101 PMU @ 0x34 (S3-1.75C, S3-2.06, S3-2.16, P4-3.5)
#
# Board contract:
#   - No supported board routes AXP_IRQ to the SoC. All AXP2101 IRQs are masked at boot and the
#     PWR key is read directly from its GPIO (SYS_OUT / PWR_KEY net) as binary_sensor `pwr_key`,
#     defined in the board HAL with LATTER_PWR_KEY_PIN / LATTER_PWR_KEY_ACTIVE_HIGH build flags.
#   - Optional rail / TS traits consumed by latter_ui::hal_init_axp2101() (include/ui_system.h):
#     LATTER_PMU_TS_DISABLE, LATTER_PMU_DCDC_KEEP_MASK, LATTER_PMU_LDO_KEEP_MASK.
#   - LATTER_BATTERY_MAH (the fitted cell): the charge profile, state of charge, low-battery warning and
#     cutoff all derive from it in include/hal_battery.h (one battery model for every battery board).
# ==============================================================================

binary_sensor:
  - platform: template
    name: "USB Power Connected"
    id: usb_connected
    device_class: power
    entity_category: diagnostic

  - platform: template
    name: "Battery Charging"
    id: batt_charging
    device_class: battery_charging
    entity_category: diagnostic

  # On at or below latter_ui::BatteryModel::kLowPct on battery; off once charging (hal_battery.h).
  - platform: template
    name: "Battery Low"
    id: batt_low
    device_class: battery
    entity_category: diagnostic

  # PWR key press timing: short press fires on release (< 1.5 s), long press fires while held (>= 1.5 s).
  # The AXP2101 keeps its own hardware power-on and hard power-off (PWRON long hold) behavior.
  - id: !extend pwr_key
    on_press:
      - script.execute: pwr_key_long_press_watch
    on_release:
      - if:
          condition:
            script.is_running: pwr_key_long_press_watch
          then:
            - script.stop: pwr_key_long_press_watch
            - script.execute:
                id: handle_crown_button_press
                is_long: false

sensor:
  - platform: template
    name: "Battery Level"
    id: batt_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    filters:
      - or:
          - throttle: 60s
          - delta: 1.0
    lambda: |-
      // The voltage model in include/hal_battery.h (fed every 10 s by hal_poll_pmu_1s): load-compensated,
      // smoothed, never rising on battery, 100 % only from the PMIC's charge-done state.
      const float soc = latter_ui::battery_model().soc_display;
      if (std::isnan(soc)) return {};
      return std::round(soc);

  - platform: template
    name: "Battery Voltage"
    id: batt_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 2
    update_interval: 60s
    filters:
      - throttle: 120s
    lambda: |-
      // The raw VBAT the battery model last sampled (REG34/35 every 10 s, in every power state): the
      // screen-off battery voltage is the drain metric for power work, and [PROF:POWER] reports it.
      const int mv = latter_ui::battery_model().vraw_mv;
      if (mv <= 0) return {};
      return static_cast<float>(mv) / 1000.0f;

text_sensor:
  - platform: template
    name: "Battery Charge State"
    id: batt_charge_state
    icon: "mdi:battery-charging-outline"
    entity_category: diagnostic
    update_interval: never

button:
  - platform: template
    name: "Actions: Hibernate Now"
    id: enter_deep_sleep_btn
    icon: "mdi:sleep"
    entity_category: config
    on_press:
      - lambda: 'latter_ui::battery_model().hib_reason = latter_ui::HibernateReason::BUTTON;'
      - script.execute: enter_deep_sleep

script:
  - id: hal_init_pmu
    mode: restart
    then:
      - lambda: |-
          // Mask all AXP2101 IRQs (no IRQ line is routed), apply board rail / TS / charger traits,
          // and log the resulting PMIC configuration for the board facts ledger.
          latter_ui::hal_init_axp2101(id(bus_internal));

  - id: hal_poll_pmu_1s
    mode: restart
    then:
      - lambda: |-
          // AXP2101 VBUS and charger state every second, VBAT into the battery model every 10 s
          // (include/hal_battery.h). Skipped during an active voice turn to keep bus_internal quiet: the
          // model's cutoff and smoothing are debounced well past a voice turn.
          if (id(va_active) || id(va_tts_received)) return;
          uint8_t reg0 = 0x00;
          uint8_t stat0 = 0;
          bool vbus = id(usb_connected).state;
          bool bat_present = true;
          if (id(bus_internal).write_readv(0x34, &reg0, 1, &stat0, 1) == esphome::i2c::ERROR_OK) {
            bool vbus_good = (stat0 & 0x20) != 0;
            bat_present = (stat0 & 0x08) != 0;
            // If powered via the UART USB-C port with no LiPo battery attached (bat_present == false),
            // the board is running on USB 5V power even though AXP2101 VBUS_IN is unpowered!
            vbus = vbus_good || !bat_present;
            if (!id(usb_connected).has_state() || id(usb_connected).state != vbus) {
              id(usb_connected).publish_state(vbus);
              if (id(display_power_state) == 0) {
                id(screen_sleep_timer).execute();
              }
              // If unplugged while Docked Screensaver is running, transition immediately to Screen Off
              // so the screensaver never stays awake draining the battery.
              if (!vbus && id(display_power_state) == 1) {
                id(turn_screen_off).execute();
              } else if (id(display_power_state) == 2) {
                if (!vbus) id(sleep_start_time) = millis();
                id(sync_wake_word_state).execute();
              }
              id(apply_power_policy).execute();  // docked vs battery changes radio, IMU and tick policy
            }
          }

          // Charger state (REG01): bits 6:5 current direction (1 = charging), bits 2:0 charger phase.
          uint8_t reg1 = 0x01;
          uint8_t stat1 = 0;
          if (id(bus_internal).write_readv(0x34, &reg1, 1, &stat1, 1) != esphome::i2c::ERROR_OK) return;
          const uint8_t chg_dir = (stat1 >> 5) & 0x03;
          const uint8_t chg_state = stat1 & 0x07;
          const bool is_charging = vbus && (chg_dir == 1) && (chg_state < 4);
          if (!id(batt_charging).has_state() || id(batt_charging).state != is_charging) {
            id(batt_charging).publish_state(is_charging);
          }
          const char *chg_text = bat_present ? latter_ui::battery_charge_state_text(!vbus, chg_state) : "No Battery";
          static const char *last_chg_text = nullptr;  // string literals: compare by pointer
          if (chg_text != last_chg_text) {
            last_chg_text = chg_text;
            id(batt_charge_state).publish_state(chg_text);
          }

          // Battery model: VBAT (REG34/35), the load class at this instant, and the cutoff.
          auto &bm = latter_ui::battery_model();
          const uint32_t now_b = millis();
          if (bat_present && bm.sample_due(now_b)) {
            uint8_t vreg = 0x34;
            uint8_t vbuf[2] = {0, 0};
            if (id(bus_internal).write_readv(0x34, &vreg, 1, vbuf, 2) == esphome::i2c::ERROR_OK) {
              const int vbat_mv = ((vbuf[0] & 0x3F) << 8) | vbuf[1];
              uint8_t greg = 0xA4;
              uint8_t gauge = 0;
              if (id(bus_internal).write_readv(0x34, &greg, 1, &gauge, 1) == esphome::i2c::ERROR_OK && gauge <= 100) {
                latter_ui::pmu_telemetry().gauge_raw = gauge;  // comparison telemetry only
              }
              latter_ui::BattLoad load = latter_ui::BattLoad::QUIET;
              if (id(speaker_enable).state ||
                  id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                  id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING) {
                load = latter_ui::BattLoad::AUDIO;
              } else if (id(display_power_state) != 2) {
                load = latter_ui::BattLoad::SCREEN;
              }
              const bool cutoff = bm.update(vbat_mv, !vbus, static_cast<latter_ui::ChargePhase>(chg_state), load, now_b);
              if (!id(batt_low).has_state() || id(batt_low).state != bm.low) {
                id(batt_low).publish_state(bm.low);
              }
              static bool low_logged = false;
              if (bm.low && !low_logged) {
                ESP_LOGW("PROF", "[PROF:POWER] trig=LOW_BATT vraw=%dmV vrest=%dmV soc=%.0f%%", bm.vraw_mv, bm.vrest_mv,
                         bm.soc_display);
              }
              low_logged = bm.low;
              // Cutoff: hibernate cleanly (state saved, API disconnected, PMIC off; never alarm-sleep) instead of
              // letting the cell run into the PMIC's under-voltage cutoff. A hibernate countdown already running
              // is replaced by the instant one; the final power-off sequence is left alone.
              if (cutoff && !id(ota_in_progress) && !(id(is_hibernating) && id(hibernate_countdown_val) == 0)) {
                ESP_LOGW("PROF", "[PROF:POWER] trig=CRITICAL_BATT vraw=%dmV vrest=%dmV soc=%.0f%% gauge=%d%% -> hibernate",
                         bm.vraw_mv, bm.vrest_mv, bm.soc_display, latter_ui::pmu_telemetry().gauge_raw);
                bm.hib_reason = latter_ui::HibernateReason::CRITICAL;
                id(start_instant_hibernation).execute();
                return;
              }
            }
          }

          // Low-battery notice: once per discharge, the next time the screen is on (never wakes the screen).
          if (bm.low_notice_pending && id(display_power_state) == 0 && !id(notif_active) && !id(is_hibernating) &&
              !id(va_active) && !id(alarm_ringing) && !id(timer_ringing) &&
              !(id(gui_page) == 8 && id(tools_subpage) == 12)) {
            bm.low_notice_pending = false;
            char msg[48];
            snprintf(msg, sizeof(msg), "%.0f%% left. Charge soon.", bm.soc_display);
            id(notif_title) = "Battery Low";
            id(notif_message) = msg;
            id(notif_priority) = "warning";
            id(notif_duration_ms) = 10000U;
            id(notif_start_ms) = millis();
            id(notif_camera_url) = "";
            id(current_loaded_camera_url) = "";
            latter_ui::release_art(id(camera_snapshot_art));
            id(notif_active) = true;
            id(screen_sleep_timer).execute();
            latter_ui::schedule_disp_update(&id(disp1));
          }

  - id: pwr_key_long_press_watch
    mode: restart
    then:
      - delay: 1500ms
      - script.execute:
          id: handle_crown_button_press
          is_long: true

  - id: hal_wait_pwr_key_release
    mode: restart
    then:
      # Wait (up to 3 s) for the PWR key to be released so the AXP2101 PWRON input does not
      # immediately re-power the PMIC after the hibernate power-off write.
      - wait_until:
          condition:
            binary_sensor.is_off: pwr_key
          timeout: 3s
      - delay: 100ms

  - id: handle_crown_button_press
    mode: restart
    parameters:
      is_long: bool
    then:
      - lambda: |-
          static uint32_t last_crown_press = 0;
          uint32_t now_c = millis();
          if (now_c - last_crown_press < 150) return;
          last_crown_press = now_c;

          if (id(is_hibernating)) {
            if (id(hibernate_countdown_val) > 0) {
              id(is_hibernating) = false;
              id(hibernate_countdown_val) = 0;
              latter_ui::battery_model().hib_reason = latter_ui::HibernateReason::OTHER;
              latter_ui::note_wake_reason(latter_ui::WakeReason::CROWN);
              id(wake_to_active_state).execute();
            }
            return;
          }

          if (is_long) {
            latter_ui::battery_model().hib_reason = latter_ui::HibernateReason::KEY;
            if (id(instant_crown_hibernate_switch).state) {
              id(start_instant_hibernation).execute();
            } else {
              id(start_hibernation_countdown).execute();
            }
            return;
          }

          if (id(alarm_ringing)) {
            auto now = id(ha_time).now();
            if (now.is_valid()) {
              id(alarm_snooze_until) = now.timestamp + 300;
            } else {
              id(alarm_snooze_until) = (millis() / 1000) + 300;
            }
            id(alarm_ringing) = false;
            id(stop_alarm_sound).execute();
            latter_ui::schedule_disp_update(&id(disp1));
            id(screen_sleep_timer).execute();
            return;
          }
          if (id(timer_ringing) || id(find_my_active) || id(notif_active)) {
            if (id(notif_active)) {
              id(dismiss_notification).execute();
              return;
            }
            id(timer_ringing) = false;
            id(find_my_active) = false;
            id(stop_alarm_sound).execute();
            id(sync_display_brightness).execute();
            latter_ui::schedule_disp_update(&id(disp1));
            id(screen_sleep_timer).execute();
            return;
          }

          if (!id(display_brightness).current_values.is_on() || id(display_power_state) != 0) {
            latter_ui::note_wake_reason(latter_ui::WakeReason::CROWN);
            id(wake_to_active_state).execute();
            return;
          }

          if (id(va_active) || !id(va_status_text).empty()) {
            id(cancel_voice_assistant).execute();
            return;
          }

          if (id(gui_page) == 8 && id(tools_subpage) == 3) {
            id(screen_sleep_timer).execute();
            if (!id(stopwatch_running)) {
              id(stopwatch_running) = true;
              id(stopwatch_start_time) = millis() - id(stopwatch_elapsed_ms);
              id(sleep_start_time) = 0;
              id(display_brightness).turn_on().perform();
            } else {
              id(stopwatch_running) = false;
              id(stopwatch_elapsed_ms) = millis() - id(stopwatch_start_time);
            }
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }

          id(turn_screen_off).execute();
          return;
