# Latter Client Feature Package: Core System, Boot, API, OTA, Time & Globals

esphome:
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            id(hal_release_deep_sleep_holds).execute();
            latter_ui::hal_release_pwr_key_wake_pad();
            id(sleep_start_time) = millis();
            id(is_hibernating) = false;
            id(display_power_state) = 0; // ACTIVE
            esphome::voice_assistant::ensure_wake_words_restored(id(mww));

    - priority: -100
      then:
        # SDK revision lockstep stamp: LATTER_YAML_REV must equal LATTER_SDK_REV in include/ui_core.h
        # (latter-verify enforces). It lives in this lambda, not in build_flags, so bumping it recompiles
        # only main.cpp instead of invalidating the CMake cache and every object in the build.
        - lambda: |-
            constexpr long LATTER_YAML_REV = 2026110229L;
            static_assert(LATTER_YAML_REV == LATTER_SDK_REV,
                          "Latter YAML packages and latter_core C++ headers are from different revisions. "
                          "ESPHome caches github:// packages for a day: set refresh: 0s on the Latter package "
                          "(docs/flashing.md) and rebuild.");
            ESP_LOGI("latter", "Latter SDK rev %ld (YAML rev %ld)", (long)LATTER_SDK_REV, LATTER_YAML_REV);
        - script.execute: hal_init_pmu
        - lambda: |-
            latter_ui::seed_standalone_remote_slots(
                "${remote_1_entity}", "${remote_1_name}",
                "${remote_2_entity}", "${remote_2_name}",
                "${remote_3_entity}", "${remote_3_name}",
                "${remote_4_entity}", "${remote_4_name}");
            id(active_remote_slot) = latter_ui::resolve_active_remote_slot(id(active_remote_slot));
        - media_player.pause: latter_media_player
        - online_image.release: remote_album_art
        - online_image.release: home_wallpaper_art
        - online_image.release: camera_snapshot_art
        - lambda: |-
            id(current_loaded_art_url) = "";
            id(current_loaded_wallpaper_url) = "";
            id(current_loaded_camera_url) = "";
            id(hal_set_dac_mute).execute(true);
            id(latter_hardware_manifest).publish_state(latter_ui::build_hardware_manifest_state_json());
        - script.execute: route_i2s_to_mic
        - switch.turn_off: speaker_enable
        - script.execute: apply_default_start_page
        - script.execute: apply_theme_preset
        - lambda: |-
            #if !LATTER_ROUND_DISPLAY
            static bool non_round_clock_seeded = false;
            if (!non_round_clock_seeded) {
              non_round_clock_seeded = true;
              if (id(clock_face_style).current_option() == "Modern Roman (Analog)") {
                auto call = id(clock_face_style).make_call();
                call.set_option("Minimal Digital");
                call.perform();
              }
            }
            #endif
            id(clock_face_digital) = (id(clock_face_style).current_option() != "Modern Roman (Analog)");
            id(is_24h_format) = (id(time_format_select).current_option() == "24-Hour");
        - component.update: batt_level
        - lambda: |-
            if (!id(power_profile_seeded)) {
              id(power_profile_seeded) = true;
              latter_ui::apply_power_profile_spec(
                  "${default_power_profile}", id(va_wake_word_mode), id(tap_wake_mode),
                  id(pickup_wake_mode), id(display_off_timeout),
                  id(screensaver_docked_timeout), id(hibernate_timeout_mode),
                  id(docked_screensaver_switch));
            } else {
              latter_ui::clamp_power_capabilities(id(pickup_wake_mode), id(hibernate_timeout_mode));
            }
            esphome::voice_assistant::ensure_wake_words_restored(id(mww), true);
            id(va_active_wake_word).publish_state(
                esphome::voice_assistant::wake_word_id_to_label(esphome::voice_assistant::last_persisted_ww1()));
        - script.execute: apply_wake_word_sensitivities
        - script.execute: sync_display_brightness
        - script.execute: screen_sleep_timer

api:
  reboot_timeout: ${api_reboot_timeout}
  encryption:
  outgoing_connection:
  on_client_connected:
    then:
      - lambda: |-
          latter_ui::link_state().ha_connected = true;
          latter_ui::link_state().last_ha_connect_ms = millis();
          if (client_info.find("Home Assistant") != std::string::npos) {
            latter_ui::reset_all_v3_rev_guards();
            id(last_seen_alert_id) = -1;
          }
          esphome::voice_assistant::on_api_client_authenticated(id(va), id(mww), client_info, client_address);
          if (id(display_power_state) == 0 && !id(is_hibernating)) {
            latter_ui::schedule_disp_update(&id(disp1));
          }
      - if:
          condition:
            lambda: 'return client_info.find("Home Assistant") != std::string::npos;'
          then:
            - homeassistant.action:
                action: latter.device_hello
                data:
                  target_device: "${name}"
                  contract: !lambda 'return std::to_string(latter_ui::kProtocolContractVersion);'
                  boot_id: !lambda 'return std::to_string(latter_ui::device_boot_id());'
                  manifest: !lambda 'return latter_ui::build_hardware_manifest_json();'
      - delay: 3s
      - lambda: 'latter_ui::log_boot_summary();'
  on_client_disconnected:
    then:
      - lambda: |-
          latter_ui::link_state().ha_connected = false;
          latter_ui::link_state().last_ha_disconnect_ms = millis();
          if (id(display_power_state) == 0 && !id(is_hibernating)) {
            latter_ui::schedule_disp_update(&id(disp1));
          }
  actions:
    - action: latter_ping
      id: latter_ping_action
      then:
        - logger.log: "Latter companion connected"

    - action: ui_input
      variables:
        action: string
        delta: int
      then:
        - script.execute:
            id: ui_input_event
            action: !lambda 'return action;'
            delta: !lambda 'return delta;'

    - action: set_browse_slots
      variables:
        contract: int
        mode: string
        page: int
        total_pages: int
        slots: string
      then:
        - lambda: |-
            (void)contract;
            latter_ui::BrowseSlotItem v3_items[5];
            latter_ui::parse_v3_slots_payload(std::string_view(slots.c_str(), slots.size()), v3_items, 5);
            const std::string &n1 = v3_items[0].name;
            const std::string &i1 = v3_items[0].id;
            const std::string &t1 = v3_items[0].type;
            const bool a1         = v3_items[0].active;
            const int l1          = v3_items[0].level;
            const std::string &n2 = v3_items[1].name;
            const std::string &i2 = v3_items[1].id;
            const std::string &t2 = v3_items[1].type;
            const bool a2         = v3_items[1].active;
            const int l2          = v3_items[1].level;
            const std::string &n3 = v3_items[2].name;
            const std::string &i3 = v3_items[2].id;
            const std::string &t3 = v3_items[2].type;
            const bool a3         = v3_items[2].active;
            const int l3          = v3_items[2].level;
            const std::string &n4 = v3_items[3].name;
            const std::string &i4 = v3_items[3].id;
            const std::string &t4 = v3_items[3].type;
            const bool a4         = v3_items[3].active;
            const int l4          = v3_items[3].level;
            const std::string &n5 = v3_items[4].name;
            const std::string &i5 = v3_items[4].id;
            const std::string &t5 = v3_items[4].type;
            const bool a5         = v3_items[4].active;
            const int l5          = v3_items[4].level;

            if (mode == "area_areas" || mode == "areas") {
              id(area_list_page) = page;
              id(area_list_total_pages) = total_pages;
              id(area_list_1_name) = n1; id(area_list_1_id) = i1; id(area_list_1_active) = a1;
              id(area_list_2_name) = n2; id(area_list_2_id) = i2; id(area_list_2_active) = a2;
              id(area_list_3_name) = n3; id(area_list_3_id) = i3; id(area_list_3_active) = a3;
              id(area_list_4_name) = n4; id(area_list_4_id) = i4; id(area_list_4_active) = a4;
              id(area_list_5_name) = n5; id(area_list_5_id) = i5; id(area_list_5_active) = a5;
            } else if (mode == "calendar_agenda") {
              id(cal_browse_page) = page;
              id(cal_browse_total_pages) = total_pages;
              id(cal_slot_1_name) = n1; id(cal_slot_1_id) = i1; id(cal_slot_1_active) = a1;
              id(cal_slot_2_name) = n2; id(cal_slot_2_id) = i2; id(cal_slot_2_active) = a2;
              id(cal_slot_3_name) = n3; id(cal_slot_3_id) = i3; id(cal_slot_3_active) = a3;
              id(cal_slot_4_name) = n4; id(cal_slot_4_id) = i4; id(cal_slot_4_active) = a4;
              id(cal_slot_5_name) = n5; id(cal_slot_5_id) = i5; id(cal_slot_5_active) = a5;
            } else if (mode == "entities" || mode == "home") {
              id(area_browse_mode) = "entities";
              id(area_browse_page) = page;
              id(area_browse_total_pages) = total_pages;
              id(area_slot_1_name) = n1; id(area_slot_1_id) = i1; id(area_slot_1_type) = t1; id(area_slot_1_active) = a1; id(area_slot_1_level) = l1;
              id(area_slot_2_name) = n2; id(area_slot_2_id) = i2; id(area_slot_2_type) = t2; id(area_slot_2_active) = a2; id(area_slot_2_level) = l2;
              id(area_slot_3_name) = n3; id(area_slot_3_id) = i3; id(area_slot_3_type) = t3; id(area_slot_3_active) = a3; id(area_slot_3_level) = l3;
            } else {
              if (millis() - latter_ui::last_music_page_req_ms() > 350U || page == id(music_browse_page)) {
                id(music_browse_page) = page;
              }
              id(music_browse_total_pages) = total_pages;
              id(slot_1_name) = n1; id(slot_1_id) = i1; id(slot_1_type) = t1; id(slot_1_active) = a1;
              id(slot_2_name) = n2; id(slot_2_id) = i2; id(slot_2_type) = t2; id(slot_2_active) = a2;
              id(slot_3_name) = n3; id(slot_3_id) = i3; id(slot_3_type) = t3; id(slot_3_active) = a3;
              id(slot_4_name) = n4; id(slot_4_id) = i4; id(slot_4_type) = t4; id(slot_4_active) = a4;
              id(slot_5_name) = n5; id(slot_5_id) = i5; id(slot_5_type) = t5; id(slot_5_active) = a5;
            }
            latter_ui::schedule_disp_update(&id(disp1));

    - action: set_area_slots
      variables:
        contract: int
        mode: string
        page: int
        total_pages: int
        slots: string
      then:
        - lambda: |-
            (void)contract;
            latter_ui::BrowseSlotItem v3_items[5];
            latter_ui::parse_v3_slots_payload(std::string_view(slots.c_str(), slots.size()), v3_items, 5);
            id(area_browse_mode) = mode;
            id(area_browse_page) = page;
            id(area_browse_total_pages) = total_pages;
            id(area_slot_1_name) = v3_items[0].name;
            id(area_slot_1_id)   = v3_items[0].id;
            id(area_slot_1_type) = v3_items[0].type;
            id(area_slot_1_active) = v3_items[0].active;
            id(area_slot_1_level)  = v3_items[0].level;
            id(area_slot_2_name) = v3_items[1].name;
            id(area_slot_2_id)   = v3_items[1].id;
            id(area_slot_2_type) = v3_items[1].type;
            id(area_slot_2_active) = v3_items[1].active;
            id(area_slot_2_level)  = v3_items[1].level;
            id(area_slot_3_name) = v3_items[2].name;
            id(area_slot_3_id)   = v3_items[2].id;
            id(area_slot_3_type) = v3_items[2].type;
            id(area_slot_3_active) = v3_items[2].active;
            id(area_slot_3_level)  = v3_items[2].level;
            latter_ui::schedule_disp_update(&id(disp1));

    - action: show_notification
      variables:
        title: string
        message: string
        priority: string
        duration: int
        chime: bool
        camera_url: string
        alert_id: int
      then:
        - lambda: |-
            if (alert_id > 0 && alert_id <= id(last_seen_alert_id)) return;
            if (alert_id > 0) id(last_seen_alert_id) = alert_id;
            id(notif_title) = std::string(title).empty() ? "Notification" : std::string(title);
            id(notif_message) = std::string(message);
            id(notif_priority) = std::string(priority).empty() ? "normal" : std::string(priority);
            int dur_s = (duration > 0) ? duration : 10;
            if (dur_s < 3) dur_s = 3;
            if (dur_s > 60) dur_s = 60;
            id(notif_duration_ms) = static_cast<uint32_t>(dur_s) * 1000U;
            id(notif_start_ms) = millis();
            id(notif_camera_url) = std::string(camera_url);
            id(notif_active) = true;
            latter_ui::note_wake_reason(latter_ui::WakeReason::NOTIFY);
            id(wake_to_active_state).execute();
            if (chime && !id(va_active) && !id(va_tts_received)) {
              int sfx = (id(notif_priority) == "critical" || id(notif_priority) == "warning") ? 9 : 6;
              id(play_game_sfx).execute(sfx);
            }
            if (!id(notif_camera_url).empty() && id(notif_camera_url) != "none" &&
                id(notif_camera_url) != "unknown" && id(notif_camera_url) != "unavailable") {
              id(fetch_camera_snapshot).execute();
            } else {
              id(current_loaded_camera_url) = "";
              id(camera_snapshot_art).release();
            }
            latter_ui::schedule_disp_update(&id(disp1));

ota:
  - platform: esphome
    on_begin:
      then:
        - script.stop: screen_sleep_timer
        # Wake the screen through the canonical light path (panel DCS wake + light state) first.
        - light.turn_on: display_brightness
        - lambda: |-
            latter_ui::handle_ota_begin(&id(disp1), id(ota_in_progress), id(ota_progress_pct),
                                        id(sleep_start_time), id(display_power_state));
        - component.update: disp1
    on_progress:
      then:
        - lambda: 'latter_ui::handle_ota_progress(&id(disp1), x, id(ota_progress_pct), millis());'
    on_end:
      then:
        - lambda: 'latter_ui::handle_ota_end(&id(disp1), id(ota_in_progress), id(ota_progress_pct));'
    on_error:
      then:
        - lambda: |-
            latter_ui::handle_ota_error(&id(disp1), id(ota_in_progress), id(ota_progress_pct),
                                        id(notif_active), id(notif_title), id(notif_message),
                                        id(notif_priority), id(notif_duration_ms),
                                        id(notif_start_ms), millis());
        - script.execute: screen_sleep_timer
    on_abort:
      then:
        - lambda: |-
            latter_ui::handle_ota_error(&id(disp1), id(ota_in_progress), id(ota_progress_pct),
                                        id(notif_active), id(notif_title), id(notif_message),
                                        id(notif_priority), id(notif_duration_ms),
                                        id(notif_start_ms), millis());
        - script.execute: screen_sleep_timer

  - platform: http_request
    id: ota_http
    on_begin:
      then:
        - script.stop: screen_sleep_timer
        # Wake the screen through the canonical light path (panel DCS wake + light state) first.
        - light.turn_on: display_brightness
        - lambda: |-
            latter_ui::handle_ota_begin(&id(disp1), id(ota_in_progress), id(ota_progress_pct),
                                        id(sleep_start_time), id(display_power_state));
        - component.update: disp1
    on_progress:
      then:
        - lambda: 'latter_ui::handle_ota_progress(&id(disp1), x, id(ota_progress_pct), millis());'
    on_end:
      then:
        - lambda: 'latter_ui::handle_ota_end(&id(disp1), id(ota_in_progress), id(ota_progress_pct));'
    on_error:
      then:
        - lambda: |-
            latter_ui::handle_ota_error(&id(disp1), id(ota_in_progress), id(ota_progress_pct),
                                        id(notif_active), id(notif_title), id(notif_message),
                                        id(notif_priority), id(notif_duration_ms),
                                        id(notif_start_ms), millis());
        - script.execute: screen_sleep_timer
    on_abort:
      then:
        - lambda: |-
            latter_ui::handle_ota_error(&id(disp1), id(ota_in_progress), id(ota_progress_pct),
                                        id(notif_active), id(notif_title), id(notif_message),
                                        id(notif_priority), id(notif_duration_ms),
                                        id(notif_start_ms), millis());
        - script.execute: screen_sleep_timer

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - lambda: |-
            if (id(display_power_state) == 0 && !id(is_hibernating)) {
              latter_ui::record_ambient_frame_ms(0);
            }
  - platform: sntp
    id: sntp_time
    on_time_sync:
      then:
        - lambda: |-
            if (id(display_power_state) == 0 && !id(is_hibernating)) {
              latter_ui::record_ambient_frame_ms(0);
            }


