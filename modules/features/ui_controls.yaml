button:
  - platform: restart
    name: "Internal Restart"
    id: internal_restart
    internal: true

  - platform: template
    name: "Actions: Restart Device"
    id: restart_button
    entity_category: diagnostic
    on_press:
      - light.turn_off: display_brightness
      - component.update: disp1
      - delay: 100ms
      - button.press: internal_restart



  - platform: template
    name: "Actions: Trigger Voice Assistant"
    id: trigger_va_button
    entity_category: config
    on_press:
      - script.execute: toggle_voice_assistant

  - platform: template
    name: "Actions: Find My Device"
    id: find_my_button
    icon: "mdi:radar"
    entity_category: config
    on_press:
      - lambda: |-
          if (!id(find_my_active)) {
            if (id(va_active) || !id(va_status_text).empty()) {
              id(cancel_voice_assistant).execute();
            }
            id(find_my_active) = true;
            id(find_my_start_ms) = millis();
            id(wake_to_active_state).execute();
            id(play_alarm_sound).execute();
            latter_ui::schedule_disp_update(&id(disp1));
          } else {
            id(find_my_active) = false;
            id(stop_alarm_sound).execute();
            id(sync_display_brightness).execute();
            latter_ui::schedule_disp_update(&id(disp1));
            id(screen_sleep_timer).execute();
          }


