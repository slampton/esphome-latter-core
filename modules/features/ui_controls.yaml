  - platform: template
    name: "System: Telemetry Profiler"
    id: telemetry_profiler_switch
    icon: "mdi:chart-timeline-variant-shimmer"
    entity_category: diagnostic
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(telemetry_profiler_switch).publish_state(true);
          latter_ui::profiler_enabled() = true;
          auto &fr = latter_ui::flight_recorder();
          fr.window_frames = 0;
          fr.window_render_us = 0;
          fr.max_render_us = 0;
          fr.slow_frames = 0;
          fr.last_summary_ms = millis();
          ESP_LOGI("PROF", "[PROF:START] 10-Minute Flight Recorder ENABLED for '${name}' (screen=%dx%d)",
                   latter_ui::SCREEN_W, latter_ui::SCREEN_H);
          latter_ui::log_power_and_mem_profile(
              "PROFILER_ON", id(display_power_state), id(usb_connected).state, id(batt_charging).state,
              id(batt_level).state, id(batt_voltage).state, id(speaker_enable).state,
              id(mww).is_running(), id(va_active),
              id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING,
              id(ble_ctrl).is_active(), id(active_game), id(sleep_start_time));
    turn_off_action:
      - lambda: |-
          id(telemetry_profiler_switch).publish_state(false);
          latter_ui::log_power_and_mem_profile(
              "PROFILER_OFF", id(display_power_state), id(usb_connected).state, id(batt_charging).state,
              id(batt_level).state, id(batt_voltage).state, id(speaker_enable).state,
              id(mww).is_running(), id(va_active),
              id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING,
              id(ble_ctrl).is_active(), id(active_game), id(sleep_start_time));
          latter_ui::profiler_enabled() = false;
          ESP_LOGI("PROF", "[PROF:STOP] Flight Recorder DISABLED");

  - platform: template
    name: "Area: BLE Presence Beacon"
    id: ble_area_beacon_switch
    icon: "mdi:bluetooth-audio"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(ble_area_beacon_switch).publish_state(true);
          if (id(display_power_state) == 0 && !id(ble_ctrl).is_active() && !id(ble_ctrl).is_failed()) {
            id(ble_ctrl).enable();
          }
          if (id(display_power_state) == 0) latter_ui::schedule_disp_update(&id(disp1));
    turn_off_action:
      - lambda: |-
          id(ble_area_beacon_switch).publish_state(false);
          if (id(ble_ctrl).is_active() && id(wifi_ctrl).is_connected()) {
            id(ble_ctrl).disable();
          }
          if (id(display_power_state) == 0) latter_ui::schedule_disp_update(&id(disp1));


