    internal: true
    on_value:
      then:
        - lambda: |-
            if (latter_ui::parse_v3_calendar_payload(x, latter_ui::calendar_state())) {
              if (id(display_power_state) == 0 && (id(gui_page) == 1 || (id(gui_page) == 8 && id(tools_subpage) == 9))) {
                latter_ui::schedule_disp_update(&id(disp1));
              }
            }

