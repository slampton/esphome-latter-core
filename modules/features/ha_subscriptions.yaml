# Latter Client Feature Package: Home Assistant Sensor, Binary Sensor & Text Sensor Subscriptions

sensor:
  # --------------------------------------------------------------------------
  - platform: template
    name: "Timer Remaining"
    id: timer_remaining_sensor
    update_interval: 30s
    filters:
      - delta: 1.0
    lambda: |-
      if (!id(timer_running) && !id(timer_paused)) return {};
      return (float)id(timer_remaining_sec);
    unit_of_measurement: "s"
    entity_category: diagnostic
    icon: "mdi:timer-outline"

  # Sky & Weather Suite Sensors
  # --------------------------------------------------------------------------
  - platform: homeassistant
    id: ha_sun_elevation
    entity_id: ${sun_entity}
    attribute: elevation
    internal: true

  - platform: homeassistant
    id: ha_sun_azimuth
    entity_id: ${sun_entity}
    attribute: azimuth
    internal: true

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    id: latter_wifi_signal
    entity_category: diagnostic
    update_interval: 60s

binary_sensor:
  - platform: template
    name: "Timer Active"
    id: timer_active_binary_sensor
    lambda: 'return id(timer_running);'
    entity_category: diagnostic
    icon: "mdi:timer-sand"

  - platform: template
    name: "Alarm Ringing"
    id: alarm_ringing_binary_sensor
    lambda: 'return id(alarm_ringing) || id(timer_ringing);'
    entity_category: diagnostic
    icon: "mdi:alarm-bell"

  - id: !extend boot_button
    on_press:
      then:
        - lambda: |-
            static uint32_t last_btn_press = 0;
            uint32_t now = millis();
            if (now - last_btn_press < 150) return;
            last_btn_press = now;
        - if:
            condition:
              lambda: 'return id(find_my_active) || id(timer_ringing) || id(alarm_ringing) || id(notif_active);'
            then:
              - lambda: |-
                  if (id(notif_active)) {
                    id(dismiss_notification).execute();
                    return;
                  }
                  id(find_my_active) = false;
                  id(timer_ringing) = false;
                  id(alarm_ringing) = false;
                  id(stop_alarm_sound).execute();
                  id(sync_display_brightness).execute();
                  latter_ui::schedule_disp_update(&id(disp1));
                  id(screen_sleep_timer).execute();
            else:
              - if:
                  condition:
                    lambda: 'return id(active_game) > 0;'
                  then:
                    - lambda: 'id(game_btn_pressed) = true;'
                  else:
                    - script.execute: toggle_voice_assistant

text_sensor:
  # --------------------------------------------------------------------------
  # Sky & Weather Suite Text Sensors
  # --------------------------------------------------------------------------
  - platform: homeassistant
    id: ha_sun_state
    entity_id: ${sun_entity}
    internal: true
    on_value:
      then:
        - script.execute: sync_display_brightness
        - lambda: |-
            if (id(display_power_state) == 0 && !id(is_hibernating)) {
              latter_ui::weather_sim_dirty() = true;
              latter_ui::record_ambient_frame_ms(0);
              latter_ui::schedule_disp_update(&id(disp1));
            }

  - platform: homeassistant
    id: ha_sun_next_rising
    entity_id: ${sun_entity}
    attribute: next_rising
    internal: true

  - platform: homeassistant
    id: ha_sun_next_setting
    entity_id: ${sun_entity}
    attribute: next_setting
    internal: true

  - platform: homeassistant
    id: ha_moon_phase
    entity_id: ${moon_entity}
    internal: true

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: latter_ip_address

  - platform: template
    name: "Firmware Version"
    id: latter_firmware_version
    icon: "mdi:tag-outline"
    entity_category: diagnostic
    update_interval: 3600s
    lambda: 'return std::string("${version}");'

  - platform: homeassistant
    id: ha_firmware_latest_version
    entity_id: ${firmware_update_entity}
    attribute: latest_version
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(display_power_state) == 0 && id(gui_page) == 4 && id(system_menu_mode) == 5) {
              latter_ui::schedule_disp_update(&id(disp1));
            }

  - platform: homeassistant
    id: ha_firmware_release_summary
    entity_id: ${firmware_update_entity}
    attribute: release_summary
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(display_power_state) == 0 && id(gui_page) == 4 && id(system_menu_mode) == 5) {
              latter_ui::schedule_disp_update(&id(disp1));
            }

  - platform: sendspin
    type: artist
    name: "Now Playing Artist"
    id: track_artist
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static std::string prev_s_artist = "";
            if (x != prev_s_artist) {
              prev_s_artist = x;
              const auto &ms = latter_ui::media_state();
              if (ms.is_local) {
                if (!x.empty() && x != "Idle" && x != "None" &&
                    id(display_power_state) == 0 &&
                    id(gui_page) == 2 &&
                    id(album_art).get_width() == 0 &&
                    !ms.art_url.empty() &&
                    ms.art_url != "none" &&
                    ms.art_url != "unknown" &&
                    ms.art_url != "unavailable" &&
                    ms.art_url != id(current_loaded_art_url)) {
                  id(fetch_remote_art_debounced).execute();
                }
                id(throttled_disp_update).execute();
              }
            }

  - platform: sendspin
    type: title
    name: "Now Playing Title"
    id: track_title
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static std::string prev_s_title = "";
            if (x != prev_s_title) {
              prev_s_title = x;
              if (!x.empty() && x != "Idle" && x != "None") {
                latter_ui::music_queue_cleared() = false;
              }
              const auto &ms = latter_ui::media_state();
              if (ms.is_local) {
                if (!x.empty() && x != "Idle" && x != "None" &&
                    id(display_power_state) == 0 &&
                    id(gui_page) == 2 &&
                    id(album_art).get_width() == 0 &&
                    !ms.art_url.empty() &&
                    ms.art_url != "none" &&
                    ms.art_url != "unknown" &&
                    ms.art_url != "unavailable" &&
                    ms.art_url != id(current_loaded_art_url)) {
                  id(fetch_remote_art_debounced).execute();
                }
                id(throttled_disp_update).execute();
              }
            }

  - platform: sendspin
    type: album
    name: "Now Playing Album"
    id: track_album
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static std::string prev_s_album = "";
            if (x != prev_s_album) {
              prev_s_album = x;
              const auto &ms = latter_ui::media_state();
              if (ms.is_local) {
                if (!x.empty() && x != "Idle" && x != "None" &&
                    id(display_power_state) == 0 &&
                    id(gui_page) == 2 &&
                    id(album_art).get_width() == 0 &&
                    !ms.art_url.empty() &&
                    ms.art_url != "none" &&
                    ms.art_url != "unknown" &&
                    ms.art_url != "unavailable" &&
                    ms.art_url != id(current_loaded_art_url)) {
                  id(fetch_remote_art_debounced).execute();
                }
                id(throttled_disp_update).execute();
              }
            }

  # --------------------------------------------------------------------------
  # Protocol v3 Atomic Snapshot Payloads (\x1f-delimited, revision-guarded)
  # --------------------------------------------------------------------------
  - platform: homeassistant
    id: ha_area_ctx_blob
    entity_id: ${area_context_sensor}
    attribute: payload
    internal: true
    on_value:
      then:
        - lambda: |-
            std::string prev_dock = latter_ui::area_ctx_state().dock_apps;
            if (latter_ui::parse_v3_area_ctx_payload(x, latter_ui::area_ctx_state(), latter_ui::whole_home_state())) {
              const auto &st = latter_ui::area_ctx_state();
              if (!st.area_name.empty()) {
                id(active_area_name) = st.area_name;
                latter_ui::latter_area_label() = st.area_name;
              }
              if (!st.area_id.empty() && st.area_id != id(active_area_id)) {
                id(active_area_id) = st.area_id;
                id(area_browse_page) = 1;
                latter_ui::area_cat_dock_page() = 0;
              }
              if (st.available_domains != "unknown" && st.available_domains != "unavailable") {
                latter_ui::area_available_domains_csv() = st.available_domains;
                std::string valid_cat = latter_ui::resolve_preferred_area_category(
                    std::string(id(area_default_category_select).current_option()),
                    id(area_show_all_category_switch).state);
                std::string cats[8];
                int cnt = latter_ui::collect_area_categories(id(area_show_all_category_switch).state, cats);
                bool cur_ok = false;
                int act_idx = 0;
                for (int i = 0; i < cnt; i++) {
                  if (cats[i] == id(area_domain_filter)) { cur_ok = true; act_idx = i; break; }
                }
                if (!cur_ok && !valid_cat.empty()) {
                  id(area_domain_filter) = valid_cat;
                  for (int i = 0; i < cnt; i++) {
                    if (cats[i] == valid_cat) { act_idx = i; break; }
                  }
                  if (id(gui_page) == 6 && id(area_subpage) == 0) {
                    id(area_browse_page) = 1;
                    id(fetch_area_browse).execute();
                  }
                }
                latter_ui::sync_mode_bar_window(latter_ui::area_cat_dock_page(), act_idx, cnt);
              }
              if (!st.dock_apps.empty() && st.dock_apps != prev_dock) {
                latter_ui::latter_dock_order_csv() = st.dock_apps;
                latter_ui::home_dock_page() = 0;
              }
              if (!st.alarm_entity.empty() && st.alarm_entity != "none") {
                id(area_alarm_entity) = st.alarm_entity;
              }
              if (!st.alarm_state.empty()) {
                id(area_alarm_state) = st.alarm_state;
              }
              if (!st.site_id.empty()) {
                latter_ui::latter_site_id() = st.site_id;
              }
              latter_ui::latter_vpn_enabled() = st.vpn_enabled;
              latter_ui::latter_vpn_client_ip() = st.vpn_client_ip;
              latter_ui::latter_ble_proxy() = st.ble_closest_proxy;
              latter_ui::cam_listen_active() = (st.doorbell_talk_state == "listening");
              if (st.theme_color_hex.size() == 7 && st.theme_color_hex[0] == '#') {
                uint32_t new_rgb = latter_ui::parse_hex_rgb(st.theme_color_hex, id(custom_theme_rgb));
                if (new_rgb != id(custom_theme_rgb)) {
                  id(custom_theme_rgb) = new_rgb;
                  if (id(theme_palette_select).current_option() == "Custom") {
                    id(apply_theme_preset).execute();
                  }
                }
              }
              if (st.alert_id >= 0) {
                if (id(last_seen_alert_id) < 0) {
                  id(last_seen_alert_id) = st.alert_id;
                } else if (st.alert_id > id(last_seen_alert_id)) {
                  id(last_seen_alert_id) = st.alert_id;
                  id(notif_title) = st.alert_title.empty() ? "Notification" : st.alert_title;
                  id(notif_message) = st.alert_message;
                  id(notif_priority) = st.alert_priority.empty() ? "normal" : st.alert_priority;
                  int dur_s = (st.alert_duration > 0) ? st.alert_duration : 10;
                  if (dur_s < 3) dur_s = 3;
                  if (dur_s > 60) dur_s = 60;
                  id(notif_duration_ms) = static_cast<uint32_t>(dur_s) * 1000U;
                  id(notif_start_ms) = millis();
                  id(notif_camera_url) = st.alert_camera_url;
                  id(notif_active) = true;
                  id(wake_to_active_state).execute();
                  if (st.alert_chime && !id(va_active) && !id(va_tts_received)) {
                    int sfx = (id(notif_priority) == "critical" || id(notif_priority) == "warning") ? 9 : 6;
                    id(play_game_sfx).execute(sfx);
                  }
                  if (!id(notif_camera_url).empty() && id(notif_camera_url) != "none" &&
                      id(notif_camera_url) != "unknown" && id(notif_camera_url) != "unavailable") {
                    id(fetch_camera_snapshot).execute();
                  } else {
                    id(current_loaded_camera_url) = "";
                    id(camera_snapshot_art).release();
                  }
                }
              }
              if (st.wallpaper_url.empty() || st.wallpaper_url == "none" ||
                  st.wallpaper_url == "unknown" || st.wallpaper_url == "unavailable") {
                if (!id(current_loaded_wallpaper_url).empty()) {
                  id(fetch_wallpaper_debounced).stop();
                  id(current_loaded_wallpaper_url) = "";
                  id(home_wallpaper_art).release();
                }
              } else if (id(display_power_state) == 0 && st.wallpaper_url != id(current_loaded_wallpaper_url)) {
                id(fetch_wallpaper_debounced).execute();
              }
              if (id(display_power_state) == 0 && !id(is_hibernating)) {
                latter_ui::schedule_disp_update(&id(disp1));
              }
            }

  - platform: homeassistant
    id: ha_active_media_blob
    entity_id: ${active_media_sensor}
    attribute: payload
    internal: true
    on_value:
      then:
        - lambda: |-
            std::string prev_title = latter_ui::media_state().title;
            if (latter_ui::parse_v3_media_payload(x, latter_ui::media_state())) {
              const auto &ms = latter_ui::media_state();
              if (!ms.media_type.empty()) {
                id(active_playback_media_type) = ms.media_type;
              }
              if (ms.position >= 0.0f) {
                id(music_pos_base) = ms.position;
                id(music_pos_sync_time) = millis();
              }
              if (!ms.active_speaker.empty()) {
                id(active_speaker_entity) = ms.active_speaker;
              }
              if (ms.is_local) {
                id(active_speaker_name) = "${friendly_name}";
              } else if (!ms.speaker_name.empty() && ms.speaker_name != "None") {
                id(active_speaker_name) = ms.speaker_name;
              } else if (!ms.active_speaker.empty()) {
                std::string s = ms.active_speaker;
                size_t dot = s.find('.');
                if (dot != std::string::npos) s = s.substr(dot + 1);
                bool cap = true;
                for (size_t i = 0; i < s.length(); i++) {
                  if (s[i] == '_') { s[i] = ' '; cap = true; }
                  else if (cap) { s[i] = toupper(s[i]); cap = false; }
                }
                id(active_speaker_name) = s;
              }
              if (ms.has_volume && ms.volume >= 0.0f && ms.volume <= 1.0f) {
                if (millis() - latter_ui::last_local_vol_tap_ms() > 3000U) {
                  latter_ui::remote_vol_pct() = static_cast<int>(std::round(ms.volume * 100.0f));
                  if (ms.is_local) {
                    id(latter_media_player).volume = ms.volume;
                    id(physical_speaker).set_volume(std::clamp(ms.volume, 0.10f, 1.0f));
                  }
                }
              }
              if (ms.title != prev_title) {
                id(music_action_feedback) = "";
                if (!ms.title.empty() && ms.title != "Idle" && ms.title != "None") {
                  latter_ui::music_queue_cleared() = false;
                }
              }
              if (ms.art_url.empty() || ms.art_url == "none" ||
                  ms.art_url == "unknown" || ms.art_url == "unavailable") {
                if (!id(current_loaded_art_url).empty()) {
                  id(fetch_remote_art_debounced).stop();
                  id(current_loaded_art_url) = "";
                  id(remote_album_art).release();
                }
              } else if (id(display_power_state) == 0 && id(gui_page) == 2 &&
                         (!ms.is_local || id(album_art).get_width() == 0) &&
                         ms.art_url != id(current_loaded_art_url)) {
                id(fetch_remote_art_debounced).execute();
              }
              if (id(display_power_state) == 0 && (id(gui_page) == 1 || id(gui_page) == 2)) {
                id(throttled_disp_update).execute();
              }
            }

  - platform: homeassistant
    id: ha_remote_cfg_blob
    entity_id: ${remote_config_sensor}
    attribute: payload
    internal: true
    on_value:
      then:
        - lambda: |-
            if (latter_ui::parse_v3_remote_payload(x, latter_ui::remote_state())) {
              const auto &rs = latter_ui::remote_state();
              latter_ui::parse_latter_remote_slots_summary(
                  rs.slots_summary,
                  "${remote_1_entity}", "${remote_1_name}",
                  "${remote_2_entity}", "${remote_2_name}",
                  "${remote_3_entity}", "${remote_3_name}",
                  "${remote_4_entity}", "${remote_4_name}");
              id(active_remote_slot) = latter_ui::resolve_active_remote_slot(rs.active_slot);
              latter_ui::home_dock_page() = 0;
              if (!latter_ui::has_any_configured_remote() && id(gui_page) == 7) {
                id(gui_page) = 1;
                id(remote_subpage) = 0;
              }
              if (id(display_power_state) == 0 && (id(gui_page) == 1 || id(gui_page) == 7) && millis() > 3000) {
                latter_ui::schedule_disp_update(&id(disp1));
              }
            }

  - platform: homeassistant
    id: ha_weather_blob
    entity_id: ${weather_forecast_sensor}
    attribute: payload
    internal: true
    on_value:
      then:
        - lambda: |-
            if (latter_ui::parse_v3_weather_payload(x, latter_ui::weather_state())) {
              if (id(display_power_state) == 0 && !id(is_hibernating)) {
                latter_ui::weather_sim_dirty() = true;
                latter_ui::record_ambient_frame_ms(0);
                latter_ui::schedule_disp_update(&id(disp1));
              }
            }

  - platform: homeassistant
    id: ha_calendar_blob
    entity_id: ${calendar_agenda_sensor}
    attribute: payload
    internal: true
    on_value:
      then:
        - lambda: |-
            if (latter_ui::parse_v3_calendar_payload(x, latter_ui::calendar_state())) {
              if (id(display_power_state) == 0 && (id(gui_page) == 1 || (id(gui_page) == 8 && id(tools_subpage) == 9))) {
                latter_ui::schedule_disp_update(&id(disp1));
              }
            }

  - platform: template
    name: "System: Hardware Manifest"
    id: latter_hardware_manifest
    icon: "mdi:chip"
    entity_category: diagnostic
    update_interval: 300s
    lambda: |-
      return latter_ui::build_hardware_manifest_state_json();
