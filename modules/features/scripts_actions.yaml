          } else {
            ESP_LOGW("ui", "Rejecting non-media_player target: %s", id(target_speaker_id).c_str());
            id(music_action_feedback) = "Invalid Speaker";
          }
          id(music_feedback_timer) = millis();
          auto &ms = latter_ui::media_state();
          const std::string &loc_spk = ms.local_speaker;
          const bool new_is_local = (!loc_spk.empty() && id(active_speaker_entity) == loc_spk);
          ms.active_speaker = id(active_speaker_entity);
          ms.speaker_name = id(active_speaker_name);
          ms.is_local = new_is_local;
          id(music_overlay_mode) = 0;
