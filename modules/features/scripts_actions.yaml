            id(active_speaker_name) = "${friendly_name}";
            latter_ui::media_state().is_local = !loc_spk.empty();
            id(current_loaded_art_url) = "";
          }
          id(music_overlay_mode) = 0;
      - homeassistant.action:
          action: latter.set_active_speaker
          data:
            target_device: "${name}"
            entity_id: !lambda 'return id(active_speaker_entity).c_str();'
            transfer_queue: "false"
      - lambda: 'latter_ui::release_art(id(remote_album_art));'
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  - id: play_music_slot
    mode: restart
    parameters:
      slot: int
    then:
      - lambda: |-
          if (slot == 1) {
            id(selected_slot_name) = id(slot_1_name);
            id(selected_slot_id)   = id(slot_1_id);
            id(selected_slot_type) = id(slot_1_type);
          } else if (slot == 2) {
            id(selected_slot_name) = id(slot_2_name);
            id(selected_slot_id)   = id(slot_2_id);
            id(selected_slot_type) = id(slot_2_type);
          } else if (slot == 3) {
            id(selected_slot_name) = id(slot_3_name);
            id(selected_slot_id)   = id(slot_3_id);
            id(selected_slot_type) = id(slot_3_type);
          } else if (slot == 4) {
            id(selected_slot_name) = id(slot_4_name);
            id(selected_slot_id)   = id(slot_4_id);
            id(selected_slot_type) = id(slot_4_type);
          } else {
            id(selected_slot_name) = id(slot_5_name);
            id(selected_slot_id)   = id(slot_5_id);
            id(selected_slot_type) = id(slot_5_type);
          }
          if (id(active_speaker_entity).empty()) {
            id(active_speaker_entity) = latter_ui::media_state().local_speaker;
            latter_ui::media_state().is_local = !latter_ui::media_state().local_speaker.empty();
          }
          if (id(selected_category_mode) == "artist") {
            id(selected_slot_type) = "artist";
          } else if (id(selected_category_mode) == "album" || id(selected_category_mode) == "artist_albums") {
            id(selected_slot_type) = "album";
          } else if (id(selected_category_mode) == "podcast_episodes") {
            id(selected_slot_type) = "podcast_episode";
          } else if (id(selected_slot_type).empty()) {
            id(selected_slot_type) = "music";
          }
          id(music_action_feedback) = "Playing: " + id(selected_slot_name);
          id(music_feedback_timer) = millis();
          latter_ui::set_remote_play_override(true, millis());
          if (id(selected_category_mode) == "podcast_episodes") {
            id(active_playback_media_type) = "podcast";
          } else if (id(selected_category_mode) == "audiobook") {
            id(active_playback_media_type) = "audiobook";
          } else {
            id(active_playback_media_type) = "music";
          }
          id(music_overlay_mode) = 0;
          id(music_hud_active) = true;
          id(music_hud_timer) = millis();
          if (latter_ui::media_state().is_local && id(mww).is_running()) {  // media pauses the wake word
            id(mww).stop();
          }
      - homeassistant.action:
          action: latter.media_command
          data:
            target_device: "${name}"
            command: "play_media"
            entity_id: !lambda 'return id(active_speaker_entity).c_str();'
            media_id: !lambda 'return id(selected_slot_id).c_str();'
            media_type: !lambda 'return id(selected_slot_type).c_str();'
            enqueue: "replace"
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'

  # Debounced: the ~0.6 s gap between tracks must never power the speaker path down or start the wake word.
  - id: mp_idle_debounce
    mode: restart
    then:
      - delay: 3s
      - script.execute: media_idle_finish

  # A deliberate pause (on_pause) has no gap to ride out: release the paused frames (as pause_all_music
  # does) and finish at once, so the wake word is back within ~0.5 s instead of after the 3 s debounce.
  - id: mp_pause_settle
    mode: restart
    then:
      - script.stop: mp_idle_debounce
      - speaker.stop: media_mixing_input
      - wait_until:
          condition:
            lambda: 'return !id(media_mixing_input).is_running();'
          timeout: 500ms
      - script.execute: media_idle_finish

  # Local audio is idle: silence and power down the speaker path in order (DAC mute, amplifier off; the
  # speaker stops on its own timeout), hand the microphone back to the wake word, and relax power.
  - id: media_idle_finish
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
                     (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING) &&
                     (id(sendspin_group_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
                     !id(media_mixing_input).is_running() &&
                     !id(va).is_running() &&
                     !id(va_active) &&
                     !id(va_tts_received) &&
                     !id(announcement_mixing_input).is_running() &&
                     !latter_ui::cam_call_active() &&
                     !latter_ui::cam_listen_active() &&
                     !id(alarm_ringing) &&
                     !id(timer_ringing) &&
                     !id(find_my_active) &&
                     (id(active_game) == 0);
          then:
            - lambda: 'id(hal_set_dac_mute).execute(true);'
            - switch.turn_off: speaker_enable
            - script.execute: route_i2s_to_mic
            - script.execute: sync_wake_word_state
            - lambda: |-
                auto ww_mode = id(va_wake_word_mode).current_option();
                const bool ww_act = (ww_mode == "Always On") || (ww_mode == "Docked Only" && id(usb_connected).state);
                if (!ww_act) {
                  id(hal_set_audio_codecs_standby).execute(true);
                }
                if (id(display_power_state) == 2 && !id(usb_connected).state) {
                  if (id(sleep_start_time) == 0) id(sleep_start_time) = millis();
                }
                if (id(display_power_state) == 0 &&
                    !latter_ui::area_ctx_state().wallpaper_url.empty() &&
                    latter_ui::area_ctx_state().wallpaper_url != id(current_loaded_wallpaper_url)) {
                  id(fetch_wallpaper_debounced).execute();
                }
                id(apply_power_policy).execute();  // local audio idle: beacon back, modem sleep if screen off

  - id: toggle_voice_assistant
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(va_active) || !id(va_status_text).empty();'
          then:
            - script.execute: cancel_voice_assistant
          else:
            - if:
                condition:
                  lambda: 'return id(va).get_api_connection() == nullptr;'
                then:
                  - logger.log:
                      level: WARN
                      format: "Assist pipeline not connected to Home Assistant yet; ignoring PTT press"
                  - script.stop: toggle_voice_assistant
            - script.stop: va_echo_gate
            - lambda: |-
                latter_ui::request_radio_boost(millis(), 15000U);  // VA about to stream: full-throughput Wi-Fi now
                id(apply_power_policy).execute();
                id(hal_set_audio_codecs_standby).execute(false);
                id(latter_mic).set_mute_state(false);
                id(va_restore_display).stop();
                latter_ui::va_display_restore().capture(id(display_power_state),
                    id(display_brightness).current_values.is_on(), millis(), true);
                // If waking from screen-off or standby, honor Assist Screen Wake preference
                if (id(display_power_state) != 0 || !id(display_brightness).current_values.is_on()) {
                  if (id(va_wake_screen_switch).state) {
                    latter_ui::note_wake_reason(latter_ui::WakeReason::VOICE);
                    id(wake_to_active_state).execute();
                  }
                } else {
                  id(screen_sleep_timer).execute();
                }
                if (!id(va_active)) {
                  id(return_page) = id(gui_page);
                  id(va_active) = true;
                }
                id(va_tts_received) = false;
            - if:
                condition:
                  micro_wake_word.is_running:
                then:
                  - micro_wake_word.stop:
                  - delay: 20ms
            - if:
                condition:
                  lambda: |-
                    return !id(va_resume_music_after) &&
                           ((id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                            (!id(active_speaker_entity).empty() && latter_ui::media_state().state == "playing"));
                then:
                  - script.execute: pause_all_music
                  - delay: 160ms
            - script.execute: route_i2s_to_mic
            - script.wait: route_i2s_to_mic
            - voice_assistant.start:

  - id: cancel_voice_assistant
    mode: restart
    then:
      - script.stop: va_tts_drain_and_finish
      - script.stop: va_echo_gate
      - script.stop: mp_idle_debounce
      - lambda: |-
          id(latter_mic).set_mute_state(false);
          id(va_intercom_turn) = false;
          id(va_was_cancelled) = true;
          id(va_status_text) = "";
          id(va_tts_received) = false;
          id(va_vad_active) = false;
          id(va_active) = false;
          id(gui_page) = id(return_page);
          latter_ui::schedule_disp_update(&id(disp1));
      - lambda: 'id(hal_set_dac_mute).execute(true);'
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 50
          duration: 0.05s
      - if:
          condition:
            lambda: |-
              return (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING) ||
                     (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          then:
            - media_player.stop:
                id: latter_media_player
                announcement: true
      - speaker.stop: announcement_mixing_input
      - voice_assistant.stop:
      - wait_until:
          condition:
            lambda: 'return id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_IDLE;'
          timeout: 450ms
      - script.stop: mp_idle_debounce
      - lambda: |-
          esphome::voice_assistant::abort_voice_assistant(id(va));
          id(latter_mic).set_mute_state(false);
          id(va_intercom_turn) = false;
          id(va_was_cancelled) = true;
          id(va_status_text) = "";
          id(va_tts_received) = false;
          id(va_vad_active) = false;
          id(va_active) = false;
          id(gui_page) = id(return_page);
          latter_ui::radio_boost_until_ms() = 0;
          id(apply_power_policy).execute();
      - delay: 25ms
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
      - delay: 160ms
      - script.execute: resume_music_after_va
      - script.execute: va_restore_display
  - id: trigger_firmware_update
    mode: restart
    then:
      - update.perform:
          id: latter_firmware_update
      - lambda: |-
          id(system_menu_mode) = 5;
          latter_ui::schedule_disp_update(&id(disp1));

  - id: check_firmware_update
    mode: restart
    then:
      - update.check:
          id: latter_firmware_update


  - id: menu_scroll_transition
    mode: restart
    then:
      - lambda: |-
          // Time-based page transition: kMotionMs, ease-out cubic (the curve the dock and mode bar use).
          // The display lambda keeps requesting animation frames while menu_scroll_active is set.
          latter_ui::menu_scroll_start_ms() = millis();
          latter_ui::schedule_anim_disp_update(&id(disp1));
      - delay: !lambda 'return latter_ui::kMotionMs;'
      - lambda: |-
          // Commit the target page, release the scroll lock and render the settled frame
          id(menu_scroll_active) = false;
          if (id(gui_page) == 4 && id(system_menu_mode) == 1) {
            id(sleep_menu_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 4 && id(system_menu_mode) == 2) {
            id(display_menu_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 4 && id(system_menu_mode) == 0) {
            id(system_dashboard_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 2 && id(music_overlay_mode) == 2) {
            id(music_category_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 3 && id(active_game) == 0) {
            id(game_carousel_idx) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 8 && id(tools_subpage) == 0) {
            id(tools_menu_page) = id(menu_scroll_target_page);
          }
          latter_ui::schedule_disp_update(&id(disp1));

  # ==============================================================================
  # �� UNIVERSAL TV & MEDIA REMOTE COMMAND SCRIPTS (MULTI-DEVICE & MULTI-PROTOCOL)
  # ==============================================================================
  - id: remote_select_slot_latter
    mode: restart
    parameters:
      slot_num: int
    then:
      - if:
          condition:
            lambda: 'return !latter_ui::remote_state().slots_summary.empty();'
          then:
            - homeassistant.action:
                action: latter.remote_action
                data:
                  target_device: "${name}"
                  slot: !lambda 'return to_string(slot_num);'
                  action: "select_slot"

  - id: remote_send_key
    mode: restart
    parameters:
      key_idx: int
      target_slot: int
    then:
      - delay: 0ms
      - lambda: |-
          int res_slot = (target_slot == -1) ? latter_ui::resolve_active_remote_slot(0)
                                             : latter_ui::resolve_active_remote_slot(target_slot);
          id(remote_latter_slot_num) = res_slot + 1;

          static constexpr const char *kCanonicalCmds[10] = {
            "up", "down", "left", "right", "select",
            "back", "home", "volume_up", "volume_down", "toggle"
          };
          static constexpr const char *kFeedback[10] = {
            "Up", "Down", "Left", "Right", "Select",
            "Back", "Home", "Vol +", "Vol -", "Toggle Power"
          };
          int k = (key_idx >= 0 && key_idx < 10) ? key_idx : 0;
          id(remote_latter_act) = (k == 7) ? "volume_up" : ((k == 8) ? "volume_down" : ((k == 9) ? "toggle" : "command"));
          id(remote_latter_cmd) = kCanonicalCmds[k];
          const std::string *t_names = latter_ui::remote_slots_name();
          if (k == 9 && !t_names[res_slot].empty()) {
            id(remote_action_feedback) = "Power: " + t_names[res_slot];
          } else {
            id(remote_action_feedback) = kFeedback[k];
          }
          id(remote_feedback_timer) = millis();
      - if:
          condition:
            lambda: 'return !latter_ui::remote_state().slots_summary.empty();'
          then:
            - homeassistant.action:
                action: latter.remote_action
                data:
                  target_device: "${name}"
                  slot: !lambda 'return to_string(id(remote_latter_slot_num));'
                  action: !lambda 'return id(remote_latter_act);'
                  command: !lambda 'return id(remote_latter_cmd);'
