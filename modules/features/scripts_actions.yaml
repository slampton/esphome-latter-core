# Latter Client Feature Package: Core Runtime Scripts & Action Handlers

script:
  - id: ui_input_event
    mode: queued
    parameters:
      action: string
      delta: int
    then:
      - lambda: |-
          uint32_t now_in = millis();
          if (id(display_power_state) != 0 || !id(display_brightness).current_values.is_on()) {
            id(wake_to_active_state).execute();
            return;
          }
          id(screen_sleep_timer).execute();
          latter_ui::activate_ui_focus(now_in);
          if (id(va_active) || !id(va_status_text).empty()) {
            id(cancel_voice_assistant).execute();
            return;
          }
          if (id(notif_active)) {
            id(dismiss_notification).execute();
            return;
          }
          if (id(alarm_ringing) || id(timer_ringing) || id(find_my_active)) {
            id(alarm_ringing) = false;
            id(timer_ringing) = false;
            id(find_my_active) = false;
            id(stop_alarm_sound).execute();
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          std::string act = action;
          for (char &c : act) c = static_cast<char>(::tolower(static_cast<unsigned char>(c)));
          int step = delta;
          if (step == 0) {
            if (act == "next" || act == "right" || act == "down" || act == "cw") step = 1;
            else if (act == "prev" || act == "left" || act == "up" || act == "ccw") step = -1;
          }
          if (act == "home") {
            if (id(gui_page) == 8 && id(tools_subpage) == 12) {
              if (latter_ui::cam_call_active() || latter_ui::cam_listen_active()) {
                id(stop_doorbell_call).execute();
              }
              id(camera_snapshot_art).release();
              id(current_loaded_camera_url) = "";
            }
            id(gui_page) = 1;
            id(home_subpage) = 0;
            id(active_game) = 0;
            id(tools_subpage) = 0;
            id(area_subpage) = 0;
            id(remote_subpage) = 0;
            id(music_overlay_mode) = 0;
            id(system_menu_mode) = 0;
            latter_ui::ui_focus_index() = 0;
            id(sync_wake_word_state).execute();
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          if (act == "back") {
            if (id(gui_page) == 8 && id(tools_subpage) > 0) {
              if (id(tools_subpage) == 12) {
                if (latter_ui::cam_call_active() || latter_ui::cam_listen_active()) {
                  id(stop_doorbell_call).execute();
                }
                id(camera_snapshot_art).release();
                id(current_loaded_camera_url) = "";
              }
              if (latter_ui::tools_direct_home()) {
                latter_ui::tools_direct_home() = false;
                id(tools_subpage) = 0;
                id(gui_page) = 1;
              } else {
                id(tools_subpage) = 0;
              }
            } else if (id(gui_page) == 3 && id(active_game) > 0) {
              id(active_game) = 0;
            } else if (id(gui_page) == 2 && id(music_overlay_mode) > 0) {
              id(music_overlay_mode) = 0;
            } else if (id(gui_page) == 4 && id(system_menu_mode) > 0) {
              id(system_menu_mode) = 0;
            } else if (id(gui_page) == 6 && id(area_subpage) > 0) {
              id(area_subpage) = 0;
            } else if (id(gui_page) == 7 && id(remote_subpage) > 0) {
              id(remote_subpage) = 0;
            } else {
              id(gui_page) = 1;
              id(home_subpage) = 0;
            }
            latter_ui::ui_focus_index() = 0;
            id(sync_wake_word_state).execute();
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          if (step != 0) {
            int &f_idx = latter_ui::ui_focus_index();
            f_idx = std::max(0, f_idx + step);
            if (id(gui_page) == 5) {
              id(sky_weather_subpage) = f_idx % 4;
            } else if (id(gui_page) == 9) {
              latter_ui::whole_home_tab() = f_idx % 5;
            } else if (id(gui_page) == 8 && id(tools_subpage) == 12) {
              std::string cam_ids[latter_ui::MAX_CAMERA_SLOTS], cam_names[latter_ui::MAX_CAMERA_SLOTS];
              int c_cnt = std::max(1, latter_ui::parse_cameras_summary_list(id(ha_latter_cameras_summary).state, cam_ids, cam_names));
              latter_ui::cam_carousel_idx() = (latter_ui::cam_carousel_idx() + step + c_cnt) % c_cnt;
              id(fetch_on_demand_camera).execute();
            }
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          if (act == "select" || act == "ok" || act == "click") {
            const int f_idx = std::max(0, latter_ui::ui_focus_index());
            if (id(gui_page) == 1) {
              const int dock_map[6] = {2, 8, 6, 7, 3, 4};
              id(gui_page) = dock_map[f_idx % 6];
              latter_ui::ui_focus_index() = 0;
              if (id(gui_page) == 6) id(fetch_area_browse).execute();
            } else if (id(gui_page) == 2) {
              if (id(music_overlay_mode) == 0) {
                const int m_act = f_idx % 5;
                if (m_act == 0) id(music_prev_track).execute();
                else if (m_act == 1) id(toggle_ha_music).execute();
                else if (m_act == 2) id(music_next_track).execute();
                else if (m_act == 3) { id(music_overlay_mode) = 2; id(selected_category_mode) = "favorites"; id(fetch_music_browse).execute(); }
                else { id(music_overlay_mode) = 3; id(selected_category_mode) = "speakers"; id(fetch_music_browse).execute(); }
              } else {
                id(play_music_slot).execute((f_idx % 5) + 1);
              }
            } else if (id(gui_page) == 3 && id(active_game) == 0) {
              id(active_game) = (f_idx % 6) + 1;
            } else if (id(gui_page) == 6 && id(area_subpage) == 0) {
              const int slot = f_idx % 7;
              if (slot == 0 && !id(area_slot_1_id).empty()) { id(area_target_entity_id) = id(area_slot_1_id); id(area_target_action) = "toggle"; id(execute_area_action).execute(); }
              else if (slot == 1 && !id(area_slot_2_id).empty()) { id(area_target_entity_id) = id(area_slot_2_id); id(area_target_action) = "toggle"; id(execute_area_action).execute(); }
              else if (slot == 2 && !id(area_slot_3_id).empty()) { id(area_target_entity_id) = id(area_slot_3_id); id(area_target_action) = "toggle"; id(execute_area_action).execute(); }
            } else if (id(gui_page) == 7) {
              const int key_map[8] = {9, 0, 2, 4, 3, 1, 5, 6};
              id(remote_send_key).execute(key_map[f_idx % 8], id(active_remote_slot));
            } else if (id(gui_page) == 8 && id(tools_subpage) == 0) {
              id(tools_subpage) = (id(tools_menu_page) * 6) + (f_idx % 6) + 1;
              if (id(tools_subpage) == 12) id(fetch_on_demand_camera).execute();
            }
            id(sync_wake_word_state).execute();
            latter_ui::schedule_disp_update(&id(disp1));
          }
  - id: pause_all_music
    mode: restart
    then:
      - lambda: |-
          bool local_active = (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          bool remote_active = (!id(active_speaker_entity).empty() && (id(active_speaker_entity) != "${local_player_id}") && (id(ha_target_state).state == "playing"));
          if (local_active || remote_active) {
            id(va_resume_music_after) = true;
          }
          ESP_LOGI("audio", "pause_all_music: local=%d, remote=%d -> va_resume_music_after=%d", local_active, remote_active, id(va_resume_music_after));
      - if:
          condition:
            lambda: 'return id(va_resume_music_after);'
          then:
            - media_player.pause: latter_media_player
            - speaker.stop: media_mixing_input
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 50
                duration: 0.1s
            - homeassistant.action:
                action: latter.media_command
                data:
                  target_device: "${name}"
                  command: "pause"

  - id: resume_music_after_va
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(alarm_ringing) || id(timer_ringing) || id(find_my_active);'
          then:
            - script.stop: resume_music_after_va
      - if:
          condition:
            lambda: 'return id(va_resume_music_after);'
          then:
            - script.execute: mp_idle_debounce
            - lambda: |-
                id(va_resume_music_after) = false;
                ESP_LOGI("audio", "resume_music_after_va: restoring playback for %s (cancelled=%d)", id(active_speaker_entity).c_str(), id(va_was_cancelled));
            - if:
                condition:
                  lambda: 'return !id(active_speaker_entity).empty() && (id(active_speaker_entity) != "${local_player_id}");'
                then:
                  - lambda: |-
                      id(va_was_cancelled) = false;
                      if (id(display_power_state) == 0 && id(ble_area_beacon_switch).state && !id(ble_ctrl).is_active() && !id(ble_ctrl).is_failed()) {
                        id(ble_ctrl).enable();
                      }
                  - homeassistant.action:
                      action: latter.media_command
                      data:
                        target_device: "${name}"
                        command: "play"
                  - lambda: 'id(hal_set_dac_mute).execute(true);'
                  - script.execute: route_i2s_to_mic
                  - script.execute: sync_wake_word_state
                else:
                  - script.execute: route_i2s_to_spk
                  - switch.turn_on: speaker_enable
                  - if:
                      condition:
                        lambda: 'return !id(alarm_ringing) && !id(timer_ringing) && !id(find_my_active);'
                      then:
                        - mixer_speaker.apply_ducking:
                            id: media_mixing_input
                            decibel_reduction: 0
                            duration: 0.2s
                        - mixer_speaker.apply_ducking:
                            id: announcement_mixing_input
                            decibel_reduction: 50
                            duration: 0.1s
                        - lambda: |-
                            float v = id(latter_media_player).volume;
                            if (std::isnan(v) || v <= 0.0f) v = 0.60f;
                            id(physical_speaker).set_volume(std::clamp(v, 0.10f, 1.0f));
                  # Dispatch play via latter.media_command so it never double-triggers with the media_play interceptor
                  - homeassistant.action:
                      action: latter.media_command
                      data:
                        target_device: "${name}"
                        command: "play"
                  # If VA was terminated early, keep speaker DAC muted for 700ms while Sendspin
                  # handshakes so any residual TTS audio inside physical_speaker's 1000ms buffer
                  # drains completely silently instead of playing a 0.4s burst before music starts
                  - if:
                      condition:
                        lambda: 'return id(va_was_cancelled);'
                      then:
                        - lambda: 'id(va_was_cancelled) = false;'
                        - delay: 700ms
                  - lambda: 'id(hal_set_dac_mute).execute(false);'
          else:
            - lambda: |-
                id(va_was_cancelled) = false;
                if (id(display_power_state) == 0 && id(ble_area_beacon_switch).state && !id(ble_ctrl).is_active() && !id(ble_ctrl).is_failed()) {
                  id(ble_ctrl).enable();
                }
            - lambda: 'id(hal_set_dac_mute).execute(true);'
            - script.execute: route_i2s_to_mic
            - script.execute: sync_wake_word_state
  - id: fetch_remote_art_debounced
    mode: restart
    then:
      - delay: 650ms
      - if:
          condition:
            lambda: |-
              return (id(active_speaker_entity) != "${local_player_id}") &&
                     (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          then:
            - wait_until:
                condition:
                  lambda: 'return id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING;'
                timeout: 2500ms
            - delay: 250ms
      - if:
          condition:
            lambda: |-
              return (id(gui_page) == 2) &&
                     (id(display_power_state) == 0) &&
                     !id(va_active) && id(va_status_text).empty() &&
                     (id(active_speaker_entity) != "${local_player_id}") &&
                     !id(ha_target_art_url).state.empty() &&
                     (id(ha_target_art_url).state != "none") &&
                     (id(ha_target_art_url).state != "unknown") &&
                     (id(ha_target_art_url).state != "unavailable") &&
                     (id(ha_target_art_url).state != id(current_loaded_art_url));
          then:
            - lambda: 'id(current_loaded_art_url) = id(ha_target_art_url).state;'
            - online_image.set_url:
                id: remote_album_art
                url: !lambda 'return id(ha_target_art_url).state;'

  - id: fetch_wallpaper_debounced
    mode: restart
    then:
      - delay: 500ms
      - if:
          condition:
            lambda: |-
              return (id(display_power_state) == 0) &&
                     !id(va_active) && id(va_status_text).empty() &&
                     (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
                     !id(ha_latter_wallpaper_url).state.empty() &&
                     (id(ha_latter_wallpaper_url).state != "none") &&
                     (id(ha_latter_wallpaper_url).state != "unknown") &&
                     (id(ha_latter_wallpaper_url).state != "unavailable") &&
                     (id(ha_latter_wallpaper_url).state != id(current_loaded_wallpaper_url));
          then:
            - lambda: 'id(current_loaded_wallpaper_url) = id(ha_latter_wallpaper_url).state;'
            - online_image.set_url:
                id: home_wallpaper_art
                url: !lambda 'return id(ha_latter_wallpaper_url).state;'

  - id: fetch_calendar_browse
    mode: restart
    then:
      - homeassistant.action:
          action: latter.calendar_fetch
          data:
            target_device: "${name}"
            days: "30"
            page: !lambda 'return to_string(id(cal_browse_page));'
            page_size: "5"

  - id: create_calendar_quick_event
    mode: restart
    then:
      - homeassistant.action:
          action: latter.calendar_create_event
          data:
            target_device: "${name}"
            summary: !lambda 'return id(cal_quick_summary).c_str();'
            in_minutes: !lambda 'return to_string(id(cal_quick_in_minutes));'
            duration_minutes: !lambda 'return to_string(id(cal_quick_duration_minutes));'
      - delay: 650ms
      - script.execute: fetch_calendar_browse

  - id: fetch_calendar_map_snapshot
    mode: restart
    then:
      - delay: 40ms
      - if:
          condition:
            lambda: 'return !latter_ui::cal_detail_location().empty() && !latter_ui::cal_detail_map_url().empty();'
          then:
            - lambda: |-
                const std::string &base_map_u = latter_ui::cal_detail_map_url();
                id(notif_camera_url) = base_map_u +
                                       "&z=" + to_string(latter_ui::cal_map_zoom()) +
                                       "&pan_x=" + to_string(latter_ui::cal_map_pan_x()) +
                                       "&pan_y=" + to_string(latter_ui::cal_map_pan_y());
                ESP_LOGI("cal_map", "Fetching Calendar Map Snapshot: %s", id(notif_camera_url).c_str());
            - online_image.set_url:
                id: camera_snapshot_art
                url: !lambda 'return id(notif_camera_url);'

  - id: send_intercom_broadcast
    mode: restart
    then:
      - homeassistant.action:
          action: latter.intercom_broadcast
          data:
            target_device: "${name}"
            message: !lambda 'return id(intercom_message_str).c_str();'

  - id: trigger_latter_macro
    mode: restart
    then:
      - homeassistant.action:
          action: latter.trigger_binding
          data:
            target_device: "${name}"
            slot: !lambda 'return id(macro_target_slot).c_str();'

  - id: fetch_on_demand_camera
    mode: restart
    then:
      - delay: 15ms
      - lambda: |-
          latter_ui::last_cam_live_fetch_ms() = millis();
          id(notif_camera_url) = latter_ui::build_carousel_camera_url(
              id(ha_latter_camera_snapshot_url).state,
              id(ha_latter_wallpaper_url).state,
              id(ha_target_art_url).state,
              "${name}", "${screen_w}", "${screen_h}", "${art_shape}",
              id(ha_latter_cameras_summary).state,
              millis());
      - if:
          condition:
            lambda: 'return !id(notif_camera_url).empty();'
          then:
            - lambda: 'latter_ui::cam_download_in_progress() = true;'
            - online_image.set_url:
                id: camera_snapshot_art
                url: !lambda 'return id(notif_camera_url);'

  - id: send_doorbell_intercom_cmd
    mode: restart
    then:
      - homeassistant.action:
          action: latter.doorbell_intercom
          data:
            target_device: "${name}"
            action: !lambda 'return id(cam_intercom_action).c_str();'
            camera_entity: !lambda |-
              return latter_ui::resolve_active_carousel_camera_id(
                  id(ha_latter_cameras_summary).state,
                  id(ha_latter_camera_snapshot_url).state).c_str();
            camera_index: !lambda 'return to_string(latter_ui::cam_carousel_idx());'
            message: !lambda 'return id(cam_intercom_message).c_str();'
            anc_mode: !lambda 'return id(cam_intercom_anc_str).c_str();'

  - id: start_doorbell_call
    mode: restart
    then:
      - lambda: |-
          latter_ui::cam_call_active() = true;
          latter_ui::cam_listen_active() = true;
          latter_ui::cam_intercom_status() = "2-WAY CALL (ANC)";
          id(cam_intercom_status_ms) = millis();
          id(cam_intercom_action) = "listen_start";
          latter_ui::schedule_disp_update(&id(disp1));
      - script.execute: send_doorbell_intercom_cmd
      - delay: 350ms
      - if:
          condition:
            lambda: 'return latter_ui::cam_call_active() && id(va).get_api_connection() != nullptr;'
          then:
            - script.execute: start_doorbell_ptt

  - id: stop_doorbell_call
    mode: restart
    then:
      - script.stop: rearm_doorbell_duplex_mic
      - script.stop: start_doorbell_ptt
      - lambda: |-
          latter_ui::cam_call_active() = false;
          latter_ui::cam_intercom_ptt_active() = false;
          latter_ui::cam_listen_active() = false;
          latter_ui::cam_intercom_status() = "CALL ENDED";
          id(cam_intercom_status_ms) = millis();
          id(cam_intercom_action) = "listen_stop";
          esphome::voice_assistant::abort_voice_assistant(id(va));
          latter_ui::schedule_disp_update(&id(disp1));
      - script.execute: send_doorbell_intercom_cmd
      - media_player.stop: latter_media_player
      - script.execute: mp_idle_debounce

  - id: rearm_doorbell_duplex_mic
    mode: restart
    then:
      - delay: 2800ms
      - if:
          condition:
            lambda: |-
              return latter_ui::cam_call_active() &&
                     (id(gui_page) == 8 && id(tools_subpage) == 12) &&
                     (id(display_power_state) == 0);
          then:
            - script.execute: start_doorbell_ptt

  - id: start_doorbell_ptt
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(va).get_api_connection() == nullptr;'
          then:
            - lambda: |-
                if (!latter_ui::cam_call_active()) {
                  latter_ui::cam_quick_reply_open() = true;
                }
                latter_ui::schedule_disp_update(&id(disp1));
            - script.stop: start_doorbell_ptt
      - if:
          condition:
            lambda: 'return latter_ui::cam_listen_active();'
          then:
            - lambda: |-
                latter_ui::cam_listen_active() = false;
                id(cam_intercom_action) = "listen_stop";
            - script.execute: send_doorbell_intercom_cmd
            - media_player.stop: latter_media_player
      - if:
          condition:
            micro_wake_word.is_running:
          then:
            - micro_wake_word.stop:
            - delay: 20ms
      - lambda: |-
          latter_ui::cam_intercom_ptt_active() = true;
          latter_ui::cam_intercom_status() = latter_ui::cam_call_active() ? "2-WAY CALL • LISTENING" : "SPEAK TO DOORBELL...";
          id(cam_intercom_status_ms) = millis();
          latter_ui::schedule_disp_update(&id(disp1));
      - script.execute: route_i2s_to_mic
      - script.wait: route_i2s_to_mic
      - voice_assistant.start:

  - id: fetch_camera_snapshot
    mode: restart
    then:
      - delay: 80ms
      - if:
          condition:
            lambda: |-
              return id(notif_active) &&
                     !id(notif_camera_url).empty() &&
                     (id(notif_camera_url) != "none") &&
                     (id(notif_camera_url) != "unknown") &&
                     (id(notif_camera_url) != "unavailable");
          then:
            - online_image.set_url:
                id: camera_snapshot_art
                url: !lambda 'return id(notif_camera_url);'

  - id: dismiss_notification
    mode: restart
    then:
      - script.stop: fetch_camera_snapshot
      - lambda: |-
          id(notif_active) = false;
          id(notif_camera_url) = "";
          id(current_loaded_camera_url) = "";
      - online_image.release: camera_snapshot_art
      - script.execute: mp_idle_debounce
      - script.execute: sync_wake_word_state
      - script.execute: screen_sleep_timer
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'

  - id: throttled_disp_update
    mode: restart
    then:
      - delay: 120ms
      - if:
          condition:
            lambda: |-
              static uint32_t last_throttled_draw = 0;
              uint32_t now = millis();
              if (now - last_throttled_draw < 200) return false;
              if (now - latter_ui::last_page2_draw_ms() < 250) return false;
              if (id(display_power_state) == 0 && id(gui_page) == 2 && !id(va_active)) {
                last_throttled_draw = now;
                return true;
              }
              return false;
          then:
            - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'

  - id: apply_theme_preset
    mode: restart
    then:
      - lambda: |-
          std::string p = std::string(id(theme_palette_select).current_option());
          #if LATTER_PANEL_IPS
          const bool is_ips_lcd = true;
          #else
          const bool is_ips_lcd = false;
          #endif
          id(theme_secondary) = is_ips_lcd ? Color(224, 232, 242) : Color(192, 192, 192);
          if (is_ips_lcd) {
            id(col_gold) = Color(255, 188, 20);
            id(col_warm_gold) = Color(255, 160, 16);
            id(col_orange) = Color(255, 112, 20);
            id(col_red) = Color(242, 60, 50);
            id(col_green) = Color(56, 206, 110);
          }
          if (p == "Custom") {
            latter_ui::apply_custom_rgb_harmony(id(custom_theme_rgb), id(theme_primary), id(theme_secondary));
          } else if (p == "Pink") {
            id(theme_primary) = is_ips_lcd ? Color(236, 128, 162) : Color(168, 120, 132);
          } else if (p == "Green") {
            id(theme_primary) = is_ips_lcd ? Color(68, 196, 122)  : Color(66, 116, 83);
          } else if (p == "Blue") {
            id(theme_primary) = is_ips_lcd ? Color(56, 156, 244)  : Color(69, 110, 138);
          } else {
            id(theme_primary) = is_ips_lcd ? Color(88, 184, 238)  : Color(107, 142, 158);
          }
          if (id(display_power_state) == 0) latter_ui::schedule_disp_update(&id(disp1));

  - id: save_custom_color_to_latter
    mode: restart
    then:
