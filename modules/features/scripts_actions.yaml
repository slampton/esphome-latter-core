# Latter Client Feature Package: Core Runtime Scripts & Action Handlers

script:
  # device_hello to Home Assistant (contract, boot id, hardware manifest with reset reason, crash and
  # rollback) published over the bound System: RPC Outbox text_sensor once HA subscribes to entity states.
  - id: send_device_hello
    mode: restart
    then:
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 30s
      - delay: 250ms
      - lambda: |-
          const std::string contract_str = std::to_string(latter_ui::kProtocolContractVersion);
          const std::string boot_str = std::to_string(latter_ui::device_boot_id());
          const std::string manifest_str = latter_ui::build_hardware_manifest_json();
          latter_rpc::emit(&id(latter_rpc_outbox), "device_hello", {
            {"contract", contract_str},
            {"boot_id", boot_str},
            {"manifest", manifest_str},
          });

