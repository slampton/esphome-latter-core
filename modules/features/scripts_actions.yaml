  - id: activate_selected_speaker
    mode: restart
    parameters:
      prefix: string
      transfer_queue: string
    then:
      - lambda: |-
          if (id(target_speaker_id).rfind("media_player.", 0) == 0) {
            if (id(active_speaker_entity) != id(target_speaker_id) && !id(active_speaker_entity).empty()) {
              id(last_speaker_entity) = id(active_speaker_entity);
            }
            id(active_speaker_entity) = id(target_speaker_id);
            id(active_speaker_name) = id(target_speaker_name);
