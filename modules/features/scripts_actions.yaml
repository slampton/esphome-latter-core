      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'

  # One push-to-talk turn of a doorbell call (the Talk pill): the device's speech becomes text that the
  # doorbell speaks with TTS.
  - id: start_doorbell_ptt
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(va).get_api_connection() == nullptr;'
