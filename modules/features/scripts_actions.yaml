                case S::CLOCK_FACE_STYLE: wr(id(clock_face_style)); break;
                case S::TIME_FORMAT: wr(id(time_format_select)); break;
                case S::AUTO_BRIGHTNESS_MODE: wr(id(auto_brightness_mode)); break;
                case S::DISPLAY_BRIGHTNESS_PRESET: wr(id(display_brightness_preset)); break;
                case S::DAY_BRIGHTNESS_PRESET: wr(id(day_brightness_preset)); break;
                case S::NIGHT_BRIGHTNESS_PRESET: wr(id(night_brightness_preset)); break;
                case S::AREA_DEFAULT_CATEGORY: wr(id(area_default_category_select)); break;
              }
            };

            rt.get_switch = +[](latter_ui::UiSwitchId swid) -> bool {
              using W = latter_ui::UiSwitchId;
              auto rd = [](auto *sw) -> bool { return sw != nullptr && sw->state; };
              switch (swid) {
                case W::HOME_WEATHER_BG: return rd(id(home_weather_bg_switch));
                case W::HOME_WAKE_GREETING: return rd(id(home_wake_greeting_switch));
                case W::MUSIC_SHOW_SPEAKER_SHORTCUT: return rd(id(music_show_speaker_shortcut));
                case W::MUSIC_SHOW_LIBRARY_SHORTCUT: return rd(id(music_show_library_shortcut));
                case W::BLE_AREA_BEACON: return rd(id(ble_area_beacon_switch));
                case W::GAME_SOUND: return rd(id(game_sound_switch));
                case W::VA_WAKE_SCREEN: return rd(id(va_wake_screen_switch));
                case W::DOCKED_SCREENSAVER: return rd(id(docked_screensaver_switch));
                case W::INSTANT_CROWN_HIBERNATE: return rd(id(instant_crown_hibernate_switch));
                case W::AREA_SHOW_ALL_CATEGORY: return rd(id(area_show_all_category_switch));
              }
              return false;
            };

            rt.toggle_switch = +[](latter_ui::UiSwitchId swid) {
              using W = latter_ui::UiSwitchId;
              auto tg = [](auto *sw) { if (sw != nullptr) sw->toggle(); };
              switch (swid) {
                case W::HOME_WEATHER_BG: tg(id(home_weather_bg_switch)); break;
                case W::HOME_WAKE_GREETING: tg(id(home_wake_greeting_switch)); break;
                case W::MUSIC_SHOW_SPEAKER_SHORTCUT: tg(id(music_show_speaker_shortcut)); break;
                case W::MUSIC_SHOW_LIBRARY_SHORTCUT: tg(id(music_show_library_shortcut)); break;
                case W::BLE_AREA_BEACON: tg(id(ble_area_beacon_switch)); break;
                case W::GAME_SOUND: tg(id(game_sound_switch)); break;
                case W::VA_WAKE_SCREEN: tg(id(va_wake_screen_switch)); break;
                case W::DOCKED_SCREENSAVER: tg(id(docked_screensaver_switch)); break;
                case W::INSTANT_CROWN_HIBERNATE: tg(id(instant_crown_hibernate_switch)); break;
                case W::AREA_SHOW_ALL_CATEGORY: tg(id(area_show_all_category_switch)); break;
              }
            };

            rt.get_number = +[](latter_ui::UiNumberId nid) -> float {
              using N = latter_ui::UiNumberId;
              auto rd = [](auto *num) -> float { return num != nullptr ? num->state : 0.0f; };
              switch (nid) {
                case N::VOLUME_STEP_SIZE: return rd(id(volume_step_size));
                case N::SPEAKER_VOLUME: return rd(id(speaker_volume));
                case N::ALERT_VOLUME: return rd(id(alert_volume));
                case N::DAY_START_HOUR: return rd(id(day_start_hour));
                case N::NIGHT_START_HOUR: return rd(id(night_start_hour));
              }
              return 0.0f;
            };

            rt.set_number = +[](latter_ui::UiNumberId nid, float val) {
              using N = latter_ui::UiNumberId;
              auto wr = [](auto *num, float v, float lo, float hi) {
                if (num == nullptr) return;
                const float cl = std::clamp(v, lo, hi);
                auto call = num->make_call();
                call.set_value(cl);
                call.perform();
              };
              switch (nid) {
                case N::VOLUME_STEP_SIZE: wr(id(volume_step_size), val, 1.0f, 10.0f); break;
                case N::SPEAKER_VOLUME: wr(id(speaker_volume), val, 10.0f, 100.0f); break;
                case N::ALERT_VOLUME: wr(id(alert_volume), val, 20.0f, 100.0f); break;
                case N::DAY_START_HOUR: wr(id(day_start_hour), val, 0.0f, 23.0f); break;
                case N::NIGHT_START_HOUR: wr(id(night_start_hour), val, 0.0f, 23.0f); break;
              }
            };

            rt.bound = true;
          }

  - id: ui_input_event
    mode: queued
    parameters:
      action: string
      delta: int
    then:
      - lambda: |-
          id(sync_ui_touch_runtime).execute();
          latter_ui::touch_engine().on_input_event(action, delta, millis());
  - id: pause_all_music
    mode: restart
    then:
      - lambda: |-
          const auto &ms = latter_ui::media_state();
          bool local_active = (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          bool remote_active = (!id(active_speaker_entity).empty() && !ms.is_local && (ms.state == "playing"));
          if (local_active || remote_active) {
            id(va_resume_music_after) = true;
          }
          ESP_LOGD("audio", "pause_all_music: local=%d, remote=%d -> va_resume_music_after=%d", local_active, remote_active, id(va_resume_music_after));
      - if:
          condition:
            lambda: 'return id(va_resume_music_after);'
          then:
            - media_player.pause: latter_media_player
            - speaker.stop: media_mixing_input
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 50
                duration: 0.1s
            - lambda: |-
                latter_rpc::emit(&id(latter_rpc_outbox), "media_command", {
                  {"command", "pause"},
                });

  - id: resume_music_after_va
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(alarm_ringing) || id(timer_ringing) || id(find_my_active);'
          then:
            - script.stop: resume_music_after_va
      - if:
          condition:
            lambda: 'return id(va_resume_music_after);'
          then:
            - script.execute: mp_idle_debounce
            - lambda: |-
                id(va_resume_music_after) = false;
                ESP_LOGD("audio", "resume_music_after_va: restoring playback for %s (cancelled=%d)", id(active_speaker_entity).c_str(), id(va_was_cancelled));
            - if:
                condition:
                  lambda: 'return !id(active_speaker_entity).empty() && !latter_ui::media_state().is_local;'
                then:
                  - lambda: |-
                      id(va_was_cancelled) = false;
                      id(apply_power_policy).execute();
                      latter_rpc::emit(&id(latter_rpc_outbox), "media_command", {
                        {"command", "play"},
                      });
                      id(hal_set_dac_mute).execute(true);
                  - script.execute: mute_speaker_path
                  - script.execute: sync_wake_word_state
                else:
                  - script.execute: enable_speaker_path
                  - script.wait: enable_speaker_path
                  - if:
                      condition:
                        lambda: 'return !id(alarm_ringing) && !id(timer_ringing) && !id(find_my_active);'
                      then:
                        - mixer_speaker.apply_ducking:
                            id: media_mixing_input
                            decibel_reduction: 0
                            duration: 0.2s
                        - mixer_speaker.apply_ducking:
                            id: announcement_mixing_input
                            decibel_reduction: 50
                            duration: 0.1s
                        - lambda: |-
                            float v = id(latter_media_player).volume;
                            if (std::isnan(v) || v <= 0.0f) v = 0.60f;
                            id(physical_speaker).set_volume(latter_ui::media_dac_volume(v));
                  # Dispatch play via media_command so it never double-triggers with the media_play interceptor
                  - lambda: |-
                      latter_rpc::emit(&id(latter_rpc_outbox), "media_command", {
                        {"command", "play"},
                      });
                  # If VA was terminated early, keep speaker DAC muted for 700ms while Sendspin
                  # handshakes so any residual TTS audio still in the speaker and mixer buffers
                  # drains completely silently instead of playing a 0.4s burst before music starts
                  - if:
                      condition:
                        lambda: 'return id(va_was_cancelled);'
                      then:
                        - lambda: 'id(va_was_cancelled) = false;'
                        - delay: 700ms
                  - lambda: 'id(hal_set_dac_mute).execute(false);'
          else:
            - if:
                condition:
                  # Music kept playing under the reply (a Home Assistant announcement over music: nothing
                  # paused it): bring it back up instead of muting the speaker path.
                  lambda: |-
                    return id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING &&
                           !id(alarm_ringing) && !id(timer_ringing) && !id(find_my_active);
                then:
                  - lambda: |-
                      id(va_was_cancelled) = false;
                      id(apply_power_policy).execute();
                      float v = id(latter_media_player).volume;
                      if (std::isnan(v) || v <= 0.0f) v = 0.60f;
                      id(physical_speaker).set_volume(latter_ui::media_dac_volume(v));
                      id(hal_set_dac_mute).execute(false);
                  # Fade the music back in: a 0.2 s return after an announcement sounded abrupt.
                  - mixer_speaker.apply_ducking:
                      id: media_mixing_input
                      decibel_reduction: 0
                      duration: 1s
                  - mixer_speaker.apply_ducking:
                      id: announcement_mixing_input
                      decibel_reduction: 50
                      duration: 0.1s
                  - script.execute: sync_wake_word_state
                else:
                  - lambda: |-
                      id(va_was_cancelled) = false;
                      id(apply_power_policy).execute();
                  - if:
                      condition:
                        lambda: 'return !latter_ui::cam_call_active() && !latter_ui::cam_listen_active();'
                      then:
                        - script.execute: mute_speaker_path
                        - script.execute: sync_wake_word_state
  # A Home Assistant announcement outside a voice turn (assist_satellite.announce, TTS to the music player).
  # When music keeps playing, the player goes from announcing back to playing, never idle, so on_idle never
  # runs the drain and the music would stay ducked. Run it once the announcement has actually started.
  - id: finish_announcement
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: 'return id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;'
          timeout: 3s
      - if:
          condition:
            lambda: 'return !id(va_active) && !latter_ui::cam_call_active() && !latter_ui::cam_listen_active();'
          then:
            - script.execute: va_tts_drain_and_finish
  - id: fetch_remote_art_debounced
    mode: restart
    then:
      - delay: 650ms
      - if:
          condition:
            lambda: |-
              return !latter_ui::media_state().is_local &&
                     (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          then:
            - wait_until:
                condition:
                  lambda: 'return id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING;'
                timeout: 2500ms
            - delay: 250ms
      - if:
          condition:
            lambda: |-
              const auto &ms = latter_ui::media_state();
              return (id(gui_page) == 2) &&
                     (id(display_power_state) == 0) &&
                     !id(va_active) && id(va_status_text).empty() &&
                     (!ms.is_local || id(album_art).get_width() == 0) &&
                     !ms.art_url.empty() &&
                     (ms.art_url != id(current_loaded_art_url));
          then:
            - lambda: 'id(current_loaded_art_url) = latter_ui::media_state().art_url;'
            - online_image.set_url:
                id: remote_album_art
                url: !lambda 'return latter_ui::media_state().art_url;'

  - id: fetch_wallpaper_debounced
    mode: restart
    then:
      - delay: 500ms
      - if:
          condition:
            lambda: |-
              const auto &ac = latter_ui::area_ctx_state();
              return (id(display_power_state) == 0) &&
                     !id(va_active) && id(va_status_text).empty() &&
                     (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
                     !ac.wallpaper_url.empty() &&
                     (ac.wallpaper_url != id(current_loaded_wallpaper_url));
          then:
            - online_image.set_url:
                id: home_wallpaper_art
                url: !lambda 'return latter_ui::area_ctx_state().wallpaper_url;'

  - id: fetch_calendar_browse
    mode: restart
    then:
      - lambda: |-
          const std::string req_str = std::to_string(latter_rpc::issue_req_id(latter_rpc::SlotChannel::CALENDAR));
          const std::string page_str = std::to_string(id(cal_browse_page));
          latter_rpc::emit(&id(latter_rpc_outbox), "calendar_fetch", {
            {"req_id", req_str},
            {"days", "30"},
            {"page", page_str},
            {"page_size", "5"},
          });

  - id: create_calendar_quick_event
    mode: restart
    then:
      - lambda: |-
          const std::string in_min_str = std::to_string(id(cal_quick_in_minutes));
          const std::string dur_min_str = std::to_string(id(cal_quick_duration_minutes));
          latter_rpc::emit(&id(latter_rpc_outbox), "calendar_create_event", {
            {"summary", id(cal_quick_summary)},
            {"in_minutes", in_min_str},
            {"duration_minutes", dur_min_str},
          });
      - delay: 650ms
      - script.execute: fetch_calendar_browse

  - id: fetch_calendar_map_snapshot
    mode: restart
    then:
      - delay: 40ms
      - if:
          condition:
            lambda: 'return !latter_ui::cal_detail_location().empty() && !latter_ui::cal_detail_map_url().empty();'
          then:
            - lambda: |-
                const std::string &base_map_u = latter_ui::cal_detail_map_url();
                id(notif_camera_url) = base_map_u +
                                       "&z=" + to_string(latter_ui::cal_map_zoom()) +
                                       "&pan_x=" + to_string(latter_ui::cal_map_pan_x()) +
                                       "&pan_y=" + to_string(latter_ui::cal_map_pan_y());
                ESP_LOGD("cal_map", "Fetching Calendar Map Snapshot: %s", id(notif_camera_url).c_str());
            - online_image.set_url:
                id: camera_snapshot_art
                url: !lambda 'return id(notif_camera_url);'

  - id: send_intercom_broadcast
    mode: restart
    then:
      - lambda: |-
          latter_rpc::emit(&id(latter_rpc_outbox), "intercom_broadcast", {
            {"message", id(intercom_message_str)},
          });

  - id: fetch_on_demand_camera
    mode: restart
    then:
      - delay: 15ms
      - lambda: |-
          latter_ui::last_cam_live_fetch_ms() = millis();
          const auto &ac = latter_ui::area_ctx_state();
          id(notif_camera_url) = latter_ui::build_carousel_camera_url(
              ac.camera_snapshot_url, ac.cameras_summary, millis());
      - if:
          condition:
            # The page may have closed during the delay: a fetch started now would hold the image.
            lambda: 'return !id(notif_camera_url).empty() && id(gui_page) == 8 && id(tools_subpage) == 12;'
          then:
            - lambda: 'latter_ui::cam_download_in_progress() = true;'
            - online_image.set_url:
                id: camera_snapshot_art
                url: !lambda 'return id(notif_camera_url);'

  # A camera download that finishes after its view closed: release it (deferred out of the
  # online_image callback) so the snapshot and its composed canvas do not stay in PSRAM.
  - id: release_hidden_camera
    mode: restart
    then:
      - delay: 1ms
      - if:
          condition:
            lambda: |-
              return !id(notif_active) &&
                     !(id(gui_page) == 8 && (id(tools_subpage) == 9 || id(tools_subpage) == 12));
          then:
            - lambda: |-
                latter_ui::cam_download_in_progress() = false;
                id(current_loaded_camera_url) = "";
                latter_ui::release_art(id(camera_snapshot_art));

  - id: send_doorbell_intercom_cmd
    mode: restart
    then:
      - lambda: |-
          const auto &ac = latter_ui::area_ctx_state();
          const std::string cam_ent = latter_ui::resolve_active_carousel_camera_id(
              ac.cameras_summary, ac.camera_snapshot_url);
          const std::string cam_idx_str = std::to_string(latter_ui::cam_carousel_idx());
          latter_rpc::emit(&id(latter_rpc_outbox), "doorbell_intercom", {
            {"action", id(cam_intercom_action)},
            {"camera_entity", cam_ent},
            {"camera_index", cam_idx_str},
            {"message", id(cam_intercom_message)},
            {"noise_reduction", id(cam_intercom_noise_str)},
            {"code", id(cam_intercom_code_str)},
          });
          id(cam_intercom_code_str) = "";

  # A doorbell call listens to the door until the user taps Talk; each tap is one push-to-talk turn.
  - id: start_doorbell_call
    mode: restart
    then:
      - lambda: |-
          latter_ui::cam_call_active() = true;
          latter_ui::cam_listen_active() = true;
          latter_ui::cam_intercom_status() = "DOORBELL CALL";
          id(cam_intercom_status_ms) = millis();
          id(cam_intercom_action) = "listen_start";
          latter_ui::schedule_disp_update(&id(disp1));
      - script.execute: send_doorbell_intercom_cmd

  - id: stop_doorbell_call
    mode: restart
    then:
      - script.stop: start_doorbell_ptt
      - script.stop: va_echo_gate
      - lambda: |-
          latter_ui::cam_call_active() = false;
          latter_ui::cam_intercom_ptt_active() = false;
          latter_ui::cam_listen_active() = false;
          id(va_intercom_turn) = false;
          latter_ui::echo_meter_active().store(false, std::memory_order_relaxed);
          id(latter_mic).set_mute_state(false);
          latter_ui::cam_intercom_status() = "CALL ENDED";
          id(cam_intercom_status_ms) = millis();
          id(cam_intercom_action) = "listen_stop";
          esphome::voice_assistant::abort_voice_assistant(id(va));
          latter_ui::schedule_disp_update(&id(disp1));
      - script.execute: send_doorbell_intercom_cmd
      - script.execute: stop_doorbell_audio
      - script.execute: mp_idle_debounce

  # Stops the doorbell's live audio on this device. It plays on the announcement pipeline, which a plain
  # stop (and Home Assistant's media_stop) leaves running: it would keep playing and hold the player in
  # ANNOUNCING (music never plays again, the wake word stays paused).
  - id: stop_doorbell_audio
    mode: restart
    then:
      - media_player.stop: latter_media_player
      - media_player.stop:
          id: latter_media_player
          announcement: true

  # Ends a push-to-talk turn that sent nothing (no speech recognised, an error, or cancelled): the call
  # goes back to listening. A turn that sent a message resumes listening from Home Assistant once the
  # doorbell has spoken it.
  - id: resume_doorbell_listen
    mode: restart
    then:
      - lambda: |-
          latter_ui::cam_intercom_ptt_active() = false;
          latter_ui::radio_boost_until_ms() = 0;
          id(apply_power_policy).execute();
      - if:
          condition:
            lambda: 'return latter_ui::cam_call_active();'
          then:
            - lambda: |-
                latter_ui::cam_listen_active() = true;
                latter_ui::cam_intercom_status() = "DOORBELL CALL";
                id(cam_intercom_status_ms) = millis();
                id(cam_intercom_action) = "listen_start";
            - script.execute: send_doorbell_intercom_cmd
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'

  # One push-to-talk turn of a doorbell call (the Talk pill): the device's speech becomes text that the
  # doorbell speaks with TTS.
  - id: start_doorbell_ptt
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(va).get_api_connection() == nullptr;'
          then:
            - lambda: |-
                latter_ui::cam_intercom_status() = "NOT CONNECTED";
                id(cam_intercom_status_ms) = millis();
                latter_ui::schedule_disp_update(&id(disp1));
            - script.stop: start_doorbell_ptt
      # Silence the door audio here only: Home Assistant keeps the call in listening, so the message
      # this turn sends resumes listening there once the doorbell has spoken it.
      - script.stop: finish_announcement
      - script.stop: va_tts_drain_and_finish
      - script.stop: va_echo_gate
      - script.execute: stop_doorbell_audio
      - lambda: |-
          latter_ui::cam_intercom_ptt_active() = true;
          latter_ui::cam_intercom_status() = "CALL • SPEAK NOW";
          id(cam_intercom_status_ms) = millis();
          latter_ui::schedule_disp_update(&id(disp1));
          id(hal_set_audio_codecs_standby).execute(false);
          id(latter_mic).set_mute_state(false);
      - script.execute: mute_speaker_path
      - script.wait: mute_speaker_path
      - voice_assistant.start:

  - id: fetch_camera_snapshot
    mode: restart
    then:
      - delay: 80ms
      - if:
          condition:
            lambda: |-
              return id(notif_active) && !id(notif_camera_url).empty();
          then:
            - online_image.set_url:
                id: camera_snapshot_art
                url: !lambda 'return id(notif_camera_url);'

  - id: dismiss_notification
    mode: restart
    then:
      - script.stop: fetch_camera_snapshot
      - lambda: |-
          id(notif_active) = false;
          id(notif_camera_url) = "";
          id(current_loaded_camera_url) = "";
      - lambda: 'latter_ui::release_art(id(camera_snapshot_art));'
      - script.execute: mp_idle_debounce
      - script.execute: sync_wake_word_state
      - script.execute: screen_sleep_timer
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'

  - id: throttled_disp_update
    mode: restart
    then:
      - delay: 150ms
      - if:
          condition:
            lambda: 'return id(display_power_state) == 0 && (id(gui_page) == 1 || id(gui_page) == 2) && !id(va_active);'
          then:
            - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'

  - id: apply_theme_preset
    mode: restart
    then:
      - lambda: |-
          std::string p = std::string(id(theme_palette_select).current_option());
          id(theme_secondary) = Color(192, 192, 192);
          if (p == "Custom") {
            latter_ui::apply_custom_rgb_harmony(id(custom_theme_rgb), id(theme_primary), id(theme_secondary));
          } else if (p == "Pink") {
            id(theme_primary) = Color(168, 120, 132);
          } else if (p == "Green") {
            id(theme_primary) = Color(66, 116, 83);
          } else if (p == "Blue") {
            id(theme_primary) = Color(69, 110, 138);
          } else {
            id(theme_primary) = Color(107, 142, 158);
          }
          if (id(display_power_state) == 0) latter_ui::schedule_disp_update(&id(disp1));

  - id: save_custom_color_to_latter
    mode: restart
    then:
      - lambda: |-
          char buf[12];
          snprintf(buf, sizeof(buf), "#%06lX", static_cast<unsigned long>(id(custom_theme_rgb) & 0xFFFFFFUL));
          latter_rpc::emit(&id(latter_rpc_outbox), "save_custom_color", {
            {"hex_color", buf},
          });

  - id: sync_display_brightness
    mode: restart
    then:
      - lambda: |-
          auto parse_bri = [](const std::string& opt) -> float {
            if (opt == "60%") return 0.60f;
            if (opt == "70%") return 0.70f;
            if (opt == "80%") return 0.80f;
            if (opt == "90%") return 0.90f;
            if (opt == "100%") return 1.00f;
            return 0.90f;
          };

          float b_target = 0.90f;
          std::string mode = id(auto_brightness_mode).current_option();

          if (mode == "Sun Synchronized") {
            std::string sun = latter_ui::weather_state().sun_state;
            bool is_night = (sun == "below_horizon");
            std::string opt = is_night ? id(night_brightness_preset).current_option()
                                       : id(day_brightness_preset).current_option();
            b_target = parse_bri(opt);
          } else if (mode == "Time Schedule") {
            auto now = id(ha_time).now();
            int day_h = (int)id(day_start_hour).state;
            int night_h = (int)id(night_start_hour).state;
            bool is_day = true;
            if (now.is_valid()) {
              if (day_h < night_h) {
                is_day = (now.hour >= day_h && now.hour < night_h);
              } else {
                is_day = (now.hour >= day_h || now.hour < night_h);
              }
            }
            std::string opt = is_day ? id(day_brightness_preset).current_option()
                                     : id(night_brightness_preset).current_option();
            b_target = parse_bri(opt);
          } else {
            std::string opt = id(display_brightness_preset).current_option();
            b_target = parse_bri(opt);
          }

          if ((id(gui_page) == 8 && id(tools_subpage) == 5) || id(find_my_active)) {
            b_target = 1.00f;
          }

          if (id(display_power_state) == 0) {
            id(display_brightness).turn_on().set_brightness(b_target).perform();
          } else if (id(display_power_state) == 1) {
            id(display_brightness).turn_on().set_brightness(latter_ui::kScreensaverBrightness).perform();
          }

