  - id: music_seek_relative
    mode: restart
    parameters:
      dir: int
    then:
      - delay: 0ms
      - lambda: |-
          uint32_t now_ms = millis();
          if (now_ms - id(music_skip_last_tap_ms) < 1000) {
            id(music_skip_burst_count)++;
          } else {
            id(music_skip_burst_count) = 1;
          }
          id(music_skip_last_tap_ms) = now_ms;

          float step_sec = 10.0f;
          const char *label = "-10s Replay";
          if (dir < 0) {
            switch (id(music_skip_burst_count)) {
              case 1: step_sec = 10.0f; label = "-10s Replay"; break;
              case 2: step_sec = 30.0f; label = "-30s Replay"; break;
              case 3: step_sec = 60.0f; label = "-1m Replay"; break;
              case 4: step_sec = 120.0f; label = "-2m Replay"; break;
              default: step_sec = 300.0f; label = "-5m Replay"; break;
            }
          } else {
            switch (id(music_skip_burst_count)) {
              case 1: step_sec = 30.0f; label = "+30s Skip"; break;
              case 2: step_sec = 60.0f; label = "+1m Skip"; break;
              case 3: step_sec = 120.0f; label = "+2m Skip"; break;
              case 4: step_sec = 300.0f; label = "+5m Skip"; break;
              default: step_sec = 600.0f; label = "+10m Skip"; break;
            }
          }

          id(music_action_feedback) = label;
          id(music_feedback_timer) = now_ms;

          float cur_pos = id(music_pos_base);
          if (id(music_pos_sync_time) > 0) {
            cur_pos += (float)(now_ms - id(music_pos_sync_time)) / 1000.0f;
          }
          float new_pos = 0.0f;
          if (dir < 0) {
            new_pos = std::max(0.0f, cur_pos - step_sec);
          } else {
            float dur = id(ha_media_duration).state;
            new_pos = (!std::isnan(dur) && dur > 0.0f) ? std::min(dur, cur_pos + step_sec) : (cur_pos + step_sec);
          }
          id(music_pos_base) = new_pos;
          id(music_pos_sync_time) = now_ms;
      - homeassistant.action:
          action: latter.media_command
          data:
            target_device: "${name}"
            command: "seek"
            seek_position: !lambda |-
              float cur_pos = id(music_pos_base);
              return to_string((int)std::max(0.0f, cur_pos));

