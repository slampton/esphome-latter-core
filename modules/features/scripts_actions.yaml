# Latter Client Feature Package: Core Runtime Scripts & Action Handlers

script:
  # device_hello to Home Assistant (contract, boot id, hardware manifest with reset reason, crash and
  # rollback). Home Assistant subscribes to device actions only after it authenticates and subscribes to
  # states, so a hello sent straight from on_client_connected is dropped ("client has not subscribed to
  # actions (yet)") and ha-latter never sees it: wait for the state subscription, then a moment more.
  - id: send_device_hello
    mode: restart
    then:
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 30s
      - delay: 1500ms
      - homeassistant.action:
          action: latter.device_hello
          data:
            target_device: "${name}"
            contract: !lambda 'return std::to_string(latter_ui::kProtocolContractVersion);'
            boot_id: !lambda 'return std::to_string(latter_ui::device_boot_id());'
            manifest: !lambda 'return latter_ui::build_hardware_manifest_json();'

  - id: ui_input_event
    mode: queued
    parameters:
      action: string
      delta: int
    then:
      - lambda: |-
          uint32_t now_in = millis();
          if (id(display_power_state) != 0 || !id(display_brightness).current_values.is_on()) {
            latter_ui::note_wake_reason(latter_ui::WakeReason::TOUCH);
            id(wake_to_active_state).execute();
            return;
          }
          id(screen_sleep_timer).execute();
          latter_ui::activate_ui_focus(now_in);
          if (id(va_active) || !id(va_status_text).empty()) {
            id(cancel_voice_assistant).execute();
            return;
          }
          if (id(notif_active)) {
            id(dismiss_notification).execute();
            return;
          }
          if (id(alarm_ringing) || id(timer_ringing) || id(find_my_active)) {
            id(alarm_ringing) = false;
            id(timer_ringing) = false;
            id(find_my_active) = false;
            id(stop_alarm_sound).execute();
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          std::string act = action;
          for (char &c : act) c = static_cast<char>(::tolower(static_cast<unsigned char>(c)));
          int step = delta;
          if (step == 0) {
            if (act == "next" || act == "right" || act == "down" || act == "cw") step = 1;
            else if (act == "prev" || act == "left" || act == "up" || act == "ccw") step = -1;
          }
          if (act == "home") {
            if (id(gui_page) == 8 && id(tools_subpage) == 12) {
              if (latter_ui::cam_call_active() || latter_ui::cam_listen_active()) {
                id(stop_doorbell_call).execute();
              }
              latter_ui::release_art(id(camera_snapshot_art));
              id(current_loaded_camera_url) = "";
            }
            id(gui_page) = 1;
            id(home_subpage) = 0;
            id(active_game) = 0;
            id(tools_subpage) = 0;
            id(area_subpage) = 0;
            id(remote_subpage) = 0;
            id(music_overlay_mode) = 0;
            id(system_menu_mode) = 0;
            latter_ui::ui_focus_index() = 0;
            id(sync_wake_word_state).execute();
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          if (act == "back") {
            if (id(gui_page) == 8 && id(tools_subpage) > 0) {
              if (id(tools_subpage) == 12) {
                if (latter_ui::cam_call_active() || latter_ui::cam_listen_active()) {
                  id(stop_doorbell_call).execute();
                }
                latter_ui::release_art(id(camera_snapshot_art));
                id(current_loaded_camera_url) = "";
              }
              if (latter_ui::tools_direct_home()) {
                latter_ui::tools_direct_home() = false;
                id(tools_subpage) = 0;
                id(gui_page) = 1;
              } else {
                id(tools_subpage) = 0;
              }
            } else if (id(gui_page) == 3 && id(active_game) > 0) {
              id(active_game) = 0;
            } else if (id(gui_page) == 2 && id(music_overlay_mode) > 0) {
              id(music_overlay_mode) = 0;
            } else if (id(gui_page) == 4 && id(system_menu_mode) > 0) {
              id(system_menu_mode) = 0;
            } else if (id(gui_page) == 6 && id(area_subpage) > 0) {
              id(area_subpage) = 0;
            } else if (id(gui_page) == 7 && id(remote_subpage) > 0) {
              id(remote_subpage) = 0;
            } else {
              id(gui_page) = 1;
              id(home_subpage) = 0;
            }
            latter_ui::ui_focus_index() = 0;
            id(sync_wake_word_state).execute();
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          if (step != 0) {
            int &f_idx = latter_ui::ui_focus_index();
            f_idx = std::max(0, f_idx + step);
            if (id(gui_page) == 5) {
              id(sky_weather_subpage) = f_idx % 4;
            } else if (id(gui_page) == 9) {
              latter_ui::whole_home_tab() = f_idx % 5;
            } else if (id(gui_page) == 8 && id(tools_subpage) == 12) {
              std::string cam_ids[latter_ui::MAX_CAMERA_SLOTS], cam_names[latter_ui::MAX_CAMERA_SLOTS];
              int c_cnt = std::max(1, latter_ui::parse_cameras_summary_list(latter_ui::area_ctx_state().cameras_summary, cam_ids, cam_names));
              latter_ui::cam_carousel_idx() = (latter_ui::cam_carousel_idx() + step + c_cnt) % c_cnt;
              id(fetch_on_demand_camera).execute();
            }
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          if (act == "select" || act == "ok" || act == "click") {
            const int f_idx = std::max(0, latter_ui::ui_focus_index());
            if (id(gui_page) == 1) {
              int dock_apps[8] = {0, 0, 0, 0, 0, 0, 0, 0};
              int dock_count = latter_ui::collect_home_dock_apps(dock_apps);
              if (dock_count > 0) {
                int start_idx = latter_ui::get_home_dock_start_index(dock_count, latter_ui::home_dock_page());
                int vis_count = std::min(4, dock_count - start_idx);
                int chosen_app = dock_apps[start_idx + (f_idx % std::max(1, vis_count))];
                if (chosen_app == 12) {
                  id(gui_page) = 8;
                  id(tools_subpage) = 12;
                  latter_ui::tools_direct_home() = true;
                  id(fetch_on_demand_camera).execute();
                } else {
                  id(gui_page) = chosen_app;
                }
              }
              latter_ui::ui_focus_index() = 0;
              if (id(gui_page) == 6) id(fetch_area_browse).execute();
            } else if (id(gui_page) == 2) {
              if (id(music_overlay_mode) == 0) {
                const int m_act = f_idx % 5;
                if (m_act == 0) id(music_prev_track).execute();
                else if (m_act == 1) id(toggle_ha_music).execute();
                else if (m_act == 2) id(music_next_track).execute();
                else if (m_act == 3) { id(music_overlay_mode) = 2; id(selected_category_mode) = "favorites"; id(fetch_music_browse).execute(); }
                else { id(music_overlay_mode) = 3; id(selected_category_mode) = "speakers"; id(fetch_music_browse).execute(); }
              } else {
                id(play_music_slot).execute((f_idx % 5) + 1);
              }
            } else if (id(gui_page) == 3 && id(active_game) == 0) {
              id(active_game) = (f_idx % 6) + 1;
            } else if (id(gui_page) == 6 && id(area_subpage) == 0) {
              const int slot = f_idx % 7;
              auto resolve_slot_action = [](const std::string &s_type, bool &s_act) -> const char * {
                s_act = !s_act;
                if (s_type == "lock") return s_act ? "lock" : "unlock";
                if (s_type == "alarm_control_panel") return s_act ? "arm_home" : "disarm";
                return "toggle";
              };
              if (slot == 0 && !id(area_slot_1_id).empty()) { id(area_target_entity_id) = id(area_slot_1_id); id(area_target_action) = resolve_slot_action(id(area_slot_1_type), id(area_slot_1_active)); id(execute_area_action).execute(); }
              else if (slot == 1 && !id(area_slot_2_id).empty()) { id(area_target_entity_id) = id(area_slot_2_id); id(area_target_action) = resolve_slot_action(id(area_slot_2_type), id(area_slot_2_active)); id(execute_area_action).execute(); }
              else if (slot == 2 && !id(area_slot_3_id).empty()) { id(area_target_entity_id) = id(area_slot_3_id); id(area_target_action) = resolve_slot_action(id(area_slot_3_type), id(area_slot_3_active)); id(execute_area_action).execute(); }
            } else if (id(gui_page) == 7) {
              const int key_map[8] = {9, 0, 2, 4, 3, 1, 5, 6};
              id(remote_send_key).execute(key_map[f_idx % 8], id(active_remote_slot));
            } else if (id(gui_page) == 8 && id(tools_subpage) == 0) {
              #if LATTER_HAS_IMU
              static constexpr int kToolsP0[6] = {1, 2, 3, 7, 5, 6};
              static constexpr int kToolsP1[5] = {4, 8, 9, 10, 12};
              id(tools_subpage) = (id(tools_menu_page) == 0) ? kToolsP0[f_idx % 6] : kToolsP1[f_idx % 5];
              #else
              static constexpr int kToolsP0[6] = {1, 2, 3, 5, 6, 9};
              static constexpr int kToolsP1[4] = {10, 12, 4, 8};
              id(tools_subpage) = (id(tools_menu_page) == 0) ? kToolsP0[f_idx % 6] : kToolsP1[f_idx % 4];
              #endif
              if (id(tools_subpage) == 12) id(fetch_on_demand_camera).execute();
            }
            id(sync_wake_word_state).execute();
            latter_ui::schedule_disp_update(&id(disp1));
          }
  - id: pause_all_music
    mode: restart
    then:
      - lambda: |-
          const auto &ms = latter_ui::media_state();
          bool local_active = (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          bool remote_active = (!id(active_speaker_entity).empty() && !ms.is_local && (ms.state == "playing"));
          if (local_active || remote_active) {
            id(va_resume_music_after) = true;
          }
          ESP_LOGD("audio", "pause_all_music: local=%d, remote=%d -> va_resume_music_after=%d", local_active, remote_active, id(va_resume_music_after));
      - if:
          condition:
            lambda: 'return id(va_resume_music_after);'
          then:
            - media_player.pause: latter_media_player
            - speaker.stop: media_mixing_input
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 50
                duration: 0.1s
            - homeassistant.action:
                action: latter.media_command
                data:
                  target_device: "${name}"
                  command: "pause"

  - id: resume_music_after_va
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(alarm_ringing) || id(timer_ringing) || id(find_my_active);'
          then:
            - script.stop: resume_music_after_va
      - if:
          condition:
            lambda: 'return id(va_resume_music_after);'
          then:
            - script.execute: mp_idle_debounce
            - lambda: |-
                id(va_resume_music_after) = false;
                ESP_LOGD("audio", "resume_music_after_va: restoring playback for %s (cancelled=%d)", id(active_speaker_entity).c_str(), id(va_was_cancelled));
            - if:
                condition:
                  lambda: 'return !id(active_speaker_entity).empty() && !latter_ui::media_state().is_local;'
                then:
                  - lambda: |-
                      id(va_was_cancelled) = false;
                      id(apply_power_policy).execute();
                  - homeassistant.action:
                      action: latter.media_command
                      data:
                        target_device: "${name}"
                        command: "play"
                  - lambda: 'id(hal_set_dac_mute).execute(true);'
                  - script.execute: route_i2s_to_mic
                  - script.execute: sync_wake_word_state
                else:
                  - script.execute: route_i2s_to_spk
                  - script.wait: route_i2s_to_spk
                  - if:
                      condition:
                        lambda: 'return !id(alarm_ringing) && !id(timer_ringing) && !id(find_my_active);'
                      then:
                        - mixer_speaker.apply_ducking:
                            id: media_mixing_input
                            decibel_reduction: 0
                            duration: 0.2s
                        - mixer_speaker.apply_ducking:
                            id: announcement_mixing_input
                            decibel_reduction: 50
                            duration: 0.1s
                        - lambda: |-
                            float v = id(latter_media_player).volume;
                            if (std::isnan(v) || v <= 0.0f) v = 0.60f;
                            id(physical_speaker).set_volume(latter_ui::media_dac_volume(v));
                  # Dispatch play via latter.media_command so it never double-triggers with the media_play interceptor
                  - homeassistant.action:
                      action: latter.media_command
                      data:
                        target_device: "${name}"
                        command: "play"
                  # If VA was terminated early, keep speaker DAC muted for 700ms while Sendspin
                  # handshakes so any residual TTS audio still in the speaker and mixer buffers
                  # drains completely silently instead of playing a 0.4s burst before music starts
                  - if:
                      condition:
                        lambda: 'return id(va_was_cancelled);'
                      then:
                        - lambda: 'id(va_was_cancelled) = false;'
                        - delay: 700ms
                  - lambda: 'id(hal_set_dac_mute).execute(false);'
          else:
            - if:
                condition:
                  # Music kept playing under the reply (a Home Assistant announcement over music: nothing
                  # paused it): bring it back up instead of muting the speaker path.
                  lambda: |-
                    return id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING &&
                           !id(alarm_ringing) && !id(timer_ringing) && !id(find_my_active);
                then:
                  - lambda: |-
                      id(va_was_cancelled) = false;
                      id(apply_power_policy).execute();
                      float v = id(latter_media_player).volume;
                      if (std::isnan(v) || v <= 0.0f) v = 0.60f;
                      id(physical_speaker).set_volume(latter_ui::media_dac_volume(v));
                      id(hal_set_dac_mute).execute(false);
                  # Fade the music back in: a 0.2 s return after an announcement sounded abrupt.
                  - mixer_speaker.apply_ducking:
                      id: media_mixing_input
                      decibel_reduction: 0
                      duration: 1s
                  - mixer_speaker.apply_ducking:
                      id: announcement_mixing_input
                      decibel_reduction: 50
                      duration: 0.1s
                  - script.execute: sync_wake_word_state
                else:
                  - lambda: |-
                      id(va_was_cancelled) = false;
                      id(apply_power_policy).execute();
                  - if:
                      condition:
                        lambda: 'return !latter_ui::cam_call_active() && !latter_ui::cam_listen_active();'
                      then:
                        - lambda: 'id(hal_set_dac_mute).execute(true);'
                        - script.execute: route_i2s_to_mic
                        - script.execute: sync_wake_word_state
  # A Home Assistant announcement outside a voice turn (assist_satellite.announce, TTS to the music player).
  # When music keeps playing, the player goes from announcing back to playing, never idle, so on_idle never
  # runs the drain and the music would stay ducked. Run it once the announcement has actually started.
  - id: finish_announcement
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: 'return id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;'
          timeout: 3s
      - if:
          condition:
            lambda: 'return !id(va_active) && !latter_ui::cam_call_active() && !latter_ui::cam_listen_active();'
          then:
            - script.execute: va_tts_drain_and_finish
  - id: fetch_remote_art_debounced
    mode: restart
    then:
      - delay: 650ms
      - if:
          condition:
            lambda: |-
              return !latter_ui::media_state().is_local &&
                     (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          then:
            - wait_until:
                condition:
                  lambda: 'return id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING;'
                timeout: 2500ms
            - delay: 250ms
      - if:
          condition:
            lambda: |-
              const auto &ms = latter_ui::media_state();
              return (id(gui_page) == 2) &&
                     (id(display_power_state) == 0) &&
                     !id(va_active) && id(va_status_text).empty() &&
                     (!ms.is_local || id(album_art).get_width() == 0) &&
                     !ms.art_url.empty() &&
                     (ms.art_url != id(current_loaded_art_url));
          then:
            - lambda: 'id(current_loaded_art_url) = latter_ui::media_state().art_url;'
            - online_image.set_url:
                id: remote_album_art
                url: !lambda 'return latter_ui::media_state().art_url;'

  - id: fetch_wallpaper_debounced
    mode: restart
    then:
      - delay: 500ms
      - if:
          condition:
            lambda: |-
              const auto &ac = latter_ui::area_ctx_state();
              return (id(display_power_state) == 0) &&
                     !id(va_active) && id(va_status_text).empty() &&
                     (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
                     !ac.wallpaper_url.empty() &&
                     (ac.wallpaper_url != id(current_loaded_wallpaper_url));
          then:
            - online_image.set_url:
                id: home_wallpaper_art
                url: !lambda 'return latter_ui::area_ctx_state().wallpaper_url;'

  - id: fetch_calendar_browse
    mode: restart
    then:
      - homeassistant.action:
          action: latter.calendar_fetch
          data:
            target_device: "${name}"
            days: "30"
            page: !lambda 'return to_string(id(cal_browse_page));'
            page_size: "5"

  - id: create_calendar_quick_event
    mode: restart
    then:
      - homeassistant.action:
          action: latter.calendar_create_event
          data:
            target_device: "${name}"
            summary: !lambda 'return id(cal_quick_summary).c_str();'
            in_minutes: !lambda 'return to_string(id(cal_quick_in_minutes));'
            duration_minutes: !lambda 'return to_string(id(cal_quick_duration_minutes));'
      - delay: 650ms
      - script.execute: fetch_calendar_browse

  - id: fetch_calendar_map_snapshot
    mode: restart
    then:
      - delay: 40ms
      - if:
          condition:
            lambda: 'return !latter_ui::cal_detail_location().empty() && !latter_ui::cal_detail_map_url().empty();'
          then:
            - lambda: |-
                const std::string &base_map_u = latter_ui::cal_detail_map_url();
                id(notif_camera_url) = base_map_u +
                                       "&z=" + to_string(latter_ui::cal_map_zoom()) +
                                       "&pan_x=" + to_string(latter_ui::cal_map_pan_x()) +
                                       "&pan_y=" + to_string(latter_ui::cal_map_pan_y());
                ESP_LOGD("cal_map", "Fetching Calendar Map Snapshot: %s", id(notif_camera_url).c_str());
            - online_image.set_url:
                id: camera_snapshot_art
                url: !lambda 'return id(notif_camera_url);'

  - id: send_intercom_broadcast
    mode: restart
    then:
      - homeassistant.action:
          action: latter.intercom_broadcast
          data:
            target_device: "${name}"
            message: !lambda 'return id(intercom_message_str).c_str();'

  - id: fetch_on_demand_camera
    mode: restart
    then:
      - delay: 15ms
      - lambda: |-
          latter_ui::last_cam_live_fetch_ms() = millis();
          const auto &ac = latter_ui::area_ctx_state();
          id(notif_camera_url) = latter_ui::build_carousel_camera_url(
              ac.camera_snapshot_url, ac.cameras_summary, millis());
      - if:
          condition:
            # The page may have closed during the delay: a fetch started now would hold the image.
            lambda: 'return !id(notif_camera_url).empty() && id(gui_page) == 8 && id(tools_subpage) == 12;'
          then:
            - lambda: 'latter_ui::cam_download_in_progress() = true;'
            - online_image.set_url:
                id: camera_snapshot_art
                url: !lambda 'return id(notif_camera_url);'

  # A camera download that finishes after its view closed: release it (deferred out of the
  # online_image callback) so the snapshot and its composed canvas do not stay in PSRAM.
  - id: release_hidden_camera
    mode: restart
    then:
      - delay: 1ms
      - if:
          condition:
            lambda: |-
              return !id(notif_active) &&
                     !(id(gui_page) == 8 && (id(tools_subpage) == 9 || id(tools_subpage) == 12));
          then:
            - lambda: |-
                latter_ui::cam_download_in_progress() = false;
                id(current_loaded_camera_url) = "";
                latter_ui::release_art(id(camera_snapshot_art));

  - id: send_doorbell_intercom_cmd
    mode: restart
    then:
      - homeassistant.action:
          action: latter.doorbell_intercom
          data:
            target_device: "${name}"
            action: !lambda 'return id(cam_intercom_action).c_str();'
            camera_entity: !lambda |-
              // Return the std::string itself: .c_str() of this temporary dangles once the lambda returns
              // (the action copies the value afterwards), which sent garbage that Home Assistant rejected
              // as invalid UTF-8 and answered by dropping the API connection.
              const auto &ac = latter_ui::area_ctx_state();
              return latter_ui::resolve_active_carousel_camera_id(
                  ac.cameras_summary,
                  ac.camera_snapshot_url);
            camera_index: !lambda 'return to_string(latter_ui::cam_carousel_idx());'
            message: !lambda 'return id(cam_intercom_message).c_str();'
            noise_reduction: !lambda 'return id(cam_intercom_noise_str).c_str();'

  # A doorbell call listens to the door until the user taps Talk; each tap is one push-to-talk turn.
  - id: start_doorbell_call
    mode: restart
    then:
      - lambda: |-
          latter_ui::cam_call_active() = true;
          latter_ui::cam_listen_active() = true;
          latter_ui::cam_intercom_status() = "DOORBELL CALL";
          id(cam_intercom_status_ms) = millis();
          id(cam_intercom_action) = "listen_start";
          latter_ui::schedule_disp_update(&id(disp1));
      - script.execute: send_doorbell_intercom_cmd

  - id: stop_doorbell_call
    mode: restart
    then:
      - script.stop: start_doorbell_ptt
      - script.stop: va_echo_gate
      - lambda: |-
          latter_ui::cam_call_active() = false;
          latter_ui::cam_intercom_ptt_active() = false;
          latter_ui::cam_listen_active() = false;
          id(va_intercom_turn) = false;
          id(latter_mic).set_mute_state(false);
          latter_ui::cam_intercom_status() = "CALL ENDED";
          id(cam_intercom_status_ms) = millis();
          id(cam_intercom_action) = "listen_stop";
          esphome::voice_assistant::abort_voice_assistant(id(va));
          latter_ui::schedule_disp_update(&id(disp1));
      - script.execute: send_doorbell_intercom_cmd
      - script.execute: stop_doorbell_audio
      - script.execute: mp_idle_debounce

  # Stops the doorbell's live audio on this device. It plays on the announcement pipeline, which a plain
  # stop (and Home Assistant's media_stop) leaves running: it would keep playing and hold the player in
  # ANNOUNCING (music never plays again, the wake word stays paused).
  - id: stop_doorbell_audio
    mode: restart
    then:
      - media_player.stop: latter_media_player
      - media_player.stop:
          id: latter_media_player
          announcement: true

  # Ends a push-to-talk turn that sent nothing (no speech recognised, an error, or cancelled): the call
  # goes back to listening. A turn that sent a message resumes listening from Home Assistant once the
  # doorbell has spoken it.
  - id: resume_doorbell_listen
    mode: restart
    then:
      - lambda: |-
          latter_ui::cam_intercom_ptt_active() = false;
