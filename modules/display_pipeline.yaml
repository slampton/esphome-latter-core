# ==============================================================================
# Latter Core Module: Display Image & Backlight Pipeline (modules/display_pipeline.yaml)
# Provides RGB565 Sendspin/Online-Image transcoders (artwork, wallpaper, camera)
# and perceptual-gamma backlight brightness control for display-equipped boards.
# ==============================================================================

substitutions:
  initial_art_url: "http://homeassistant.local:8123/static/icons/favicon-192x192.png"

http_request:
  id: http_client
  verify_ssl: true
  timeout: 4s

image:
  - platform: sendspin
    id: album_slot
    format: JPEG
    type: RGB565
    resize: ${sendspin_art_resize}
    source: album
    current_image:
      id: album_art
    on_image_display:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          if (latter_ui::media_state().is_local && id(remote_album_art).get_width() > 0) {
            latter_ui::release_art(id(remote_album_art));
            rs.music.loaded_art_url = "";
          }
          if (rs.nav.gui_page == 2) {
            id(throttled_disp_update).execute();
          }

  - platform: online_image
    id: remote_album_art
    format: JPEG
    buffer_size: 16384
    type: RGB565
    resize: ${art_resize}
    url: "${initial_art_url}"
    on_download_finished:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          const auto &ms = latter_ui::media_state();
          if (!ms.art_url.empty() && ms.art_url != rs.music.loaded_art_url) {
            id(fetch_remote_art_debounced).execute();
          }
          if (rs.nav.gui_page == 2) {
            id(throttled_disp_update).execute();
          }
      - script.execute: sync_wake_word_state
    on_error:
      - lambda: 'latter_ui::runtime_state().music.loaded_art_url = "";'
      - script.execute: sync_wake_word_state

  - platform: online_image
    id: home_wallpaper_art
    format: JPEG
    buffer_size: 16384
    type: RGB565
    resize: ${art_resize}
    url: "${initial_art_url}"
    on_download_finished:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          rs.music.loaded_wallpaper_url = latter_ui::area_ctx_state().wallpaper_url;
          if (rs.nav.display_power_state == 0 && !rs.nav.is_hibernating) {
            latter_ui::mark_dirty_full();
            latter_ui::schedule_disp_update(&id(disp1));
          }
      - script.execute: sync_wake_word_state
    on_error:
      - lambda: 'latter_ui::runtime_state().music.loaded_wallpaper_url = "";'
      - script.execute: sync_wake_word_state

  - platform: online_image
    id: camera_snapshot_art
    format: JPEG
    buffer_size: 16384
    type: RGB565
    resize: ${art_resize}
    url: "${initial_art_url}"
    on_download_finished:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          latter_ui::cam_download_in_progress() = false;
          latter_ui::cam_error_backoff_until_ms() = 0;
          latter_ui::last_cam_live_fetch_ms() = millis();
          rs.alert.loaded_camera_url = rs.alert.camera_url;
          if (rs.nav.display_power_state == 0 &&
              (rs.alert.active || latter_ui::is_camera_view_active(rs) || latter_ui::is_calendar_map_view_active(rs))) {
            latter_ui::schedule_disp_update(&id(disp1));
          }
      - script.execute: release_hidden_camera
      - script.execute: sync_wake_word_state
    on_error:
      - lambda: |-
          const uint32_t now_err_ms = millis();
          latter_ui::cam_download_in_progress() = false;
          latter_ui::last_cam_live_fetch_ms() = now_err_ms;
          latter_ui::cam_error_backoff_until_ms() = now_err_ms + 3000U;
          latter_ui::runtime_state().alert.loaded_camera_url = "";
      - script.execute: sync_wake_word_state

output:
  - platform: template
    id: backlight_brightness
    type: float
    write_action:
      - lambda: |-
          latter_ui::hal_set_display_brightness_f(&id(disp1), state);

light:
  - platform: monochromatic
    id: display_brightness
    name: "Display: Screen Backlight"
    entity_category: diagnostic
    output: backlight_brightness
    gamma_correct: 1.0
    default_transition_length: 0s
    initial_state:
      brightness: 90%
    restore_mode: ALWAYS_ON
