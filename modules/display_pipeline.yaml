# ==============================================================================
# Latter Core Module: Display Image & Backlight Pipeline (modules/display_pipeline.yaml)
# Provides RGB565 Online-Image transcoders (artwork, wallpaper, camera)
# and perceptual-gamma backlight brightness control for display-equipped boards.
# (Sendspin local album_art image lives in modules/audio_pipeline.yaml so
# audio-less display-only builds never require sendspin:.)
# ==============================================================================

substitutions:
  initial_art_url: "http://homeassistant.local:8123/static/icons/favicon-192x192.png"

http_request:
  id: http_client
  verify_ssl: true
  timeout: 4s

image:
  - platform: online_image
    id: remote_album_art
    format: JPEG
    buffer_size: 16384
    type: RGB565
    resize: ${art_resize}
    url: "${initial_art_url}"
    on_download_finished:
      - lambda: |-
          auto &rs = latter_core::runtime_state();
          const auto &ms = latter_core::media_state();
          if (!ms.art_url.empty() && ms.art_url != rs.music.loaded_art_url) {
            id(fetch_remote_art_debounced).execute();
          }
          if (rs.nav.gui_page == 2) {
            id(throttled_disp_update).execute();
          }
          rs.audio.sync_wake_word();
    on_error:
      - lambda: |-
          auto &rs = latter_core::runtime_state();
          rs.music.loaded_art_url = "";
          rs.audio.sync_wake_word();

  - platform: online_image
    id: home_wallpaper_art
    format: JPEG
    buffer_size: 16384
    type: RGB565
    resize: ${art_resize}
    url: "${initial_art_url}"
    on_download_finished:
      - lambda: |-
          auto &rs = latter_core::runtime_state();
          rs.music.loaded_wallpaper_url = latter_core::area_ctx_state().wallpaper_url;
          if (rs.nav.display_power_state == 0 && !rs.nav.is_hibernating) {
            latter_ui::mark_dirty_full();
            latter_ui::schedule_disp_update(&id(disp1));
          }
          rs.audio.sync_wake_word();
    on_error:
      - lambda: |-
          auto &rs = latter_core::runtime_state();
          rs.music.loaded_wallpaper_url = "";
          rs.audio.sync_wake_word();

  - platform: online_image
    id: screensaver_photo_art
    format: JPEG
    buffer_size: 16384
    type: RGB565
    resize: ${art_resize}
    url: "${initial_art_url}"
    on_download_finished:
      - lambda: |-
          auto &rs = latter_core::runtime_state();
          rs.music.loaded_screensaver_photo_url = latter_core::area_ctx_state().screensaver_photo_url;
          rs.music.screensaver_photo_failed = false;
          if (rs.nav.display_power_state == 1 && !rs.nav.is_hibernating) {
            id(sync_display_brightness).execute();
            latter_ui::mark_dirty_full();
            latter_ui::schedule_disp_update(&id(disp1));
          }
      - script.execute: release_hidden_screensaver_photo
      - lambda: 'latter_core::runtime_state().audio.sync_wake_word();'
    on_error:
      - lambda: |-
          auto &rs = latter_core::runtime_state();
          rs.music.loaded_screensaver_photo_url = "";
          rs.music.screensaver_photo_failed = true;
          if (rs.nav.display_power_state == 1 && !rs.nav.is_hibernating) {
            id(sync_display_brightness).execute();
            latter_ui::mark_dirty_full();
            latter_ui::schedule_disp_update(&id(disp1));
          }
          rs.audio.sync_wake_word();

  - platform: online_image
    id: camera_snapshot_art
    format: JPEG
    buffer_size: 16384
    type: RGB565
    resize: ${art_resize}
    url: "${initial_art_url}"
    on_download_finished:
      - lambda: |-
          auto &rs = latter_core::runtime_state();
          latter_core::cam_download_in_progress() = false;
          latter_core::cam_error_backoff_until_ms() = 0;
          latter_core::last_cam_live_fetch_ms() = millis();
          rs.alert.loaded_camera_url = rs.alert.camera_url;
          if (rs.nav.display_power_state == 0 &&
              (rs.alert.active || latter_core::is_camera_view_active(rs))) {
            latter_ui::schedule_disp_update(&id(disp1));
          }
      - script.execute: release_hidden_camera
      - lambda: 'latter_core::runtime_state().audio.sync_wake_word();'
    on_error:
      - lambda: |-
          const uint32_t now_err_ms = millis();
          latter_core::cam_download_in_progress() = false;
          latter_core::last_cam_live_fetch_ms() = now_err_ms;
          latter_core::cam_error_backoff_until_ms() = now_err_ms + 3000U;
          auto &rs = latter_core::runtime_state();
          rs.alert.loaded_camera_url = "";
          rs.audio.sync_wake_word();

output:
  - platform: template
    id: backlight_brightness
    type: float
    write_action:
      - lambda: |-
          latter_core::hal_set_display_brightness_f(&id(disp1), state);

light:
  - platform: monochromatic
    id: display_brightness
    name: "Display: Screen Backlight"
    internal: true
    output: backlight_brightness
    gamma_correct: 1.0
    default_transition_length: 0s
    initial_state:
      brightness: 90%
    restore_mode: ALWAYS_ON
