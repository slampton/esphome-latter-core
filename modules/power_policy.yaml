# ==============================================================================
# Latter Core Module: Universal Power Supervisor, Radio/IMU Gate & Light-Sleep Policy
# (modules/power_policy.yaml)
# Single owner for apply_power_policy, 1s supervisor tick, and screensaver cadence.
# ==============================================================================

interval:
  - interval: 1s
    then:
      - lambda: |-
          auto &rs = latter_core::runtime_state();
          // 0. Alarm engine (timers_and_fetchers.yaml) shares this tick: one wake a second for both.
          id(alarm_engine_tick).execute();
          latter_core::tick_persisted_prefs_flush(millis());
          latter_core::check_and_emit_timer_alarm_state(millis());

          // 1. Poll Board PMU Telemetry (AXP2101 VBUS & Battery Charging when present)
          if (rs.hw_poll_pmu_1s != nullptr) {
            rs.hw_poll_pmu_1s();
          }
          latter_core::watch_internal_low_water(
              id(ble_ctrl).is_active(), rs.audio.mww_running(), rs.audio.va_running(),
              rs.audio.local_mp_not_idle(), rs.nav.gui_page);

          // 2-3. Audio / Wake-Word / Voice Assistant 1s supervisor (bound by audio_scripts.yaml; no-op when audio-less)
          const uint32_t now_1s_ms = millis();
          rs.audio.tick_1s(now_1s_ms, id(wifi_ctrl).is_connected());

          // 4. Touch recovery (owned by LatterTouchscreen; no-op when touch-less), Flight Recorder & Telemetry
          if (!rs.nav.is_hibernating && !rs.nav.ota_in_progress) {
            latter_core::hal_touch_recover_if_failed(now_1s_ms);
          }
          if (latter_core::profiler_enabled() && latter_core::profiler_is_expired(now_1s_ms)) {
            LATTER_PROF_LOGI("[PROF:STOP] Telemetry Profiler auto-disabled after 24h");
            latter_core::profiler_stop();
            id(ble_ctrl).set_profile_logging(false);
            id(publish_device_telemetry).execute();
          }
          static uint32_t last_prof_10s_ms = 0;
          static int last_prof_pwr_state = -1;
          if (latter_core::profiler_enabled() &&
              (rs.nav.display_power_state != last_prof_pwr_state || (now_1s_ms - last_prof_10s_ms >= 10000U))) {
            const char *trig = (rs.nav.display_power_state != last_prof_pwr_state) ? "STATE_CHG" : "10S_TICK";
            last_prof_pwr_state = rs.nav.display_power_state;
            last_prof_10s_ms = now_1s_ms;
            latter_core::log_power_and_mem_profile(
                trig, rs.nav.display_power_state, rs.hw_usb_connected, rs.hw_batt_charging,
                rs.hw_batt_level, rs.hw_batt_voltage, rs.audio.speaker_enabled(),
                rs.audio.mww_running(), rs.voice.active,
                rs.audio.local_mp_playing(),
                id(ble_ctrl).is_active(), rs.nav.active_game, rs.nav.sleep_start_time);
          }

          // 6-7. Single power-policy owner: radio (BLE beacon / Wi-Fi modem sleep), IMU mode,
          // screen-off tick gating, battery polling and the light-sleep awake lock all live in script
          // apply_power_policy.
          id(apply_power_policy).execute();

          // 8. Safe Docked-Idle Background Firmware Update Check (after 3 min uptime, every 6h while on USB & idle)
          static uint32_t last_fw_check_ms = 0;
          if (now_1s_ms > 180000U && rs.hw_usb_connected && id(wifi_ctrl).is_connected() &&
              (rs.nav.display_power_state != 0) &&
              !rs.voice.active && !rs.voice.tts_received && !rs.nav.ota_in_progress &&
              !rs.audio.local_mp_playing() &&
              (last_fw_check_ms == 0 || (now_1s_ms - last_fw_check_ms >= 21600000U))) {
            last_fw_check_ms = now_1s_ms;
            id(check_firmware_update).execute();
          }

          // 9. Self-heal any settled pending DCS transition.
          latter_core::hal_panel_dcs_poll(&id(disp1));

          // 10. Bedtime schedule edge evaluation, auto-exit forgotten Games (>3m untouched),
          // Battery Flashlight/Level/Camera (>5m untouched), and Return-to-Home idle navigation reset.
          auto now_bt = id(ha_time).now();
          if (!now_bt.is_valid()) {
            now_bt = id(sntp_time).now();
          }
          if (now_bt.is_valid()) {
            const int bt_edge = latter_core::bedtime_schedule_tracker().evaluate_hour(
                latter_core::persisted_prefs().bedtime_schedule,
                latter_core::persisted_prefs().bedtime_start_hour,
                latter_core::persisted_prefs().bedtime_end_hour,
                now_bt.hour);
            if (bt_edge >= 0 && (bt_edge == 1) != latter_core::persisted_prefs().bedtime_active) {
              uint32_t bt_eff = 0U;
              if (latter_core::record_local_pref_edit(
                      latter_core::PrefKey::BEDTIME_ACTIVE, (bt_edge == 1) ? "1" : "0",
                      now_1s_ms, bt_eff)) {
                latter_core::device_prefs_state().last_effects |= bt_eff;
                id(apply_device_prefs_effects).execute();
              }
            }
          }
          // 11. 1 s Power & DisplayLifecycle supervisor: forgotten games/tools/cameras,
          // Return-to-Home idle check, DisplayLifecycleController, and battery hibernate descent.
          latter_core::PowerSupervisor1sInputs pw_in{};
          pw_in.panel_brightness_on = id(display_brightness).current_values.is_on();
          pw_in.last_touch_ms = latter_ui::touch_gesture().last_touch_ms;
          pw_in.ui_focus_last_ms = latter_ui::ui_focus_last_ms();
          const auto pw_act = latter_core::evaluate_power_supervisor_1s(now_1s_ms, pw_in);
          if (pw_act.stop_alarm_sound) {
            rs.audio.stop_alarm();
          }
          if (pw_act.exit_camera_home) {
            latter_ui::release_art(id(camera_snapshot_art));
            id(sync_ui_touch_runtime).execute();
            latter_ui::touch_engine().navigate_home(now_1s_ms);
          }
          if (pw_act.sync_brightness) {
            id(sync_display_brightness).execute();
          }
          if (pw_act.navigate_home) {
            id(sync_ui_touch_runtime).execute();
            latter_ui::touch_engine().navigate_home(now_1s_ms);
          }
          if (pw_act.apply_power_policy) {
            id(apply_power_policy).execute();
          }
          if (pw_act.note_activity && !pw_act.turn_screen_off && !pw_act.enter_standby) {
            latter_core::display_lifecycle().note_activity(now_1s_ms);
          }
          if (pw_act.turn_screen_off) {
            id(turn_screen_off).execute();
          } else if (pw_act.enter_standby) {
            id(enter_standby_state).execute();
          }
          #if LATTER_HAS_BATTERY
          if (pw_act.start_hibernate_countdown) {
            id(start_hibernation_countdown).execute();
          }
          #endif

  - interval: 20ms
    id: screensaver_anim_tick
    then:
      - lambda: |-
          // High-refresh animation loop for active screensavers via FrameCadenceController.
          const auto &au = latter_core::runtime_state().audio;
          latter_ui::dispatch_cadence_screensaver_20ms(
              millis(), &id(disp1), au.speaker_busy(), au.mww_running());

script:
  # Single owner for every power-related actuator. The 1 s supervisor runs it, and state transitions
  # (wake, screen off, screensaver, VA start/stop, audio idle, USB change, beacon switch, OTA begin) call it
  # for an immediate re-evaluation. Event sites declare demand (state flags, radio_boost_until_ms) and never
  # touch Wi-Fi power save, the BLE controller, the IMU mode, tick intervals, the light-sleep awake lock or
  # the loop interval directly (latter-verify enforces this).
  - id: apply_power_policy
    mode: restart
    then:
      - lambda: |-
          const uint32_t now_p = millis();
          auto &rs = latter_core::runtime_state();

          // Radio: BLE presence beacon and Wi-Fi modem sleep.
          const uint32_t last_interact_ms = std::max({latter_core::last_screen_wake_ms(),
                                                      latter_ui::touch_gesture().last_touch_ms,
                                                      latter_ui::ui_focus_last_ms()});
          const bool sc_active_p = rs.showcase.is_active(now_p);
          const bool va_radio_priority =
              latter_core::radio_boost_active(now_p) ||
              rs.voice.active || rs.audio.va_running() || rs.voice.tts_received;
          const bool high_tput_needed =
              rs.hw_usb_connected ||
              sc_active_p ||
              va_radio_priority ||
              rs.audio.announcement_running() ||
              rs.audio.local_mp_playing() ||
              rs.audio.local_mp_announcing() ||
              (rs.nav.display_power_state == 0 && (latter_core::is_camera_view_active(rs) || (rs.alert.active && rs.cameras.doorbell_live_popup_active))) ||
              latter_core::cam_call_active() || latter_core::cam_listen_active() ||
              (rs.nav.display_power_state == 0 && (now_p - last_interact_ms < 8000U));
          const auto &prefs = latter_core::persisted_prefs();
          latter_core::evaluate_radio_policy(
              id(ble_ctrl), id(wifi_ctrl), id(wifi_ctrl).is_connected(), prefs.ble_beacon_enabled,
              latter_core::beacon_mode_index(latter_core::pref_ble_beacon_mode_cstr(prefs)), rs.hw_usb_connected,
              rs.nav.is_hibernating, rs.nav.ota_in_progress, rs.nav.display_power_state,
              high_tput_needed, now_p,
              latter_core::link_state().ha_connected, latter_core::link_state().last_ha_connect_ms,
              va_radio_priority);
          static int8_t s_prev_ble_active = -1;
          const int8_t cur_ble_active = id(ble_ctrl).is_active() ? 1 : 0;
          if (s_prev_ble_active != cur_ble_active) {
            s_prev_ble_active = cur_ble_active;
            if (latter_core::link_state().ha_connected) {
              id(publish_device_telemetry).execute();
            }
          }

          // IMU: polled modes with the screen on, hardware Wake-on-Motion with the screen off.
          #if LATTER_HAS_IMU
          if (!rs.nav.is_hibernating && !rs.nav.ota_in_progress && (now_p > 6000U) && rs.hw_set_imu_power_mode != nullptr) {
            using Mode = latter_core::ImuPowerMode;
            const std::string_view pw_mode = latter_core::pref_pickup_to_wake_cstr(prefs);
            const bool pw_allowed = (pw_mode == "Always On") ||
                                    (pw_mode == "Docked Only" && rs.hw_usb_connected);
            if (rs.nav.display_power_state) {
              // Poll only during the short qualification window after a WoM event so the
              // RaiseToWakeDetector can confirm a raise.
              rs.hw_set_imu_power_mode(!pw_allowed ? Mode::Off
                  : (latter_core::imu_wom_qualifying(now_p) ? Mode::AccelOnly : Mode::WakeOnMotion));
            } else {
              const bool need_gyro = (rs.nav.gui_page == 3 && rs.nav.active_game >= 1 && rs.nav.active_game <= 4) ||
                                     (rs.nav.gui_page == 8 && rs.nav.tools_subpage == 7);
              const bool need_accel = pw_allowed ||
                                      (rs.nav.gui_page == 1 && rs.nav.home_subpage == 0) ||
                                      (rs.nav.gui_page == 5) ||
                                      latter_core::is_camera_view_active(rs) ||
                                      (rs.nav.gui_page == 8 &&
                                       (rs.nav.tools_subpage == 4 || rs.nav.tools_subpage == 7 ||
                                        rs.nav.tools_subpage == 8));
              rs.hw_set_imu_power_mode(need_gyro ? Mode::AccelAndGyro : (need_accel ? Mode::AccelOnly : Mode::Off));
            }
          }
          #endif

          // Tick gating: with the screen off and nothing time-critical pending, nothing ticks faster than 1 s.
          const bool sc_silent_alert_p = rs.showcase.has_silent_alert(now_p);
          const bool sc_va_preview_p = rs.showcase.has_va_preview(now_p);
          const bool alerts_pending = rs.timers.running || rs.stopwatch.running || rs.alarms.find_my_active ||
                                      rs.alert.active || rs.alarms.ringing || rs.timers.ringing || sc_silent_alert_p;
          const bool va_busy = rs.voice.active || !rs.voice.status_text.empty() ||
                               rs.audio.va_running() || rs.voice.tts_received;
          auto gate = [](auto *tick, bool want, int8_t &state) {
            if (state == (want ? 1 : 0)) return;
            state = want ? 1 : 0;
            if (want) {
              tick->start_poller();
            } else {
              tick->stop_poller();
            }
          };
          static int8_t ss_anim_on = -1;
          const std::string_view eff_ss_style = latter_core::effective_screensaver_style_cstr(prefs, rs, now_p);
          const bool want_ss_anim = (rs.nav.display_power_state == 1) &&
                                    !eff_ss_style.empty() &&
                                    (eff_ss_style != "Ambient Clock") &&
                                    (eff_ss_style != "Photo Frame");
          gate(id(screensaver_anim_tick), want_ss_anim, ss_anim_on);
          if (!want_ss_anim && rs.nav.display_power_state == 1) {
            latter_ui::sync_disp_poller_for_anim(&id(disp1), false);
            id(disp1).start_poller();
          }
          // ui_anim_tick (20 ms) self-stops when no active animation is running; stop immediately when
          // leaving active display (unless VA is busy) and start whenever VA or active-screen animation needs it.
          if (va_busy || sc_va_preview_p) {
            latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
          } else if (rs.nav.display_power_state != 0) {
            latter_core::set_ui_anim_poller(id(ui_anim_tick), false);
          } else if (rs.alarms.ringing || rs.timers.ringing || rs.alarms.find_my_active || rs.alert.active ||
                     sc_silent_alert_p ||
                     rs.nav.active_game > 0 ||
                     (rs.stopwatch.running &&
                      ((rs.nav.gui_page == 10 && rs.nav.time_subpage == 3) ||
                       (rs.nav.gui_page == 8 && rs.nav.tools_subpage == 3))) ||
                     latter_ui::any_dock_anim_active(rs.nav.gui_page, rs.nav.home_subpage) ||
                     latter_ui::any_page_horiz_bounce_active(rs.nav.gui_page, rs.nav.home_subpage, millis()) ||
                     rs.nav.menu_scroll_active) {
            latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
          }
          // ui_fast_tick: 250 ms with the screen on, a voice turn, or showcase active; 1 s with the screen off while
          // a timer, stopwatch or alert is pending (a countdown still expires within a second); stopped otherwise.
          static uint32_t ui_fast_ms = UINT32_MAX;
          const uint32_t want_fast_ms = (rs.nav.display_power_state != 2 || va_busy || sc_active_p) ? 250U : (alerts_pending ? 1000U : 0U);
          if (want_fast_ms != ui_fast_ms) {
            ui_fast_ms = want_fast_ms;
            if (want_fast_ms == 0U) {
              id(ui_fast_tick).stop_poller();
            } else {
              id(ui_fast_tick).set_update_interval(want_fast_ms);
              id(ui_fast_tick).start_poller();
            }
          }

          // Automatic light sleep (boards whose HAL declares power_management with enable_light_sleep;
          // include/hal_sleep_pm.h). The awake lock keeps the chip out of light sleep except in screen-off
          // quiet on battery; while it is released the light-sleep wake pins below arm and the main loop
          // interval stretches. latter_core::pm_apply is called only here (latter-verify enforces).
          const bool audio_busy = rs.audio.busy_for_pm();
          // Home Assistant link: awake only while Wi-Fi is up and HA API is connecting (<=30 s) or settling (<=20 s),
          // so off-site battery carry never stays pinned awake waiting for an unreachable AP.
          const bool wifi_up = id(wifi_ctrl).is_connected();
          if (wifi_up != latter_core::link_state().wifi_connected) {
            latter_core::link_state().wifi_connected = wifi_up;
            if (wifi_up) {
              latter_core::link_state().last_wifi_connect_ms = (now_p == 0) ? 1U : now_p;
            } else {
              #if defined(CONFIG_PM_ENABLE) && defined(CONFIG_FREERTOS_USE_TICKLESS_IDLE)
              latter_core::weak_link_note_disconnect(now_p);
              #endif
            }
          }
          const bool api_connected = esphome::api::global_api_server != nullptr &&
                                     esphome::api::global_api_server->is_connected_with_state_subscription();
          const bool ha_link_settling =
              wifi_up && !rs.nav.ota_in_progress &&
              ((!api_connected && (now_p - latter_core::link_state().last_wifi_connect_ms < 30000U)) ||
               (api_connected && (now_p - latter_core::link_state().last_ha_connect_ms < 20000U)));
          // Weak Wi-Fi: Home Assistant's link drops in automatic light sleep at weak RSSI (hal_link_report.h,
          // kWeakLinkEnterDbm), so a sustained weak link keeps tickless-sleep chips awake after AGC settle.
          #if defined(CONFIG_PM_ENABLE) && defined(CONFIG_FREERTOS_USE_TICKLESS_IDLE)
          const bool weak_link =
              wifi_up && latter_core::weak_link_update(now_p, latter_core::link_state().last_wifi_connect_ms);
          #else
          const bool weak_link = false;
          #endif
          const bool stay_awake =
              ha_link_settling || weak_link || sc_active_p ||
              latter_core::imu_wom_qualifying(now_p) ||
              rs.nav.display_power_state != 2 || rs.hw_usb_connected || rs.nav.is_hibernating ||
              rs.nav.ota_in_progress || audio_busy || va_busy || rs.audio.va_running() || rs.voice.tts_received ||
              latter_core::radio_boost_active(now_p) || (rs.nav.active_game > 0) ||
              rs.alarms.ringing || rs.timers.ringing || rs.alarms.find_my_active || rs.alert.active ||
              latter_core::cam_call_active() || latter_core::cam_listen_active();
          // PWR key and action button always wake; touch only where a screen-off tap wakes on battery;
          // IMU INT1 while hardware Wake-on-Motion is armed.
          uint32_t wake_mask = latter_core::pm_wake_bit(latter_core::PM_WAKE_PWR_KEY) |
                               latter_core::pm_wake_bit(latter_core::PM_WAKE_ACTION_BTN);
          const std::string_view tw_mode = latter_core::pref_tap_to_wake_cstr(prefs);
          if (tw_mode == "Single Tap" || tw_mode == "Double Tap") wake_mask |= latter_core::pm_wake_bit(latter_core::PM_WAKE_TOUCH);
          #if LATTER_HAS_IMU
          if (latter_core::imu_wom().armed) wake_mask |= latter_core::pm_wake_bit(latter_core::PM_WAKE_IMU);
          latter_core::pm_note_imu(latter_core::imu_wom().armed, latter_core::imu_wom().events);
          #endif
          #if LATTER_HAS_TOUCH && LATTER_HAS_BATTERY && !LATTER_IS_STATIONARY
          latter_core::hal_touch_set_sleep_mode(rs.nav.display_power_state == 2 && !rs.hw_usb_connected);
          #endif
          latter_core::pm_apply(stay_awake, wake_mask);
