sensor:
  - platform: homeassistant
    id: ha_room_temperature
    entity_id: ${room_context_sensor}
    attribute: room_temp
    internal: true

  - platform: homeassistant
    id: ha_room_humidity
    entity_id: ${room_context_sensor}
    attribute: room_humidity
    internal: true

text_sensor:
  - platform: homeassistant
    id: ha_room_context_name
    entity_id: ${room_context_sensor}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!x.empty() && x != "unknown" && x != "unavailable") {
              id(active_room_area_name) = x;
            }

  - platform: homeassistant
    id: ha_room_context_area_id
    entity_id: ${room_context_sensor}
    attribute: area_id
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!x.empty() && x != "unknown" && x != "unavailable") {
              id(active_room_area_id) = x;
            }

  - platform: homeassistant
    id: ha_room_available_domains
    entity_id: ${room_context_sensor}
    attribute: available_domains
    internal: true

  - platform: homeassistant
    id: ha_room_alarm_entity
    entity_id: ${room_context_sensor}
    attribute: alarm_entity
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!x.empty() && x != "unknown" && x != "unavailable" && x != "none") {
              id(room_alarm_entity) = x;
            }

  - platform: homeassistant
    id: ha_room_alarm_state
    entity_id: ${room_context_sensor}
    attribute: alarm_state
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!x.empty() && x != "unknown" && x != "unavailable") {
              id(room_alarm_state) = x;
            }

script:
  - id: fetch_room_browse
    mode: restart
    then:
      - homeassistant.action:
          action: latter.room_browse
          data:
            target_device: "${name}"
            mode: "entities"
            area_id: !lambda 'return id(active_room_area_id).c_str();'
            domain_filter: !lambda 'return id(room_domain_filter).c_str();'
            page: !lambda 'return to_string(id(room_browse_page));'
            page_size: "3"

  - id: execute_room_action
    mode: restart
    then:
      - homeassistant.action:
          action: latter.room_action
          data:
            target_device: "${name}"
            entity_id: !lambda 'return id(room_target_entity_id).c_str();'
            action: !lambda 'return id(room_target_action).c_str();'
            level: !lambda 'return to_string(id(room_target_level));'
            area_id: !lambda 'return id(active_room_area_id).c_str();'
            code: !lambda 'return id(room_target_code).c_str();'