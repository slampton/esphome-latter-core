# ==============================================================================
# Latter Core Module: Universal Power, Screensaver & Peripheral Supervisor
# (modules/power_manager.yaml)
# Architecture: Single Canonical State Machine (Active, Screensaver, Standby, Hibernate)
# Parameterized by Board HAL Flags (LATTER_HAS_BATTERY, LATTER_IS_STATIONARY, LATTER_HAS_IMU)
# Zero YAML globals: reads/writes latter_ui::runtime_state() and optional HAL hooks.
# ==============================================================================

binary_sensor:
  # Bluetooth controller state as decided by apply_power_policy (Area presence beacon).
  - platform: template
    name: "BLE Radio Active"
    id: ble_radio_active
    device_class: running
    entity_category: diagnostic
    icon: "mdi:bluetooth"
    lambda: 'return id(ble_ctrl).is_active();'

  - platform: template
    name: "Pickup Detected"
    id: pickup_detected
    device_class: motion
    internal: true
    lambda: |-
      #if !LATTER_HAS_IMU
      return false;
      #else
      static uint32_t last_active_time = 0;
      static bool is_active = false;
      const auto &rs = latter_ui::runtime_state();

      const std::string_view pw_mode = latter_ui::pref_pickup_to_wake_cstr();
      if (pw_mode == "Disabled" || (pw_mode == "Docked Only" && !rs.hw_usb_connected)) {
        is_active = false;
        return false;
      }

      // Wake-on-Motion armed: pollers are stopped and the IMU produces no data, so the cached samples are stale.
      if (latter_ui::imu_wom().armed) {
        is_active = false;
        latter_ui::raise_to_wake().reset();
        return false;
      }

      float dyn = rs.hw_motion_mag;
      if (isnan(dyn)) return false;

      // Dual-Threshold In-Hand Detection:
      // While screen is active, 0.068g maintains active hold in hand without false-triggering on desk/USB noise.
      // While screen is sleeping/standby, 0.15g requires a deliberate pickup motion to wake (0.22g if speaker is playing).
      float thresh = latter_ui::get_pickup_motion_threshold(rs.nav.display_power_state == 0);
      if (rs.nav.display_power_state != 0 && id(speaker_enable).state && thresh < 0.22f) {
        thresh = 0.22f;
      }
      const uint32_t active_ms = (rs.nav.display_power_state == 0) ? 3000 : 2000;
      uint32_t now_ms = millis();

      // Screen off: orientation-qualified raise-to-wake (motion spike + screen settles face-up).
      // Screen on: plain motion keeps the in-hand hold alive.
      const bool triggered = (rs.nav.display_power_state != 0)
          ? latter_ui::raise_to_wake().update(dyn, thresh, rs.hw_accel_x, rs.hw_accel_y, rs.hw_accel_z, now_ms)
          : (dyn > thresh);
      if (triggered) {
        is_active = true;
        last_active_time = now_ms;
      } else if (is_active) {
        if (now_ms - last_active_time >= active_ms) {
          is_active = false;
        }
      }
      return is_active;
      #endif
    on_press:
      then:
        - if:
            condition:
              lambda: |-
                #if !LATTER_HAS_IMU
                return false;
                #else
                const auto &rs = latter_ui::runtime_state();
                const std::string_view mode = latter_ui::pref_pickup_to_wake_cstr();
                if (mode == "Disabled") return false;
                if (mode == "Docked Only" && !rs.hw_usb_connected) return false;
                return true;
                #endif
            then:
              - if:
                  condition:
                    lambda: 'return latter_ui::runtime_state().nav.display_power_state != 0 || !id(display_brightness).current_values.is_on();'
                  then:
                    - lambda: 'latter_ui::note_wake_reason(latter_ui::WakeReason::RAISE);'
                    - script.execute: wake_to_active_state
                  else:
                    - if:
                        condition:
                          lambda: 'return !latter_ui::runtime_state().hw_usb_connected && !id(speaker_enable).state;'
                        then:
                          - lambda: 'latter_ui::display_lifecycle().note_activity(millis());'
    on_release:
      then:
        - if:
            condition:
              lambda: |-
                const auto &rs = latter_ui::runtime_state();
                return rs.nav.display_power_state == 0 && !rs.hw_usb_connected && !id(speaker_enable).state;
            then:
              - lambda: 'latter_ui::display_lifecycle().note_activity(millis());'

interval:
  - interval: 1s
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          // 0. Alarm engine (timers_and_fetchers.yaml) shares this tick: one wake a second for both.
          id(alarm_engine_tick).execute();
          latter_ui::tick_persisted_prefs_flush(millis());
          latter_actions::check_and_emit_timer_alarm_state(millis());

          // 1. Poll Board PMU Telemetry (AXP2101 VBUS & Battery Charging when present)
          if (rs.hw_poll_pmu_1s != nullptr) {
            rs.hw_poll_pmu_1s();
          }
          latter_ui::watch_internal_low_water(
              id(ble_ctrl).is_active(), id(mww).is_running(), id(va).is_running(),
              id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_IDLE, rs.nav.gui_page);

          // 2. On-Board Wake Word (micro_wake_word) Power & Bus Supervisor
          static bool ww_model_initialized = false;
          if (!ww_model_initialized && millis() > 12000U && id(wifi_ctrl).is_connected()) {
            ww_model_initialized = true;
            id(apply_wake_word_sensitivities).execute();
            id(sync_wake_word_state).execute();
          } else if (millis() > 12500U && !rs.voice.active && !rs.voice.tts_received) {
            const bool va_busy = id(va).is_running() || !rs.voice.status_text.empty() ||
                                 id(announcement_mixing_input).is_running();
            const bool media_busy = latter_ui::audio_arbitrator().media_idle_debounce_active() || rs.voice.resume_music_after ||
                                    id(media_mixing_input).is_running() ||
                                    (id(sendspin_group_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                                    (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                                    (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING);
            const bool alert_or_tool_busy = rs.alarms.ringing || rs.timers.ringing || rs.alarms.find_my_active ||
                                            (rs.nav.active_game > 0) ||
                                            latter_ui::cam_call_active() || latter_ui::cam_listen_active() ||
                                            latter_ui::cam_intercom_ptt_active();
            const bool sys_busy = rs.nav.is_hibernating || rs.nav.ota_in_progress ||
                                  !id(wifi_ctrl).is_connected();
            const bool should_ww_run = latter_ui::wake_word_should_run(
                latter_ui::pref_wake_word_mode_cstr(),
                rs.hw_usb_connected,
                va_busy, media_busy, alert_or_tool_busy, sys_busy);
            if (should_ww_run != id(mww).is_running()) {
              id(sync_wake_word_state).execute();
            }
          }

          // 3. Voice Assistant Stuck-Open Watchdog (auto-recovers mic/speaker if HA drops mid-session >35s)
          static uint32_t va_stuck_since_ms = 0;
          if (rs.voice.active || !rs.voice.status_text.empty()) {
            if (va_stuck_since_ms == 0) va_stuck_since_ms = millis();
            else if ((millis() - va_stuck_since_ms > 35000U) &&
                     !id(va).is_running() && !id(announcement_mixing_input).is_running()) {
              ESP_LOGW("va", "Voice Assistant watchdog triggered (>35s idle): resetting session & mic");
              va_stuck_since_ms = 0;
              id(cancel_voice_assistant).execute();
            }
          } else {
            va_stuck_since_ms = 0;
          }

          // 4. [PROF:*] Flight Recorder Power & Heap Telemetry
          uint32_t now_1s_ms = millis();
          #if LATTER_HAS_TOUCH
          if (!rs.nav.is_hibernating && !rs.nav.ota_in_progress) {
            latter_ui::hal_recover_touchscreen_if_failed(id(touch_screen), now_1s_ms);
          }
          #endif
          static uint32_t last_prof_10s_ms = 0;
          static int last_prof_pwr_state = -1;
          if (latter_ui::profiler_enabled() &&
              (rs.nav.display_power_state != last_prof_pwr_state || (now_1s_ms - last_prof_10s_ms >= 10000U))) {
            const char *trig = (rs.nav.display_power_state != last_prof_pwr_state) ? "STATE_CHG" : "10S_TICK";
            last_prof_pwr_state = rs.nav.display_power_state;
            last_prof_10s_ms = now_1s_ms;
            latter_ui::log_power_and_mem_profile(
                trig, rs.nav.display_power_state, rs.hw_usb_connected, rs.hw_batt_charging,
                rs.hw_batt_level, rs.hw_batt_voltage, id(speaker_enable).state,
                id(mww).is_running(), rs.voice.active,
                id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING,
                id(ble_ctrl).is_active(), rs.nav.active_game, rs.nav.sleep_start_time);
          }

          // 6-7. Single power-policy owner: radio (BLE beacon / Wi-Fi modem sleep), IMU mode,
          // screen-off tick gating, battery polling and the light-sleep awake lock all live in script
          // apply_power_policy.
          id(apply_power_policy).execute();

          // 8. Safe Docked-Idle Background Firmware Update Check (after 3 min uptime, every 6h while on USB & idle)
          static uint32_t last_fw_check_ms = 0;
          if (now_1s_ms > 180000U && rs.hw_usb_connected && id(wifi_ctrl).is_connected() &&
              (rs.nav.display_power_state != 0) &&
              !rs.voice.active && !rs.voice.tts_received && !rs.nav.ota_in_progress &&
              (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
              (last_fw_check_ms == 0 || (now_1s_ms - last_fw_check_ms >= 21600000U))) {
            last_fw_check_ms = now_1s_ms;
            id(check_firmware_update).execute();
          }

          // 9. Self-heal any settled pending DCS transition.
          latter_ui::hal_panel_dcs_poll(&id(disp1));

          // 10. Auto-exit forgotten Games (>3m untouched), Battery Flashlight/Level/Camera (>5m untouched),
          // and Return-to-Home idle navigation reset.
          const auto &prefs = latter_ui::persisted_prefs();
          uint32_t last_user_act_ms = std::max({latter_ui::last_screen_wake_ms(),
                                                latter_ui::touch_gesture().last_touch_ms,
                                                latter_ui::ui_focus_last_ms()});
          if (rs.nav.display_power_state == 0 && (now_1s_ms > last_user_act_ms)) {
            uint32_t touch_idle_ms = now_1s_ms - last_user_act_ms;
            if (rs.nav.active_game > 0 && touch_idle_ms >= 180000U) {
              ESP_LOGI("power", "Game untouched for 3 min: exiting to launcher so screen can sleep");
              rs.nav.active_game = 0;
              id(stop_alarm_sound).execute();
              latter_ui::display_lifecycle().note_activity(now_1s_ms);
            }
            if (!rs.hw_usb_connected && rs.nav.gui_page == 8 &&
                (rs.nav.tools_subpage == 5 || rs.nav.tools_subpage == 7 || rs.nav.tools_subpage == 12) &&
                touch_idle_ms >= 300000U) {
              ESP_LOGI("power", "Tool untouched on battery for 5 min: exiting to launcher");
              if (rs.nav.tools_subpage == 12) {
                if (latter_ui::cam_call_active() || latter_ui::cam_intercom_ptt_active() || latter_ui::cam_listen_active()) {
                  latter_ui::intercom_session().stop_call_with_hw(now_1s_ms);
                }
                latter_ui::release_art(id(camera_snapshot_art));
              }
              rs.nav.tools_subpage = 0;
              id(sync_display_brightness).execute();
              latter_ui::display_lifecycle().note_activity(now_1s_ms);
            }
          }
          const uint32_t rth_ms = latter_ui::return_to_home_timeout_ms(prefs);
          const bool media_playing_1s =
              (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
              (latter_ui::media_state().state == "playing");
          const bool cam_busy_1s = latter_ui::cam_call_active() ||
                                   latter_ui::cam_listen_active() ||
                                   latter_ui::cam_intercom_ptt_active();
          if (rs.nav.display_power_state != 2 && rth_ms > 0U &&
              (now_1s_ms > last_user_act_ms) &&
              (now_1s_ms - last_user_act_ms >= rth_ms) &&
              latter_ui::should_return_to_home_on_idle(rs, prefs, media_playing_1s, cam_busy_1s)) {
            ESP_LOGI("power", "Idle exceeded Return to Home timeout (%s): returning to Home",
                     latter_ui::pref_return_to_home_timeout_cstr(prefs));
            id(sync_ui_touch_runtime).execute();
            latter_ui::touch_engine().navigate_home(now_1s_ms);
            id(apply_power_policy).execute();
          }

          // 11. DisplayLifecycleController 1s supervisor: standby greeting tracking, external light-off sync,
          // deterministic active-screen idle timeout, and battery hibernate descent.
          const bool active_tool_awake =
              (rs.nav.gui_page == 8 &&
               (rs.nav.tools_subpage == 5 || rs.nav.tools_subpage == 7 || rs.nav.tools_subpage == 12));
          const uint32_t since_touch_ms = now_1s_ms - std::max(latter_ui::last_screen_wake_ms(),
                                                               latter_ui::touch_gesture().last_touch_ms);
          const bool in_hand_hold = (since_touch_ms < 90000U) &&
              latter_ui::should_in_hand_block_sleep(
                  !rs.hw_usb_connected && !id(speaker_enable).state && id(pickup_detected).state);
          const bool voice_or_announce_busy =
              rs.voice.active || id(va).is_running() || rs.voice.tts_received ||
              id(announcement_mixing_input).is_running();
          const bool alert_or_stopwatch_busy =
              rs.stopwatch.running || rs.timers.ringing || rs.alarms.ringing ||
              rs.alarms.find_my_active || rs.alert.active;
          const bool hibernate_blocked =
              rs.nav.is_hibernating || rs.hw_usb_connected || rs.nav.ota_in_progress ||
              (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
              rs.stopwatch.running || rs.timers.running || rs.timers.ringing ||
              rs.alarms.ringing || rs.alarms.find_my_active || voice_or_announce_busy ||
              cam_busy_1s || (rs.nav.active_game > 0);

          latter_ui::DisplaySupervisorInputs dl_in{};
          dl_in.is_stationary = (LATTER_IS_STATIONARY != 0);
          dl_in.has_battery = (LATTER_HAS_BATTERY != 0);
          dl_in.usb_connected = rs.hw_usb_connected;
          dl_in.docked_screensaver = prefs.docked_screensaver;
          dl_in.docked_timeout_opt = latter_ui::pref_docked_idle_timeout_cstr(prefs);
          dl_in.battery_timeout_opt = latter_ui::pref_battery_screen_timeout_cstr(prefs);
          dl_in.hibernate_timeout_opt = latter_ui::pref_battery_hibernate_timeout_cstr(prefs);
          dl_in.wake_greeting_enabled = prefs.wake_greeting;
          dl_in.panel_brightness_on = id(display_brightness).current_values.is_on();
          dl_in.is_hibernating = rs.nav.is_hibernating;
          dl_in.ota_in_progress = rs.nav.ota_in_progress;
          dl_in.voice_or_announce_busy = voice_or_announce_busy;
          dl_in.alert_or_stopwatch_busy = alert_or_stopwatch_busy;
          dl_in.in_hand_hold = in_hand_hold;
          dl_in.active_tool_awake = active_tool_awake;
          dl_in.active_game_running = (rs.nav.active_game != 0);
          dl_in.hibernate_blocked = hibernate_blocked;

          const auto dl_act = latter_ui::display_lifecycle().evaluate_1s(
              now_1s_ms, dl_in, rs.nav.display_power_state, rs.nav.sleep_start_time,
              rs.nav.standby_entered_ms, rs.nav.wake_greeting_pending);
          if (dl_act.turn_screen_off_now) {
            id(turn_screen_off).execute();
          } else if (dl_act.enter_standby_now) {
            id(enter_standby_state).execute();
          }
          #if LATTER_HAS_BATTERY
          if (dl_act.start_hibernate_countdown_now) {
            ESP_LOGI("power", "Inactivity with screen off exceeded %s: starting hibernation countdown",
                     latter_ui::pref_battery_hibernate_timeout_cstr(prefs));
            latter_ui::battery_model().hib_reason = latter_ui::HibernateReason::IDLE;
            id(start_hibernation_countdown).execute();
          }
          #endif

  - interval: 20ms
    id: screensaver_anim_tick
    then:
      - lambda: |-
          // High-refresh animation loop for active screensavers (16.7 FPS idle, 12.5 FPS during audio / S3 wake-word).
          // The PWR key is a GPIO binary_sensor (board HAL), so no PMU polling happens here.
          const auto &rs = latter_ui::runtime_state();
          bool ss_anim_driving = false;
          if (rs.nav.display_power_state == 1 && !rs.voice.active && rs.voice.status_text.empty() && !rs.nav.is_hibernating) {
            const std::string_view s_style = latter_ui::pref_screensaver_style_cstr();
            if (s_style != "Ambient Clock" && s_style != "Screen Off") {
              ss_anim_driving = true;
              const uint32_t now_ss_ms = millis();
              const bool speaker_audio_busy =
                  (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                  (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING) ||
                  (id(sendspin_group_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                  id(media_mixing_input).is_running() ||
                  id(announcement_mixing_input).is_running() ||
                  id(sound_mixing_input).is_running();
              const bool mww_passive_busy = !speaker_audio_busy && !LATTER_CHIP_P4 && id(mww).is_running();
              if (latter_ui::should_step_ambient_anim(now_ss_ms, speaker_audio_busy,
                                                      rs.voice.active || !rs.voice.status_text.empty(),
                                                      rs.alarms.ringing || rs.timers.ringing || rs.alarms.find_my_active,
                                                      mww_passive_busy)) {
                latter_ui::record_ambient_frame_ms(now_ss_ms);
                latter_ui::schedule_anim_disp_update(&id(disp1));
              }
            }
          }
          if (rs.nav.display_power_state == 1 && !rs.voice.active && rs.voice.status_text.empty()) {
            latter_ui::sync_disp_poller_for_anim(&id(disp1), ss_anim_driving);
          }

script:
  # Single owner for every power-related actuator. The 1 s supervisor runs it, and state transitions
  # (wake, screen off, screensaver, VA start/stop, audio idle, USB change, beacon switch, OTA begin) call it
  # for an immediate re-evaluation. Event sites declare demand (state flags, radio_boost_until_ms) and never
  # touch Wi-Fi power save, the BLE controller, the IMU mode, tick intervals, the light-sleep awake lock or
  # the loop interval directly (latter-verify enforces this).
  - id: apply_power_policy
    mode: restart
    then:
      - lambda: |-
          const uint32_t now_p = millis();
          auto &rs = latter_ui::runtime_state();

          // Radio: BLE presence beacon and Wi-Fi modem sleep.
          const uint32_t last_interact_ms = std::max({latter_ui::last_screen_wake_ms(),
                                                      latter_ui::touch_gesture().last_touch_ms,
                                                      latter_ui::ui_focus_last_ms()});
          const bool va_radio_priority =
              latter_ui::radio_boost_active(now_p) ||
              rs.voice.active || id(va).is_running() || rs.voice.tts_received;
          const bool high_tput_needed =
              rs.hw_usb_connected ||
              va_radio_priority ||
              id(announcement_mixing_input).is_running() ||
              (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
              (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING) ||
              (rs.nav.display_power_state == 0 && rs.nav.gui_page == 8 && rs.nav.tools_subpage == 12) ||
              latter_ui::cam_call_active() || latter_ui::cam_listen_active() ||
              (rs.nav.display_power_state == 0 && (now_p - last_interact_ms < 8000U));
          const auto &prefs = latter_ui::persisted_prefs();
          latter_ui::evaluate_radio_policy(
              id(ble_ctrl), id(wifi_ctrl), id(wifi_ctrl).is_connected(), prefs.ble_beacon_enabled,
              latter_ui::beacon_mode_index(latter_ui::pref_ble_beacon_mode_cstr(prefs)), rs.hw_usb_connected,
              rs.nav.is_hibernating, rs.nav.ota_in_progress, rs.nav.display_power_state,
              high_tput_needed, now_p,
              latter_ui::link_state().ha_connected, latter_ui::link_state().last_ha_connect_ms,
              va_radio_priority);

          // IMU: polled modes with the screen on, hardware Wake-on-Motion with the screen off.
          #if LATTER_HAS_IMU
          if (!rs.nav.is_hibernating && !rs.nav.ota_in_progress && (now_p > 6000U) && rs.hw_set_imu_power_mode != nullptr) {
            const std::string_view pw_mode = latter_ui::pref_pickup_to_wake_cstr(prefs);
            const bool pw_allowed = (pw_mode == "Always On") ||
                                    (pw_mode == "Docked Only" && rs.hw_usb_connected);
            if (rs.nav.display_power_state) {
              // Poll only during the short qualification window after a WoM event so the
              // RaiseToWakeDetector can confirm a raise.
              rs.hw_set_imu_power_mode(!pw_allowed ? 0x00
                  : (latter_ui::imu_wom_qualifying(now_p) ? 0x01 : 0x80));
            } else {
              const bool need_gyro = (rs.nav.gui_page == 3 && rs.nav.active_game >= 1 && rs.nav.active_game <= 4) ||
                                     (rs.nav.gui_page == 8 && rs.nav.tools_subpage == 7);
              const bool need_accel = pw_allowed ||
                                      (rs.nav.gui_page == 1 && rs.nav.home_subpage == 0) ||
                                      (rs.nav.gui_page == 5) ||
                                      (rs.nav.gui_page == 8 &&
                                       (rs.nav.tools_subpage == 4 || rs.nav.tools_subpage == 7 ||
                                        rs.nav.tools_subpage == 8 || rs.nav.tools_subpage == 12));
              rs.hw_set_imu_power_mode(need_gyro ? 0x03 : (need_accel ? 0x01 : 0x00));
            }
          }
          #endif

          // Tick gating: with the screen off and nothing time-critical pending, nothing ticks faster than 1 s.
          const bool alerts_pending = rs.timers.running || rs.stopwatch.running || rs.alarms.find_my_active ||
                                      rs.alert.active || rs.alarms.ringing || rs.timers.ringing;
          const bool va_busy = rs.voice.active || !rs.voice.status_text.empty() ||
                               id(va).is_running() || rs.voice.tts_received;
          auto gate = [](auto *tick, bool want, int8_t &state) {
            if (state == (want ? 1 : 0)) return;
            state = want ? 1 : 0;
            if (want) {
              tick->start_poller();
            } else {
              tick->stop_poller();
            }
          };
          static int8_t ss_anim_on = -1;
          gate(id(screensaver_anim_tick), rs.nav.display_power_state == 1, ss_anim_on);
          // ui_anim_tick (20 ms) self-stops when no active animation is running; stop immediately when
          // leaving active display (unless VA is busy) and start whenever VA or active-screen animation needs it.
          if (va_busy) {
            latter_ui::ensure_ui_anim_poller(id(ui_anim_tick));
          } else if (rs.nav.display_power_state != 0) {
            latter_ui::set_ui_anim_poller(id(ui_anim_tick), false);
          } else if (rs.alarms.ringing || rs.timers.ringing || rs.alarms.find_my_active || rs.alert.active ||
                     rs.nav.active_game > 0 ||
                     latter_ui::any_dock_anim_active(rs.nav.gui_page, rs.nav.home_subpage) ||
                     rs.nav.menu_scroll_active) {
            latter_ui::ensure_ui_anim_poller(id(ui_anim_tick));
          }
          // ui_fast_tick: 250 ms with the screen on or a voice turn; 1 s with the screen off while a timer,
          // stopwatch or alert is pending (a countdown still expires within a second); stopped otherwise.
          static uint32_t ui_fast_ms = UINT32_MAX;
          const uint32_t want_fast_ms = (rs.nav.display_power_state != 2 || va_busy) ? 250U : (alerts_pending ? 1000U : 0U);
          if (want_fast_ms != ui_fast_ms) {
            ui_fast_ms = want_fast_ms;
            if (want_fast_ms == 0U) {
              id(ui_fast_tick).stop_poller();
            } else {
              id(ui_fast_tick).set_update_interval(want_fast_ms);
              id(ui_fast_tick).start_poller();
            }
          }

          // Automatic light sleep (boards whose HAL declares power_management with enable_light_sleep;
          // include/hal_power_pm.h). The awake lock keeps the chip out of light sleep except in screen-off
          // quiet on battery; while it is released the light-sleep wake pins below arm and the main loop
          // interval stretches. latter_ui::pm_apply is called only here (latter-verify enforces).
          const bool audio_busy = id(speaker_enable).state || id(mww).is_running() ||
                                  id(announcement_mixing_input).is_running() ||
                                  latter_ui::audio_arbitrator().has_pending_work() ||
                                  (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                                  (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING);
          // Home Assistant link: awake only while Wi-Fi is up and HA API is connecting (<=30 s) or settling (<=20 s),
          // so off-site battery carry never stays pinned awake waiting for an unreachable AP.
          const bool wifi_up = id(wifi_ctrl).is_connected();
          if (wifi_up != latter_ui::link_state().wifi_connected) {
            latter_ui::link_state().wifi_connected = wifi_up;
            if (wifi_up) latter_ui::link_state().last_wifi_connect_ms = (now_p == 0) ? 1U : now_p;
          }
          const bool api_connected = esphome::api::global_api_server != nullptr &&
                                     esphome::api::global_api_server->is_connected_with_state_subscription();
          const bool ha_link_settling =
              wifi_up && !rs.nav.ota_in_progress &&
              ((!api_connected && (now_p - latter_ui::link_state().last_wifi_connect_ms < 30000U)) ||
               (api_connected && (now_p - latter_ui::link_state().last_ha_connect_ms < 20000U)));
          // Weak Wi-Fi: Home Assistant's link drops in light sleep at weak RSSI (hal_link_report.h,
          // kWeakLinkEnterDbm), so a weak link keeps the chip awake until the v3 fix.
          const bool weak_link = wifi_up && latter_ui::weak_link_update(now_p);
          const bool stay_awake =
              ha_link_settling || weak_link ||
              latter_ui::imu_wom_qualifying(now_p) ||
              rs.nav.display_power_state != 2 || rs.hw_usb_connected || rs.nav.is_hibernating ||
              rs.nav.ota_in_progress || audio_busy || va_busy || id(va).is_running() || rs.voice.tts_received ||
              latter_ui::radio_boost_active(now_p) || (rs.nav.active_game > 0) ||
              rs.alarms.ringing || rs.timers.ringing || rs.alarms.find_my_active || rs.alert.active ||
              latter_ui::cam_call_active() || latter_ui::cam_listen_active();
          // PWR key and action button always wake; touch only where a screen-off tap wakes on battery;
          // IMU INT1 while hardware Wake-on-Motion is armed.
          uint32_t wake_mask = latter_ui::pm_wake_bit(latter_ui::PM_WAKE_PWR_KEY) |
                               latter_ui::pm_wake_bit(latter_ui::PM_WAKE_ACTION_BTN);
          const std::string_view tw_mode = latter_ui::pref_tap_to_wake_cstr(prefs);
          if (tw_mode == "Always On") wake_mask |= latter_ui::pm_wake_bit(latter_ui::PM_WAKE_TOUCH);
          #if LATTER_HAS_IMU
          if (latter_ui::imu_wom().armed) wake_mask |= latter_ui::pm_wake_bit(latter_ui::PM_WAKE_IMU);
          latter_ui::pm_note_imu(latter_ui::imu_wom().armed, latter_ui::imu_wom().events);
          #endif
          #if LATTER_HAS_BATTERY && !LATTER_IS_STATIONARY
          latter_ui::hal_set_touch_sleep_mode(id(bus_internal), rs.nav.display_power_state == 2 && !rs.hw_usb_connected);
          #endif
          latter_ui::pm_apply(stay_awake, wake_mask);

  # Return the display to its pre-voice-session state (see latter_ui::VaDisplayRestore).
  - id: va_restore_display
    mode: restart
    then:
      # Let a music resume settle first (turn_screen_off tears audio down when nothing is playing yet).
      - wait_until:
          condition:
            lambda: 'return !id(resume_music_after_va).is_running();'
          timeout: 4s
      - delay: 1500ms
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          auto &r = latter_ui::va_display_restore();
          const int prior = r.armed ? r.prior_state : 0;
          const bool touched = r.touched_since_start(latter_ui::touch_gesture().last_touch_ms);
          r.armed = false;
          const bool alert_up = rs.alarms.ringing || rs.timers.ringing || rs.alarms.find_my_active || rs.alert.active;
          if (alert_up || touched || prior == 0 || rs.nav.display_power_state != 0 || rs.nav.is_hibernating) {
            latter_ui::display_lifecycle().note_activity(millis());
            return;
          }
          if (prior == 1) {
            id(enter_standby_state).execute();  // screensaver if still allowed (docked, style), else off
          } else {
            id(turn_screen_off).execute();
          }

  - id: trigger_screensaver_now
    mode: restart
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          const uint32_t now_ss_ms = millis();
          const std::string_view s_style = latter_ui::pref_screensaver_style_cstr();
          if (s_style == "Screen Off") {
            id(turn_screen_off).execute();
            return;
          }
          latter_ui::display_lifecycle().on_enter_screensaver(
              now_ss_ms, rs.nav.display_power_state, rs.nav.sleep_start_time, rs.nav.standby_entered_ms);
          id(disp1).start_poller();
          latter_ui::record_ambient_frame_ms(now_ss_ms);
          id(apply_power_policy).execute();
          id(display_brightness).turn_on().set_brightness(latter_ui::kScreensaverBrightness).perform();
          latter_ui::schedule_disp_update(&id(disp1));

  - id: turn_screen_off
    mode: restart
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          const uint32_t now_off_ms = millis();
          rs.nav.active_game = 0;
          if (latter_ui::cam_call_active() || latter_ui::cam_intercom_ptt_active() || latter_ui::cam_listen_active()) {
            latter_ui::intercom_session().stop_call_with_hw(now_off_ms);
          }
          rs.nav.display_power_state = 2; // Flush single all-black frame before cutting panel brightness
          id(disp1).update();
          latter_ui::display_lifecycle().on_enter_standby_off(
              now_off_ms, rs.nav.display_power_state, rs.nav.sleep_start_time, rs.nav.standby_entered_ms);
          id(disp1).stop_poller();
          id(display_brightness).turn_off().perform();

          const bool local_audio_playing = (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          const std::string_view ww_mode = latter_ui::pref_wake_word_mode_cstr();
          const bool ww_active = (ww_mode == "Always On") || (ww_mode == "Docked Only" && rs.hw_usb_connected);

          id(sync_wake_word_state).execute();

          if (!local_audio_playing) {
            id(mute_speaker_path).execute();
            if (!ww_active) {
              id(hal_set_audio_codecs_standby).execute(true);
            }
          }
          id(apply_power_policy).execute();

  - id: enter_standby_state
    mode: restart
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          const uint32_t now_sb_ms = millis();
          const auto &prefs = latter_ui::persisted_prefs();
          const std::string_view s_style = latter_ui::pref_screensaver_style_cstr(prefs);
          bool screensaver_allowed = rs.hw_usb_connected &&
                                     prefs.docked_screensaver &&
                                     (s_style != "Screen Off");
          if (screensaver_allowed) {
            latter_ui::display_lifecycle().on_enter_screensaver(
                now_sb_ms, rs.nav.display_power_state, rs.nav.sleep_start_time, rs.nav.standby_entered_ms);
            id(disp1).start_poller();
            latter_ui::record_ambient_frame_ms(now_sb_ms);
            id(apply_power_policy).execute();
            id(display_brightness).turn_on().set_brightness(latter_ui::kScreensaverBrightness).perform();
            if (s_style == "Ambient Clock") {
              latter_ui::schedule_disp_update(&id(disp1));
            }
          } else {
            #if !LATTER_IS_STATIONARY
            id(turn_screen_off).execute();
            #endif
          }

  - id: wake_to_active_state
    mode: restart
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          const uint32_t wake_now_ms = millis();
          const uint32_t prev_user_act_ms = std::max({latter_ui::last_screen_wake_ms(),
                                                      latter_ui::touch_gesture().last_touch_ms,
                                                      latter_ui::ui_focus_last_ms()});
          const uint32_t rth_ms = latter_ui::return_to_home_timeout_ms(latter_ui::persisted_prefs());
          const bool media_playing_wake =
              (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
              (latter_ui::media_state().state == "playing");
          const bool cam_busy_wake = latter_ui::cam_call_active() ||
                                     latter_ui::cam_listen_active() ||
                                     latter_ui::cam_intercom_ptt_active();
          if (rth_ms > 0U && wake_now_ms > prev_user_act_ms &&
              (wake_now_ms - prev_user_act_ms >= rth_ms) &&
              latter_ui::should_return_to_home_on_idle(
                  rs, latter_ui::persisted_prefs(), media_playing_wake, cam_busy_wake)) {
            id(sync_ui_touch_runtime).execute();
            latter_ui::touch_engine().navigate_home(wake_now_ms);
          }
          if (rs.nav.display_power_state != 0 || !id(display_brightness).current_values.is_on()) {
            latter_ui::record_screen_wake();
          }
          latter_ui::display_lifecycle().on_wake_active(
              wake_now_ms, rs.nav.display_power_state, rs.nav.sleep_start_time,
              rs.nav.standby_entered_ms, latter_ui::persisted_prefs().wake_greeting,
              rs.nav.wake_greeting_pending);
          latter_ui::raise_to_wake().reset();
          id(disp1).start_poller();
          latter_ui::ensure_ui_anim_poller(id(ui_anim_tick));
      # Pixel wake runs BEFORE radio/IMU I2C work in apply_power_policy so Frame #1 lights up immediately.
      - script.execute: sync_display_brightness
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
      - script.execute: apply_power_policy
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          // Codec power follows audio demand, not screen state: enable_speaker_path / sync_wake_word_state /
          // voice entry points wake the codecs when audio actually starts.
          if (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING && !id(speaker_enable).state) {
            id(enable_speaker_path).execute();
          }
          const std::string &art_u = latter_ui::media_state().art_url;
          if (rs.nav.gui_page == 2 &&
              (!latter_ui::media_state().is_local || id(album_art).get_width() == 0) &&
              !art_u.empty() &&
              art_u != rs.music.loaded_art_url) {
            id(fetch_remote_art_debounced).execute();
          }
          const std::string &wp_u = latter_ui::area_ctx_state().wallpaper_url;
          if (!wp_u.empty() &&
              wp_u != rs.music.loaded_wallpaper_url) {
            id(fetch_wallpaper_debounced).execute();
          }

  - id: prepare_hibernation_teardown
    mode: restart
    parameters:
      countdown_sec: int
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          latter_ui::display_lifecycle().on_prepare_hibernate(
              rs.nav.display_power_state, rs.nav.sleep_start_time);
          latter_ui::set_ui_anim_poller(id(ui_anim_tick), false);
          id(disp1).start_poller();
          rs.nav.hibernate_countdown_val = countdown_sec;
          rs.nav.is_hibernating = true;
          rs.nav.active_game = 0;
      - micro_wake_word.stop:
      - voice_assistant.stop:
      - media_player.pause: latter_media_player
      - lambda: 'id(hal_set_dac_mute).execute(true);'
      - switch.turn_off: speaker_enable
      - script.execute: sync_display_brightness
      - if:
          condition:
            lambda: 'return countdown_sec > 0;'
          then:
            - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
          else:
            - component.update: disp1

  - id: start_instant_hibernation
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return LATTER_HAS_BATTERY != 0;'
          then:
            - script.execute:
                id: prepare_hibernation_teardown
                countdown_sec: 0
            - script.wait: prepare_hibernation_teardown
            - delay: 1000ms
            - script.execute: enter_deep_sleep

  - id: start_hibernation_countdown
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return LATTER_HAS_BATTERY != 0;'
          then:
            - script.execute:
                id: prepare_hibernation_teardown
                countdown_sec: 5
            - script.wait: prepare_hibernation_teardown
            - repeat:
                count: 5
                then:
                  - delay: 1000ms
                  - if:
                      condition:
                        lambda: 'return latter_ui::runtime_state().nav.is_hibernating;'
                      then:
                        - lambda: |-
                            auto &rs = latter_ui::runtime_state();
                            if (rs.nav.hibernate_countdown_val > 1) {
                              rs.nav.hibernate_countdown_val--;
                              latter_ui::schedule_disp_update(&id(disp1));
                            }
                  - if:
                      condition:
                        lambda: 'return !latter_ui::runtime_state().nav.is_hibernating;'
                      then:
                        - lambda: 'latter_ui::hibernate_ui_prepared() = false;'
                        - script.stop: start_hibernation_countdown
            - if:
                condition:
                  lambda: 'return latter_ui::runtime_state().nav.is_hibernating;'
                then:
                  - lambda: 'latter_ui::runtime_state().nav.hibernate_countdown_val = 0;'
                  - script.execute: enter_deep_sleep

  - id: enter_deep_sleep
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return LATTER_HAS_BATTERY != 0;'
          then:
            - if:
                condition:
                  lambda: 'return !latter_ui::hibernate_ui_prepared();'
                then:
                  - script.execute:
                      id: prepare_hibernation_teardown
                      countdown_sec: 0
                  - script.wait: prepare_hibernation_teardown
                  - delay: 600ms
            - lambda: 'latter_ui::hibernate_ui_prepared() = false;'
            - wait_until:
                condition:
                  lambda: |-
                    const auto &rs = latter_ui::runtime_state();
                    return rs.hw_pwr_key_pressed == nullptr || !rs.hw_pwr_key_pressed();
                timeout: 3s
            - lambda: |-
                auto &rs = latter_ui::runtime_state();
                rs.nav.is_hibernating = false;
                rs.nav.display_power_state = 2;
            - light.turn_off: display_brightness
            - component.update: disp1
            - lambda: |-
                latter_ui::flush_persisted_prefs_if_dirty();
                latter_ui::save_hibernate_snapshot();
                latter_ui::hal_rtc_sync_from_system_clock(id(bus_internal));
                id(sys_link_report).publish_state("hibernating");
                esphome::voice_assistant::clean_disconnect_api_before_hibernate(id(va));
            - delay: 250ms
            - safe_mode.mark_successful:
            - script.execute: hal_enter_hardware_hibernate
