# ==============================================================================
# Latter Core Module: Universal Power, Screensaver & Peripheral Supervisor (modules/power_manager.yaml)
# Architecture: Single Canonical State Machine (Active, Screensaver, Standby, Hibernate)
# Parameterized by Board HAL Flags (LATTER_HAS_BATTERY, LATTER_IS_STATIONARY, LATTER_HAS_IMU)
# ==============================================================================

globals:
  - id: sleep_start_time
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: is_hibernating
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: hibernate_countdown_val
    type: int
    restore_value: no
    initial_value: '0'

  - id: display_power_state
    type: int
    restore_value: no
    initial_value: '0' # 0 = ACTIVE, 1 = SCREENSAVER, 2 = SCREEN_OFF / STANDBY

  - id: sleep_menu_page
    type: int
    restore_value: no
    initial_value: '1' # 1..2 (Page 1 & Page 2 of Sleep & Wake Submenu)

  - id: power_profile_seeded
    type: bool
    restore_value: yes
    initial_value: 'false'

binary_sensor:
  # Bluetooth controller state as decided by apply_power_policy (Area presence beacon).
  - platform: template
    name: "BLE Radio Active"
    id: ble_radio_active
    device_class: running
    entity_category: diagnostic
    icon: "mdi:bluetooth"
    lambda: 'return id(ble_ctrl).is_active();'

  - platform: template
    name: "Pickup Detected"
    id: pickup_detected
    device_class: motion
    entity_category: diagnostic
    lambda: |-
      #if !LATTER_HAS_IMU
      return false;
      #else
      static uint32_t last_active_time = 0;
      static bool is_active = false;

      auto pw_mode = id(pickup_wake_mode).current_option();
      if (pw_mode == "Disabled" || (pw_mode == "Docked Only" && !id(usb_connected).state)) {
        is_active = false;
        return false;
      }

      // Wake-on-Motion armed: pollers are stopped and the IMU produces no data, so the cached samples are stale.
      if (latter_ui::imu_wom().armed) {
        is_active = false;
        latter_ui::raise_to_wake().reset();
        return false;
      }

      float dyn = id(motion_mag).state;
      if (isnan(dyn)) return false;

      // Dual-Threshold In-Hand Detection:
      // While screen is active, 0.068g maintains active hold in your hand without false-triggering on desk/USB noise.
      // While screen is sleeping/standby, 0.15g requires a deliberate pickup motion to wake (0.22g if speaker is playing).
      float thresh = latter_ui::get_pickup_motion_threshold(id(display_power_state) == 0);
      if (id(display_power_state) != 0 && id(speaker_enable).state && thresh < 0.22f) {
        thresh = 0.22f;
      }
      const uint32_t active_ms = (id(display_power_state) == 0) ? 3000 : 2000;
      uint32_t now_ms = millis();

      // Screen off: orientation-qualified raise-to-wake (motion spike + screen settles face-up).
      // Screen on: plain motion keeps the in-hand hold alive.
      const bool triggered = (id(display_power_state) != 0)
          ? latter_ui::raise_to_wake().update(dyn, thresh, id(accel_x).state, id(accel_y).state,
                                              id(accel_z).state, now_ms)
          : (dyn > thresh);
      if (triggered) {
        is_active = true;
        last_active_time = now_ms;
      } else if (is_active) {
        if (now_ms - last_active_time >= active_ms) {
          is_active = false;
        }
      }
      return is_active;
      #endif
    on_press:
      then:
        - if:
            condition:
              lambda: |-
                #if !LATTER_HAS_IMU
                return false;
                #else
                auto mode = id(pickup_wake_mode).current_option();
                if (mode == "Disabled") return false;
                if (mode == "Docked Only" && !id(usb_connected).state) return false;
                return true;
                #endif
            then:
              - if:
                  condition:
                    lambda: 'return id(display_power_state) != 0 || !id(display_brightness).current_values.is_on();'
                  then:
                    - lambda: 'latter_ui::note_wake_reason(latter_ui::WakeReason::RAISE);'
                    - script.execute: wake_to_active_state
                  else:
                    - if:
                        condition:
                          lambda: 'return !id(usb_connected).state && !id(speaker_enable).state;'
                        then:
                          - script.execute: screen_sleep_timer
    on_release:
      then:
        - if:
            condition:
              lambda: 'return id(display_power_state) == 0 && !id(usb_connected).state && !id(speaker_enable).state;'
            then:
              - script.execute: screen_sleep_timer

button:
  - platform: template
    name: "Actions: Screensaver Now"
    id: trigger_screensaver_btn
    icon: "mdi:weather-night"
    entity_category: config
    on_press:
      - script.execute: trigger_screensaver_now

switch:
  - platform: template
    name: "Sleep & Wake: Hold Crown Power Off"
    id: instant_crown_hibernate_switch
    entity_category: config
    icon: "mdi:lightning-bolt"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(instant_crown_hibernate_switch).publish_state(true);'
    turn_off_action:
      - lambda: 'id(instant_crown_hibernate_switch).publish_state(false);'

  - platform: template
    name: "Sleep & Wake: Docked Screensaver"
    id: docked_screensaver_switch
    icon: "mdi:power-sleep"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(docked_screensaver_switch).publish_state(true);
          if (id(display_power_state) == 0) {
            id(screen_sleep_timer).execute();
          }
    turn_off_action:
      - lambda: |-
          id(docked_screensaver_switch).publish_state(false);
          if (id(display_power_state) == 1) {
            #if LATTER_IS_STATIONARY
            id(wake_to_active_state).execute();
            #else
            id(turn_screen_off).execute();
            #endif
          }

select:
  - platform: template
    name: "Sleep & Wake: Battery Screen Timeout"
    id: display_off_timeout
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "30s"
    options:
      - "10s"
      - "15s"
      - "30s"
      - "1 min"
      - "2 min"
      - "Never"
    set_action:
      - lambda: |-
          latter_ui::mark_power_profile_custom_if_manual(id(power_profile_select));
          id(screen_sleep_timer).execute();
          latter_ui::schedule_disp_update(&id(disp1));

  - platform: template
    name: "Sleep & Wake: Docked Idle Timeout"
    id: screensaver_docked_timeout
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "1 min"
    options:
      - "10s"
      - "15s"
      - "30s"
      - "1 min"
      - "2 min"
      - "5 min"
      - "Never"
    set_action:
      - lambda: |-
          latter_ui::mark_power_profile_custom_if_manual(id(power_profile_select));
          id(screen_sleep_timer).execute();
          latter_ui::schedule_disp_update(&id(disp1));

  - platform: template
    name: "Sleep & Wake: Battery Hibernate Timeout"
    id: hibernate_timeout_mode
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "15 min"
    options:
      - "5 min"
      - "10 min"
      - "15 min"
      - "30 min"
      - "Disabled"
    set_action:
      - lambda: |-
          latter_ui::mark_power_profile_custom_if_manual(id(power_profile_select));
          latter_ui::schedule_disp_update(&id(disp1));

  - platform: template
    name: "Sleep & Wake: Pickup to Wake"
    id: pickup_wake_mode
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Docked Only"
    options:
      - "Always On"
      - "Docked Only"
      - "Disabled"
    set_action:
      - lambda: |-
          // apply_power_policy applies the new mode on its next 1 s tick (the select publishes after set_action).
          latter_ui::mark_power_profile_custom_if_manual(id(power_profile_select));
          if (id(display_power_state) == 0) latter_ui::schedule_disp_update(&id(disp1));

  - platform: template
    name: "Sleep & Wake: Tap to Wake"
    id: tap_wake_mode
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Docked Only"
    options:
      - "Always On"
      - "Docked Only"
      - "Disabled"
    set_action:
      - lambda: |-
          latter_ui::mark_power_profile_custom_if_manual(id(power_profile_select));
          latter_ui::schedule_disp_update(&id(disp1));

interval:
  - interval: 1s
    then:
      - lambda: |-
          // 0. Alarm engine (timers_intervals.yaml) shares this tick: one wake a second for both.
          id(alarm_engine_tick).execute();

          // 1. Poll Board PMU Telemetry (AXP2101 VBUS & Battery Charging or Stationary No-Op)
          id(hal_poll_pmu_1s).execute();
          latter_ui::watch_internal_low_water(
              id(ble_ctrl).is_active(), id(mww).is_running(), id(va).is_running(),
              id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_IDLE, id(gui_page));

          // 2. On-Board Wake Word (micro_wake_word) Power & Bus Supervisor
          static bool ww_model_initialized = false;
          if (!ww_model_initialized && millis() > 12000U && id(wifi_ctrl).is_connected()) {
            ww_model_initialized = true;
            id(apply_wake_word_sensitivities).execute();
            id(sync_wake_word_state).execute();
          } else if (millis() > 12500U && !id(va_active) && !id(va_tts_received)) {
            const bool va_busy = id(va).is_running() || !id(va_status_text).empty() ||
                                 id(announcement_mixing_input).is_running();
            const bool media_busy = id(mp_idle_debounce).is_running() || id(va_resume_music_after) ||
                                    id(media_mixing_input).is_running() ||
                                    (id(sendspin_group_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                                    (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                                    (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING);
            const bool alert_or_tool_busy = id(alarm_ringing) || id(timer_ringing) || id(find_my_active) ||
                                            (id(active_game) > 0) ||
                                            latter_ui::cam_call_active() || latter_ui::cam_listen_active() ||
                                            latter_ui::cam_intercom_ptt_active();
            const bool sys_busy = id(is_hibernating) || id(ota_in_progress) ||
                                  !id(wifi_ctrl).is_connected();
            const bool should_ww_run = latter_ui::wake_word_should_run(
                id(va_wake_word_mode).current_option(),
                id(usb_connected).state,
                va_busy, media_busy, alert_or_tool_busy, sys_busy);
            if (should_ww_run != id(mww).is_running()) {
              id(sync_wake_word_state).execute();
            }
          }

          // 3. Voice Assistant Stuck-Open Watchdog (auto-recovers mic/speaker if HA drops mid-session >35s)
          static uint32_t va_stuck_since_ms = 0;
          if (id(va_active) || !id(va_status_text).empty()) {
            if (va_stuck_since_ms == 0) va_stuck_since_ms = millis();
            else if ((millis() - va_stuck_since_ms > 35000U) &&
                     !id(va).is_running() && !id(announcement_mixing_input).is_running()) {
              ESP_LOGW("va", "Voice Assistant watchdog triggered (>35s idle): resetting session & mic");
              va_stuck_since_ms = 0;
              id(cancel_voice_assistant).execute();
            }
          } else {
            va_stuck_since_ms = 0;
          }

          // 4. [PROF:*] Flight Recorder Power & Heap Telemetry
          uint32_t now_1s_ms = millis();
          static uint32_t last_prof_10s_ms = 0;
          static int last_prof_pwr_state = -1;
          if (latter_ui::profiler_enabled() &&
              (id(display_power_state) != last_prof_pwr_state || (now_1s_ms - last_prof_10s_ms >= 10000U))) {
            const char *trig = (id(display_power_state) != last_prof_pwr_state) ? "STATE_CHG" : "10S_TICK";
            last_prof_pwr_state = id(display_power_state);
            last_prof_10s_ms = now_1s_ms;
            latter_ui::log_power_and_mem_profile(
                trig, id(display_power_state), id(usb_connected).state, id(batt_charging).state,
                id(batt_level).state, id(batt_voltage).state, id(speaker_enable).state,
                id(mww).is_running(), id(va_active),
                id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING,
                id(ble_ctrl).is_active(), id(active_game), id(sleep_start_time));
          }

          // 6-7. Single power-policy owner: radio (BLE beacon / Wi-Fi modem sleep), IMU mode,
          // screen-off tick gating, battery polling and the light-sleep awake lock all live in script
          // apply_power_policy.
          id(apply_power_policy).execute();

          // 8. Safe Docked-Idle Background Firmware Update Check (after 3 min uptime, every 6h while on USB & idle)
          static uint32_t last_fw_check_ms = 0;
          if (now_1s_ms > 180000U && id(usb_connected).state && id(wifi_ctrl).is_connected() &&
              (id(display_power_state) != 0) &&
              !id(va_active) && !id(va_tts_received) && !id(ota_in_progress) &&
              (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
              (last_fw_check_ms == 0 || (now_1s_ms - last_fw_check_ms >= 21600000U))) {
            last_fw_check_ms = now_1s_ms;
            id(check_firmware_update).execute();
          }

          // 9. Invariant 1: Sync display_power_state if Display light was turned off externally via HA
          if (id(display_power_state) == 0 && !id(display_brightness).current_values.is_on() &&
              !id(is_hibernating) && !id(ota_in_progress) && (now_1s_ms > 10000U)) {
            id(turn_screen_off).execute();
          }

          // 10. Invariant 2: Auto-exit forgotten Games (>3m untouched) or Battery Flashlight/Level/Camera (>5m untouched)
          uint32_t last_user_act_ms = std::max(latter_ui::last_screen_wake_ms(),
                                               latter_ui::touch_gesture().last_touch_ms);
          if (id(display_power_state) == 0 && (now_1s_ms > last_user_act_ms)) {
            uint32_t touch_idle_ms = now_1s_ms - last_user_act_ms;
            if (id(active_game) > 0 && touch_idle_ms >= 180000U) {
              ESP_LOGI("power", "Game untouched for 3 min: exiting to launcher so screen can sleep");
              id(active_game) = 0;
              id(stop_alarm_sound).execute();
              id(screen_sleep_timer).execute();
            }
            if (!id(usb_connected).state && id(gui_page) == 8 &&
                (id(tools_subpage) == 5 || id(tools_subpage) == 7 || id(tools_subpage) == 12) &&
                touch_idle_ms >= 300000U) {
              ESP_LOGI("power", "Tool untouched on battery for 5 min: exiting to launcher");
              if (id(tools_subpage) == 12) {
                if (latter_ui::cam_call_active() || latter_ui::cam_intercom_ptt_active() || latter_ui::cam_listen_active()) {
                  id(stop_doorbell_call).execute();
                }
                latter_ui::release_art(id(camera_snapshot_art));
              }
              id(tools_subpage) = 0;
              id(sync_display_brightness).execute();
              id(screen_sleep_timer).execute();
            }
          }

          // 11. Invariant 3: Guarantee screen_sleep_timer is armed whenever screen is active
          #if LATTER_IS_STATIONARY
          const bool should_arm_timer = id(docked_screensaver_switch).state &&
                                        (id(screensaver_docked_timeout).current_option() != "Never");
          #else
          const bool should_arm_timer = id(usb_connected).state
              ? (id(screensaver_docked_timeout).current_option() != "Never")
              : (id(display_off_timeout).current_option() != "Never");
          #endif
          if (id(display_power_state) == 0 && should_arm_timer &&
              !id(screen_sleep_timer).is_running() && !id(is_hibernating) && !id(ota_in_progress)) {
            id(screen_sleep_timer).execute();
          }

          // 12. Priority 4: Self-Healing Inactivity Auto-Descent to Hardware Hibernate (Battery Devices Only)
          #if LATTER_HAS_BATTERY
          uint32_t hibernate_timeout_ms = 900000;
          auto st_opt = id(hibernate_timeout_mode).current_option();
          bool auto_sleep_enabled = true;
          if (st_opt == "5 min") hibernate_timeout_ms = 300000;
          else if (st_opt == "10 min") hibernate_timeout_ms = 600000;
          else if (st_opt == "15 min") hibernate_timeout_ms = 900000;
          else if (st_opt == "30 min") hibernate_timeout_ms = 1800000;
          else if (st_opt == "Disabled") auto_sleep_enabled = false;

          const bool hibernate_blockers_active =
              id(is_hibernating) ||
              id(usb_connected).state ||
              id(ota_in_progress) ||
              (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
              id(stopwatch_running) ||
              id(timer_running) ||
              id(timer_ringing) ||
              id(alarm_ringing) ||
              id(find_my_active) ||
              id(va_active) ||
              id(va).is_running() ||
              id(va_tts_received) ||
              id(announcement_mixing_input).is_running() ||
              latter_ui::cam_call_active() ||
              latter_ui::cam_listen_active() ||
              (id(active_game) > 0);

          const bool screen_is_off = (id(display_power_state) == 2) || !id(display_brightness).current_values.is_on();
          if (screen_is_off && !hibernate_blockers_active) {
            if (id(sleep_start_time) == 0) {
              id(sleep_start_time) = now_1s_ms;
            } else if (auto_sleep_enabled && (now_1s_ms - id(sleep_start_time) >= hibernate_timeout_ms)) {
              ESP_LOGI("power", "Inactivity with screen off exceeded %s: starting hibernation countdown", st_opt.c_str());
              id(sleep_start_time) = 0;
              latter_ui::battery_model().hib_reason = latter_ui::HibernateReason::IDLE;
              id(start_hibernation_countdown).execute();
            }
          } else {
            id(sleep_start_time) = 0;
          }
          #endif

  - interval: 50ms
    id: screensaver_anim_tick
    then:
      - lambda: |-
          // High-refresh animation loop for active screensavers (20 FPS idle, ~13.3 FPS during Sendspin audio).
          // The PWR key is a GPIO binary_sensor (board HAL), so no PMU polling happens here.
          if (id(display_power_state) == 1 && !id(va_active) && id(va_status_text).empty() && !id(is_hibernating)) {
            auto s_style = id(screensaver_style_select).current_option();
            if (s_style != "Ambient Clock" && s_style != "Screen Off") {
              const bool local_music_playing =
                  (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
              if (latter_ui::should_step_ambient_anim(millis(), local_music_playing,
                                                      id(va_active) || !id(va_status_text).empty(),
                                                      id(alarm_ringing) || id(timer_ringing) || id(find_my_active))) {
                latter_ui::record_ambient_frame_ms(millis());
                latter_ui::schedule_anim_disp_update(&id(disp1));
              }
            }
          }

script:
  # Single owner for every power-related actuator. The 1 s supervisor runs it, and state transitions
  # (wake, screen off, screensaver, VA start/stop, audio idle, USB change, beacon switch, OTA begin) call it
  # for an immediate re-evaluation. Event sites declare demand (state flags, radio_boost_until_ms) and never
  # touch Wi-Fi power save, the BLE controller, the IMU mode, tick intervals, the light-sleep awake lock or
  # the loop interval directly (latter-verify enforces this).
  - id: apply_power_policy
    mode: restart
    then:
      - lambda: |-
          const uint32_t now_p = millis();

          // Radio: BLE presence beacon and Wi-Fi modem sleep.
          const uint32_t last_interact_ms = std::max(latter_ui::last_screen_wake_ms(),
                                                     latter_ui::touch_gesture().last_touch_ms);
          const bool high_tput_needed =
              id(usb_connected).state ||
              latter_ui::radio_boost_active(now_p) ||
              id(va_active) || id(va).is_running() || id(va_tts_received) ||
              id(announcement_mixing_input).is_running() ||
              (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
              (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING) ||
              (id(display_power_state) == 0 && id(gui_page) == 8 && id(tools_subpage) == 12) ||
              latter_ui::cam_call_active() || latter_ui::cam_listen_active() ||
              (id(display_power_state) == 0 && (now_p - last_interact_ms < 8000U));
          latter_ui::evaluate_radio_policy(
              id(ble_ctrl), id(wifi_ctrl), id(wifi_ctrl).is_connected(), id(ble_area_beacon_switch).state,
              latter_ui::beacon_mode_index(id(ble_beacon_mode_select).current_option()), id(usb_connected).state,
              id(is_hibernating), id(ota_in_progress), id(display_power_state),
              high_tput_needed, now_p);

          // IMU: polled modes with the screen on, hardware Wake-on-Motion with the screen off.
          #if LATTER_HAS_IMU
          if (!id(is_hibernating) && !id(ota_in_progress) && (now_p > 6000U)) {
            auto pw_mode = id(pickup_wake_mode).current_option();
            const bool pw_allowed = (pw_mode == "Always On") ||
                                    (pw_mode == "Docked Only" && id(usb_connected).state);
            if (id(display_power_state) == 0) {
              const bool need_gyro = (id(gui_page) == 3 && id(active_game) >= 1 && id(active_game) <= 4);
              const bool need_accel = pw_allowed ||
                                      (id(gui_page) == 1 && id(home_subpage) == 0) ||
                                      (id(gui_page) == 5) ||
                                      (id(gui_page) == 8 && (id(tools_subpage) == 7 || id(tools_subpage) == 12));
              id(hal_set_imu_power_mode).execute(need_gyro ? 0x03 : (need_accel ? 0x01 : 0x00));
            } else {
              // Poll only during the short qualification window after a WoM event so the
              // RaiseToWakeDetector can confirm a raise.
              id(hal_set_imu_power_mode).execute(!pw_allowed ? 0x00
                  : (latter_ui::imu_wom_qualifying(now_p) ? 0x01 : 0x80));
            }
          }
          #endif

          // Tick gating: with the screen off and nothing time-critical pending, nothing ticks faster than 1 s.
          const bool alerts_pending = id(timer_running) || id(stopwatch_running) || id(find_my_active) ||
                                      id(notif_active) || id(alarm_ringing) || id(timer_ringing);
          const bool va_busy = id(va_active) || !id(va_status_text).empty();
          auto gate = [](auto *tick, bool want, int8_t &state) {
            if (state == (want ? 1 : 0)) return;
            state = want ? 1 : 0;
            if (want) {
              tick->start_poller();
            } else {
              tick->stop_poller();
            }
          };
          static int8_t ss_anim_on = -1, ui_anim_on = -1;
          gate(id(screensaver_anim_tick), id(display_power_state) == 1, ss_anim_on);
          gate(id(ui_anim_tick), id(display_power_state) == 0 || va_busy, ui_anim_on);
          // ui_fast_tick: 250 ms with the screen on or a voice turn; 1 s with the screen off while a timer,
          // stopwatch or alert is pending (a countdown still expires within a second); stopped otherwise.
          static uint32_t ui_fast_ms = UINT32_MAX;
          const uint32_t want_fast_ms = (id(display_power_state) != 2 || va_busy) ? 250U : (alerts_pending ? 1000U : 0U);
          if (want_fast_ms != ui_fast_ms) {
            ui_fast_ms = want_fast_ms;
            if (want_fast_ms == 0U) {
              id(ui_fast_tick).stop_poller();
            } else {
              id(ui_fast_tick).set_update_interval(want_fast_ms);
              id(ui_fast_tick).start_poller();
            }
          }

          // Automatic light sleep (boards whose HAL declares power_management with enable_light_sleep;
          // include/hal_power_pm.h). The awake lock keeps the chip out of light sleep except in screen-off
          // quiet on battery; while it is released the light-sleep wake pins below arm and the main loop
          // interval stretches. latter_ui::pm_apply is called only here (latter-verify enforces).
          const bool audio_busy = id(speaker_enable).state || id(mww).is_running() ||
                                  id(announcement_mixing_input).is_running() || id(mp_idle_debounce).is_running() ||
                                  (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                                  (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING);
          // Home Assistant link: awake until Home Assistant (a client with a state subscription; log viewers don't count) is connected, and for 60 s after it connects
          // (entity list, state subscription and device hello run at full speed). A dropped link wakes the
          // chip to reconnect: light sleep never runs while Home Assistant can't reach the device.
          const bool api_connected = esphome::api::global_api_server != nullptr &&
                                     esphome::api::global_api_server->is_connected_with_state_subscription();
          const bool ha_link_settling =
              !api_connected || (now_p - latter_ui::link_state().last_ha_connect_ms < 60000U);
          // Weak Wi-Fi: Home Assistant's link drops in light sleep at weak RSSI (hal_link_report.h,
          // kWeakLinkEnterDbm), so a weak link keeps the chip awake until the v3 fix.
          const bool weak_link = latter_ui::weak_link_update(now_p);
          const bool stay_awake =
              ha_link_settling || weak_link ||
              id(display_power_state) != 2 || id(usb_connected).state || id(is_hibernating) ||
              id(ota_in_progress) || audio_busy || va_busy || id(va).is_running() || id(va_tts_received) ||
              latter_ui::radio_boost_active(now_p) || (id(active_game) > 0) ||
              id(alarm_ringing) || id(timer_ringing) || id(find_my_active) || id(notif_active) ||
              latter_ui::cam_call_active() || latter_ui::cam_listen_active();
          // PWR key and action button always wake; touch only where a screen-off tap wakes on battery;
          // IMU INT1 while hardware Wake-on-Motion is armed.
          uint32_t wake_mask = latter_ui::pm_wake_bit(latter_ui::PM_WAKE_PWR_KEY) |
                               latter_ui::pm_wake_bit(latter_ui::PM_WAKE_ACTION_BTN);
          auto tw_mode = id(tap_wake_mode).current_option();
          if (tw_mode == "Always On") wake_mask |= latter_ui::pm_wake_bit(latter_ui::PM_WAKE_TOUCH);
          #if LATTER_HAS_IMU
          if (latter_ui::imu_wom().armed) wake_mask |= latter_ui::pm_wake_bit(latter_ui::PM_WAKE_IMU);
          latter_ui::pm_note_imu(latter_ui::imu_wom().armed, latter_ui::imu_wom().events);
          #endif
          latter_ui::pm_apply(stay_awake, wake_mask);

  # Return the display to its pre-voice-session state (see latter_ui::VaDisplayRestore).
  - id: va_restore_display
    mode: restart
    then:
      # Let a music resume settle first (turn_screen_off tears audio down when nothing is playing yet).
      - wait_until:
          condition:
            lambda: 'return !id(resume_music_after_va).is_running();'
          timeout: 4s
      - delay: 1500ms
      - lambda: |-
          auto &r = latter_ui::va_display_restore();
          const int prior = r.armed ? r.prior_state : 0;
          const bool touched = r.touched_since_start(latter_ui::touch_gesture().last_touch_ms);
          r.armed = false;
          const bool alert_up = id(alarm_ringing) || id(timer_ringing) || id(find_my_active) || id(notif_active);
          if (alert_up || touched || prior == 0 || id(display_power_state) != 0 || id(is_hibernating)) {
            id(screen_sleep_timer).execute();
            return;
          }
          if (prior == 1) {
            id(enter_standby_state).execute();  // screensaver if still allowed (docked, style), else off
          } else {
            id(turn_screen_off).execute();
          }

  - id: trigger_screensaver_now
    mode: restart
    then:
      - script.stop: screen_sleep_timer
      - lambda: |-
          auto s_style = id(screensaver_style_select).current_option();
          if (s_style == "Screen Off") {
            id(turn_screen_off).execute();
            return;
          }
          latter_ui::screen_is_off_standby() = false;
          id(disp1).start_poller();
          id(display_power_state) = 1; // SCREENSAVER
          id(sleep_start_time) = 0;
          latter_ui::record_ambient_frame_ms(millis());
          id(apply_power_policy).execute();
          id(display_brightness).turn_on().set_brightness(latter_ui::kScreensaverBrightness).perform();
          latter_ui::schedule_disp_update(&id(disp1));

  - id: turn_screen_off
    mode: restart
    then:
      - script.stop: screen_sleep_timer
      - lambda: |-
          id(display_power_state) = 2; // SCREEN_OFF
          id(sleep_start_time) = millis();
          id(active_game) = 0;
          if (latter_ui::cam_call_active() || latter_ui::cam_intercom_ptt_active() || latter_ui::cam_listen_active()) {
            id(stop_doorbell_call).execute();
          }
          id(disp1).update(); // Flush single all-black frame before cutting panel brightness
          latter_ui::screen_is_off_standby() = true;
          id(disp1).stop_poller();
          id(display_brightness).turn_off().perform();

          const bool local_audio_playing = (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          auto ww_mode = id(va_wake_word_mode).current_option();
          const bool ww_active = (ww_mode == "Always On") || (ww_mode == "Docked Only" && id(usb_connected).state);

          id(sync_wake_word_state).execute();

          if (!local_audio_playing) {
            id(hal_set_dac_mute).execute(true);
            id(speaker_enable).turn_off();
            id(route_i2s_to_mic).execute();
            if (!ww_active) {
              id(hal_set_audio_codecs_standby).execute(true);
            }
          }
          id(apply_power_policy).execute();

  - id: enter_standby_state
    mode: restart
    then:
      - lambda: |-
          auto s_style = id(screensaver_style_select).current_option();
          bool screensaver_allowed = id(usb_connected).state &&
                                     id(docked_screensaver_switch).state &&
                                     (s_style != "Screen Off");
          if (screensaver_allowed) {
            latter_ui::screen_is_off_standby() = false;
            id(disp1).start_poller();
            id(display_power_state) = 1; // SCREENSAVER
            id(sleep_start_time) = 0;
            latter_ui::record_ambient_frame_ms(millis());
            id(apply_power_policy).execute();
            id(display_brightness).turn_on().set_brightness(latter_ui::kScreensaverBrightness).perform();
            if (s_style == "Ambient Clock") {
              latter_ui::schedule_disp_update(&id(disp1));
            }
          } else {
            #if !LATTER_IS_STATIONARY
            id(turn_screen_off).execute();
            #endif
          }

  - id: wake_to_active_state
    mode: restart
    then:
      - lambda: |-
          if (id(display_power_state) != 0 || !id(display_brightness).current_values.is_on()) {
            latter_ui::record_screen_wake();
          }
          latter_ui::screen_is_off_standby() = false;
          latter_ui::last_screen_wake_ms() = millis();
          latter_ui::raise_to_wake().reset();
          id(sleep_start_time) = 0;
          id(display_power_state) = 0; // ACTIVE
          id(disp1).start_poller();
          id(apply_power_policy).execute();  // full-throughput Wi-Fi (fresh interaction), beacon, IMU, ticks
          // Codec power follows audio demand, not screen state: route_i2s_to_spk / sync_wake_word_state /
          // voice entry points wake the codecs when audio actually starts.
          if (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING && !id(speaker_enable).state) {
            id(route_i2s_to_spk).execute();
          }
          const std::string &art_u = latter_ui::media_state().art_url;
          if (id(gui_page) == 2 &&
              (!latter_ui::media_state().is_local || id(album_art).get_width() == 0) &&
              !art_u.empty() &&
              art_u != id(current_loaded_art_url)) {
            id(fetch_remote_art_debounced).execute();
          }
          const std::string &wp_u = latter_ui::area_ctx_state().wallpaper_url;
          if (!wp_u.empty() &&
              wp_u != id(current_loaded_wallpaper_url)) {
            id(fetch_wallpaper_debounced).execute();
          }
      - script.execute: sync_display_brightness
      - script.execute: screen_sleep_timer
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'

  - id: start_instant_hibernation
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return LATTER_HAS_BATTERY != 0;'
          then:
            - lambda: |-
                latter_ui::screen_is_off_standby() = false;
                id(disp1).start_poller();
                id(sleep_start_time) = 0;
                id(hibernate_countdown_val) = 0;
                id(is_hibernating) = true;
                id(active_game) = 0;
                id(display_power_state) = 0;
            - micro_wake_word.stop:
            - voice_assistant.stop:
            - media_player.pause: latter_media_player
            - lambda: 'id(hal_set_dac_mute).execute(true);'
            - switch.turn_off: speaker_enable
            - script.stop: screen_sleep_timer
            - light.turn_on: display_brightness
            - script.execute: sync_display_brightness
            - component.update: disp1
            - delay: 1000ms
            - script.execute: enter_deep_sleep

  - id: start_hibernation_countdown
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return LATTER_HAS_BATTERY != 0;'
          then:
            - lambda: |-
                latter_ui::screen_is_off_standby() = false;
                id(disp1).start_poller();
                id(sleep_start_time) = 0;
                id(hibernate_countdown_val) = 5;
                id(is_hibernating) = true;
                id(active_game) = 0;
                id(display_power_state) = 0;
            - micro_wake_word.stop:
            - voice_assistant.stop:
            - media_player.pause: latter_media_player
            - lambda: 'id(hal_set_dac_mute).execute(true);'
            - switch.turn_off: speaker_enable
            - script.stop: screen_sleep_timer
            - light.turn_on: display_brightness
            - script.execute: sync_display_brightness
            - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
            - repeat:
                count: 5
                then:
                  - delay: 1000ms
                  - if:
                      condition:
                        lambda: 'return id(is_hibernating);'
                      then:
                        - lambda: |-
                            if (id(hibernate_countdown_val) > 1) {
                              id(hibernate_countdown_val)--;
                              latter_ui::schedule_disp_update(&id(disp1));
                            }
                  - if:
                      condition:
                        lambda: 'return !id(is_hibernating);'
                      then:
                        - script.stop: start_hibernation_countdown
            - if:
                condition:
                  lambda: 'return id(is_hibernating);'
                then:
                  - lambda: 'id(hibernate_countdown_val) = 0;'
                  - script.execute: enter_deep_sleep

  - id: enter_deep_sleep
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return LATTER_HAS_BATTERY != 0;'
          then:
            - lambda: |-
                id(sleep_start_time) = 0;
                id(hibernate_countdown_val) = 0;
                id(active_game) = 0;
                id(is_hibernating) = true;
                id(display_power_state) = 0;
            - micro_wake_word.stop:
            - voice_assistant.stop:
            - media_player.pause: latter_media_player
            - lambda: 'id(hal_set_dac_mute).execute(true);'
            - switch.turn_off: speaker_enable
            - script.stop: screen_sleep_timer
            - light.turn_on: display_brightness
            - script.execute: sync_display_brightness
            - component.update: disp1
            - script.execute: hal_wait_pwr_key_release
            - script.wait: hal_wait_pwr_key_release
            - delay: 500ms
            - lambda: |-
                id(is_hibernating) = false;
                id(display_power_state) = 2;
            - light.turn_off: display_brightness
            - component.update: disp1
            - lambda: |-
                esphome::voice_assistant::clean_disconnect_api_before_hibernate(id(va));
            - delay: 250ms
            - safe_mode.mark_successful:
            - script.execute: hal_enter_hardware_hibernate

  - id: screen_sleep_timer
    mode: restart
    then:
      - delay: !lambda |-
          if (id(usb_connected).state) {
            auto ss_to = id(screensaver_docked_timeout).current_option();
            if (ss_to == "10s") return 10000;
            if (ss_to == "15s") return 15000;
            if (ss_to == "30s") return 30000;
            if (ss_to == "1 min") return 60000;
            if (ss_to == "2 min") return 120000;
            if (ss_to == "5 min") return 300000;
            if (ss_to == "Never") return 86400000;
            return 60000;
          }
          auto opt = id(display_off_timeout).current_option();
          if (opt == "10s") return 10000;
          if (opt == "15s") return 15000;
          if (opt == "30s") return 30000;
          if (opt == "1 min") return 60000;
          if (opt == "2 min") return 120000;
          if (opt == "Never") return 86400000;
          return 30000;
      - if:
          condition:
            lambda: |-
              #if LATTER_IS_STATIONARY
              if (!id(docked_screensaver_switch).state) return false;
              if (id(screensaver_docked_timeout).current_option() == "Never") return false;
              #else
              if (id(usb_connected).state) {
                if (id(screensaver_docked_timeout).current_option() == "Never") return false;
              } else {
                if (id(display_off_timeout).current_option() == "Never") return false;
              }
              #endif
              const bool active_tool_awake =
                  (id(gui_page) == 8 && (id(tools_subpage) == 5 || id(tools_subpage) == 7 || id(tools_subpage) == 12));
              const uint32_t since_touch_ms = millis() - std::max(latter_ui::last_screen_wake_ms(),
                                                                  latter_ui::touch_gesture().last_touch_ms);
              const bool in_hand_hold = (since_touch_ms < 90000U) &&
                  latter_ui::should_in_hand_block_sleep(!id(usb_connected).state && !id(speaker_enable).state && id(pickup_detected).state);
              return !id(ota_in_progress) &&
                     !id(va_active) &&
                     !id(va).is_running() &&
                     !id(va_tts_received) &&
                     !id(announcement_mixing_input).is_running() &&
                     !id(stopwatch_running) &&
                     !id(timer_ringing) &&
                     !id(alarm_ringing) &&
                     !id(find_my_active) &&
                     !id(notif_active) &&
                     !in_hand_hold &&
                     !active_tool_awake &&
                     (id(active_game) == 0);
          then:
            - script.execute: enter_standby_state
          else:
            - if:
                condition:
                  lambda: |-
                    #if LATTER_IS_STATIONARY
                    if (!id(docked_screensaver_switch).state) return false;
                    if (id(screensaver_docked_timeout).current_option() == "Never") return false;
                    #else
                    if (id(usb_connected).state) {
                      if (id(screensaver_docked_timeout).current_option() == "Never") return false;
                    } else {
                      if (id(display_off_timeout).current_option() == "Never") return false;
                    }
                    #endif
                    return (id(display_power_state) == 0);
                then:
                  - delay: 2s
                  - script.execute: screen_sleep_timer
