# ==============================================================================
# Latter Core Umbrella Module: Full Display + Audio + Touch Firmware
# (modules/latter_display_firmware.yaml)
# Single entry point included by devices/*.yaml. Composes on top of
# modules/latter_display_only_firmware.yaml (logger, safe_mode, system_core,
# system_ui_sync, power_policy, sleep_lifecycle, motion_service,
# display_pipeline, timers_and_fetchers, guis/universal/gui) and adds
# full-duplex audio, Voice Assistant, and capacitive touch input.
# ==============================================================================

# Board-specific substitutions (art_resize, sendspin_art_resize,
# sendspin_buffer_size, announcement_buffer_size, mww_internal_ram, audio_*,
# api_reboot_timeout) and typed `latter_core:` hardware traits live strictly in boards/*.yaml.

packages:
  latter_display_base:    !include latter_display_only_firmware.yaml
  latter_audio_pipeline:  !include audio_pipeline.yaml
  latter_voice_assistant: !include voice_assistant.yaml
  latter_audio_scripts:   !include audio_scripts.yaml
  latter_gui_touch:       !include ../guis/universal/gui_touch.yaml
