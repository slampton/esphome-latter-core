          latter_actions::emit_set_active_speaker(m.active_speaker_entity, false);
          latter_ui::release_art(id(remote_album_art));
          latter_ui::schedule_disp_update(&id(disp1));

  - id: send_doorbell_intercom_cmd
    mode: restart
    then:
      - lambda: |-
          auto &ic = latter_ui::runtime_state().intercom;
          const auto &ac = latter_ui::area_ctx_state();
          const std::string cam_ent = latter_ui::resolve_active_carousel_camera_id(
              ac.cameras_summary, ac.camera_snapshot_url);
          latter_actions::emit_doorbell_intercom(
              ic.cam_action, cam_ent, latter_ui::cam_carousel_idx(),
              ic.cam_message, ic.cam_noise_reduction, ic.cam_code);
