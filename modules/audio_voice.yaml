# ==============================================================================
# Latter Core Module: Audio Pipeline, Sendspin, Wake Word & Voice Assistant
# (modules/audio_voice.yaml)
# Hardware I2S & Codecs defined in boards/*.yaml + modules/hal/audio_*.yaml.
# Zero YAML globals: reads/writes latter_ui::runtime_state() and calls typed RPC
# helpers in latter_actions.h.
# ==============================================================================

substitutions:
  announcement_buffer_s: "1"

# FLAC decoder (microFLAC) buffers in PSRAM
audio:
  codecs:
    flac:
      buffer_memory: psram

speaker:
  - id: mixing_speaker
    platform: mixer
    output_speaker: physical_speaker
    num_channels: ${audio_out_channels}
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        buffer_duration: ${announcement_buffer_s}s
        timeout: 500ms
      - id: media_mixing_input
        timeout: 1500ms
      # Chimes, alarms and game sounds (latter_sound_player): their own input, so they duck and drain
      # independently of TTS and music.
      - id: sound_mixing_input
        buffer_duration: 500ms
        timeout: 500ms

# No sample-rate conversion on the device: every source arrives at ${audio_out_rate} (Sendspin's
# sample_rate, the speaker_source pipelines' preferred format for Home Assistant, the sounds rendered
# per rate by tools/gen_sounds.py), and the mixer folds stereo to the panel's ${audio_out_channels}
# channel(s). The full-duplex speaker accepts no other format.
#
# Sounds are embedded WAV files (no decode cost) for this board's ${audio_out_rate}. ESPHome's rtttl
# synthesizes at a fixed 16 kHz, so it cannot feed a 48 kHz mixer.
audio_file:
  - id: sound_alarm
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/alarm.wav
  - id: sound_find_my
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/find_my.wav
  - id: sound_sfx_1
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_1.wav
  - id: sound_sfx_2
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_2.wav
  - id: sound_sfx_3
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_3.wav
  - id: sound_sfx_4
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_4.wav
  - id: sound_sfx_5
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_5.wav
  - id: sound_sfx_6
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_6.wav
  - id: sound_sfx_7
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_7.wav
  - id: sound_sfx_8
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_8.wav
  - id: sound_sfx_9
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_9.wav
  - id: sound_sfx_10
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_10.wav
  - id: sound_sfx_11
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_11.wav
  - id: sound_sfx_12
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_12.wav
  - id: sound_sfx_13
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_13.wav
  - id: sound_sfx_14
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_14.wav

# Internal RAM is the scarce resource on the S3 boards (measured with System: Log Memory Report), so the
# Sendspin hub's protocol, artwork and HTTP-server stacks live in PSRAM: they stay allocated whenever
# Music Assistant is connected, even when nothing plays. The wake-word and I2S speaker tasks keep their
# internal stacks for timing.
sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

media_source:
  - platform: audio_http
    id: http_announcement_source
    buffer_size: ${announcement_buffer_size}
    task_stack_in_psram: true  # reader (6 KB with TLS 1.3) + decoder stacks persist after the first TTS

  - platform: sendspin
    id: sendspin_source
    task_stack_in_psram: true
    decode_memory: psram
    buffer_size: ${sendspin_buffer_size}
    sample_rate: ${audio_out_rate}  # Music Assistant converts server-side; the device never resamples

  - platform: audio_file
    id: sound_file_source
    task_stack_in_psram: true

media_player:
  # Internal player for the embedded sounds. Declared before latter_media_player: every speaker_source
  # player applies its volume to physical_speaker at setup, and the music volume must be the one left.
  # Each sound path sets the DAC level itself before playing.
  - platform: speaker_source
    id: latter_sound_player
    internal: true
    volume_initial: 100%
    media_pipeline:
      format: WAV
      num_channels: ${audio_out_channels}
      sample_rate: ${audio_out_rate}
      speaker: sound_mixing_input
      sources:
        - sound_file_source

  - platform: sendspin
    id: sendspin_group_media_player
    on_state:
      then:
        - lambda: |-
            static int last_ss_state = -1;
            int cur_ss = static_cast<int>(id(sendspin_group_media_player).state);
            if (cur_ss == static_cast<int>(media_player::MEDIA_PLAYER_STATE_PLAYING)) {
              if (id(mww).is_running()) {
                id(mww).stop();
              }
            } else if (last_ss_state == static_cast<int>(media_player::MEDIA_PLAYER_STATE_PLAYING)) {
              id(mp_idle_debounce).execute();
            }
            last_ss_state = cur_ss;

  - platform: speaker_source
    id: latter_media_player
    name: "Music"
    announcement_pipeline:
      format: FLAC
      num_channels: ${audio_out_channels}
      sample_rate: ${audio_out_rate}
      speaker: announcement_mixing_input
      sources:
        - http_announcement_source
    media_pipeline:
      format: FLAC
      num_channels: ${audio_out_channels}
      sample_rate: ${audio_out_rate}
      speaker: media_mixing_input
      sources:
        - sendspin_source
    volume_initial: 60%
    volume_increment: 5%
    volume_min: 10%
    volume_max: 100%
    on_state:
      then:
        - lambda: |-
            auto &rs = latter_ui::runtime_state();
            static int last_mp_state = -1;
            static float last_mp_vol = -1.0f;
            int cur_st = static_cast<int>(id(latter_media_player).state);
            float v = id(latter_media_player).volume;
            bool vol_valid = !std::isnan(v) && v > 0.0f;
            bool state_changed = (cur_st != last_mp_state);
            bool vol_changed = vol_valid && (last_mp_vol < 0.0f || std::fabs(v - last_mp_vol) >= 0.005f);
            if (!rs.alarms.ringing && !rs.timers.ringing && !rs.alarms.find_my_active &&
                !rs.voice.active && !rs.voice.tts_received &&
                id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING) {
              if (vol_valid && (vol_changed || state_changed)) {
                id(physical_speaker).set_volume(latter_ui::media_dac_volume(v));
              }
            }
            if (vol_changed && latter_ui::speaker_volume_boot_synced()) {
              float pct = std::clamp(std::round(v * 100.0f), 10.0f, 100.0f);
              const uint8_t pct_u8 = static_cast<uint8_t>(std::lround(pct));
              if (latter_ui::persisted_prefs().speaker_volume_pct != pct_u8) {
                latter_ui::persisted_prefs().speaker_volume_pct = pct_u8;
                latter_ui::schedule_persisted_prefs_save(millis());
              }
              const uint32_t now_v_ms = millis();
              if (last_mp_vol >= 0.0f && latter_ui::media_state().is_local &&
                  (now_v_ms - rs.music.feedback_timer > 150U)) {
                rs.music.action_feedback = "Volume: " + std::to_string(static_cast<int>(std::lround(pct))) + "%";
                rs.music.feedback_timer = now_v_ms;
              }
            }
            if (state_changed) {
              latter_ui::sync_audio_session_media_observation(
                  cur_st == static_cast<int>(media_player::MEDIA_PLAYER_STATE_PLAYING),
                  cur_st == static_cast<int>(media_player::MEDIA_PLAYER_STATE_PAUSED),
                  millis());
            }
            if (state_changed || vol_changed) {
              last_mp_state = cur_st;
              if (vol_valid) last_mp_vol = v;
              if ((rs.nav.gui_page == 2 || (state_changed && rs.nav.gui_page == 1)) &&
                  rs.nav.display_power_state == 0 && !rs.voice.active) {
                id(throttled_disp_update).execute();
              }
            }
    on_announcement:
      then:
        - if:
            condition:
              lambda: 'return latter_ui::cam_intercom_ptt_active();'
            then:
              - media_player.stop:
                  id: latter_media_player
                  announcement: true
            else:
              - script.stop: mp_idle_debounce
              - script.stop: sync_wake_word_state
              - script.stop: va_echo_gate
              - script.stop: mute_speaker_path
              - script.stop: screen_sleep_timer
              - mixer_speaker.apply_ducking:
                  id: media_mixing_input
                  decibel_reduction: 50
                  duration: 0.1s
              - mixer_speaker.apply_ducking:
                  id: announcement_mixing_input
                  decibel_reduction: 0
                  duration: 0.05s
              - script.execute: enable_speaker_path
              - script.wait: enable_speaker_path
              - lambda: |-
                  auto &rs = latter_ui::runtime_state();
                  if (!latter_ui::cam_call_active() && !latter_ui::cam_listen_active()) {
                    rs.voice.tts_received = true;
                  }
                  if (rs.voice.active) {
                    id(latter_mic).set_mute_state(true);
                    rs.voice.vad_active = false;
                    rs.voice.status_text = "Responding...";
                  }
              - if:
                  condition:
                    lambda: 'return id(media_mixing_input).is_running();'
                  then:
                    - delay: 500ms
              - lambda: |-
                  id(physical_speaker).set_volume(latter_ui::voice_output_volume(id(latter_media_player).volume));
                  id(hal_set_dac_mute).execute(false);
              - script.execute: throttled_disp_update
              - script.execute: announce_stall_check
              - if:
                  condition:
                    lambda: |-
                      return !latter_ui::runtime_state().voice.active &&
                             !latter_ui::cam_call_active() &&
                             !latter_ui::cam_listen_active();
                  then:
                    - script.execute: finish_announcement
    on_play:
      then:
        - if:
            condition:
              lambda: |-
                const auto &v = latter_ui::runtime_state().voice;
                return !v.active && !v.tts_received;
            then:
              - lambda: |-
                  auto &rs = latter_ui::runtime_state();
                  const uint32_t now_play_ms = millis();
                  rs.music.pos_sync_time = now_play_ms;
                  if (latter_ui::media_state().is_local) {
                    latter_ui::media_state().state = "playing";
                  }
                  latter_ui::sync_audio_session_media_observation(true, false, now_play_ms);
                  const bool alert_ring = rs.alarms.ringing || rs.timers.ringing || rs.alarms.find_my_active || rs.alert.active;
                  const bool ota_or_hib = rs.nav.ota_in_progress || rs.nav.is_hibernating;
                  const int start_page = latter_ui::resolve_start_screen_page();
                  if (latter_ui::audio_session().should_auto_open_music_page(
                          rs.nav.gui_page, latter_ui::persisted_prefs().home_screen_enabled,
                          start_page, alert_ring, now_play_ms, ota_or_hib)) {
                    rs.nav.gui_page = 2; // Auto-switch to Music Player screen on explicit/new music playback start
                  }
                  rs.nav.sleep_start_time = 0;
                  if (rs.nav.gui_page == 2) {
                    rs.nav.active_game = 0;
                  }
              - script.stop: mp_idle_debounce
              - script.stop: sync_wake_word_state
              - script.stop: va_echo_gate
              - script.stop: mute_speaker_path
              - if:
                  condition:
                    lambda: |-
                      const auto &rs = latter_ui::runtime_state();
                      return !rs.alarms.ringing && !rs.timers.ringing && !rs.alarms.find_my_active;
                  then:
                    - mixer_speaker.apply_ducking:
                        id: media_mixing_input
                        decibel_reduction: 0
                        duration: 0.2s
                    - mixer_speaker.apply_ducking:
                        id: announcement_mixing_input
                        decibel_reduction: 50
                        duration: 0.1s
                    - lambda: |-
                        float v = id(latter_media_player).volume;
                        if (std::isnan(v) || v <= 0.0f) v = 0.60f;
                        id(physical_speaker).set_volume(latter_ui::media_dac_volume(v));
              - if:
                  condition:
                    lambda: 'return !id(speaker_enable).state || !id(physical_speaker).is_running();'
                  then:
                    - script.execute: enable_speaker_path
                    - script.wait: enable_speaker_path
              - lambda: 'id(hal_set_dac_mute).execute(false);'
              - if:
                  condition:
                    lambda: |-
                      return latter_ui::runtime_state().nav.display_power_state != 0 ||
                             !id(display_brightness).remote_values.is_on();
                  then:
                    - lambda: |-
                        latter_ui::screen_is_off_standby() = false;
                        latter_ui::runtime_state().nav.display_power_state = 0;
                        id(apply_power_policy).execute();
                    - light.turn_on: display_brightness
              - lambda: |-
                  const auto &rs = latter_ui::runtime_state();
                  const std::string &art_u = latter_ui::media_state().art_url;
                  if (rs.nav.gui_page == 2 &&
                      (!latter_ui::media_state().is_local || id(album_art).get_width() == 0) &&
                      !art_u.empty() &&
                      art_u != rs.music.loaded_art_url) {
                    id(fetch_remote_art_debounced).execute();
                  }
              - script.execute: screen_sleep_timer
              - script.execute: throttled_disp_update
              - script.execute: sync_wake_word_state
    on_pause:
      then:
        - lambda: |-
            auto &rs = latter_ui::runtime_state();
            const uint32_t now_pause_ms = millis();
            latter_ui::audio_session().note_local_playback_stopped();
            if (latter_ui::media_state().is_local &&
                (latter_ui::media_state().state == "playing" || latter_ui::media_state().state == "buffering")) {
              latter_ui::media_state().state = "paused";
            }
            latter_ui::sync_audio_session_media_observation(false, true, now_pause_ms);
            if (rs.music.pos_sync_time > 0) {
              rs.music.pos_base += (now_pause_ms - rs.music.pos_sync_time) / 1000.0f;
              rs.music.pos_sync_time = 0;
            }
            if (rs.nav.display_power_state == 0) {
              id(screen_sleep_timer).execute();
            }
        - script.execute: mp_pause_settle
    on_idle:
      then:
        - if:
            condition:
              lambda: |-
                const auto &v = latter_ui::runtime_state().voice;
                return v.active || v.tts_received || !v.status_text.empty();
            then:
              - script.execute: va_tts_drain_and_finish
        - lambda: |-
            const uint32_t now_idle_ms = millis();
            const auto &ms = latter_ui::media_state();
            if (!ms.is_local ||
                (ms.state != "playing" && ms.state != "buffering" &&
                 id(sendspin_group_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING)) {
              latter_ui::audio_session().note_local_playback_stopped();
            }
            latter_ui::sync_audio_session_media_observation(false, false, now_idle_ms);
            if (latter_ui::runtime_state().nav.display_power_state == 0) {
              id(screen_sleep_timer).execute();
            }
        - script.execute: mp_idle_debounce

micro_wake_word:
  id: mww
  microphone:
    microphone: latter_mic
    channels: 0
    gain_factor: 2
  task_stack_in_psram: false
  prefer_internal_ram: ${mww_internal_ram}  # board trait: arena + weights in internal RAM where there is headroom
  ring_buffer_duration: 500ms
  stop_after_detection: true
  # Every model is vendored byte-for-byte in models/ (see models/README.md) from upstream
  # esphome/micro-wake-word-models and loaded via https URL so ESPHome re-validates newly added models
  # without stale github:// clone cache hits.
  # SHA-256 (first 32 hex): okay_nabu json=6DD65604F70FE5EA9D1AF73A7BF23952 tflite=0689ABE1912A95A3318A0D8CB2E67BAD,
  # hey_jarvis json=B153867D818675D8ABCC9DACE474AFE7 tflite=21A7976ADD39EE24EC96C63D96B7AAA1,
  # hey_mycroft json=57B2B06FE5FDBBE834A242FABC7AF31E tflite=C2A9B6ED51182DB72E014781D5A4ECE1,
  # alexa json=1D999798B35B1FE2606465B75AB840BE tflite=9011A8155B04DE858C48038529235CBC,
  # vad json=BD8C9CD4350814F761E651685AE5196E tflite=7AA4DB6D5FB7C5358609F6931E7847D3,
  # hey_luna json=4A3618E366B28A82C7AFADC8E54CA726 tflite=18A56BA916A5C7ADFF1D5D4F594EAADF.
  vad:
    model: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/models/vad.json
  models:
    - model: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/models/okay_nabu.json
      id: okay_nabu
    - model: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/models/hey_luna.json
      id: hey_luna
    - model: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/models/hey_jarvis.json
      id: hey_jarvis
    - model: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/models/hey_mycroft.json
      id: hey_mycroft
    - model: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/models/alexa.json
      id: alexa
  on_wake_word_detected:
    then:
      - lambda: |-
          latter_ui::runtime_state().voice.last_detected_wake_word = wake_word;
          ESP_LOGI("mww", "On-board wake word detected: %s", wake_word.c_str());
      - script.execute: trigger_va_from_wake_word

voice_assistant:
  id: va
  microphone:
    microphone: latter_mic
    gain_factor: 2
  micro_wake_word: mww
  use_wake_word: false
  media_player: latter_media_player
  noise_suppression_level: 2
  auto_gain: 31dBFS
  on_client_connected:
    then:
      - delay: 200ms
      - script.execute: apply_wake_word_sensitivities
      - script.execute: sync_wake_word_state
  on_listening:
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          latter_ui::log_audio_profile("VA_LISTEN_START");
          id(apply_power_policy).execute();  // va.is_running(): full-throughput Wi-Fi while streaming
          if (!latter_ui::cam_intercom_ptt_active()) {
            rs.voice.intercom_turn = false;
            if (!rs.voice.active) {
              rs.voice.return_page = rs.nav.gui_page;
              rs.voice.active = true;
            }
          }
      - if:
          condition:
            lambda: |-
              const auto &rs = latter_ui::runtime_state();
              return !latter_ui::cam_intercom_ptt_active() &&
                     !rs.voice.resume_music_after &&
                     ((id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                      (!rs.music.active_speaker_entity.empty() && latter_ui::media_state().state == "playing"));
          then:
            - script.execute: pause_all_music
            - delay: 150ms
      - script.stop: mp_idle_debounce
      - script.stop: screen_sleep_timer
      - if:
          condition:
            lambda: |-
              return id(latter_mic).get_mute_state() || id(announcement_mixing_input).is_running() ||
                     id(sound_mixing_input).is_running() || id(physical_speaker).has_buffered_data();
          then:
            - script.execute: va_echo_gate
          else:
            - script.execute: mute_speaker_path
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 0
          duration: 0.1s
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          if (!id(mww).is_running()) {
            id(hal_set_audio_codecs_standby).execute(false);
          }
          rs.voice.was_cancelled = false;
          rs.voice.vad_active = false;
          rs.voice.tts_received = false;
          if (latter_ui::cam_intercom_ptt_active()) {
            latter_ui::audio_session().note_va_phase(latter_ui::AudioSessionPhase::DoorbellIntercom);
            rs.voice.status_text = "";
            latter_ui::cam_intercom_status() = "CALL • SPEAK NOW";
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          latter_ui::audio_session().note_va_phase(latter_ui::AudioSessionPhase::VaListening);
          id(va_restore_display).stop();
          const bool wake_scr = latter_ui::persisted_prefs().wake_screen_on_assist;
          latter_ui::va_display_restore().capture(rs.nav.display_power_state,
              id(display_brightness).current_values.is_on(), millis(), false);
          if (rs.nav.display_power_state != 0 && wake_scr) {
            latter_ui::screen_is_off_standby() = false;
            rs.nav.display_power_state = 0;
            id(disp1).start_poller();
            id(apply_power_policy).execute();
            id(sync_display_brightness).execute();
          }
          rs.voice.status_text = "Listening...";
          ESP_LOGD("va", "Status: Listening...");
          if (rs.nav.display_power_state == 0 || wake_scr) {
            id(display_brightness).turn_on().perform();
            latter_ui::schedule_disp_update(&id(disp1));
          }
      - script.execute: sync_wake_word_state
  on_stt_vad_start:
    then:
      - script.stop: screen_sleep_timer
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          latter_ui::log_audio_profile("VA_VAD_START");
          rs.voice.vad_active = true;
          if (latter_ui::cam_intercom_ptt_active()) {
            latter_ui::cam_intercom_status() = "CAPTURING VOICE...";
          } else {
            rs.voice.status_text = "Listening...";
          }
          ESP_LOGD("va", "Status: Listening (VAD active)...");
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  on_stt_vad_end:
    then:
      - script.stop: screen_sleep_timer
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          latter_ui::log_audio_profile("VA_VAD_END");
          rs.voice.vad_active = false;
          if (latter_ui::cam_intercom_ptt_active()) {
            latter_ui::cam_intercom_status() = "PROCESSING AUDIO...";
          } else {
            latter_ui::audio_session().note_va_phase(latter_ui::AudioSessionPhase::VaThinking);
            rs.voice.status_text = "Thinking...";
          }
          ESP_LOGD("va", "Status: Thinking...");
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  on_stt_end:
    then:
      - script.stop: screen_sleep_timer
      - if:
          condition:
            lambda: 'return !latter_ui::cam_intercom_ptt_active() && !latter_ui::cam_call_active();'
          then:
            - script.execute: enable_speaker_path
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          latter_ui::log_audio_profile("VA_STT_END", x.c_str());
          rs.voice.vad_active = false;
          if (latter_ui::cam_intercom_ptt_active() || latter_ui::cam_call_active()) {
            id(va_echo_gate).stop();
            latter_ui::echo_meter_active().store(false, std::memory_order_relaxed);
            id(latter_mic).set_mute_state(false);
            rs.voice.intercom_turn = true;
            rs.voice.active = false;
            rs.voice.status_text = "";
            esphome::voice_assistant::abort_voice_assistant(id(va));
            if (x.empty()) {
              id(resume_doorbell_listen).execute();
              return;
            }
            latter_ui::cam_intercom_ptt_active() = false;
            rs.intercom.cam_action = "talk_message";
            rs.intercom.cam_message = x;
            latter_ui::cam_intercom_status() = "SENT TO DOORBELL";
            rs.intercom.cam_status_ms = millis();
            id(send_doorbell_intercom_cmd).execute();
            latter_ui::radio_boost_until_ms() = 0;
            id(apply_power_policy).execute();
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          rs.voice.status_text = "Thinking...";
          std::string utt = x;
          for (char &c : utt) {
            c = static_cast<char>(::tolower(static_cast<unsigned char>(c)));
            if (c == '.' || c == ',' || c == '!' || c == '?') c = ' ';
          }
          while (!utt.empty() && utt.front() == ' ') utt.erase(utt.begin());
          while (!utt.empty() && utt.back() == ' ') utt.pop_back();
          const bool mentions_media = (utt.find("music") != std::string::npos ||
                                       utt.find("speaker") != std::string::npos ||
                                       utt.find("audio") != std::string::npos ||
                                       utt.find("song") != std::string::npos ||
                                       utt.find("track") != std::string::npos ||
                                       utt.find("player") != std::string::npos ||
                                       utt.find("playing") != std::string::npos ||
                                       utt.find("playback") != std::string::npos);
          const bool bare_pause_or_stop = (utt == "pause" || utt == "stop");
          const bool media_pause_or_stop = mentions_media &&
                                           (utt.find("pause") != std::string::npos ||
                                            utt.find("stop") != std::string::npos ||
                                            utt.find("turn off") != std::string::npos);
          if (bare_pause_or_stop || media_pause_or_stop) {
            rs.voice.resume_music_after = false;
            latter_ui::audio_session().set_paused_for_va(false, millis());
            ESP_LOGD("va", "Stop/Pause media intent detected: clearing va_resume_music_after");
          }
          ESP_LOGD("va", "STT End (hidden): %s", x.c_str());
  on_intent_progress:
    then:
      - if:
          condition:
            lambda: 'return latter_ui::runtime_state().voice.intercom_turn;'
          then:
            - if:
                condition:
                  lambda: 'return !x.empty();'
                then:
                  - media_player.stop:
                      id: latter_media_player
                      announcement: true
          else:
            - if:
                condition:
                  lambda: 'return !x.empty();'
                then:
                  - mixer_speaker.apply_ducking:
                      id: media_mixing_input
                      decibel_reduction: 50
                      duration: 0.1s
                  - mixer_speaker.apply_ducking:
                      id: announcement_mixing_input
                      decibel_reduction: 0
                      duration: 0.05s
                  - script.stop: screen_sleep_timer
                  - script.execute: enable_speaker_path
                  - script.wait: enable_speaker_path
                  - lambda: |-
                      auto &rs = latter_ui::runtime_state();
                      id(hal_set_dac_mute).execute(false);
                      if (!rs.voice.active) {
                        rs.voice.return_page = rs.nav.gui_page;
                        rs.voice.active = true;
                        id(va_restore_display).stop();
                        latter_ui::va_display_restore().capture(rs.nav.display_power_state,
                            id(display_brightness).current_values.is_on(), millis(), false);
                        if (rs.nav.display_power_state != 0 && latter_ui::persisted_prefs().wake_screen_on_assist) {
                          latter_ui::screen_is_off_standby() = false;
                          rs.nav.display_power_state = 0;
                          id(disp1).start_poller();
                          id(apply_power_policy).execute();
                          id(sync_display_brightness).execute();
                        }
                      }
                      rs.voice.vad_active = false;
                      rs.voice.tts_received = true;
                      rs.voice.status_text = "Responding...";
                      latter_ui::audio_session().note_va_phase(latter_ui::AudioSessionPhase::VaSpeaking);
                      ESP_LOGD("va", "Status: Responding (Streaming TTS)...");
                  - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  on_tts_start:
    then:
      - if:
          condition:
            lambda: 'return !latter_ui::runtime_state().voice.intercom_turn;'
          then:
            - lambda: 'latter_ui::log_audio_profile("VA_TTS_START");'
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 50
                duration: 0.1s
            - mixer_speaker.apply_ducking:
                id: announcement_mixing_input
                decibel_reduction: 0
                duration: 0.05s
            - script.stop: screen_sleep_timer
            - script.execute: enable_speaker_path
            - script.wait: enable_speaker_path
            - lambda: |-
                auto &rs = latter_ui::runtime_state();
                id(hal_set_dac_mute).execute(false);
                if (!rs.voice.active) {
                  rs.voice.return_page = rs.nav.gui_page;
                  rs.voice.active = true;
                  id(va_restore_display).stop();
                  latter_ui::va_display_restore().capture(rs.nav.display_power_state,
                      id(display_brightness).current_values.is_on(), millis(), false);
                  if (rs.nav.display_power_state != 0 && latter_ui::persisted_prefs().wake_screen_on_assist) {
                    latter_ui::screen_is_off_standby() = false;
                    rs.nav.display_power_state = 0;
                    id(disp1).start_poller();
                    id(apply_power_policy).execute();
                    id(sync_display_brightness).execute();
                  }
                }
                rs.voice.vad_active = false;
                rs.voice.tts_received = true;
                rs.voice.status_text = "Responding...";
                latter_ui::audio_session().note_va_phase(latter_ui::AudioSessionPhase::VaSpeaking);
                ESP_LOGD("va", "Status: Responding (TTS)...");
            - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  on_tts_end:
    then:
      - if:
          condition:
            lambda: 'return latter_ui::runtime_state().voice.intercom_turn;'
          then:
            - media_player.stop:
                id: latter_media_player
                announcement: true
          else:
            - script.stop: screen_sleep_timer
            - script.execute: enable_speaker_path
            - script.wait: enable_speaker_path
            - lambda: 'id(hal_set_dac_mute).execute(false);'
            - lambda: |-
                auto &rs = latter_ui::runtime_state();
                if (!rs.voice.active) {
                  rs.voice.return_page = rs.nav.gui_page;
                  rs.voice.active = true;
                }
                rs.voice.vad_active = false;
                rs.voice.tts_received = true;
                rs.voice.status_text = "Responding...";
                latter_ui::audio_session().note_va_phase(latter_ui::AudioSessionPhase::VaSpeaking);
                ESP_LOGD("va", "TTS URL ready: %s", x.c_str());
            - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  on_error:
    then:
      - script.stop: va_tts_drain_and_finish
      - script.stop: va_echo_gate
      - if:
          condition:
            lambda: 'return latter_ui::cam_intercom_ptt_active();'
          then:
            - lambda: |-
                auto &rs = latter_ui::runtime_state();
                latter_ui::echo_meter_active().store(false, std::memory_order_relaxed);
                id(latter_mic).set_mute_state(false);
                rs.voice.intercom_turn = false;
                esphome::voice_assistant::abort_voice_assistant(id(va));
                rs.voice.vad_active = false;
                ESP_LOGW("va", "Intercom turn error: %s - %s", code.c_str(), message.c_str());
            - script.execute: resume_doorbell_listen
          else:
            - if:
                condition:
                  lambda: |-
                    return (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING) &&
                           !latter_ui::cam_call_active() && !latter_ui::cam_listen_active();
                then:
                  - media_player.stop:
                      id: latter_media_player
                      announcement: true
                  - speaker.stop: announcement_mixing_input
            - lambda: |-
                auto &rs = latter_ui::runtime_state();
                latter_ui::echo_meter_active().store(false, std::memory_order_relaxed);
                id(latter_mic).set_mute_state(false);
                rs.voice.intercom_turn = false;
                esphome::voice_assistant::abort_voice_assistant(id(va));
                rs.voice.vad_active = false;
                rs.voice.tts_received = false;
                rs.voice.active = false;
                rs.voice.status_text = "";
                latter_ui::audio_session().note_va_phase(latter_ui::AudioSessionPhase::Idle);
                if (rs.voice.return_page >= 0) rs.nav.gui_page = rs.voice.return_page;
                latter_ui::radio_boost_until_ms() = 0;
                id(apply_power_policy).execute();
                ESP_LOGE("va", "Error: %s - %s", code.c_str(), message.c_str());
            - script.execute: resume_music_after_va
            - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
            - script.execute: va_restore_display
  on_timer_started:
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          ESP_LOGI("va_timer", "Timer started via Assist: %s (%lu sec)", timer.name.c_str(), (unsigned long)timer.total_seconds);
          uint32_t now_t = millis();
          latter_ui::upsert_voice_timer_slot(timer.id, timer.name, timer.total_seconds, timer.seconds_left, timer.is_active, now_t);
          rs.timers.va_timer_name = timer.name;
          latter_ui::sync_multi_timer_state();
          rs.timers.ringing = false;
          latter_actions::check_and_emit_timer_alarm_state(now_t);
          id(apply_power_policy).execute();
          if (!rs.voice.active && rs.voice.status_text.empty()) {
            if (((rs.nav.gui_page == 8 && rs.nav.tools_subpage == 1) ||
                 (rs.nav.gui_page == 1 && (rs.nav.home_subpage == 0 || rs.nav.home_subpage == 2))) &&
                rs.nav.display_power_state == 0) {
              latter_ui::schedule_disp_update(&id(disp1));
            }
          }
  on_timer_updated:
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          ESP_LOGD("va_timer", "Timer updated via Assist: %s (left: %lu sec, active: %d)", timer.name.c_str(), (unsigned long)timer.seconds_left, timer.is_active);
          uint32_t now_t = millis();
          latter_ui::upsert_voice_timer_slot(timer.id, timer.name, timer.total_seconds, timer.seconds_left, timer.is_active, now_t);
          latter_ui::sync_multi_timer_state();
          latter_actions::check_and_emit_timer_alarm_state(now_t);
          id(apply_power_policy).execute();
          if (!rs.voice.active && rs.voice.status_text.empty()) {
            if (((rs.nav.gui_page == 8 && rs.nav.tools_subpage == 1) ||
                 (rs.nav.gui_page == 1 && (rs.nav.home_subpage == 0 || rs.nav.home_subpage == 2))) &&
                rs.nav.display_power_state == 0) {
              latter_ui::schedule_disp_update(&id(disp1));
            }
          }
  on_timer_cancelled:
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          ESP_LOGI("va_timer", "Timer cancelled via Assist: %s", timer.name.c_str());
          auto *slots = latter_ui::timer_slots();
          for (int i = 0; i < 3; i++) {
            if ((!timer.id.empty() && slots[i].id == timer.id) || (!timer.name.empty() && slots[i].name == timer.name)) {
              slots[i].running = false;
              slots[i].paused = false;
              slots[i].remaining_sec = slots[i].duration_sec;
            }
          }
          latter_ui::sync_multi_timer_state();
          if (rs.nav.home_subpage == 2 && !rs.timers.running) {
            rs.nav.home_subpage = 0;
          }
          const bool was_ringing = rs.timers.ringing;
          rs.timers.ringing = false;
          latter_actions::check_and_emit_timer_alarm_state(millis());
          if (was_ringing) {
            id(stop_alarm_sound).execute();
          }
          id(apply_power_policy).execute();
          if (!rs.voice.active && rs.voice.status_text.empty()) {
            if (((rs.nav.gui_page == 8 && rs.nav.tools_subpage == 1) ||
                 (rs.nav.gui_page == 1 && (rs.nav.home_subpage == 0 || rs.nav.home_subpage == 2))) &&
                rs.nav.display_power_state == 0) {
              latter_ui::schedule_disp_update(&id(disp1));
            }
          }
  on_timer_finished:
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          ESP_LOGI("va_timer", "Timer finished via Assist: %s", timer.name.c_str());
          auto *slots = latter_ui::timer_slots();
          std::string fired_name = timer.name;
          for (int i = 0; i < 3; i++) {
            if ((!timer.id.empty() && slots[i].id == timer.id) || (!timer.name.empty() && slots[i].name == timer.name)) {
              if (fired_name.empty()) fired_name = slots[i].name;
              slots[i].running = false;
              slots[i].paused = false;
              slots[i].remaining_sec = slots[i].duration_sec; // Keep duration & name saved as a reusable preset!
            }
          }
          latter_ui::sync_multi_timer_state();
          if (rs.nav.home_subpage == 2) {
            rs.nav.home_subpage = 0;
          }
          id(preempt_va_for_alert).execute();
          if (!rs.timers.ringing) {
            rs.timers.va_timer_name = fired_name;
            rs.timers.ringing = true;
            latter_ui::note_wake_reason(latter_ui::WakeReason::ALERT);
            id(wake_to_active_state).execute();
            id(play_alarm_sound).execute();
          }
          latter_actions::check_and_emit_timer_alarm_state(millis());
  on_end:
    then:
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
          timeout: 25s
      - lambda: |-
          if (!id(va).is_running()) {
            latter_ui::runtime_state().voice.intercom_turn = false;
          }
      - if:
          condition:
            lambda: 'return latter_ui::cam_intercom_ptt_active() && !id(va).is_running();'
          then:
            - script.execute: resume_doorbell_listen
      - if:
          condition:
            lambda: |-
              const auto &v = latter_ui::runtime_state().voice;
              return v.active || v.tts_received || !v.status_text.empty();
          then:
            - script.execute: va_tts_drain_and_finish

text_sensor:
  - platform: sendspin
    type: artist
    name: "Now Playing Artist"
    id: track_artist
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static std::string prev_s_artist = "";
            if (x != prev_s_artist) {
              prev_s_artist = x;
              const auto &rs = latter_ui::runtime_state();
              const auto &ms = latter_ui::media_state();
              if (ms.is_local) {
                if (!x.empty() &&
                    rs.nav.display_power_state == 0 &&
                    rs.nav.gui_page == 2 &&
                    id(album_art).get_width() == 0 &&
                    !ms.art_url.empty() &&
                    ms.art_url != rs.music.loaded_art_url) {
                  id(fetch_remote_art_debounced).execute();
                }
                id(throttled_disp_update).execute();
              }
            }

  - platform: sendspin
    type: title
    name: "Now Playing Title"
    id: track_title
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static std::string prev_s_title = "";
            if (x != prev_s_title) {
              prev_s_title = x;
              if (!x.empty()) {
                latter_ui::music_queue_cleared() = false;
              }
              const auto &rs = latter_ui::runtime_state();
              const auto &ms = latter_ui::media_state();
              if (ms.is_local) {
                if (!x.empty() &&
                    rs.nav.display_power_state == 0 &&
                    rs.nav.gui_page == 2 &&
                    id(album_art).get_width() == 0 &&
                    !ms.art_url.empty() &&
                    ms.art_url != rs.music.loaded_art_url) {
                  id(fetch_remote_art_debounced).execute();
                }
                id(throttled_disp_update).execute();
              }
            }

  - platform: sendspin
    type: album
    name: "Now Playing Album"
    id: track_album
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static std::string prev_s_album = "";
            if (x != prev_s_album) {
              prev_s_album = x;
              const auto &rs = latter_ui::runtime_state();
              const auto &ms = latter_ui::media_state();
              if (ms.is_local) {
                if (!x.empty() &&
                    rs.nav.display_power_state == 0 &&
                    rs.nav.gui_page == 2 &&
                    id(album_art).get_width() == 0 &&
                    !ms.art_url.empty() &&
                    ms.art_url != rs.music.loaded_art_url) {
                  id(fetch_remote_art_debounced).execute();
                }
                id(throttled_disp_update).execute();
              }
            }

script:
  - id: va_tts_drain_and_finish
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: |-
              const auto &v = latter_ui::runtime_state().voice;
              return (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING) ||
                     (!v.active && !v.tts_received);
          timeout: 60s
      - wait_until:
          condition:
            lambda: |-
              const auto &v = latter_ui::runtime_state().voice;
              return !id(announcement_mixing_input).is_running() ||
                     (!v.active && !v.tts_received);
          timeout: !lambda 'return (${announcement_buffer_s} + 2) * 1000;'
      - delay: 250ms
      - if:
          condition:
            lambda: 'return id(va).is_running();'
          then:
            - script.execute: mute_speaker_path
            - script.stop: va_tts_drain_and_finish
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          latter_ui::log_audio_profile("VA_DRAIN_FINISH");
          id(va_echo_gate).stop();
          latter_ui::echo_meter_active().store(false, std::memory_order_relaxed);
          id(latter_mic).set_mute_state(false);  // va_echo_gate never outlives the session
          const bool was_va_session = rs.voice.active;
          rs.voice.vad_active = false;
          rs.voice.status_text = "";
          rs.voice.tts_received = false;
          rs.voice.active = false;
          latter_ui::audio_session().note_va_phase(latter_ui::AudioSessionPhase::Idle);
          if (was_va_session) {
            rs.nav.gui_page = rs.voice.return_page;
          }
          if (rs.nav.gui_page == 2) id(fetch_remote_art_debounced).execute();
          latter_ui::radio_boost_until_ms() = 0;
          id(apply_power_policy).execute();
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
      - delay: 160ms
      - script.execute: resume_music_after_va
      - script.execute: va_restore_display

  - id: enable_speaker_path
    mode: restart
    then:
      - script.stop: mute_speaker_path
      - lambda: |-
          if (!id(latter_mic).is_running() && !id(physical_speaker).is_running()) {
            id(hal_set_audio_codecs_standby).execute(false);
          }
      - if:
          condition:
            lambda: 'return !id(physical_speaker).is_running();'
          then:
            - lambda: |-
                id(speaker_enable).turn_off();
                id(physical_speaker).set_audio_stream_info(
                    audio::AudioStreamInfo(${audio_out_bits}, ${audio_out_channels}, ${audio_out_rate}));
                id(physical_speaker).start();
            - wait_until:
                condition:
                  lambda: 'return id(physical_speaker).is_running();'
                timeout: 200ms
            - delay: 30ms
      - switch.turn_on: speaker_enable

  - id: mute_speaker_path
    mode: restart
    then:
      - lambda: 'id(hal_set_dac_mute).execute(true);'
      - switch.turn_off: speaker_enable

  - id: va_echo_gate
    mode: restart
    then:
      - lambda: |-
          id(latter_mic).set_mute_state(true);
          latter_ui::echo_last_loud_ms().store(millis());
          latter_ui::echo_meter_active().store(true, std::memory_order_relaxed);
          latter_ui::audio_session().note_va_phase(latter_ui::AudioSessionPhase::VaEchoCooldown);
      - wait_until:
          condition:
            lambda: |-
              return !id(announcement_mixing_input).has_buffered_data() &&
                     !id(sound_mixing_input).has_buffered_data();
          timeout: !lambda 'return ${announcement_buffer_s} * 1000 + 500;'
      - wait_until:
          condition:
            lambda: |-
              return !id(physical_speaker).has_buffered_data() ||
                     (millis() - latter_ui::echo_last_loud_ms().load()) > 100;
          timeout: 500ms
      - script.execute: mute_speaker_path
      - script.wait: mute_speaker_path
      - delay: 30ms
      - lambda: |-
          latter_ui::echo_meter_active().store(false, std::memory_order_relaxed);
          id(latter_mic).set_mute_state(false);

  - id: announce_stall_check
    mode: restart
    then:
      - delay: 6s
      - lambda: |-
          if (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING) return;
          if (id(announcement_mixing_input).has_buffered_data()) return;
          auto st = [](speaker::Speaker *s) -> const char * {
            return s->is_running() ? "run" : (s->is_stopped() ? "stop" : "trans");
          };
          ESP_LOGW("PROF", "[PROF:AUDIO_STALL] announcing 6s, no buffered audio: ann=%s snd=%s media=%s "
                   "spk=%s spk_buf=%d vol=%.2f va=%d mic_mute=%d",
                   st(id(announcement_mixing_input)), st(id(sound_mixing_input)), st(id(media_mixing_input)),
                   st(id(physical_speaker)), (int) id(physical_speaker).has_buffered_data(),
                   id(physical_speaker).get_volume(), (int) id(va).is_running(),
                   (int) id(latter_mic).get_mute_state());

  - id: apply_wake_word_sensitivities
    mode: restart
    then:
      - lambda: |-
          auto apply_cutoffs = [](std::string_view opt, uint8_t low_c, uint8_t med_c, uint8_t high_c) -> uint8_t {
            if (opt == "Slightly sensitive") return low_c;
            if (opt == "Very sensitive") return high_c;
            return med_c;
          };
          const auto &prefs = latter_ui::persisted_prefs();
          id(okay_nabu).set_probability_cutoff(
              apply_cutoffs(latter_ui::pref_ww_sens_cstr(prefs.ww_sens_okay_nabu), 247, 237, 224));
          id(hey_luna).set_probability_cutoff(
              apply_cutoffs(latter_ui::pref_ww_sens_cstr(prefs.ww_sens_hey_luna), 248, 239, 226));
          id(hey_jarvis).set_probability_cutoff(
              apply_cutoffs(latter_ui::pref_ww_sens_cstr(prefs.ww_sens_hey_jarvis), 247, 237, 224));
          id(hey_mycroft).set_probability_cutoff(
              apply_cutoffs(latter_ui::pref_ww_sens_cstr(prefs.ww_sens_hey_mycroft), 248, 239, 226));
          id(alexa).set_probability_cutoff(
              apply_cutoffs(latter_ui::pref_ww_sens_cstr(prefs.ww_sens_alexa), 247, 237, 224));

  - id: sync_wake_word_state
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              const auto &rs = latter_ui::runtime_state();
              // Media pauses the wake word on every board until on-device echo cancellation exists.
              const bool va_busy = rs.voice.active || id(va).is_running() || !rs.voice.status_text.empty() ||
                                   rs.voice.tts_received || id(announcement_mixing_input).is_running();
              const bool media_busy = (id(mp_idle_debounce).is_running() || rs.voice.resume_music_after ||
                                      id(media_mixing_input).is_running() ||
                                      (id(sendspin_group_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                                      (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                                      (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING));
              const bool alert_or_tool_busy = rs.alarms.ringing || rs.timers.ringing || rs.alarms.find_my_active ||
                                              (rs.nav.active_game > 0) ||
                                              latter_ui::cam_call_active() || latter_ui::cam_listen_active() ||
                                              latter_ui::cam_intercom_ptt_active();
              const bool sys_busy = rs.nav.is_hibernating || rs.nav.ota_in_progress ||
                                    !id(wifi_ctrl).is_connected() || (millis() < 12000U);
              return latter_ui::wake_word_should_run(
                  latter_ui::pref_wake_word_mode_cstr(),
                  rs.hw_usb_connected,
                  va_busy, media_busy, alert_or_tool_busy, sys_busy);
          then:
            - if:
                condition:
                  not:
                    micro_wake_word.is_running:
                then:
                  - lambda: |-
                      id(hal_set_audio_codecs_standby).execute(false);
                      id(latter_mic).set_mute_state(false);
                  - delay: 25ms
                  - script.execute: apply_wake_word_sensitivities
                  - if:
                      condition:
                        lambda: |-
                          const auto &rs = latter_ui::runtime_state();
                          return !id(mww).is_running() &&
                                 !rs.voice.active && !id(va).is_running() &&
                                 !id(media_mixing_input).is_running() &&
                                 (id(sendspin_group_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
                                 (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
                                 (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING);
                      then:
                        - micro_wake_word.start:
                        - wait_until:
                            condition:
                              lambda: 'return id(latter_mic).is_running();'
                            timeout: 100ms
                        - lambda: |-
                            id(hal_set_audio_codecs_standby).execute(false);
                            if (latter_ui::audio_session().phase() == latter_ui::AudioSessionPhase::Idle) {
                              latter_ui::audio_session().note_va_phase(latter_ui::AudioSessionPhase::WakeWordArmed);
                            }
                            ESP_LOGD("mww", "Wake word detection ARMED (primary='%s', mode='%s')",
                                     esphome::voice_assistant::primary_wake_word_name(id(mww)).c_str(),
                                     latter_ui::pref_wake_word_mode_cstr());
          else:
            - if:
                condition:
                  micro_wake_word.is_running:
                then:
                  - micro_wake_word.stop:
                  - lambda: |-
                      if (latter_ui::audio_session().phase() == latter_ui::AudioSessionPhase::WakeWordArmed) {
                        latter_ui::audio_session().note_va_phase(latter_ui::AudioSessionPhase::Idle);
                      }
                      ESP_LOGD("mww", "Wake word detection PAUSED (mode='%s', usb=%d)",
                               latter_ui::pref_wake_word_mode_cstr(),
                               (int)latter_ui::runtime_state().hw_usb_connected);

  - id: trigger_va_from_wake_word
    mode: restart
    then:
      - script.stop: va_echo_gate
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          latter_ui::request_radio_boost(millis(), 15000U);
          id(apply_power_policy).execute();
          id(hal_set_audio_codecs_standby).execute(false);
          id(latter_mic).set_mute_state(false);
          id(va_restore_display).stop();
          latter_ui::va_display_restore().capture(rs.nav.display_power_state,
              id(display_brightness).current_values.is_on(), millis(), true);
          if (rs.nav.display_power_state != 0 || !id(display_brightness).current_values.is_on()) {
            if (latter_ui::persisted_prefs().wake_screen_on_assist) {
              latter_ui::note_wake_reason(latter_ui::WakeReason::VOICE);
              id(wake_to_active_state).execute();
            }
          } else {
            id(screen_sleep_timer).execute();
          }
          rs.voice.tts_received = false;
      - script.execute: mute_speaker_path
      - script.wait: mute_speaker_path
      - voice_assistant.start:
          wake_word: !lambda 'return latter_ui::runtime_state().voice.last_detected_wake_word;'

  - id: preempt_va_for_alert
    mode: restart
    then:
      - script.stop: va_tts_drain_and_finish
      - script.stop: va_echo_gate
      - script.stop: cancel_voice_assistant
      - script.stop: va_restore_display
      - script.stop: mp_idle_debounce
      - script.stop: resume_music_after_va
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          const uint32_t now_ms = millis();
          latter_ui::audio_session().preempt_for_alert(now_ms);
          latter_ui::audio_session().set_paused_for_va(false, now_ms);
          latter_ui::va_display_restore().armed = false;
          latter_ui::echo_meter_active().store(false, std::memory_order_relaxed);
          id(latter_mic).set_mute_state(false);
          if (rs.voice.active || id(va).is_running() || rs.voice.tts_received || !rs.voice.status_text.empty()) {
            esphome::voice_assistant::abort_voice_assistant(id(va));
            rs.voice.intercom_turn = false;
            rs.voice.was_cancelled = true;
            rs.voice.status_text = "";
            rs.voice.tts_received = false;
            rs.voice.vad_active = false;
            rs.voice.active = false;
            rs.nav.gui_page = (rs.voice.return_page >= 0) ? rs.voice.return_page : rs.nav.gui_page;
            latter_ui::radio_boost_until_ms() = 0;
          }
      - if:
          condition:
            lambda: 'return id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;'
          then:
            - media_player.stop:
                id: latter_media_player
                announcement: true
      - speaker.stop: announcement_mixing_input

  - id: play_alarm_sound
    mode: restart
    then:
      - script.execute: preempt_va_for_alert
      - script.stop: stop_alarm_sound
      - if:
          condition:
            media_player.is_playing: latter_media_player
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 50
                duration: 0.05s
            - delay: 400ms
      - if:
          condition:
            lambda: 'return !id(speaker_enable).state || !id(physical_speaker).is_running();'
          then:
            - script.execute: enable_speaker_path
            - script.wait: enable_speaker_path
      - lambda: |-
          const auto &rs = latter_ui::runtime_state();
          const float alert_pct = static_cast<float>(latter_ui::persisted_prefs().alert_volume);
          const float alert_v = rs.alarms.find_my_active
              ? 0.90f
              : latter_ui::alarm_output_volume(alert_pct, id(latter_media_player).volume);
          id(physical_speaker).set_volume(alert_v);
          id(hal_set_dac_mute).execute(false);
      - while:
          condition:
            lambda: |-
              const auto &rs = latter_ui::runtime_state();
              return rs.alarms.ringing || rs.timers.ringing || rs.alarms.find_my_active;
          then:
            - if:
                condition:
                  not:
                    media_player.is_playing: latter_sound_player
                then:
                  - media_player.play_media:
                      id: latter_sound_player
                      media_url: !lambda |-
                        return std::string(latter_ui::runtime_state().alarms.find_my_active
                                               ? "audio-file://sound_find_my"
                                               : "audio-file://sound_alarm");
            - wait_until:
                condition:
                  media_player.is_playing: latter_sound_player
                timeout: 500ms
            - wait_until:
                condition:
                  not:
                    media_player.is_playing: latter_sound_player
                timeout: 8s
            - delay: 800ms

  - id: play_game_sfx
    mode: restart
    parameters:
      sfx_id: int
    then:
      - script.stop: mp_idle_debounce
      - if:
          condition:
            lambda: 'return !id(speaker_enable).state;'
          then:
            - script.execute: enable_speaker_path
            - script.wait: enable_speaker_path
            - lambda: |-
                const float alert_pct = static_cast<float>(latter_ui::persisted_prefs().alert_volume);
                const float sfx_v = latter_ui::alarm_output_volume(alert_pct, id(latter_media_player).volume);
                id(physical_speaker).set_volume(sfx_v);
                id(hal_set_dac_mute).execute(false);
      - media_player.play_media:
          id: latter_sound_player
          media_url: !lambda |-
            const int n = (sfx_id >= 1 && sfx_id <= 14) ? sfx_id : 1;
            return "audio-file://sound_sfx_" + std::to_string(n);
      - if:
          condition:
            lambda: 'return latter_ui::runtime_state().nav.active_game == 0;'
          then:
            - script.execute: mp_idle_debounce

  - id: stop_alarm_sound
    mode: restart
    then:
      - if:
          condition:
            media_player.is_playing: latter_media_player
          then:
            - lambda: 'id(hal_set_dac_mute).execute(true);'
      - media_player.stop: latter_sound_player
      - script.stop: play_alarm_sound
      - if:
          condition:
            media_player.is_playing: latter_media_player
          then:
            - wait_until:
                condition:
                  lambda: 'return !id(sound_mixing_input).is_running();'
                timeout: 1500ms
            - delay: 300ms
            - lambda: |-
                float v = id(latter_media_player).volume;
                if (std::isnan(v) || v <= 0.0f) v = 0.60f;
                id(physical_speaker).set_volume(latter_ui::media_dac_volume(v));
                id(hal_set_dac_mute).execute(false);
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 0.2s
            - script.execute: sync_wake_word_state
          else:
            - if:
                condition:
                  lambda: |-
                    const auto &v = latter_ui::runtime_state().voice;
                    return v.resume_music_after && !v.active && !v.tts_received;
                then:
                  - script.execute: resume_music_after_va
                else:
                  - if:
                      condition:
                        lambda: |-
                          const auto &rs = latter_ui::runtime_state();
                          return !rs.voice.active && !rs.voice.tts_received &&
                                 !id(va).is_running() && !id(announcement_mixing_input).is_running() &&
                                 !latter_ui::cam_call_active() && !latter_ui::cam_listen_active() &&
                                 (rs.nav.active_game == 0);
                      then:
                        - script.execute: mute_speaker_path
                        - script.wait: mute_speaker_path
                        - script.execute: sync_wake_word_state

  - id: mp_idle_debounce
    mode: restart
    then:
      - delay: 3s
      - script.execute: media_idle_finish

  - id: mp_pause_settle
    mode: restart
    then:
      - script.stop: mp_idle_debounce
      - speaker.stop: media_mixing_input
      - wait_until:
          condition:
            lambda: 'return !id(media_mixing_input).is_running();'
          timeout: 500ms
      - script.execute: media_idle_finish

  - id: media_idle_finish
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              const auto &rs = latter_ui::runtime_state();
              return (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
                     (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING) &&
                     (id(sendspin_group_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
                     !id(media_mixing_input).is_running() &&
                     !id(va).is_running() &&
                     !rs.voice.active &&
                     !rs.voice.tts_received &&
                     !id(announcement_mixing_input).is_running() &&
                     !latter_ui::cam_call_active() &&
                     !latter_ui::cam_listen_active() &&
                     !rs.alarms.ringing &&
                     !rs.timers.ringing &&
                     !rs.alarms.find_my_active &&
                     (rs.nav.active_game == 0);
          then:
            - script.execute: mute_speaker_path
            - script.wait: mute_speaker_path
            - script.execute: sync_wake_word_state
            - lambda: |-
                auto &rs = latter_ui::runtime_state();
                latter_ui::audio_session().note_local_playback_stopped();
                const std::string_view ww_mode(latter_ui::pref_wake_word_mode_cstr());
                const bool ww_act = (ww_mode == "Always On") || (ww_mode == "Docked Only" && rs.hw_usb_connected);
                if (!ww_act) {
                  id(hal_set_audio_codecs_standby).execute(true);
                }
                if (rs.nav.display_power_state == 2 && !rs.hw_usb_connected) {
                  if (rs.nav.sleep_start_time == 0) rs.nav.sleep_start_time = millis();
                }
                if (rs.nav.display_power_state == 0 &&
                    !latter_ui::area_ctx_state().wallpaper_url.empty() &&
                    latter_ui::area_ctx_state().wallpaper_url != rs.music.loaded_wallpaper_url) {
                  id(fetch_wallpaper_debounced).execute();
                }
                id(apply_power_policy).execute();

  - id: start_voice_assistant
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              const auto &v = latter_ui::runtime_state().voice;
              return v.active || !v.status_text.empty() || id(va).is_running();
          then:
            - script.stop: start_voice_assistant
      - if:
          condition:
            lambda: 'return id(va).get_api_connection() == nullptr;'
          then:
            - logger.log:
                level: WARN
                format: "Assist pipeline not connected to Home Assistant yet; ignoring VA start"
            - script.stop: start_voice_assistant
      - script.stop: va_echo_gate
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          latter_ui::request_radio_boost(millis(), 15000U);
          id(apply_power_policy).execute();
          id(hal_set_audio_codecs_standby).execute(false);
          id(latter_mic).set_mute_state(false);
          id(va_restore_display).stop();
          latter_ui::va_display_restore().capture(rs.nav.display_power_state,
              id(display_brightness).current_values.is_on(), millis(), true);
          if (rs.nav.display_power_state != 0 || !id(display_brightness).current_values.is_on()) {
            if (latter_ui::persisted_prefs().wake_screen_on_assist) {
              latter_ui::note_wake_reason(latter_ui::WakeReason::VOICE);
              id(wake_to_active_state).execute();
            }
          } else {
            id(screen_sleep_timer).execute();
          }
          if (!rs.voice.active) {
            rs.voice.return_page = rs.nav.gui_page;
            rs.voice.active = true;
          }
          rs.voice.tts_received = false;
      - if:
          condition:
            lambda: |-
              const auto &rs = latter_ui::runtime_state();
              return !rs.voice.resume_music_after &&
                     ((id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                      (!rs.music.active_speaker_entity.empty() && latter_ui::media_state().state == "playing"));
          then:
            - script.execute: pause_all_music
            - delay: 160ms
      - script.execute: mute_speaker_path
      - script.wait: mute_speaker_path
      - voice_assistant.start:

  - id: toggle_voice_assistant
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              const auto &v = latter_ui::runtime_state().voice;
              return v.active || !v.status_text.empty() || id(va).is_running();
          then:
            - script.execute: cancel_voice_assistant
          else:
            - script.execute: start_voice_assistant

  - id: cancel_voice_assistant
    mode: restart
    then:
      - script.stop: va_tts_drain_and_finish
      - script.stop: va_echo_gate
      - script.stop: mp_idle_debounce
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          esphome::voice_assistant::abort_voice_assistant(id(va));
          latter_ui::audio_session().note_va_phase(latter_ui::AudioSessionPhase::Idle);
          latter_ui::echo_meter_active().store(false, std::memory_order_relaxed);
          id(latter_mic).set_mute_state(false);
          rs.voice.intercom_turn = false;
          rs.voice.was_cancelled = true;
          rs.voice.status_text = "";
          rs.voice.tts_received = false;
          rs.voice.vad_active = false;
          rs.voice.active = false;
          rs.nav.gui_page = rs.voice.return_page;
          latter_ui::schedule_disp_update(&id(disp1));
      - lambda: 'id(hal_set_dac_mute).execute(true);'
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 50
          duration: 0.05s
      - if:
          condition:
            lambda: |-
              return (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING) ||
                     (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          then:
            - media_player.stop:
                id: latter_media_player
                announcement: true
      - speaker.stop: announcement_mixing_input
      - voice_assistant.stop:
      - wait_until:
          condition:
            lambda: 'return id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_IDLE;'
          timeout: 450ms
      - script.stop: mp_idle_debounce
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          esphome::voice_assistant::abort_voice_assistant(id(va));
          latter_ui::echo_meter_active().store(false, std::memory_order_relaxed);
          id(latter_mic).set_mute_state(false);
          rs.voice.intercom_turn = false;
          rs.voice.was_cancelled = true;
          rs.voice.status_text = "";
          rs.voice.tts_received = false;
          rs.voice.vad_active = false;
          rs.voice.active = false;
          rs.nav.gui_page = rs.voice.return_page;
          latter_ui::radio_boost_until_ms() = 0;
          id(apply_power_policy).execute();
      - delay: 25ms
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
      - delay: 160ms
      - script.execute: resume_music_after_va
      - script.execute: va_restore_display

  - id: pause_all_music
    mode: restart
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          const auto &ms = latter_ui::media_state();
          bool local_active = (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          bool remote_active = (!rs.music.active_speaker_entity.empty() && !ms.is_local && (ms.state == "playing"));
          if (local_active || remote_active) {
            rs.voice.resume_music_after = true;
            latter_ui::audio_session().set_paused_for_va(true, millis());
          }
          ESP_LOGD("audio", "pause_all_music: local=%d, remote=%d -> va_resume_music_after=%d",
                   local_active, remote_active, rs.voice.resume_music_after);
      - if:
          condition:
            lambda: 'return latter_ui::runtime_state().voice.resume_music_after;'
          then:
            - media_player.pause: latter_media_player
            - speaker.stop: media_mixing_input
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 50
                duration: 0.1s
            - lambda: 'latter_actions::emit_media_command("pause");'

  - id: resume_music_after_va
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              const auto &rs = latter_ui::runtime_state();
              return rs.alarms.ringing || rs.timers.ringing || rs.alarms.find_my_active;
          then:
            - script.stop: resume_music_after_va
      - if:
          condition:
            lambda: 'return latter_ui::runtime_state().voice.resume_music_after;'
          then:
            - script.execute: mp_idle_debounce
            - lambda: |-
                auto &rs = latter_ui::runtime_state();
                const uint32_t now_ms = millis();
                rs.voice.resume_music_after = false;
                latter_ui::audio_session().set_play_intent(latter_ui::MusicPlayIntent::AutoResumeAfterVa, now_ms);
                latter_ui::audio_session().set_paused_for_va(false, now_ms);
                ESP_LOGD("audio", "resume_music_after_va: restoring playback for %s (cancelled=%d)",
                         rs.music.active_speaker_entity.c_str(), rs.voice.was_cancelled);
            - if:
                condition:
                  lambda: |-
                    return !latter_ui::runtime_state().music.active_speaker_entity.empty() &&
                           !latter_ui::media_state().is_local;
                then:
                  - lambda: |-
                      latter_ui::runtime_state().voice.was_cancelled = false;
                      id(apply_power_policy).execute();
                      latter_actions::emit_media_command("play");
                      id(hal_set_dac_mute).execute(true);
                  - script.execute: mute_speaker_path
                  - script.execute: sync_wake_word_state
                else:
                  - script.execute: enable_speaker_path
                  - script.wait: enable_speaker_path
                  - if:
                      condition:
                        lambda: |-
                          const auto &rs = latter_ui::runtime_state();
                          return !rs.alarms.ringing && !rs.timers.ringing && !rs.alarms.find_my_active;
                      then:
                        - mixer_speaker.apply_ducking:
                            id: media_mixing_input
                            decibel_reduction: 0
                            duration: 0.2s
                        - mixer_speaker.apply_ducking:
                            id: announcement_mixing_input
                            decibel_reduction: 50
                            duration: 0.1s
                        - lambda: |-
                            float v = id(latter_media_player).volume;
                            if (std::isnan(v) || v <= 0.0f) v = 0.60f;
                            id(physical_speaker).set_volume(latter_ui::media_dac_volume(v));
                  - lambda: 'latter_actions::emit_media_command("play");'
                  - if:
                      condition:
                        lambda: 'return latter_ui::runtime_state().voice.was_cancelled;'
                      then:
                        - lambda: 'latter_ui::runtime_state().voice.was_cancelled = false;'
                        - delay: 700ms
                  - lambda: 'id(hal_set_dac_mute).execute(false);'
          else:
            - lambda: 'latter_ui::audio_session().set_paused_for_va(false, millis());'
            - if:
                condition:
                  lambda: |-
                    const auto &rs = latter_ui::runtime_state();
                    return id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING &&
                           !rs.alarms.ringing && !rs.timers.ringing && !rs.alarms.find_my_active;
                then:
                  - lambda: |-
                      latter_ui::runtime_state().voice.was_cancelled = false;
                      id(apply_power_policy).execute();
                      float v = id(latter_media_player).volume;
                      if (std::isnan(v) || v <= 0.0f) v = 0.60f;
                      id(physical_speaker).set_volume(latter_ui::media_dac_volume(v));
                      id(hal_set_dac_mute).execute(false);
                  - mixer_speaker.apply_ducking:
                      id: media_mixing_input
                      decibel_reduction: 0
                      duration: 1s
                  - mixer_speaker.apply_ducking:
                      id: announcement_mixing_input
                      decibel_reduction: 50
                      duration: 0.1s
                  - script.execute: sync_wake_word_state
                else:
                  - lambda: |-
                      latter_ui::runtime_state().voice.was_cancelled = false;
                      id(apply_power_policy).execute();
                  - if:
                      condition:
                        lambda: 'return !latter_ui::cam_call_active() && !latter_ui::cam_listen_active();'
                      then:
                        - script.execute: mute_speaker_path
                        - script.execute: sync_wake_word_state

  - id: finish_announcement
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: 'return id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;'
          timeout: 3s
      - if:
          condition:
            lambda: |-
              return !latter_ui::runtime_state().voice.active &&
                     !latter_ui::cam_call_active() &&
                     !latter_ui::cam_listen_active();
          then:
            - script.execute: va_tts_drain_and_finish

  - id: music_vol_up
    mode: restart
    then:
      - delay: 0ms
      - lambda: |-
          auto &m = latter_ui::runtime_state().music;
          const uint32_t now_ms = millis();
          const float step_pct = static_cast<float>(latter_ui::persisted_prefs().volume_step_size);
          if (now_ms - m.feedback_timer > 80U) {
            latter_ui::step_music_volume_feedback(
                1, step_pct, latter_ui::media_state().is_local,
                id(latter_media_player).volume, now_ms, m);
          }
      - if:
          condition:
            lambda: 'return latter_ui::media_state().is_local;'
          then:
            - lambda: |-
                float step = static_cast<float>(latter_ui::persisted_prefs().volume_step_size) / 100.0f;
                if (std::isnan(step) || step <= 0.0f) step = 0.05f;
                latter_ui::last_local_vol_tap_ms() = millis();
                float cur = id(latter_media_player).volume;
                if (std::isnan(cur) || cur <= 0.0f) cur = 0.70f;
                float new_vol = std::min(1.00f, cur + step);
                id(latter_media_player).make_call().set_volume(new_vol).perform();
                id(physical_speaker).set_volume(latter_ui::media_dac_volume(new_vol));
                id(media_mixing_input).apply_ducking(0.0f, 0);
                auto &m = latter_ui::runtime_state().music;
                m.action_feedback = "Volume: " + std::to_string(static_cast<int>(std::lround(new_vol * 100.0f))) + "%";
                m.feedback_timer = millis();
                latter_ui::schedule_disp_update(&id(disp1));
          else:
            - lambda: |-
                latter_actions::emit_media_volume(
                    latter_ui::runtime_state().music.active_speaker_entity, "up", latter_ui::remote_vol_pct());
                latter_ui::schedule_disp_update(&id(disp1));

  - id: music_vol_down
    mode: restart
    then:
      - delay: 0ms
      - lambda: |-
          auto &m = latter_ui::runtime_state().music;
          const uint32_t now_ms = millis();
          const float step_pct = static_cast<float>(latter_ui::persisted_prefs().volume_step_size);
          if (now_ms - m.feedback_timer > 80U) {
            latter_ui::step_music_volume_feedback(
                -1, step_pct, latter_ui::media_state().is_local,
                id(latter_media_player).volume, now_ms, m);
          }
      - if:
          condition:
            lambda: 'return latter_ui::media_state().is_local;'
          then:
            - lambda: |-
                float step = static_cast<float>(latter_ui::persisted_prefs().volume_step_size) / 100.0f;
                if (std::isnan(step) || step <= 0.0f) step = 0.05f;
                latter_ui::last_local_vol_tap_ms() = millis();
                float cur = id(latter_media_player).volume;
                if (std::isnan(cur) || cur <= 0.0f) cur = 0.70f;
                float new_vol = std::max(0.10f, cur - step);
                id(latter_media_player).make_call().set_volume(new_vol).perform();
                id(physical_speaker).set_volume(latter_ui::media_dac_volume(new_vol));
                id(media_mixing_input).apply_ducking(0.0f, 0);
                auto &m = latter_ui::runtime_state().music;
                m.action_feedback = "Volume: " + std::to_string(static_cast<int>(std::lround(new_vol * 100.0f))) + "%";
                m.feedback_timer = millis();
                latter_ui::schedule_disp_update(&id(disp1));
          else:
            - lambda: |-
                latter_actions::emit_media_volume(
                    latter_ui::runtime_state().music.active_speaker_entity, "down", latter_ui::remote_vol_pct());
                latter_ui::schedule_disp_update(&id(disp1));

  - id: toggle_ha_music
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              const auto &ms = latter_ui::media_state();
              bool is_remote = !ms.is_local;
              bool local_playing = (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
              return latter_ui::is_music_playing_effective(is_remote, local_playing, ms.state, millis());
          then:
            - lambda: |-
                const uint32_t now_ms = millis();
                latter_ui::set_remote_play_override(false, now_ms);
                if (!latter_ui::media_state().title.empty()) {
                  latter_ui::media_state().state = "paused";
                }
                latter_ui::sync_audio_session_media_observation(false, true, now_ms);
            - if:
                condition:
                  lambda: 'return latter_ui::media_state().is_local;'
                then:
                  - media_player.pause: latter_media_player
            - lambda: |-
                latter_actions::emit_media_command("pause");
                latter_ui::schedule_disp_update(&id(disp1));
          else:
            - lambda: |-
                latter_ui::set_remote_play_override(true, millis());
                if (latter_ui::media_state().is_local && id(mww).is_running()) {
                  id(mww).stop();
                }
                latter_actions::emit_media_command("play");
                latter_ui::schedule_disp_update(&id(disp1));

