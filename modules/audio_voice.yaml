# Core Subsystem: Audio & Voice Assistant (Hardware I2S & Codecs defined in boards/*.yaml HAL)

substitutions:
  announcement_buffer_s: "1"

# ESPHome 2026.10.0+ microFLAC v0.3.0 decoder with 80MHz Octal PSRAM frame buffers
audio:
  codecs:
    flac:
      buffer_memory: psram


speaker:
  - id: mixing_speaker
    platform: mixer
    output_speaker: physical_speaker
    num_channels: ${audio_out_channels}
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        buffer_duration: ${announcement_buffer_s}s
        timeout: 500ms
      - id: media_mixing_input
        timeout: 1500ms

  - id: media_resampler
    platform: resampler
    output_speaker: media_mixing_input
    sample_rate: ${audio_out_rate}
    task_stack_in_psram: true

  - id: announcement_resampler
    platform: resampler
    output_speaker: announcement_mixing_input
    sample_rate: ${audio_out_rate}
    task_stack_in_psram: true

  - id: rtttl_resampler
    platform: resampler
    output_speaker: announcement_mixing_input
    sample_rate: ${audio_out_rate}
    task_stack_in_psram: true


rtttl:
  id: alarm_rtttl
  speaker: rtttl_resampler

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false


media_source:
  - platform: audio_http
    id: http_announcement_source
    buffer_size: ${announcement_buffer_size}

  - platform: sendspin
    id: sendspin_source
    task_stack_in_psram: true
    decode_memory: psram
    buffer_size: ${sendspin_buffer_size}


media_player:
  - platform: sendspin
    id: sendspin_group_media_player
    on_state:
      then:
        - lambda: |-
            if (id(sendspin_group_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING &&
                id(mww).is_running()) {
              id(mww).stop();
            }

  - platform: speaker_source
    id: latter_media_player
    name: "Music"
    # Sendspin streams 48000 Hz stereo FLAC; speaker_source + resampler adapt to ${audio_out_rate} mono
    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      speaker: announcement_resampler
      sources:
        - http_announcement_source
    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: media_resampler
      sources:
        - sendspin_source
    volume_initial: 60%
    volume_increment: 5%
    volume_min: 10%
    volume_max: 100%
    on_state:
      then:
        - lambda: |-
            static int last_mp_state = -1;
            static float last_mp_vol = -1.0f;
            int cur_st = static_cast<int>(id(latter_media_player).state);
            float v = id(latter_media_player).volume;
            bool vol_valid = !std::isnan(v) && v > 0.0f;
            bool state_changed = (cur_st != last_mp_state);
            bool vol_changed = vol_valid && (last_mp_vol < 0.0f || std::fabs(v - last_mp_vol) >= 0.005f);
            if (!id(alarm_ringing) && !id(timer_ringing) && !id(find_my_active) &&
                !id(va_active) && !id(va_tts_received) &&
                id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING) {
              if (vol_valid && (vol_changed || state_changed)) {
                id(physical_speaker).set_volume(std::clamp(v, 0.10f, 1.0f));
              }
            }
            if (state_changed || vol_changed) {
              last_mp_state = cur_st;
              if (vol_valid) last_mp_vol = v;
              if (id(gui_page) == 2 && id(display_power_state) == 0 && !id(va_active)) {
                id(throttled_disp_update).execute();
              }
            }
    on_announcement:
      then:
        - script.stop: mp_idle_debounce
        - script.stop: sync_wake_word_state
        - script.stop: route_i2s_to_mic
        - script.stop: screen_sleep_timer
        - mixer_speaker.apply_ducking:
            id: media_mixing_input
            decibel_reduction: 50
            duration: 0.1s
        - mixer_speaker.apply_ducking:
            id: announcement_mixing_input
            decibel_reduction: 0
            duration: 0.05s
        - script.execute: route_i2s_to_spk
        - script.wait: route_i2s_to_spk
        - switch.turn_on: speaker_enable
        - lambda: |-
            float spk_v = latter_ui::alert_output_volume(id(alert_volume).state, id(latter_media_player).volume);
            id(physical_speaker).set_volume(spk_v);
            id(hal_set_dac_mute).execute(false);
            id(va_tts_received) = true;
            if (id(va_active)) {
              id(va_vad_active) = false;
              id(va_status_text) = "Responding...";
            }
        - script.execute: throttled_disp_update
    on_play:
      then:
        - if:
            condition:
              lambda: 'return !id(va_active) && !id(va_tts_received);'
            then:
              - lambda: |-
                  id(music_pos_sync_time) = millis();
                  if (!id(alarm_ringing) && !id(timer_ringing) && !id(find_my_active)) {
                    id(gui_page) = 2; // Auto-switch to Music Player screen on music playback start
                  }
                  id(sleep_start_time) = 0;
                  id(active_game) = 0;
              - script.stop: mp_idle_debounce
              - script.stop: sync_wake_word_state
              - script.stop: route_i2s_to_mic
              - if:
                  condition:
                    lambda: 'return !id(alarm_ringing) && !id(timer_ringing) && !id(find_my_active);'
                  then:
                    - mixer_speaker.apply_ducking:
                        id: media_mixing_input
                        decibel_reduction: 0
                        duration: 0.2s
                    - mixer_speaker.apply_ducking:
                        id: announcement_mixing_input
                        decibel_reduction: 50
                        duration: 0.1s
                    - lambda: |-
                        float v = id(latter_media_player).volume;
                        if (std::isnan(v) || v <= 0.0f) v = 0.60f;
                        id(physical_speaker).set_volume(std::clamp(v, 0.10f, 1.0f));
              - if:
                  condition:
                    lambda: 'return !id(speaker_enable).state || id(mww).is_running() || id(latter_mic).is_running();'
                  then:
                    - script.execute: route_i2s_to_spk
                    - script.wait: route_i2s_to_spk
                    - switch.turn_on: speaker_enable
              - lambda: 'id(hal_set_dac_mute).execute(false);'
              - if:
                  condition:
                    lambda: 'return id(display_power_state) != 0 || !id(display_brightness).remote_values.is_on();'
                  then:
                    - lambda: |-
                        latter_ui::screen_is_off_standby() = false;
                        id(display_power_state) = 0;
                        id(hal_set_imu_power_mode).execute(0x01);
                    - light.turn_on: display_brightness
              - lambda: |-
                  const std::string &art_u = latter_ui::media_state().art_url;
                  if (id(gui_page) == 2 &&
                      (!latter_ui::media_state().is_local || id(album_art).get_width() == 0) &&
                      !art_u.empty() &&
                      art_u != "none" &&
                      art_u != "unknown" &&
                      art_u != "unavailable" &&
                      art_u != id(current_loaded_art_url)) {
                    id(fetch_remote_art_debounced).execute();
                  }
              - script.execute: screen_sleep_timer
              - script.execute: throttled_disp_update
    on_pause:
      then:
        - lambda: |-
            if (id(music_pos_sync_time) > 0) {
              id(music_pos_base) += (millis() - id(music_pos_sync_time)) / 1000.0f;
              id(music_pos_sync_time) = 0;
            }
            if (id(display_power_state) == 0) {
              id(screen_sleep_timer).execute();
            }
        - script.execute: mp_idle_debounce
    on_idle:
      then:
        - if:
            condition:
              lambda: 'return id(va_active) || id(va_tts_received) || !id(va_status_text).empty();'
            then:
              - script.execute: va_tts_drain_and_finish
        - lambda: |-
            if (id(display_power_state) == 0) {
              id(screen_sleep_timer).execute();
            }
        - script.execute: mp_idle_debounce

micro_wake_word:
  id: mww
  microphone:
    microphone: latter_mic
    channels: 0
    gain_factor: 2
  task_stack_in_psram: false
  stop_after_detection: true
  vad:
  # At most 2 models run concurrently (enforced by ensure_wake_words_restored & poll_and_persist_wake_words).
  # Vendored hey_luna SHA-256: json=4A3618E366B28A82C7AFADC8E54CA726..., tflite=18A56BA916A5C7ADFF1D5D4F594EAADF...
  models:
    - model: okay_nabu
      id: okay_nabu
    - model: github://slampton/esphome-latter-core/models/hey_luna.json@main
      id: hey_luna
    - model: hey_jarvis
      id: hey_jarvis
    - model: hey_mycroft
      id: hey_mycroft
    - model: alexa
      id: alexa
  on_wake_word_detected:
    then:
      - lambda: |-
          id(last_detected_wake_word) = wake_word;
          ESP_LOGI("mww", "On-board wake word detected: %s", wake_word.c_str());
      - script.execute: trigger_va_from_wake_word

voice_assistant:
  id: va
  microphone: latter_mic
  micro_wake_word: mww
  use_wake_word: false
  media_player: latter_media_player
  noise_suppression_level: 2
  auto_gain: 31dBFS
  on_client_connected:
    then:
      - delay: 200ms
      - lambda: 'esphome::voice_assistant::ensure_wake_words_restored(id(mww));'
      - script.execute: apply_wake_word_sensitivities
      - script.execute: sync_wake_word_state
  on_listening:
    then:
      - lambda: |-
          latter_ui::log_audio_profile("VA_LISTEN_START");
          latter_ui::hal_set_wifi_power_save(0); // Ensure full-performance Wi-Fi during voice streaming
          if (latter_ui::cam_intercom_ptt_active()) {
            latter_ui::cam_intercom_status() = "SPEAK TO DOORBELL...";
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          if (!id(va_active)) {
            id(return_page) = id(gui_page);
            id(va_active) = true;
          }
      - if:
          condition:
            lambda: |-
              return !id(va_resume_music_after) &&
                     ((id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                      (!id(active_speaker_entity).empty() && latter_ui::media_state().state == "playing"));
          then:
            - script.execute: pause_all_music
            - delay: 150ms
      - script.stop: mp_idle_debounce
      - script.stop: screen_sleep_timer
      - script.execute: route_i2s_to_mic
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 0
          duration: 0.1s
      - lambda: |-
          if (id(display_power_state) != 0 && id(va_wake_screen_switch).state) {
            latter_ui::screen_is_off_standby() = false;
            id(display_power_state) = 0;
            id(disp1).start_poller();
            id(hal_set_imu_power_mode).execute(0x01);
            id(sync_display_brightness).execute();
          }
          id(va_was_cancelled) = false;
          id(va_vad_active) = false;
          id(va_tts_received) = false;
          latter_ui::va_session_state().active = true;
          latter_ui::va_session_state().tts_received = false;
          if (latter_ui::cam_intercom_ptt_active()) {
            id(va_status_text) = "";
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          id(va_status_text) = "Listening...";
          ESP_LOGI("va", "Status: Listening...");
          if (id(display_power_state) == 0 || id(va_wake_screen_switch).state) {
            id(display_brightness).turn_on().perform();
            latter_ui::schedule_disp_update(&id(disp1));
          }
  on_stt_vad_start:
    then:
      - script.stop: screen_sleep_timer
      - lambda: |-
          latter_ui::log_audio_profile("VA_VAD_START");
          id(va_vad_active) = true;
          if (latter_ui::cam_intercom_ptt_active()) {
            latter_ui::cam_intercom_status() = "CAPTURING VOICE...";
          } else {
            id(va_status_text) = "Listening...";
          }
          ESP_LOGI("va", "Status: Listening (VAD active)...");
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  on_stt_vad_end:
    then:
      - script.stop: screen_sleep_timer
      - lambda: |-
          latter_ui::log_audio_profile("VA_VAD_END");
          esphome::voice_assistant::stop_va_microphone(id(va));
          id(va_vad_active) = false;
          if (latter_ui::cam_intercom_ptt_active()) {
            latter_ui::cam_intercom_status() = "PROCESSING AUDIO...";
          } else {
            id(va_status_text) = "Thinking...";
          }
          ESP_LOGI("va", "Status: Thinking...");
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  on_stt_end:
    then:
      - script.stop: screen_sleep_timer
      - lambda: 'esphome::voice_assistant::stop_va_microphone(id(va));'
      - script.execute: route_i2s_to_spk
      - lambda: |-
          latter_ui::log_audio_profile("VA_STT_END", x.c_str());
          id(va_vad_active) = false;
          if (latter_ui::cam_intercom_ptt_active() || latter_ui::cam_call_active()) {
            latter_ui::cam_intercom_ptt_active() = false;
            id(va_active) = false;
            id(va_status_text) = "";
            esphome::voice_assistant::abort_voice_assistant(id(va));
            if (!x.empty()) {
              id(cam_intercom_action) = "talk_message";
              id(cam_intercom_message) = x;
              latter_ui::cam_intercom_status() = "SENT TO DOORBELL";
              id(cam_intercom_status_ms) = millis();
              id(send_doorbell_intercom_cmd).execute();
            } else {
              latter_ui::cam_intercom_status() = latter_ui::cam_call_active() ? "2-WAY CALL ACTIVE" : "";
            }
            if (latter_ui::cam_call_active()) {
              id(rearm_doorbell_duplex_mic).execute();
            }
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          id(va_status_text) = "Thinking...";
          // Only clear va_resume_music_after when the utterance explicitly pauses/stops media playback
          // (never on non-media commands such as "stop the fan" or "stop the timer")
          std::string utt = x;
          for (char &c : utt) {
            c = static_cast<char>(::tolower(static_cast<unsigned char>(c)));
            if (c == '.' || c == ',' || c == '!' || c == '?') c = ' ';
          }
          while (!utt.empty() && utt.front() == ' ') utt.erase(utt.begin());
          while (!utt.empty() && utt.back() == ' ') utt.pop_back();
          const bool mentions_media = (utt.find("music") != std::string::npos ||
                                       utt.find("speaker") != std::string::npos ||
                                       utt.find("audio") != std::string::npos ||
                                       utt.find("song") != std::string::npos ||
                                       utt.find("track") != std::string::npos ||
                                       utt.find("player") != std::string::npos ||
                                       utt.find("playing") != std::string::npos ||
                                       utt.find("playback") != std::string::npos);
          const bool bare_pause_or_stop = (utt == "pause" || utt == "stop");
          const bool media_pause_or_stop = mentions_media &&
                                           (utt.find("pause") != std::string::npos ||
                                            utt.find("stop") != std::string::npos ||
                                            utt.find("turn off") != std::string::npos);
          if (bare_pause_or_stop || media_pause_or_stop) {
            id(va_resume_music_after) = false;
            ESP_LOGI("va", "Stop/Pause media intent detected: clearing va_resume_music_after");
          }
          ESP_LOGI("va", "STT End (hidden): %s", x.c_str());
  on_intent_progress:
    then:
      - if:
          condition:
            lambda: 'return !x.empty();'
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 50
                duration: 0.1s
            - mixer_speaker.apply_ducking:
                id: announcement_mixing_input
                decibel_reduction: 0
                duration: 0.05s
            - script.stop: screen_sleep_timer
            - script.execute: route_i2s_to_spk
            - script.wait: route_i2s_to_spk
            - lambda: |-
                float spk_v = latter_ui::alert_output_volume(id(alert_volume).state, id(latter_media_player).volume);
                id(physical_speaker).set_volume(spk_v);
                id(hal_set_dac_mute).execute(false);
                id(va_vad_active) = false;
                id(va_tts_received) = true;
                if (id(va_active)) {
                  id(va_status_text) = "Responding...";
                }
                ESP_LOGI("va", "Status: Responding (Streaming TTS)...");
            - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  on_tts_start:
    then:
      - lambda: 'latter_ui::log_audio_profile("VA_TTS_START");'
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 50
          duration: 0.1s
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 0
          duration: 0.05s
      - script.stop: screen_sleep_timer
      - script.execute: route_i2s_to_spk
      - script.wait: route_i2s_to_spk
      - lambda: |-
          float spk_v = latter_ui::alert_output_volume(id(alert_volume).state, id(latter_media_player).volume);
          id(physical_speaker).set_volume(spk_v);
          id(hal_set_dac_mute).execute(false);
          id(va_vad_active) = false;
          id(va_tts_received) = true;
          if (id(va_active)) {
            id(va_status_text) = "Responding...";
          }
          ESP_LOGI("va", "Status: Responding (TTS)...");
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  on_tts_end:
    then:
      - script.stop: screen_sleep_timer
      - script.execute: route_i2s_to_spk
      - script.wait: route_i2s_to_spk
      - lambda: 'id(hal_set_dac_mute).execute(false);'
      - lambda: |-
          id(va_vad_active) = false;
          id(va_tts_received) = true;
          if (id(va_active)) {
            id(va_status_text) = "Responding...";
          }
          ESP_LOGI("va", "TTS URL ready: %s", x.c_str());
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  on_error:
    then:
      - script.stop: va_tts_drain_and_finish
      - lambda: |-
          esphome::voice_assistant::abort_voice_assistant(id(va));
          latter_ui::cam_intercom_ptt_active() = false;
          id(va_vad_active) = false;
          id(va_tts_received) = false;
          id(va_active) = false;
          id(va_status_text) = "";
          if (id(return_page) >= 0) id(gui_page) = id(return_page);
          if (id(display_power_state) == 2 && !id(usb_connected).state &&
              id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) {
            latter_ui::hal_set_wifi_power_save(2);
          }
          ESP_LOGE("va", "Error: %s - %s", code.c_str(), message.c_str());
      - script.execute: resume_music_after_va
      - script.execute: mp_idle_debounce
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
      - script.execute: screen_sleep_timer
  on_timer_started:
    then:
      - lambda: |-
          ESP_LOGI("va_timer", "Timer started via Assist: %s (%lu sec)", timer.name.c_str(), (unsigned long)timer.total_seconds);
          uint32_t now_t = millis();
          latter_ui::upsert_voice_timer_slot(timer.id, timer.name, timer.total_seconds, timer.seconds_left, timer.is_active, now_t);
          id(va_timer_name) = timer.name;
          latter_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
          id(timer_ringing) = false;
          if (!id(va_active) && id(va_status_text).empty()) {
            if (id(gui_page) == 8 && id(tools_subpage) == 1 && id(display_power_state) == 0) {
              latter_ui::schedule_disp_update(&id(disp1));
            }
          }
  on_timer_updated:
    then:
      - lambda: |-
          ESP_LOGI("va_timer", "Timer updated via Assist: %s (left: %lu sec, active: %d)", timer.name.c_str(), (unsigned long)timer.seconds_left, timer.is_active);
          uint32_t now_t = millis();
          latter_ui::upsert_voice_timer_slot(timer.id, timer.name, timer.total_seconds, timer.seconds_left, timer.is_active, now_t);
          latter_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
          if (!id(va_active) && id(va_status_text).empty()) {
            if (id(gui_page) == 8 && id(tools_subpage) == 1 && id(display_power_state) == 0) {
              latter_ui::schedule_disp_update(&id(disp1));
            }
          }
  on_timer_cancelled:
    then:
      - lambda: |-
          ESP_LOGI("va_timer", "Timer cancelled via Assist: %s", timer.name.c_str());
          auto *slots = latter_ui::timer_slots();
          for (int i = 0; i < 3; i++) {
            if ((!timer.id.empty() && slots[i].id == timer.id) || (!timer.name.empty() && slots[i].name == timer.name)) {
              slots[i].running = false;
              slots[i].paused = false;
              slots[i].remaining_sec = slots[i].duration_sec;
            }
          }
          latter_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
          const bool was_ringing = id(timer_ringing);
          id(timer_ringing) = false;
          if (was_ringing) {
            id(stop_alarm_sound).execute();
          }
          if (!id(va_active) && id(va_status_text).empty()) {
            if (id(gui_page) == 8 && id(tools_subpage) == 1 && id(display_power_state) == 0) {
              latter_ui::schedule_disp_update(&id(disp1));
            }
          }
  on_timer_finished:
    then:
      - lambda: |-
          ESP_LOGI("va_timer", "Timer finished via Assist: %s", timer.name.c_str());
          auto *slots = latter_ui::timer_slots();
          std::string fired_name = timer.name;
          for (int i = 0; i < 3; i++) {
            if ((!timer.id.empty() && slots[i].id == timer.id) || (!timer.name.empty() && slots[i].name == timer.name)) {
              if (fired_name.empty()) fired_name = slots[i].name;
              slots[i].running = false;
              slots[i].paused = false;
              slots[i].remaining_sec = slots[i].duration_sec; // Keep duration & name saved as a reusable preset!
            }
          }
          latter_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
          if (id(va_active) || !id(va_status_text).empty()) {
            id(cancel_voice_assistant).execute();
          }
          if (!id(timer_ringing)) {
            id(va_timer_name) = fired_name;
            id(timer_ringing) = true;
            latter_ui::note_wake_reason(latter_ui::WakeReason::ALERT);
            id(wake_to_active_state).execute();
            id(play_alarm_sound).execute();
          }
  on_end:
    then:
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
          timeout: 25s
      - if:
          condition:
            lambda: 'return id(va_active) || id(va_tts_received) || !id(va_status_text).empty();'
          then:
            - script.execute: va_tts_drain_and_finish


script:
  - id: va_tts_drain_and_finish
    mode: restart
    then:
      # 1a. Wait for speaker_source to finish decoding the TTS stream (up to 60s for multi-sentence responses)
      - wait_until:
          condition:
            lambda: |-
              return (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING) ||
                     (!id(va_active) && !id(va_tts_received));
          timeout: 60s
      # 1b. Bounded wait on announcement_mixing_input (<= 1s buffer_duration + 2s margin)
      - wait_until:
          condition:
            lambda: |-
              return !id(announcement_mixing_input).is_running() ||
                     (!id(va_active) && !id(va_tts_received));
          timeout: !lambda 'return (${announcement_buffer_s} + 2) * 1000;'
      - delay: 250ms
      # 2. If VoiceAssistant automatically re-entered listening for continued_conversation / ask_question,
      #    keep the session active and let on_listening own the next turn.
      - if:
          condition:
            lambda: 'return id(va).is_running();'
          then:
            - script.stop: va_tts_drain_and_finish
      # 3. Normal completion: exit the overlay without calling abort_voice_assistant(id(va)),
      #    preserving conversation_id and native continued-conversation state.
      - lambda: |-
          latter_ui::log_audio_profile("VA_DRAIN_FINISH");
          const bool was_va_session = id(va_active);
          id(va_vad_active) = false;
          id(va_status_text) = "";
          id(va_tts_received) = false;
          id(va_active) = false;
          latter_ui::va_session_state().active = false;
          latter_ui::va_session_state().tts_received = false;
          if (was_va_session) {
            id(gui_page) = id(return_page);
          }
          if (id(display_power_state) == 2 && !id(usb_connected).state &&
              id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) {
            latter_ui::hal_set_wifi_power_save(1);
          }
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
      - delay: 160ms
      # 4. Smoothly restore music playback or mute & route I2S back to mic
      - script.execute: resume_music_after_va
      - script.execute: screen_sleep_timer
  - id: route_i2s_to_spk
    mode: restart
    then:
      - script.stop: sync_wake_word_state
      - script.stop: route_i2s_to_mic
      - if:
          condition:
            micro_wake_word.is_running:
          then:
            - micro_wake_word.stop:
      - lambda: |-
          esphome::voice_assistant::stop_va_microphone(id(va));
      - if:
          condition:
            lambda: 'return id(latter_mic).is_running();'
          then:
            - wait_until:
                condition:
                  lambda: 'return !id(latter_mic).is_running();'
                timeout: 150ms
      - lambda: 'id(hal_set_audio_codecs_standby).execute(false);'
      - script.execute: hal_route_i2s_to_spk
      - switch.turn_on: speaker_enable

  - id: route_i2s_to_mic
    mode: restart
    then:
      - lambda: 'id(hal_set_dac_mute).execute(true);'
      - switch.turn_off: speaker_enable
      - if:
          condition:
            lambda: 'return id(physical_speaker).is_running();'
          then:
            - lambda: 'id(physical_speaker).stop();'
            - wait_until:
                condition:
                  lambda: 'return !id(physical_speaker).is_running();'
                timeout: 150ms
      - script.execute: hal_route_i2s_to_mic

  - id: apply_wake_word_sensitivities
    mode: restart
    then:
      - lambda: |-
          auto apply_cutoffs = [](const std::string &opt, uint8_t low_c, uint8_t med_c, uint8_t high_c) -> uint8_t {
            if (opt == "Slightly sensitive") return low_c;
            if (opt == "Very sensitive") return high_c;
            return med_c;
          };
          // Calibrated TFLite 50Hz streaming cutoffs (Slightly=247/~97%, Moderately=237/~93%, Very=224/~88%)
          id(okay_nabu).set_probability_cutoff(
              apply_cutoffs(id(ww_sens_okay_nabu).current_option(), 247, 237, 224));
          id(hey_luna).set_probability_cutoff(
              apply_cutoffs(id(ww_sens_hey_luna).current_option(), 248, 239, 226));
          id(hey_jarvis).set_probability_cutoff(
              apply_cutoffs(id(ww_sens_hey_jarvis).current_option(), 247, 237, 224));
          id(hey_mycroft).set_probability_cutoff(
              apply_cutoffs(id(ww_sens_hey_mycroft).current_option(), 248, 239, 226));
          id(alexa).set_probability_cutoff(
              apply_cutoffs(id(ww_sens_alexa).current_option(), 247, 237, 224));

  - id: sync_wake_word_state
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              // Hardware note (§5.3): All 5 flagship boards share BCLK/WS/MCLK between ES8311 DAC and ES7210/ES8311 ADC
              // (half-duplex I2S clock routing), so MWW must pause while physical_speaker is actively streaming audio.
              // Image/camera fetches run in 16 KB slices with <=2 concurrent MWW models and do NOT suspend MWW.
              const bool va_busy = id(va_active) || id(va).is_running() || !id(va_status_text).empty() ||
                                   id(va_tts_received) || id(announcement_mixing_input).is_running();
              const bool media_busy = id(mp_idle_debounce).is_running() || id(va_resume_music_after) ||
                                      id(media_mixing_input).is_running() ||
                                      (id(sendspin_group_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                                      (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                                      (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING);
              const bool alert_or_tool_busy = id(alarm_ringing) || id(timer_ringing) || id(find_my_active) ||
                                              (id(active_game) > 0) ||
                                              latter_ui::cam_call_active() || latter_ui::cam_listen_active();
              const bool sys_busy = id(is_hibernating) || id(ota_in_progress) ||
                                    !id(wifi_ctrl).is_connected() || (millis() < 12000U);
              return latter_ui::wake_word_should_run(
                  id(va_wake_word_mode).current_option(),
                  id(usb_connected).state,
                  va_busy, media_busy, alert_or_tool_busy, sys_busy);
          then:
            - if:
                condition:
                  not:
                    micro_wake_word.is_running:
                then:
                  - lambda: |-
                      id(hal_set_audio_codecs_standby).execute(false);
                      esphome::voice_assistant::ensure_wake_words_restored(id(mww));
                  - script.execute: route_i2s_to_mic
                  - script.wait: route_i2s_to_mic
                  - delay: 25ms
                  - script.execute: apply_wake_word_sensitivities
                  - if:
                      condition:
                        lambda: |-
                          return !id(mww).is_running() &&
                                 !id(va_active) && !id(va).is_running() &&
                                 !id(media_mixing_input).is_running() &&
                                 (id(sendspin_group_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
                                 (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
                                 (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING);
                      then:
                        - micro_wake_word.start:
                        - wait_until:
                            condition:
                              lambda: 'return id(latter_mic).is_running();'
                            timeout: 100ms
                        - lambda: |-
                            id(hal_set_audio_codecs_standby).execute(false);
                            ESP_LOGI("mww", "Wake word detection ARMED (ww1='%s', ww2='%s', mode='%s')",
                                     esphome::voice_assistant::last_persisted_ww1().c_str(),
                                     esphome::voice_assistant::last_persisted_ww2().c_str(),
                                     id(va_wake_word_mode).current_option().c_str());
          else:
            - if:
                condition:
                  micro_wake_word.is_running:
                then:
                  - micro_wake_word.stop:
                  - lambda: |-
                      ESP_LOGI("mww", "Wake word detection PAUSED (mode='%s', usb=%d)",
                               id(va_wake_word_mode).current_option().c_str(),
                               (int)id(usb_connected).state);

  - id: trigger_va_from_wake_word
    mode: restart
    then:
      - lambda: |-
          latter_ui::hal_set_wifi_power_save(0);
          id(hal_set_audio_codecs_standby).execute(false);
          if (id(display_power_state) != 0 || !id(display_brightness).current_values.is_on()) {
            if (id(va_wake_screen_switch).state) {
              latter_ui::note_wake_reason(latter_ui::WakeReason::VOICE);
              id(wake_to_active_state).execute();
            }
          } else {
            id(screen_sleep_timer).execute();
          }
          id(va_tts_received) = false;
      - script.execute: route_i2s_to_mic
      - script.wait: route_i2s_to_mic
      - voice_assistant.start:
          wake_word: !lambda 'return id(last_detected_wake_word);'

  - id: play_alarm_sound
    mode: restart
    then:
      - script.stop: mp_idle_debounce
      - script.stop: cancel_voice_assistant
      - script.stop: va_tts_drain_and_finish
      - script.stop: resume_music_after_va
      # Duck local music first and let the already-buffered (unducked) samples drain through the
      # mixer + I2S buffers before the DAC volume jumps to alert level. Raising the volume first
      # replayed ~0.25-0.5 s of music at alert volume (static on S3 speakers, a click on P4).
      - if:
          condition:
            media_player.is_playing: latter_media_player
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 50
                duration: 0.05s
            - delay: 400ms
      # Only re-route when the speaker path is not already active (music already owns it).
      - if:
          condition:
            lambda: 'return !id(speaker_enable).state || id(mww).is_running() || id(latter_mic).is_running();'
          then:
            - script.execute: route_i2s_to_spk
            - script.wait: route_i2s_to_spk
      - lambda: |-
          // Find My Device always plays at the 0.90 ceiling; alarms/timers follow the Alert Volume model.
          const float alert_v = id(find_my_active)
              ? 0.90f
              : latter_ui::alert_output_volume(id(alert_volume).state, id(latter_media_player).volume);
          id(physical_speaker).set_volume(alert_v);
          id(hal_set_dac_mute).execute(false);
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 0
          duration: 0.05s
      - while:
          condition:
            lambda: "return id(alarm_ringing) || id(timer_ringing) || id(find_my_active);"
          then:
            - if:
                condition:
                  not:
                    rtttl.is_playing:
                then:
                  - rtttl.play:
                      id: alarm_rtttl
                      rtttl: !lambda |-
                        if (id(find_my_active)) {
                          return std::string("findmy:d=16,o=6,b=180:e,a,e7,a7,p,e,a,e7,a7,p,e,a,e7,a7");
                        }
                        return std::string("alarm:d=16,o=6,b=160:c,e,g,c7,p,c,e,g,c7,p,c,e,g,c7");
            - wait_until:
                condition:
                  not:
                    rtttl.is_playing:
                timeout: 8s
            - delay: 800ms

  - id: play_game_sfx
    mode: restart
    parameters:
      sfx_id: int
    then:
      - script.stop: mp_idle_debounce
      - rtttl.stop:
          id: alarm_rtttl
      - if:
          condition:
            lambda: 'return !id(speaker_enable).state;'
          then:
            - script.execute: route_i2s_to_spk
            - switch.turn_on: speaker_enable
            - lambda: |-
                id(physical_speaker).set_volume(
                    latter_ui::alert_output_volume(id(alert_volume).state, id(latter_media_player).volume));
                id(hal_set_dac_mute).execute(false);
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 0
          duration: 0.01s
      - rtttl.play:
          id: alarm_rtttl
          rtttl: !lambda |-
            switch (sfx_id) {
              case 1:  return std::string("c1:d=16,o=5,b=260:g,c6,p,a,d6");
              case 2:  return std::string("c2:d=16,o=5,b=260:d6,g,p,c6,f");
              case 3:  return std::string("c3:d=16,o=5,b=270:f,c6,p,d6,g");
              case 4:  return std::string("c4:d=16,o=5,b=285:g,b,d6,p,a,c6");
              case 5:  return std::string("win:d=16,o=6,b=220:c,e,g,c7,p,g,8c7");
              case 6:  return std::string("sink:d=32,o=6,b=280:c,e,g,16c7");
              case 7:  return std::string("peg:d=32,o=6,b=320:a,e7");
              case 8:  return std::string("bow:d=32,o=5,b=320:g,d6");
              case 9:  return std::string("bull:d=16,o=6,b=260:e,g,c7,8e7");
              case 10: return std::string("hit:d=32,o=5,b=280:a,e6");
              case 11: return std::string("pad:d=32,o=5,b=320:f,a");
              case 12: return std::string("brk:d=32,o=6,b=300:c,g");
              case 13: return std::string("arm:d=32,o=5,b=320:a,e");
              case 14: return std::string("lose:d=16,o=5,b=180:g,e,8c");
              default: return std::string("c1:d=16,o=5,b=260:g,c6,p,a,d6");
            }
      - if:
          condition:
            lambda: 'return id(active_game) == 0;'
          then:
            - script.execute: mp_idle_debounce
  - id: stop_alarm_sound
    mode: restart
    then:
      - rtttl.stop:
          id: alarm_rtttl
      - script.stop: play_alarm_sound
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 0
          duration: 0.05s
      - if:
          condition:
            media_player.is_playing: latter_media_player
          then:
            # Lower the DAC to the music volume before un-ducking the music, so buffered music
            # never plays back at alert volume.
            - lambda: |-
                float v = id(latter_media_player).volume;
                if (std::isnan(v) || v <= 0.0f) v = 0.60f;
                id(physical_speaker).set_volume(std::clamp(v, 0.10f, 1.0f));
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 0.2s
          else:
            - if:
                condition:
                  lambda: 'return id(va_resume_music_after) && !id(va_active) && !id(va_tts_received);'
                then:
                  - script.execute: resume_music_after_va
                else:
                  - if:
                      condition:
                        lambda: |-
                          return !id(va_active) && !id(va_tts_received) &&
                                 !id(va).is_running() && !id(announcement_mixing_input).is_running() &&
                                 !latter_ui::cam_call_active() && !latter_ui::cam_listen_active() &&
                                 (id(active_game) == 0);
                      then:
                        - lambda: 'id(hal_set_dac_mute).execute(true);'
                        - switch.turn_off: speaker_enable
                        - script.execute: route_i2s_to_mic
                        - script.execute: sync_wake_word_state

number:
  - platform: template
    name: "Sound: Volume Step Size"
    id: volume_step_size
    optimistic: true
    min_value: 1
    max_value: 10
    step: 1
    initial_value: 5
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
    icon: "mdi:volume-step"
    entity_category: config

  - platform: template
    name: "Sound: Alert Volume"
    id: alert_volume
    optimistic: true
    min_value: 20
    max_value: 100
    step: 5
    initial_value: 80
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
    icon: "mdi:volume-high"
    entity_category: config
