  - id: music_seek_relative
    mode: restart
    parameters:
      dir: int
    then:
      - delay: 0ms
      - lambda: |-
          auto &m = latter_ui::runtime_state().music;
          uint32_t now_ms = millis();
          latter_ui::audio_session().set_play_intent(latter_ui::MusicPlayIntent::TrackAdvanceOrSeek, now_ms);
          if (now_ms - m.skip_last_tap_ms < 1000U) {
            m.skip_burst_count++;
          } else {
            m.skip_burst_count = 1;
          }
          m.skip_last_tap_ms = now_ms;

          float step_sec = 10.0f;
          const char *label = "-10s Replay";
          if (dir < 0) {
            switch (m.skip_burst_count) {
              case 1: step_sec = 10.0f; label = "-10s Replay"; break;
              case 2: step_sec = 30.0f; label = "-30s Replay"; break;
              case 3: step_sec = 60.0f; label = "-1m Replay"; break;
              case 4: step_sec = 120.0f; label = "-2m Replay"; break;
              default: step_sec = 300.0f; label = "-5m Replay"; break;
            }
          } else {
            switch (m.skip_burst_count) {
              case 1: step_sec = 30.0f; label = "+30s Skip"; break;
              case 2: step_sec = 60.0f; label = "+1m Skip"; break;
              case 3: step_sec = 120.0f; label = "+2m Skip"; break;
              case 4: step_sec = 300.0f; label = "+5m Skip"; break;
              default: step_sec = 600.0f; label = "+10m Skip"; break;
            }
          }

          m.action_feedback = label;
          m.feedback_timer = now_ms;

          float cur_pos = m.pos_base;
          if (m.pos_sync_time > 0) {
            cur_pos += static_cast<float>(now_ms - m.pos_sync_time) / 1000.0f;
          }
          float new_pos = 0.0f;
          if (dir < 0) {
            new_pos = std::max(0.0f, cur_pos - step_sec);
          } else {
            float dur = latter_ui::media_state().duration;
            new_pos = (!std::isnan(dur) && dur > 0.0f) ? std::min(dur, cur_pos + step_sec) : (cur_pos + step_sec);
          }
          m.pos_base = new_pos;
          m.pos_sync_time = now_ms;
          latter_actions::emit_media_seek(static_cast<int>(std::max(0.0f, new_pos)));

  - id: music_seek_absolute
    mode: restart
    then:
      - delay: 0ms
      - lambda: |-
          latter_ui::audio_session().set_play_intent(latter_ui::MusicPlayIntent::TrackAdvanceOrSeek, millis());
          latter_actions::emit_media_seek(
              static_cast<int>(std::max(0.0f, latter_ui::runtime_state().music.pos_base)));

  - id: fetch_music_browse
    mode: restart
    then:
      - lambda: |-
          const auto &rs = latter_ui::runtime_state();
          const std::string &mode_s = rs.music.selected_category_mode;
          const int page = rs.slot_page_for(latter_rpc::SlotChannel::MUSIC);
          std::string search_str;
          if (mode_s == "artist_albums") {
            search_str = rs.music.drilldown_artist_name;
          } else if (mode_s == "current_album_tracks" || mode_s == "album_tracks" ||
                     mode_s == "podcast_episodes" || mode_s == "lyrics" || mode_s == "bio") {
            search_str = rs.music.drilldown_album_id;
          }
          const std::string_view alb_opt(latter_ui::pref_album_sort_order_cstr());
          const char *alb_sort = (alb_opt == "Newest on Top") ? "year_desc" : ((alb_opt == "Oldest on Top") ? "year" : "name");
          const std::string_view art_opt(latter_ui::pref_artist_album_sort_order_cstr());
          const char *art_sort = (art_opt == "Alphabetical") ? "name" : ((art_opt == "Newest on Top") ? "year_desc" : "year");
          const std::string_view pod_opt(latter_ui::pref_podcast_sort_order_cstr());
          const char *pod_sort = (pod_opt == "Oldest on Top") ? "oldest" : "newest";
          latter_actions::emit_music_browse(
              mode_s, page, search_str, rs.music.active_speaker_entity,
              latter_ui::media_state().last_speaker, alb_sort, art_sort, pod_sort, LATTER_SLOT_COUNT, millis());

  - id: play_music_slot
    mode: restart
    parameters:
      slot: int
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          auto &m = rs.music;
          const int idx = std::clamp(slot - 1, 0, 4);
          const auto &item = rs.music_slots()[idx];
          m.selected_slot_name = item.name;
          m.selected_slot_id   = item.id;
          m.selected_slot_type = item.type;

          if (m.active_speaker_entity.empty()) {
            m.active_speaker_entity = latter_ui::media_state().local_speaker;
            latter_ui::media_state().is_local = !latter_ui::media_state().local_speaker.empty();
          }
          if (m.selected_category_mode == "artist") {
            m.selected_slot_type = "artist";
          } else if (m.selected_category_mode == "album" || m.selected_category_mode == "artist_albums") {
            m.selected_slot_type = "album";
          } else if (m.selected_category_mode == "podcast_episodes") {
            m.selected_slot_type = "podcast_episode";
          } else if (m.selected_slot_type.empty()) {
            m.selected_slot_type = "music";
          }
          const uint32_t now_ms = millis();
          m.action_feedback = "Playing: " + m.selected_slot_name;
          m.feedback_timer = now_ms;
          latter_ui::audio_session().set_play_intent(latter_ui::MusicPlayIntent::ExternalOrUserExplicit, now_ms);
          latter_ui::set_remote_play_override(true, now_ms);
          if (m.selected_category_mode == "podcast_episodes") {
            m.active_playback_media_type = "podcast";
          } else if (m.selected_category_mode == "audiobook") {
            m.active_playback_media_type = "audiobook";
          } else {
            m.active_playback_media_type = "music";
          }
          m.overlay_mode = 0;
          m.hud_active = true;
          m.hud_timer = millis();
          if (latter_ui::media_state().is_local && id(mww).is_running()) {
            id(mww).stop();
          }
          latter_actions::emit_media_play_item(
              m.active_speaker_entity, m.selected_slot_id, m.selected_slot_type, "replace");
          latter_ui::schedule_disp_update(&id(disp1));

  - id: activate_selected_speaker
    mode: restart
    parameters:
      prefix: string
      transfer_queue: string
    then:
      - lambda: |-
          auto &m = latter_ui::runtime_state().music;
          auto &ms = latter_ui::media_state();
          const uint32_t now_ms = millis();
          const bool local_playing = (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          const bool was_playing = latter_ui::is_music_playing_effective(
              !ms.is_local, local_playing, ms.state, now_ms);
          if (m.target_speaker_id.rfind("media_player.", 0) == 0) {
            if (m.active_speaker_entity != m.target_speaker_id && !m.active_speaker_entity.empty()) {
              ms.last_speaker = m.active_speaker_entity;
            }
            m.active_speaker_entity = m.target_speaker_id;
            m.active_speaker_name = m.target_speaker_name;
            m.action_feedback = prefix + m.target_speaker_name;
          } else {
            ESP_LOGW("ui", "Rejecting non-media_player target: %s", m.target_speaker_id.c_str());
            m.action_feedback = "Invalid Speaker";
          }
          m.feedback_timer = now_ms;
          const std::string &loc_spk = ms.local_speaker;
          const bool new_is_local = (!loc_spk.empty() && m.active_speaker_entity == loc_spk);
          ms.active_speaker = m.active_speaker_entity;
          ms.speaker_name = m.active_speaker_name;
          ms.is_local = new_is_local;
          if (transfer_queue == "true" && was_playing && !new_is_local) {
            ms.state = "playing";
            latter_ui::set_remote_play_override(true, now_ms);
          } else {
            latter_ui::clear_remote_play_override();
          }
          latter_ui::sync_audio_session_media_observation(
              local_playing && new_is_local,
              id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PAUSED,
              now_ms);
          m.overlay_mode = 0;
          m.direct_nav = false;
          m.hud_active = true;
          m.hud_timer = now_ms;
          latter_actions::emit_set_active_speaker(m.active_speaker_entity, transfer_queue == "true");
      - if:
          condition:
            lambda: 'return !latter_ui::media_state().is_local;'
          then:
            - lambda: 'id(hal_set_dac_mute).execute(true);'
            - switch.turn_off: speaker_enable
      - script.execute: fetch_remote_art_debounced
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'

  - id: speaker_transfer_to_target
    mode: restart
    then:
      - script.execute:
          id: activate_selected_speaker
          prefix: "Transferring -> "
          transfer_queue: "true"

  - id: speaker_control_target
    mode: restart
    then:
      - script.execute:
          id: activate_selected_speaker
          prefix: "Controlling: "
          transfer_queue: "false"

  - id: speaker_join_target
    mode: restart
    then:
      - delay: 0ms
      - lambda: |-
          auto &m = latter_ui::runtime_state().music;
          m.action_feedback = "Joining -> " + m.target_speaker_name;
          m.feedback_timer = millis();
          m.overlay_mode = 0;
          m.hud_active = true;
          m.hud_timer = millis();
          if (latter_ui::media_state().is_local && id(mww).is_running()) {
            id(mww).stop();
          }
          latter_actions::emit_speaker_join(m.active_speaker_entity, m.target_speaker_id);
          latter_ui::schedule_disp_update(&id(disp1));

  - id: speaker_unjoin_target
    mode: restart
    then:
      - delay: 0ms
      - lambda: |-
          auto &m = latter_ui::runtime_state().music;
          m.action_feedback = "Unjoining -> " + m.target_speaker_name;
          m.feedback_timer = millis();
          latter_actions::emit_speaker_unjoin(m.target_speaker_id);
          const std::string &loc_spk = latter_ui::media_state().local_speaker;
          if (m.target_speaker_id == m.active_speaker_entity ||
              (!loc_spk.empty() && m.target_speaker_id == loc_spk)) {
            m.active_speaker_entity = loc_spk;
