# Core Subsystem: Audio & Voice Assistant (Hardware I2S & Codecs defined in boards/*.yaml HAL)

substitutions:
  announcement_buffer_s: "1"

# FLAC decoder (microFLAC) buffers in PSRAM
audio:
  codecs:
    flac:
      buffer_memory: psram


speaker:
  - id: mixing_speaker
    platform: mixer
    output_speaker: physical_speaker
    num_channels: ${audio_out_channels}
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        buffer_duration: ${announcement_buffer_s}s
        timeout: 500ms
      - id: media_mixing_input
        timeout: 1500ms
      # Chimes, alarms and game sounds (latter_sound_player): their own input, so they duck and drain
      # independently of TTS and music.
      - id: sound_mixing_input
        buffer_duration: 500ms
        timeout: 500ms


# No sample-rate conversion on the device: every source arrives at ${audio_out_rate} (Sendspin's
# sample_rate, the speaker_source pipelines' preferred format for Home Assistant, the sounds rendered
# per rate by tools/gen_sounds.py), and the mixer folds stereo to the panel's ${audio_out_channels}
# channel(s). On a full-duplex bus the speaker accepts no other format.
#
# Sounds are embedded WAV files (no decode cost) for this board's ${audio_out_rate}. ESPHome's rtttl
# synthesizes at a fixed 16 kHz, so it cannot feed a 48 kHz mixer.
audio_file:
  - id: sound_alarm
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/alarm.wav
  - id: sound_find_my
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/find_my.wav
  - id: sound_sfx_1
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_1.wav
  - id: sound_sfx_2
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_2.wav
  - id: sound_sfx_3
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_3.wav
  - id: sound_sfx_4
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_4.wav
  - id: sound_sfx_5
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_5.wav
  - id: sound_sfx_6
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_6.wav
  - id: sound_sfx_7
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_7.wav
  - id: sound_sfx_8
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_8.wav
  - id: sound_sfx_9
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_9.wav
  - id: sound_sfx_10
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_10.wav
  - id: sound_sfx_11
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_11.wav
  - id: sound_sfx_12
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_12.wav
  - id: sound_sfx_13
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_13.wav
  - id: sound_sfx_14
    file: https://raw.githubusercontent.com/slampton/esphome-latter-core/main/sounds/${audio_out_rate}/sfx_14.wav

# Internal RAM is the scarce resource on the S3 boards (measured with System: Log Memory Report), so the
# Sendspin hub's protocol, artwork and HTTP-server stacks live in PSRAM: they stay allocated whenever
# Music Assistant is connected, even when nothing plays. The wake-word and I2S speaker tasks keep their
# internal stacks for timing.
sendspin:
  id: sendspin_hub
  task_stack_in_psram: true


media_source:
  - platform: audio_http
    id: http_announcement_source
    buffer_size: ${announcement_buffer_size}
    task_stack_in_psram: true  # reader (6 KB with TLS 1.3) + decoder stacks persist after the first TTS

  - platform: sendspin
    id: sendspin_source
    task_stack_in_psram: true
    decode_memory: psram
    buffer_size: ${sendspin_buffer_size}
    sample_rate: ${audio_out_rate}  # Music Assistant converts server-side; the device never resamples

  - platform: audio_file
    id: sound_file_source
    task_stack_in_psram: true


media_player:
  # Internal player for the embedded sounds. Declared before latter_media_player: every speaker_source
  # player applies its volume to physical_speaker at setup, and the music volume must be the one left.
  # Each sound path sets the DAC level itself before playing.
  - platform: speaker_source
    id: latter_sound_player
    internal: true
    volume_initial: 100%
    media_pipeline:
      format: WAV
      num_channels: ${audio_out_channels}
      sample_rate: ${audio_out_rate}
      speaker: sound_mixing_input
      sources:
        - sound_file_source

  - platform: sendspin
    id: sendspin_group_media_player
    on_state:
      then:
        - lambda: |-
            if (id(sendspin_group_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING &&
                id(mww).is_running()) {
              id(mww).stop();
            }

  - platform: speaker_source
    id: latter_media_player
    name: "Music"
    # Both pipelines play at the mixer's ${audio_out_rate} / ${audio_out_channels}; that is also the
    # preferred format Home Assistant transcodes announcements to. Sendspin negotiates its own format
    # (sendspin_source sample_rate); a stereo stream is folded to mono by the mixer.
    announcement_pipeline:
      format: FLAC
      num_channels: ${audio_out_channels}
      sample_rate: ${audio_out_rate}
      speaker: announcement_mixing_input
      sources:
        - http_announcement_source
    media_pipeline:
      format: FLAC
      num_channels: ${audio_out_channels}
      sample_rate: ${audio_out_rate}
      speaker: media_mixing_input
      sources:
        - sendspin_source
    volume_initial: 60%
    volume_increment: 5%
    volume_min: 10%
    volume_max: 100%
    on_state:
      then:
        - lambda: |-
            static int last_mp_state = -1;
            static float last_mp_vol = -1.0f;
            int cur_st = static_cast<int>(id(latter_media_player).state);
            float v = id(latter_media_player).volume;
            bool vol_valid = !std::isnan(v) && v > 0.0f;
            bool state_changed = (cur_st != last_mp_state);
            bool vol_changed = vol_valid && (last_mp_vol < 0.0f || std::fabs(v - last_mp_vol) >= 0.005f);
            if (!id(alarm_ringing) && !id(timer_ringing) && !id(find_my_active) &&
                !id(va_active) && !id(va_tts_received) &&
                id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING) {
              if (vol_valid && (vol_changed || state_changed)) {
                id(physical_speaker).set_volume(latter_ui::media_dac_volume(v));
              }
            }
            if (state_changed || vol_changed) {
              last_mp_state = cur_st;
              if (vol_valid) last_mp_vol = v;
              if (id(gui_page) == 2 && id(display_power_state) == 0 && !id(va_active)) {
                id(throttled_disp_update).execute();
              }
            }
    on_announcement:
      then:
        # While the user is speaking to the doorbell, drop any announcement (Home Assistant resuming door
        # audio would play into the mic). A stray pipeline reply after the turn is dropped where it starts
        # (intent progress, TTS end), not here: here it would also drop the door audio Home Assistant
        # resumes after the message, whose announcement can start before the payload marks it listening.
        - if:
            condition:
              lambda: 'return latter_ui::cam_intercom_ptt_active();'
            then:
              - media_player.stop:
                  id: latter_media_player
                  announcement: true
            else:
              - script.stop: mp_idle_debounce
              - script.stop: sync_wake_word_state
              - script.stop: route_i2s_to_mic
              - script.stop: screen_sleep_timer
              - mixer_speaker.apply_ducking:
                  id: media_mixing_input
                  decibel_reduction: 50
                  duration: 0.1s
              - mixer_speaker.apply_ducking:
                  id: announcement_mixing_input
                  decibel_reduction: 0
                  duration: 0.05s
              - script.execute: route_i2s_to_spk
              - script.wait: route_i2s_to_spk
              - lambda: |-
                  id(va_tts_received) = true;
                  if (id(va_active)) {
                    // A reply: the voice assistant reopens the microphone for a follow-up about one buffer
                    // (${announcement_buffer_s} s) before the reply has finished playing, so it starts muted
                    // and va_echo_gate unmutes it once the speaker is quiet.
                    if (latter_ui::kAudioFullDuplex) id(latter_mic).set_mute_state(true);
                    id(va_vad_active) = false;
                    id(va_status_text) = "Responding...";
                  }
              # Over music, the music already past the duck still plays at full level: the mixer transfer
              # buffers (~100 ms), the speaker buffer (250 ms) and I2S DMA (~60 ms), plus the 0.1 s duck ramp.
              # Raising the DAC to the voice level before that has played makes the music jump louder. The
              # chime itself reaches the DAC about as late.
              - if:
                  condition:
                    lambda: 'return id(media_mixing_input).is_running();'
                  then:
                    - delay: 500ms
              - lambda: |-
                  id(physical_speaker).set_volume(latter_ui::voice_output_volume(id(latter_media_player).volume));
                  id(hal_set_dac_mute).execute(false);
              - script.execute: throttled_disp_update
              - script.execute: announce_stall_check
              # Outside a voice turn nothing else ends the announcement when music keeps playing.
              - if:
                  condition:
                    lambda: 'return !id(va_active);'
                  then:
                    - script.execute: finish_announcement
    on_play:
      then:
        - if:
            condition:
              lambda: 'return !id(va_active) && !id(va_tts_received);'
            then:
              - lambda: |-
                  id(music_pos_sync_time) = millis();
                  if (!id(alarm_ringing) && !id(timer_ringing) && !id(find_my_active)) {
                    id(gui_page) = 2; // Auto-switch to Music Player screen on music playback start
                  }
                  id(sleep_start_time) = 0;
                  id(active_game) = 0;
              - script.stop: mp_idle_debounce
              - script.stop: sync_wake_word_state
              - script.stop: route_i2s_to_mic
              - if:
                  condition:
                    lambda: 'return !id(alarm_ringing) && !id(timer_ringing) && !id(find_my_active);'
                  then:
                    - mixer_speaker.apply_ducking:
                        id: media_mixing_input
                        decibel_reduction: 0
                        duration: 0.2s
                    - mixer_speaker.apply_ducking:
                        id: announcement_mixing_input
                        decibel_reduction: 50
                        duration: 0.1s
                    - lambda: |-
                        float v = id(latter_media_player).volume;
                        if (std::isnan(v) || v <= 0.0f) v = 0.60f;
                        id(physical_speaker).set_volume(latter_ui::media_dac_volume(v));
              - if:
                  condition:
                    lambda: 'return !id(speaker_enable).state || id(mww).is_running() || id(latter_mic).is_running();'
                  then:
                    - script.execute: route_i2s_to_spk
                    - script.wait: route_i2s_to_spk
              - lambda: 'id(hal_set_dac_mute).execute(false);'
              - if:
                  condition:
                    lambda: 'return id(display_power_state) != 0 || !id(display_brightness).remote_values.is_on();'
                  then:
                    - lambda: |-
                        latter_ui::screen_is_off_standby() = false;
                        id(display_power_state) = 0;
                        id(apply_power_policy).execute();
                    - light.turn_on: display_brightness
              - lambda: |-
                  const std::string &art_u = latter_ui::media_state().art_url;
                  if (id(gui_page) == 2 &&
                      (!latter_ui::media_state().is_local || id(album_art).get_width() == 0) &&
                      !art_u.empty() &&
                      art_u != "none" &&
                      art_u != "unknown" &&
                      art_u != "unavailable" &&
                      art_u != id(current_loaded_art_url)) {
                    id(fetch_remote_art_debounced).execute();
                  }
              - script.execute: screen_sleep_timer
              - script.execute: throttled_disp_update
              # Playback (re)started, e.g. music resuming after a voice turn: pause the wake word for it.
              - script.execute: sync_wake_word_state
    on_pause:
      then:
        - lambda: |-
            if (id(music_pos_sync_time) > 0) {
              id(music_pos_base) += (millis() - id(music_pos_sync_time)) / 1000.0f;
              id(music_pos_sync_time) = 0;
            }
            if (id(display_power_state) == 0) {
              id(screen_sleep_timer).execute();
            }
        - script.execute: mp_idle_debounce
    on_idle:
      then:
        - if:
            condition:
              lambda: 'return id(va_active) || id(va_tts_received) || !id(va_status_text).empty();'
            then:
              - script.execute: va_tts_drain_and_finish
        - lambda: |-
            if (id(display_power_state) == 0) {
              id(screen_sleep_timer).execute();
            }
        - script.execute: mp_idle_debounce

micro_wake_word:
  id: mww
  microphone:
    microphone: latter_mic
    channels: 0
    gain_factor: 2
  task_stack_in_psram: false
  prefer_internal_ram: ${mww_internal_ram}  # board trait: arena + weights in internal RAM where there is headroom
  # Capture buffer (default 120 ms): track starts and art decodes can hold the inference task off for
  # longer, which reset the buffer and dropped audio. 500 ms of 16 kHz mono is 16 KB.
  ring_buffer_duration: 500ms
  stop_after_detection: true
  vad:
  # At most 2 models run concurrently (enforced by ensure_wake_words_restored & poll_and_persist_wake_words).
  # Vendored hey_luna SHA-256: json=4A3618E366B28A82C7AFADC8E54CA726..., tflite=18A56BA916A5C7ADFF1D5D4F594EAADF...
  models:
    - model: okay_nabu
      id: okay_nabu
    - model: github://slampton/esphome-latter-core/models/hey_luna.json@main
      id: hey_luna
    - model: hey_jarvis
      id: hey_jarvis
    - model: hey_mycroft
      id: hey_mycroft
    - model: alexa
      id: alexa
  on_wake_word_detected:
    then:
      - lambda: |-
          id(last_detected_wake_word) = wake_word;
          ESP_LOGI("mww", "On-board wake word detected: %s", wake_word.c_str());
      - script.execute: trigger_va_from_wake_word

voice_assistant:
  id: va
  # The capture is about 6 dB too quiet for speech-to-text (speech near -30 dBFS RMS in Home
  # Assistant's debug recordings); the wake word applies the same gain.
  microphone:
    microphone: latter_mic
    gain_factor: 2
  micro_wake_word: mww
  use_wake_word: false
  media_player: latter_media_player
  noise_suppression_level: 2
  auto_gain: 31dBFS
  on_client_connected:
    then:
      - delay: 200ms
      - lambda: 'esphome::voice_assistant::ensure_wake_words_restored(id(mww));'
      - script.execute: apply_wake_word_sensitivities
      - script.execute: sync_wake_word_state
  on_listening:
    then:
      - lambda: |-
          latter_ui::log_audio_profile("VA_LISTEN_START");
          id(apply_power_policy).execute();  // va.is_running(): full-throughput Wi-Fi while streaming
          if (latter_ui::cam_intercom_ptt_active()) {
            // A late reply from the previous intercom turn must stay dropped; only a normal turn clears it.
            latter_ui::cam_intercom_status() = "CALL • SPEAK NOW";
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          id(va_intercom_turn) = false;
          if (!id(va_active)) {
            id(return_page) = id(gui_page);
            id(va_active) = true;
          }
      - if:
          condition:
            lambda: |-
              return !id(va_resume_music_after) &&
                     ((id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                      (!id(active_speaker_entity).empty() && latter_ui::media_state().state == "playing"));
          then:
            - script.execute: pause_all_music
            - delay: 150ms
      - script.stop: mp_idle_debounce
      - script.stop: screen_sleep_timer
      # A full-duplex microphone hears the speaker. A continued-conversation turn opens while the reply's
      # last frames are still buffered, so va_echo_gate feeds the pipeline silence until they have played
      # and the amplifier is off. Otherwise silence the speaker path at once.
      - if:
          condition:
            lambda: |-
              return latter_ui::kAudioFullDuplex &&
                     (id(latter_mic).get_mute_state() || id(announcement_mixing_input).is_running() ||
                      id(sound_mixing_input).is_running() || id(physical_speaker).has_buffered_data());
          then:
            - script.execute: va_echo_gate
          else:
            - script.execute: route_i2s_to_mic
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 0
          duration: 0.1s
      - lambda: |-
          id(va_restore_display).stop();
          latter_ui::va_display_restore().capture(id(display_power_state),
              id(display_brightness).current_values.is_on(), millis(), false);
          if (id(display_power_state) != 0 && id(va_wake_screen_switch).state) {
            latter_ui::screen_is_off_standby() = false;
            id(display_power_state) = 0;
            id(disp1).start_poller();
            id(apply_power_policy).execute();
            id(sync_display_brightness).execute();
          }
          id(va_was_cancelled) = false;
          id(va_vad_active) = false;
          id(va_tts_received) = false;
          latter_ui::va_session_state().active = true;
          latter_ui::va_session_state().tts_received = false;
          if (latter_ui::cam_intercom_ptt_active()) {
            id(va_status_text) = "";
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          id(va_status_text) = "Listening...";
          ESP_LOGI("va", "Status: Listening...");
          if (id(display_power_state) == 0 || id(va_wake_screen_switch).state) {
            id(display_brightness).turn_on().perform();
            latter_ui::schedule_disp_update(&id(disp1));
          }
      # va_busy now holds: pause the wake word for the turn (on a full-duplex bus nothing else stops it,
      # and it would hear the reply).
      - script.execute: sync_wake_word_state
  on_stt_vad_start:
    then:
      - script.stop: screen_sleep_timer
      - lambda: |-
          latter_ui::log_audio_profile("VA_VAD_START");
          id(va_vad_active) = true;
          if (latter_ui::cam_intercom_ptt_active()) {
            latter_ui::cam_intercom_status() = "CAPTURING VOICE...";
          } else {
            id(va_status_text) = "Listening...";
          }
          ESP_LOGI("va", "Status: Listening (VAD active)...");
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  on_stt_vad_end:
    then:
      - script.stop: screen_sleep_timer
      - lambda: |-
          latter_ui::log_audio_profile("VA_VAD_END");
          id(va_vad_active) = false;
          if (latter_ui::cam_intercom_ptt_active()) {
            latter_ui::cam_intercom_status() = "PROCESSING AUDIO...";
          } else {
            id(va_status_text) = "Thinking...";
          }
          ESP_LOGI("va", "Status: Thinking...");
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  on_stt_end:
    then:
      - script.stop: screen_sleep_timer
      # The reply plays here, except on an intercom turn (the speech goes to the doorbell).
      - if:
          condition:
            lambda: 'return !latter_ui::cam_intercom_ptt_active() && !latter_ui::cam_call_active();'
          then:
            - script.execute: route_i2s_to_spk
      - lambda: |-
          latter_ui::log_audio_profile("VA_STT_END", x.c_str());
          id(va_vad_active) = false;
          if (latter_ui::cam_intercom_ptt_active() || latter_ui::cam_call_active()) {
            id(va_intercom_turn) = true;
            id(va_active) = false;
            id(va_status_text) = "";
            esphome::voice_assistant::abort_voice_assistant(id(va));
            if (x.empty()) {
              id(resume_doorbell_listen).execute();
              return;
            }
            // Home Assistant speaks it on the doorbell, then resumes the call's door audio.
            latter_ui::cam_intercom_ptt_active() = false;
            id(cam_intercom_action) = "talk_message";
            id(cam_intercom_message) = x;
            latter_ui::cam_intercom_status() = "SENT TO DOORBELL";
            id(cam_intercom_status_ms) = millis();
            id(send_doorbell_intercom_cmd).execute();
            latter_ui::radio_boost_until_ms() = 0;
            id(apply_power_policy).execute();
            latter_ui::schedule_disp_update(&id(disp1));
            return;
          }
          id(va_status_text) = "Thinking...";
          // Only clear va_resume_music_after when the utterance explicitly pauses/stops media playback
          // (never on non-media commands such as "stop the fan" or "stop the timer")
          std::string utt = x;
          for (char &c : utt) {
            c = static_cast<char>(::tolower(static_cast<unsigned char>(c)));
            if (c == '.' || c == ',' || c == '!' || c == '?') c = ' ';
          }
          while (!utt.empty() && utt.front() == ' ') utt.erase(utt.begin());
          while (!utt.empty() && utt.back() == ' ') utt.pop_back();
          const bool mentions_media = (utt.find("music") != std::string::npos ||
                                       utt.find("speaker") != std::string::npos ||
                                       utt.find("audio") != std::string::npos ||
                                       utt.find("song") != std::string::npos ||
                                       utt.find("track") != std::string::npos ||
                                       utt.find("player") != std::string::npos ||
                                       utt.find("playing") != std::string::npos ||
                                       utt.find("playback") != std::string::npos);
          const bool bare_pause_or_stop = (utt == "pause" || utt == "stop");
          const bool media_pause_or_stop = mentions_media &&
                                           (utt.find("pause") != std::string::npos ||
                                            utt.find("stop") != std::string::npos ||
                                            utt.find("turn off") != std::string::npos);
          if (bare_pause_or_stop || media_pause_or_stop) {
            id(va_resume_music_after) = false;
            ESP_LOGI("va", "Stop/Pause media intent detected: clearing va_resume_music_after");
          }
          ESP_LOGI("va", "STT End (hidden): %s", x.c_str());
  on_intent_progress:
    then:
      # An intercom turn's speech went to the doorbell; drop the reply the pipeline started streaming
      # (x is its URL, empty when nothing started).
      - if:
          condition:
            lambda: 'return id(va_intercom_turn);'
          then:
            - if:
                condition:
                  lambda: 'return !x.empty();'
                then:
                  - media_player.stop:
                      id: latter_media_player
                      announcement: true
          else:
            - if:
                condition:
                  lambda: 'return !x.empty();'
                then:
                  - mixer_speaker.apply_ducking:
                      id: media_mixing_input
                      decibel_reduction: 50
                      duration: 0.1s
                  - mixer_speaker.apply_ducking:
                      id: announcement_mixing_input
                      decibel_reduction: 0
                      duration: 0.05s
                  - script.stop: screen_sleep_timer
                  - script.execute: route_i2s_to_spk
                  - script.wait: route_i2s_to_spk
                  # The DAC rises to the voice level in on_announcement, when the reply actually plays.
                  - lambda: |-
                      id(hal_set_dac_mute).execute(false);
                      id(va_vad_active) = false;
                      id(va_tts_received) = true;
                      if (id(va_active)) {
                        id(va_status_text) = "Responding...";
                      }
                      ESP_LOGI("va", "Status: Responding (Streaming TTS)...");
                  - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  on_tts_start:
    then:
      # An intercom turn's reply is dropped where it starts playing (intent progress, TTS end). TTS start
      # plays nothing; stopping here would only cut the call's door audio.
      - if:
          condition:
            lambda: 'return !id(va_intercom_turn);'
          then:
            - lambda: 'latter_ui::log_audio_profile("VA_TTS_START");'
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 50
                duration: 0.1s
            - mixer_speaker.apply_ducking:
                id: announcement_mixing_input
                decibel_reduction: 0
                duration: 0.05s
            - script.stop: screen_sleep_timer
            - script.execute: route_i2s_to_spk
            - script.wait: route_i2s_to_spk
            # The music ducks here, seconds before the audio arrives (an announcement's TTS start comes
            # ~2 s before it plays). The DAC rises to the voice level in on_announcement, when it actually
            # plays: raising it here played the not-yet-ducked music louder before the chime.
            - lambda: |-
                id(hal_set_dac_mute).execute(false);
                id(va_vad_active) = false;
                id(va_tts_received) = true;
                if (id(va_active)) {
                  id(va_status_text) = "Responding...";
                }
                ESP_LOGI("va", "Status: Responding (TTS)...");
            - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  on_tts_end:
    then:
      # An intercom turn's speech went to the doorbell; drop the pipeline's reply.
      - if:
          condition:
            lambda: 'return id(va_intercom_turn);'
          then:
            - media_player.stop:
                id: latter_media_player
                announcement: true
          else:
            - script.stop: screen_sleep_timer
            - script.execute: route_i2s_to_spk
            - script.wait: route_i2s_to_spk
            - lambda: 'id(hal_set_dac_mute).execute(false);'
            - lambda: |-
                id(va_vad_active) = false;
                id(va_tts_received) = true;
                if (id(va_active)) {
                  id(va_status_text) = "Responding...";
                }
                ESP_LOGI("va", "TTS URL ready: %s", x.c_str());
            - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
  on_error:
    then:
      - script.stop: va_tts_drain_and_finish
      - if:
          condition:
            lambda: 'return latter_ui::cam_intercom_ptt_active();'
          then:
            # A push-to-talk turn that failed (usually no speech recognised): the call goes back to
            # listening, on the camera page.
            - lambda: |-
                esphome::voice_assistant::abort_voice_assistant(id(va));
                id(va_vad_active) = false;
                ESP_LOGW("va", "Intercom turn error: %s - %s", code.c_str(), message.c_str());
            - script.execute: resume_doorbell_listen
          else:
            - lambda: |-
                esphome::voice_assistant::abort_voice_assistant(id(va));
                id(va_vad_active) = false;
                id(va_tts_received) = false;
                id(va_active) = false;
                id(va_status_text) = "";
                if (id(return_page) >= 0) id(gui_page) = id(return_page);
                latter_ui::radio_boost_until_ms() = 0;
                id(apply_power_policy).execute();
                ESP_LOGE("va", "Error: %s - %s", code.c_str(), message.c_str());
            - script.execute: resume_music_after_va
            - script.execute: mp_idle_debounce
            - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
            - script.execute: va_restore_display
  on_timer_started:
    then:
      - lambda: |-
          ESP_LOGI("va_timer", "Timer started via Assist: %s (%lu sec)", timer.name.c_str(), (unsigned long)timer.total_seconds);
          uint32_t now_t = millis();
          latter_ui::upsert_voice_timer_slot(timer.id, timer.name, timer.total_seconds, timer.seconds_left, timer.is_active, now_t);
          id(va_timer_name) = timer.name;
          latter_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
          id(timer_ringing) = false;
          if (!id(va_active) && id(va_status_text).empty()) {
            if (id(gui_page) == 8 && id(tools_subpage) == 1 && id(display_power_state) == 0) {
              latter_ui::schedule_disp_update(&id(disp1));
            }
          }
  on_timer_updated:
    then:
      - lambda: |-
          ESP_LOGI("va_timer", "Timer updated via Assist: %s (left: %lu sec, active: %d)", timer.name.c_str(), (unsigned long)timer.seconds_left, timer.is_active);
          uint32_t now_t = millis();
          latter_ui::upsert_voice_timer_slot(timer.id, timer.name, timer.total_seconds, timer.seconds_left, timer.is_active, now_t);
          latter_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
          if (!id(va_active) && id(va_status_text).empty()) {
            if (id(gui_page) == 8 && id(tools_subpage) == 1 && id(display_power_state) == 0) {
              latter_ui::schedule_disp_update(&id(disp1));
            }
          }
  on_timer_cancelled:
    then:
      - lambda: |-
          ESP_LOGI("va_timer", "Timer cancelled via Assist: %s", timer.name.c_str());
          auto *slots = latter_ui::timer_slots();
          for (int i = 0; i < 3; i++) {
            if ((!timer.id.empty() && slots[i].id == timer.id) || (!timer.name.empty() && slots[i].name == timer.name)) {
              slots[i].running = false;
              slots[i].paused = false;
              slots[i].remaining_sec = slots[i].duration_sec;
            }
          }
          latter_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
          const bool was_ringing = id(timer_ringing);
          id(timer_ringing) = false;
          if (was_ringing) {
            id(stop_alarm_sound).execute();
          }
          if (!id(va_active) && id(va_status_text).empty()) {
            if (id(gui_page) == 8 && id(tools_subpage) == 1 && id(display_power_state) == 0) {
              latter_ui::schedule_disp_update(&id(disp1));
            }
          }
  on_timer_finished:
    then:
      - lambda: |-
          ESP_LOGI("va_timer", "Timer finished via Assist: %s", timer.name.c_str());
          auto *slots = latter_ui::timer_slots();
          std::string fired_name = timer.name;
          for (int i = 0; i < 3; i++) {
            if ((!timer.id.empty() && slots[i].id == timer.id) || (!timer.name.empty() && slots[i].name == timer.name)) {
              if (fired_name.empty()) fired_name = slots[i].name;
              slots[i].running = false;
              slots[i].paused = false;
              slots[i].remaining_sec = slots[i].duration_sec; // Keep duration & name saved as a reusable preset!
            }
          }
          latter_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
          if (id(va_active) || !id(va_status_text).empty()) {
            id(cancel_voice_assistant).execute();
          }
          if (!id(timer_ringing)) {
            id(va_timer_name) = fired_name;
            id(timer_ringing) = true;
            latter_ui::note_wake_reason(latter_ui::WakeReason::ALERT);
            id(wake_to_active_state).execute();
            id(play_alarm_sound).execute();
          }
  on_end:
    then:
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
          timeout: 25s
      # A push-to-talk turn that ended without a result: the call goes back to listening.
      - if:
          condition:
            lambda: 'return latter_ui::cam_intercom_ptt_active() && !id(va).is_running();'
          then:
            - script.execute: resume_doorbell_listen
      - if:
          condition:
            lambda: 'return id(va_active) || id(va_tts_received) || !id(va_status_text).empty();'
          then:
            - script.execute: va_tts_drain_and_finish


script:
  - id: va_tts_drain_and_finish
    mode: restart
    then:
      # 1a. Wait for speaker_source to finish decoding the TTS stream (up to 60s for multi-sentence responses)
      - wait_until:
          condition:
            lambda: |-
              return (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING) ||
                     (!id(va_active) && !id(va_tts_received));
          timeout: 60s
      # 1b. Bounded wait on announcement_mixing_input (<= 1s buffer_duration + 2s margin)
      - wait_until:
          condition:
            lambda: |-
              return !id(announcement_mixing_input).is_running() ||
                     (!id(va_active) && !id(va_tts_received));
          timeout: !lambda 'return (${announcement_buffer_s} + 2) * 1000;'
      - delay: 250ms
      # 2. If VoiceAssistant automatically re-entered listening for continued_conversation / ask_question,
      #    keep the session active and let on_listening own the next turn.
      - if:
          condition:
            lambda: 'return id(va).is_running();'
          then:
            # Mute the speaker path and drop the amplifier before the next listening turn.
            - script.execute: route_i2s_to_mic
            - script.stop: va_tts_drain_and_finish
      # 3. Normal completion: exit the overlay without calling abort_voice_assistant(id(va)),
      #    preserving conversation_id and native continued-conversation state.
      - lambda: |-
          latter_ui::log_audio_profile("VA_DRAIN_FINISH");
          id(latter_mic).set_mute_state(false);  // va_echo_gate never outlives the session
          const bool was_va_session = id(va_active);
          id(va_vad_active) = false;
          id(va_status_text) = "";
          id(va_tts_received) = false;
          id(va_active) = false;
          latter_ui::va_session_state().active = false;
          latter_ui::va_session_state().tts_received = false;
          if (was_va_session) {
            id(gui_page) = id(return_page);
          }
          latter_ui::radio_boost_until_ms() = 0;
          id(apply_power_policy).execute();
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'
      - delay: 160ms
      # 4. Smoothly restore music playback or mute & route I2S back to mic, then restore the display
      - script.execute: resume_music_after_va
      - script.execute: va_restore_display
  - id: route_i2s_to_spk
    mode: restart
    then:
      - script.stop: route_i2s_to_mic
      # Half-duplex bus hand-off: the microphone must release the bus before the speaker can take it.
      # A full-duplex bus (every supported board) runs both at once and skips this; the wake word itself
      # is paused by sync_wake_word_state while media plays.
      - if:
          condition:
            lambda: 'return !latter_ui::kAudioFullDuplex;'
          then:
            - script.stop: sync_wake_word_state
            - if:
                condition:
                  micro_wake_word.is_running:
                then:
                  - micro_wake_word.stop:
            - lambda: |-
                esphome::voice_assistant::stop_va_microphone(id(va));
            - if:
                condition:
                  lambda: 'return id(latter_mic).is_running();'
                then:
                  - wait_until:
                      condition:
                        lambda: 'return !id(latter_mic).is_running();'
                      timeout: 150ms
      - lambda: 'id(hal_set_audio_codecs_standby).execute(false);'
      - script.execute: hal_route_i2s_to_spk
      # Amplifier sequencing (the one place the speaker path powers up). On a cold start the I2S
      # clocks start first with the amplifier off, so the DAC output settles unamplified; then the
      # amplifier turns on. Starting the clocks with the amplifier already on is what pops. A running
      # speaker (music, a short gap between tracks) skips straight to the amplifier. DAC mute stays
      # with the callers (e.g. resume_music_after_va holds it muted while a cancelled reply drains).
      - if:
          condition:
            lambda: 'return !id(physical_speaker).is_running();'
          then:
            - lambda: |-
                id(speaker_enable).turn_off();
                // Start in the mixer's output format: a full-duplex speaker rejects any other.
                id(physical_speaker).set_audio_stream_info(
                    audio::AudioStreamInfo(${audio_out_bits}, ${audio_out_channels}, ${audio_out_rate}));
                id(physical_speaker).start();
            - wait_until:
                condition:
                  lambda: 'return id(physical_speaker).is_running();'
                timeout: 200ms
            - delay: 30ms
      - switch.turn_on: speaker_enable
  # Silences the speaker path (DAC mute, amplifier off). On a half-duplex bus it also stops the speaker
  # to free the bus for the microphone; a full-duplex speaker is left to its own idle timeout.
  - id: route_i2s_to_mic
    mode: restart
    then:
      - lambda: 'id(hal_set_dac_mute).execute(true);'
      - switch.turn_off: speaker_enable
      - if:
          condition:
            lambda: 'return !latter_ui::kAudioFullDuplex && id(physical_speaker).is_running();'
          then:
            # Stop the mixer inputs first. An input still holding audio when its output stops never
            # drains, so it stays running and speaker_source waits on it: the next reply never plays.
            - lambda: |-
                id(announcement_mixing_input).stop();
                id(sound_mixing_input).stop();
                id(physical_speaker).stop();
            - wait_until:
                condition:
                  lambda: 'return !id(physical_speaker).is_running();'
                timeout: 150ms
      - script.execute: hal_route_i2s_to_mic

  # Full duplex only. Without it, Home Assistant's speech-to-text heard the end of the reply and the
  # amplifier switching off at the start of every continued-conversation turn, took that as the start
  # of the answer, and ended the turn after the user's first word. The muted microphone publishes
  # zeros (the wake word is paused for the turn). The reply's start muted it already (on_announcement);
  # this covers a turn that opens while a sound plays. Users answer within ~0.2 s of the reply ending,
  # so the microphone reopens right after the speaker path is silenced.
  - id: va_echo_gate
    mode: restart
    then:
      - lambda: 'id(latter_mic).set_mute_state(true);'
      # The reply finishes playing: the announcement buffer (${announcement_buffer_s} s) and the I2S buffer.
      - wait_until:
          condition:
            lambda: |-
              return !id(announcement_mixing_input).has_buffered_data() &&
                     !id(sound_mixing_input).has_buffered_data() &&
                     !id(physical_speaker).has_buffered_data();
          timeout: !lambda 'return ${announcement_buffer_s} * 1000 + 500;'
      - delay: 40ms  # the I2S DMA descriptors still playing
      - script.execute: route_i2s_to_mic
      - script.wait: route_i2s_to_mic
      - delay: 50ms  # the amplifier's power-down transient
      - lambda: 'id(latter_mic).set_mute_state(false);'

  # Flight recorder for a reply that never reaches the speaker: the player is ANNOUNCING but the
  # announcement input never started (seen on Pocket, cured by a reboot; cause unknown). Logs at
  # WARNING so it survives any log level. 6 s, past the gap between an announcement's chime and its
  # message while Home Assistant renders the speech (~2.5 s); the stalled replies gave up after ~10 s.
  - id: announce_stall_check
    mode: restart
    then:
      - delay: 6s
      - lambda: |-
          if (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING) return;
          if (id(announcement_mixing_input).has_buffered_data()) return;
          auto st = [](speaker::Speaker *s) -> const char * {
            return s->is_running() ? "run" : (s->is_stopped() ? "stop" : "trans");
          };
          ESP_LOGW("PROF", "[PROF:AUDIO_STALL] announcing 6s, no buffered audio: ann=%s snd=%s media=%s "
                   "spk=%s spk_buf=%d vol=%.2f va=%d mic_mute=%d",
                   st(id(announcement_mixing_input)), st(id(sound_mixing_input)), st(id(media_mixing_input)),
                   st(id(physical_speaker)), (int) id(physical_speaker).has_buffered_data(),
                   id(physical_speaker).get_volume(), (int) id(va).is_running(),
                   (int) id(latter_mic).get_mute_state());

  - id: apply_wake_word_sensitivities
    mode: restart
    then:
      - lambda: |-
          auto apply_cutoffs = [](const std::string &opt, uint8_t low_c, uint8_t med_c, uint8_t high_c) -> uint8_t {
            if (opt == "Slightly sensitive") return low_c;
            if (opt == "Very sensitive") return high_c;
            return med_c;
          };
          // Calibrated TFLite 50Hz streaming cutoffs (Slightly=247/~97%, Moderately=237/~93%, Very=224/~88%)
          id(okay_nabu).set_probability_cutoff(
              apply_cutoffs(id(ww_sens_okay_nabu).current_option(), 247, 237, 224));
          id(hey_luna).set_probability_cutoff(
              apply_cutoffs(id(ww_sens_hey_luna).current_option(), 248, 239, 226));
          id(hey_jarvis).set_probability_cutoff(
              apply_cutoffs(id(ww_sens_hey_jarvis).current_option(), 247, 237, 224));
          id(hey_mycroft).set_probability_cutoff(
              apply_cutoffs(id(ww_sens_hey_mycroft).current_option(), 248, 239, 226));
          id(alexa).set_probability_cutoff(
              apply_cutoffs(id(ww_sens_alexa).current_option(), 247, 237, 224));

  - id: sync_wake_word_state
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              // Media pauses the wake word on every board. A full-duplex bus could listen during playback, but without
              // echo cancellation (roadmap: v3) the speaker drowns the mic, lyrics false-trigger it, and inference on
              // top of 48 kHz decoding costs CPU, memory and battery.
              // Image/camera fetches run in 16 KB slices with <=2 concurrent MWW models and do NOT suspend MWW.
              const bool va_busy = id(va_active) || id(va).is_running() || !id(va_status_text).empty() ||
                                   id(va_tts_received) || id(announcement_mixing_input).is_running();
              const bool media_busy = (id(mp_idle_debounce).is_running() || id(va_resume_music_after) ||
                                      id(media_mixing_input).is_running() ||
                                      (id(sendspin_group_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                                      (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                                      (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING));
              const bool alert_or_tool_busy = id(alarm_ringing) || id(timer_ringing) || id(find_my_active) ||
                                              (id(active_game) > 0) ||
                                              latter_ui::cam_call_active() || latter_ui::cam_listen_active();
              const bool sys_busy = id(is_hibernating) || id(ota_in_progress) ||
                                    !id(wifi_ctrl).is_connected() || (millis() < 12000U);
              return latter_ui::wake_word_should_run(
                  id(va_wake_word_mode).current_option(),
                  id(usb_connected).state,
                  va_busy, media_busy, alert_or_tool_busy, sys_busy);
          then:
            - if:
                condition:
                  not:
                    micro_wake_word.is_running:
                then:
                  - lambda: |-
                      id(hal_set_audio_codecs_standby).execute(false);
                      id(latter_mic).set_mute_state(false);  // never start the wake word on a gated microphone
                      esphome::voice_assistant::ensure_wake_words_restored(id(mww));
                  - if:
                      condition:
                        lambda: 'return !latter_ui::kAudioFullDuplex;'
                      then:
                        - script.execute: route_i2s_to_mic
                        - script.wait: route_i2s_to_mic
                  - delay: 25ms
                  - script.execute: apply_wake_word_sensitivities
                  - if:
                      condition:
                        lambda: |-
                          return !id(mww).is_running() &&
                                 !id(va_active) && !id(va).is_running() &&
                                 !id(media_mixing_input).is_running() &&
                                 (id(sendspin_group_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
                                 (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
                                 (id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING);
                      then:
                        - micro_wake_word.start:
                        - wait_until:
                            condition:
                              lambda: 'return id(latter_mic).is_running();'
                            timeout: 100ms
                        - lambda: |-
                            id(hal_set_audio_codecs_standby).execute(false);
                            ESP_LOGI("mww", "Wake word detection ARMED (ww1='%s', ww2='%s', mode='%s')",
                                     esphome::voice_assistant::last_persisted_ww1().c_str(),
                                     esphome::voice_assistant::last_persisted_ww2().c_str(),
                                     id(va_wake_word_mode).current_option().c_str());
          else:
            - if:
                condition:
                  micro_wake_word.is_running:
                then:
                  - micro_wake_word.stop:
                  - lambda: |-
                      ESP_LOGI("mww", "Wake word detection PAUSED (mode='%s', usb=%d)",
                               id(va_wake_word_mode).current_option().c_str(),
                               (int)id(usb_connected).state);

  - id: trigger_va_from_wake_word
    mode: restart
    then:
      - lambda: |-
          latter_ui::request_radio_boost(millis(), 15000U);  // VA about to stream: full-throughput Wi-Fi now
          id(apply_power_policy).execute();
          id(hal_set_audio_codecs_standby).execute(false);
          id(va_restore_display).stop();
          latter_ui::va_display_restore().capture(id(display_power_state),
              id(display_brightness).current_values.is_on(), millis(), true);
          if (id(display_power_state) != 0 || !id(display_brightness).current_values.is_on()) {
            if (id(va_wake_screen_switch).state) {
              latter_ui::note_wake_reason(latter_ui::WakeReason::VOICE);
              id(wake_to_active_state).execute();
            }
          } else {
            id(screen_sleep_timer).execute();
          }
          id(va_tts_received) = false;
      - script.execute: route_i2s_to_mic
      - script.wait: route_i2s_to_mic
      - voice_assistant.start:
          wake_word: !lambda 'return id(last_detected_wake_word);'

  - id: play_alarm_sound
    mode: restart
    then:
      - lambda: 'latter_ui::va_display_restore().armed = false;'
      - script.stop: va_restore_display
      - script.stop: stop_alarm_sound
      - script.stop: mp_idle_debounce
      - script.stop: cancel_voice_assistant
      - script.stop: va_tts_drain_and_finish
      - script.stop: resume_music_after_va
      # Duck local music first and let the already-buffered (unducked) samples drain through the
      # mixer + I2S buffers before the DAC volume jumps to alert level. Raising the volume first
      # replayed ~0.25-0.5 s of music at alert volume (static on S3 speakers, a click on P4).
      - if:
          condition:
            media_player.is_playing: latter_media_player
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 50
                duration: 0.05s
            - delay: 400ms
      # Only re-route when the speaker path is not already active (music already owns it).
      - if:
          condition:
            lambda: 'return !id(speaker_enable).state || id(mww).is_running() || id(latter_mic).is_running();'
          then:
            - script.execute: route_i2s_to_spk
            - script.wait: route_i2s_to_spk
      - lambda: |-
          // Find My Device always plays at the 0.90 ceiling; alarms/timers follow the Alert Volume model.
          const float alert_v = id(find_my_active)
              ? 0.90f
              : latter_ui::alarm_output_volume(id(alert_volume).state, id(latter_media_player).volume);
          id(physical_speaker).set_volume(alert_v);
          id(hal_set_dac_mute).execute(false);
      - while:
          condition:
            lambda: "return id(alarm_ringing) || id(timer_ringing) || id(find_my_active);"
          then:
            - if:
                condition:
                  not:
                    media_player.is_playing: latter_sound_player
                then:
                  - media_player.play_media:
                      id: latter_sound_player
                      media_url: !lambda |-
                        return std::string(id(find_my_active) ? "audio-file://sound_find_my"
                                                              : "audio-file://sound_alarm");
            - wait_until:
                condition:
                  media_player.is_playing: latter_sound_player
                timeout: 500ms
            - wait_until:
                condition:
                  not:
                    media_player.is_playing: latter_sound_player
                timeout: 8s
            - delay: 800ms

  - id: play_game_sfx
    mode: restart
    parameters:
      sfx_id: int
    then:
      - script.stop: mp_idle_debounce
      - if:
          condition:
            lambda: 'return !id(speaker_enable).state;'
          then:
            - script.execute: route_i2s_to_spk
            - script.wait: route_i2s_to_spk
            - lambda: |-
                const float sfx_v = latter_ui::alarm_output_volume(id(alert_volume).state, id(latter_media_player).volume);
                id(physical_speaker).set_volume(sfx_v);
                id(hal_set_dac_mute).execute(false);
          # Otherwise other audio already owns the speaker (music, a call): keep its DAC level.
      # A new sound replaces the one playing (speaker_source stops the source, then starts this one).
      - media_player.play_media:
          id: latter_sound_player
          media_url: !lambda |-
            const int n = (sfx_id >= 1 && sfx_id <= 14) ? sfx_id : 1;
            return "audio-file://sound_sfx_" + std::to_string(n);
      - if:
          condition:
            lambda: 'return id(active_game) == 0;'
          then:
            - script.execute: mp_idle_debounce
  - id: stop_alarm_sound
    mode: restart
    then:
      # Over music, silence the DAC before stopping the sound. Up to 0.5 s of alarm samples is still
      # queued in sound_mixing_input plus the I2S buffer; letting that tail play after the DAC drops to
      # music level sounded like a quiet echo of the alarm on dismiss.
      - if:
          condition:
            media_player.is_playing: latter_media_player
          then:
            - lambda: 'id(hal_set_dac_mute).execute(true);'
      - media_player.stop: latter_sound_player
      - script.stop: play_alarm_sound
      - if:
          condition:
            media_player.is_playing: latter_media_player
          then:
            # Drain the muted alarm tail (bounded), then lower the DAC to the music volume and unmute
            # before un-ducking the music, so neither the tail nor buffered music plays at the wrong level.
            - wait_until:
                condition:
                  lambda: 'return !id(sound_mixing_input).is_running();'
                timeout: 1500ms
            - delay: 300ms
            - lambda: |-
                float v = id(latter_media_player).volume;
                if (std::isnan(v) || v <= 0.0f) v = 0.60f;
                id(physical_speaker).set_volume(latter_ui::media_dac_volume(v));
                id(hal_set_dac_mute).execute(false);
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 0.2s
            # Music continues after the alarm: keep the wake word paused for it.
            - script.execute: sync_wake_word_state
          else:
            - if:
                condition:
                  lambda: 'return id(va_resume_music_after) && !id(va_active) && !id(va_tts_received);'
                then:
                  - script.execute: resume_music_after_va
                else:
                  - if:
                      condition:
                        lambda: |-
                          return !id(va_active) && !id(va_tts_received) &&
                                 !id(va).is_running() && !id(announcement_mixing_input).is_running() &&
                                 !latter_ui::cam_call_active() && !latter_ui::cam_listen_active() &&
                                 (id(active_game) == 0);
                      then:
                        - lambda: 'id(hal_set_dac_mute).execute(true);'
                        - switch.turn_off: speaker_enable
                        - script.execute: route_i2s_to_mic
                        - script.execute: sync_wake_word_state

number:
  - platform: template
    name: "Sound: Volume Step Size"
    id: volume_step_size
    optimistic: true
    min_value: 1
    max_value: 10
    step: 1
    initial_value: 5
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
    icon: "mdi:volume-step"
    entity_category: config

  - platform: template
    name: "Sound: Alert Volume"
    id: alert_volume
    optimistic: true
    min_value: 20
    max_value: 100
    step: 5
    initial_value: 80
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
    icon: "mdi:volume-high"
    entity_category: config
