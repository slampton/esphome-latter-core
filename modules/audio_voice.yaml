  - id: start_doorbell_call
    mode: restart
    then:
      - lambda: |-
          auto &ic = latter_ui::runtime_state().intercom;
          latter_ui::cam_call_active() = true;
          latter_ui::cam_listen_active() = true;
          latter_ui::cam_intercom_status() = "DOORBELL CALL";
          ic.cam_status_ms = millis();
          ic.cam_action = "listen_start";
          latter_ui::schedule_disp_update(&id(disp1));
      - script.execute: send_doorbell_intercom_cmd

  - id: stop_doorbell_call
    mode: restart
    then:
      - script.stop: start_doorbell_ptt
      - script.stop: va_echo_gate
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          latter_ui::cam_call_active() = false;
          latter_ui::cam_intercom_ptt_active() = false;
          latter_ui::cam_listen_active() = false;
          rs.voice.intercom_turn = false;
          latter_ui::echo_meter_active().store(false, std::memory_order_relaxed);
          id(latter_mic).set_mute_state(false);
          latter_ui::cam_intercom_status() = "CALL ENDED";
          rs.intercom.cam_status_ms = millis();
          rs.intercom.cam_action = "listen_stop";
          esphome::voice_assistant::abort_voice_assistant(id(va));
          latter_ui::schedule_disp_update(&id(disp1));
      - script.execute: send_doorbell_intercom_cmd
      - script.execute: stop_doorbell_audio
      - script.execute: mp_idle_debounce

  - id: stop_doorbell_audio
    mode: restart
    then:
      - media_player.stop: latter_media_player
      - media_player.stop:
          id: latter_media_player
          announcement: true

  - id: resume_doorbell_listen
    mode: restart
    then:
      - lambda: |-
          latter_ui::cam_intercom_ptt_active() = false;
          latter_ui::radio_boost_until_ms() = 0;
          id(apply_power_policy).execute();
      - if:
          condition:
            lambda: 'return latter_ui::cam_call_active();'
          then:
            - lambda: |-
                auto &ic = latter_ui::runtime_state().intercom;
                latter_ui::cam_listen_active() = true;
                latter_ui::cam_intercom_status() = "DOORBELL CALL";
                ic.cam_status_ms = millis();
                ic.cam_action = "listen_start";
            - script.execute: send_doorbell_intercom_cmd
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'

  - id: start_doorbell_ptt
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(va).get_api_connection() == nullptr;'
          then:
            - lambda: |-
                latter_ui::cam_intercom_status() = "NOT CONNECTED";
                latter_ui::runtime_state().intercom.cam_status_ms = millis();
                latter_ui::schedule_disp_update(&id(disp1));
            - script.stop: start_doorbell_ptt
      - script.stop: finish_announcement
      - script.stop: va_tts_drain_and_finish
      - script.stop: va_echo_gate
