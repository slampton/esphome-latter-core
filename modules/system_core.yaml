# ==============================================================================
# Latter Core Module: System Boot, Native API, Protocol v3 Dispatch & OTA
# (modules/system_core.yaml)
# Unified core foundation: substitutions, Native API (batch_delay: 0ms, Noise
# encryption, outgoing_connection), time sync, send_device_hello, RPC outbox,
# Protocol v3 dispatch, OTA hooks, and diagnostics.
# Zero YAML globals: reads/writes latter_core::runtime_state() & persisted_prefs().
# ==============================================================================

substitutions:
  name: "latter-device"
  friendly_name: "Latter Device"
  version: "3.0.0"  # Single YAML source of truth (inherited by devices/*.yaml & examples/*.yaml)
  latter_asset_ref: "main"
  api_outgoing_delay: "10s"
  # api_reboot_timeout is supplied by each board HAL or standalone example ("15min" stationary, "0s" battery)
  # so modules/system_core.yaml (included after hal:) never clobbers board-specific substitutions.

esphome:
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            auto &rs = latter_core::runtime_state();
            // A battery past the cutoff powers straight back off before anything else starts (no-op on USB or
            // without a PMU).
            if (rs.hw_boot_battery_check != nullptr) {
              rs.hw_boot_battery_check();
            }
            latter_core::load_persisted_prefs();
            latter_core::seed_default_prefs_if_needed();
            // Light-sleep awake lock (created held), wake pins and sleep pad config; no-op without light sleep.
            latter_core::pm_init();
            id(hal_release_deep_sleep_holds).execute();
            latter_core::touch_wake_bridge().bind(
                +[]() -> bool { return latter_core::runtime_state().nav.display_power_state != 0; },
                +[](uint32_t now_ms) { latter_core::pm_wake_grace_arm(now_ms); },
                &latter_core::pm_wake_loop_from_isr);
            latter_core::hal_release_pwr_key_wake_pad();
            rs.nav.sleep_start_time = millis();
            rs.nav.standby_entered_ms = 0;
            rs.nav.wake_greeting_pending = true;
            latter_core::last_screen_wake_ms() = rs.nav.sleep_start_time;
            rs.nav.is_hibernating = false;
            rs.nav.display_power_state = 0; // ACTIVE
            rs.music.active_speaker_name = "${friendly_name}";
            rs.music_slots()[0].name = "${friendly_name}";

    - priority: -100
      then:
        # Core revision lockstep stamp: LATTER_YAML_REV must equal LATTER_CORE_REV in include/esphome_bridge.h
        # (verify_core.py enforces). It lives in this lambda, not in build_flags, so bumping it recompiles
        # only main.cpp instead of invalidating the CMake cache and every object in the build.
        - lambda: |-
            constexpr long LATTER_YAML_REV = 2026112501L;
            static_assert(LATTER_YAML_REV == LATTER_CORE_REV,
                          "Latter YAML packages and latter_core C++ headers are from different revisions. "
                          "ESPHome caches github:// packages for a day: set refresh: 0s on the Latter package "
                          "(docs/flashing.md) and rebuild.");
            latter_core::ensure_persisted_prefs_loaded();
            latter_rpc::bind_sensor_sink(&id(latter_rpc_outbox));
            ESP_LOGI("latter", "Latter v%s ready (core_rev %ld, reset: %s)", "${version}", (long)LATTER_CORE_REV,
                     latter_core::last_reset_reason());
            latter_core::start_stall_guard();
            latter_core::link_report_init();
            auto &rs = latter_core::runtime_state();
            if (rs.hw_init_pmu != nullptr) {
              rs.hw_init_pmu();
            }
            if (latter_core::load_hibernate_snapshot_if_cold()) {
              const auto &ac = latter_core::area_ctx_state();
              if (!ac.area_name.empty()) {
                latter_core::latter_area_label() = ac.area_name;
              }
            }
            latter_core::hal_rtc_restore_system_clock(id(bus_internal));
            {
              auto now_boot = id(ha_time).now();
              if (!now_boot.is_valid()) {
                now_boot = id(sntp_time).now();
              }
              if (now_boot.is_valid()) {
                const auto &p_bt = latter_core::persisted_prefs();
                const int bt_edge = latter_core::bedtime_schedule_tracker().evaluate_hour(
                    p_bt.bedtime_schedule, p_bt.bedtime_start_hour, p_bt.bedtime_end_hour, now_boot.hour);
                if (bt_edge >= 0 && (bt_edge == 1) != p_bt.bedtime_active) {
                  uint32_t bt_eff = 0U;
                  (void)latter_core::record_local_pref_edit(
                      latter_core::PrefKey::BEDTIME_ACTIVE, (bt_edge == 1) ? "1" : "0", millis(), bt_eff);
                }
              }
              if (latter_core::persisted_prefs().bedtime_active) {
                rs.nav.wake_greeting_pending = false;
              }
            }
            latter_core::parse_latter_remote_slots_summary(latter_core::remote_state().slots_summary);
            rs.remote.active_slot = latter_core::resolve_active_remote_slot(rs.remote.active_slot);
            rs.audio.run_boot_init();
        - lambda: 'latter_ui::release_art(id(remote_album_art));'
        - lambda: 'latter_ui::release_art(id(home_wallpaper_art));'
        - lambda: 'latter_ui::release_art(id(screensaver_photo_art));'
        - lambda: 'latter_ui::release_art(id(camera_snapshot_art));'
        - lambda: |-
            auto &rs = latter_core::runtime_state();
            rs.music.loaded_art_url = "";
            rs.music.loaded_wallpaper_url = "";
            rs.music.loaded_screensaver_photo_url = "";
            rs.alert.loaded_camera_url = "";
        - script.execute: sync_ui_touch_runtime
        - script.execute: apply_default_start_page
        - script.execute: apply_theme_preset
        - lambda: |-
            auto &rs = latter_core::runtime_state();
            if (rs.hw_update_batt_level != nullptr) {
              rs.hw_update_batt_level();
            }
        - script.execute: sync_display_brightness
        - lambda: 'latter_core::display_lifecycle().note_activity(millis());'
        - script.execute: apply_power_policy

# Client-initiated dial-back (outgoing_connection -> HA TCP :6054, Noise PSK verified on both sides):
# ESPHome 2026.11 only skips the 60 s default delay under USE_DEEP_SLEEP, whereas Latter battery
# hibernation calls esp_deep_sleep_start() / PMU power-off directly. A 10 s delay gives normal LAN mDNS
# inbound connects a clean head start (3-8 s) while dialing HA:6054 well inside the 30 s ha_link_settling
# light-sleep awake window on hibernation wake, off-site return, or mDNS-blocked VLANs.
api:
  reboot_timeout: ${api_reboot_timeout}
  batch_delay: 0ms
  encryption:
  outgoing_connection:
    delay: ${api_outgoing_delay}
  on_client_connected:
    then:
      - lambda: |-
          const uint32_t now_ms = millis();
          const bool is_ha = client_info.find("Home Assistant") != std::string::npos;
          if (is_ha) {
            latter_core::apply_api_ha_connected_state(now_ms);
          }
          latter_core::link_report_api_connected(is_ha, now_ms);
          auto &r = latter_core::runtime_state();
          r.audio.notify_api_client_authenticated(
              client_info.empty() ? std::string_view{} : std::string_view(client_info.c_str(), client_info.size()),
              client_address.empty() ? std::string_view{} : std::string_view(client_address.c_str(), client_address.size()));
          if (r.nav.display_power_state == 0 && !r.nav.is_hibernating) {
            latter_ui::schedule_disp_update(&id(disp1));
          }
          id(apply_power_policy).execute();  // holds the light-sleep awake lock while the link settles
          if (!is_ha) {
            id(log_client_boot_replay).execute();
          }
      - if:
          condition:
            lambda: 'return client_info.find("Home Assistant") != std::string::npos;'
          then:
            - script.execute: send_device_hello
  on_client_disconnected:
    then:
      - lambda: |-
          const uint32_t now_ms = millis();
          const bool is_ha = client_info.find("Home Assistant") != std::string::npos;
          latter_core::apply_api_ha_disconnected_state(is_ha, now_ms);
          auto &r = latter_core::runtime_state();
          if (r.nav.display_power_state == 0 && !r.nav.is_hibernating) {
            latter_ui::schedule_disp_update(&id(disp1));
          }
          id(apply_power_policy).execute();  // a dropped link takes the awake lock back to reconnect
  actions:
    - action: latter_ping
      id: latter_ping_action
      then:
        - logger.log:
            level: DEBUG
            format: "Latter companion connected"
        # Latter pings every bound Device once its RPC outbox listener is attached: answer with a fresh hello
        # unless on_client_connected already has send_device_hello in flight or just completed with clean prefs.
        - if:
            condition:
              lambda: |-
                const uint32_t now_ms = millis();
                if (!latter_core::should_trigger_hello_on_ping(now_ms, latter_core::persisted_prefs().dirty_mask)) {
                  return false;
                }
                latter_core::mark_hello_in_flight(true, now_ms);
                return true;
            then:
              - script.execute: send_device_hello

    - action: latter_push_v3
      id: latter_push_v3_action
      variables:
        domain: string
        payload: string
      then:
        - lambda: |-
            const std::string_view sv_dom(domain.c_str(), domain.size());
            const std::string_view sv_pay(payload.c_str(), payload.size());
            if (latter_core::dispatch_v3_domain_push(sv_dom, sv_pay, ::esphome::millis())) {
              id(handle_v3_domain_pushed).execute(std::string(sv_dom));
            }

    - action: latter_device_command
      id: latter_device_command_action
      variables:
        command: string
      then:
        - lambda: |-
            const std::string_view sv_cmd(command.c_str(), command.size());
            if (latter_core::try_handle_pin_session_key_command(sv_cmd)) return;
            id(handle_device_command).execute(std::string(sv_cmd));

    # Reset to defaults (Latter Studio / latter.reset_device). Same panel hand-off as Restart Device:
    # AMOLED panels left awake across a reboot don't come back from their next DCS sleep.
    - action: latter_factory_reset
      then:
        - logger.log:
            level: WARN
            format: "Reset to defaults requested by Latter: erasing saved settings and rebooting"
        - light.turn_off: display_brightness
        - component.update: disp1
        - delay: 100ms
        - button.press: internal_factory_reset

    - action: latter_set_beacon_uuid
      id: latter_set_beacon_uuid_action
      variables:
        uuid: string
      then:
        - lambda: |-
            #ifdef USE_LATTER_BEACON
            id(ble_ctrl).set_uuid_hex(std::string_view(uuid.c_str(), uuid.size()));
            #else
            (void)uuid;
            #endif

    - action: latter_set_slots
      variables:
        is_area_slots: bool
        req_id: int
        mode: string
        page: int
        total_pages: int
        slots: string
      then:
        - lambda: |-
            if (latter_core::apply_slots_action(
                    req_id, std::string_view(mode.c_str(), mode.size()),
                    page, total_pages, std::string_view(slots.c_str(), slots.size()),
                    millis(), is_area_slots)) {
              latter_ui::schedule_disp_update(&id(disp1));
            }

    - action: latter_set_music_lyrics
      variables:
        req_id: int
        chunk_index: int
        chunk_count: int
        track_key: string
        synced: bool
        lines: string
      then:
        - lambda: |-
            if (latter_core::apply_music_lyrics_action(
                    req_id, chunk_index, chunk_count,
                    std::string_view(track_key.c_str(), track_key.size()),
                    synced,
                    std::string_view(lines.c_str(), lines.size()))) {
              const auto auto_res = latter_core::reconcile_lyrics_auto_view();
              const auto &rs = latter_core::runtime_state();
              if (rs.nav.display_power_state == 0 && !rs.nav.is_hibernating) {
                if (auto_res.fetch_remote_art &&
                    (!latter_core::media_state().is_local || rs.audio.local_album_art_w() == 0)) {
                  id(fetch_remote_art_debounced).execute();
                }
                if (rs.nav.gui_page == latter_core::PageId::MUSIC &&
                    rs.music.view == latter_core::MusicView::LYRICS) {
                  latter_core::ensure_ui_anim_poller(id(ui_anim_tick));
                }
                latter_ui::mark_dirty_full();
                latter_ui::schedule_disp_update(&id(disp1));
              }
            }

    - action: latter_set_calendar_view
      variables:
        req_id: int
        chunk_index: int
        chunk_count: int
        window_start: string
        window_end: string
        events: string
      then:
        - lambda: |-
            if (latter_core::apply_calendar_view_action(
                    req_id, chunk_index, chunk_count,
                    std::string_view(window_start.c_str(), window_start.size()),
                    std::string_view(window_end.c_str(), window_end.size()),
                    std::string_view(events.c_str(), events.size()))) {
              const auto &rs = latter_core::runtime_state();
              if (rs.nav.display_power_state == 0 && !rs.nav.is_hibernating) {
                latter_ui::mark_dirty_full();
                latter_ui::schedule_disp_update(&id(disp1));
              }
            }

    - action: latter_show_notification
      variables:
        title: string
        message: string
        priority: string
        duration: int
        chime: bool
        camera_url: string
        camera_entity: string
        alert_id: int
      then:
        - lambda: |-
            auto &rs = latter_core::runtime_state();
            if (!latter_core::trigger_alert_banner(
                    std::string_view(title.c_str(), title.size()),
                    std::string_view(message.c_str(), message.size()),
                    std::string_view(priority.c_str(), priority.size()),
                    duration,
                    std::string_view(camera_url.c_str(), camera_url.size()),
                    alert_id, millis(), false, rs.alert,
                    std::string_view(camera_entity.c_str(), camera_entity.size()))) {
              return;
            }
            const auto &prefs = latter_core::persisted_prefs();
            const bool is_doorbell = !rs.alert.camera_entity.empty() || !rs.alert.camera_url.empty();
            const bool dnd_suppress = latter_core::should_suppress_alert_in_dnd(
                prefs.do_not_disturb, static_cast<int>(rs.alert.priority_level), is_doorbell);
            const bool bt_suppress = latter_core::should_suppress_alert_in_bedtime(
                prefs.bedtime_active, rs.alert.priority_level);
            if (dnd_suppress || (bt_suppress && rs.nav.display_power_state != 0)) {
              rs.alert.active = false;
              return;
            }
            rs.audio.preempt_va_for_alert_now();
            latter_core::note_wake_reason(latter_core::WakeReason::NOTIFY);
            id(wake_to_active_state).execute();
            const bool dnd_chime_suppress = latter_core::should_suppress_alert_chime_in_dnd(
                prefs.do_not_disturb, static_cast<int>(rs.alert.priority_level), is_doorbell);
            if (chime && !bt_suppress && !dnd_chime_suppress && !rs.voice.active && !rs.voice.tts_received) {
              int sfx = (rs.alert.priority == "critical" || rs.alert.priority == "warning") ? 9 : 6;
              rs.audio.play_sfx(sfx);
            }
            if (latter_core::is_p4_live_doorbell_popup_enabled(
                    latter_core::persisted_prefs(), latter_core::area_ctx_state(), rs.alert)) {
              rs.cameras.doorbell_live_popup_active = true;
              id(sync_camera_stream).execute();
            } else {
              rs.cameras.doorbell_live_popup_active = false;
              if (!rs.alert.camera_url.empty()) {
                id(fetch_camera_snapshot).execute();
              } else {
                rs.alert.loaded_camera_url = "";
                latter_ui::release_art(id(camera_snapshot_art));
              }
            }
            latter_ui::schedule_disp_update(&id(disp1));

# Both OTA paths share the display wake, progress takeover, and light-sleep awake-lock hooks.
ota:
  - platform: http_request
    id: ota_http
    on_begin:
      then:
        - script.execute: ota_on_begin
    on_progress:
      then:
        - lambda: 'latter_core::handle_ota_progress(&id(disp1), x, millis());'
    on_end:
      then:
        - lambda: 'latter_core::handle_ota_end(&id(disp1));'
    on_error:
      then:
        - script.execute: ota_on_error_or_abort
    on_abort:
      then:
        - script.execute: ota_on_error_or_abort

  - platform: esphome
    id: ota_esphome
    on_begin:
      then:
        - script.execute: ota_on_begin
    on_progress:
      then:
        - lambda: 'latter_core::handle_ota_progress(&id(disp1), x, millis());'
    on_end:
      then:
        - lambda: 'latter_core::handle_ota_end(&id(disp1));'
    on_error:
      then:
        - script.execute: ota_on_error_or_abort
    on_abort:
      then:
        - script.execute: ota_on_error_or_abort

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: handle_time_sync
  - platform: sntp
    id: sntp_time
    on_time_sync:
      then:
        - script.execute: handle_time_sync

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    id: latter_wifi_signal
    entity_category: diagnostic
    update_interval: 60s
    filters:
      - delta: 2.0

button:
  - platform: restart
    name: "Internal Restart"
    id: internal_restart
    internal: true

  - platform: factory_reset
    name: "Internal Factory Reset"
    id: internal_factory_reset
    internal: true

  - platform: template
    name: "Actions: Restart Device"
    id: restart_button
    device_class: restart
    icon: "mdi:restart"
    entity_category: config
    on_press:
      - lambda: |-
          latter_core::flush_persisted_prefs_if_dirty();
          latter_core::save_hibernate_snapshot();
          latter_core::hal_rtc_sync_from_system_clock(id(bus_internal));
      - light.turn_off: display_brightness
      - component.update: disp1
      - delay: 150ms
      - lambda: 'latter_core::hal_touch_prepare_for_restart();'
      - delay: 20ms
      - button.press: internal_restart

binary_sensor:
  - id: !extend boot_button
    on_press:
      then:
        - lambda: |-
            static uint32_t last_btn_press = 0;
            uint32_t now = millis();
            if (now - last_btn_press < 150) return;
            last_btn_press = now;
        - if:
            condition:
              lambda: |-
                const auto &rs = latter_core::runtime_state();
                return rs.alarms.find_my_active || rs.timers.ringing || rs.alarms.ringing || rs.alert.active;
            then:
              - lambda: |-
                  auto &rs = latter_core::runtime_state();
                  if (rs.alert.active) {
                    id(dismiss_notification).execute();
                    return;
                  }
                  rs.alarms.find_my_active = false;
                  rs.timers.ringing = false;
                  rs.alarms.ringing = false;
                  latter_core::check_and_emit_timer_alarm_state(millis());
                  rs.audio.stop_alarm();
                  id(sync_display_brightness).execute();
                  latter_ui::mark_dirty_full();
                  latter_ui::schedule_disp_update(&id(disp1));
                  latter_core::display_lifecycle().note_activity(millis());
            else:
              - if:
                  condition:
                    lambda: 'return latter_core::runtime_state().nav.active_game > 0;'
                  then:
                    - lambda: 'latter_core::runtime_state().nav.game_btn_pressed = true;'
                  else:
                    - lambda: 'latter_core::runtime_state().audio.toggle_va_now();'

text_sensor:
  - platform: template
    name: "System: RPC Outbox"
    id: latter_rpc_outbox
    icon: "mdi:swap-horizontal"
    entity_category: diagnostic
    update_interval: never

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: latter_ip_address
      entity_category: diagnostic

interval:
  - interval: 60s
    then:
      - lambda: |-
          const uint32_t now_60s_ms = millis();
          latter_core::link_report_init();
          latter_core::link_report_sample();
          if (latter_core::profiler_enabled()) {
            (void)latter_core::link_report_log_line(now_60s_ms, latter_core::last_reset_reason());
          }
          if (latter_core::link_state().ha_connected) {
            const auto &rs = latter_core::runtime_state();
            static uint32_t last_tel_pub_ms = 0U;
            static uint32_t last_seen_ha_conn_ms = 0U;
            const uint32_t ha_conn_ms = latter_core::link_state().last_ha_connect_ms;
            if (last_tel_pub_ms == 0U || (ha_conn_ms != 0U && ha_conn_ms != last_seen_ha_conn_ms)) {
              last_seen_ha_conn_ms = ha_conn_ms;
              last_tel_pub_ms = (ha_conn_ms != 0U) ? ha_conn_ms : ((now_60s_ms != 0U) ? now_60s_ms : 1U);
            }
            const bool batt_quiet = (LATTER_HAS_BATTERY != 0) && !rs.hw_usb_connected &&
                                    (rs.nav.display_power_state == 2);
            if (latter_core::profiler_enabled()) {
              last_tel_pub_ms = (now_60s_ms != 0U) ? now_60s_ms : 1U;
              id(publish_device_telemetry).execute();
            } else if (!batt_quiet && (now_60s_ms - last_tel_pub_ms >= 900000U)) {
              last_tel_pub_ms = (now_60s_ms != 0U) ? now_60s_ms : 1U;
              id(publish_device_telemetry).execute();
            }
          }

script:
  # Publish device_hello over the bound System: RPC Outbox text_sensor once Home Assistant has subscribed
  # to entity states (zero allow_service_calls privilege needed).
  - id: send_device_hello
    mode: restart
    then:
      - lambda: 'latter_core::mark_hello_in_flight(true, millis());'
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 30s
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - delay: 50ms
            - lambda: |-
                const uint32_t now_ms = millis();
                latter_rpc::bind_sensor_sink(&id(latter_rpc_outbox));
                latter_core::emit_device_hello();
                latter_core::check_and_emit_timer_alarm_state(now_ms, true);
                id(publish_device_telemetry).execute();
                id(publish_display_state).execute();
                latter_core::mark_hello_sent(now_ms, latter_core::persisted_prefs().dirty_mask);
          else:
            - lambda: 'latter_core::mark_hello_in_flight(false);'

  - id: ota_on_begin
    mode: restart
    then:
      - light.turn_on: display_brightness
      - lambda: |-
          auto &rs = latter_core::runtime_state();
          latter_core::video_client().stop();
          latter_ui::release_art(id(remote_album_art));
          latter_ui::release_art(id(home_wallpaper_art));
          id(fetch_screensaver_photo_now).stop();
          id(fetch_screensaver_photo_debounced).stop();
          latter_ui::release_art(id(screensaver_photo_art));
          latter_ui::release_art(id(camera_snapshot_art));
          latter_ui::art_canvas_drop_all();
          latter_ui::evict_registered_psram_caches();
          rs.music.loaded_art_url = "";
          rs.music.loaded_wallpaper_url = "";
          rs.music.loaded_screensaver_photo_url = "";
          rs.music.screensaver_photo_failed = false;
          rs.alert.loaded_camera_url = "";
          latter_core::flush_persisted_prefs_if_dirty();
          latter_core::save_hibernate_snapshot();
          latter_core::handle_ota_begin(&id(disp1), rs);
      - script.execute: apply_power_policy
      - component.update: disp1

  - id: ota_on_error_or_abort
    mode: restart
    then:
      - lambda: 'latter_core::handle_ota_error(&id(disp1), millis());'
      - script.execute: sync_display_brightness
      - script.execute: apply_power_policy
      - lambda: 'latter_core::display_lifecycle().note_activity(millis());'

  - id: handle_time_sync
    mode: single
    then:
      - lambda: |-
          latter_core::hal_rtc_sync_from_system_clock(id(bus_internal));
          auto now_ts = id(ha_time).now();
          if (!now_ts.is_valid()) {
            now_ts = id(sntp_time).now();
          }
          if (now_ts.is_valid()) {
            const auto &p_bt = latter_core::persisted_prefs();
            const int bt_edge = latter_core::bedtime_schedule_tracker().evaluate_hour(
                p_bt.bedtime_schedule, p_bt.bedtime_start_hour, p_bt.bedtime_end_hour, now_ts.hour);
            if (bt_edge >= 0 && (bt_edge == 1) != p_bt.bedtime_active) {
              uint32_t bt_eff = 0U;
              if (latter_core::record_local_pref_edit(
                      latter_core::PrefKey::BEDTIME_ACTIVE, (bt_edge == 1) ? "1" : "0", millis(), bt_eff)) {
                latter_core::device_prefs_state().last_effects |= bt_eff;
                id(apply_device_prefs_effects).execute();
              }
            }
          }
          auto &n = latter_core::runtime_state().nav;
          n.ambient_bri_ramp_pending = (n.display_power_state == 0);
          id(sync_display_brightness).execute();
          if (n.display_power_state != 2 && !n.is_hibernating) {
            latter_ui::record_ambient_frame_ms(0);
            latter_ui::mark_dirty_full();
            latter_ui::schedule_disp_update(&id(disp1));
          }

  # Replay the 1 kB boot ringbuffer and any boot-fault warnings (plus [PROF:BOOT] when the profiler is on)
  # only when a log-viewer client (esphome logs / Device Builder) connects. Home Assistant connects with
  # subscribe_logs: false and receives boot/crash forensics via device_telemetry and device_hello, so skipping
  # replay on HA connects avoids a ~120 ms loop stall during initial v3 hydration and avoids re-dumping stale
  # @...ms boot errors into open viewers.
  - id: log_client_boot_replay
    mode: restart
    then:
      - delay: 3s
      - logger.replay_boot_logs:
      - lambda: 'latter_core::log_boot_summary();'

  - id: toggle_find_my_device
    mode: restart
    then:
      - lambda: |-
          auto &rs = latter_core::runtime_state();
          if (!rs.alarms.find_my_active) {
            rs.audio.preempt_va_for_alert_now();
            rs.alarms.find_my_active = true;
            rs.alarms.find_my_start_ms = millis();
            latter_core::note_wake_reason(latter_core::WakeReason::ALERT);
            id(wake_to_active_state).execute();
            rs.audio.play_alarm();
            latter_ui::schedule_disp_update(&id(disp1));
          } else {
            rs.alarms.find_my_active = false;
            rs.audio.stop_alarm();
            id(sync_display_brightness).execute();
            latter_ui::schedule_disp_update(&id(disp1));
            latter_core::display_lifecycle().note_activity(millis());
          }

  - id: publish_device_telemetry
    mode: restart
    then:
      - lambda: |-
          if (!latter_core::link_state().ha_connected) return;
          latter_core::link_report_init();
          const std::string link_j = latter_core::link_report_json(
              millis(), latter_core::last_reset_reason(),
              latter_core::runtime_state().nav.is_hibernating);
          const int int_free_kb = static_cast<int>(heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024U);
          const int int_min_kb = static_cast<int>(heap_caps_get_minimum_free_size(MALLOC_CAP_INTERNAL) / 1024U);
          const int int_largest_kb = static_cast<int>(heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024U);
          const int psram_min_kb = static_cast<int>(heap_caps_get_minimum_free_size(MALLOC_CAP_SPIRAM) / 1024U);
          #ifdef USE_LATTER_BEACON
          const bool ble_active = id(ble_ctrl).is_active();
          #else
          const bool ble_active = false;
          #endif
          latter_core::emit_device_telemetry(
              link_j, int_free_kb, int_min_kb, int_largest_kb, psram_min_kb,
              ble_active, latter_core::profiler_enabled());

  - id: trigger_firmware_update
    mode: restart
    then:
      - update.perform:
          id: latter_firmware_update
      - lambda: |-
          latter_core::runtime_state().nav.system_menu_mode = 5;
          latter_ui::schedule_disp_update(&id(disp1));

  - id: check_firmware_update
    mode: restart
    then:
      - update.check:
          id: latter_firmware_update
