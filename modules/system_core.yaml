# ==============================================================================
# Latter Core Module: System Boot, Protocol v3 Dispatch, OTA, Diagnostics & Bridge
# (modules/system_core.yaml)
# Layers on top of modules/base.yaml (single api:, time:, send_device_hello,
# and latter_rpc_outbox).
# Zero YAML globals: reads/writes latter_ui::runtime_state() & persisted_prefs().
# ==============================================================================

packages:
  latter_base: !include base.yaml

esphome:
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            auto &rs = latter_ui::runtime_state();
            // A battery past the cutoff powers straight back off before anything else starts (no-op on USB or
            // without a PMU).
            if (rs.hw_boot_battery_check != nullptr) {
              rs.hw_boot_battery_check();
            }
            latter_ui::load_persisted_prefs();
            latter_ui::seed_default_prefs_if_needed();
            // Light-sleep awake lock (created held), wake pins and sleep pad config; no-op without light sleep.
            latter_ui::pm_init();
            id(hal_release_deep_sleep_holds).execute();
            latter_ui::touch_wake_bridge().bind(
                +[]() -> bool { return latter_ui::runtime_state().nav.display_power_state != 0; },
                +[](uint32_t now_ms) { latter_ui::pm_wake_grace_arm(now_ms); });
            latter_ui::hal_release_pwr_key_wake_pad();
            latter_ui::boot_speaker_off_done() = true;
            rs.nav.sleep_start_time = millis();
            rs.nav.standby_entered_ms = 0;
            rs.nav.wake_greeting_pending = true;
            latter_ui::last_screen_wake_ms() = rs.nav.sleep_start_time;
            rs.nav.is_hibernating = false;
            rs.nav.display_power_state = 0; // ACTIVE
            rs.music.active_speaker_name = "${friendly_name}";
            rs.music_slots()[0].name = "${friendly_name}";

            rs.on_ha_client_connected = +[](const std::string &client_info, const std::string &client_address) {
              auto &r = latter_ui::runtime_state();
              const bool is_ha_conn = client_info.find("Home Assistant") != std::string::npos;
              if (is_ha_conn) {
                latter_ui::link_state().ha_connected = true;
                latter_ui::link_state().last_ha_connect_ms = millis();
                r.alert.last_seen_alert_id = -1;
                r.nav.last_pub_display_power_state = -1;
                r.nav.last_pub_display_bri_pct = -1;
              }
              latter_ui::link_report_api_connected(is_ha_conn, millis());
              esphome::voice_assistant::on_api_client_authenticated(id(va), client_info, client_address);
              if (r.nav.display_power_state == 0 && !r.nav.is_hibernating) {
                latter_ui::schedule_disp_update(&id(disp1));
              }
              id(apply_power_policy).execute();  // holds the light-sleep awake lock while the link settles
              if (!is_ha_conn) {
                id(log_client_boot_replay).execute();
              }
            };

            rs.on_ha_client_disconnected = +[](const std::string &client_info) {
              auto &r = latter_ui::runtime_state();
              const bool is_ha_disc = client_info.find("Home Assistant") != std::string::npos;
              latter_ui::link_report_api_disconnected(is_ha_disc, millis());
              if (is_ha_disc && latter_ui::link_report().ha_clients == 0) {
                latter_ui::link_state().ha_connected = false;
                latter_ui::link_state().last_ha_disconnect_ms = millis();
              }
              if (r.nav.display_power_state == 0 && !r.nav.is_hibernating) {
                latter_ui::schedule_disp_update(&id(disp1));
              }
              id(apply_power_policy).execute();  // a dropped link takes the awake lock back to reconnect
            };

            rs.on_hello_sent = +[]() {
              auto &r = latter_ui::runtime_state();
              r.nav.last_pub_display_power_state = -1;
              r.nav.last_pub_display_bri_pct = -1;
              id(publish_device_telemetry).execute();
              id(publish_display_state).execute();
            };


    - priority: -100
      then:
        # SDK revision lockstep stamp: LATTER_YAML_REV must equal LATTER_SDK_REV in include/esphome_bridge.h
        # (verify_core.py enforces). It lives in this lambda, not in build_flags, so bumping it recompiles
        # only main.cpp instead of invalidating the CMake cache and every object in the build.
        - lambda: |-
            constexpr long LATTER_YAML_REV = 2026112007L;
            static_assert(LATTER_YAML_REV == LATTER_SDK_REV,
                          "Latter YAML packages and latter_core C++ headers are from different revisions. "
                          "ESPHome caches github:// packages for a day: set refresh: 0s on the Latter package "
                          "(docs/flashing.md) and rebuild.");
            ESP_LOGI("latter", "Latter SDK rev %ld (YAML rev %ld)", (long)LATTER_SDK_REV, LATTER_YAML_REV);
            latter_ui::start_stall_guard();
            latter_ui::link_report_init();
            id(latter_mic_i2s).add_data_callback([](const microphone::AudioCapture &c) {
              if (c.stream_info.get_bits_per_sample() == 16) latter_ui::echo_meter_feed(c.data.data(), c.data.size());
            });
            auto &rs = latter_ui::runtime_state();
            if (rs.hw_init_pmu != nullptr) {
              rs.hw_init_pmu();
            }
            if (latter_ui::load_hibernate_snapshot_if_cold()) {
              const auto &ac = latter_ui::area_ctx_state();
              if (!ac.area_name.empty()) {
                latter_ui::latter_area_label() = ac.area_name;
              }
            }
            latter_ui::hal_rtc_restore_system_clock(id(bus_internal));
            latter_ui::parse_latter_remote_slots_summary(latter_ui::remote_state().slots_summary);
            rs.remote.active_slot = latter_ui::resolve_active_remote_slot(rs.remote.active_slot);
        - media_player.pause: latter_media_player
        - lambda: |-
            float sv = static_cast<float>(latter_ui::persisted_prefs().speaker_volume_pct);
            if (sv >= 10.0f && sv <= 100.0f) {
              float target_v = std::clamp(sv / 100.0f, 0.10f, 1.00f);
              id(latter_media_player).volume = target_v;
              id(latter_media_player).make_call().set_volume(target_v).perform();
            }
            latter_ui::speaker_volume_boot_synced() = true;
        - lambda: 'latter_ui::release_art(id(remote_album_art));'
        - lambda: 'latter_ui::release_art(id(home_wallpaper_art));'
        - lambda: 'latter_ui::release_art(id(screensaver_photo_art));'
        - lambda: 'latter_ui::release_art(id(camera_snapshot_art));'
        - lambda: |-
            auto &rs = latter_ui::runtime_state();
            rs.music.loaded_art_url = "";
            rs.music.loaded_wallpaper_url = "";
            rs.music.loaded_screensaver_photo_url = "";
            rs.alert.loaded_camera_url = "";
        - script.execute: mute_speaker_path
        - script.execute: sync_ui_touch_runtime
        - script.execute: apply_default_start_page
        - script.execute: apply_theme_preset
        - lambda: |-
            auto &rs = latter_ui::runtime_state();
            if (rs.hw_update_batt_level != nullptr) {
              rs.hw_update_batt_level();
            }
        - script.execute: apply_wake_word_sensitivities
        - script.execute: sync_display_brightness
        - lambda: 'latter_ui::display_lifecycle().note_activity(millis());'
        - script.execute: apply_power_policy

api:
  actions:
    # Reset to defaults (Latter Studio / latter.reset_device). Same panel hand-off as Restart Device:
    # AMOLED panels left awake across a reboot don't come back from their next DCS sleep.
    - action: latter_factory_reset
      then:
        - logger.log:
            level: WARN
            format: "Reset to defaults requested by Latter: erasing saved settings and rebooting"
        - light.turn_off: display_brightness
        - component.update: disp1
        - delay: 100ms
        - button.press: internal_factory_reset

    - action: latter_set_beacon_uuid
      id: latter_set_beacon_uuid_action
      variables:
        uuid: string
      then:
        - lambda: 'id(ble_ctrl).set_uuid_hex(std::string_view(uuid.c_str(), uuid.size()));'

    - action: latter_set_slots
      variables:
        is_area_slots: bool
        req_id: int
        mode: string
        page: int
        total_pages: int
        slots: string
      then:
        - lambda: |-
            if (latter_ui::apply_slots_action(
                    req_id, std::string_view(mode.c_str(), mode.size()),
                    page, total_pages, std::string_view(slots.c_str(), slots.size()),
                    millis(), is_area_slots)) {
              latter_ui::schedule_disp_update(&id(disp1));
            }

    - action: latter_set_music_lyrics
      variables:
        req_id: int
        chunk_index: int
        chunk_count: int
        track_key: string
        synced: bool
        lines: string
      then:
        - lambda: |-
            if (latter_ui::apply_music_lyrics_action(
                    req_id, chunk_index, chunk_count,
                    std::string_view(track_key.c_str(), track_key.size()),
                    synced,
                    std::string_view(lines.c_str(), lines.size()))) {
              const auto &rs = latter_ui::runtime_state();
              if (rs.nav.display_power_state == 0 && !rs.nav.is_hibernating) {
                if (rs.nav.gui_page == latter_ui::PageId::MUSIC &&
                    rs.music.view == latter_ui::MusicView::LYRICS) {
                  latter_ui::ensure_ui_anim_poller(id(ui_anim_tick));
                }
                latter_ui::mark_dirty_full();
                latter_ui::schedule_disp_update(&id(disp1));
              }
            }

    - action: latter_set_calendar_view
      variables:
        req_id: int
        chunk_index: int
        chunk_count: int
        window_start: string
        window_end: string
        events: string
      then:
        - lambda: |-
            if (latter_ui::apply_calendar_view_action(
                    req_id, chunk_index, chunk_count,
                    std::string_view(window_start.c_str(), window_start.size()),
                    std::string_view(window_end.c_str(), window_end.size()),
                    std::string_view(events.c_str(), events.size()))) {
              const auto &rs = latter_ui::runtime_state();
              if (rs.nav.display_power_state == 0 && !rs.nav.is_hibernating) {
                latter_ui::mark_dirty_full();
                latter_ui::schedule_disp_update(&id(disp1));
              }
            }

    - action: latter_show_notification
      variables:
        title: string
        message: string
        priority: string
        duration: int
        chime: bool
        camera_url: string
        camera_entity: string
        alert_id: int
      then:
        - lambda: |-
            auto &rs = latter_ui::runtime_state();
            if (!latter_ui::trigger_alert_banner(
                    std::string_view(title.c_str(), title.size()),
                    std::string_view(message.c_str(), message.size()),
                    std::string_view(priority.c_str(), priority.size()),
                    duration,
                    std::string_view(camera_url.c_str(), camera_url.size()),
                    alert_id, millis(), false, rs.alert,
                    std::string_view(camera_entity.c_str(), camera_entity.size()))) {
              return;
            }
            const auto &prefs = latter_ui::persisted_prefs();
            const bool is_doorbell = !rs.alert.camera_entity.empty() || !rs.alert.camera_url.empty();
            const bool dnd_suppress = latter_ui::should_suppress_alert_in_dnd(
                prefs.do_not_disturb, static_cast<int>(rs.alert.priority_level), is_doorbell);
            const bool bt_suppress = latter_ui::should_suppress_alert_in_bedtime(
                prefs.bedtime_active, rs.alert.priority_level);
            if (dnd_suppress || (bt_suppress && rs.nav.display_power_state != 0)) {
              rs.alert.active = false;
              return;
            }
            id(preempt_va_for_alert).execute();
            latter_ui::note_wake_reason(latter_ui::WakeReason::NOTIFY);
            id(wake_to_active_state).execute();
            const bool dnd_chime_suppress = latter_ui::should_suppress_alert_chime_in_dnd(
                prefs.do_not_disturb, static_cast<int>(rs.alert.priority_level), is_doorbell);
            if (chime && !bt_suppress && !dnd_chime_suppress && !rs.voice.active && !rs.voice.tts_received) {
              int sfx = (rs.alert.priority == "critical" || rs.alert.priority == "warning") ? 9 : 6;
              id(play_game_sfx).execute(sfx);
            }
            if (latter_ui::is_p4_live_doorbell_popup_enabled(
                    latter_ui::persisted_prefs(), latter_ui::area_ctx_state(), rs.alert)) {
              rs.cameras.doorbell_live_popup_active = true;
              id(sync_camera_stream).execute();
            } else {
              rs.cameras.doorbell_live_popup_active = false;
              if (!rs.alert.camera_url.empty()) {
                id(fetch_camera_snapshot).execute();
              } else {
                rs.alert.loaded_camera_url = "";
                latter_ui::release_art(id(camera_snapshot_art));
              }
            }
            latter_ui::schedule_disp_update(&id(disp1));

# Both OTA paths share the display wake, progress takeover, and light-sleep awake-lock hooks.
ota:
  - platform: http_request
    id: ota_http
    on_begin:
      then:
        - light.turn_on: display_brightness
        - lambda: |-
            auto &rs = latter_ui::runtime_state();
            latter_ui::video_client().stop();
            latter_ui::release_art(id(remote_album_art));
            latter_ui::release_art(id(home_wallpaper_art));
            id(fetch_screensaver_photo_now).stop();
            id(fetch_screensaver_photo_debounced).stop();
            latter_ui::release_art(id(screensaver_photo_art));
            latter_ui::release_art(id(camera_snapshot_art));
            latter_ui::art_canvas_drop_all();
            latter_ui::sky_base_cache_drop();
            rs.music.loaded_art_url = "";
            rs.music.loaded_wallpaper_url = "";
            rs.music.loaded_screensaver_photo_url = "";
            rs.music.screensaver_photo_failed = false;
            rs.alert.loaded_camera_url = "";
            latter_ui::handle_ota_begin(&id(disp1), rs);
        - script.execute: apply_power_policy
        - component.update: disp1
    on_progress:
      then:
        - lambda: 'latter_ui::handle_ota_progress(&id(disp1), x, millis());'
    on_end:
      then:
        - lambda: 'latter_ui::handle_ota_end(&id(disp1));'
    on_error:
      then:
        - lambda: 'latter_ui::handle_ota_error(&id(disp1), millis());'
        - script.execute: sync_display_brightness
        - script.execute: apply_power_policy
        - lambda: 'latter_ui::display_lifecycle().note_activity(millis());'
    on_abort:
      then:
        - lambda: 'latter_ui::handle_ota_error(&id(disp1), millis());'
        - script.execute: sync_display_brightness
        - script.execute: apply_power_policy
        - lambda: 'latter_ui::display_lifecycle().note_activity(millis());'

  - platform: esphome
    id: ota_esphome
    on_begin:
      then:
        - light.turn_on: display_brightness
        - lambda: |-
            auto &rs = latter_ui::runtime_state();
            latter_ui::video_client().stop();
            latter_ui::release_art(id(remote_album_art));
            latter_ui::release_art(id(home_wallpaper_art));
            id(fetch_screensaver_photo_now).stop();
            id(fetch_screensaver_photo_debounced).stop();
            latter_ui::release_art(id(screensaver_photo_art));
            latter_ui::release_art(id(camera_snapshot_art));
            latter_ui::art_canvas_drop_all();
            latter_ui::sky_base_cache_drop();
            rs.music.loaded_art_url = "";
            rs.music.loaded_wallpaper_url = "";
            rs.music.loaded_screensaver_photo_url = "";
            rs.music.screensaver_photo_failed = false;
            rs.alert.loaded_camera_url = "";
            latter_ui::handle_ota_begin(&id(disp1), rs);
        - script.execute: apply_power_policy
        - component.update: disp1
    on_progress:
      then:
        - lambda: 'latter_ui::handle_ota_progress(&id(disp1), x, millis());'
    on_end:
      then:
        - lambda: 'latter_ui::handle_ota_end(&id(disp1));'
    on_error:
      then:
        - lambda: 'latter_ui::handle_ota_error(&id(disp1), millis());'
        - script.execute: sync_display_brightness
        - script.execute: apply_power_policy
        - lambda: 'latter_ui::display_lifecycle().note_activity(millis());'
    on_abort:
      then:
        - lambda: 'latter_ui::handle_ota_error(&id(disp1), millis());'
        - script.execute: sync_display_brightness
        - script.execute: apply_power_policy
        - lambda: 'latter_ui::display_lifecycle().note_activity(millis());'

time:
  - id: !extend ha_time
    on_time_sync:
      then:
        - lambda: |-
            latter_ui::hal_rtc_sync_from_system_clock(id(bus_internal));
            const auto &n = latter_ui::runtime_state().nav;
            if (n.display_power_state == 0 && !n.is_hibernating) {
              latter_ui::record_ambient_frame_ms(0);
            }
  - id: !extend sntp_time
    on_time_sync:
      then:
        - lambda: |-
            latter_ui::hal_rtc_sync_from_system_clock(id(bus_internal));
            const auto &n = latter_ui::runtime_state().nav;
            if (n.display_power_state == 0 && !n.is_hibernating) {
              latter_ui::record_ambient_frame_ms(0);
            }

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    id: latter_wifi_signal
    entity_category: diagnostic
    update_interval: 60s

button:
  - platform: restart
    name: "Internal Restart"
    id: internal_restart
    internal: true

  - platform: factory_reset
    name: "Internal Factory Reset"
    id: internal_factory_reset
    internal: true

  - platform: template
    name: "Actions: Restart Device"
    id: restart_button
    device_class: restart
    icon: "mdi:restart"
    entity_category: diagnostic
    on_press:
      - lambda: 'latter_ui::flush_persisted_prefs_if_dirty();'
      - light.turn_off: display_brightness
      - component.update: disp1
      - delay: 150ms
      - lambda: 'latter_ui::hal_prepare_touch_for_restart();'
      - delay: 20ms
      - button.press: internal_restart

binary_sensor:
  - id: !extend boot_button
    on_press:
      then:
        - lambda: |-
            static uint32_t last_btn_press = 0;
            uint32_t now = millis();
            if (now - last_btn_press < 150) return;
            last_btn_press = now;
        - if:
            condition:
              lambda: |-
                const auto &rs = latter_ui::runtime_state();
                return rs.alarms.find_my_active || rs.timers.ringing || rs.alarms.ringing || rs.alert.active;
            then:
              - lambda: |-
                  auto &rs = latter_ui::runtime_state();
                  if (rs.alert.active) {
                    id(dismiss_notification).execute();
                    return;
                  }
                  rs.alarms.find_my_active = false;
                  rs.timers.ringing = false;
                  rs.alarms.ringing = false;
                  latter_actions::check_and_emit_timer_alarm_state(millis());
                  id(stop_alarm_sound).execute();
                  id(sync_display_brightness).execute();
                  latter_ui::mark_dirty_full();
                  latter_ui::schedule_disp_update(&id(disp1));
                  latter_ui::display_lifecycle().note_activity(millis());
            else:
              - if:
                  condition:
                    lambda: 'return latter_ui::runtime_state().nav.active_game > 0;'
                  then:
                    - lambda: 'latter_ui::runtime_state().nav.game_btn_pressed = true;'
                  else:
                    - script.execute: toggle_voice_assistant

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: latter_ip_address

interval:
  - interval: 60s
    then:
      - lambda: |-
          latter_ui::link_report_init();
          latter_ui::link_report_sample();
          (void)latter_ui::link_report_log_line(millis(), latter_ui::last_reset_reason());
          if (latter_ui::link_state().ha_connected) {
            id(publish_device_telemetry).execute();
          }

script:
  # Replay the boot ringbuffer and [PROF:BOOT] summary only when a log-viewer client (esphome logs /
  # Device Builder) connects. Home Assistant connects with subscribe_logs: false and receives boot/crash
  # forensics via device_telemetry and device_hello, so skipping replay on HA connects avoids a ~120 ms
  # loop stall during initial v3 hydration and avoids re-dumping stale @...ms boot errors into open viewers.
  - id: log_client_boot_replay
    mode: restart
    then:
      - delay: 3s
      - logger.replay_boot_logs:
      - lambda: 'latter_ui::log_boot_summary();'

  - id: toggle_find_my_device
    mode: restart
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          if (!rs.alarms.find_my_active) {
            id(preempt_va_for_alert).execute();
            rs.alarms.find_my_active = true;
            rs.alarms.find_my_start_ms = millis();
            latter_ui::note_wake_reason(latter_ui::WakeReason::ALERT);
            id(wake_to_active_state).execute();
            id(play_alarm_sound).execute();
            latter_ui::schedule_disp_update(&id(disp1));
          } else {
            rs.alarms.find_my_active = false;
            id(stop_alarm_sound).execute();
            id(sync_display_brightness).execute();
            latter_ui::schedule_disp_update(&id(disp1));
            latter_ui::display_lifecycle().note_activity(millis());
          }

  - id: publish_device_telemetry
    mode: restart
    then:
      - lambda: |-
          if (!latter_ui::link_state().ha_connected) return;
          latter_ui::link_report_init();
          const std::string link_j = latter_ui::link_report_json(
              millis(), latter_ui::last_reset_reason(),
              latter_ui::runtime_state().nav.is_hibernating);
          const int int_free_kb = static_cast<int>(heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024U);
          const int int_min_kb = static_cast<int>(heap_caps_get_minimum_free_size(MALLOC_CAP_INTERNAL) / 1024U);
          const int int_largest_kb = static_cast<int>(heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024U);
          const int psram_min_kb = static_cast<int>(heap_caps_get_minimum_free_size(MALLOC_CAP_SPIRAM) / 1024U);
          latter_actions::emit_device_telemetry(
              link_j, int_free_kb, int_min_kb, int_largest_kb, psram_min_kb,
              id(ble_ctrl).is_active(), latter_ui::profiler_enabled());

  - id: trigger_firmware_update
    mode: restart
    then:
      - update.perform:
          id: latter_firmware_update
      - lambda: |-
          latter_ui::runtime_state().nav.system_menu_mode = 5;
          latter_ui::schedule_disp_update(&id(disp1));

  - id: check_firmware_update
    mode: restart
    then:
      - update.check:
          id: latter_firmware_update
