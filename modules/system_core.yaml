# ==============================================================================
# Latter Core Module: System Boot, Protocol v3 Dispatch, OTA, Diagnostics & Bridge
# (modules/system_core.yaml)
# Layers on top of modules/base.yaml (single api:, time:, send_device_hello,
# latter_hardware_manifest, and latter_rpc_outbox).
# Zero YAML globals: reads/writes latter_ui::runtime_state() & persisted_prefs().
# ==============================================================================

packages:
  latter_base: !include base.yaml

esphome:
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            auto &rs = latter_ui::runtime_state();
            // A battery past the cutoff powers straight back off before anything else starts (no-op on USB or
            // without a PMU).
            if (rs.hw_boot_battery_check != nullptr) {
              rs.hw_boot_battery_check();
            }
            latter_ui::load_persisted_prefs();
            // Light-sleep awake lock (created held), wake pins and sleep pad config; no-op without light sleep.
            latter_ui::pm_init();
            id(hal_release_deep_sleep_holds).execute();
            latter_ui::hal_release_pwr_key_wake_pad();
            latter_ui::boot_speaker_off_done() = true;
            rs.nav.sleep_start_time = millis();
            rs.nav.is_hibernating = false;
            rs.nav.display_power_state = 0; // ACTIVE
            rs.music.active_speaker_name = "${friendly_name}";
            rs.music_slots()[0].name = "${friendly_name}";

            rs.on_ha_client_connected = +[](const std::string &client_info, const std::string &client_address) {
              auto &r = latter_ui::runtime_state();
              const bool is_ha_conn = client_info.find("Home Assistant") != std::string::npos;
              if (is_ha_conn) {
                latter_ui::link_state().ha_connected = true;
                latter_ui::link_state().last_ha_connect_ms = millis();
                r.alert.last_seen_alert_id = -1;
              }
              latter_ui::link_report_api_connected(is_ha_conn, millis());
              esphome::voice_assistant::on_api_client_authenticated(id(va), client_info, client_address);
              if (r.nav.display_power_state == 0 && !r.nav.is_hibernating) {
                latter_ui::schedule_disp_update(&id(disp1));
              }
              id(sys_link_report).update();
              id(apply_power_policy).execute();  // holds the light-sleep awake lock while the link settles
              id(ha_post_connect_boot_replay).execute();
            };

            rs.on_ha_client_disconnected = +[](const std::string &client_info) {
              auto &r = latter_ui::runtime_state();
              const bool is_ha_disc = client_info.find("Home Assistant") != std::string::npos;
              latter_ui::link_report_api_disconnected(is_ha_disc, millis());
              if (is_ha_disc && latter_ui::link_report().ha_clients == 0) {
                latter_ui::link_state().ha_connected = false;
                latter_ui::link_state().last_ha_disconnect_ms = millis();
              }
              if (r.nav.display_power_state == 0 && !r.nav.is_hibernating) {
                latter_ui::schedule_disp_update(&id(disp1));
              }
              id(apply_power_policy).execute();  // a dropped link takes the awake lock back to reconnect
            };

            rs.on_v3_domain_pushed = +[](std::string_view sv_dom, const std::string &prev_dock) {
              auto &r = latter_ui::runtime_state();
              auto &prefs = latter_ui::persisted_prefs();
              if (sv_dom == "area_context") {
                const auto &st = latter_ui::area_ctx_state();
                r.area.active_area_name = st.area_name;  // "" without an Area
                latter_ui::latter_area_label() = st.area_name;
                const bool area_changed = !st.area_id.empty() && st.area_id != r.area.active_area_id;
                if (area_changed) {
                  r.area.active_area_id = st.area_id;
                  r.slot_page_for(latter_rpc::SlotChannel::AREA_ENTITIES) = 1;
                  latter_ui::area_cat_dock_page() = 0;
                  latter_ui::mark_dirty_full();
                }
                {
                  latter_ui::area_available_domains_csv() = st.available_domains;
                  std::string valid_cat = latter_ui::resolve_preferred_area_category(
                      std::string(id(area_default_category_select).current_option()),
                      id(area_show_all_category_switch).state);
                  std::string cats[8];
                  int cnt = latter_ui::collect_area_categories(id(area_show_all_category_switch).state, cats);
                  bool cur_ok = false;
                  int act_idx = 0;
                  for (int i = 0; i < cnt; i++) {
                    if (cats[i] == r.area.domain_filter) { cur_ok = true; act_idx = i; break; }
                  }
                  if (!cur_ok && !valid_cat.empty()) {
                    r.area.domain_filter = valid_cat;
                    for (int i = 0; i < cnt; i++) {
                      if (cats[i] == valid_cat) { act_idx = i; break; }
                    }
                  }
                  if ((area_changed || (!cur_ok && !valid_cat.empty())) &&
                      r.nav.gui_page == 6 && r.nav.area_subpage == 0) {
                    r.slot_page_for(latter_rpc::SlotChannel::AREA_ENTITIES) = 1;
                    id(fetch_area_browse).execute();
                  }
                  latter_ui::sync_mode_bar_window(latter_ui::area_cat_dock_page(), act_idx, cnt);
                }
                if (!st.dock_apps.empty() && st.dock_apps != prev_dock) {
                  latter_ui::latter_dock_order_csv() = st.dock_apps;
                  latter_ui::home_dock_page() = 0;
                }
                r.area.alarm_entity = st.alarm_entity;
                r.area.alarm_state = st.alarm_state;
                if (!st.site_id.empty()) {
                  latter_ui::latter_site_id() = st.site_id;
                }
                latter_ui::latter_ble_proxy() = st.ble_closest_proxy;
                latter_ui::cam_listen_active() = (st.doorbell_talk_state == "listening");
                if (st.theme_color_hex.size() == 7 && st.theme_color_hex[0] == '#') {
                  uint32_t new_rgb = latter_ui::parse_hex_rgb(st.theme_color_hex, prefs.custom_theme_rgb);
                  if (new_rgb != prefs.custom_theme_rgb) {
                    prefs.custom_theme_rgb = new_rgb;
                    latter_ui::save_persisted_prefs();
                    if (id(theme_palette_select).current_option() == "Custom") {
                      id(apply_theme_preset).execute();
                    }
                  }
                }
                if (latter_ui::trigger_alert_banner(
                        st.alert_title, st.alert_message, st.alert_priority, st.alert_duration,
                        st.alert_camera_url, st.alert_id, millis(), true, r.alert)) {
                  latter_ui::note_wake_reason(latter_ui::WakeReason::NOTIFY);
                  id(wake_to_active_state).execute();
                  if (st.alert_chime && !r.voice.active && !r.voice.tts_received) {
                    int sfx = (r.alert.priority == "critical" || r.alert.priority == "warning") ? 9 : 6;
                    id(play_game_sfx).execute(sfx);
                  }
                  if (!r.alert.camera_url.empty()) {
                    id(fetch_camera_snapshot).execute();
                  } else {
                    r.alert.loaded_camera_url = "";
                    latter_ui::release_art(id(camera_snapshot_art));
                  }
                }
                bool wallpaper_cleared = false;
                if (st.wallpaper_url.empty()) {
                  if (!r.music.loaded_wallpaper_url.empty()) {
                    id(fetch_wallpaper_debounced).stop();
                    r.music.loaded_wallpaper_url = "";
                    latter_ui::release_art(id(home_wallpaper_art));
                    wallpaper_cleared = true;
                  }
                } else if (r.nav.display_power_state == 0 && st.wallpaper_url != r.music.loaded_wallpaper_url) {
                  id(fetch_wallpaper_debounced).execute();
                }
                if (r.nav.display_power_state == 0 && !r.nav.is_hibernating) {
                  const int gp = r.nav.gui_page;
                  if (wallpaper_cleared) {
                    latter_ui::mark_dirty_full();
                  }
                  if (wallpaper_cleared || r.alert.active || gp == 1 || gp == 4 || gp == 6 || gp == 7 || gp == 9 ||
                      (gp == 8 && (r.nav.tools_subpage == 10 || r.nav.tools_subpage == 12))) {
                    latter_ui::schedule_disp_update(&id(disp1));
                  }
                }
              } else if (sv_dom == "active_media") {
                static std::string s_prev_title;
                static std::string s_prev_artist;
                static std::string s_prev_album;
                static std::string s_prev_state;
                static std::string s_prev_spk;
                static std::string s_prev_spk_name;
                static std::string s_prev_art;
                static bool s_prev_is_local = false;
                static int s_prev_vol_pct = -1;

                const auto &ms = latter_ui::media_state();
                float prev_interp_pos = r.music.pos_base;
                if (r.music.pos_sync_time > 0 && s_prev_state == "playing") {
                  prev_interp_pos += static_cast<float>(millis() - r.music.pos_sync_time) / 1000.0f;
                }

                r.music.active_playback_media_type = ms.media_type;
                if (ms.position >= 0.0f) {
                  r.music.pos_base = ms.position;
                  r.music.pos_sync_time = millis();
                }
                if (!ms.active_speaker.empty()) {
                  if (!r.music.active_speaker_entity.empty() && r.music.active_speaker_entity != ms.active_speaker &&
                      latter_ui::media_state().last_speaker.empty()) {
                    latter_ui::media_state().last_speaker = r.music.active_speaker_entity;
                  }
                  r.music.active_speaker_entity = ms.active_speaker;
                }
                if (!ms.speaker_name.empty()) {
                  r.music.active_speaker_name = ms.speaker_name;
                } else if (ms.is_local) {
                  r.music.active_speaker_name = "${friendly_name}";
                } else if (!ms.active_speaker.empty()) {
                  std::string s = ms.active_speaker;
                  size_t dot = s.find('.');
                  if (dot != std::string::npos) s = s.substr(dot + 1);
                  bool cap = true;
                  for (size_t i = 0; i < s.length(); i++) {
                    if (s[i] == '_') { s[i] = ' '; cap = true; }
                    else if (cap) { s[i] = toupper(s[i]); cap = false; }
                  }
                  r.music.active_speaker_name = s;
                }
                if (ms.has_volume && ms.volume >= 0.0f && ms.volume <= 1.0f) {
                  if (millis() - latter_ui::last_local_vol_tap_ms() > 3000U || ms.active_speaker != s_prev_spk) {
                    latter_ui::remote_vol_pct() = static_cast<int>(std::round(ms.volume * 100.0f));
                    if (ms.is_local) {
                      id(latter_media_player).volume = ms.volume;
                      id(physical_speaker).set_volume(latter_ui::media_dac_volume(ms.volume));
                    }
                  }
                }
                if (ms.title != s_prev_title) {
                  r.music.action_feedback = "";
                  if (!ms.title.empty()) {
                    latter_ui::music_queue_cleared() = false;
                  }
                }
                if (ms.art_url.empty()) {
                  if (!r.music.loaded_art_url.empty()) {
                    id(fetch_remote_art_debounced).stop();
                    r.music.loaded_art_url = "";
                    latter_ui::release_art(id(remote_album_art));
                  }
                } else if (r.nav.display_power_state == 0 && r.nav.gui_page == 2 &&
                           id(music_fullscreen_art_mode).current_option() != "None" &&
                           (!ms.is_local || id(album_art).get_width() == 0) &&
                           ms.art_url != r.music.loaded_art_url) {
                  if (ms.art_url != s_prev_art || !id(fetch_remote_art_debounced).is_running()) {
                    id(fetch_remote_art_debounced).execute();
                  }
                }
                const bool pos_jumped = (ms.position >= 0.0f) && (std::fabs(ms.position - prev_interp_pos) > 2.5f);
                const bool media_ui_changed =
                    (ms.title != s_prev_title) ||
                    (ms.artist != s_prev_artist) ||
                    (ms.album != s_prev_album) ||
                    (ms.state != s_prev_state) ||
                    (ms.active_speaker != s_prev_spk) ||
                    (ms.speaker_name != s_prev_spk_name) ||
                    (ms.art_url != s_prev_art) ||
                    (ms.is_local != s_prev_is_local) ||
                    (latter_ui::remote_vol_pct() != s_prev_vol_pct) ||
                    pos_jumped;

                s_prev_title = ms.title;
                s_prev_artist = ms.artist;
                s_prev_album = ms.album;
                s_prev_state = ms.state;
                s_prev_spk = ms.active_speaker;
                s_prev_spk_name = ms.speaker_name;
                s_prev_art = ms.art_url;
                s_prev_is_local = ms.is_local;
                s_prev_vol_pct = latter_ui::remote_vol_pct();

                if (media_ui_changed && r.nav.display_power_state == 0 && (r.nav.gui_page == 1 || r.nav.gui_page == 2)) {
                  id(throttled_disp_update).execute();
                }
              } else if (sv_dom == "remote_config") {
                const auto &rem = latter_ui::remote_state();
                latter_ui::parse_latter_remote_slots_summary(rem.slots_summary);
                r.remote.active_slot = latter_ui::resolve_active_remote_slot(rem.active_slot);
                latter_ui::home_dock_page() = 0;
                if (!latter_ui::has_any_configured_remote() && r.nav.gui_page == 7) {
                  r.nav.gui_page = 1;
                  r.nav.remote_subpage = 0;
                }
                if (r.nav.display_power_state == 0 && (r.nav.gui_page == 1 || r.nav.gui_page == 7) && millis() > 3000) {
                  latter_ui::schedule_disp_update(&id(disp1));
                }
              } else if (sv_dom == "weather_forecast") {
                static std::string s_prev_sun;
                if (latter_ui::weather_state().sun_state != s_prev_sun) {
                  s_prev_sun = latter_ui::weather_state().sun_state;
                  id(sync_display_brightness).execute();
                }
                if (r.nav.display_power_state == 0 && !r.nav.is_hibernating) {
                  latter_ui::weather_sim_dirty() = true;
                  latter_ui::record_ambient_frame_ms(0);
                  latter_ui::schedule_disp_update(&id(disp1));
                }
              } else if (sv_dom == "calendar_agenda") {
                if (r.nav.display_power_state == 0 &&
                    (r.nav.gui_page == 1 || (r.nav.gui_page == 8 && r.nav.tools_subpage == 9))) {
                  latter_ui::schedule_disp_update(&id(disp1));
                }
              }
            };

    - priority: -100
      then:
        # SDK revision lockstep stamp: LATTER_YAML_REV must equal LATTER_SDK_REV in include/esphome_bridge.h
        # (verify_core.py enforces). It lives in this lambda, not in build_flags, so bumping it recompiles
        # only main.cpp instead of invalidating the CMake cache and every object in the build.
        - lambda: |-
            constexpr long LATTER_YAML_REV = 2026111202L;
            static_assert(LATTER_YAML_REV == LATTER_SDK_REV,
                          "Latter YAML packages and latter_core C++ headers are from different revisions. "
                          "ESPHome caches github:// packages for a day: set refresh: 0s on the Latter package "
                          "(docs/flashing.md) and rebuild.");
            ESP_LOGI("latter", "Latter SDK rev %ld (YAML rev %ld)", (long)LATTER_SDK_REV, LATTER_YAML_REV);
            latter_ui::start_stall_guard();
            latter_ui::link_report_init();
            id(latter_mic_i2s).add_data_callback([](const microphone::AudioCapture &c) {
              if (c.stream_info.get_bits_per_sample() == 16) latter_ui::echo_meter_feed(c.data.data(), c.data.size());
            });
            auto &rs = latter_ui::runtime_state();
            if (rs.hw_init_pmu != nullptr) {
              rs.hw_init_pmu();
            }
            latter_ui::parse_latter_remote_slots_summary(latter_ui::remote_state().slots_summary);
            rs.remote.active_slot = latter_ui::resolve_active_remote_slot(rs.remote.active_slot);
        - media_player.pause: latter_media_player
        - lambda: |-
            float sv = id(speaker_volume).state;
            if (!std::isnan(sv) && sv >= 10.0f && sv <= 100.0f) {
              float target_v = std::clamp(sv / 100.0f, 0.10f, 1.00f);
              id(latter_media_player).volume = target_v;
              id(latter_media_player).make_call().set_volume(target_v).perform();
            }
            latter_ui::speaker_volume_boot_synced() = true;
        - lambda: 'latter_ui::release_art(id(remote_album_art));'
        - lambda: 'latter_ui::release_art(id(home_wallpaper_art));'
        - lambda: 'latter_ui::release_art(id(camera_snapshot_art));'
        - lambda: |-
            auto &rs = latter_ui::runtime_state();
            rs.music.loaded_art_url = "";
            rs.music.loaded_wallpaper_url = "";
            rs.alert.loaded_camera_url = "";
            id(latter_hardware_manifest).publish_state(latter_ui::build_hardware_manifest_state_json());
        - script.execute: mute_speaker_path
        - script.execute: apply_default_start_page
        - script.execute: apply_theme_preset
        - lambda: |-
            auto &prefs = latter_ui::persisted_prefs();
            #if !LATTER_ROUND_DISPLAY
            static bool non_round_clock_seeded = false;
            if (!non_round_clock_seeded) {
              non_round_clock_seeded = true;
              if (id(clock_face_style).current_option() == "Modern Roman (Analog)") {
                auto call = id(clock_face_style).make_call();
                call.set_option("Minimal Digital");
                call.perform();
              }
            }
            #endif
            prefs.clock_face_digital = (id(clock_face_style).current_option() != "Modern Roman (Analog)");
            prefs.is_24h_format = (id(time_format_select).current_option() == "24-Hour");
            auto &rs = latter_ui::runtime_state();
            if (rs.hw_update_batt_level != nullptr) {
              rs.hw_update_batt_level();
            }
            if (!prefs.power_profile_seeded) {
              prefs.power_profile_seeded = true;
              latter_ui::apply_power_profile_spec(
                  "${default_power_profile}", id(va_wake_word_mode), id(tap_wake_mode),
                  id(pickup_wake_mode), id(display_off_timeout),
                  id(screensaver_docked_timeout), id(hibernate_timeout_mode),
                  id(docked_screensaver_switch));
            } else {
              latter_ui::clamp_power_capabilities(id(pickup_wake_mode), id(hibernate_timeout_mode));
            }
            latter_ui::save_persisted_prefs();
        - script.execute: apply_wake_word_sensitivities
        - script.execute: sync_display_brightness
        - script.execute: screen_sleep_timer
        - script.execute: sync_ui_touch_runtime

api:
  actions:
    # Reset to defaults (Latter Studio / latter.reset_device). Same panel hand-off as Restart Device:
    # AMOLED panels left awake across a reboot don't come back from their next DCS sleep.
    - action: latter_factory_reset
      then:
        - logger.log:
            level: WARN
            format: "Reset to defaults requested by Latter: erasing saved settings and rebooting"
        - light.turn_off: display_brightness
        - component.update: disp1
        - delay: 100ms
        - button.press: internal_factory_reset

    - action: ui_input
      variables:
        action: string
        delta: int
      then:
        - script.execute:
            id: ui_input_event
            action: !lambda 'return action;'
            delta: !lambda 'return delta;'

    - action: latter_set_beacon_uuid
      id: latter_set_beacon_uuid_action
      variables:
        uuid: string
      then:
        - lambda: 'id(ble_ctrl).set_uuid_hex(std::string_view(uuid.c_str(), uuid.size()));'

    - action: set_browse_slots
      variables:
        contract: int
        req_id: int
        mode: string
        page: int
        total_pages: int
        slots: string
      then:
        - lambda: |-
            if (latter_ui::apply_slots_action(
                    contract, req_id, std::string_view(mode.c_str(), mode.size()),
                    page, total_pages, std::string_view(slots.c_str(), slots.size()),
                    millis(), false)) {
              latter_ui::schedule_disp_update(&id(disp1));
            }

    - action: set_area_slots
      variables:
        contract: int
        req_id: int
        mode: string
        page: int
        total_pages: int
        slots: string
      then:
        - lambda: |-
            if (latter_ui::apply_slots_action(
                    contract, req_id, std::string_view(mode.c_str(), mode.size()),
                    page, total_pages, std::string_view(slots.c_str(), slots.size()),
                    millis(), true)) {
              latter_ui::schedule_disp_update(&id(disp1));
            }

    - action: show_notification
      variables:
        title: string
        message: string
        priority: string
        duration: int
        chime: bool
        camera_url: string
        alert_id: int
      then:
        - lambda: |-
            auto &rs = latter_ui::runtime_state();
            if (!latter_ui::trigger_alert_banner(
                    std::string_view(title.c_str(), title.size()),
                    std::string_view(message.c_str(), message.size()),
                    std::string_view(priority.c_str(), priority.size()),
                    duration,
                    std::string_view(camera_url.c_str(), camera_url.size()),
                    alert_id, millis(), false, rs.alert)) {
              return;
            }
            latter_ui::note_wake_reason(latter_ui::WakeReason::NOTIFY);
            id(wake_to_active_state).execute();
            if (chime && !rs.voice.active && !rs.voice.tts_received) {
              int sfx = (rs.alert.priority == "critical" || rs.alert.priority == "warning") ? 9 : 6;
              id(play_game_sfx).execute(sfx);
            }
            if (!rs.alert.camera_url.empty()) {
              id(fetch_camera_snapshot).execute();
            } else {
              rs.alert.loaded_camera_url = "";
              latter_ui::release_art(id(camera_snapshot_art));
            }
            latter_ui::schedule_disp_update(&id(disp1));

# Both OTA paths share the display wake, progress takeover, and light-sleep awake-lock hooks.
ota:
  - platform: http_request
    id: ota_http
    on_begin:
      then:
        - script.stop: screen_sleep_timer
        - light.turn_on: display_brightness
        - lambda: 'latter_ui::handle_ota_begin(&id(disp1));'
        - script.execute: apply_power_policy
        - component.update: disp1
    on_progress:
      then:
        - lambda: 'latter_ui::handle_ota_progress(&id(disp1), x, millis());'
    on_end:
      then:
        - lambda: 'latter_ui::handle_ota_end(&id(disp1));'
    on_error:
      then:
        - lambda: 'latter_ui::handle_ota_error(&id(disp1), millis());'
        - script.execute: apply_power_policy
        - script.execute: screen_sleep_timer
    on_abort:
      then:
        - lambda: 'latter_ui::handle_ota_error(&id(disp1), millis());'
        - script.execute: apply_power_policy
        - script.execute: screen_sleep_timer

  - platform: esphome
    id: ota_esphome
    on_begin:
      then:
        - script.stop: screen_sleep_timer
        - light.turn_on: display_brightness
        - lambda: 'latter_ui::handle_ota_begin(&id(disp1));'
        - script.execute: apply_power_policy
        - component.update: disp1
    on_progress:
      then:
        - lambda: 'latter_ui::handle_ota_progress(&id(disp1), x, millis());'
    on_end:
      then:
        - lambda: 'latter_ui::handle_ota_end(&id(disp1));'
    on_error:
      then:
        - lambda: 'latter_ui::handle_ota_error(&id(disp1), millis());'
        - script.execute: apply_power_policy
        - script.execute: screen_sleep_timer
    on_abort:
      then:
        - lambda: 'latter_ui::handle_ota_error(&id(disp1), millis());'
        - script.execute: apply_power_policy
        - script.execute: screen_sleep_timer

time:
  - id: !extend ha_time
    on_time_sync:
      then:
        - lambda: |-
            const auto &n = latter_ui::runtime_state().nav;
            if (n.display_power_state == 0 && !n.is_hibernating) {
              latter_ui::record_ambient_frame_ms(0);
            }
  - id: !extend sntp_time
    on_time_sync:
      then:
        - lambda: |-
            const auto &n = latter_ui::runtime_state().nav;
            if (n.display_power_state == 0 && !n.is_hibernating) {
              latter_ui::record_ambient_frame_ms(0);
            }

sensor:
  - platform: template
    name: "Timer Remaining"
    id: timer_remaining_sensor
    update_interval: 30s
    filters:
      - delta: 1.0
    lambda: |-
      const auto &ts = latter_ui::runtime_state().timers;
      if (!ts.running && !ts.paused) return {};
      return static_cast<float>(ts.remaining_sec);
    unit_of_measurement: "s"
    entity_category: diagnostic
    icon: "mdi:timer-outline"

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    id: latter_wifi_signal
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "System: Internal RAM Low Water"
    id: sys_int_ram_low_water
    icon: "mdi:memory"
    unit_of_measurement: "kB"
    device_class: data_size
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return heap_caps_get_minimum_free_size(MALLOC_CAP_INTERNAL) / 1024.0f;'
    filters:
      - delta: 2.0

  - platform: template
    name: "System: Internal RAM Largest Block"
    id: sys_int_ram_largest_block
    icon: "mdi:memory"
    unit_of_measurement: "kB"
    device_class: data_size
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024.0f;'
    filters:
      - delta: 8.0

  - platform: template
    name: "System: PSRAM Low Water"
    id: sys_psram_low_water
    icon: "mdi:memory"
    unit_of_measurement: "kB"
    device_class: data_size
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return heap_caps_get_minimum_free_size(MALLOC_CAP_SPIRAM) / 1024.0f;'
    filters:
      - delta: 256.0

binary_sensor:
  - platform: template
    name: "Timer Active"
    id: timer_active_binary_sensor
    lambda: 'return latter_ui::runtime_state().timers.running;'
    entity_category: diagnostic
    icon: "mdi:timer-sand"

  - platform: template
    name: "Alarm Ringing"
    id: alarm_ringing_binary_sensor
    lambda: |-
      const auto &rs = latter_ui::runtime_state();
      return rs.alarms.ringing || rs.timers.ringing;
    entity_category: diagnostic
    icon: "mdi:alarm-bell"

  - id: !extend boot_button
    on_press:
      then:
        - lambda: |-
            static uint32_t last_btn_press = 0;
            uint32_t now = millis();
            if (now - last_btn_press < 150) return;
            last_btn_press = now;
        - if:
            condition:
              lambda: |-
                const auto &rs = latter_ui::runtime_state();
                return rs.alarms.find_my_active || rs.timers.ringing || rs.alarms.ringing || rs.alert.active;
            then:
              - lambda: |-
                  auto &rs = latter_ui::runtime_state();
                  if (rs.alert.active) {
                    id(dismiss_notification).execute();
                    return;
                  }
                  rs.alarms.find_my_active = false;
                  rs.timers.ringing = false;
                  rs.alarms.ringing = false;
                  id(stop_alarm_sound).execute();
                  id(sync_display_brightness).execute();
                  latter_ui::schedule_disp_update(&id(disp1));
                  id(screen_sleep_timer).execute();
            else:
              - if:
                  condition:
                    lambda: 'return latter_ui::runtime_state().nav.active_game > 0;'
                  then:
                    - lambda: 'latter_ui::runtime_state().nav.game_btn_pressed = true;'
                  else:
                    - script.execute: toggle_voice_assistant

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: latter_ip_address

  - platform: template
    name: "Firmware Version"
    id: latter_firmware_version
    icon: "mdi:tag-outline"
    entity_category: diagnostic
    update_interval: 3600s
    lambda: 'return std::string("${version}");'

  - platform: template
    name: "System: Link Report"
    id: sys_link_report
    icon: "mdi:wifi-check"
    entity_category: diagnostic
    update_interval: 15min
    lambda: 'return latter_ui::link_report_log_line(millis(), latter_ui::last_reset_reason());'

interval:
  - interval: 60s
    then:
      - lambda: |-
          latter_ui::link_report_init();
          latter_ui::link_report_sample();

script:
  - id: ha_post_connect_boot_replay
    mode: restart
    then:
      - delay: 3s
      - lambda: 'latter_ui::log_boot_summary();'
      - logger.replay_boot_logs:

  - id: sync_ui_touch_runtime
    mode: single
    then:
      - lambda: |-
          const auto &rs = latter_ui::runtime_state();
          auto &rt = latter_ui::touch_engine().runtime();
          rt.friendly_name = "${friendly_name}";
          rt.fw_version = "${version}";
          rt.fw_latest_version = latter_ui::fw_update_latest_version(&id(latter_firmware_update));
          rt.usb_connected = rs.hw_usb_connected;
          rt.panel_is_on = id(display_brightness).current_values.is_on();
          rt.local_mp_playing = (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          rt.local_mp_volume = id(latter_media_player).volume;
          rt.album_art_w = id(album_art).get_width();
          rt.track_title = id(track_title).state;
          rt.track_artist = id(track_artist).state;
          rt.track_album = id(track_album).state;
          auto now_t = id(ha_time).now();
          if (!now_t.is_valid()) now_t = id(sntp_time).now();
          rt.time_valid = now_t.is_valid();
          rt.time_hour = rt.time_valid ? now_t.hour : -1;
          rt.time_minute = rt.time_valid ? now_t.minute : -1;
          rt.time_epoch = rt.time_valid ? static_cast<uint32_t>(now_t.timestamp) : 0U;

          if (rt.exec_cmd == nullptr) {
            rt.theme_primary = &id(theme_primary);
            rt.theme_secondary = &id(theme_secondary);

            rt.exec_cmd = +[](latter_ui::UiHostCmd cmd, int arg0, int arg1) {
              using C = latter_ui::UiHostCmd;
              switch (cmd) {
                case C::SCHEDULE_DISP_UPDATE: latter_ui::schedule_disp_update(&id(disp1)); break;
                case C::SCHEDULE_BAND_DISP_UPDATE: latter_ui::schedule_band_disp_update(&id(disp1), arg0, arg1); break;
                case C::WAKE_TO_ACTIVE: id(wake_to_active_state).execute(); break;
                case C::SCREEN_SLEEP_TIMER: id(screen_sleep_timer).execute(); break;
                case C::APPLY_POWER_POLICY: id(apply_power_policy).execute(); break;
                case C::CANCEL_VOICE_ASSISTANT: id(cancel_voice_assistant).execute(); break;
                case C::ABORT_VOICE_ASSISTANT: esphome::voice_assistant::abort_voice_assistant(id(va)); break;
                case C::CYCLE_PRIMARY_WAKE_WORD: esphome::voice_assistant::cycle_primary_wake_word(id(va), id(mww)); break;
                case C::SYNC_WAKE_WORD_STATE: id(sync_wake_word_state).execute(); break;
                case C::DISMISS_NOTIFICATION: id(dismiss_notification).execute(); break;
                case C::STOP_ALARM_SOUND: id(stop_alarm_sound).execute(); break;
                case C::SYNC_DISPLAY_BRIGHTNESS: id(sync_display_brightness).execute(); break;
                case C::FLASHLIGHT_FULL_BRIGHTNESS: id(display_brightness).turn_on().set_brightness(1.0f).perform(); break;
                case C::PAUSE_LOCAL_MEDIA_PLAYER: id(latter_media_player).make_call().set_command(media_player::MEDIA_PLAYER_COMMAND_PAUSE).perform(); break;
                case C::STOP_MP_IDLE_DEBOUNCE: id(mp_idle_debounce).stop(); break;
                case C::TOGGLE_HA_MUSIC: id(toggle_ha_music).execute(); break;
                case C::STOP_HA_MUSIC: id(stop_ha_music).execute(); break;
                case C::CLEAR_HA_MUSIC_QUEUE: id(clear_ha_music_queue).execute(); break;
                case C::MUSIC_VOL_UP: id(music_vol_up).execute(); break;
                case C::MUSIC_VOL_DOWN: id(music_vol_down).execute(); break;
                case C::MUSIC_NEXT_TRACK: id(music_next_track).execute(); break;
                case C::MUSIC_PREV_TRACK: id(music_prev_track).execute(); break;
                case C::MUSIC_SEEK_RELATIVE: id(music_seek_relative).execute(arg0); break;
                case C::MUSIC_SEEK_ABSOLUTE: id(music_seek_absolute).execute(); break;
                case C::FETCH_MUSIC_BROWSE: id(fetch_music_browse).execute(); break;
                case C::PLAY_MUSIC_SLOT: id(play_music_slot).execute(arg0); break;
                case C::FETCH_REMOTE_ART_DEBOUNCED: id(fetch_remote_art_debounced).execute(); break;
                case C::SPEAKER_TRANSFER_TO_TARGET: id(speaker_transfer_to_target).execute(); break;
                case C::SPEAKER_CONTROL_TARGET: id(speaker_control_target).execute(); break;
                case C::SPEAKER_JOIN_TARGET: id(speaker_join_target).execute(); break;
                case C::SPEAKER_UNJOIN_TARGET: id(speaker_unjoin_target).execute(); break;
                case C::REQUEST_DOCK_APPS: id(request_dock_apps).execute(); break;
                case C::TRIGGER_SCREENSAVER_NOW: id(trigger_screensaver_now).execute(); break;
                case C::START_HIBERNATION_COUNTDOWN: id(start_hibernation_countdown).execute(); break;
                case C::TURN_SCREEN_OFF: id(turn_screen_off).execute(); break;
                case C::RESTART_DEVICE: id(restart_button).press(); break;
                case C::CHECK_FIRMWARE_UPDATE: id(check_firmware_update).execute(); break;
                case C::TRIGGER_FIRMWARE_UPDATE: id(trigger_firmware_update).execute(); break;
                case C::APPLY_THEME_PRESET: id(apply_theme_preset).execute(); break;
                case C::SAVE_CUSTOM_COLOR_TO_LATTER: id(save_custom_color_to_latter).execute(); break;
                case C::MENU_SCROLL_TRANSITION: id(menu_scroll_transition).execute(); break;
                case C::FETCH_AREA_BROWSE: id(fetch_area_browse).execute(); break;
                case C::FETCH_AREA_LIST_BROWSE: id(fetch_area_list_browse).execute(); break;
                case C::SELECT_ACTIVE_AREA_LATTER: id(select_active_area_latter).execute(); break;
                case C::EXECUTE_AREA_ACTION: id(execute_area_action).execute(); break;
                case C::EXECUTE_ALARM_ACTION: id(execute_alarm_action).execute(); break;
                case C::REMOTE_SEND_KEY: id(remote_send_key).execute(arg0, arg1); break;
                case C::REMOTE_SELECT_SLOT_LATTER: id(remote_select_slot_latter).execute(arg0); break;
                case C::FETCH_CALENDAR_BROWSE: id(fetch_calendar_browse).execute(); break;
                case C::CREATE_CALENDAR_QUICK_EVENT: id(create_calendar_quick_event).execute(); break;
                case C::FETCH_CALENDAR_MAP_SNAPSHOT: id(fetch_calendar_map_snapshot).execute(); break;
                case C::SEND_INTERCOM_BROADCAST: id(send_intercom_broadcast).execute(); break;
                case C::FETCH_ON_DEMAND_CAMERA: id(fetch_on_demand_camera).execute(); break;
                case C::RELEASE_CAMERA_ART: latter_ui::release_art(id(camera_snapshot_art)); break;
                case C::START_DOORBELL_CALL: id(start_doorbell_call).execute(); break;
                case C::STOP_DOORBELL_CALL: id(stop_doorbell_call).execute(); break;
                case C::STOP_DOORBELL_AUDIO: id(stop_doorbell_audio).execute(); break;
                case C::START_DOORBELL_PTT: id(start_doorbell_ptt).execute(); break;
                case C::RESUME_DOORBELL_LISTEN: id(resume_doorbell_listen).execute(); break;
                case C::SEND_DOORBELL_INTERCOM_CMD: id(send_doorbell_intercom_cmd).execute(); break;
              }
            };

            rt.get_select = +[](latter_ui::UiSelectId sid) -> std::string {
              using S = latter_ui::UiSelectId;
              auto rd = [](auto *sel) -> std::string {
                return sel != nullptr ? std::string(sel->current_option()) : std::string{};
              };
              switch (sid) {
                case S::TAP_WAKE_MODE: return rd(id(tap_wake_mode));
                case S::WEATHER_SIM_CONDITION: return rd(id(weather_sim_condition));
                case S::MUSIC_OVERLAY_STYLE: return rd(id(music_overlay_style));
                case S::MUSIC_FULLSCREEN_ART_MODE: return rd(id(music_fullscreen_art_mode));
                case S::MUSIC_ALBUM_SORT_ORDER: return rd(id(music_album_sort_order));
                case S::MUSIC_ARTIST_ALBUM_SORT_ORDER: return rd(id(music_artist_album_sort_order));
                case S::MUSIC_PODCAST_SORT_ORDER: return rd(id(music_podcast_sort_order));
                case S::VA_WAKE_WORD_MODE: return rd(id(va_wake_word_mode));
                case S::VA_VISUAL_PROFILE: return rd(id(va_visual_profile));
                case S::WW_SENS_OKAY_NABU: return rd(id(ww_sens_okay_nabu));
                case S::WW_SENS_HEY_LUNA: return rd(id(ww_sens_hey_luna));
                case S::WW_SENS_HEY_JARVIS: return rd(id(ww_sens_hey_jarvis));
                case S::WW_SENS_HEY_MYCROFT: return rd(id(ww_sens_hey_mycroft));
                case S::WW_SENS_ALEXA: return rd(id(ww_sens_alexa));
                case S::THEME_PALETTE: return rd(id(theme_palette_select));
                case S::POWER_PROFILE: return rd(id(power_profile_select));
                case S::PICKUP_WAKE_MODE: return rd(id(pickup_wake_mode));
                case S::DISPLAY_OFF_TIMEOUT: return rd(id(display_off_timeout));
                case S::SCREENSAVER_STYLE: return rd(id(screensaver_style_select));
                case S::SCREENSAVER_DOCKED_TIMEOUT: return rd(id(screensaver_docked_timeout));
                case S::HIBERNATE_TIMEOUT_MODE: return rd(id(hibernate_timeout_mode));
                case S::DEFAULT_START_APP: return rd(id(default_start_app));
                case S::CLOCK_FACE_STYLE: return rd(id(clock_face_style));
                case S::TIME_FORMAT: return rd(id(time_format_select));
                case S::AUTO_BRIGHTNESS_MODE: return rd(id(auto_brightness_mode));
                case S::DISPLAY_BRIGHTNESS_PRESET: return rd(id(display_brightness_preset));
                case S::DAY_BRIGHTNESS_PRESET: return rd(id(day_brightness_preset));
                case S::NIGHT_BRIGHTNESS_PRESET: return rd(id(night_brightness_preset));
                case S::AREA_DEFAULT_CATEGORY: return rd(id(area_default_category_select));
              }
              return std::string{};
            };

            rt.set_select = +[](latter_ui::UiSelectId sid, const std::string &opt, bool publish_also) {
              using S = latter_ui::UiSelectId;
              auto wr = [&](auto *sel) {
                if (sel == nullptr) return;
                auto call = sel->make_call();
                call.set_option(opt);
                call.perform();
                if (publish_also) sel->publish_state(opt);
              };
              switch (sid) {
                case S::TAP_WAKE_MODE: wr(id(tap_wake_mode)); break;
                case S::WEATHER_SIM_CONDITION: wr(id(weather_sim_condition)); break;
                case S::MUSIC_OVERLAY_STYLE: wr(id(music_overlay_style)); break;
                case S::MUSIC_FULLSCREEN_ART_MODE: wr(id(music_fullscreen_art_mode)); break;
                case S::MUSIC_ALBUM_SORT_ORDER: wr(id(music_album_sort_order)); break;
                case S::MUSIC_ARTIST_ALBUM_SORT_ORDER: wr(id(music_artist_album_sort_order)); break;
                case S::MUSIC_PODCAST_SORT_ORDER: wr(id(music_podcast_sort_order)); break;
                case S::VA_WAKE_WORD_MODE: wr(id(va_wake_word_mode)); break;
                case S::VA_VISUAL_PROFILE: wr(id(va_visual_profile)); break;
                case S::WW_SENS_OKAY_NABU: wr(id(ww_sens_okay_nabu)); break;
                case S::WW_SENS_HEY_LUNA: wr(id(ww_sens_hey_luna)); break;
                case S::WW_SENS_HEY_JARVIS: wr(id(ww_sens_hey_jarvis)); break;
                case S::WW_SENS_HEY_MYCROFT: wr(id(ww_sens_hey_mycroft)); break;
                case S::WW_SENS_ALEXA: wr(id(ww_sens_alexa)); break;
                case S::THEME_PALETTE: wr(id(theme_palette_select)); break;
                case S::POWER_PROFILE: wr(id(power_profile_select)); break;
                case S::PICKUP_WAKE_MODE: wr(id(pickup_wake_mode)); break;
                case S::DISPLAY_OFF_TIMEOUT: wr(id(display_off_timeout)); break;
                case S::SCREENSAVER_STYLE: wr(id(screensaver_style_select)); break;
                case S::SCREENSAVER_DOCKED_TIMEOUT: wr(id(screensaver_docked_timeout)); break;
                case S::HIBERNATE_TIMEOUT_MODE: wr(id(hibernate_timeout_mode)); break;
                case S::DEFAULT_START_APP: wr(id(default_start_app)); break;
                case S::CLOCK_FACE_STYLE: wr(id(clock_face_style)); break;
                case S::TIME_FORMAT: wr(id(time_format_select)); break;
                case S::AUTO_BRIGHTNESS_MODE: wr(id(auto_brightness_mode)); break;
                case S::DISPLAY_BRIGHTNESS_PRESET: wr(id(display_brightness_preset)); break;
                case S::DAY_BRIGHTNESS_PRESET: wr(id(day_brightness_preset)); break;
                case S::NIGHT_BRIGHTNESS_PRESET: wr(id(night_brightness_preset)); break;
                case S::AREA_DEFAULT_CATEGORY: wr(id(area_default_category_select)); break;
              }
            };

            rt.get_switch = +[](latter_ui::UiSwitchId swid) -> bool {
              using W = latter_ui::UiSwitchId;
              auto rd = [](auto *sw) -> bool { return sw != nullptr && sw->state; };
              switch (swid) {
                case W::HOME_WEATHER_BG: return rd(id(home_weather_bg_switch));
                case W::HOME_WAKE_GREETING: return rd(id(home_wake_greeting_switch));
                case W::MUSIC_SHOW_SPEAKER_SHORTCUT: return rd(id(music_show_speaker_shortcut));
                case W::MUSIC_SHOW_LIBRARY_SHORTCUT: return rd(id(music_show_library_shortcut));
                case W::BLE_AREA_BEACON: return rd(id(ble_area_beacon_switch));
                case W::GAME_SOUND: return rd(id(game_sound_switch));
                case W::VA_WAKE_SCREEN: return rd(id(va_wake_screen_switch));
                case W::DOCKED_SCREENSAVER: return rd(id(docked_screensaver_switch));
                case W::INSTANT_CROWN_HIBERNATE: return rd(id(instant_crown_hibernate_switch));
                case W::AREA_SHOW_ALL_CATEGORY: return rd(id(area_show_all_category_switch));
              }
              return false;
            };

            rt.toggle_switch = +[](latter_ui::UiSwitchId swid) {
              using W = latter_ui::UiSwitchId;
              auto tg = [](auto *sw) { if (sw != nullptr) sw->toggle(); };
              switch (swid) {
                case W::HOME_WEATHER_BG: tg(id(home_weather_bg_switch)); break;
                case W::HOME_WAKE_GREETING: tg(id(home_wake_greeting_switch)); break;
                case W::MUSIC_SHOW_SPEAKER_SHORTCUT: tg(id(music_show_speaker_shortcut)); break;
                case W::MUSIC_SHOW_LIBRARY_SHORTCUT: tg(id(music_show_library_shortcut)); break;
                case W::BLE_AREA_BEACON: tg(id(ble_area_beacon_switch)); break;
                case W::GAME_SOUND: tg(id(game_sound_switch)); break;
                case W::VA_WAKE_SCREEN: tg(id(va_wake_screen_switch)); break;
                case W::DOCKED_SCREENSAVER: tg(id(docked_screensaver_switch)); break;
                case W::INSTANT_CROWN_HIBERNATE: tg(id(instant_crown_hibernate_switch)); break;
                case W::AREA_SHOW_ALL_CATEGORY: tg(id(area_show_all_category_switch)); break;
              }
            };

            rt.get_number = +[](latter_ui::UiNumberId nid) -> float {
              using N = latter_ui::UiNumberId;
              auto rd = [](auto *num) -> float { return num != nullptr ? num->state : 0.0f; };
              switch (nid) {
                case N::VOLUME_STEP_SIZE: return rd(id(volume_step_size));
                case N::SPEAKER_VOLUME: return rd(id(speaker_volume));
                case N::ALERT_VOLUME: return rd(id(alert_volume));
                case N::DAY_START_HOUR: return rd(id(day_start_hour));
                case N::NIGHT_START_HOUR: return rd(id(night_start_hour));
              }
              return 0.0f;
            };

            rt.set_number = +[](latter_ui::UiNumberId nid, float val) {
              using N = latter_ui::UiNumberId;
              auto wr = [](auto *num, float v, float lo, float hi) {
                if (num == nullptr) return;
                const float cl = std::clamp(v, lo, hi);
                auto call = num->make_call();
                call.set_value(cl);
                call.perform();
              };
              switch (nid) {
                case N::VOLUME_STEP_SIZE: wr(id(volume_step_size), val, 1.0f, 10.0f); break;
                case N::SPEAKER_VOLUME: wr(id(speaker_volume), val, 10.0f, 100.0f); break;
                case N::ALERT_VOLUME: wr(id(alert_volume), val, 20.0f, 100.0f); break;
                case N::DAY_START_HOUR: wr(id(day_start_hour), val, 0.0f, 23.0f); break;
                case N::NIGHT_START_HOUR: wr(id(night_start_hour), val, 0.0f, 23.0f); break;
              }
            };
          }

  - id: ui_input_event
    mode: queued
    parameters:
      action: string
      delta: int
    then:
      - lambda: |-
          id(sync_ui_touch_runtime).execute();
          latter_ui::touch_engine().on_input_event(action, delta, millis());

  - id: dismiss_notification
    mode: restart
    then:
      - script.stop: fetch_camera_snapshot
      - lambda: |-
          auto &ab = latter_ui::runtime_state().alert;
          ab.active = false;
          ab.camera_url = "";
          ab.loaded_camera_url = "";
      - lambda: 'latter_ui::release_art(id(camera_snapshot_art));'
      - script.execute: mp_idle_debounce
      - script.execute: sync_wake_word_state
      - script.execute: screen_sleep_timer
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'

  - id: throttled_disp_update
    mode: restart
    then:
      - delay: 150ms
      - if:
          condition:
            lambda: |-
              const auto &rs = latter_ui::runtime_state();
              return rs.nav.display_power_state == 0 &&
                     (rs.nav.gui_page == 1 || rs.nav.gui_page == 2) &&
                     !rs.voice.active;
          then:
            - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'

  - id: apply_theme_preset
    mode: restart
    then:
      - lambda: |-
          std::string p = std::string(id(theme_palette_select).current_option());
          id(theme_secondary) = Color(192, 192, 192);
          if (p == "Custom") {
            latter_ui::apply_custom_rgb_harmony(
                latter_ui::persisted_prefs().custom_theme_rgb, id(theme_primary), id(theme_secondary));
          } else if (p == "Pink") {
            id(theme_primary) = Color(168, 120, 132);
          } else if (p == "Green") {
            id(theme_primary) = Color(66, 116, 83);
          } else if (p == "Blue") {
            id(theme_primary) = Color(69, 110, 138);
          } else {
            id(theme_primary) = Color(107, 142, 158);
          }
          if (latter_ui::runtime_state().nav.display_power_state == 0) {
            latter_ui::schedule_disp_update(&id(disp1));
          }

  - id: save_custom_color_to_latter
    mode: restart
    then:
      - lambda: |-
          latter_ui::save_persisted_prefs();
          latter_actions::emit_save_custom_color_rgb(latter_ui::persisted_prefs().custom_theme_rgb);

  - id: sync_display_brightness
    mode: restart
    then:
      - lambda: |-
          const auto &rs = latter_ui::runtime_state();
          auto parse_bri = [](const std::string& opt) -> float {
            if (opt == "60%") return 0.60f;
            if (opt == "70%") return 0.70f;
            if (opt == "80%") return 0.80f;
            if (opt == "90%") return 0.90f;
            if (opt == "100%") return 1.00f;
            return 0.90f;
          };

          float b_target = 0.90f;
          std::string mode = id(auto_brightness_mode).current_option();

          if (mode == "Sun Synchronized") {
            std::string sun = latter_ui::weather_state().sun_state;
            bool is_night = (sun == "below_horizon");
            std::string opt = is_night ? id(night_brightness_preset).current_option()
                                       : id(day_brightness_preset).current_option();
            b_target = parse_bri(opt);
          } else if (mode == "Time Schedule") {
            auto now = id(ha_time).now();
            int day_h = static_cast<int>(id(day_start_hour).state);
            int night_h = static_cast<int>(id(night_start_hour).state);
            bool is_day = true;
            if (now.is_valid()) {
              if (day_h < night_h) {
                is_day = (now.hour >= day_h && now.hour < night_h);
              } else {
                is_day = (now.hour >= day_h || now.hour < night_h);
              }
            }
            std::string opt = is_day ? id(day_brightness_preset).current_option()
                                     : id(night_brightness_preset).current_option();
            b_target = parse_bri(opt);
          } else {
            std::string opt = id(display_brightness_preset).current_option();
            b_target = parse_bri(opt);
          }

          if ((rs.nav.gui_page == 8 && rs.nav.tools_subpage == 5) || rs.alarms.find_my_active) {
            b_target = 1.00f;
          }

          if (rs.nav.display_power_state == 0) {
            id(display_brightness).turn_on().set_brightness(b_target).perform();
          } else if (rs.nav.display_power_state == 1) {
            id(display_brightness).turn_on().set_brightness(latter_ui::kScreensaverBrightness).perform();
          }

  - id: apply_default_start_page
    then:
      - lambda: |-
          auto def_app = id(default_start_app).current_option();
          latter_ui::runtime_state().nav.gui_page = (def_app == "Clock") ? 0 : 1;

  - id: trigger_firmware_update
    mode: restart
    then:
      - update.perform:
          id: latter_firmware_update
      - lambda: |-
          latter_ui::runtime_state().nav.system_menu_mode = 5;
          latter_ui::schedule_disp_update(&id(disp1));

  - id: check_firmware_update
    mode: restart
    then:
      - update.check:
          id: latter_firmware_update

  - id: menu_scroll_transition
    mode: restart
    then:
      - lambda: |-
          latter_ui::menu_scroll_start_ms() = millis();
          latter_ui::schedule_anim_disp_update(&id(disp1));
      - delay: !lambda 'return latter_ui::kMotionMs;'
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          rs.nav.menu_scroll_active = false;
          if (rs.nav.gui_page == 4 && rs.nav.system_menu_mode == 1) {
            rs.nav.sleep_menu_page = rs.nav.menu_scroll_target_page;
          } else if (rs.nav.gui_page == 4 && rs.nav.system_menu_mode == 2) {
            rs.nav.display_menu_page = rs.nav.menu_scroll_target_page;
          } else if (rs.nav.gui_page == 4 && rs.nav.system_menu_mode == 0) {
            rs.nav.system_dashboard_page = rs.nav.menu_scroll_target_page;
          } else if (rs.nav.gui_page == 2 && rs.music.overlay_mode == 2) {
            rs.music.category_page = rs.nav.menu_scroll_target_page;
          } else if (rs.nav.gui_page == 3 && rs.nav.active_game == 0) {
            rs.nav.game_carousel_idx = rs.nav.menu_scroll_target_page;
          } else if (rs.nav.gui_page == 8 && rs.nav.tools_subpage == 0) {
            rs.nav.tools_menu_page = rs.nav.menu_scroll_target_page;
          }
          latter_ui::schedule_disp_update(&id(disp1));
