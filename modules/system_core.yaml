button:
  - platform: restart
    name: "Internal Restart"
    id: internal_restart
    internal: true

  - platform: factory_reset
    name: "Internal Factory Reset"
    id: internal_factory_reset
    internal: true

  - platform: template
    name: "System: Log Memory Report"
    id: log_memory_report_button
    icon: "mdi:memory"
    entity_category: diagnostic
    on_press:
      - lambda: 'latter_ui::log_memory_report();'

  - platform: template
    name: "Actions: Restart Device"
    id: restart_button
    device_class: restart
    icon: "mdi:restart"
    entity_category: diagnostic
    on_press:
      - lambda: 'latter_ui::flush_persisted_prefs_if_dirty();'
      - light.turn_off: display_brightness
      - component.update: disp1
      - delay: 150ms
      - lambda: 'latter_ui::hal_prepare_touch_for_restart();'
      - delay: 20ms
      - button.press: internal_restart

switch:
  - platform: template
    name: "System: Telemetry Profiler"
    id: telemetry_profiler_switch
    icon: "mdi:chart-timeline-variant-shimmer"
    entity_category: diagnostic
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(telemetry_profiler_switch).publish_state(true);
          latter_ui::profiler_enabled() = true;
          id(ble_ctrl).set_profile_logging(true);
          auto &fr = latter_ui::flight_recorder();
          fr.window_frames = 0;
          fr.window_render_us = 0;
          fr.max_render_us = 0;
          fr.slow_frames = 0;
          fr.last_summary_ms = millis();
          LATTER_PROF_LOGI("[PROF:START] Telemetry Profiler on for '${name}' (screen=%dx%d)",
                           latter_ui::SCREEN_W, latter_ui::SCREEN_H);
      - delay: 500ms
      - lambda: |-
          const auto &rs = latter_ui::runtime_state();
          latter_ui::log_power_and_mem_profile(
              "PROFILER_ON", rs.nav.display_power_state, rs.hw_usb_connected, rs.hw_batt_charging,
              rs.hw_batt_level, rs.hw_batt_voltage, id(speaker_enable).state,
              id(mww).is_running(), rs.voice.active,
              id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING,
              id(ble_ctrl).is_active(), rs.nav.active_game, rs.nav.sleep_start_time);
    turn_off_action:
      - lambda: |-
          id(telemetry_profiler_switch).publish_state(false);
          LATTER_PROF_LOGI("[PROF:STOP] Telemetry Profiler off");
          latter_ui::profiler_enabled() = false;
          id(ble_ctrl).set_profile_logging(false);

binary_sensor:
  - id: !extend boot_button
    on_press:
      then:
        - lambda: |-
            static uint32_t last_btn_press = 0;
            uint32_t now = millis();
            if (now - last_btn_press < 150) return;
            last_btn_press = now;
        - if:
            condition:
              lambda: |-
                const auto &rs = latter_ui::runtime_state();
                return rs.alarms.find_my_active || rs.timers.ringing || rs.alarms.ringing || rs.alert.active;
            then:
              - lambda: |-
                  auto &rs = latter_ui::runtime_state();
                  if (rs.alert.active) {
                    id(dismiss_notification).execute();
                    return;
                  }
                  rs.alarms.find_my_active = false;
                  rs.timers.ringing = false;
                  rs.alarms.ringing = false;
                  id(stop_alarm_sound).execute();
                  id(sync_display_brightness).execute();
                  latter_ui::schedule_disp_update(&id(disp1));
                  id(screen_sleep_timer).execute();
            else:
              - if:
                  condition:
                    lambda: 'return latter_ui::runtime_state().nav.active_game > 0;'
                  then:
                    - lambda: 'latter_ui::runtime_state().nav.game_btn_pressed = true;'
                  else:
                    - script.execute: toggle_voice_assistant

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: latter_ip_address

  - platform: template
    name: "Firmware Version"
    id: latter_firmware_version
    icon: "mdi:tag-outline"
    entity_category: diagnostic
    update_interval: 3600s
    lambda: 'return std::string("${version}");'

  - platform: template
    name: "System: Link Report"
    id: sys_link_report
    icon: "mdi:wifi-check"
    entity_category: diagnostic
    update_interval: 15min
    lambda: 'return latter_ui::link_report_log_line(millis(), latter_ui::last_reset_reason());'

interval:
  - interval: 1s
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          if (rs.nav.display_power_state != 0) {
            if (rs.nav.standby_entered_ms == 0) {
              const uint32_t now_st_ms = millis();
              rs.nav.standby_entered_ms = (rs.nav.sleep_start_time != 0)
                                              ? rs.nav.sleep_start_time
                                              : ((now_st_ms != 0) ? now_st_ms : 1U);
            }
          } else if (rs.nav.standby_entered_ms != 0) {
            latter_ui::note_wake_from_standby(millis());
          }
  - interval: 60s
    then:
      - lambda: |-
          latter_ui::link_report_init();
          latter_ui::link_report_sample();

script:
  - id: ha_post_connect_boot_replay
    mode: restart
    then:
      - delay: 3s
      - lambda: 'latter_ui::log_boot_summary();'
      - logger.replay_boot_logs:

  - id: sync_ui_touch_runtime
    mode: single
    then:
      - lambda: |-
          const auto &rs = latter_ui::runtime_state();
          if (rs.nav.display_power_state == 0 && !rs.nav.is_hibernating) {
            latter_ui::ensure_ui_anim_poller(id(ui_anim_tick));
          }
          auto &rt = latter_ui::touch_engine().runtime();
          rt.friendly_name = "${friendly_name}";
          rt.fw_version = "${version}";
          rt.fw_latest_version = latter_ui::fw_update_latest_version(&id(latter_firmware_update));
          rt.usb_connected = rs.hw_usb_connected;
          rt.panel_is_on = id(display_brightness).current_values.is_on();
          rt.local_mp_playing = (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          rt.local_mp_volume = id(latter_media_player).volume;
          rt.album_art_w = id(album_art).get_width();
          rt.track_title = id(track_title).state;
          rt.track_artist = id(track_artist).state;
          rt.track_album = id(track_album).state;
          auto now_t = id(ha_time).now();
          if (!now_t.is_valid()) now_t = id(sntp_time).now();
          rt.time_valid = now_t.is_valid();
          rt.time_hour = rt.time_valid ? now_t.hour : -1;
          rt.time_minute = rt.time_valid ? now_t.minute : -1;
          rt.time_epoch = rt.time_valid ? static_cast<uint32_t>(now_t.timestamp) : 0U;

          if (rt.exec_cmd == nullptr) {
            rt.theme_primary = &id(theme_primary);
            rt.theme_secondary = &id(theme_secondary);

            rt.exec_cmd = +[](latter_ui::UiHostCmd cmd, int arg0, int arg1) {
              using C = latter_ui::UiHostCmd;
              switch (cmd) {
                case C::SCHEDULE_DISP_UPDATE: latter_ui::schedule_disp_update(&id(disp1)); break;
                case C::SCHEDULE_BAND_DISP_UPDATE: latter_ui::schedule_band_disp_update(&id(disp1), arg0, arg1); break;
                case C::WAKE_TO_ACTIVE: id(wake_to_active_state).execute(); break;
                case C::SCREEN_SLEEP_TIMER: id(screen_sleep_timer).execute(); break;
                case C::APPLY_POWER_POLICY: id(apply_power_policy).execute(); break;
                case C::CANCEL_VOICE_ASSISTANT: id(cancel_voice_assistant).execute(); break;
                case C::ABORT_VOICE_ASSISTANT: esphome::voice_assistant::abort_voice_assistant(id(va)); break;
                case C::CYCLE_PRIMARY_WAKE_WORD: esphome::voice_assistant::cycle_primary_wake_word(id(va), id(mww)); break;
                case C::SYNC_WAKE_WORD_STATE: id(sync_wake_word_state).execute(); break;
                case C::DISMISS_NOTIFICATION: id(dismiss_notification).execute(); break;
                case C::STOP_ALARM_SOUND: id(stop_alarm_sound).execute(); break;
                case C::SYNC_DISPLAY_BRIGHTNESS: id(sync_display_brightness).execute(); break;
                case C::FLASHLIGHT_FULL_BRIGHTNESS: id(display_brightness).turn_on().set_brightness(1.0f).perform(); break;
                case C::PAUSE_LOCAL_MEDIA_PLAYER: id(latter_media_player).make_call().set_command(media_player::MEDIA_PLAYER_COMMAND_PAUSE).perform(); break;
                case C::STOP_MP_IDLE_DEBOUNCE: id(mp_idle_debounce).stop(); break;
                case C::TOGGLE_HA_MUSIC: id(toggle_ha_music).execute(); break;
                case C::STOP_HA_MUSIC: id(stop_ha_music).execute(); break;
                case C::CLEAR_HA_MUSIC_QUEUE: id(clear_ha_music_queue).execute(); break;
                case C::MUSIC_VOL_UP: id(music_vol_up).execute(); break;
                case C::MUSIC_VOL_DOWN: id(music_vol_down).execute(); break;
                case C::MUSIC_NEXT_TRACK: id(music_next_track).execute(); break;
                case C::MUSIC_PREV_TRACK: id(music_prev_track).execute(); break;
                case C::MUSIC_SEEK_RELATIVE: id(music_seek_relative).execute(arg0); break;
                case C::MUSIC_SEEK_ABSOLUTE: id(music_seek_absolute).execute(); break;
                case C::FETCH_MUSIC_BROWSE: id(fetch_music_browse).execute(); break;
                case C::PLAY_MUSIC_SLOT: id(play_music_slot).execute(arg0); break;
                case C::FETCH_REMOTE_ART_DEBOUNCED: id(fetch_remote_art_debounced).execute(); break;
                case C::SPEAKER_TRANSFER_TO_TARGET: id(speaker_transfer_to_target).execute(); break;
                case C::SPEAKER_CONTROL_TARGET: id(speaker_control_target).execute(); break;
                case C::SPEAKER_JOIN_TARGET: id(speaker_join_target).execute(); break;
                case C::SPEAKER_UNJOIN_TARGET: id(speaker_unjoin_target).execute(); break;
                case C::REQUEST_DOCK_APPS: id(request_dock_apps).execute(); break;
                case C::TRIGGER_SCREENSAVER_NOW: id(trigger_screensaver_now).execute(); break;
                case C::START_HIBERNATION_COUNTDOWN: id(start_hibernation_countdown).execute(); break;
                case C::TURN_SCREEN_OFF: id(turn_screen_off).execute(); break;
                case C::RESTART_DEVICE: id(restart_button).press(); break;
                case C::CHECK_FIRMWARE_UPDATE: id(check_firmware_update).execute(); break;
                case C::TRIGGER_FIRMWARE_UPDATE: id(trigger_firmware_update).execute(); break;
                case C::APPLY_THEME_PRESET: id(apply_theme_preset).execute(); break;
                case C::SAVE_CUSTOM_COLOR_TO_LATTER: id(save_custom_color_to_latter).execute(); break;
                case C::MENU_SCROLL_TRANSITION: id(menu_scroll_transition).execute(); break;
                case C::FETCH_AREA_BROWSE: id(fetch_area_browse).execute(); break;
                case C::FETCH_AREA_LIST_BROWSE: id(fetch_area_list_browse).execute(); break;
                case C::SELECT_ACTIVE_AREA_LATTER: id(select_active_area_latter).execute(); break;
                case C::EXECUTE_AREA_ACTION: id(execute_area_action).execute(); break;
                case C::EXECUTE_ALARM_ACTION: id(execute_alarm_action).execute(); break;
                case C::REMOTE_SEND_KEY: id(remote_send_key).execute(arg0, arg1); break;
                case C::REMOTE_SELECT_SLOT_LATTER: id(remote_select_slot_latter).execute(arg0); break;
                case C::FETCH_CALENDAR_BROWSE: id(fetch_calendar_browse).execute(); break;
                case C::CREATE_CALENDAR_QUICK_EVENT: id(create_calendar_quick_event).execute(); break;
                case C::FETCH_CALENDAR_MAP_SNAPSHOT: id(fetch_calendar_map_snapshot).execute(); break;
                case C::SEND_INTERCOM_BROADCAST: id(send_intercom_broadcast).execute(); break;
                case C::FETCH_ON_DEMAND_CAMERA: id(fetch_on_demand_camera).execute(); break;
                case C::RELEASE_CAMERA_ART: latter_ui::release_art(id(camera_snapshot_art)); break;
                case C::START_DOORBELL_CALL: id(start_doorbell_call).execute(); break;
                case C::STOP_DOORBELL_CALL: id(stop_doorbell_call).execute(); break;
                case C::STOP_DOORBELL_AUDIO: id(stop_doorbell_audio).execute(); break;
                case C::START_DOORBELL_PTT: id(start_doorbell_ptt).execute(); break;
                case C::RESUME_DOORBELL_LISTEN: id(resume_doorbell_listen).execute(); break;
                case C::SEND_DOORBELL_INTERCOM_CMD: id(send_doorbell_intercom_cmd).execute(); break;
              }
            };

            rt.get_select = +[](latter_ui::UiSelectId sid) -> std::string {
              using S = latter_ui::UiSelectId;
              const auto &p = latter_ui::persisted_prefs();
              switch (sid) {
                case S::TAP_WAKE_MODE: return latter_ui::pref_tap_to_wake_cstr(p);
                case S::WEATHER_SIM_CONDITION: return latter_ui::pref_weather_sim_cstr();
                case S::MUSIC_OVERLAY_STYLE: return latter_ui::pref_music_overlay_style_cstr(p);
                case S::MUSIC_FULLSCREEN_ART_MODE: return latter_ui::pref_album_art_style_cstr(p);
                case S::MUSIC_ALBUM_SORT_ORDER: return latter_ui::pref_album_sort_order_cstr(p);
                case S::MUSIC_ARTIST_ALBUM_SORT_ORDER: return latter_ui::pref_artist_album_sort_order_cstr(p);
                case S::MUSIC_PODCAST_SORT_ORDER: return latter_ui::pref_podcast_sort_order_cstr(p);
                case S::VA_WAKE_WORD_MODE: return latter_ui::pref_wake_word_mode_cstr(p);
                case S::VA_VISUAL_PROFILE: return latter_ui::pref_va_visual_profile_cstr(p);
                case S::WW_SENS_OKAY_NABU: return latter_ui::pref_ww_sens_cstr(p.ww_sens_okay_nabu);
                case S::WW_SENS_HEY_LUNA: return latter_ui::pref_ww_sens_cstr(p.ww_sens_hey_luna);
                case S::WW_SENS_HEY_JARVIS: return latter_ui::pref_ww_sens_cstr(p.ww_sens_hey_jarvis);
                case S::WW_SENS_HEY_MYCROFT: return latter_ui::pref_ww_sens_cstr(p.ww_sens_hey_mycroft);
                case S::WW_SENS_ALEXA: return latter_ui::pref_ww_sens_cstr(p.ww_sens_alexa);
                case S::THEME_PALETTE: return latter_ui::pref_color_profile_cstr(p);
                case S::POWER_PROFILE: return latter_ui::pref_power_profile_cstr(p);
                case S::PICKUP_WAKE_MODE: return latter_ui::pref_pickup_to_wake_cstr(p);
                case S::DISPLAY_OFF_TIMEOUT: return latter_ui::pref_battery_screen_timeout_cstr(p);
                case S::SCREENSAVER_STYLE: return latter_ui::pref_screensaver_style_cstr(p);
                case S::SCREENSAVER_DOCKED_TIMEOUT: return latter_ui::pref_docked_idle_timeout_cstr(p);
                case S::HIBERNATE_TIMEOUT_MODE: return latter_ui::pref_battery_hibernate_timeout_cstr(p);
                case S::DEFAULT_START_APP: return latter_ui::pref_start_screen_cstr(p);
                case S::CLOCK_FACE_STYLE: return latter_ui::pref_clock_face_cstr(p);
                case S::TIME_FORMAT: return latter_ui::pref_time_format_cstr(p);
                case S::AUTO_BRIGHTNESS_MODE: return latter_ui::pref_auto_brightness_mode_cstr(p);
                case S::DISPLAY_BRIGHTNESS_PRESET: return latter_ui::pref_manual_brightness_cstr(p);
                case S::DAY_BRIGHTNESS_PRESET: return latter_ui::pref_day_brightness_cstr(p);
                case S::NIGHT_BRIGHTNESS_PRESET: return latter_ui::pref_night_brightness_cstr(p);
              }
              return std::string{};
            };

            rt.set_select = +[](latter_ui::UiSelectId sid, const std::string &opt, bool /*publish_also*/) {
              using S = latter_ui::UiSelectId;
              using K = latter_ui::PrefKey;
              const uint32_t now_ms = millis();
              if (sid == S::WEATHER_SIM_CONDITION) {
                int idx = latter_ui::find_opt_index(latter_ui::kWeatherSimOpts, opt);
                if (idx >= 0) {
                  latter_ui::device_prefs_state().weather_sim_condition = static_cast<uint8_t>(idx);
                  if (opt != "Live (Home Assistant)" && !latter_ui::persisted_prefs().weather_background) {
                    uint32_t bg_eff = 0;
                    latter_actions::record_local_pref_edit(K::WEATHER_BACKGROUND, "1", now_ms, bg_eff);
                  }
                  if (latter_ui::link_state().ha_connected) {
                    std::string chg = "weather_sim_condition=";
                    chg.append(opt);
                    latter_actions::emit_set_device_prefs(latter_ui::persisted_prefs().prefs_seq, chg);
                  }
                  latter_ui::night_meteor_epoch_initialized() = false;
                  latter_ui::weather_sim_dirty() = true;
                  latter_ui::record_ambient_frame_ms(0);
                  latter_ui::ensure_ui_anim_poller(id(ui_anim_tick));
                  latter_ui::schedule_disp_update(&id(disp1));
                }
                return;
              }
              K pk = K::COUNT;
              switch (sid) {
                case S::TAP_WAKE_MODE: pk = K::TAP_TO_WAKE; break;
                case S::WEATHER_SIM_CONDITION: break;
                case S::MUSIC_OVERLAY_STYLE: pk = K::MUSIC_OVERLAY_STYLE; break;
                case S::MUSIC_FULLSCREEN_ART_MODE: pk = K::ALBUM_ART_STYLE; break;
                case S::MUSIC_ALBUM_SORT_ORDER: pk = K::ALBUM_SORT_ORDER; break;
                case S::MUSIC_ARTIST_ALBUM_SORT_ORDER: pk = K::ARTIST_ALBUM_SORT_ORDER; break;
                case S::MUSIC_PODCAST_SORT_ORDER: pk = K::PODCAST_SORT_ORDER; break;
                case S::VA_WAKE_WORD_MODE: pk = K::WAKE_WORD_MODE; break;
                case S::VA_VISUAL_PROFILE: pk = K::VA_VISUAL_PROFILE; break;
                case S::WW_SENS_OKAY_NABU: pk = K::WW_SENS_OKAY_NABU; break;
                case S::WW_SENS_HEY_LUNA: pk = K::WW_SENS_HEY_LUNA; break;
                case S::WW_SENS_HEY_JARVIS: pk = K::WW_SENS_HEY_JARVIS; break;
                case S::WW_SENS_HEY_MYCROFT: pk = K::WW_SENS_HEY_MYCROFT; break;
                case S::WW_SENS_ALEXA: pk = K::WW_SENS_ALEXA; break;
                case S::THEME_PALETTE: pk = K::COLOR_PROFILE; break;
                case S::POWER_PROFILE: pk = K::POWER_PROFILE; break;
                case S::PICKUP_WAKE_MODE: pk = K::PICKUP_TO_WAKE; break;
                case S::DISPLAY_OFF_TIMEOUT: pk = K::BATTERY_SCREEN_TIMEOUT; break;
                case S::SCREENSAVER_STYLE: pk = K::SCREENSAVER_STYLE; break;
                case S::SCREENSAVER_DOCKED_TIMEOUT: pk = K::DOCKED_IDLE_TIMEOUT; break;
                case S::HIBERNATE_TIMEOUT_MODE: pk = K::BATTERY_HIBERNATE_TIMEOUT; break;
                case S::DEFAULT_START_APP: pk = K::START_SCREEN; break;
                case S::CLOCK_FACE_STYLE: pk = K::CLOCK_FACE; break;
                case S::TIME_FORMAT: pk = K::TIME_FORMAT; break;
                case S::AUTO_BRIGHTNESS_MODE: pk = K::AUTO_BRIGHTNESS_MODE; break;
                case S::DISPLAY_BRIGHTNESS_PRESET: pk = K::MANUAL_BRIGHTNESS; break;
                case S::DAY_BRIGHTNESS_PRESET: pk = K::DAY_BRIGHTNESS; break;
                case S::NIGHT_BRIGHTNESS_PRESET: pk = K::NIGHT_BRIGHTNESS; break;
              }
              if (pk == K::COUNT) return;
              uint32_t eff = 0;
              if (latter_actions::record_local_pref_edit(pk, opt, now_ms, eff)) {
                latter_ui::device_prefs_state().last_effects = eff;
                id(apply_device_prefs_effects).execute();
              }
            };

            rt.get_switch = +[](latter_ui::UiSwitchId swid) -> bool {
              using W = latter_ui::UiSwitchId;
              const auto &p = latter_ui::persisted_prefs();
              switch (swid) {
                case W::HOME_WEATHER_BG: return p.weather_background;
                case W::HOME_WAKE_GREETING: return p.wake_greeting;
                case W::MUSIC_SHOW_SPEAKER_SHORTCUT: return p.show_speaker_shortcut;
                case W::MUSIC_SHOW_LIBRARY_SHORTCUT: return p.show_library_shortcut;
                case W::BLE_AREA_BEACON: return p.ble_beacon_enabled;
                case W::GAME_SOUND: return p.game_sound_effects;
                case W::VA_WAKE_SCREEN: return p.wake_screen_on_assist;
                case W::DOCKED_SCREENSAVER: return p.docked_screensaver;
                case W::INSTANT_CROWN_HIBERNATE: return p.hold_crown_power_off;
              }
              return false;
            };

            rt.toggle_switch = +[](latter_ui::UiSwitchId swid) {
              using W = latter_ui::UiSwitchId;
              using K = latter_ui::PrefKey;
              const auto &p = latter_ui::persisted_prefs();
              K pk = K::COUNT;
              bool next_val = false;
              switch (swid) {
                case W::HOME_WEATHER_BG: pk = K::WEATHER_BACKGROUND; next_val = !p.weather_background; break;
                case W::HOME_WAKE_GREETING: pk = K::WAKE_GREETING; next_val = !p.wake_greeting; break;
                case W::MUSIC_SHOW_SPEAKER_SHORTCUT: pk = K::SHOW_SPEAKER_SHORTCUT; next_val = !p.show_speaker_shortcut; break;
                case W::MUSIC_SHOW_LIBRARY_SHORTCUT: pk = K::SHOW_LIBRARY_SHORTCUT; next_val = !p.show_library_shortcut; break;
                case W::BLE_AREA_BEACON: pk = K::BLE_BEACON_ENABLED; next_val = !p.ble_beacon_enabled; break;
                case W::GAME_SOUND: pk = K::GAME_SOUND_EFFECTS; next_val = !p.game_sound_effects; break;
                case W::VA_WAKE_SCREEN: pk = K::WAKE_SCREEN_ON_ASSIST; next_val = !p.wake_screen_on_assist; break;
                case W::DOCKED_SCREENSAVER: pk = K::DOCKED_SCREENSAVER; next_val = !p.docked_screensaver; break;
                case W::INSTANT_CROWN_HIBERNATE: pk = K::HOLD_CROWN_POWER_OFF; next_val = !p.hold_crown_power_off; break;
              }
              if (pk == K::COUNT) return;
              uint32_t eff = 0;
              if (latter_actions::record_local_pref_edit(pk, next_val ? "1" : "0", millis(), eff)) {
                latter_ui::device_prefs_state().last_effects = eff;
                id(apply_device_prefs_effects).execute();
              }
            };

            rt.get_number = +[](latter_ui::UiNumberId nid) -> float {
              using N = latter_ui::UiNumberId;
              const auto &p = latter_ui::persisted_prefs();
              switch (nid) {
                case N::VOLUME_STEP_SIZE: return static_cast<float>(p.volume_step_size);
                case N::SPEAKER_VOLUME: {
                  const float v = id(latter_media_player).volume;
                  if (!std::isnan(v) && v >= 0.0f && v <= 1.0f) return std::round(v * 100.0f);
                  return static_cast<float>(p.speaker_volume_pct);
                }
                case N::ALERT_VOLUME: return static_cast<float>(p.alert_volume);
                case N::DAY_START_HOUR: return static_cast<float>(p.day_start_hour);
                case N::NIGHT_START_HOUR: return static_cast<float>(p.night_start_hour);
              }
              return 0.0f;
            };

            rt.set_number = +[](latter_ui::UiNumberId nid, float val) {
              using N = latter_ui::UiNumberId;
              using K = latter_ui::PrefKey;
              if (nid == N::SPEAKER_VOLUME) {
                const int cl_pct = std::clamp(static_cast<int>(std::lround(val)), 10, 100);
                auto &p = latter_ui::persisted_prefs();
                if (p.speaker_volume_pct != static_cast<uint8_t>(cl_pct)) {
                  p.speaker_volume_pct = static_cast<uint8_t>(cl_pct);
                  latter_ui::schedule_persisted_prefs_save(millis());
                }
                const float target_v = static_cast<float>(cl_pct) / 100.0f;
                id(latter_media_player).volume = target_v;
                id(latter_media_player).make_call().set_volume(target_v).perform();
                id(physical_speaker).set_volume(latter_ui::media_dac_volume(target_v));
                if (latter_ui::runtime_state().nav.display_power_state == 0) {
                  latter_ui::schedule_disp_update(&id(disp1));
                }
                return;
              }
              K pk = K::COUNT;
              int cl_val = static_cast<int>(std::lround(val));
              switch (nid) {
                case N::VOLUME_STEP_SIZE: pk = K::VOLUME_STEP_SIZE; cl_val = std::clamp(cl_val, 1, 10); break;
                case N::SPEAKER_VOLUME: break;
                case N::ALERT_VOLUME: pk = K::ALERT_VOLUME; cl_val = std::clamp(cl_val, 20, 100); break;
                case N::DAY_START_HOUR: pk = K::DAY_START_HOUR; cl_val = std::clamp(cl_val, 0, 23); break;
                case N::NIGHT_START_HOUR: pk = K::NIGHT_START_HOUR; cl_val = std::clamp(cl_val, 0, 23); break;
              }
              if (pk == K::COUNT) return;
              uint32_t eff = 0;
              const std::string val_str = std::to_string(cl_val);
              if (latter_actions::record_local_pref_edit(pk, val_str, millis(), eff)) {
                latter_ui::device_prefs_state().last_effects = eff;
                id(apply_device_prefs_effects).execute();
              }
            };
          }

  - id: apply_device_prefs_effects
    mode: restart
    then:
      - lambda: |-
          const uint32_t eff = latter_ui::device_prefs_state().last_effects;
          latter_ui::device_prefs_state().last_effects = 0;
          const auto &rs = latter_ui::runtime_state();
          const auto &p = latter_ui::persisted_prefs();
          if (eff & latter_ui::kPrefEffectWakeWordSync) {
            id(sync_wake_word_state).execute();
            if (std::string_view(latter_ui::pref_wake_word_mode_cstr(p)) == "Disabled" &&
                id(latter_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING &&
                !rs.voice.active) {
              id(media_idle_finish).execute();
            }
          }
          if (eff & latter_ui::kPrefEffectWakeWordSens) {
            id(apply_wake_word_sensitivities).execute();
          }
          if (eff & latter_ui::kPrefEffectThemePreset) {
            id(apply_theme_preset).execute();
          }
          if (eff & latter_ui::kPrefEffectBrightness) {
            id(sync_display_brightness).execute();
          }
          if (eff & latter_ui::kPrefEffectDockedSaverOff) {
            if (rs.nav.display_power_state == 1) {
              #if LATTER_IS_STATIONARY
              id(wake_to_active_state).execute();
              #else
              id(turn_screen_off).execute();
              #endif
            }
          }
          if (eff & latter_ui::kPrefEffectSleepTimer) {
            if (rs.nav.display_power_state == 0) {
              id(screen_sleep_timer).execute();
            }
          }
          if (eff & latter_ui::kPrefEffectPowerPolicy) {
            id(apply_power_policy).execute();
          }
          if (eff & latter_ui::kPrefEffectNavPolicy) {
            const bool cam_busy = latter_ui::cam_call_active() ||
                                  latter_ui::cam_listen_active() ||
                                  latter_ui::cam_intercom_ptt_active();
            if (!p.home_screen_enabled && !cam_busy && !latter_ui::is_on_anchor_root(rs, p)) {
              id(sync_ui_touch_runtime).execute();
              latter_ui::touch_engine().navigate_to_start_screen(millis());
            } else {
              latter_ui::mark_dirty_full();
            }
          }
          if ((eff & latter_ui::kPrefEffectRedraw) && rs.nav.display_power_state != 2 && !rs.nav.is_hibernating) {
            latter_ui::weather_sim_dirty() = true;
            latter_ui::record_ambient_frame_ms(0);
            if (rs.nav.display_power_state == 0) {
              latter_ui::ensure_ui_anim_poller(id(ui_anim_tick));
            }
            latter_ui::schedule_disp_update(&id(disp1));
          }

  - id: toggle_find_my_device
    mode: restart
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          if (!rs.alarms.find_my_active) {
            if (rs.voice.active || !rs.voice.status_text.empty()) {
              id(cancel_voice_assistant).execute();
            }
            rs.alarms.find_my_active = true;
            rs.alarms.find_my_start_ms = millis();
            latter_ui::note_wake_reason(latter_ui::WakeReason::ALERT);
            id(wake_to_active_state).execute();
            id(play_alarm_sound).execute();
            latter_ui::schedule_disp_update(&id(disp1));
          } else {
            rs.alarms.find_my_active = false;
            id(stop_alarm_sound).execute();
            id(sync_display_brightness).execute();
            latter_ui::schedule_disp_update(&id(disp1));
            id(screen_sleep_timer).execute();
          }

  - id: ui_input_event
    mode: queued
    parameters:
      action: string
      delta: int
    then:
      - lambda: |-
          id(sync_ui_touch_runtime).execute();
          latter_ui::touch_engine().on_input_event(action, delta, millis());

  - id: dismiss_notification
    mode: restart
    then:
      - script.stop: fetch_camera_snapshot
      - lambda: |-
          auto &ab = latter_ui::runtime_state().alert;
          ab.active = false;
          ab.camera_url = "";
          ab.loaded_camera_url = "";
      - lambda: 'latter_ui::release_art(id(camera_snapshot_art));'
      - script.execute: mp_idle_debounce
      - script.execute: sync_wake_word_state
      - script.execute: screen_sleep_timer
      - lambda: 'latter_ui::schedule_disp_update(&id(disp1));'

  - id: throttled_disp_update
    mode: restart
    then:
      - delay: 150ms
      - if:
          condition:
            lambda: |-
              const auto &rs = latter_ui::runtime_state();
              return rs.nav.display_power_state == 0 &&
                     (rs.nav.gui_page == 1 || rs.nav.gui_page == 2) &&
                     !rs.voice.active &&
                     (millis() - latter_ui::last_disp_update_ms() >= 90U);
          then:
            - lambda: |-
                const auto &rs = latter_ui::runtime_state();
                if (rs.nav.gui_page == 1 && rs.nav.home_subpage == 0) {
                  latter_ui::ensure_ui_anim_poller(id(ui_anim_tick));
                }
                latter_ui::schedule_anim_disp_update(&id(disp1));

  - id: apply_theme_preset
    mode: restart
    then:
      - lambda: |-
          const auto &prefs = latter_ui::persisted_prefs();
          const std::string_view p = latter_ui::pref_color_profile_cstr(prefs);
          id(theme_secondary) = Color(192, 192, 192);
          if (p == "Custom") {
            latter_ui::apply_custom_rgb_harmony(
                prefs.custom_theme_rgb, id(theme_primary), id(theme_secondary));
          } else if (p == "Pink") {
            id(theme_primary) = Color(168, 120, 132);
          } else if (p == "Green") {
            id(theme_primary) = Color(66, 116, 83);
          } else if (p == "Blue") {
            id(theme_primary) = Color(69, 110, 138);
          } else {
            id(theme_primary) = Color(107, 142, 158);
          }
          if (latter_ui::runtime_state().nav.display_power_state == 0) {
            latter_ui::schedule_disp_update(&id(disp1));
          }

  - id: save_custom_color_to_latter
    mode: restart
    then:
      - lambda: |-
          latter_ui::save_persisted_prefs();
          latter_actions::emit_save_custom_color_rgb(latter_ui::persisted_prefs().custom_theme_rgb);

  - id: sync_display_brightness
    mode: restart
    then:
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          if (rs.nav.display_power_state == 0 && rs.nav.standby_entered_ms != 0) {
            latter_ui::note_wake_from_standby(millis());
          } else if (rs.nav.display_power_state == 1 && rs.nav.standby_entered_ms == 0) {
            const uint32_t now_st_ms = millis();
            rs.nav.standby_entered_ms = (now_st_ms != 0) ? now_st_ms : 1U;
          }
          const auto &prefs = latter_ui::persisted_prefs();
          auto parse_bri = [](std::string_view opt) -> float {
            if (opt == "60%") return 0.60f;
            if (opt == "70%") return 0.70f;
            if (opt == "80%") return 0.80f;
            if (opt == "90%") return 0.90f;
            if (opt == "100%") return 1.00f;
            return 0.90f;
          };

          float b_target = 0.90f;
          const std::string_view mode = latter_ui::pref_auto_brightness_mode_cstr(prefs);

          if (mode == "Sun Synchronized") {
            const std::string &sun = latter_ui::weather_state().sun_state;
            const bool is_night = (sun == "below_horizon");
            const std::string_view opt = is_night ? latter_ui::pref_night_brightness_cstr(prefs)
                                                  : latter_ui::pref_day_brightness_cstr(prefs);
            b_target = parse_bri(opt);
          } else if (mode == "Time Schedule") {
            auto now = id(ha_time).now();
            const int day_h = static_cast<int>(prefs.day_start_hour);
            const int night_h = static_cast<int>(prefs.night_start_hour);
            bool is_day = true;
            if (now.is_valid()) {
              if (day_h < night_h) {
                is_day = (now.hour >= day_h && now.hour < night_h);
              } else {
                is_day = (now.hour >= day_h || now.hour < night_h);
              }
            }
            const std::string_view opt = is_day ? latter_ui::pref_day_brightness_cstr(prefs)
                                                : latter_ui::pref_night_brightness_cstr(prefs);
            b_target = parse_bri(opt);
          } else {
            b_target = parse_bri(latter_ui::pref_manual_brightness_cstr(prefs));
          }

          if ((rs.nav.gui_page == 8 && rs.nav.tools_subpage == 5) || rs.alarms.find_my_active) {
            b_target = 1.00f;
          }

          if (rs.nav.display_power_state == 0) {
            id(display_brightness).turn_on().set_brightness(b_target).perform();
          } else if (rs.nav.display_power_state == 1) {
            id(display_brightness).turn_on().set_brightness(latter_ui::kScreensaverBrightness).perform();
          }

  - id: apply_default_start_page
    then:
      - lambda: |-
          id(sync_ui_touch_runtime).execute();
          latter_ui::touch_engine().navigate_to_start_screen(millis());

  - id: trigger_firmware_update
    mode: restart
    then:
      - update.perform:
          id: latter_firmware_update
      - lambda: |-
          latter_ui::runtime_state().nav.system_menu_mode = 5;
          latter_ui::schedule_disp_update(&id(disp1));

  - id: check_firmware_update
    mode: restart
    then:
      - update.check:
          id: latter_firmware_update

  - id: menu_scroll_transition
    mode: restart
    then:
      - lambda: |-
          latter_ui::menu_scroll_start_ms() = millis();
          latter_ui::ensure_ui_anim_poller(id(ui_anim_tick));
          latter_ui::schedule_anim_disp_update(&id(disp1));
      - delay: !lambda 'return latter_ui::kMotionMs;'
      - lambda: |-
          auto &rs = latter_ui::runtime_state();
          rs.nav.menu_scroll_active = false;
          if (rs.nav.gui_page == 4 && rs.nav.system_menu_mode == 1) {
            rs.nav.sleep_menu_page = rs.nav.menu_scroll_target_page;
          } else if (rs.nav.gui_page == 4 && rs.nav.system_menu_mode == 2) {
            rs.nav.display_menu_page = rs.nav.menu_scroll_target_page;
          } else if (rs.nav.gui_page == 4 && rs.nav.system_menu_mode == 0) {
            rs.nav.system_dashboard_page = rs.nav.menu_scroll_target_page;
          } else if (rs.nav.gui_page == 2 && rs.music.overlay_mode == 2) {
            rs.music.category_page = rs.nav.menu_scroll_target_page;
          } else if (rs.nav.gui_page == 3 && rs.nav.active_game == 0) {
            rs.nav.game_carousel_idx = rs.nav.menu_scroll_target_page;
          } else if (rs.nav.gui_page == 8 && rs.nav.tools_subpage == 0) {
            rs.nav.tools_menu_page = rs.nav.menu_scroll_target_page;
          }
          latter_ui::schedule_disp_update(&id(disp1));
