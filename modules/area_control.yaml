# ==============================================================================
# Latter Core Module: Headless Area Control & Outbound Binding Helper (modules/area_control.yaml)
# Provides outbound action scripts for triggering bindings and area actions
# ==============================================================================

script:
  - id: trigger_latter_binding
    mode: queued
    parameters:
      slot_id: string
    then:
      - homeassistant.action:
          action: latter.trigger_binding
          data:
            target_device: "${name}"
            slot: !lambda 'return slot_id;'

  - id: execute_latter_area_action
    mode: queued
    parameters:
      entity_id: string
      action_name: string
    then:
      - homeassistant.action:
          action: latter.area_action
          data:
            target_device: "${name}"
            entity_id: !lambda 'return entity_id;'
            action: !lambda 'return action_name;'
