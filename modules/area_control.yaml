# ==============================================================================
# Latter Core Module: Headless Area Control Helper (modules/area_control.yaml)
# Provides outbound action script for triggering area actions
# ==============================================================================

script:
  - id: execute_latter_area_action
    mode: queued
    parameters:
      entity_id: string
      action_name: string
    then:
      - homeassistant.action:
          action: latter.area_action
          data:
            target_device: "${name}"
            entity_id: !lambda 'return entity_id;'
            action: !lambda 'return action_name;'
