# ==============================================================================
# Latter Core Module: Headless Area Control Helper (modules/area_control.yaml)
# Provides outbound action script for triggering area actions over System: RPC Outbox
# ==============================================================================

script:
  - id: execute_latter_area_action
    mode: queued
    parameters:
      entity_id: string
      action_name: string
    then:
      - lambda: |-
          latter_rpc::emit(&id(latter_rpc_outbox), "area_action", {
            {"entity_id", entity_id},
            {"action", action_name},
          });
