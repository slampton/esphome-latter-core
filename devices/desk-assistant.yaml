# Build-Stamp: 2026-10-29 21:09:05
# ==============================================================================
# Desk Assistant (v2.2 Modular Architecture)
# Target: Waveshare ESP32-P4-86-Panel-ETH-2RO (720x720 Square Display, SKU 31570)
#         P4 silicon is selected by the p4_silicon profile in boards/waveshare_p4_86_panel.yaml
#         (default rev1 = v1.x engineering silicon; CI also publishes a rev3 build).
# Framework: ESPHome 2026.11.0b2+ (ESP-IDF 5.5+)
# Repository: https://github.com/slampton/esphome-latter-core
# ==============================================================================

substitutions:
  # Branch of latter_core / latter_beacon. A test device that builds the package from dev sets
  # latter_ref: dev in its own substitutions, so YAML and C++ headers come from one revision.
  latter_ref: main
  name: "desk-assistant"
  friendly_name: "Desk Assistant"
  version: "3.0.0"
  screen_w: "720"
  screen_h: "720"
  font_time_size: "112"
  font_chrono_size: "56"
  font_date_size: "38"
  font_btn_bold_size: "36"
  font_small_size: "30"
  font_micro_size: "20"
  font_games_size: "56"
  art_shape: "square"
  default_clock_face: "Minimal Digital"
  default_power_profile: "Always-On Wall / Desk"
  api_reboot_timeout: "15min"

dashboard_import:
  package_import_url: github://slampton/esphome-latter-core/devices/desk-assistant.yaml@main
  import_full_config: false

external_components:
  - source:
      type: git
      url: https://github.com/slampton/esphome-latter-core
      ref: ${latter_ref}
    components: [latter_hal, latter_core, latter_ui, latter_beacon]
    refresh: 0s

latter_core:

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0b2
  project:
    name: "slampton.desk-assistant-p4-86"
    version: "${version}"

logger:
  level: INFO

update:
  - platform: http_request
    id: latter_firmware_update
    name: "Project Firmware"
    icon: "mdi:cellphone-arrow-down"
    source: "https://slampton.github.io/esphome-latter-core/manifests/desk-assistant-${p4_silicon}.json"
    update_interval: never

wifi:
  id: wifi_ctrl
  fast_connect: true
  power_save_mode: NONE

# Area presence iBeacon: raw HCI to the C6's Bluetooth controller over esp_hosted (no host stack on
# the P4). Same component as every Latter device; apply_power_policy starts it once the C6 link is up.
latter_beacon:
  id: ble_ctrl
  uuid: "4C415454-4552-434F-5245-000000000220"
  major: 1
  minor: 5
  measured_power: -59
  min_interval: 500ms
  max_interval: 1000ms

# Wi-Fi provisioning over the USB cable: the web installer asks for Wi-Fi right after flashing.
improv_serial:

safe_mode:
  boot_is_good_after: 60s

packages:
  hal: !include ../boards/waveshare_p4_86_panel.yaml
  latter_audio_voice: !include ../modules/audio_voice.yaml
  latter_power:       !include ../modules/power_manager.yaml
  latter_client:      !include ../modules/latter_client.yaml
  latter_gui:         !include ../guis/universal/gui.yaml