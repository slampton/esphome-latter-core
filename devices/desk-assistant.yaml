# ==============================================================================
# Desk Assistant (v3.0 Modular Architecture)
# Target: Waveshare ESP32-P4-86-Panel-ETH-2RO / ESP32-P4-WIFI6-Touch-LCD-4B (720x720, SKU 31570 / 31416)
#         P4 silicon is selected by the p4_silicon profile in boards/waveshare_p4_86_panel.yaml
#         (default rev1 = v1.x engineering silicon; CI also publishes a rev3 build).
# Framework: ESPHome 2026.11.0+ (ESP-IDF 5.5+)
# Repository: https://github.com/slampton/esphome-latter-core
# ==============================================================================

substitutions:
  # Branch of latter_core / latter_ui / latter_beacon. A test device that builds the package from dev
  # sets latter_ref: dev in its own substitutions, so YAML and C++ headers come from one revision.
  latter_ref: main
  name: "desk-assistant"
  friendly_name: "Desk Assistant"
  version: "3.0.0"

dashboard_import:
  package_import_url: github://slampton/esphome-latter-core/devices/desk-assistant.yaml@main
  import_full_config: false

external_components:
  - source:
      type: git
      url: https://github.com/slampton/esphome-latter-core
      ref: ${latter_ref}
    components: [latter_core, latter_ui, latter_beacon]
    refresh: 0s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0
  project:
    name: "latter.desk-assistant-p4-86"
    version: "${version}"

update:
  - platform: http_request
    id: latter_firmware_update
    name: "Project Firmware"
    icon: "mdi:cellphone-arrow-down"
    source: "https://slampton.github.io/esphome-latter-core/manifests/desk-assistant-${p4_silicon}.json"
    update_interval: never

wifi:
  id: wifi_ctrl
  fast_connect: true
  lease_cache: true
  power_save_mode: NONE

# Area presence iBeacon: raw HCI to the C6's Bluetooth controller over esp_hosted (no host stack on
# the P4). Same component as every Latter device; apply_power_policy starts it once the C6 link is up.
latter_beacon:
  id: ble_ctrl
  uuid: "4C415454-4552-434F-5245-000000000220"
  major: 1
  minor: 5
  measured_power: -59
  min_interval: 500ms
  max_interval: 1000ms

# Wi-Fi provisioning over the USB cable: the web installer asks for Wi-Fi right after flashing.
improv_serial:

packages:
  hal: !include ../boards/waveshare_p4_86_panel.yaml
  latter_firmware: !include ../modules/latter_display_firmware.yaml
