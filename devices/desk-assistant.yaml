# Build-Stamp: 2026-10-29 21:09:05
# ==============================================================================
# Desk Assistant (v2.2 Modular Architecture)
# Target: Waveshare ESP32-P4-WIFI6-Touch-LCD-4B (720x720 Square Display, SKU 31416)
# Framework: ESPHome 2026.10.0+ (ESP-IDF 5.5+)
# Repository: https://github.com/slampton/esphome-latter-core
# ==============================================================================

substitutions:
  name: "desk-assistant"
  device_slug: "desk_assistant"
  friendly_name: "Desk Assistant"
  version: "2.2.0"
  screen_w: "720"
  screen_h: "720"
  font_time_size: "112"
  font_chrono_size: "56"
  font_date_size: "38"
  font_btn_bold_size: "36"
  font_small_size: "30"
  font_micro_size: "20"
  font_games_size: "56"
  art_shape: "square"
  default_clock_face: "Minimal Digital"
  default_power_profile: "Always-On Wall / Desk"
  default_pickup_wake: "Disabled"
  default_tap_wake: "Always On"
  default_battery_timeout: "Never"
  default_docked_timeout: "5 min"
  default_hibernate_timeout: "Disabled"
  api_reboot_timeout: "15min"

dashboard_import:
  package_import_url: github://slampton/esphome-latter-core/devices/desk-assistant.yaml@main
  import_full_config: false

external_components:
  - source:
      type: git
      url: https://github.com/slampton/esphome-latter-core
      ref: main
    components: [latter_core]
    refresh: 0s

latter_core:

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  project:
    name: "slampton.desk-assistant-p4-4b"
    version: "${version}"

logger:
  level: INFO
  hardware_uart: UART0

update:
  - platform: http_request
    id: latter_firmware_update
    name: "Project Firmware"
    icon: "mdi:cellphone-arrow-down"
    source: "https://slampton.github.io/esphome-latter-core/manifests/desk-assistant.json"
    update_interval: never

wifi:
  id: wifi_ctrl
  fast_connect: true
  power_save_mode: NONE

esp32_ble:
  id: ble_ctrl
  enable_on_boot: false

esp32_ble_beacon:
  type: iBeacon
  uuid: "4C415454-4552-434F-5245-000000000220"
  major: 1
  minor: 5
  measured_power: -59
  min_interval: 500ms
  max_interval: 1000ms

safe_mode:
  boot_is_good_after: 5s

packages:
  hal: !include ../boards/waveshare_p4_4b.yaml
  latter_audio_voice: !include ../modules/audio_voice.yaml
  latter_power:       !include ../modules/power_manager.yaml
  latter_client:      !include ../modules/latter_client.yaml
  latter_gui:         !include ../guis/universal/gui.yaml