# Build-Stamp: 2026-10-29 21:09:05
# ==============================================================================
# Mobile Assistant (v2.2 Modular Architecture)
# Target: Waveshare ESP32-S3-Touch-AMOLED-2.16 (480x480 Square AMOLED, SKU 33969)
# Framework: ESPHome 2026.10.2+ (ESP-IDF 5.5+)
# Repository: https://github.com/slampton/esphome-latter-core
# ==============================================================================

substitutions:
  name: "mobile-assistant"
  device_slug: "mobile_assistant"
  friendly_name: "Mobile Assistant"
  version: "2.2.1"
  screen_w: "480"
  screen_h: "480"
  art_shape: "square"
  default_clock_face: "Minimal Digital"
  default_power_profile: "Handheld Roaming"
  api_reboot_timeout: "0s"

dashboard_import:
  package_import_url: github://slampton/esphome-latter-core/devices/mobile-assistant.yaml@main
  import_full_config: false

external_components:
  - source:
      type: git
      url: https://github.com/slampton/esphome-latter-core
      ref: main
    components: [latter_core]
    refresh: 0s

latter_core:

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.2
  project:
    name: "slampton.mobile-assistant-216"
    version: "${version}"

logger:
  level: INFO

update:
  - platform: http_request
    id: latter_firmware_update
    name: "Project Firmware"
    icon: "mdi:cellphone-arrow-down"
    source: "https://slampton.github.io/esphome-latter-core/manifests/mobile-assistant.json"
    update_interval: never

wifi:
  id: wifi_ctrl
  fast_connect: true
  power_save_mode: LIGHT
  reboot_timeout: 0s

esp32_ble:
  id: ble_ctrl
  # apply_power_policy starts Bluetooth after boot settles (beacon) or for the Improv window, so its
  # ~50 KB internal-RAM allocation never stacks on top of Wi-Fi, wake word and Sendspin start-up.
  enable_on_boot: false
  use_psram: true
  max_connections: 1

esp32_ble_beacon:
  type: iBeacon
  uuid: "4C415454-4552-434F-5245-000000000220"
  major: 1
  minor: 3
  measured_power: -59
  tx_power: 3dBm
  min_interval: 500ms
  max_interval: 1000ms

improv_ble:
  authorizer: boot_button
  wifi_timeout: 5s

safe_mode:
  boot_is_good_after: 60s

packages:
  hal: !include ../boards/waveshare_s3_216.yaml
  latter_audio_voice: !include ../modules/audio_voice.yaml
  latter_power:       !include ../modules/power_manager.yaml
  latter_client:      !include ../modules/latter_client.yaml
  latter_gui:         !include ../guis/universal/gui.yaml