# Build-Stamp: 2026-10-29 21:09:05
# ==============================================================================
# Pocket Assistant (v2.2 Modular Architecture)
# Target: Waveshare ESP32-S3-Touch-AMOLED-1.75C (466x466 Circular AMOLED)
# Framework: ESPHome 2026.10.0+ (ESP-IDF 5.5+)
# Repository: https://github.com/slampton/esphome-latter-core
# ==============================================================================

substitutions:
  name: "pocket-assistant"
  device_slug: "pocket_assistant"
  friendly_name: "Pocket Assistant"
  version: "2.2.1"
  screen_w: "466"
  screen_h: "466"
  art_shape: "circle"
  default_clock_face: "Modern Roman (Analog)"
  default_power_profile: "Portable Carry"
  default_pickup_wake: "Docked Only"
  default_tap_wake: "Docked Only"
  default_battery_timeout: "30s"
  default_docked_timeout: "1 min"
  default_hibernate_timeout: "15 min"
  api_reboot_timeout: "0s"

dashboard_import:
  package_import_url: github://slampton/esphome-latter-core/devices/pocket-assistant.yaml@main
  import_full_config: false

external_components:
  - source:
      type: git
      url: https://github.com/slampton/esphome-latter-core
      ref: main
    components: [latter_core]
    refresh: 0s

latter_core:

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  project:
    name: "slampton.pocket-assistant-175c"
    version: "${version}"

logger:
  level: INFO

update:
  - platform: http_request
    id: latter_firmware_update
    name: "Project Firmware"
    icon: "mdi:cellphone-arrow-down"
    source: "https://slampton.github.io/esphome-latter-core/manifests/pocket-assistant.json"
    update_interval: never

wifi:
  id: wifi_ctrl
  fast_connect: true
  power_save_mode: LIGHT
  reboot_timeout: 0s
  on_connect:
    then:
      - delay: 5s
      - if:
          condition:
            lambda: 'return id(ble_ctrl).is_active() && !id(ble_area_beacon_switch).state;'
          then:
            - ble.disable:

esp32_ble:
  id: ble_ctrl
  enable_on_boot: true
  use_psram: true
  max_connections: 1

esp32_ble_beacon:
  type: iBeacon
  uuid: "4C415454-4552-434F-5245-000000000220"
  major: 1
  minor: 1
  measured_power: -59
  min_interval: 500ms
  max_interval: 1000ms

improv_ble:
  authorizer: none
  wifi_timeout: 5s

safe_mode:
  boot_is_good_after: 5s

packages:
  hal: !include ../boards/waveshare_s3_175c.yaml
  latter_audio_voice: !include ../modules/audio_voice.yaml
  latter_power:       !include ../modules/power_manager.yaml
  latter_client:      !include ../modules/latter_client.yaml
  latter_gui:         !include ../guis/universal/gui.yaml