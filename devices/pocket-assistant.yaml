# Build-Stamp: 2026-10-29 21:09:05
# ==============================================================================
# Pocket Assistant (v2.2 Modular Architecture)
# Target: Waveshare ESP32-S3-Touch-AMOLED-1.75C (466x466 Circular AMOLED)
# Framework: ESPHome 2026.11.0b2+ (ESP-IDF 5.5+)
# Repository: https://github.com/slampton/esphome-latter-core
# ==============================================================================

substitutions:
  # Branch of latter_core / latter_beacon. A test device that builds the package from dev sets
  # latter_ref: dev in its own substitutions, so YAML and C++ headers come from one revision.
  latter_ref: main
  name: "pocket-assistant"
  device_slug: "pocket_assistant"
  friendly_name: "Pocket Assistant"
  version: "2.2.1"
  screen_w: "466"
  screen_h: "466"
  art_shape: "circle"
  default_clock_face: "Modern Roman (Analog)"
  default_power_profile: "Portable Carry"
  api_reboot_timeout: "0s"

dashboard_import:
  package_import_url: github://slampton/esphome-latter-core/devices/pocket-assistant.yaml@main
  import_full_config: false

external_components:
  - source:
      type: git
      url: https://github.com/slampton/esphome-latter-core
      ref: ${latter_ref}
    components: [latter_core, latter_beacon]
    refresh: 0s

latter_core:

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0b2
  project:
    name: "slampton.pocket-assistant-175c"
    version: "${version}"

logger:
  level: INFO

update:
  - platform: http_request
    id: latter_firmware_update
    name: "Project Firmware"
    icon: "mdi:cellphone-arrow-down"
    source: "https://slampton.github.io/esphome-latter-core/manifests/pocket-assistant.json"
    update_interval: never

wifi:
  id: wifi_ctrl
  fast_connect: true
  power_save_mode: LIGHT
  reboot_timeout: 0s

# Area presence iBeacon, advertised straight through the Bluetooth controller (no host stack, so
# Bluetooth holds far less internal RAM than esp32_ble's Bluedroid). apply_power_policy starts it
# after boot settles and stops it while docked.
latter_beacon:
  id: ble_ctrl
  uuid: "4C415454-4552-434F-5245-000000000220"
  major: 1
  minor: 1
  measured_power: -59
  min_interval: 500ms
  max_interval: 1000ms

# Wi-Fi provisioning over the USB cable: the web installer asks for Wi-Fi right after flashing.
improv_serial:

safe_mode:
  boot_is_good_after: 60s

packages:
  hal: !include ../boards/waveshare_s3_175c.yaml
  latter_audio_voice: !include ../modules/audio_voice.yaml
  latter_power:       !include ../modules/power_manager.yaml
  latter_client:      !include ../modules/latter_client.yaml
  latter_gui:         !include ../guis/universal/gui.yaml