# Build-Stamp: 2026-10-29 21:09:05
# ==============================================================================
# Wrist Assist (v2.2 Modular Architecture)
# Target: Waveshare ESP32-S3-Touch-AMOLED-2.06 (410x502 Rectangular Watch)
# Framework: ESPHome 2026.10.2+ (ESP-IDF 5.5+)
# Repository: https://github.com/slampton/esphome-latter-core
# ==============================================================================

substitutions:
  name: "wrist-assist"
  device_slug: "wrist_assist"
  friendly_name: "Wrist Assist"
  version: "2.2.1"
  screen_w: "410"
  screen_h: "502"
  art_shape: "square"
  default_clock_face: "Minimal Digital"
  default_power_profile: "Wearable Watch"
  api_reboot_timeout: "0s"

dashboard_import:
  package_import_url: github://slampton/esphome-latter-core/devices/wrist-assist.yaml@main
  import_full_config: false

external_components:
  - source:
      type: git
      url: https://github.com/slampton/esphome-latter-core
      ref: main
    components: [latter_core]
    refresh: 0s

latter_core:

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0b1
  project:
    name: "slampton.wrist-assist-206"
    version: "${version}"

logger:
  level: INFO

update:
  - platform: http_request
    id: latter_firmware_update
    name: "Project Firmware"
    icon: "mdi:cellphone-arrow-down"
    source: "https://slampton.github.io/esphome-latter-core/manifests/wrist-assist.json"
    update_interval: never

wifi:
  id: wifi_ctrl
  fast_connect: true
  power_save_mode: LIGHT
  reboot_timeout: 0s

esp32_ble:
  id: ble_ctrl
  # Bluetooth is only the Area presence beacon (advertising, no GATT). apply_power_policy starts it after
  # boot settles, so its ~50 KB internal-RAM allocation never stacks on Wi-Fi, wake word and Sendspin start-up.
  enable_on_boot: false
  use_psram: true
  max_connections: 1

esp32_ble_beacon:
  type: iBeacon
  uuid: "4C415454-4552-434F-5245-000000000220"
  major: 1
  minor: 2
  measured_power: -59
  min_interval: 500ms
  max_interval: 1000ms

# Wi-Fi provisioning over the USB cable: the web installer asks for Wi-Fi right after flashing.
improv_serial:

safe_mode:
  boot_is_good_after: 60s

packages:
  hal: !include ../boards/waveshare_s3_206.yaml
  latter_audio_voice: !include ../modules/audio_voice.yaml
  latter_power:       !include ../modules/power_manager.yaml
  latter_client:      !include ../modules/latter_client.yaml
  latter_gui:         !include ../guis/universal/gui.yaml