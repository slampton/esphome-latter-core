# Build-Stamp: 2026-10-29 21:09:05
# ==============================================================================
# Remote Assistant (v2.2 Modular Architecture)
# Target: Waveshare ESP32-P4-WIFI6-Touch-LCD-3.5 (320x480 IPS LCD + Camera, SKU 33360)
#         P4 silicon is selected by the p4_silicon profile in boards/waveshare_p4_35.yaml
#         (default rev3 = v3.x production silicon; CI also publishes a rev1 build).
# Framework: ESPHome 2026.11.0b3+ (ESP-IDF 5.5+)
# Repository: https://github.com/slampton/esphome-latter-core
# ==============================================================================

substitutions:
  # Branch of latter_core / latter_beacon. A test device that builds the package from dev sets
  # latter_ref: dev in its own substitutions, so YAML and C++ headers come from one revision.
  latter_ref: main
  name: "remote-assistant"
  friendly_name: "Remote Assistant"
  version: "3.0.0"
  screen_w: "320"
  screen_h: "480"
  art_shape: "square"
  default_clock_face: "Minimal Digital"
  default_power_profile: "Tabletop Dock"
  api_reboot_timeout: "0s"

dashboard_import:
  package_import_url: github://slampton/esphome-latter-core/devices/remote-assistant.yaml@main
  import_full_config: false

external_components:
  - source:
      type: git
      url: https://github.com/slampton/esphome-latter-core
      ref: ${latter_ref}
    components: [latter_hal, latter_core, latter_ui, latter_beacon]
    refresh: 0s

latter_core:

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0b3
  project:
    name: "slampton.remote-assistant-p4-35"
    version: "${version}"

logger:
  level: INFO

update:
  - platform: http_request
    id: latter_firmware_update
    name: "Project Firmware"
    icon: "mdi:cellphone-arrow-down"
    source: "https://slampton.github.io/esphome-latter-core/manifests/remote-assistant-${p4_silicon}.json"
    update_interval: never

wifi:
  id: wifi_ctrl
  fast_connect: true
  reboot_timeout: 0s

# Area presence iBeacon: raw HCI to the C6's Bluetooth controller over esp_hosted (no host stack on
# the P4). Same component as every Latter device; apply_power_policy starts it once the C6 link is up.
latter_beacon:
  id: ble_ctrl
  uuid: "4C415454-4552-434F-5245-000000000220"
  major: 1
  minor: 4
  measured_power: -59
  min_interval: 500ms
  max_interval: 1000ms

# Wi-Fi provisioning over the USB cable: the web installer asks for Wi-Fi right after flashing.
improv_serial:

safe_mode:
  boot_is_good_after: 60s

packages:
  hal: !include ../boards/waveshare_p4_35.yaml
  latter_audio_voice: !include ../modules/audio_voice.yaml
  latter_power:       !include ../modules/power_manager.yaml
  latter_client:      !include ../modules/latter_client.yaml
  latter_gui:         !include ../guis/universal/gui.yaml