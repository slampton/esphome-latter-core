# Build-Stamp: 2026-10-27 03:29:05
# ==============================================================================
# Remote Assistant (v2.2 Modular Architecture)
# Target: Waveshare ESP32-P4-WIFI6-Touch-LCD-3.5 (320x480 IPS LCD + Camera, SKU 33360)
# Framework: ESPHome 2026.10.0+ (ESP-IDF 5.5+)
# Repository: https://github.com/slampton/esphome-latter-core
# ==============================================================================

substitutions:
  name: "remote-assistant"
  friendly_name: "Remote Assistant"
  version: "2.2.0"
  screen_w: "320"
  screen_h: "480"
  art_resize: "320x480"
  art_shape: "square"
  firmware_update_entity: "update.remote_assistant_project_firmware"
  default_start_app: "Home"
  default_art_mode: "Full Screen"
  default_screensaver_style: "Aurora Borealis"
  default_album_sort: "Alphabetical"
  default_artist_album_sort: "Oldest on Top"
  default_podcast_sort: "Newest on Top"

  active_media_sensor: "sensor.remote_assistant_active_media"
  weather_forecast_sensor: "sensor.remote_assistant_weather_forecast"
  room_context_sensor: "sensor.remote_assistant_room_context"
  calendar_agenda_sensor: "sensor.remote_assistant_calendar_agenda"
  remote_config_sensor: "sensor.remote_assistant_remote_config"

  initial_art_url: "http://homeassistant.local:8123/static/icons/favicon-192x192.png"
  local_player_id: "media_player.remote_assistant"
  weather_entity: "weather.forecast_home"
  sun_entity: "sun.sun"
  moon_entity: "sensor.moon_phase"

  tv_remote_entity: "remote.none"
  tv_remote_entity_2: "remote.none"
  tv_remote_entity_3: "remote.none"
  tv_remote_entity_4: "remote.none"

dashboard_import:
  package_import_url: github://slampton/esphome-latter-core/devices/remote-assistant.yaml@main
  import_full_config: false

external_components:
  - source:
      type: git
      url: https://github.com/slampton/esphome-latter-core
      ref: main
    components: [latter_core]
    refresh: 0s

latter_core:

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  project:
    name: "slampton.remote-assistant-p4-35"
    version: "${version}"

logger:
  level: INFO

update:
  - platform: http_request
    id: latter_firmware_update
    name: "Project Firmware"
    icon: "mdi:cellphone-arrow-down"
    source: "https://slampton.github.io/esphome-latter-core/manifests/remote-assistant.json"
    update_interval: never

wifi:
  id: wifi_ctrl
  fast_connect: true

esp32_ble:
  id: ble_ctrl
  enable_on_boot: false

esp32_ble_beacon:
  type: iBeacon
  uuid: "504F434B-4554-4153-5354-000000000210"
  major: 1
  minor: 4
  measured_power: -59
  min_interval: 500ms
  max_interval: 1000ms

safe_mode:
  boot_is_good_after: 5s

packages:
  hal: !include ../boards/waveshare_p4_35.yaml
  latter_audio_voice: !include ../modules/audio_voice.yaml
  latter_power_pmu:   !include ../modules/power_axp2101.yaml
  latter_client:      !include ../modules/latter_client.yaml
  latter_gui:         !include ../guis/universal/gui.yaml