name: Validate Core & Devices

# dev is the integration branch. A push to dev runs every check, compiles all flagship device
# variants from that exact commit, and only then fast-forwards main, the branch devices build from
# (packages, external_components, sounds, and models default to main). main is never ahead of a green build.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# A running build is never cancelled: it finishes and promotes, then only the newest queued push runs.
# (Cancelling on every push would starve main whenever pushes come faster than a build.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Latter Core Modules, Probes & Devices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install ESPHome 2026.11.0
        run: pip install --upgrade pip esphome==2026.11.0

      - name: Point remote references at this checkout
        run: bash .github/scripts/pin_to_checkout.sh "${{ github.event.pull_request.head.sha || github.sha }}"

      # Remote files ESPHome downloads during config validation (fonts, remote sounds) are kept between runs, so
      # a brief outage of a download host does not fail a build that did not change them. Wake word models are
      # vendored in models/ and never downloaded from github.com's /raw/ path (it returned 504 to runners).
      - name: Restore downloaded remote files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: '**/.esphome/external_files'
          key: external-files-esphome-2026.11.0-${{ hashFiles('modules/**/*.yaml', 'guis/**/*.yaml', 'examples/**/*.yaml') }}
          restore-keys: |
            external-files-esphome-2026.11.0-

      - name: Verify static architecture, DAG, protocol, sounds, trait matrices, and 6-geometry C++20 host tests
        run: python tools/verify_core.py

      - name: Check board facts release ledger (zero L-confidence nets)
        run: python tools/check_boards.py --release --check-docs

      - name: Validate bring-up probes
        run: |
          for probe in examples/bringup/*.yaml; do
            echo "Validating $probe..."
            ATTEMPTS=2 bash .github/scripts/esphome_run.sh "esphome config $probe" config "$probe"
          done

      - name: Validate 5 Flagship Device Configs
        run: |
          for dev in devices/*.yaml; do
            echo "Validating $dev..."
            base_name=$(basename "$dev")
            cat <<EOF > "devices/.ci_${base_name}"
          wifi:
            ssid: "LatterCIWiFi"
            password: "LatterCIPassword"
          api:
            encryption:
              key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
          ota:
            - id: !extend ota_esphome
              encryption:
          packages:
            device_under_test: !include ${base_name}
          EOF
            ATTEMPTS=2 bash .github/scripts/esphome_run.sh "esphome config ${base_name}" config "devices/.ci_${base_name}"
            rm -f "devices/.ci_${base_name}"
            ATTEMPTS=2 bash .github/scripts/esphome_run.sh "esphome config ${base_name} (mac suffix)" -s name_add_mac_suffix true config "${dev}"
          done

  compile:
    name: Compile ${{ matrix.target.slug }}
    # Full firmware builds gate dev -> main (C++ lambdas and headers only fail at compile time).
    if: github.ref == 'refs/heads/dev' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - slug: pocket-assistant
            file: pocket-assistant
            subs: "-s name_add_mac_suffix true"
          - slug: mobile-assistant
            file: mobile-assistant
            subs: "-s name_add_mac_suffix true"
          - slug: wrist-assist
            file: wrist-assist
            subs: "-s name_add_mac_suffix true"
          - slug: remote-assistant
            file: remote-assistant
            subs: "-s name_add_mac_suffix true"
          - slug: desk-assistant-rev1
            file: desk-assistant
            subs: "-s name_add_mac_suffix true -s p4_silicon rev1 -s p4_engineering_sample true -s p4_cpu_frequency 360MHz"
          - slug: desk-assistant-rev3
            file: desk-assistant
            subs: "-s name_add_mac_suffix true -s p4_silicon rev3 -s p4_engineering_sample false -s p4_cpu_frequency 400MHz"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        id: py
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install ESPHome 2026.11.0
        run: pip install --upgrade pip esphome==2026.11.0

      # ESP-IDF framework, toolchains, component mirror and its Python environment (~/.cache/esphome/idf),
      # shared by every device. The key carries the exact Python build because that environment points
      # at it. Build directories are never cached: CMake stores absolute tool paths that a later runner
      # does not have (a cached build dir failed with "ninja --version: no such file or directory").
      - name: Restore ESP-IDF toolchain cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/esphome
          key: idf-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-esphome-2026.11.0

      - name: Point remote references at this checkout
        run: bash .github/scripts/pin_to_checkout.sh "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Restore downloaded remote files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: '**/.esphome/external_files'
          key: external-files-esphome-2026.11.0-${{ hashFiles('modules/**/*.yaml', 'guis/**/*.yaml', 'examples/**/*.yaml') }}
          restore-keys: |
            external-files-esphome-2026.11.0-

      - name: Compile
        run: bash .github/scripts/esphome_run.sh "esphome compile ${{ matrix.target.slug }}" ${{ matrix.target.subs }} compile devices/${{ matrix.target.file }}.yaml

  promote:
    name: Fast-forward main to this commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [validate, compile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Fast-forward main (refuses anything that is not a fast-forward)
        run: git push origin "${GITHUB_SHA}:refs/heads/main"
