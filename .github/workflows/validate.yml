name: Validate SDK & Examples

# dev is the integration branch. A push to dev runs every check, compiles all five devices from that
# exact commit, and only then fast-forwards main, the branch devices build from (packages,
# external_components, sounds and models all reference @main). main is never ahead of a green build.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# A running build is never cancelled: it finishes and promotes, then only the newest queued push runs.
# (Cancelling on every push would starve main whenever pushes come faster than a build.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ESPHome SDK Modules & Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ESPHome 2026.11.0b1
        run: pip install --upgrade pip esphome==2026.11.0b1

      - name: Verify Protocol v3 codegen parity
        run: python tools/gen_protocol.py --check

      - name: Check firmware service calls and device actions against the protocol
        run: python tools/check_protocol_usage.py

      - name: Check board facts ledger and generated pin maps
        run: python tools/check_boards.py --check-docs

      - name: Check generated bring-up probes
        run: python tools/new_board.py --bringup --check

      - name: Check rendered sounds match their melodies
        run: python tools/gen_sounds.py --check

      - name: Compile and run C++20 host unit tests
        run: |
          g++ -std=c++20 -O2 tests/host/test_latter_state.cpp -o /tmp/test_latter_state
          /tmp/test_latter_state

      - name: Validate Example 1 (Minimal Headless Companion)
        run: esphome config examples/minimal_headless_companion.yaml

      - name: Validate Example 2 (Full Companion OS & 480x480 Display Template)
        run: esphome config examples/custom_display_template.yaml

      - name: Validate bring-up probes
        run: |
          for probe in examples/bringup/*.yaml; do
            echo "Validating $probe..."
            esphome config "$probe"
          done

      - name: Validate 5 Flagship Device Configs
        run: |
          for dev in devices/*.yaml; do
            echo "Validating $dev..."
            base_name=$(basename "$dev")
            cat <<EOF > "devices/.ci_${base_name}"
          external_components:
            - source:
                type: local
                path: ../components
              components: [latter_core]
          wifi:
            ssid: "LatterCIWiFi"
            password: "LatterCIPassword"
          packages:
            device_under_test: !include ${base_name}
          EOF
            esphome config "devices/.ci_${base_name}"
            rm -f "devices/.ci_${base_name}"
          done

  compile:
    name: Compile ${{ matrix.device }}
    # Full firmware builds gate dev -> main (C++ lambdas and headers only fail at compile time).
    if: github.ref == 'refs/heads/dev' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [pocket-assistant, mobile-assistant, wrist-assist, remote-assistant, desk-assistant]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ESPHome 2026.11.0b1
        run: pip install --upgrade pip esphome==2026.11.0b1

      - name: Restore toolchain and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            devices/.esphome
          key: fw-${{ matrix.device }}-esphome-2026.11.0b1-${{ github.sha }}
          restore-keys: |
            fw-${{ matrix.device }}-esphome-2026.11.0b1-

      - name: Pin @main references to this commit
        # Remote references (latter_core component, sounds, wake word model) must build this commit, not main.
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          find devices modules guis boards examples -name '*.yaml' -exec sed -i \
            "s/@main/@${SHA}/g; s/ref: main/ref: ${SHA}/g; s#/esphome-latter-core/main/#/esphome-latter-core/${SHA}/#g" {} +

      - name: Compile
        run: esphome compile devices/${{ matrix.device }}.yaml

  promote:
    name: Fast-forward main to this commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [validate, compile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fast-forward main (refuses anything that is not a fast-forward)
        run: git push origin "${GITHUB_SHA}:refs/heads/main"
