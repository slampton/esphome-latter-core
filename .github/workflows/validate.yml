name: Validate SDK & Examples

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate ESPHome SDK Modules & Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ESPHome 2026.10.2
        run: pip install --upgrade pip esphome==2026.10.2

      - name: Verify Protocol v3 codegen parity
        run: python tools/gen_protocol.py --check

      - name: Check board facts ledger and generated pin maps
        run: python tools/check_boards.py --check-docs

      - name: Check generated bring-up probes
        run: python tools/new_board.py --bringup --check

      - name: Compile and run C++20 host unit tests
        run: |
          g++ -std=c++20 -O2 tests/host/test_latter_state.cpp -o /tmp/test_latter_state
          /tmp/test_latter_state

      - name: Validate Example 1 (Minimal Headless Companion)
        run: esphome config examples/minimal_headless_companion.yaml

      - name: Validate Example 2 (Full Companion OS & 480x480 Display Template)
        run: esphome config examples/custom_display_template.yaml

      - name: Validate bring-up probes
        run: |
          for probe in examples/bringup/*.yaml; do
            echo "Validating $probe..."
            esphome config "$probe"
          done

      - name: Validate 5 Flagship Device Configs
        run: |
          for dev in devices/*.yaml; do
            echo "Validating $dev..."
            base_name=$(basename "$dev")
            cat <<EOF > "devices/.ci_${base_name}"
          external_components:
            - source:
                type: local
                path: ../components
              components: [latter_core]
          wifi:
            ssid: "LatterCIWiFi"
            password: "LatterCIPassword"
          packages:
            device_under_test: !include ${base_name}
          EOF
            esphome config "devices/.ci_${base_name}"
            rm -f "devices/.ci_${base_name}"
          done
