name: Build & Publish 5-Device Web Installer

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_device:
    name: Build ${{ matrix.device.slug }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # slug = published artifact/manifest name, file = devices/<file>.yaml (also the ESPHome
        # build dir name), subs = ESPHome -s substitution overrides (MAC suffix + P4 silicon profiles).
        # Remote Assistant (SKU 33360) ships exclusively with rev3.x production silicon; Desk Assistant
        # (SKU 31570 / 4B) ships in both rev1.x and rev3.x batches (binaries are not cross-compatible).
        device:
          - slug: pocket-assistant
            file: pocket-assistant
            name: "Latter — Pocket Assistant (1.75C)"
            chip: "ESP32-S3"
            subs: "-s name_add_mac_suffix true"
          - slug: mobile-assistant
            file: mobile-assistant
            name: "Latter — Mobile Assistant (2.16)"
            chip: "ESP32-S3"
            subs: "-s name_add_mac_suffix true"
          - slug: wrist-assist
            file: wrist-assist
            name: "Latter — Wrist Assist (2.06)"
            chip: "ESP32-S3"
            subs: "-s name_add_mac_suffix true"
          - slug: remote-assistant
            file: remote-assistant
            name: "Latter — Remote Assistant (P4 3.5)"
            chip: "ESP32-P4"
            subs: "-s name_add_mac_suffix true"
          - slug: desk-assistant-rev1
            file: desk-assistant
            name: "Latter — Desk Assistant (P4 86-Panel / 4B, chip rev 1.x)"
            chip: "ESP32-P4"
            subs: "-s name_add_mac_suffix true -s p4_silicon rev1 -s p4_engineering_sample true -s p4_cpu_frequency 360MHz"
          - slug: desk-assistant-rev3
            file: desk-assistant
            name: "Latter — Desk Assistant (P4 86-Panel / 4B, chip rev 3.x)"
            chip: "ESP32-P4"
            subs: "-s name_add_mac_suffix true -s p4_silicon rev3 -s p4_engineering_sample false -s p4_cpu_frequency 400MHz"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Board facts release gate (no L-confidence facts)
        run: python3 tools/check_boards.py --release --check-docs

      - name: Resolve and verify release version & pin @main / ${latter_asset_ref} refs on releases
        id: rel_meta
        shell: bash
        run: |
          BASE_VER=$(sed -n 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/p' modules/system_core.yaml | head -n1)
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#v}"
            if [[ "${VERSION}" != "${BASE_VER}" ]]; then
              echo "::error::Release tag ${TAG_NAME} (${VERSION}) does not match modules/system_core.yaml (${BASE_VER})"
              exit 1
            fi
            find devices modules examples -name '*.yaml' -exec sed -i \
              -e "s/@main/@${TAG_NAME}/g" \
              -e "s/latter_ref:[[:space:]]*[\"']*main[\"']*/latter_ref: \"${TAG_NAME}\"/g" \
              -e "s/latter_asset_ref:[[:space:]]*[\"']*main[\"']*/latter_asset_ref: \"${TAG_NAME}\"/g" \
              -e "s/ref:[[:space:]]*main$/ref: ${TAG_NAME}/g" \
              -e "s#/esphome-latter-core/main/#/esphome-latter-core/${TAG_NAME}/#g" {} +
          else
            VERSION="${BASE_VER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compile ${{ matrix.device.slug }} with ESPHome
        uses: docker://ghcr.io/esphome/esphome:2026.11.1@sha256:eb1a5383cb1ce62df8683d7d728deaa5d8d78f0de0c6dccc9e3215cda53a1c6f
        with:
          args: ${{ matrix.device.subs }} compile devices/${{ matrix.device.file }}.yaml

      - name: Stage Factory, OTA Binaries & Manifest
        shell: bash
        run: |
          VERSION="${{ steps.rel_meta.outputs.version }}"
          mkdir -p dist/firmware dist/manifests
          BUILD_DIR="devices/.esphome/build/${{ matrix.device.file }}/build"
          cp "${BUILD_DIR}/firmware.factory.bin" "dist/firmware/${{ matrix.device.slug }}.factory.bin"
          cp "${BUILD_DIR}/firmware.ota.bin" "dist/firmware/${{ matrix.device.slug }}.ota.bin"
          # Debug symbols for this exact binary: decode the crash backtrace a device logs after a panic.
          mkdir -p elf
          cp "${BUILD_DIR}/firmware.elf" "elf/${{ matrix.device.slug }}-${VERSION}.elf"
          MD5_SUM=$(md5sum "dist/firmware/${{ matrix.device.slug }}.ota.bin" | awk '{print $1}')
          cat <<EOF > "dist/manifests/${{ matrix.device.slug }}.json"
          {
            "name": "${{ matrix.device.name }}",
            "version": "${VERSION}",
            "home_assistant_domain": "esphome",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "${{ matrix.device.chip }}",
                "ota": {
                  "path": "../firmware/${{ matrix.device.slug }}.ota.bin",
                  "md5": "${MD5_SUM}",
                  "summary": "Latter OS v${VERSION} for ${{ matrix.device.name }}"
                },
                "parts": [
                  {
                    "path": "../firmware/${{ matrix.device.slug }}.factory.bin",
                    "offset": 0
                  }
                ]
              }
            ]
          }
          EOF

      - name: Upload artifact for ${{ matrix.device.slug }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-${{ matrix.device.slug }}
          path: dist/

      - name: Upload debug symbols for ${{ matrix.device.slug }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: elf-${{ matrix.device.slug }}
          path: elf/
          retention-days: 90

  attach_release_assets:
    name: Attach Debug Symbols to GitHub Release
    if: github.event_name == 'release'
    needs: build_device
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all debug symbol artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: elf-*
          path: elf
          merge-multiple: true

      - name: Attach debug symbols to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" elf/*.elf --clobber

  # Upload and deploy run as separate jobs (GitHub's two-job Pages architecture) so the
  # Actions artifact index settles before actions/deploy-pages lists artifacts, and so
  # re-running a failed deploy_pages job never re-uploads a duplicate github-pages artifact.
  package_pages:
    name: Stage Unified Web Installer Artifact
    needs: build_device
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_id: ${{ steps.upload_pages.outputs.artifact_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all device build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: build-*
          path: _site
          merge-multiple: true

      - name: Copy Web Installer UI and stamp release version
        shell: bash
        run: |
          BASE_VER=$(sed -n 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/p' modules/system_core.yaml | head -n1)
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            VERSION="${BASE_VER}"
          fi
          sed -E "s#<span class=\"nav-badge\">v[0-9]+\.[0-9]+\.[0-9]+</span>#<span class=\"nav-badge\">v${VERSION}</span>#g" index.html > _site/index.html
          grep -Fq "<span class=\"nav-badge\">v${VERSION}</span>" _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        id: upload_pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy_pages:
    name: Deploy Unified Web Installer to GitHub Pages
    needs: package_pages
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for github-pages artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ needs.package_pages.outputs.artifact_id }}
        run: |
          for attempt in $(seq 1 15); do
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name == "github-pages") | .id' 2>/dev/null || true)
            if [[ -n "${ARTIFACT_ID}" ]]; then
              if printf '%s\n' "${ids}" | grep -Fxq "${ARTIFACT_ID}"; then
                echo "github-pages artifact ${ARTIFACT_ID} indexed (attempt ${attempt})"
                exit 0
              fi
            elif [[ -n "${ids}" ]]; then
              echo "github-pages artifact indexed (attempt ${attempt})"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::github-pages artifact ${ARTIFACT_ID} not yet visible in REST listing after 30s; proceeding to deploy-pages"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  promote_stable:
    name: Fast-Forward stable Branch on Tagged Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: deploy_pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Fast-forward stable branch on tagged release
        shell: bash
        run: |
          git push origin "HEAD:refs/heads/stable" --force
