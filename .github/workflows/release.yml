name: Build & Publish 5-Device Web Installer

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_device:
    name: Build ${{ matrix.device.slug }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # slug = published artifact/manifest name, file = devices/<file>.yaml (also the ESPHome
        # build dir name), subs = ESPHome -s substitution overrides (P4 silicon profiles).
        # P4 rev1.x and rev3.x binaries are not cross-compatible, so each P4 board ships both.
        device:
          - slug: pocket-assistant
            file: pocket-assistant
            name: "Latter — Pocket Assistant (1.75C)"
            chip: "ESP32-S3"
            subs: ""
          - slug: mobile-assistant
            file: mobile-assistant
            name: "Latter — Mobile Assistant (2.16)"
            chip: "ESP32-S3"
            subs: ""
          - slug: wrist-assist
            file: wrist-assist
            name: "Latter — Wrist Assist (2.06)"
            chip: "ESP32-S3"
            subs: ""
          - slug: remote-assistant-rev3
            file: remote-assistant
            name: "Latter — Remote Assistant (P4 3.5, chip rev 3.x)"
            chip: "ESP32-P4"
            subs: "-s p4_silicon rev3 -s p4_engineering_sample false -s p4_cpu_frequency 400MHz"
          - slug: remote-assistant-rev1
            file: remote-assistant
            name: "Latter — Remote Assistant (P4 3.5, chip rev 1.x)"
            chip: "ESP32-P4"
            subs: "-s p4_silicon rev1 -s p4_engineering_sample true -s p4_cpu_frequency 360MHz"
          - slug: desk-assistant-rev1
            file: desk-assistant
            name: "Latter — Desk Assistant (P4 86-Panel, chip rev 1.x)"
            chip: "ESP32-P4"
            subs: "-s p4_silicon rev1 -s p4_engineering_sample true -s p4_cpu_frequency 360MHz"
          - slug: desk-assistant-rev3
            file: desk-assistant
            name: "Latter — Desk Assistant (P4 86-Panel, chip rev 3.x)"
            chip: "ESP32-P4"
            subs: "-s p4_silicon rev3 -s p4_engineering_sample false -s p4_cpu_frequency 400MHz"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Board facts release gate (no L-confidence facts)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/check_boards.py --release --check-docs

      - name: Resolve and verify release version & pin @main refs on tagged releases
        id: rel_meta
        shell: bash
        run: |
          BASE_VER=$(sed -n 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/p' modules/base.yaml | head -n1)
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#v}"
            if [[ "${VERSION}" != "${BASE_VER}" ]]; then
              echo "::error::Release tag ${TAG_NAME} (${VERSION}) does not match modules/base.yaml (${BASE_VER})"
              exit 1
            fi
            find devices modules examples -name '*.yaml' -exec sed -i "s/@main/@${TAG_NAME}/g; s/ref: main/ref: ${TAG_NAME}/g" {} +
          else
            VERSION="${BASE_VER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compile ${{ matrix.device.slug }} with ESPHome
        uses: docker://ghcr.io/esphome/esphome:2026.11.0b1
        with:
          args: ${{ matrix.device.subs }} compile devices/${{ matrix.device.file }}.yaml

      - name: Stage Factory, OTA Binaries & Manifest
        shell: bash
        run: |
          VERSION="${{ steps.rel_meta.outputs.version }}"
          mkdir -p dist/firmware dist/manifests
          BUILD_DIR=".esphome/build/${{ matrix.device.file }}/.pioenvs/${{ matrix.device.file }}"
          cp "${BUILD_DIR}/firmware.factory.bin" "dist/firmware/${{ matrix.device.slug }}.factory.bin"
          cp "${BUILD_DIR}/firmware.ota.bin" "dist/firmware/${{ matrix.device.slug }}.ota.bin"
          MD5_SUM=$(md5sum "dist/firmware/${{ matrix.device.slug }}.ota.bin" | awk '{print $1}')
          cat <<EOF > "dist/manifests/${{ matrix.device.slug }}.json"
          {
            "name": "${{ matrix.device.name }}",
            "version": "${VERSION}",
            "home_assistant_domain": "esphome",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "${{ matrix.device.chip }}",
                "ota": {
                  "path": "../firmware/${{ matrix.device.slug }}.ota.bin",
                  "md5": "${MD5_SUM}",
                  "summary": "Latter OS v${VERSION} for ${{ matrix.device.name }}"
                },
                "parts": [
                  {
                    "path": "../firmware/${{ matrix.device.slug }}.factory.bin",
                    "offset": 0
                  }
                ]
              }
            ]
          }
          EOF

      - name: Upload artifact for ${{ matrix.device.slug }}
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.device.slug }}
          path: dist/

  deploy_pages:
    name: Deploy Unified Web Installer to GitHub Pages
    needs: build_device
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all device build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: _site
          merge-multiple: true

      - name: Copy Web Installer UI and stamp release version
        shell: bash
        run: |
          BASE_VER=$(sed -n 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/p' modules/base.yaml | head -n1)
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            VERSION="${BASE_VER}"
          fi
          sed "s/v2\.[0-9]\+\.[0-9]\+/v${VERSION}/g" index.html > _site/index.html

      - name: Fast-forward stable branch on tagged release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        shell: bash
        run: |
          git push origin "HEAD:refs/heads/stable" --force

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4