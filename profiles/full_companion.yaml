# ==============================================================================
# Latter Core Profile: Full Companion Bundle (profiles/full_companion.yaml)
# Universal OS bundle for all Latter smart displays (S3 & P4, Battery & Mains)
# ==============================================================================

external_components:
  - source:
      type: git
      url: https://github.com/slampton/esphome-latter-core
      ref: main
    components: [latter_core]
    refresh: 0s

latter_core:

packages:
  latter_audio_voice: !include ../modules/audio_voice.yaml
  latter_power:       !include ../modules/power_manager.yaml
  latter_display_ui:  !include ../modules/display_ui.yaml
