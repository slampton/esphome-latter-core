# ==============================================================================
# Hardware Abstraction Layer (HAL): Waveshare ESP32-S3-Touch-AMOLED-2.16 ("Mobile Assistant")
# SKU:     33969
# Display: 2.16" 480x480 Square AMOLED (CO5300 over Quad-SPI, RST: GPIO39, CS: GPIO12). LCD_TE unrouted.
# Touch:   CST9217 @ 0x5A (INT: GPIO11, RST: GPIO40) - marketed as "CST9220", driven by the cst9220 platform
# Audio:   ES8311 DAC @ 0x18 (DOUT: GPIO8) + ES7210 ADC @ 0x40 (DIN: GPIO10), PA: GPIO46
# Clocks:  MCLK: GPIO42, BCLK: GPIO9, LRCLK/WS: GPIO45
# PMU:     AXP2101 @ 0x34 (AXP_IRQ NOT routed; DCDC1 = all 3V3, ALDO1 = audio A3V3, other rails unused),
#          PWR key SYS_OUT -> GPIO16 (HIGH while pressed)
# Other:   QMI8658 @ 0x6B (INT1: GPIO17, INT2: GPIO21), PCF85063 RTC @ 0x51 (INT: GPIO13), Key3: GPIO18,
#          SD (CMD 1, CLK 2, D0 3, CS 41)
# Sleep:   automatic light sleep (power_management); wake pins PWR key GPIO16, action button GPIO18,
#          touch INT GPIO11, IMU INT1 GPIO17.
# ==============================================================================

substitutions:
  font_time_size: "77"
  font_chrono_size: "38"
  font_date_size: "27"
  font_btn_bold_size: "26"
  font_small_size: "25"   # >= 2.0 mm at this panel's PPI (device-ui-design.md, accessibility)
  font_micro_size: "17"   # >= 1.3 mm
  font_games_size: "38"
  art_resize: "480x480"
  sendspin_art_resize: "480x480"
  default_start_app: "Home"
  default_clock_face: "Minimal Digital"
  default_art_mode: "Full Screen"
  default_screensaver_style: "Ambient Clock"
  default_album_sort: "Alphabetical"
  default_artist_album_sort: "Oldest on Top"
  default_podcast_sort: "Newest on Top"
  default_power_profile: "Handheld Roaming"
  # Music read-ahead (PSRAM). A handheld rides out Wi-Fi stalls of several seconds (body, metal case,
  # a busy channel): 768 KB, 50% more than before. 1 MB left 303 KB of PSRAM with music, album art and an
  # announcement, too little for a second full-screen image (camera popup, 434 KB).
  sendspin_buffer_size: "786432"
  # micro_wake_word arena + weights in internal RAM (~70% faster inference); boards with internal-RAM headroom only
  mww_internal_ram: "false"
  # Reply and announcement read-ahead (PSRAM): most of a spoken reply, so a stall mid-reply is not heard.
  announcement_buffer_size: "131072"
  # Full-duplex I2S at 48 kHz: ES8311, ES7210 and the speaker share one bus clock at audio_out_rate;
  # latter_mic converts the mic to audio_in_rate (16 kHz) for micro_wake_word and voice_assistant.
  audio_out_rate: "48000"
  audio_out_channels: "1"
  audio_out_bits: "16"
  audio_in_rate: "16000"
  imu_int1_pin: GPIO17  # QMI8658 INT1 (hardware wake-on-motion, modules/hal/imu_qmi8658.yaml)
  # Light-sleep PM profiling (CONFIG_PM_PROFILING): per-lock and per-mode times in [PROF:PM_LOCKS].
  # Bench builds only: set it to "true" in the device config's substitutions.
  pm_profiling: "false"
  # Wake profiling for [PROF:WAKE] (CONFIG_ESP_TIMER_PROFILING + CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS):
  # esp_timer fire counts and CPU time per task. Both cost time on every esp_timer callback and context
  # switch, so they stay off; profiling builds set it to "y" (a Kconfig value: y or n).
  wake_profiling: "n"
  i2s_lrclk_pin: GPIO45
  i2s_bclk_pin: GPIO9
  i2s_mclk_pin: GPIO42
  i2s_din_pin: GPIO10
  i2s_dout_pin: GPIO8

esphome:
  build_flags:
    - '-DLATTER_BOARD_ID=\"waveshare_s3_216\"'
    - "-DLATTER_BLE_MINOR=3"
    - "-DLATTER_SCREEN_W=480"
    - "-DLATTER_SCREEN_H=480"
    - "-DLATTER_ROUND_DISPLAY=0"
    - "-DLATTER_HAS_DISPLAY=1"
    - "-DLATTER_HAS_TOUCH=1"
    - "-DLATTER_HAS_AUDIO=1"
    - "-DLATTER_HAS_IMU=1"
    - "-DLATTER_HAS_BATTERY=1"
    - "-DLATTER_HAS_RTC=1"
    - "-DLATTER_IS_STATIONARY=0"
    - "-DLATTER_IS_WEARABLE=0"
    - "-DLATTER_PANEL_IPS=0"
    - "-DLATTER_PANEL_DCS_SLEEP=1"
    # Waveshare outline drawing: 38.99 x 38.99 mm active area for 480 x 480 = 312.7 ppi (2.17" diagonal)
    - "-DLATTER_PANEL_PPI=313"
    - "-DLATTER_CHIP_P4=0"
    - "-DLATTER_PSRAM_MB=8"
    - "-DLATTER_PWR_KEY_PIN=16"
    - "-DLATTER_PWR_KEY_ACTIVE_HIGH=1"
    - "-DLATTER_PWR_KEY_DEEP_SLEEP_WAKE=1"
    # Light-sleep wake pins (include/hal_power_pm.h): Key3 action button, touch INT, QMI8658 INT1
    - "-DLATTER_ACTION_BTN_PIN=18"
    - "-DLATTER_TOUCH_INT_PIN=11"
    - "-DLATTER_TOUCH_RST_PIN=40"
    - "-DLATTER_IMU_INT1_PIN=17"
    - "-DLATTER_PMU_TS_DISABLE=1"
    - "-DLATTER_PMU_DCDC_KEEP_MASK=0x01"
    - "-DLATTER_PMU_LDO_KEEP_MASK=0x001"
    # Fitted cell (boards/facts power.battery_mah): the charge profile, state of charge and cutoff derive
    # from it (include/hal_battery.h)
    - "-DLATTER_BATTERY_MAH=1000"
    - "-DLATTER_AUDIO_OUT_RATE=48000"
    - "-DLATTER_AUDIO_OUT_CH=1"
    - "-DLATTER_AUDIO_OUT_BITS=16"
    - "-DLATTER_AUDIO_IN_RATE=16000"

esp32:
  flash_size: 16MB
  framework:
    advanced:
      flash_chip: generic

i2c:
  - id: bus_internal
    sda: GPIO15
    scl: GPIO14
    frequency: 400kHz
    scan: false

spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO38
    data_pins:
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7

packages:
  latter_chip: !include ../modules/hal/chip_esp32s3.yaml
  latter_audio_hal: !include ../modules/hal/audio_es8311_es7210_duplex.yaml
  latter_imu: !include ../modules/hal/imu_qmi8658.yaml
  latter_pmu: !include ../modules/hal/pmu_axp2101.yaml

i2s_audio:
  - id: !extend i2s_shared_bus
    i2s_lrclk_pin:
      number: ${i2s_lrclk_pin}
      ignore_strapping_warning: true

switch:
  - platform: gpio
    name: "Speaker Enable"
    id: speaker_enable
    internal: true
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO18
      mode: INPUT_PULLUP
      inverted: true
    name: "Boot Button"
    id: boot_button
    entity_category: diagnostic

  # PWR key state (AXP PWRON -> BSS138 -> SYS_OUT -> GPIO16, HIGH while pressed). Press timing lives
  # in modules/hal/pmu_axp2101.yaml. GPIO16 is an RTC GPIO, so it also arms the ext0 deep-sleep wake.
  - platform: gpio
    id: pwr_key
    name: "Power Key"
    internal: true
    pin:
      number: GPIO16
      mode: INPUT
    filters:
      - delayed_on_off: 20ms

display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    spi_id: display_qspi
    bus_mode: quad
    data_rate: 80MHz
    reset_pin: GPIO39
    cs_pin: GPIO12
    dimensions:
      height: 480
      width: 480
      offset_width: 0
      offset_height: 0
    brightness: 200
    update_interval: 1s

touchscreen:
  - platform: cst9220
    id: touch_screen
    setup_priority: -100
    display: disp1
    i2c_id: bus_internal
    address: 0x5A
    interrupt_pin:
      number: GPIO11
      mode: INPUT_PULLUP
    reset_pin: GPIO40
    touch_timeout: 120ms

script:
  - id: hal_release_deep_sleep_holds
    mode: restart
    then:
      - lambda: |-
          gpio_deep_sleep_hold_dis();
          gpio_hold_dis(GPIO_NUM_39);
          gpio_hold_dis(GPIO_NUM_40);
          gpio_hold_dis(GPIO_NUM_46);
          gpio_hold_dis(GPIO_NUM_12);

  - id: hal_enter_hardware_hibernate
    mode: restart
    then:
      - lambda: |-
          latter_ui::hal_power_down_audio_and_imu_for_hibernate(id(bus_internal), true, true);

          gpio_set_direction(GPIO_NUM_46, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_46, 0);
          gpio_hold_en(GPIO_NUM_46);

          gpio_set_direction(GPIO_NUM_12, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_12, 1);
          gpio_hold_en(GPIO_NUM_12);

          gpio_set_direction(GPIO_NUM_39, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_39, 0);
          gpio_hold_en(GPIO_NUM_39);

          gpio_set_direction(GPIO_NUM_40, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_40, 0);
          gpio_hold_en(GPIO_NUM_40);

          gpio_deep_sleep_hold_en();
          global_preferences->sync();

          const auto &rs = latter_ui::runtime_state();
          const auto &ap = latter_ui::persisted_prefs().alarms;
          int32_t sec_to_alarm = latter_ui::seconds_until_next_armed_alarm(
              id(ha_time).now().is_valid() ? id(ha_time).now() : id(sntp_time).now(),
              rs.alarms.snooze_until,
              ap[0].hour, ap[0].minute, ap[0].enabled, ap[0].recurrence,
              ap[1].hour, ap[1].minute, ap[1].enabled, ap[1].recurrence,
              ap[2].hour, ap[2].minute, ap[2].enabled, ap[2].recurrence);
          latter_ui::enter_axp2101_hibernate_or_alarm_sleep(id(bus_internal), sec_to_alarm);
