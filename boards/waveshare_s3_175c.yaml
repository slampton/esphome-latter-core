# ==============================================================================
# Hardware Abstraction Layer (HAL): Waveshare ESP32-S3-Touch-AMOLED-1.75C ("Pocket Assistant")
# Display: 1.75" 466x466 Round AMOLED (CO5300 over Quad-SPI, CLK: GPIO38, CS: GPIO12, D0-D3: GPIO4-7,
#          RST: GPIO1, column offset 6). LCD_TE routed to GPIO13 (unused).
# Touch:   CST9217 @ 0x5A (INT: GPIO11, RST: GPIO2) - first-party platform: latter_core (protocol: cst9217)
# Audio:   ES8311 DAC @ 0x18 (DOUT: GPIO8) + ES7210 ADC @ 0x40 (DIN: GPIO10), PA: GPIO46
#          ES7210 MIC3 = AEC loopback of ES8311 output (TDM only; hardware reference, unused until
#          on-device echo cancellation)
# Clocks:  MCLK: GPIO16, BCLK: GPIO9, LRCLK/WS: GPIO45
# PMU/IMU: AXP2101 @ 0x34 (AXP_IRQ NOT routed; DCDC1 = all 3V3, ALDO1 = audio A3V3, other rails unused),
#          PWR key SYS_OUT -> GPIO3 (HIGH while pressed), QMI8658 @ 0x6B (INT1: GPIO21). No RTC, no SD.
# Sleep:   automatic light sleep (power_management); wake pins PWR key GPIO3, action button GPIO0,
#          touch INT GPIO11, IMU INT1 GPIO21.
# ==============================================================================

substitutions:
  font_time_size: "76"
  font_chrono_size: "38"
  font_date_size: "28"
  font_btn_bold_size: "25"
  font_small_size: "21"
  font_micro_size: "14"
  font_games_size: "38"
  art_resize: "466x466"
  # 4x fewer pixels decoded & 326 KB less PSRAM per album art buffer (exact 2x upscale in draw_album_art)
  sendspin_art_resize: "233x233"
  # Portable battery device: disable Native API watchdog reboot so off-site / HA-restart outages never reboot-loop.
  api_reboot_timeout: "0s"
  # Music read-ahead (PSRAM). 256 KB (~2.7 s of 48 kHz mono PCM / >5 s FLAC) rides out handheld
  # Wi-Fi stalls while keeping comfortable PSRAM headroom alongside XIP-from-PSRAM, album art,
  # TTS announcements, and full-screen camera/doorbell snapshots (434 KB).
  sendspin_buffer_size: "262144"
  # micro_wake_word arena + weights in internal RAM (~70% faster inference); boards with internal-RAM headroom only
  mww_internal_ram: "false"
  # Reply and announcement read-ahead (PSRAM): most of a spoken reply, so a stall mid-reply is not heard.
  announcement_buffer_size: "131072"
  # Full-duplex I2S at 48 kHz: ES8311, ES7210 and the speaker share one bus clock at audio_out_rate;
  # latter_mic converts the mic to audio_in_rate (16 kHz) for micro_wake_word and voice_assistant.
  audio_out_rate: "48000"
  audio_out_channels: "1"
  audio_out_bits: "16"
  audio_in_rate: "16000"
  imu_int1_pin: GPIO21  # QMI8658 INT1 (hardware wake-on-motion, modules/hal/imu_qmi8658.yaml)
  # Light-sleep PM profiling (CONFIG_PM_PROFILING): per-lock and per-mode times in [PROF:PM_LOCKS].
  # Bench builds only: set it to "true" in the device config's substitutions.
  pm_profiling: "false"
  # Wake profiling for [PROF:WAKE] (CONFIG_ESP_TIMER_PROFILING + CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS):
  # esp_timer fire counts and CPU time per task. Both cost time on every esp_timer callback and context
  # switch, so they stay off; profiling builds set it to "y" (a Kconfig value: y or n).
  wake_profiling: "n"
  i2s_lrclk_pin: GPIO45
  i2s_bclk_pin: GPIO9
  i2s_mclk_pin: GPIO16
  i2s_din_pin: GPIO10
  i2s_dout_pin: GPIO8

latter_core:
  board_id: waveshare_s3_175c
  ble_minor: 1
  gui: universal
  chip: esp32s3
  psram_mb: 8
  display:
    width: 466
    height: 466
    ppi: 266
    round: true
    ips: false
    dcs_sleep: true
    corner_r: 233
    view_scale: 1.00
    touch_int_pin: 11
    touch_rst_pin: 2
  power:
    # Fitted cell (boards/facts power.battery_mah): the charge profile, state of charge and cutoff derive
    # from it (include/hal_battery.h)
    battery_mah: 500
    pwr_key_pin: 3
    pwr_key_active_high: true
    pwr_key_deep_sleep_wake: true
    # Light-sleep wake pins (include/hal_sleep_pm.h): side action button, touch INT, QMI8658 INT1
    action_btn_pin: 0
    imu_int1_pin: 21
    pmu_ts_disable: true
    pmu_dcdc_keep_mask: 0x01
    pmu_ldo_keep_mask: 0x001
  audio:
    out_rate: 48000
    out_channels: 1
    out_bits: 16
    in_rate: 16000
  capabilities:
    display: true
    touch: true
    audio: true
    imu: true
    battery: true
    rtc: false
    stationary: false
    wearable: false
  drivers:
    pmu_axp2101: true
    rtc_pcf85063: false
    imu_qmi8658: true
    codec_es8311: true

esp32:
  flash_size: 32MB  # esptool flash_id on hardware (2026-11-09): GigaDevice c8/4019 (GD25Q256), 32 MB; the schematic's 16 MB part is not what ships
  framework:
    advanced:
      flash_chip: gd

i2c:
  - id: bus_internal
    sda: GPIO15
    scl: GPIO14
    frequency: 400kHz
    scan: false

spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO38
    data_pins:
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7

packages:
  latter_chip: !include ../modules/hal/chip_esp32s3.yaml
  latter_audio_hal: !include ../modules/hal/audio_es8311_es7210_duplex.yaml
  latter_imu: !include ../modules/hal/imu_qmi8658.yaml
  latter_pmu: !include ../modules/hal/pmu_axp2101.yaml
  latter_battery_service: !include ../modules/battery_service.yaml

i2s_audio:
  - id: !extend i2s_shared_bus
    i2s_lrclk_pin:
      number: ${i2s_lrclk_pin}
      ignore_strapping_warning: true


# On-Board Speaker Power Amplifier Enable (PA_EN: GPIO46)
switch:
  - platform: gpio
    name: "Speaker Enable"
    id: speaker_enable
    internal: true
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF


# Side action button (GPIO0): wake, dismiss, game button, start/stop a voice turn
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    name: "Boot Button"
    id: boot_button
    internal: true

  # PWR key state (AXP PWRON -> BSS138 -> SYS_OUT -> GPIO3, HIGH while pressed). Press timing lives
  # in modules/hal/pmu_axp2101.yaml. GPIO3 is an RTC GPIO, so it also arms the ext0 deep-sleep wake.
  - platform: gpio
    id: pwr_key
    name: "Power Key"
    internal: true
    pin:
      number: GPIO3
      mode: INPUT
      ignore_strapping_warning: true
    filters:
      - delayed_on_off: 20ms


# 1.75" 466x466 Circular AMOLED Display (CO5300 over 80MHz Quad-SPI)
display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    spi_id: display_qspi
    bus_mode: quad
    data_rate: 80MHz
    reset_pin: GPIO1
    cs_pin: GPIO12
    dimensions:
      height: 466
      width: 466
      offset_width: 6
      offset_height: 0
    brightness: 200
    update_interval: 1s


# Capacitive Touch Controller (CST9217 over I2C bus_internal, IRQ-driven)
touchscreen:
  - platform: latter_core
    protocol: cst9217
    id: touch_screen
    display: disp1
    i2c_id: bus_internal
    address: 0x5A
    interrupt_pin:
      number: GPIO11
      mode: INPUT_PULLUP
    reset_pin: GPIO2
    active_poll_interval: 16ms
    update_interval: never
    transform:
      mirror_x: true
      mirror_y: true


# Board-Level Hardware Abstraction Scripts (pad holds & hibernate)
script:
  - id: hal_release_deep_sleep_holds
    mode: restart
    then:
      - lambda: |-
          gpio_deep_sleep_hold_dis();
          gpio_hold_dis(GPIO_NUM_1);
          gpio_hold_dis(GPIO_NUM_2);
          gpio_hold_dis(GPIO_NUM_46);
          gpio_hold_dis(GPIO_NUM_12);

  - id: hal_enter_hardware_hibernate
    mode: restart
    then:
      - lambda: |-
          latter_core::hal_power_down_audio_and_imu_for_hibernate(id(bus_internal), true, true);

          // Force Speaker Power Amplifier Enable (GPIO46) firmly LOW and hold
          gpio_set_direction(GPIO_NUM_46, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_46, 0);
          gpio_hold_en(GPIO_NUM_46);

          // Force Display CS (GPIO12) firmly HIGH (deselected) and hold
          gpio_set_direction(GPIO_NUM_12, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_12, 1);
          gpio_hold_en(GPIO_NUM_12);

          // Put Display Controller (CO5300) into Hardware Reset (GPIO1 LOW) and hold
          gpio_set_direction(GPIO_NUM_1, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_1, 0);
          gpio_hold_en(GPIO_NUM_1);

          // Put Touch Controller (CST9217) into Hardware Reset (GPIO2 LOW) and hold
          gpio_set_direction(GPIO_NUM_2, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_2, 0);
          gpio_hold_en(GPIO_NUM_2);

          gpio_deep_sleep_hold_en();
          global_preferences->sync();

          const auto &rs = latter_core::runtime_state();
          const auto &ap = latter_core::persisted_prefs().alarms;
          int32_t sec_to_alarm = latter_core::seconds_until_next_armed_alarm(
              id(ha_time).now().is_valid() ? id(ha_time).now() : id(sntp_time).now(),
              rs.alarms.snooze_until,
              ap[0].hour, ap[0].minute, ap[0].enabled, ap[0].recurrence,
              ap[1].hour, ap[1].minute, ap[1].enabled, ap[1].recurrence,
              ap[2].hour, ap[2].minute, ap[2].enabled, ap[2].recurrence);
          latter_core::enter_axp2101_hibernate_or_alarm_sleep(id(bus_internal), sec_to_alarm);
