# ==============================================================================
# Hardware Abstraction Layer (HAL): Waveshare ESP32-S3-Touch-AMOLED-1.75C ("Pocket Assistant")
# Display: 1.75" 466x466 Round AMOLED (CO5300 over Quad-SPI, CLK: GPIO38, CS: GPIO12, D0-D3: GPIO4-7,
#          RST: GPIO1, column offset 6). LCD_TE routed to GPIO13 (unused).
# Touch:   CST9217 @ 0x5A (INT: GPIO11, RST: GPIO2) - driven by the cst9220 platform
# Audio:   ES8311 DAC @ 0x18 (DOUT: GPIO8) + ES7210 ADC @ 0x40 (DIN: GPIO10), PA: GPIO46
#          ES7210 MIC3 = AEC loopback of ES8311 output (TDM only)
# Clocks:  MCLK: GPIO16, BCLK: GPIO9, LRCLK/WS: GPIO45
# PMU/IMU: AXP2101 @ 0x34 (AXP_IRQ NOT routed; DCDC1 = all 3V3, ALDO1 = audio A3V3, other rails unused),
#          PWR key SYS_OUT -> GPIO3 (HIGH while pressed), QMI8658 @ 0x6B (INT1: GPIO21). No RTC, no SD.
# ==============================================================================

substitutions:
  screen_w: "466"
  screen_h: "466"
  font_time_size: "77"
  font_chrono_size: "38"
  font_date_size: "27"
  font_btn_bold_size: "26"
  font_small_size: "21"
  font_micro_size: "14"
  font_games_size: "38"
  art_resize: "466x466"
  sendspin_art_resize: "466x466"
  art_shape: "circle"
  default_start_app: "Home"
  default_clock_face: "Modern Roman (Analog)"
  default_art_mode: "Full Screen"
  default_screensaver_style: "Aurora Borealis"
  default_album_sort: "Alphabetical"
  default_artist_album_sort: "Oldest on Top"
  default_podcast_sort: "Newest on Top"
  default_power_profile: "Portable Carry"
  sendspin_buffer_size: "196608"
  announcement_buffer_size: "65536"
  audio_out_rate: "16000"
  audio_out_channels: "1"
  audio_out_bits: "16"
  audio_in_rate: "16000"

esphome:
  build_flags:
    - '-DLATTER_BOARD_ID=\"waveshare_s3_175c\"'
    - "-DLATTER_BLE_MINOR=1"
    - "-DLATTER_SCREEN_W=466"
    - "-DLATTER_SCREEN_H=466"
    - "-DLATTER_ROUND_DISPLAY=1"
    - "-DLATTER_HAS_DISPLAY=1"
    - "-DLATTER_HAS_TOUCH=1"
    - "-DLATTER_HAS_AUDIO=1"
    - "-DLATTER_HAS_IMU=1"
    - "-DLATTER_HAS_BATTERY=1"
    - "-DLATTER_IS_STATIONARY=0"
    - "-DLATTER_IS_WEARABLE=0"
    - "-DLATTER_PANEL_IPS=0"
    - "-DLATTER_PANEL_PPI=266"
    - "-DLATTER_CHIP_P4=0"
    - "-DLATTER_PSRAM_MB=8"
    - "-DLATTER_PWR_KEY_PIN=3"
    - "-DLATTER_PWR_KEY_ACTIVE_HIGH=1"
    - "-DLATTER_PWR_KEY_DEEP_SLEEP_WAKE=1"
    - "-DLATTER_PMU_TS_DISABLE=1"
    - "-DLATTER_PMU_DCDC_KEEP_MASK=0x01"
    - "-DLATTER_PMU_LDO_KEEP_MASK=0x001"
    # Fitted cell: 500mAh -> charge current = min(0.8C, 500mA), floored to the AXP2101 step
    - "-DLATTER_PMU_CHARGE_MA=400"
    - "-DLATTER_AUDIO_OUT_RATE=16000"
    - "-DLATTER_AUDIO_OUT_CH=1"
    - "-DLATTER_AUDIO_OUT_BITS=16"
    - "-DLATTER_AUDIO_IN_RATE=16000"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 32MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # ESP-IDF 5.5 replacement for CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY
      CONFIG_COMPILER_OPTIMIZATION_PERF: "y"
      CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM: "y"
      # ESPHome 2026.10 / ESP-IDF 5.5.6 PSRAM bus contention guardrails
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "64"
      CONFIG_LWIP_TCP_WND_DEFAULT: "65535"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "64"
      # Maximize ESP32-S3 L1 Data & Instruction Caches (64KB D-Cache / 64B line, 32KB I-Cache)
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      # Execute instructions and read-only data from 80MHz Octal PSRAM
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      # Offload Wi-Fi/LwIP, BLE, .bss, mbedTLS, and >2KB heap allocations to 8MB Octal PSRAM
      # so internal DMA SRAM stays unfragmented for QSPI 466x466 display + I2S audio + micro_wake_word
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "256"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
    advanced:
      enable_idf_experimental_features: true
      nvs_cache_in_psram: true
      flash_chip: gd


psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false


i2c:
  - id: bus_internal
    sda: GPIO15
    scl: GPIO14
    frequency: 400kHz
    scan: false


spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO38
    data_pins:
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7


# Dual Master I2S Buses (Multiplexed via ESP32-S3 GPIO Matrix to Shared Clock Pins)
i2s_audio:
  - id: i2s_input_bus
    i2s_lrclk_pin:
      number: GPIO45
      allow_other_uses: true
      ignore_strapping_warning: true
    i2s_bclk_pin:
      number: GPIO9
      allow_other_uses: true
    i2s_mclk_pin:
      number: GPIO16
      allow_other_uses: true

  - id: i2s_output_bus
    i2s_lrclk_pin:
      number: GPIO45
      allow_other_uses: true
      ignore_strapping_warning: true
    i2s_bclk_pin:
      number: GPIO9
      allow_other_uses: true
    i2s_mclk_pin:
      number: GPIO16
      allow_other_uses: true


# Everest ES7210 Microphone ADC (I2C 0x40, DIN: GPIO10)
audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_internal
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: ${audio_in_rate}
    mic_gain: 24dB


microphone:
  - platform: i2s_audio
    id: latter_mic
    adc_type: external
    i2s_audio_id: i2s_input_bus
    i2s_din_pin: GPIO10
    sample_rate: ${audio_in_rate}
    bits_per_sample: 16bit
    channel: left
    pdm: false


# Everest ES8311 Speaker DAC (I2C 0x18, DOUT: GPIO8)
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_internal
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: ${audio_out_rate}
    use_mclk: true


speaker:
  - platform: i2s_audio
    id: physical_speaker
    i2s_audio_id: i2s_output_bus
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: ${audio_out_rate}
    bits_per_sample: 16bit
    channel: left
    buffer_duration: 250ms
    timeout: 500ms


packages:
  latter_imu: !include ../modules/imu_qmi8658.yaml
  latter_pmu: !include ../modules/pmu_axp2101.yaml


# On-Board Speaker Power Amplifier Enable (PA_EN: GPIO46)
switch:
  - platform: gpio
    name: "Speaker Enable"
    id: speaker_enable
    entity_category: config
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF


# Physical Side Push-to-Talk / Action Button (GPIO0)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    name: "Boot Button"
    id: boot_button
    entity_category: diagnostic

  # PWR key state (AXP PWRON -> BSS138 -> SYS_OUT -> GPIO3, HIGH while pressed). Press timing lives
  # in modules/pmu_axp2101.yaml. GPIO3 is an RTC GPIO, so it also arms the ext0 deep-sleep wake.
  - platform: gpio
    id: pwr_key
    name: "Power Key"
    internal: true
    pin:
      number: GPIO3
      mode: INPUT
      ignore_strapping_warning: true
    filters:
      - delayed_on_off: 20ms


# 1.75" 466x466 Circular AMOLED Display (CO5300 over 80MHz Quad-SPI)
display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    spi_id: display_qspi
    bus_mode: quad
    data_rate: 80MHz
    reset_pin: GPIO1
    cs_pin: GPIO12
    dimensions:
      height: 466
      width: 466
      offset_width: 6
      offset_height: 0
    brightness: 200
    update_interval: 1s


# Capacitive Touch Controller (CST9220 @ 30Hz over I2C bus_internal)
touchscreen:
  - platform: cst9220
    id: touch_screen
    display: disp1
    i2c_id: bus_internal
    address: 0x5A
    interrupt_pin:
      number: GPIO11
      mode: INPUT_PULLUP
    reset_pin: GPIO2
    touch_timeout: 120ms
    transform:
      mirror_x: true
      mirror_y: true


# Board-Level Hardware Abstraction Scripts (I2S Clock Mux, Pad Holds, PMU IRQ & Hibernate)
script:
  - id: hal_route_i2s_to_spk
    mode: restart
    then:
      - lambda: |-
          latter_ui::hal_connect_s3_i2s_clocks_to_spk(9, 45, 16);

  - id: hal_route_i2s_to_mic
    mode: restart
    then:
      - lambda: |-
          latter_ui::hal_connect_s3_i2s_clocks_to_mic(9, 45, 16);

  - id: hal_release_deep_sleep_holds
    mode: restart
    then:
      - lambda: |-
          gpio_deep_sleep_hold_dis();
          gpio_hold_dis(GPIO_NUM_1);
          gpio_hold_dis(GPIO_NUM_2);
          gpio_hold_dis(GPIO_NUM_46);
          gpio_hold_dis(GPIO_NUM_12);
          id(es8311_dac).set_volume(0.90f);
          id(es8311_dac).set_mute_on();

  - id: hal_set_dac_mute
    mode: restart
    parameters:
      muted: bool
    then:
      - lambda: |-
          if (muted) {
            id(es8311_dac).set_mute_on();
          } else {
            id(es8311_dac).set_mute_off();
          }

  - id: hal_enter_hardware_hibernate
    mode: restart
    then:
      - lambda: |-
          latter_ui::hal_power_down_audio_and_imu_for_hibernate(id(bus_internal), true, true);

          // Force Speaker Power Amplifier Enable (GPIO46) firmly LOW and hold
          gpio_set_direction(GPIO_NUM_46, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_46, 0);
          gpio_hold_en(GPIO_NUM_46);

          // Force Display CS (GPIO12) firmly HIGH (deselected) and hold
          gpio_set_direction(GPIO_NUM_12, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_12, 1);
          gpio_hold_en(GPIO_NUM_12);

          // Put Display Controller (CO5300) into Hardware Reset (GPIO1 LOW) and hold
          gpio_set_direction(GPIO_NUM_1, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_1, 0);
          gpio_hold_en(GPIO_NUM_1);

          // Put Touch Controller (CST9220) into Hardware Reset (GPIO2 LOW) and hold
          gpio_set_direction(GPIO_NUM_2, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_2, 0);
          gpio_hold_en(GPIO_NUM_2);

          gpio_deep_sleep_hold_en();
          global_preferences->sync();

          int32_t sec_to_alarm = latter_ui::seconds_until_next_armed_alarm(
              id(ha_time).now().is_valid() ? id(ha_time).now() : id(sntp_time).now(),
              id(alarm_snooze_until),
              id(alarm1_hour), id(alarm1_minute), id(alarm1_enabled), id(alarm1_recurrence),
              id(alarm2_hour), id(alarm2_minute), id(alarm2_enabled), id(alarm2_recurrence),
              id(alarm3_hour), id(alarm3_minute), id(alarm3_enabled), id(alarm3_recurrence));
          latter_ui::enter_axp2101_hibernate_or_alarm_sleep(id(bus_internal), sec_to_alarm);

  - id: hal_set_audio_codecs_standby
    mode: restart
    parameters:
      standby: bool
    then:
      - lambda: |-
          latter_ui::hal_set_es8311_es7210_standby(id(bus_internal), standby, true);