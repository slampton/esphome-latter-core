# ==============================================================================
# Hardware Abstraction Layer (HAL): Waveshare ESP32-S3-Touch-AMOLED-2.06 ("Wrist Assist")
# Display: 2.06" 410x502 Rectangular AMOLED (CO5300 over Quad-SPI, CLK: GPIO11, CS: GPIO12, RST: GPIO8,
#          column offset 22). LCD_TE routed to GPIO13 (unused).
# Touch:   FT3168 @ 0x38 (INT: GPIO38, RST: GPIO9)
# Audio:   ES8311 DAC @ 0x18 (DOUT: GPIO40) + ES7210 ADC @ 0x40 (DIN: GPIO42), PA: GPIO46
#          ES7210 MIC3 = AEC loopback of ES8311 output (TDM only; hardware reference, unused until
#          on-device echo cancellation)
# Clocks:  MCLK: GPIO16, BCLK: GPIO41, LRCLK/WS: GPIO45
# PMU:     AXP2101 @ 0x34 (AXP_IRQ NOT routed). DCDC1 = all 3V3, ALDO1 = audio A3V3,
#          ALDO2 = panel DSI_PWR_EN (medium confidence; kept ON), ALDO3 = vibration motor supply.
#          PWR key SYS_OUT -> GPIO10 (HIGH while pressed).
# Other:   QMI8658 @ 0x6B (INT1: GPIO21), PCF85063 RTC @ 0x51 (INT: GPIO39), vibration motor GPIO18
#          (MMBT3904, ALDO3), SD (CMD 1, CLK 2, D0 3, CS 17). Recommended cell: 400mAh.
# Sleep:   automatic light sleep (power_management); wake pins PWR key GPIO10, action button GPIO0,
#          touch INT GPIO38, IMU INT1 GPIO21; touch reset GPIO9 kept driven in sleep.
# ==============================================================================

substitutions:
  font_time_size: "77"
  font_chrono_size: "38"
  font_date_size: "27"
  font_btn_bold_size: "26"
  font_small_size: "25"   # >= 2.0 mm at this panel's PPI (device-ui-design.md, accessibility)
  font_micro_size: "17"   # >= 1.3 mm
  font_games_size: "38"
  art_resize: "410x502"
  sendspin_art_resize: "480x480"
  default_start_app: "Home"
  default_clock_face: "Minimal Digital"
  default_art_mode: "Full Screen"
  default_screensaver_style: "Ambient Clock"
  default_album_sort: "Alphabetical"
  default_artist_album_sort: "Oldest on Top"
  default_podcast_sort: "Newest on Top"
  default_power_profile: "Wearable Watch"
  # Music read-ahead (PSRAM). A handheld rides out Wi-Fi stalls of several seconds (body, metal case,
  # a busy channel): 768 KB, 50% more than before. 1 MB left 303 KB of PSRAM with music, album art and an
  # announcement, too little for a second full-screen image (camera popup, 434 KB).
  sendspin_buffer_size: "786432"
  # micro_wake_word arena + weights in internal RAM (~70% faster inference); boards with internal-RAM headroom only
  mww_internal_ram: "false"
  # Reply and announcement read-ahead (PSRAM): most of a spoken reply, so a stall mid-reply is not heard.
  announcement_buffer_size: "131072"
  # Full-duplex I2S at 48 kHz: ES8311, ES7210 and the speaker share one bus clock at audio_out_rate;
  # latter_mic converts the mic to audio_in_rate (16 kHz) for micro_wake_word and voice_assistant.
  audio_out_rate: "48000"
  audio_out_channels: "1"
  audio_out_bits: "16"
  audio_in_rate: "16000"
  imu_int1_pin: GPIO21  # QMI8658 INT1 (hardware wake-on-motion, modules/hal/imu_qmi8658.yaml)
  # Light-sleep PM profiling (CONFIG_PM_PROFILING): per-lock and per-mode times in [PROF:PM_LOCKS].
  # Bench builds only: set it to "true" in the device config's substitutions.
  pm_profiling: "false"
  # Wake profiling for [PROF:WAKE] (CONFIG_ESP_TIMER_PROFILING + CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS):
  # esp_timer fire counts and CPU time per task. Both cost time on every esp_timer callback and context
  # switch, so they stay off; profiling builds set it to "y" (a Kconfig value: y or n).
  wake_profiling: "n"
  i2s_lrclk_pin: GPIO45
  i2s_bclk_pin: GPIO41
  i2s_mclk_pin: GPIO16
  i2s_din_pin: GPIO42
  i2s_dout_pin: GPIO40

esphome:
  build_flags:
    - '-DLATTER_BOARD_ID=\"waveshare_s3_206\"'
    - "-DLATTER_BLE_MINOR=2"
    - "-DLATTER_SCREEN_W=410"
    - "-DLATTER_SCREEN_H=502"
    - "-DLATTER_ROUND_DISPLAY=0"
    - "-DLATTER_HAS_DISPLAY=1"
    - "-DLATTER_HAS_TOUCH=1"
    - "-DLATTER_HAS_AUDIO=1"
    - "-DLATTER_HAS_IMU=1"
    - "-DLATTER_HAS_BATTERY=1"
    - "-DLATTER_IS_STATIONARY=0"
    - "-DLATTER_IS_WEARABLE=1"
    - "-DLATTER_PANEL_IPS=0"
    - "-DLATTER_PANEL_DCS_SLEEP=1"
    - "-DLATTER_PANEL_PPI=315"
    - "-DLATTER_CHIP_P4=0"
    - "-DLATTER_PSRAM_MB=8"
    - "-DLATTER_PWR_KEY_PIN=10"
    - "-DLATTER_PWR_KEY_ACTIVE_HIGH=1"
    - "-DLATTER_PWR_KEY_DEEP_SLEEP_WAKE=1"
    # Light-sleep wake pins (include/hal_power_pm.h): side action button, touch INT, QMI8658 INT1
    - "-DLATTER_ACTION_BTN_PIN=0"
    - "-DLATTER_TOUCH_INT_PIN=38"
    - "-DLATTER_IMU_INT1_PIN=21"
    # Touch reset driven with raw gpio_set_level (ft5x06 has no reset_pin): kept driven in light sleep
    - "-DLATTER_TOUCH_RST_PIN=9"
    - "-DLATTER_PMU_TS_DISABLE=1"
    - "-DLATTER_PMU_DCDC_KEEP_MASK=0x01"
    - "-DLATTER_PMU_LDO_KEEP_MASK=0x003"
    # Fitted cell (boards/facts power.battery_mah): the charge profile, state of charge and cutoff derive
    # from it (include/hal_battery.h)
    - "-DLATTER_BATTERY_MAH=400"
    - "-DLATTER_AUDIO_OUT_RATE=48000"
    - "-DLATTER_AUDIO_OUT_CH=1"
    - "-DLATTER_AUDIO_OUT_BITS=16"
    - "-DLATTER_AUDIO_IN_RATE=16000"

esp32:
  flash_size: 32MB
  framework:
    advanced:
      flash_chip: gd

i2c:
  - id: bus_internal
    sda: GPIO15
    scl: GPIO14
    frequency: 400kHz
    scan: false

spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO11
    data_pins:
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7

packages:
  latter_chip: !include ../modules/hal/chip_esp32s3.yaml
  latter_audio_hal: !include ../modules/hal/audio_es8311_es7210_duplex.yaml
  latter_imu: !include ../modules/hal/imu_qmi8658.yaml
  latter_pmu: !include ../modules/hal/pmu_axp2101.yaml

i2s_audio:
  - id: !extend i2s_shared_bus
    i2s_lrclk_pin:
      number: ${i2s_lrclk_pin}
      ignore_strapping_warning: true

sensor:
  - id: !extend accel_x
    filters:
      - multiply: -1.0
  - id: !extend imu_roll
    filters:
      - multiply: -1.0

switch:
  - platform: gpio
    name: "Speaker Enable"
    id: speaker_enable
    entity_category: config
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    name: "Boot Button"
    id: boot_button
    entity_category: diagnostic

  # PWR key state (AXP PWRON -> BSS138 -> SYS_OUT -> GPIO10, HIGH while pressed). Press timing lives
  # in modules/hal/pmu_axp2101.yaml. GPIO10 is an RTC GPIO, so it also arms the ext0 deep-sleep wake.
  - platform: gpio
    id: pwr_key
    name: "Power Key"
    internal: true
    pin:
      number: GPIO10
      mode: INPUT
    filters:
      - delayed_on_off: 20ms

display:
  - platform: mipi_spi
    id: disp1
    model: CUSTOM
    spi_id: display_qspi
    bus_mode: quad
    data_rate: 80MHz
    color_order: RGB
    reset_pin: GPIO8
    cs_pin: GPIO12
    draw_rounding: 2
    dimensions:
      width: 410
      height: 502
      offset_width: 22
      offset_height: 0
    init_sequence:
      - [0x11]
      - delay 120ms
      - [0xFE, 0x00]
      - [0xC4, 0x80]
      - [0x36, 0x00]
      - [0x3A, 0x55]
      - [0x35, 0x00]
      - [0x53, 0x20]
      - [0x51, 0xC8]
      - [0x63, 0xFF]
      - [0x29]
    brightness: 200
    update_interval: 1s

touchscreen:
  - platform: ft5x06
    id: touch_screen
    display: disp1
    i2c_id: bus_internal
    address: 0x38
    interrupt_pin:
      number: GPIO38
      mode: INPUT_PULLUP
    touch_timeout: 120ms

script:
  - id: hal_release_deep_sleep_holds
    mode: restart
    then:
      - lambda: |-
          gpio_deep_sleep_hold_dis();
          gpio_hold_dis(GPIO_NUM_8);
          gpio_hold_dis(GPIO_NUM_9);
          gpio_hold_dis(GPIO_NUM_46);
          gpio_hold_dis(GPIO_NUM_12);

          gpio_set_direction(GPIO_NUM_9, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_9, 0);
          esp_rom_delay_us(10000);
          gpio_set_level(GPIO_NUM_9, 1);
          esp_rom_delay_us(50000);
          id(es8311_dac).set_volume(0.90f);
          id(es8311_dac).set_mute_on();

  - id: hal_enter_hardware_hibernate
    mode: restart
    then:
      - lambda: |-
          latter_ui::hal_power_down_audio_and_imu_for_hibernate(id(bus_internal), true, true);

          gpio_set_direction(GPIO_NUM_46, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_46, 0);
          gpio_hold_en(GPIO_NUM_46);

          gpio_set_direction(GPIO_NUM_12, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_12, 1);
          gpio_hold_en(GPIO_NUM_12);

          gpio_set_direction(GPIO_NUM_8, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_8, 0);
          gpio_hold_en(GPIO_NUM_8);

          gpio_set_direction(GPIO_NUM_9, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_9, 0);
          gpio_hold_en(GPIO_NUM_9);

          gpio_deep_sleep_hold_en();
          global_preferences->sync();

          const auto &rs = latter_ui::runtime_state();
          const auto &ap = latter_ui::persisted_prefs().alarms;
          int32_t sec_to_alarm = latter_ui::seconds_until_next_armed_alarm(
              id(ha_time).now().is_valid() ? id(ha_time).now() : id(sntp_time).now(),
              rs.alarms.snooze_until,
              ap[0].hour, ap[0].minute, ap[0].enabled, ap[0].recurrence,
              ap[1].hour, ap[1].minute, ap[1].enabled, ap[1].recurrence,
              ap[2].hour, ap[2].minute, ap[2].enabled, ap[2].recurrence);
          latter_ui::enter_axp2101_hibernate_or_alarm_sleep(id(bus_internal), sec_to_alarm);
