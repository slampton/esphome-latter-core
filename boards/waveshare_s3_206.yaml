# ==============================================================================
# Hardware Abstraction Layer (HAL): Waveshare ESP32-S3-Touch-AMOLED-2.06 ("Wrist Assist")
# Display: 2.06" 410x502 Rectangular AMOLED (CO5300 over Quad-SPI, CLK: GPIO11, CS: GPIO12, RST: GPIO8,
#          column offset 22). LCD_TE routed to GPIO13 (unused).
# Touch:   FT3168 @ 0x38 (INT: GPIO38, RST: GPIO9)
# Audio:   ES8311 DAC @ 0x18 (DOUT: GPIO40) + ES7210 ADC @ 0x40 (DIN: GPIO42), PA: GPIO46
#          ES7210 MIC3 = AEC loopback of ES8311 output (TDM only; hardware reference, unused until
#          on-device echo cancellation)
# Clocks:  MCLK: GPIO16, BCLK: GPIO41, LRCLK/WS: GPIO45
# PMU:     AXP2101 @ 0x34 (AXP_IRQ NOT routed). DCDC1 = all 3V3, ALDO1 = audio A3V3,
#          ALDO2 = panel DSI_PWR_EN (medium confidence; kept ON), ALDO3 = vibration motor supply.
#          PWR key SYS_OUT -> GPIO10 (HIGH while pressed).
# Other:   QMI8658 @ 0x6B (INT1: GPIO21), PCF85063 RTC @ 0x51 (INT: GPIO39), vibration motor GPIO18
#          (MMBT3904, ALDO3), SD (CMD 1, CLK 2, D0 3, CS 17). Recommended cell: 400mAh.
# ==============================================================================

substitutions:
  screen_w: "410"
  screen_h: "502"
  font_time_size: "77"
  font_chrono_size: "38"
  font_date_size: "27"
  font_btn_bold_size: "26"
  font_small_size: "21"
  font_micro_size: "14"
  font_games_size: "38"
  art_resize: "410x502"
  sendspin_art_resize: "480x480"
  art_shape: "square"
  default_start_app: "Home"
  default_clock_face: "Minimal Digital"
  default_art_mode: "Full Screen"
  default_screensaver_style: "Ambient Clock"
  default_album_sort: "Alphabetical"
  default_artist_album_sort: "Oldest on Top"
  default_podcast_sort: "Newest on Top"
  default_power_profile: "Wearable Watch"
  # 48 kHz holds 3x the bytes per second of 16 kHz; the buffer lives in PSRAM
  sendspin_buffer_size: "524288"
  # micro_wake_word arena + weights in internal RAM (~70% faster inference); boards with internal-RAM headroom only
  mww_internal_ram: "false"
  announcement_buffer_size: "65536"
  # Full-duplex I2S at 48 kHz: ES8311, ES7210 and the speaker share one bus clock at audio_out_rate;
  # latter_mic converts the mic to audio_in_rate (16 kHz) for micro_wake_word and voice_assistant.
  audio_out_rate: "48000"
  audio_out_channels: "1"
  audio_out_bits: "16"
  audio_in_rate: "16000"
  imu_int1_pin: GPIO21  # QMI8658 INT1 (hardware wake-on-motion, modules/imu_qmi8658.yaml)

esphome:
  build_flags:
    - '-DLATTER_BOARD_ID=\"waveshare_s3_206\"'
    - "-DLATTER_BLE_MINOR=2"
    - "-DLATTER_SCREEN_W=410"
    - "-DLATTER_SCREEN_H=502"
    - "-DLATTER_ROUND_DISPLAY=0"
    - "-DLATTER_HAS_DISPLAY=1"
    - "-DLATTER_HAS_TOUCH=1"
    - "-DLATTER_HAS_AUDIO=1"
    - "-DLATTER_HAS_IMU=1"
    - "-DLATTER_HAS_BATTERY=1"
    - "-DLATTER_IS_STATIONARY=0"
    - "-DLATTER_IS_WEARABLE=1"
    - "-DLATTER_PANEL_IPS=0"
    - "-DLATTER_PANEL_DCS_SLEEP=1"
    - "-DLATTER_PANEL_PPI=315"
    - "-DLATTER_CHIP_P4=0"
    - "-DLATTER_PSRAM_MB=8"
    - "-DLATTER_PWR_KEY_PIN=10"
    - "-DLATTER_PWR_KEY_ACTIVE_HIGH=1"
    - "-DLATTER_PWR_KEY_DEEP_SLEEP_WAKE=1"
    - "-DLATTER_PMU_TS_DISABLE=1"
    - "-DLATTER_PMU_DCDC_KEEP_MASK=0x01"
    - "-DLATTER_PMU_LDO_KEEP_MASK=0x003"
    # Fitted cell: 400mAh -> charge current = min(0.8C, 500mA), floored to the AXP2101 step
    - "-DLATTER_PMU_CHARGE_MA=300"
    - "-DLATTER_AUDIO_OUT_RATE=48000"
    - "-DLATTER_AUDIO_OUT_CH=1"
    - "-DLATTER_AUDIO_OUT_BITS=16"
    - "-DLATTER_AUDIO_IN_RATE=16000"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 32MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_PERF: "y"
      CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM: "y"
      CONFIG_FREERTOS_USE_TRACE_FACILITY: "y"  # task list for the System: Log Memory Report button
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "64"
      CONFIG_LWIP_TCP_WND_DEFAULT: "65535"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "64"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "256"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
    advanced:
      enable_idf_experimental_features: true
      nvs_cache_in_psram: true
      flash_chip: gd

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

i2c:
  - id: bus_internal
    sda: GPIO15
    scl: GPIO14
    frequency: 400kHz
    scan: false

spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO11
    data_pins:
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7

# One I2S port in full duplex: the ES8311 (DOUT GPIO40) and ES7210 (DIN GPIO42) share BCLK/WS/MCLK, so
# the microphone and speaker run at the same time at audio_out_rate and never hand the bus over.
i2s_audio:
  - id: i2s_shared_bus
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO41
    i2s_mclk_pin: GPIO16
    full_duplex: true

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_internal
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: ${audio_out_rate}
    mic_gain: 24dB

microphone:
  - platform: i2s_audio
    id: latter_mic_i2s
    adc_type: external
    i2s_audio_id: i2s_shared_bus
    i2s_din_pin: GPIO42
    sample_rate: ${audio_out_rate}
    bits_per_sample: 16bit
    channel: left
    pdm: false
  # Converts inside the I2S reader's data callback (no task of its own), so UI load cannot starve it.
  - platform: resampler
    id: latter_mic
    microphone: latter_mic_i2s
    sample_rate: ${audio_in_rate}

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_internal
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: ${audio_out_rate}
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: physical_speaker
    i2s_audio_id: i2s_shared_bus
    i2s_dout_pin: GPIO40
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: ${audio_out_rate}
    bits_per_sample: 16bit
    channel: left
    buffer_duration: 250ms
    # Longer than mp_idle_debounce (3 s), so real idle always powers down in order (DAC mute ->
    # amplifier off -> speaker stop) and the ~0.6 s gap between tracks never stops the I2S clocks
    # under a powered amplifier (a click at every track change).
    timeout: 4s

packages:
  latter_imu: !include ../modules/imu_qmi8658.yaml
  latter_pmu: !include ../modules/pmu_axp2101.yaml

sensor:
  - id: !extend accel_x
    filters:
      - multiply: -1.0
  - id: !extend imu_roll
    filters:
      - multiply: -1.0

switch:
  - platform: gpio
    name: "Speaker Enable"
    id: speaker_enable
    entity_category: config
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    name: "Boot Button"
    id: boot_button
    entity_category: diagnostic

  # PWR key state (AXP PWRON -> BSS138 -> SYS_OUT -> GPIO10, HIGH while pressed). Press timing lives
  # in modules/pmu_axp2101.yaml. GPIO10 is an RTC GPIO, so it also arms the ext0 deep-sleep wake.
  - platform: gpio
    id: pwr_key
    name: "Power Key"
    internal: true
    pin:
      number: GPIO10
      mode: INPUT
    filters:
      - delayed_on_off: 20ms

display:
  - platform: mipi_spi
    id: disp1
    model: CUSTOM
    spi_id: display_qspi
    bus_mode: quad
    data_rate: 80MHz
    color_order: RGB
    reset_pin: GPIO8
    cs_pin: GPIO12
    draw_rounding: 2
    dimensions:
      width: 410
      height: 502
      offset_width: 22
      offset_height: 0
    init_sequence:
      - [0x11]
      - delay 120ms
      - [0xFE, 0x00]
      - [0xC4, 0x80]
      - [0x36, 0x00]
      - [0x3A, 0x55]
      - [0x35, 0x00]
      - [0x53, 0x20]
      - [0x51, 0xC8]
      - [0x63, 0xFF]
      - [0x29]
    brightness: 200
    update_interval: 1s

touchscreen:
  - platform: ft5x06
    id: touch_screen
    display: disp1
    i2c_id: bus_internal
    address: 0x38
    interrupt_pin:
      number: GPIO38
      mode: INPUT_PULLUP
    touch_timeout: 120ms

script:
  - id: hal_route_i2s_to_spk
    mode: restart
    then:
      - lambda: 'return;'

  - id: hal_route_i2s_to_mic
    mode: restart
    then:
      - lambda: 'return;'

  - id: hal_release_deep_sleep_holds
    mode: restart
    then:
      - lambda: |-
          gpio_deep_sleep_hold_dis();
          gpio_hold_dis(GPIO_NUM_8);
          gpio_hold_dis(GPIO_NUM_9);
          gpio_hold_dis(GPIO_NUM_46);
          gpio_hold_dis(GPIO_NUM_12);

          gpio_set_direction(GPIO_NUM_9, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_9, 0);
          esp_rom_delay_us(10000);
          gpio_set_level(GPIO_NUM_9, 1);
          esp_rom_delay_us(50000);
          id(es8311_dac).set_volume(0.90f);
          id(es8311_dac).set_mute_on();

  - id: hal_set_dac_mute
    mode: restart
    parameters:
      muted: bool
    then:
      - lambda: |-
          if (muted) {
            id(es8311_dac).set_mute_on();
          } else {
            id(es8311_dac).set_mute_off();
          }

  - id: hal_enter_hardware_hibernate
    mode: restart
    then:
      - lambda: |-
          latter_ui::hal_power_down_audio_and_imu_for_hibernate(id(bus_internal), true, true);

          gpio_set_direction(GPIO_NUM_46, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_46, 0);
          gpio_hold_en(GPIO_NUM_46);

          gpio_set_direction(GPIO_NUM_12, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_12, 1);
          gpio_hold_en(GPIO_NUM_12);

          gpio_set_direction(GPIO_NUM_8, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_8, 0);
          gpio_hold_en(GPIO_NUM_8);

          gpio_set_direction(GPIO_NUM_9, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_9, 0);
          gpio_hold_en(GPIO_NUM_9);

          gpio_deep_sleep_hold_en();
          global_preferences->sync();

          int32_t sec_to_alarm = latter_ui::seconds_until_next_armed_alarm(
              id(ha_time).now().is_valid() ? id(ha_time).now() : id(sntp_time).now(),
              id(alarm_snooze_until),
              id(alarm1_hour), id(alarm1_minute), id(alarm1_enabled), id(alarm1_recurrence),
              id(alarm2_hour), id(alarm2_minute), id(alarm2_enabled), id(alarm2_recurrence),
              id(alarm3_hour), id(alarm3_minute), id(alarm3_enabled), id(alarm3_recurrence));
          latter_ui::enter_axp2101_hibernate_or_alarm_sleep(id(bus_internal), sec_to_alarm);

  - id: hal_set_audio_codecs_standby
    mode: restart
    parameters:
      standby: bool
    then:
      - lambda: |-
          latter_ui::hal_set_es8311_es7210_standby(id(bus_internal), standby, true);