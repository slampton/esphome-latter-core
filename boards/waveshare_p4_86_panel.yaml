# ==============================================================================
# Hardware Abstraction Layer (HAL): Waveshare ESP32-P4-86-Panel-ETH-2RO / ESP32-P4-WIFI6-Touch-LCD-4B ("Desk Assistant")
# SKU:     31570 (86-Panel-ETH-2RO) & 31416 (WIFI6-Touch-LCD-4B) — shared mainboard, both validated with 1:1 parity
# SoC:     ESP32-P4NRW32 (32MB PSRAM, 32MB GD25Q256 Flash) + ESP32-C6-MINI-1U (U.FL antenna) over SDIO
# Silicon: rev1.3 AND rev3.x units ship. Binaries are NOT cross-compatible; select with p4_silicon below.
# Display: 4.0" 720x720 IPS (ST7703, 2-Lane MIPI-DSI @ 480Mbps/lane, 38MHz DPI, RST: GPIO27)
#          TE: test point only (unrouted). PHY: esp_ldo channel 3 @ 2.5V.
# Backlight: AP3032 boost, analog dimming GPIO26 -> 10k/100nF RC (tau ~1ms) -> 30k -> FB (higher duty = dimmer),
#            BL_EN GPIO33 (100k pull-up to 5V; LOW = boost fully off). PWM 5kHz (vendor BSP).
#            KCL at FB (V_FB=0.2V, R61=5.1k, R38+R42=40k, R62=5.1R) cuts off LED current at ~46.4% on-duty
#            (~53.6% pin-HIGH), so usable window is 48.0..100.0% on-duty (480..1000 permille). 0% switches BL_EN off.
# Touch:   GT911 @ 0x5D/0x14 (I2C SDA: GPIO7, SCL: GPIO8). RST GPIO23 not driven; INT on test point only.
# Audio:   ES8311 DAC @ 0x18 (DOUT: GPIO9) + ES7210 ADC @ 0x40 (DIN: GPIO11), PA (NS4150B): GPIO53
#          ES7210 mics: MIC1=FL, MIC2=FR, MIC3=AEC loopback of ES8311 output (TDM only; unused until on-device echo cancellation), MIC4=NC
# Clocks:  MCLK: GPIO13, BCLK: GPIO12, LRCLK/WS: GPIO10
# C6:      SDIO CLK18/CMD19/D0-D3 14-17, CHIP_PU GPIO54, C6 IO2 <-> GPIO6 (host-wake line)
# SD:      SDMMC slot 0 (D0-D3 39-42, CLK 43, CMD 44), power P-FET gate GPIO45 (Waveshare P4 BSP family:
#          active-low enable, so HIGH = SD off). Left undriven (SD powered; ~0 A with no card).
# RESERVED (bottom board - never assign in core or this HAL):
#   IP101 Ethernet RMII: GPIO28, 29, 30, 31 (MDC), 34, 35 (TXD1, shared with BOOT), 49, 50, 51, 52 (MDIO)
#   Relays: GPIO32, GPIO46   |   RS485: TX GPIO47, RX GPIO48
# ==============================================================================

substitutions:
  # P4 silicon profile (one source of truth; CI publishes both variants):
  #   rev1 -> p4_engineering_sample: "true",  p4_cpu_frequency: "360MHz"  (v1.x silicon)
  #   rev3 -> p4_engineering_sample: "false", p4_cpu_frequency: "400MHz"  (v3.x silicon)
  p4_silicon: "rev1"
  p4_engineering_sample: "true"
  p4_cpu_frequency: "360MHz"
  art_resize: "720x720"
  # 4x fewer pixels decoded on track changes (exact 2x upscale in draw_album_art), avoiding audio/touch stalls
  sendspin_art_resize: "360x360"
  # Mains-powered stationary panel: reboot after 15 min without an HA API client to recover stalled Wi-Fi/TCP.
  api_reboot_timeout: "15min"
  sendspin_buffer_size: "1048576"
  # micro_wake_word arena + weights in internal RAM (~70% faster inference); boards with internal-RAM headroom only
  mww_internal_ram: "true"
  announcement_buffer_size: "131072"
  # Full-duplex I2S at 48 kHz: the speaker, ES8311 and ES7210 share one bus clock at audio_out_rate;
  # latter_mic converts the mic to audio_in_rate (16 kHz) for micro_wake_word and voice_assistant.
  audio_out_rate: "48000"
  audio_out_channels: "1"
  audio_out_bits: "16"
  audio_in_rate: "16000"
  wake_profiling: "n"
  i2s_lrclk_pin: GPIO10
  i2s_bclk_pin: GPIO12
  i2s_mclk_pin: GPIO13
  i2s_din_pin: GPIO11
  i2s_dout_pin: GPIO9

latter_core:
  board_id: waveshare_p4_86_panel
  ble_minor: 5
  gui: universal
  chip: esp32p4
  psram_mb: 32
  display:
    width: 720
    height: 720
    ppi: 254
    round: false
    ips: true
    corner_r: 0
    view_scale: 1.45
    dsi_iram_safe: true
  backlight:
    pin: 26
    en_pin: 33
    inverted: true
    pwm_hz: 5000
    pwm_bits: 12
    duty_min_pm: 480
    duty_max_pm: 1000
  power:
    c6_reset_pin: 54  # C6 CHIP_PU (esp32_hosted reset_pin)
  audio:
    out_rate: 48000
    out_channels: 1
    out_bits: 16
    in_rate: 16000
  capabilities:
    display: true
    touch: true
    audio: true
    imu: false
    battery: false
    rtc: false
    stationary: true
    wearable: false
  drivers:
    pmu_axp2101: false
    rtc_pcf85063: false
    imu_qmi8658: false
    codec_es8311: true

esp32:
  flash_size: 32MB
  framework:
    # ESPHome 2026.11.0+ mipi_dsi enables CONFIG_LCD_DSI_ISR_CACHE_SAFE + IRAM_ATTR DPI callback
    # automatically (which also selects DW_GDMA_ISR_IRAM_SAFE in ESP-IDF 6.x); keep
    # CONFIG_DW_GDMA_ISR_IRAM_SAFE explicitly set so DPI scanout stays tear-free across OTA flash
    # erases on both ESP-IDF 5.5 and 6.1+ (CONFIG_GDMA_ISR_IRAM_SAFE was removed in ESP-IDF 6.0).
    sdkconfig_options:
      CONFIG_DW_GDMA_ISR_IRAM_SAFE: "y"

i2c:
  - id: bus_internal
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: false

packages:
  latter_chip: !include ../modules/hal/chip_esp32p4.yaml
  latter_radio: !include ../modules/hal/radio_esp32c6_sdio.yaml
  latter_audio_hal: !include ../modules/hal/audio_es8311_es7210_duplex.yaml

switch:
  - platform: gpio
    name: "Speaker Enable"
    id: speaker_enable
    internal: true
    pin: GPIO53
    restore_mode: ALWAYS_OFF

binary_sensor:
  # BOOT key (GPIO35) is shared with IP101 RMII TXD1 on the bottom board. Valid only while
  # Ethernet is disabled; enabling ethernet: requires moving boot_button to a template sensor.
  - platform: gpio
    pin:
      number: GPIO35
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    name: "Boot Button"
    id: boot_button
    internal: true

display:
  - platform: mipi_dsi
    id: disp1
    model: WAVESHARE-P4-86-PANEL
    update_interval: 1s

# GT911: TP_INT is unrouted (test point TP2), so no interrupt_pin, and no reset_pin
# (resetting with INT floating can strap the controller to 0x14).
touchscreen:
  - platform: latter_core
    protocol: gt911
    id: touch_screen
    display: disp1
    i2c_id: bus_internal
    address: 0x5D
    active_poll_interval: 8ms
    update_interval: 8ms

script:
  - id: hal_release_deep_sleep_holds
    mode: restart
    then:
      - lambda: 'return;'
  - id: hal_enter_hardware_hibernate
    mode: restart
    then:
      - lambda: 'return;'
