# ==============================================================================
# Hardware Abstraction Layer (HAL): Waveshare ESP32-P4-86-Panel-ETH-2RO ("Desk Assistant")
# SKU:     31570 (mainboard shared with ESP32-P4-WIFI6-Touch-LCD-4B, SKU 31416 - 4B not yet validated)
# SoC:     ESP32-P4NRW32 (32MB PSRAM, 32MB GD25Q256 Flash) + ESP32-C6-MINI-1U (U.FL antenna) over SDIO
# Silicon: rev1.3 AND rev3.x units ship. Binaries are NOT cross-compatible; select with p4_silicon below.
# Display: 4.0" 720x720 IPS (ST7703, 2-Lane MIPI-DSI @ 480Mbps/lane, 38MHz DPI, RST: GPIO27)
#          TE: test point only (unrouted). PHY: esp_ldo channel 3 @ 2.5V.
# Backlight: AP3032 boost, analog dimming GPIO26 -> 10k/100nF RC (tau ~1ms) -> FB (higher duty = dimmer),
#            BL_EN GPIO33 (100k pull-up to 5V; LOW = boost fully off). PWM 5kHz (vendor BSP).
#            Filtered analog dimming is steep: the LEDs go dark above ~30% inverted duty, so the usable
#            window is 75..100% on-duty (25%..0% inverted duty). 0% brightness switches BL_EN off.
# Touch:   GT911 @ 0x5D/0x14 (I2C SDA: GPIO7, SCL: GPIO8). RST GPIO23 not driven; INT on test point only.
# Audio:   ES8311 DAC @ 0x18 (DOUT: GPIO9) + ES7210 ADC @ 0x40 (DIN: GPIO11), PA (NS4150B): GPIO53
#          ES7210 mics: MIC1=FL, MIC2=FR, MIC3=AEC loopback of ES8311 output (TDM only), MIC4=NC
# Clocks:  MCLK: GPIO13, BCLK: GPIO12, LRCLK/WS: GPIO10
# C6:      SDIO CLK18/CMD19/D0-D3 14-17, CHIP_PU GPIO54, C6 IO2 <-> GPIO6 (host-wake line)
# SD:      SDMMC slot 0 (D0-D3 39-42, CLK 43, CMD 44), power P-FET gate GPIO45
# RESERVED (bottom board - never assign in core or this HAL):
#   IP101 Ethernet RMII: GPIO28, 29, 30, 31 (MDC), 34, 35 (TXD1, shared with BOOT), 49, 50, 51, 52 (MDIO)
#   Relays: GPIO32, GPIO46   |   RS485: TX GPIO47, RX GPIO48
# ==============================================================================

substitutions:
  # P4 silicon profile (one source of truth; CI publishes both variants):
  #   rev1 -> p4_engineering_sample: "true",  p4_cpu_frequency: "360MHz"  (v1.x silicon)
  #   rev3 -> p4_engineering_sample: "false", p4_cpu_frequency: "400MHz"  (v3.x silicon)
  p4_silicon: "rev1"
  p4_engineering_sample: "true"
  p4_cpu_frequency: "360MHz"
  screen_w: "720"
  screen_h: "720"
  font_time_size: "112"
  font_chrono_size: "56"
  font_date_size: "38"
  font_btn_bold_size: "36"
  font_small_size: "30"
  font_micro_size: "20"
  font_games_size: "56"
  art_resize: "480x480"
  sendspin_art_resize: "480x480"
  art_shape: "square"
  default_start_app: "Home"
  default_clock_face: "Minimal Digital"
  default_art_mode: "Full Screen"
  default_screensaver_style: "Aurora Borealis"
  default_album_sort: "Alphabetical"
  default_artist_album_sort: "Oldest on Top"
  default_podcast_sort: "Newest on Top"
  default_power_profile: "Always-On Wall / Desk"
  sendspin_buffer_size: "1048576"
  announcement_buffer_size: "131072"
  audio_out_rate: "16000"
  audio_out_channels: "1"
  audio_out_bits: "16"
  audio_in_rate: "16000"

esphome:
  build_flags:
    - '-DLATTER_BOARD_ID=\"waveshare_p4_86_panel\"'
    - "-DLATTER_BLE_MINOR=5"
    - "-DLATTER_SCREEN_W=720"
    - "-DLATTER_SCREEN_H=720"
    - "-DLATTER_ROUND_DISPLAY=0"
    - "-DLATTER_HAS_DISPLAY=1"
    - "-DLATTER_HAS_TOUCH=1"
    - "-DLATTER_HAS_AUDIO=1"
    - "-DLATTER_HAS_IMU=0"
    - "-DLATTER_HAS_BATTERY=0"
    - "-DLATTER_IS_STATIONARY=1"
    - "-DLATTER_IS_WEARABLE=0"
    - "-DLATTER_PANEL_IPS=1"
    - "-DLATTER_PANEL_PPI=254"
    - "-DLATTER_CHIP_P4=1"
    - "-DLATTER_PSRAM_MB=32"
    - "-DLATTER_BACKLIGHT_PIN=26"
    - "-DLATTER_BACKLIGHT_EN_PIN=33"
    - "-DLATTER_BACKLIGHT_INVERTED=1"
    - "-DLATTER_BACKLIGHT_PWM_HZ=5000"
    - "-DLATTER_BACKLIGHT_PWM_BITS=10"
    - "-DLATTER_BACKLIGHT_DUTY_MIN_PCT=75"
    - "-DLATTER_BACKLIGHT_DUTY_MAX_PCT=100"
    - "-DLATTER_DSI_IRAM_SAFE=1"
    - "-Wl,--wrap=esp_lcd_dpi_panel_register_event_callbacks"
    - "-DLATTER_AUDIO_OUT_RATE=16000"
    - "-DLATTER_AUDIO_OUT_CH=1"
    - "-DLATTER_AUDIO_OUT_BITS=16"
    - "-DLATTER_AUDIO_IN_RATE=16000"

esp32:
  variant: esp32p4
  # rev1.x builds only boot rev1.x silicon and rev3.x builds only boot rev3.x silicon (see p4_silicon).
  engineering_sample: ${p4_engineering_sample}
  cpu_frequency: ${p4_cpu_frequency}
  flash_size: 32MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0: "n"
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU1: "n"
      CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM: "y"
      CONFIG_COMPILER_OPTIMIZATION_PERF: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "256"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY: "y"
      CONFIG_ESP_HOSTED_MEMPOOL_PREFER_SPIRAM: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_LCD_DSI_ISR_CACHE_SAFE: "y"
      CONFIG_GDMA_ISR_IRAM_SAFE: "y"
      CONFIG_DW_GDMA_ISR_IRAM_SAFE: "y"
    advanced:
      enable_idf_experimental_features: true
      flash_chip: generic

psram:
  speed: 200MHz
  ignore_not_found: false

# Console: the USB-C port is a CH343 USB-UART bridge on UART0 (GPIO37/38). The P4's USB-Serial-JTAG
# pins (GPIO24/25) are not wired to a USB connector, so logs and the bootloader console use UART0.
logger:
  hardware_uart: UART0

esp_ldo:
  - channel: 3
    voltage: 2.5V

esp32_hosted:
  variant: esp32c6
  active_high: true
  use_psram: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54

update:
  - platform: esp32_hosted
    id: update_c6_coprocessor
    name: "System: C6 Co-Processor Firmware"
    icon: "mdi:chip"
    entity_category: config
    type: http
    source: "https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json"
    update_interval: never

i2c:
  - id: bus_internal
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: false

i2s_audio:
  - id: i2s_shared_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_internal
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: ${audio_in_rate}
    mic_gain: 24dB

microphone:
  - platform: i2s_audio
    id: latter_mic
    adc_type: external
    i2s_audio_id: i2s_shared_bus
    i2s_din_pin: GPIO11
    sample_rate: ${audio_in_rate}
    bits_per_sample: 16bit
    channel: left

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_internal
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: ${audio_out_rate}
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: physical_speaker
    i2s_audio_id: i2s_shared_bus
    i2s_dout_pin: GPIO9
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: ${audio_out_rate}
    bits_per_sample: 16bit
    channel: left
    buffer_duration: 250ms
    timeout: 500ms

packages:
  latter_imu: !include ../modules/imu_none.yaml
  latter_pmu: !include ../modules/pmu_none.yaml

switch:
  - platform: gpio
    name: "Speaker Enable"
    id: speaker_enable
    entity_category: config
    pin: GPIO53
    restore_mode: ALWAYS_OFF

binary_sensor:
  # BOOT key (GPIO35) is shared with IP101 RMII TXD1 on the bottom board. Valid only while
  # Ethernet is disabled; enabling ethernet: requires moving boot_button to a template sensor.
  - platform: gpio
    pin:
      number: GPIO35
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    name: "Boot Button"
    id: boot_button
    entity_category: diagnostic

display:
  - platform: mipi_dsi
    id: disp1
    model: WAVESHARE-P4-86-PANEL
    update_interval: 1s

# GT911: TP_INT is unrouted (test point TP2), so no interrupt_pin, and no reset_pin
# (resetting with INT floating can strap the controller to 0x14).
touchscreen:
  - platform: gt911
    id: touch_screen
    display: disp1
    i2c_id: bus_internal
    update_interval: 16ms

script:
  - id: hal_route_i2s_to_spk
    mode: restart
    then:
      - lambda: 'return;'
  - id: hal_route_i2s_to_mic
    mode: restart
    then:
      - lambda: 'return;'
  - id: hal_release_deep_sleep_holds
    mode: restart
    then:
      - lambda: |-
          id(es8311_dac).set_volume(0.90f);
          id(es8311_dac).set_mute_on();
  - id: hal_set_dac_mute
    mode: restart
    parameters:
      muted: bool
    then:
      - lambda: |-
          if (muted) {
            id(es8311_dac).set_mute_on();
          } else {
            id(es8311_dac).set_mute_off();
          }
  - id: hal_enter_hardware_hibernate
    mode: restart
    then:
      - lambda: 'return;'
  - id: hal_set_audio_codecs_standby
    mode: restart
    parameters:
      standby: bool
    then:
      - lambda: |-
          latter_ui::hal_set_es8311_es7210_standby(id(bus_internal), standby, true);