# ==============================================================================
# Hardware Abstraction Layer (HAL): Waveshare ESP32-P4-WIFI6-Touch-LCD-3.5 ("Remote Assistant")
# SKU:     33360
# SoC:     ESP32-P4NRW32 (32MB PSRAM, 16MB Flash) + ESP32-C6 Wi-Fi 6 / BLE 5 over SDIO
# Display: 3.5" 320x480 IPS LCD (ST7796 over SPI, CLK: GPIO21, MOSI: GPIO20, CS: GPIO23, DC: GPIO26, RST: GPIO27, BL: GPIO28)
# Touch:   FT6336 @ 0x38 (I2C SDA: GPIO7, SCL: GPIO8)
# Audio:   ES8311 @ 0x18 (MCLK: GPIO13, BCLK: GPIO12, WS: GPIO10, DOUT: GPIO9, DIN: GPIO11, PA: GPIO53)
# PMU:     AXP2101 @ 0x34
# ==============================================================================

esphome:
  build_flags:
    - "-DPOCKET_UI_SCREEN_W=320"
    - "-DPOCKET_UI_SCREEN_H=480"
    - "-DPOCKET_UI_ROUND_DISPLAY=0"
    - "-DPOCKET_UI_NO_PMU_IRQ_PIN=1"
    - "-DPOCKET_UI_BACKLIGHT_PIN=28"

esp32:
  variant: esp32p4
  engineering_sample: false
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0: "n"
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU1: "n"
      CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM: "y"
      CONFIG_SPIRAM_USE_CAPS_ALLOC: "n"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
    advanced:
      enable_idf_experimental_features: true
      flash_chip: generic

psram:
  speed: 200MHz
  ignore_not_found: false

esp_ldo:
  - channel: 3
    voltage: 2.5V

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54

update:
  - platform: esp32_hosted
    id: update_c6_coprocessor
    name: "System: C6 Co-Processor Firmware"
    icon: "mdi:chip"
    entity_category: config
    type: http
    source: "https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json"
    update_interval: never

interval:
  - interval: 20s
    then:
      - lambda: |-
          static bool c6_checked_once = false;
          if (!c6_checked_once && id(wifi_ctrl).is_connected()) {
            c6_checked_once = true;
            if (id(update_c6_coprocessor).update_info.current_version.empty() ||
                id(update_c6_coprocessor).update_info.current_version == "unknown") {
              id(update_c6_coprocessor).setup();
            }
            id(update_c6_coprocessor).check();
            ESP_LOGI("c6_fw", "ESP32-C6 Co-Processor Firmware: installed=%s",
                     id(update_c6_coprocessor).update_info.current_version.c_str());
          }

i2c:
  - id: bus_internal
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: false

spi:
  - id: display_spi
    clk_pin: GPIO21
    mosi_pin: GPIO20

i2s_audio:
  - id: i2s_shared_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_internal
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true

microphone:
  - platform: i2s_audio
    id: pocket_mic
    adc_type: external
    i2s_audio_id: i2s_shared_bus
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

speaker:
  - platform: i2s_audio
    id: physical_speaker
    i2s_audio_id: i2s_shared_bus
    i2s_dout_pin: GPIO9
    dac_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left
    buffer_duration: 250ms
    timeout: 10s

packages:
  latter_imu: !include ../modules/imu_none.yaml

switch:
  - platform: gpio
    name: "Speaker Enable"
    id: speaker_enable
    pin: GPIO53
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO35
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    name: "Boot Button"
    id: boot_button

display:
  - platform: mipi_spi
    id: disp1
    model: ST7796
    spi_id: display_spi
    data_rate: 80MHz
    color_order: BGR
    invert_colors: true
    cs_pin: GPIO23
    dc_pin: GPIO26
    reset_pin: GPIO27
    dimensions:
      width: 320
      height: 480
    update_interval: 1s

touchscreen:
  - platform: ft5x06
    id: touch_screen
    display: disp1
    i2c_id: bus_internal
    address: 0x38
    interrupt_pin:
      number: GPIO50
      mode: INPUT_PULLUP
    touch_timeout: 120ms

script:
  - id: hal_route_i2s_to_spk
    mode: restart
    then:
      - lambda: 'return;'
  - id: hal_route_i2s_to_mic
    mode: restart
    then:
      - lambda: 'return;'
  - id: hal_release_deep_sleep_holds
    mode: restart
    then:
      - lambda: |-
          // Pulse FT6336 Touch Reset (GPIO29) and enable LCD Backlight (GPIO28) immediately on boot
          gpio_set_direction(GPIO_NUM_29, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_29, 0);
          esp_rom_delay_us(10000);
          gpio_set_level(GPIO_NUM_29, 1);
          esp_rom_delay_us(30000);
          pocket_ui::hal_set_display_brightness(&id(disp1), 230);
  - id: hal_init_pmu_irq
    mode: restart
    then:
      - lambda: |-
          uint8_t irq_en[2] = {0x41, 0x0C};
          id(bus_internal).write(0x34, irq_en, 2);
  - id: hal_enter_hardware_hibernate
    mode: restart
    then:
      - lambda: |-
          global_preferences->sync();
          uint8_t axp_pwr_off[2] = {0x10, 0x01};
          id(bus_internal).write(0x34, axp_pwr_off, 2);
  - id: hal_set_imu_power_mode
    mode: restart
    parameters:
      ctrl7_val: int
    then:
      - lambda: '(void)ctrl7_val;'
  - id: hal_set_audio_codecs_standby
    mode: restart
    parameters:
      standby: bool
    then:
      - lambda: '(void)standby;'