# ==============================================================================
# Hardware Abstraction Layer (HAL): Waveshare ESP32-P4-WIFI6-Touch-LCD-3.5 ("Remote Assistant")
# SKU:     33360
# SoC:     ESP32-P4NRW32 (32MB PSRAM, 16MB Flash) + ESP32-C6 Wi-Fi 6 / BLE 5 over SDIO
# Display: 3.5" 320x480 IPS LCD (ST7796 over SPI, CLK: GPIO21, MOSI: GPIO20, CS: GPIO23, DC: GPIO26, RST: GPIO27, BL: GPIO28)
# Touch:   FT6336 @ 0x38 (I2C SDA: GPIO7, SCL: GPIO8)
# Audio:   ES8311 @ 0x18 (MCLK: GPIO13, BCLK: GPIO12, WS: GPIO10, DOUT: GPIO9, DIN: GPIO11, PA: GPIO53)
# PMU:     AXP2101 @ 0x34
# ==============================================================================

substitutions:
  screen_w: "320"
  screen_h: "480"
  font_time_size: "77"
  font_chrono_size: "38"
  font_date_size: "27"
  font_btn_bold_size: "26"
  font_small_size: "21"
  font_micro_size: "14"
  font_games_size: "38"
  art_resize: "320x480"
  sendspin_art_resize: "320x480"
  art_shape: "square"
  default_start_app: "Home"
  default_clock_face: "Minimal Digital"
  default_art_mode: "Full Screen"
  default_screensaver_style: "Aurora Borealis"
  default_album_sort: "Alphabetical"
  default_artist_album_sort: "Oldest on Top"
  default_podcast_sort: "Newest on Top"
  default_power_profile: "Tabletop Dock"
  default_pickup_wake: "Disabled"
  default_tap_wake: "Docked Only"
  default_battery_timeout: "30s"
  default_docked_timeout: "5 min"
  default_hibernate_timeout: "15 min"
  sendspin_buffer_size: "262144"
  announcement_buffer_size: "131072"

esphome:
  build_flags:
    - "-DLATTER_SCREEN_W=320"
    - "-DLATTER_SCREEN_H=480"
    - "-DLATTER_ROUND_DISPLAY=0"
    - "-DLATTER_HAS_DISPLAY=1"
    - "-DLATTER_HAS_TOUCH=1"
    - "-DLATTER_HAS_AUDIO=1"
    - "-DLATTER_HAS_IMU=0"
    - "-DLATTER_HAS_BATTERY=1"
    - "-DLATTER_IS_STATIONARY=0"
    - "-DLATTER_IS_WEARABLE=0"
    - "-DLATTER_PANEL_IPS=1"
    - "-DLATTER_CHIP_P4=1"
    - "-DLATTER_PSRAM_MB=32"
    - "-DLATTER_NO_PMU_IRQ_PIN=1"
    - "-DLATTER_BACKLIGHT_PIN=28"

esp32:
  variant: esp32p4
  engineering_sample: false
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0: "n"
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU1: "n"
      CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM: "y"
      CONFIG_COMPILER_OPTIMIZATION_PERF: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "256"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY: "y"
      CONFIG_ESP_HOSTED_MEMPOOL_PREFER_SPIRAM: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
    advanced:
      enable_idf_experimental_features: true
      flash_chip: generic

psram:
  speed: 200MHz
  ignore_not_found: false

esp_ldo:
  - channel: 3
    voltage: 2.5V

esp32_hosted:
  variant: esp32c6
  active_high: true
  use_psram: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54

update:
  - platform: esp32_hosted
    id: update_c6_coprocessor
    name: "System: C6 Co-Processor Firmware"
    icon: "mdi:chip"
    entity_category: config
    type: http
    source: "https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json"
    update_interval: never

i2c:
  - id: bus_internal
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: false

spi:
  - id: display_spi
    clk_pin: GPIO21
    mosi_pin: GPIO20

i2s_audio:
  - id: i2s_shared_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_internal
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true

microphone:
  - platform: i2s_audio
    id: latter_mic
    adc_type: external
    i2s_audio_id: i2s_shared_bus
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

speaker:
  - platform: i2s_audio
    id: physical_speaker
    i2s_audio_id: i2s_shared_bus
    i2s_dout_pin: GPIO9
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left
    buffer_duration: 250ms
    timeout: 500ms

packages:
  latter_imu: !include ../modules/imu_none.yaml
  latter_pmu: !include ../modules/pmu_axp2101.yaml

switch:
  - platform: gpio
    name: "Speaker Enable"
    id: speaker_enable
    entity_category: config
    pin: GPIO53
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO35
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    name: "Boot Button"
    id: boot_button
    entity_category: diagnostic

display:
  - platform: mipi_spi
    id: disp1
    model: CUSTOM
    spi_id: display_spi
    data_rate: 80MHz
    color_order: BGR
    invert_colors: true
    cs_pin: GPIO23
    dc_pin: GPIO26
    reset_pin: GPIO27
    dimensions:
      width: 320
      height: 480
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false
    init_sequence:
      - [0xF0, 0xC3]
      - [0xF0, 0x96]
      - [0xB4, 0x01]
      - [0xB7, 0xC6]
      - [0xC0, 0x80, 0x45]
      - [0xC1, 0x13]
      - [0xC2, 0xA7]
      - [0xC5, 0x1A]
      - [0xE8, 0x40, 0x8A, 0x00, 0x00, 0x29, 0x19, 0xA5, 0x33]
      - [0xE0, 0xD0, 0x08, 0x0F, 0x06, 0x06, 0x33, 0x30, 0x33, 0x47, 0x17, 0x13, 0x13, 0x2B, 0x31]
      - [0xE1, 0xD0, 0x0A, 0x11, 0x0B, 0x09, 0x07, 0x2F, 0x33, 0x47, 0x38, 0x15, 0x16, 0x2C, 0x32]
      - [0xF0, 0x3C]
      - [0xF0, 0x69]
    update_interval: 1s

touchscreen:
  - platform: ft5x06
    id: touch_screen
    display: disp1
    i2c_id: bus_internal
    address: 0x38
    interrupt_pin:
      number: GPIO50
      mode: INPUT_PULLUP
    touch_timeout: 120ms
    update_interval: 16ms

script:
  - id: hal_route_i2s_to_spk
    mode: restart
    then:
      - lambda: 'return;'
  - id: hal_route_i2s_to_mic
    mode: restart
    then:
      - lambda: 'return;'
  - id: hal_release_deep_sleep_holds
    mode: restart
    then:
      - lambda: |-
          gpio_hold_dis(GPIO_NUM_23);
          gpio_hold_dis(GPIO_NUM_27);
          gpio_hold_dis(GPIO_NUM_28);
          gpio_hold_dis(GPIO_NUM_29);
          gpio_hold_dis(GPIO_NUM_53);
          // Pulse FT6336 Touch Reset (GPIO29) and enable LCD Backlight (GPIO28) immediately on boot
          gpio_set_direction(GPIO_NUM_29, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_29, 0);
          esp_rom_delay_us(10000);
          gpio_set_level(GPIO_NUM_29, 1);
          esp_rom_delay_us(30000);
          latter_ui::hal_set_display_brightness(&id(disp1), 230);
          id(es8311_dac).set_volume(0.90f);
          id(es8311_dac).set_mute_on();
  - id: hal_set_dac_mute
    mode: restart
    parameters:
      muted: bool
    then:
      - lambda: |-
          if (muted) {
            id(es8311_dac).set_mute_on();
          } else {
            id(es8311_dac).set_mute_off();
          }
  - id: hal_init_pmu_irq
    mode: restart
    then:
      - lambda: |-
          uint8_t irq_en[2] = {0x41, 0x0C};
          id(bus_internal).write(0x34, irq_en, 2);
          uint8_t clr_all[2] = {0x48, 0xFF};
          id(bus_internal).write(0x34, clr_all, 2);
          clr_all[0] = 0x49;
          id(bus_internal).write(0x34, clr_all, 2);
          clr_all[0] = 0x4A;
          id(bus_internal).write(0x34, clr_all, 2);
  - id: hal_enter_hardware_hibernate
    mode: restart
    then:
      - lambda: |-
          // 1. Put ES8311 Audio Codec (0x18) into Standby/Power-Down Mode
          uint8_t dac_sleep1[2] = {0x0D, 0xFF};
          uint8_t dac_sleep2[2] = {0x00, 0x80};
          id(bus_internal).write(0x18, dac_sleep1, 2);
          id(bus_internal).write(0x18, dac_sleep2, 2);

          // 2. Force Speaker Power Amplifier (GPIO53) and Backlight (GPIO28) LOW and hold
          latter_ui::hal_set_display_brightness(&id(disp1), 0);
          gpio_set_direction(GPIO_NUM_53, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_53, 0);
          gpio_hold_en(GPIO_NUM_53);

          gpio_set_direction(GPIO_NUM_28, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_28, 0);
          gpio_hold_en(GPIO_NUM_28);

          // 3. Deselect Display CS (GPIO23 HIGH) and hold Display/Touch in Reset (GPIO27/29 LOW)
          gpio_set_direction(GPIO_NUM_23, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_23, 1);
          gpio_hold_en(GPIO_NUM_23);

          gpio_set_direction(GPIO_NUM_27, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_27, 0);
          gpio_hold_en(GPIO_NUM_27);

          gpio_set_direction(GPIO_NUM_29, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_29, 0);
          gpio_hold_en(GPIO_NUM_29);

          global_preferences->sync();

          // 4. Command AXP2101 PMIC to cut system voltage rails (<40uA Hibernate)
          uint8_t axp_pwr_off[2] = {0x10, 0x01};
          id(bus_internal).write(0x34, axp_pwr_off, 2);

          delay(100);
          esp_deep_sleep_start();
  - id: hal_set_imu_power_mode
    mode: restart
    parameters:
      ctrl7_val: int
    then:
      - lambda: '(void)ctrl7_val;'
  - id: hal_set_audio_codecs_standby
    mode: restart
    parameters:
      standby: bool
    then:
      - lambda: |-
          static int last_stby = -1;
          const int target = standby ? 1 : 0;
          if (target == last_stby) return;
          last_stby = target;
          if (standby) {
            uint8_t dac_lp[2] = {0x0D, 0xFC};
            id(bus_internal).write(0x18, dac_lp, 2);
          } else {
            uint8_t dac_wake[2] = {0x0D, 0x01};
            id(bus_internal).write(0x18, dac_wake, 2);
          }