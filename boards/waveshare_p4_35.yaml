# ==============================================================================
# Hardware Abstraction Layer (HAL): Waveshare ESP32-P4-WIFI6-Touch-LCD-3.5 ("Remote Assistant")
# SKU:     33360
# SoC:     ESP32-P4NRW32 (32MB PSRAM, 16MB Flash) + ESP32-C6 Wi-Fi 6 / BLE 5 over SDIO
# Silicon: rev3.x production silicon (400 MHz).
# Display: 3.5" 320x480 IPS LCD (ST7796 over SPI, CLK: GPIO21, MOSI: GPIO20, CS: GPIO23, DC: GPIO26, RST: GPIO27, BL: GPIO28)
# Touch:   FT6336 @ 0x38 (I2C SDA: GPIO7, SCL: GPIO8)
# Audio:   ES8311 @ 0x18 (MCLK: GPIO13, BCLK: GPIO12, WS: GPIO10, DOUT: GPIO9, DIN: GPIO11, PA: GPIO53), full duplex @ 48 kHz
# PMU:     AXP2101 @ 0x34. DCDC1 feeds every 3V3 load (P4, C6, LCD, touch, BL); ALDO1 = codec A3V3.
#          AXP_IRQ is NOT routed. PWR key: K1 -> AXP PWRON and BSS138 -> GPIO49 (HIGH while pressed).
# C6:      CHIP_PU GPIO54 (10k pull-up, 1uF), C6 IO2 <-> GPIO6 (host-wake line).
# SD:      power P-FET (AO3401) gate GPIO45 with a 10k pull-down: HIGH = SD off, LOW/hi-Z = SD on.
#          Left undriven (SD powered; ~0 A with no card). Holding it HIGH would cost ~0.33 mA through the pull-down.
# ==============================================================================

substitutions:
  # SKU 33360 ships with ESP32-P4 v3.x production silicon (400 MHz, engineering_sample: false).
  p4_silicon: "rev3"
  p4_engineering_sample: "false"
  p4_cpu_frequency: "400MHz"
  font_time_size: "77"
  font_chrono_size: "38"
  font_date_size: "27"
  font_btn_bold_size: "26"
  font_small_size: "21"
  font_micro_size: "14"
  font_games_size: "38"
  art_resize: "320x480"
  # 4x fewer pixels decoded on track changes (exact 2x height upscale in draw_album_art)
  sendspin_art_resize: "240x240"
  # Portable battery device: disable Native API watchdog reboot so off-site / HA-restart outages never reboot-loop.
  api_reboot_timeout: "0s"
  sendspin_buffer_size: "1048576"
  # micro_wake_word arena + weights in internal RAM (~70% faster inference); boards with internal-RAM headroom only
  mww_internal_ram: "true"
  announcement_buffer_size: "131072"
  # Full-duplex I2S at 48 kHz: the ES8311's DAC and ADC share one bus clock at audio_out_rate;
  # latter_mic converts the mic to audio_in_rate (16 kHz) for micro_wake_word and voice_assistant.
  audio_out_rate: "48000"
  audio_out_channels: "1"
  audio_out_bits: "16"
  audio_in_rate: "16000"
  wake_profiling: "n"
  i2s_lrclk_pin: GPIO10
  i2s_bclk_pin: GPIO12
  i2s_mclk_pin: GPIO13
  i2s_din_pin: GPIO11
  i2s_dout_pin: GPIO9

latter_core:
  board_id: waveshare_p4_35
  ble_minor: 4
  gui: universal
  chip: esp32p4
  psram_mb: 32
  display:
    width: 320
    height: 480
    ppi: 165
    round: false
    ips: true
    dcs_sleep: true
    dc_pin: 26
    touch_int_pin: 50
    touch_rst_pin: 29
  backlight:
    pin: 28
    pwm_hz: 5000
    pwm_bits: 12
    duty_min_pm: 3
    duty_max_pm: 1000
  power:
    # Fitted cell (boards/facts power.battery_mah): the charge profile, state of charge and cutoff derive
    # from it (include/hal_battery.h)
    battery_mah: 500
    pwr_key_pin: 49
    pwr_key_active_high: true
    c6_reset_pin: 54  # C6 CHIP_PU (esp32_hosted reset_pin; R25 10k pull-up): held low in alarm-sleep
    pmu_ts_disable: true
    pmu_dcdc_keep_mask: 0x01
    pmu_ldo_keep_mask: 0x001
  audio:
    out_rate: 48000
    out_channels: 1
    out_bits: 16
    in_rate: 16000
  capabilities:
    display: true
    touch: true
    audio: true
    imu: false
    battery: true
    rtc: false
    stationary: false
    wearable: false
  drivers:
    pmu_axp2101: true
    rtc_pcf85063: false
    imu_qmi8658: false
    codec_es8311: true
    touch_ft5x06: true

esp32:
  flash_size: 16MB

# ESP32-P4 has no intermediate PLL CPU frequency below 360/400 MHz (only 40 MHz XTAL).
# Never enable esp32_power_management here: 40 MHz <-> CPLL transitions retune 200 MHz PSRAM
# speed modes across esp_hosted SDIO DMA and trigger Interrupt WDT / MSPI panics. Battery standby
# stretches the main loop to 250 ms / 1,000 ms in power_pm.cpp so both RISC-V cores idle in wfi.

i2c:
  - id: bus_internal
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: false

spi:
  - id: display_spi
    clk_pin: GPIO21
    mosi_pin: GPIO20

packages:
  latter_chip: !include ../modules/hal/chip_esp32p4.yaml
  latter_radio: !include ../modules/hal/radio_esp32c6_sdio.yaml
  latter_audio_hal: !include ../modules/hal/audio_es8311_duplex.yaml
  latter_pmu: !include ../modules/hal/pmu_axp2101.yaml
  latter_battery_service: !include ../modules/battery_service.yaml

esphome:
  on_boot:
    - priority: 850
      then:
        - lambda: |-
            latter_core::runtime_state().hw_set_touch_sleep_mode = +[](bool sleep) {
              latter_core::hal_set_touch_sleep_mode(id(bus_internal), sleep);
            };

switch:
  - platform: gpio
    name: "Speaker Enable"
    id: speaker_enable
    internal: true
    pin: GPIO53
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO35
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    name: "Boot Button"
    id: boot_button
    internal: true

  # PWR key state (K1 -> BSS138 inverter -> GPIO49, HIGH while pressed). Press timing lives in
  # modules/hal/pmu_axp2101.yaml. GPIO49 is not an LP GPIO, so it cannot wake the P4 from deep sleep (alarm-sleep
  # wakes on its timer). Wake from hibernate needs no GPIO: hibernate powers the AXP2101 off, and K1 also
  # drives AXP PWRON, which powers the rails back up and cold-boots the P4 (bench-verified 2026-11-09).
  - platform: gpio
    id: pwr_key
    name: "Power Key"
    internal: true
    pin:
      number: GPIO49
      mode: INPUT
    filters:
      - delayed_on_off: 20ms

display:
  - platform: mipi_spi
    id: disp1
    model: CUSTOM
    spi_id: display_spi
    data_rate: 80MHz
    color_order: BGR
    invert_colors: true
    cs_pin: GPIO23
    dc_pin: GPIO26
    reset_pin: GPIO27
    dimensions:
      width: 320
      height: 480
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false
    init_sequence:
      - [0xF0, 0xC3]
      - [0xF0, 0x96]
      - [0xB4, 0x01]
      - [0xB7, 0xC6]
      - [0xC0, 0x80, 0x45]
      - [0xC1, 0x13]
      - [0xC2, 0xA7]
      - [0xC5, 0x1A]
      - [0xE8, 0x40, 0x8A, 0x00, 0x00, 0x29, 0x19, 0xA5, 0x33]
      - [0xE0, 0xD0, 0x08, 0x0F, 0x06, 0x06, 0x33, 0x30, 0x33, 0x47, 0x17, 0x13, 0x13, 0x2B, 0x31]
      - [0xE1, 0xD0, 0x0A, 0x11, 0x0B, 0x09, 0x07, 0x2F, 0x33, 0x47, 0x38, 0x15, 0x16, 0x2C, 0x32]
      - [0xF0, 0x3C]
      - [0xF0, 0x69]
    update_interval: 1s

touchscreen:
  - platform: latter_core
    protocol: ft6336
    id: touch_screen
    display: disp1
    i2c_id: bus_internal
    address: 0x38
    interrupt_pin:
      number: GPIO50
      mode: INPUT_PULLUP
    active_poll_interval: 10ms
    update_interval: never

script:
  - id: hal_release_deep_sleep_holds
    mode: restart
    then:
      - lambda: |-
          gpio_hold_dis(GPIO_NUM_23);
          gpio_hold_dis(GPIO_NUM_27);
          gpio_hold_dis(GPIO_NUM_28);
          gpio_hold_dis(GPIO_NUM_29);
          gpio_hold_dis(GPIO_NUM_53);
          // Pulse FT6336 Touch Reset (GPIO29) immediately on boot
          gpio_set_direction(GPIO_NUM_29, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_29, 0);
          esp_rom_delay_us(10000);
          gpio_set_level(GPIO_NUM_29, 1);
          esp_rom_delay_us(30000);
  - id: hal_enter_hardware_hibernate
    mode: restart
    then:
      - lambda: |-
          latter_core::hal_power_down_audio_and_imu_for_hibernate(id(bus_internal), false, false);

          // Force Speaker Power Amplifier (GPIO53) and Backlight (GPIO28) LOW and hold
          latter_core::hal_set_display_brightness(&id(disp1), 0);
          gpio_set_direction(GPIO_NUM_53, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_53, 0);
          gpio_hold_en(GPIO_NUM_53);

          gpio_set_direction(GPIO_NUM_28, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_28, 0);
          gpio_hold_en(GPIO_NUM_28);

          // Deselect Display CS (GPIO23 HIGH) and hold Display/Touch in Reset (GPIO27/29 LOW)
          gpio_set_direction(GPIO_NUM_23, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_23, 1);
          gpio_hold_en(GPIO_NUM_23);

          gpio_set_direction(GPIO_NUM_27, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_27, 0);
          gpio_hold_en(GPIO_NUM_27);

          gpio_set_direction(GPIO_NUM_29, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_29, 0);
          gpio_hold_en(GPIO_NUM_29);

          global_preferences->sync();

          const auto &rs = latter_core::runtime_state();
          const auto &ap = latter_core::persisted_prefs().alarms;
          int32_t sec_to_alarm = latter_core::seconds_until_next_armed_alarm(
              id(ha_time).now().is_valid() ? id(ha_time).now() : id(sntp_time).now(),
              rs.alarms.snooze_until,
              ap[0].hour, ap[0].minute, ap[0].enabled, ap[0].recurrence,
              ap[1].hour, ap[1].minute, ap[1].enabled, ap[1].recurrence,
              ap[2].hour, ap[2].minute, ap[2].enabled, ap[2].recurrence);
          latter_core::enter_axp2101_hibernate_or_alarm_sleep(id(bus_internal), sec_to_alarm);
