# ==============================================================================
# Latter Universal Multi-Geometry GUI Shell (guis/universal/gui.yaml)
# Thin declarative font/palette shell + compositor dispatch to compiled page_*.cpp
# and touch_engine.cpp translation units in components/latter_ui/.
# ==============================================================================
