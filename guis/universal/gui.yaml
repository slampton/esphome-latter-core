color:
  - id: theme_primary
    hex: "6B8E9E"  # Default Soft Steel Ice Blue (Steel & Silver Palette)
  - id: theme_secondary
    hex: "C0C0C0"  # Default Brushed Silver (Steel & Silver Palette)
  - id: col_silver
    hex: "C0C0C0"  # Vintage Swiss brushed silver / steel
  - id: col_bg
    hex: "000000"
  - id: col_black
    hex: "000000"
  - id: col_gold
    hex: "C59B27"  # Muted vintage chronograph mustard gold
  - id: col_warm_gold
    hex: "A88424"  # Calibrated muted brass gold (anti-glare, crisp non-blooming on AMOLED)
  - id: col_white
    hex: "FFFFFF"
  - id: col_slate
    hex: "9E9E9E"
  - id: col_cyan
    hex: "456E8A"  # Distinctly muted vintage steel/slate blue (was electric cyan 00E5FF)
  - id: col_light_blue
    hex: "6B8E9E"  # Muted soft steel blue
  - id: col_green
    hex: "427453"  # Distinctly muted heritage sage/moss green (was neon 00E676)
  - id: col_orange
    hex: "B85C24"  # Muted earthy terracotta orange
  - id: col_red
    hex: "A84338"  # Vibrant antique vermilion crimson (rich, clearly red, calibrated antique tone)
  - id: col_purple
    hex: "6D4B7D"  # Muted vintage plum amethyst
  - id: col_magenta
    hex: "8E4A7D"  # Muted antique mauve
  - id: col_gray
    hex: "616161"
  - id: col_dark_gray
    hex: "212121"
  - id: col_solaris_gold
    hex: "FFDC1E"  # Kinetic plasma gold / sunburst
  - id: col_accent_cyan
    hex: "1EC8E6"  # Electric cyan / high-energy accent

display:
  - id: !extend disp1
    lambda: |-
      latter_ui::last_disp_update_ms() = millis();
      int prof_sub = 0;
      if (id(gui_page) == 1) prof_sub = id(home_subpage);
      else if (id(gui_page) == 2) prof_sub = id(music_overlay_mode);
      else if (id(gui_page) == 3) prof_sub = id(active_game);
      else if (id(gui_page) == 4) prof_sub = id(system_menu_mode);
      else if (id(gui_page) == 5) prof_sub = id(sky_weather_subpage);
      else if (id(gui_page) == 6) prof_sub = id(area_subpage);
      else if (id(gui_page) == 7) prof_sub = id(remote_subpage);
      else if (id(gui_page) == 8) prof_sub = id(tools_subpage);
      else if (id(gui_page) == 9) prof_sub = latter_ui::whole_home_tab();
      latter_ui::FrameProfileScope prof_frame_scope(id(gui_page), prof_sub, id(display_power_state));
      const int cx = latter_ui::SCREEN_CX;
      const int cy = latter_ui::SCREEN_CY;
      const Color C_WHITE = id(col_white);
      const Color C_SOLARIS_GOLD = id(col_solaris_gold);
      #if !LATTER_ROUND_DISPLAY
      // Bypass MipiDsi::draw_pixel_at's (ptr_16[pos] == new_color) early return after clear()
      // so x_low_=0, y_low_=0, x_high_=W-1, y_high_=H-1 is always latched for single-shot DMA2D flush
      it.draw_pixel_at(0, 0, Color(8, 8, 8));
      it.draw_pixel_at(0, 0, id(col_bg));
      it.draw_pixel_at(latter_ui::SCREEN_W - 1, latter_ui::SCREEN_H - 1, Color(8, 8, 8));
      it.draw_pixel_at(latter_ui::SCREEN_W - 1, latter_ui::SCREEN_H - 1, id(col_bg));
      #endif

      // ==========================================
      // GLOBAL OVERLAY: OTA FIRMWARE UPDATE IN PROGRESS
      // ==========================================
      if (id(ota_in_progress)) {
        it.fill(id(col_bg));

        int pct = id(ota_progress_pct);
        if (pct < 0) pct = 0;
        if (pct > 100) pct = 100;
        if (LATTER_ROUND_DISPLAY) {
          for (int i = 0; i <= pct; i++) {
            float rad = (static_cast<float>(i) / 100.0f) * 2.0f * latter_ui::PI_F - latter_ui::HALF_PI_F;
            float s = 0.0f, c = 1.0f;
            latter_ui::fast_sincos(rad, s, c);
            it.line(cx + static_cast<int>(220.0f * c), cy + static_cast<int>(220.0f * s),
                    cx + static_cast<int>(228.0f * c), cy + static_cast<int>(228.0f * s), id(theme_secondary));
          }
        } else {
          const int ota_bw = std::min(280, latter_ui::SCREEN_W - 48);
          const int ota_bx = cx - (ota_bw / 2);
          const int ota_fill = (ota_bw * pct) / 100;
          it.filled_rectangle(ota_bx, cy + 104, ota_bw, 10, id(col_dark_gray));
          if (ota_fill > 0) {
            it.filled_rectangle(ota_bx, cy + 104, ota_fill, 10, id(theme_primary));
          }
        }

        it.print(cx, cy - 60, id(font_date), id(theme_primary), TextAlign::CENTER, "FIRMWARE UPDATE");

        char prog_buf[32];
        snprintf(prog_buf, sizeof(prog_buf), "%d%%", pct);
        it.print(cx, cy + 8, id(font_time), id(col_white), TextAlign::CENTER, prog_buf);

        const char* status_msg = "Preparing flash...";
        if (pct >= 99) {
          status_msg = "Rebooting device...";
        } else if (pct >= 85) {
          status_msg = "Verifying image...";
        } else if (pct >= 10) {
          status_msg = "Writing flash memory...";
        }
        it.print(cx, cy + 65, id(font_small), id(col_slate), TextAlign::CENTER, status_msg);
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: HIBERNATION SHUTDOWN
      // ==========================================
      if (id(is_hibernating)) {
        it.fill(id(col_bg));

        if (id(hibernate_countdown_val) > 0) {
          it.print(cx, cy - 65, id(font_date), id(theme_primary), TextAlign::CENTER, "HIBERNATING");
          char c_buf[16];
          snprintf(c_buf, sizeof(c_buf), "%d", id(hibernate_countdown_val));
          it.print(cx, cy + 5, id(font_chrono_time), id(theme_secondary), TextAlign::CENTER, c_buf);
          it.print(cx, cy + 65, id(font_small), id(col_slate), TextAlign::CENTER, "Tap screen to stay awake");
        } else {
          it.print(cx, cy - 10, id(font_date), id(theme_primary), TextAlign::CENTER, "HIBERNATING");
          it.print(cx, cy + 30, id(font_small), id(col_slate), TextAlign::CENTER, "Shutting down...");
        }
        return;
      }

      static bool standby_black_flushed = false;
      if (!id(display_brightness).current_values.is_on() || id(display_power_state) == 2) {
        if (!standby_black_flushed) {
          it.fill(id(col_bg));
          standby_black_flushed = true;
        }
        return;
      }
      standby_black_flushed = false;

      auto now = id(ha_time).now();
      if (!now.is_valid()) {
        now = id(sntp_time).now();
      }

      // ==========================================
      // GLOBAL OVERLAY: ALARM / TIMER RINGING TAKEOVER (Highest Priority)
      // ==========================================
      if (id(alarm_ringing) || id(timer_ringing) || id(find_my_active)) {
        latter_ui::render_alert_ringing_overlay(
            it, cx, cy, millis(), id(alarm_ringing), id(alarm_ringing_idx),
            id(alarm1_recurrence), id(alarm2_recurrence), now, id(is_24h_format),
            id(font_time), id(font_date), id(font_small), id(font_micro),
            id(theme_primary), id(theme_secondary), id(col_bg), id(col_black),
            id(col_white), id(col_gray), id(col_red),
            id(find_my_active), id(va_timer_name));
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: VOICE ASSISTANT TAKEOVER
      // ==========================================
      if (id(va_active) || !id(va_status_text).empty()) {
        uint32_t now_ms = millis();
        bool is_speaking = id(va_tts_received);
        bool is_thinking = (!is_speaking && id(va_status_text) == "Thinking...");
        latter_ui::render_voice_assistant_overlay(
            it, cx, cy, now_ms, is_speaking, is_thinking, id(va_vad_active),
            id(va_visual_profile).current_option(), C_WHITE, C_SOLARIS_GOLD);
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: LATTER PUSH NOTIFICATION & CAMERA SNAPSHOT TAKEOVER
      // ==========================================
      if (id(notif_active)) {
        latter_ui::render_notification_overlay(
            it, cx, cy, millis(),
            id(notif_title), id(notif_message), id(notif_priority),
            id(camera_snapshot_art), id(notif_camera_url), id(current_loaded_camera_url),
            id(font_date), id(font_small),
            id(theme_primary), id(theme_secondary),
            id(col_bg), id(col_black), id(col_white),
            id(col_slate), id(col_gold), id(col_red));
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: DOCKED SCREENSAVER (Mode 1)
      // ==========================================
      if (id(display_power_state) == 1) {
        it.fill(id(col_bg));
        latter_ui::render_docked_screensaver(
            it, cx, cy, millis(), now, id(is_24h_format),
            id(screensaver_style_select).current_option(),
            id(font_time), id(font_small), id(col_slate), id(col_dark_gray));
        return;
      }

      float batt = id(batt_level).state;

      // ==========================================
      // PAGE 0: WATCH FACE (ANALOG & DIGITAL)
      // ==========================================
      if (id(gui_page) == 0) {
        latter_ui::render_clock_page(
            it, cx, cy, now, id(clock_face_digital), id(is_24h_format),
            batt, id(batt_charging).state,
            id(font_time), id(font_date), (latter_ui::SCREEN_W < 380) ? id(font_micro) : id(font_small),
            id(theme_primary), id(theme_secondary),
            id(col_white), id(col_slate), id(col_gray), id(col_dark_gray),
            id(col_red), id(col_gold), id(col_green),
            std::string(id(clock_face_style).current_option()));

      // ==========================================
      // PAGE 1: INTERACTIVE HOME HUB
      // ==========================================
      } else if (id(gui_page) == 1) {
        uint32_t now_h_ms = millis();
        bool is_rem_h = (id(active_speaker_entity) != "${local_player_id}");
        bool loc_play_h = (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
        bool mus_play_h = latter_ui::is_music_playing_effective(is_rem_h, loc_play_h, id(ha_target_state).state, now_h_ms);
        std::string m_title_h = (is_rem_h || id(track_title).state.empty() || id(track_title).state == "None")
                                    ? id(ha_track_title).state : id(track_title).state;
        std::string m_artist_h = (is_rem_h || id(track_artist).state.empty() || id(track_artist).state == "None")
                                     ? id(ha_track_artist).state : id(track_artist).state;
        float eff_w_temp_h = id(ha_weather_temperature).state;
        std::string eff_w_cond_h = id(ha_weather_condition).state;
        bool eff_show_w_bg = id(home_weather_bg_switch).state ||
                             (id(weather_sim_condition).current_option() != "Live (Home Assistant)");
        latter_ui::render_home_page(
            it, cx, cy, now_h_ms, id(home_subpage), id(home_activity_idx),
            now, id(is_24h_format), batt, id(batt_charging).state,
            eff_show_w_bg,
            id(home_dock_music_switch).state, id(home_dock_remote_switch).state,
            id(home_dock_tools_switch).state, id(home_dock_games_switch).state,
            std::string(id(weather_sim_condition).current_option()), eff_w_temp_h,
            eff_w_cond_h, id(ha_sun_state).state, id(ha_moon_phase).state,
            id(accel_x).state, id(accel_y).state,
            id(stopwatch_running), id(stopwatch_start_time), id(stopwatch_elapsed_ms),
            mus_play_h, m_title_h, m_artist_h,
            id(alarm_snooze_until),
            id(alarm1_hour), id(alarm1_minute), id(alarm1_enabled),
            id(alarm2_hour), id(alarm2_minute), id(alarm2_enabled),
            id(alarm3_hour), id(alarm3_minute), id(alarm3_enabled),
            id(font_time), id(font_date), id(font_small),
            id(theme_primary), id(theme_secondary),
            id(col_bg), id(col_black), id(col_white), id(col_slate),
            id(col_dark_gray), id(col_gold), id(col_green),
            id(home_wake_greeting_switch).state, id(home_dock_area_switch).state,
            id(home_wallpaper_art), id(ha_latter_wallpaper_url).state,
            id(current_loaded_wallpaper_url), id(ha_calendar_agenda_raw).state,
            id(home_dock_alarm_switch).state, id(area_alarm_state), id(font_micro));

      // ==========================================
      // PAGE 2: MUSIC PLAYER & LIBRARY BROWSER
      // ==========================================
      } else if (id(gui_page) == 2) {
        uint32_t now_p2_ms = millis();
        latter_ui::last_page2_draw_ms() = now_p2_ms;
        if (id(music_overlay_mode) == 0) {
          bool is_remote = (id(active_speaker_entity) != "${local_player_id}");
          bool local_playing = (id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          bool is_playing = latter_ui::is_music_playing_effective(
              is_remote, local_playing, id(ha_target_state).state, now_p2_ms);
          latter_ui::render_music_now_playing(
              it, cx, cy, now_p2_ms,
              id(music_fullscreen_art_mode).current_option().c_str(),
              id(music_overlay_style).current_option().c_str(),
              id(music_hud_active), is_remote, is_playing,
              id(album_art), id(remote_album_art),
              id(ha_target_art_url).state, id(current_loaded_art_url),
              id(active_speaker_name), "${friendly_name}",
              id(music_action_feedback), id(music_feedback_timer),
              id(active_playback_media_type),
              id(music_show_speaker_shortcut).state, id(music_show_library_shortcut).state,
              id(ha_media_duration).state, id(music_pos_base), id(music_pos_sync_time),
              id(track_title).state, id(track_artist).state, id(track_album).state,
              id(ha_track_title).state, id(ha_track_artist).state, id(ha_track_album).state,
              id(font_small), id(font_micro), id(theme_primary), id(theme_secondary),
              id(col_bg), id(col_black), id(col_white), id(col_gray), id(col_dark_gray));
        } else {
          latter_ui::render_music_menus(
              it, cx, id(music_overlay_mode),
              id(active_speaker_entity), id(active_speaker_name), "${local_player_id}",
              id(selected_category_mode), id(selected_category_title),
              id(music_category_page), id(music_browse_page), id(music_browse_total_pages),
              id(menu_scroll_active), id(menu_scroll_step), id(menu_scroll_dir), id(menu_scroll_target_page),
              id(slot_1_name), id(slot_1_id), id(slot_1_type), id(slot_1_active),
              id(slot_2_name), id(slot_2_id), id(slot_2_type), id(slot_2_active),
              id(slot_3_name), id(slot_3_id), id(slot_3_type), id(slot_3_active),
              id(slot_4_name), id(slot_4_id), id(slot_4_type), id(slot_4_active),
              id(slot_5_name), id(slot_5_id), id(slot_5_type), id(slot_5_active),
              id(target_speaker_id), id(target_speaker_name),
              id(font_date), id(font_small), id(font_micro),
              id(theme_primary), id(theme_secondary), id(col_bg), id(col_black),
              id(col_white), id(col_slate), id(col_dark_gray),
              now_p2_ms,
              latter_ui::is_music_playing_effective(
                  id(active_speaker_entity) != "${local_player_id}",
                  id(latter_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING,
                  id(ha_target_state).state, now_p2_ms),
              id(ha_media_duration).state, id(music_pos_base), id(music_pos_sync_time),
              (id(active_speaker_entity) != "${local_player_id}" || id(track_title).state.empty() || id(track_title).state == "None") ? id(ha_track_title).state : id(track_title).state,
              (id(active_speaker_entity) != "${local_player_id}" || id(track_artist).state.empty() || id(track_artist).state == "None") ? id(ha_track_artist).state : id(track_artist).state,
              (id(active_speaker_entity) != "${local_player_id}" || id(track_album).state.empty() || id(track_album).state == "None") ? id(ha_track_album).state : id(track_album).state,
              id(album_art), id(remote_album_art),
              id(ha_target_art_url).state, id(current_loaded_art_url));
        }

      // ==========================================
      // PAGE 3: GAMES SUITE (LAUNCHER & 6 GAMES)
      // ==========================================
      } else if (id(gui_page) == 3) {
        static int prev_game_state = 0;
        bool game_just_entered = false;
        if (id(active_game) != prev_game_state) {
          prev_game_state = id(active_game);
          game_just_entered = true;
        }

        float roll_delta = 0.0f;
        float pitch_delta = 0.0f;
        latter_ui::compute_3d_game_tilt(
            id(accel_x).state, id(accel_y).state, id(accel_z).state,
            id(imu_roll).state, id(imu_pitch).state,
            game_just_entered && (id(active_game) > 0),
            roll_delta, pitch_delta);

        if (id(active_game) == 0) {
          latter_ui::render_games_launcher(
              it, cx, id(game_carousel_idx), id(menu_scroll_active),
              id(menu_scroll_step), id(menu_scroll_dir), id(menu_scroll_target_page),
              id(high_score_marbles), id(high_score_archery), id(high_score_breakout),
              id(high_score_chomp),
              id(font_games_title), id(font_btn_bold), id(font_small),
              id(theme_primary), id(theme_secondary),
              id(col_bg), id(col_black), id(col_white), id(col_silver),
              id(col_slate), id(col_dark_gray),
              id(col_gold), id(col_cyan), id(col_green),
              id(col_orange), id(col_red), id(col_magenta), id(game_sound_switch).state);
        } else if (id(active_game) == 1) {
          latter_ui::render_game_marbles(
              it, cx, cy, millis(), game_just_entered, roll_delta, pitch_delta,
              id(marble_touch_x), id(marble_touch_y), id(game_btn_pressed), id(high_score_marbles),
              id(font_date), id(font_small), id(theme_primary), id(theme_secondary),
              id(col_bg), id(col_white), id(col_gold), id(col_cyan), id(col_green),
