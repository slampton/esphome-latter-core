        float eff_w_hum  = id(ha_weather_humidity).state;
        float eff_w_spd  = id(ha_weather_wind_speed).state;
        float eff_w_brg  = id(ha_weather_wind_bearing).state;
        std::string eff_w_cond = id(ha_weather_condition).state;
        #if LATTER_PANEL_IPS
        const Color eff_warm_gold(255, 178, 28);
        #else
        const Color eff_warm_gold = id(col_warm_gold);
        #endif
        latter_ui::render_weather_page(
            it, cx, cy, millis(), id(sky_weather_subpage), now, id(is_24h_format),
            std::string(id(weather_sim_condition).current_option()),
            eff_w_temp, id(ha_weather_high).state, id(ha_weather_low).state,
            eff_w_hum, eff_w_spd, eff_w_brg,
            eff_w_cond, id(ha_weather_forecast_5d).state,
            id(ha_sun_state).state, id(ha_sun_elevation).state, id(ha_sun_azimuth).state,
            id(ha_sun_next_rising).state, id(ha_sun_next_setting).state,
            id(ha_moon_phase).state,
            id(font_time), id(font_date), id(font_btn_bold), id(font_small), id(font_micro),
            id(theme_primary), id(theme_secondary),
            id(col_bg), id(col_black), id(col_white), id(col_slate),
            id(col_gray), id(col_dark_gray), eff_warm_gold, id(accel_x).state, id(accel_y).state,
            id(font_chrono_time));

      // ==========================================
      // PAGE 6: AREA CONTROL (LATTER)
      // ==========================================
      } else if (id(gui_page) == 6) {
        const bool is_area_picker = (id(area_subpage) == 1);
        latter_ui::render_area_control_page(
            it, cx, millis(), id(area_subpage), is_area_picker ? "areas" : "entities", id(area_domain_filter),
            id(active_area_name), id(ha_area_temperature).state, id(ha_area_humidity).state,
            id(area_alarm_entity), id(area_alarm_state),
            is_area_picker ? id(area_list_page) : id(area_browse_page),
            is_area_picker ? id(area_list_total_pages) : id(area_browse_total_pages),
            id(area_action_feedback), id(area_feedback_timer),
            is_area_picker ? id(area_list_1_name) : id(area_slot_1_name),
            is_area_picker ? id(area_list_1_id)   : id(area_slot_1_id),
            is_area_picker ? "area"               : id(area_slot_1_type),
            is_area_picker ? id(area_list_1_active) : id(area_slot_1_active), id(area_slot_1_level),
            is_area_picker ? id(area_list_2_name) : id(area_slot_2_name),
            is_area_picker ? id(area_list_2_id)   : id(area_slot_2_id),
            is_area_picker ? "area"               : id(area_slot_2_type),
            is_area_picker ? id(area_list_2_active) : id(area_slot_2_active), id(area_slot_2_level),
            is_area_picker ? id(area_list_3_name) : id(area_slot_3_name),
            is_area_picker ? id(area_list_3_id)   : id(area_slot_3_id),
            is_area_picker ? "area"               : id(area_slot_3_type),
            is_area_picker ? id(area_list_3_active) : id(area_slot_3_active), id(area_slot_3_level),
            is_area_picker ? id(area_list_4_name) : id(area_slot_4_name),
            is_area_picker ? id(area_list_4_id)   : id(area_slot_4_id),
            is_area_picker ? "area"               : id(area_slot_4_type),
            is_area_picker ? id(area_list_4_active) : id(area_slot_4_active), id(area_slot_4_level),
            is_area_picker ? id(area_list_5_name) : id(area_slot_5_name),
            is_area_picker ? id(area_list_5_id)   : id(area_slot_5_id),
