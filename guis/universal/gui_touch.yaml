# ==============================================================================
# Latter Universal GUI Optional Touchscreen Binding (guis/universal/gui_touch.yaml)
# Included by touch-enabled firmware profiles (LATTER_HAS_TOUCH=1) and omitted
# by rotary-only / display-only touchless builds (LATTER_HAS_TOUCH=0).
# ==============================================================================

touchscreen:
  - id: !extend touch_screen
    on_touch:
      then:
        - lambda: |-
            id(sync_ui_touch_runtime).execute();
            latter_ui::touch_engine().on_touch_down(static_cast<int>(touch.x), static_cast<int>(touch.y), millis());
    on_update:
      then:
        - lambda: |-
            id(sync_ui_touch_runtime_fast).execute();
            if (!touches.empty()) {
              latter_ui::touch_engine().on_touch_move(static_cast<int>(touches[0].x), static_cast<int>(touches[0].y), millis());
            }
    on_release:
      then:
        - lambda: |-
            id(sync_ui_touch_runtime).execute();
            latter_ui::touch_engine().on_touch_up(millis());
