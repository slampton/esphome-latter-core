                  int q_row = get_5slot_index(tp, pocket_ui::SCREEN_CX - 148, pocket_ui::SCREEN_CX + 148);
                  if (q_row == 0) {
                    pocket_ui::cam_quick_reply_open() = false;
                    id(cam_intercom_action) = "unlock_door";
                    id(cam_intercom_message) = "";
                    pocket_ui::cam_intercom_status() = "DOOR / GATE UNLOCKED";
                    id(cam_intercom_status_ms) = now_rel;
                    id(send_doorbell_intercom_cmd).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  } else if (q_row >= 1 && q_row <= 3) {
                    static constexpr const char *kDoorbellReplies[3] = {
                      "Please leave the package at the door, thank you!",
                      "We'll be right there!",
                      "No soliciting, thank you!"
                    };
                    pocket_ui::cam_quick_reply_open() = false;
                    id(cam_intercom_action) = "quick_reply";
                    id(cam_intercom_message) = kDoorbellReplies[q_row - 1];
                    pocket_ui::cam_intercom_status() = "REPLY SENT";
                    id(cam_intercom_status_ms) = now_rel;
                    id(send_doorbell_intercom_cmd).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  } else if (q_row == 4) {
                    pocket_ui::cam_landscape_mode() = !pocket_ui::cam_landscape_mode();
                    if (!pocket_ui::cam_landscape_mode()) {
                      pocket_ui::cam_anc_mode_idx() = (pocket_ui::cam_anc_mode_idx() + 1) % 3;
                      static constexpr const char *kAncCodes[3] = {"ultra", "balanced", "raw"};
                      id(cam_intercom_anc_str) = kAncCodes[pocket_ui::cam_anc_mode_idx()];
                      id(cam_intercom_action) = "set_anc_mode";
                      id(send_doorbell_intercom_cmd).execute();
                    }
                    id(camera_snapshot_art).release();
                    id(fetch_on_demand_camera).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                } else if (tp.y <= 68) {
                  if (!POCKET_UI_ROUND_DISPLAY && (pocket_ui::SCREEN_W != pocket_ui::SCREEN_H) &&
                      tp.x >= (pocket_ui::SCREEN_W - 64)) {
                    // Direct 1-Tap [90°] Widescreen Toggle on Rectangular Displays
                    pocket_ui::cam_landscape_mode() = !pocket_ui::cam_landscape_mode();
                    pocket_ui::cam_intercom_status() = pocket_ui::cam_landscape_mode() ? "90° LANDSCAPE" : "PORTRAIT VIEW";
                    id(cam_intercom_status_ms) = now_rel;
                    id(camera_snapshot_art).release();
                    id(fetch_on_demand_camera).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  } else if (c_total > 1 && tp.x < pocket_ui::SCREEN_CX - 55) {
                    pocket_ui::cam_carousel_idx() = step_wrap(pocket_ui::cam_carousel_idx(), -1, c_total);
                    id(camera_snapshot_art).release();
                    id(fetch_on_demand_camera).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  } else if (c_total > 1 && tp.x > pocket_ui::SCREEN_CX + 55) {
                    pocket_ui::cam_carousel_idx() = step_wrap(pocket_ui::cam_carousel_idx(), 1, c_total);
                    id(camera_snapshot_art).release();
                    id(fetch_on_demand_camera).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  } else {
                    id(fetch_on_demand_camera).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                } else if (tp.y >= 342 && tp.y <= 398) {
                  if (tp.x < pocket_ui::SCREEN_CX - 48) {
                    // Left Pill: Listen / Mute Toggle
                    pocket_ui::cam_listen_active() = !pocket_ui::cam_listen_active();
                    id(cam_intercom_action) = pocket_ui::cam_listen_active() ? "listen_start" : "listen_stop";
                    pocket_ui::cam_intercom_status() = pocket_ui::cam_listen_active() ? "LISTENING (ANC)" : "AUDIO MUTED";
                    id(cam_intercom_status_ms) = now_rel;
                    id(send_doorbell_intercom_cmd).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  } else if (tp.x <= pocket_ui::SCREEN_CX + 48) {
                    // Center Hero Pill: 1-Tap Hands-Free 2-Way Call (Start Call / End Call)
                    if (!pocket_ui::cam_call_active() && !pocket_ui::cam_intercom_ptt_active()) {
                      id(start_doorbell_call).execute();
                    } else {
                      id(stop_doorbell_call).execute();
                    }
                  } else {
                    // Right Pill: Open Doorbell Quick Reply & ANC Sheet
                    pocket_ui::cam_quick_reply_open() = true;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                } else {
                  id(fetch_on_demand_camera).execute();
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
              } else if (!gest.swipe_committed && id(gui_page) == 8 && id(stuff_subpage) == 11 &&
                         gest.max_travel < 24 && gest.last_y >= 80 && gest.last_y < 404) {
                int slot_idx = get_5slot_index(tp, pocket_ui::SCREEN_CX - 145, pocket_ui::SCREEN_CX + 145);
                if (slot_idx >= 0 && slot_idx <= 4) {
                  std::string m_slots[pocket_ui::MAX_MACRO_ITEMS], m_names[pocket_ui::MAX_MACRO_ITEMS], m_acts[pocket_ui::MAX_MACRO_ITEMS];
                  int m_total = pocket_ui::parse_custom_bindings_list(id(ha_latter_custom_bindings_summary).state, m_slots, m_names, m_acts);
                  int item_idx = pocket_ui::macro_browse_page() * 5 + slot_idx;
                  if (item_idx >= 0 && item_idx < m_total) {
                    id(macro_target_slot) = m_slots[item_idx];
                    id(macro_feedback_str) = std::string("Triggered: ") + m_names[item_idx];
                    id(macro_feedback_ms) = now_rel;
                    id(trigger_latter_macro).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                }
              } else if (!gest.swipe_committed && id(gui_page) == 8 && id(stuff_subpage) == 9 &&
                         pocket_ui::cal_detail_mode() == 0 && !pocket_ui::cal_quick_add_open() &&
                         gest.max_travel < 24 && gest.last_y >= 80 && gest.last_y < 404) {
                int slot_idx = get_5slot_index(tp, 75, 385);
                if (slot_idx >= 0) {
                  std::string s_name = (slot_idx == 0) ? id(cal_slot_1_name) : (slot_idx == 1) ? id(cal_slot_2_name) : (slot_idx == 2) ? id(cal_slot_3_name) : (slot_idx == 3) ? id(cal_slot_4_name) : id(cal_slot_5_name);
                  std::string s_id   = (slot_idx == 0) ? id(cal_slot_1_id)   : (slot_idx == 1) ? id(cal_slot_2_id)   : (slot_idx == 2) ? id(cal_slot_3_id)   : (slot_idx == 3) ? id(cal_slot_4_id)   : id(cal_slot_5_id);
                  if (!s_name.empty()) {
                    pocket_ui::parse_calendar_slot_meta(
                        s_name, s_id,
                        pocket_ui::cal_detail_time(),
                        pocket_ui::cal_detail_title(),
                        pocket_ui::cal_detail_location(),
                        pocket_ui::cal_detail_map_url());
                    pocket_ui::cal_detail_mode() = 1;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                }
              }
            }
            gest.active = false;
            ESP_LOGI("touch", "<<< Touch Released (page=%d)", id(gui_page));
