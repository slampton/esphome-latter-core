                      last_stuff_tap = now_stuff;
                      if (id(alarm_snooze_until) > 0 && (id(alarm_ringing_idx) == card_i || id(alarm_ringing_idx) == 0)) {
                        id(alarm_snooze_until) = 0;
                        pocket_ui::schedule_disp_update(&id(disp1));
                        return;
                      }
                      if (touch.x >= 298) {
                        if (card_i == 1) {
                          id(alarm1_enabled) = !id(alarm1_enabled);
                          if (!id(alarm1_enabled) && id(alarm_ringing_idx) <= 1) id(alarm_snooze_until) = 0;
                        } else if (card_i == 2) {
                          id(alarm2_enabled) = !id(alarm2_enabled);
                          if (!id(alarm2_enabled) && id(alarm_ringing_idx) == 2) id(alarm_snooze_until) = 0;
                        } else {
                          id(alarm3_enabled) = !id(alarm3_enabled);
                          if (!id(alarm3_enabled) && id(alarm_ringing_idx) == 3) id(alarm_snooze_until) = 0;
                        }
                      } else {
                        id(alarm_edit_idx) = card_i;
                      }
                      pocket_ui::schedule_disp_update(&id(disp1));
                    }
                    return;
                  }
                } else {
                  int edit_idx = id(alarm_edit_idx);
                  int& cur_h = (edit_idx == 3) ? id(alarm3_hour) : ((edit_idx == 2) ? id(alarm2_hour) : id(alarm1_hour));
                  int& cur_m = (edit_idx == 3) ? id(alarm3_minute) : ((edit_idx == 2) ? id(alarm2_minute) : id(alarm1_minute));
                  int& cur_rec = (edit_idx == 3) ? id(alarm3_recurrence) : ((edit_idx == 2) ? id(alarm2_recurrence) : id(alarm1_recurrence));

                  if (touch.y >= 204 && touch.y <= 276) {
                    if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_RAPID) {
                      int st_col = pocket_ui::hit_4col_stepper(touch.x);
                      if (st_col >= 0) {
                        last_stuff_tap = now_stuff;
                        if (st_col == 0) cur_h = (cur_h - 1 + 24) % 24;
                        else if (st_col == 1) cur_h = (cur_h + 1) % 24;
                        else if (st_col == 2) cur_m = (cur_m - 5 + 60) % 60;
                        else if (st_col == 3) cur_m = (cur_m + 5 + 60) % 60;
                        pocket_ui::schedule_disp_update(&id(disp1));
                        return;
                      }
                    }
                  }

                  if (touch.y >= 280 && touch.y <= 372 && touch.x >= 90 && touch.x <= 376) {
                    if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_stuff_tap = now_stuff;
                      cur_rec = (cur_rec + 1) % 4;
                      pocket_ui::schedule_disp_update(&id(disp1));
                    }
                    return;
                  }
                }
              } else if (id(stuff_subpage) == 3) {
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    if (pocket_ui::tools_direct_home()) {
                      pocket_ui::tools_direct_home() = false;
                      id(stuff_subpage) = 0;
                      id(gui_page) = 1;
                      id(home_subpage) = 0;
                    } else {
                      id(stuff_subpage) = 0;
                    }
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }

                static uint32_t last_dial_tap = 0;
                static uint32_t last_lap_tap = 0;
                static uint32_t last_rst_tap = 0;
                uint32_t now_chrono_tap = millis();

                if (touch.y >= 280 && touch.y < 396) {
                  if (touch.x < pocket_ui::SCREEN_CX) {
                    if (now_chrono_tap - last_lap_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_lap_tap = now_chrono_tap;
                      if (id(stopwatch_running)) id(stopwatch_lap_ms) = now_chrono_tap - id(stopwatch_start_time);
                      else if (id(stopwatch_elapsed_ms) > 0) id(stopwatch_lap_ms) = id(stopwatch_elapsed_ms);
                      pocket_ui::schedule_disp_update(&id(disp1));
                    }
                    return;
                  } else {
                    if (now_chrono_tap - last_rst_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_rst_tap = now_chrono_tap;
                      id(stopwatch_running) = false;
                      id(stopwatch_elapsed_ms) = 0;
                      id(stopwatch_lap_ms) = 0;
                      pocket_ui::schedule_disp_update(&id(disp1));
                    }
                    return;
                  }
                } else if (touch.y >= 45 && touch.y < 280 && touch.x >= 65 && touch.x <= 401) {
                  if (now_chrono_tap - last_dial_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_dial_tap = now_chrono_tap;
                    if (!id(stopwatch_running)) {
                      id(stopwatch_running) = true;
                      id(stopwatch_start_time) = now_chrono_tap - id(stopwatch_elapsed_ms);
                      id(sleep_start_time) = 0;
                    } else {
                      id(stopwatch_running) = false;
                      id(stopwatch_elapsed_ms) = now_chrono_tap - id(stopwatch_start_time);
                    }
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
              } else if (id(stuff_subpage) == 4) {
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(stuff_subpage) = 0;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                if (touch.y >= 385) return;
                if (!id(dice_anim_active)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(dice_anim_active) = true;
                    id(dice_anim_start_ms) = millis();
                    id(dice_val_d6) = (esp_random() % 6) + 1;
                    id(dice_val_d6_2) = (esp_random() % 6) + 1;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                }
              } else if (id(stuff_subpage) == 5) {
                if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_stuff_tap = now_stuff;
                  id(stuff_subpage) = 0;
                  id(sync_display_brightness).execute();
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
                return;
              } else if (id(stuff_subpage) == 6) {
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(stuff_subpage) = 0;
                    id(calc_entry) = "0";
                    id(calc_history) = "";
                    id(calc_prev_val) = 0.0f;
                    id(calc_op) = 0;
                    id(calc_new_entry) = true;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                if (touch.x >= pocket_ui::SCREEN_CX - 165 && touch.x <= pocket_ui::SCREEN_CX + 165 && touch.y >= 104 && touch.y < 412) {
                  int c = pocket_ui::hit_4col_calc(touch.x);
                  int r = (touch.y < 159) ? 0 : ((touch.y < 215) ? 1 : ((touch.y < 271) ? 2 : ((touch.y < 327) ? 3 : 4)));

                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_RAPID) {
                    last_stuff_tap = now_stuff;

                    auto compute_op = [](double a, double b, int op) -> double {
                      if (op == 1) return a + b;
                      if (op == 2) return a - b;
                      if (op == 3) return a * b;
                      if (op == 4) return (b != 0.0) ? (a / b) : NAN;
                      return b;
                    };

                    auto op_to_str = [](int op) -> const char* {
                      if (op == 1) return "+";
                      if (op == 2) return "-";
                      if (op == 3) return "x";
                      if (op == 4) return "/";
                      return "";
                    };

                    auto format_calc_num = [](double v) -> std::string {
                      if (std::isnan(v) || std::isinf(v)) return "Error";
                      char b[32];
                      if (std::abs(v - std::round(v)) < 1e-7 && std::abs(v) < 1e9) {
                        snprintf(b, sizeof(b), "%lld", (long long)std::round(v));
                        return std::string(b);
                      }
                      snprintf(b, sizeof(b), "%.8g", v);
                      return std::string(b);
                    };

                    if (r == 0 && c == 0) {
                      id(calc_entry) = "0";
                      id(calc_history) = "";
                      id(calc_prev_val) = 0.0f;
                      id(calc_op) = 0;
                      id(calc_new_entry) = true;
                    } else if (r == 0 && c == 1) {
                      if (id(calc_entry) != "0" && id(calc_entry) != "Error") {
                        if (id(calc_entry)[0] == '-') id(calc_entry) = id(calc_entry).substr(1);
                        else id(calc_entry) = "-" + id(calc_entry);
                      }
                    } else if (r == 0 && c == 2) {
                      double cur = 0.0; sscanf(id(calc_entry).c_str(), "%lf", &cur);
                      if (id(calc_op) == 1 || id(calc_op) == 2) {
                        double pct_val = (double)id(calc_prev_val) * (cur / 100.0);
                        id(calc_entry) = format_calc_num(pct_val);
                        id(calc_new_entry) = false;
                      } else {
                        double pct_val = cur / 100.0;
                        id(calc_entry) = format_calc_num(pct_val);
                        id(calc_new_entry) = true;
                      }
                    } else if (r == 4 && c == 2) {
                      if (!id(calc_new_entry) && id(calc_entry) != "Error") {
                        if (id(calc_entry).length() > 1) {
                          id(calc_entry).pop_back();
                          if (id(calc_entry) == "-") id(calc_entry) = "0";
                        } else {
                          id(calc_entry) = "0";
                        }
                      }
                    } else if (c == 3) {
                      int new_op = 0;
                      if (r == 0) new_op = 4;
                      else if (r == 1) new_op = 3;
                      else if (r == 2) new_op = 2;
                      else if (r == 3) new_op = 1;
                      else if (r == 4) new_op = 5;

                      double cur = (double)id(calc_prev_val); if (!id(calc_entry).empty()) { sscanf(id(calc_entry).c_str(), "%lf", &cur); }

                      if (new_op == 5) {
                        if (id(calc_op) != 0) {
                          std::string operand_str = id(calc_entry).empty() ? format_calc_num(cur) : id(calc_entry);
                          id(calc_history) = format_calc_num(id(calc_prev_val)) + " " + op_to_str(id(calc_op)) + " " + operand_str + " =";
                          double res = compute_op(id(calc_prev_val), cur, id(calc_op));
                          id(calc_entry) = format_calc_num(res);
                          id(calc_op) = 0;
                          id(calc_new_entry) = true;
                        }
                      } else {
                        if (id(calc_op) != 0 && !id(calc_new_entry) && !id(calc_entry).empty()) {
                          double res = compute_op(id(calc_prev_val), cur, id(calc_op));
                          id(calc_prev_val) = (float)res;
                        } else if (!id(calc_entry).empty()) {
                          id(calc_prev_val) = (float)cur;
                        }
                        id(calc_op) = new_op;
                        id(calc_new_entry) = true;
                        id(calc_history) = format_calc_num(id(calc_prev_val)) + " " + op_to_str(id(calc_op));
                        id(calc_entry) = format_calc_num(id(calc_prev_val));
                      }
                    } else if (r == 4 && c == 1) {
                      if (id(calc_new_entry) || id(calc_entry).empty()) {
                        id(calc_entry) = "0.";
                        id(calc_new_entry) = false;
                      } else if (id(calc_entry).find('.') == std::string::npos) {
                        id(calc_entry) += ".";
                      }
                    } else {
                      char digit = '0';
                      if (r == 4 && c == 0) digit = '0';
                      else if (r == 3 && c == 0) digit = '1';
                      else if (r == 3 && c == 1) digit = '2';
                      else if (r == 3 && c == 2) digit = '3';
                      else if (r == 2 && c == 0) digit = '4';
                      else if (r == 2 && c == 1) digit = '5';
                      else if (r == 2 && c == 2) digit = '6';
                      else if (r == 1 && c == 0) digit = '7';
                      else if (r == 1 && c == 1) digit = '8';
                      else if (r == 1 && c == 2) digit = '9';

                      if (id(calc_new_entry) || id(calc_entry).empty()) {
                        id(calc_entry) = std::string(1, digit);
                        id(calc_new_entry) = false;
                      } else {
                        if (id(calc_entry) == "0") id(calc_entry) = std::string(1, digit);
                        else if (id(calc_entry).length() < 9) id(calc_entry) += digit;
                      }
                    }

                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
              } else if (id(stuff_subpage) == 7) {
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(stuff_subpage) = 0;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
              } else if (id(stuff_subpage) == 8) {
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(stuff_subpage) = 0;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                if (touch.y >= 385) return;
                if (!id(coin_anim_active)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(coin_anim_active) = true;
                    id(coin_anim_start_ms) = millis();
                    id(coin_side) = (esp_random() % 2);
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                }
              } else if (id(stuff_subpage) == 9) {
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    if (pocket_ui::cal_detail_mode() == 2) {
                      pocket_ui::cal_detail_mode() = 1;
                      id(camera_snapshot_art).release();
                      id(sync_wake_word_state).execute();
                    } else if (pocket_ui::cal_detail_mode() == 1) {
                      pocket_ui::cal_detail_mode() = 0;
                    } else if (pocket_ui::cal_quick_add_open()) {
                      pocket_ui::cal_quick_add_open() = false;
                    } else if (pocket_ui::tools_direct_home()) {
                      pocket_ui::tools_direct_home() = false;
                      id(stuff_subpage) = 0;
                      id(gui_page) = 1;
                      id(home_subpage) = 0;
                    } else {
                      id(stuff_subpage) = 0;
                    }
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                if (pocket_ui::cal_detail_mode() == 2) {
                  // Mode 2 (Interactive Map): +/- Zoom taps, Header Re-Center, and Swipe-to-Pan are handled on_release
                  return;
                }
                if (pocket_ui::cal_detail_mode() == 1) {
                  if (!pocket_ui::cal_detail_location().empty() &&
                      touch.y >= 330 && touch.y <= 390 && touch.x >= 110 && touch.x <= 356) {
                    if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_stuff_tap = now_stuff;
                      pocket_ui::cal_map_zoom() = 15;
                      pocket_ui::cal_map_pan_x() = 0;
                      pocket_ui::cal_map_pan_y() = 0;
                      pocket_ui::cal_detail_mode() = 2;
                      id(camera_snapshot_art).release();
                      id(fetch_calendar_map_snapshot).execute();
                      pocket_ui::schedule_disp_update(&id(disp1));
                    }
                  }
                  return;
                }
                if (pocket_ui::cal_quick_add_open()) {
                  int q_idx = get_5slot_index(touch, 85, 381);
                  if (q_idx >= 0 && q_idx <= 4 && (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON)) {
                    last_stuff_tap = now_stuff;
                    static constexpr const char *kQuickSummaries[5] = {
                      "Quick Reminder",
                      "Check-In / Task",
                      "Follow-Up Call",
                      "Errand / Pickup",
                      "Morning Reminder"
                    };
                    static constexpr int kQuickInMins[5] = {15, 30, 60, 180, 720};
                    id(cal_quick_summary) = kQuickSummaries[q_idx];
                    id(cal_quick_in_minutes) = kQuickInMins[q_idx];
                    id(cal_quick_duration_minutes) = 30;
                    pocket_ui::cal_quick_add_open() = false;
                    pocket_ui::cal_feedback_text() = std::string("Added: ") + kQuickSummaries[q_idx];
                    pocket_ui::cal_feedback_ms() = now_stuff;
                    id(create_calendar_quick_event).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                if (id(cal_browse_total_pages) > 1 && is_right_chevron_zone(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_RAPID) {
                    int delta = (touch.y < 220) ? -1 : 1;
                    int next_pg = std::max(1, std::min(id(cal_browse_total_pages), id(cal_browse_page) + delta));
                    if (next_pg != id(cal_browse_page)) {
                      last_stuff_tap = now_stuff;
                      id(cal_browse_page) = next_pg;
                      id(fetch_calendar_browse).execute();
                      pocket_ui::schedule_disp_update(&id(disp1));
                    }
                  }
                  return;
                }
                if (touch.y <= 78 && touch.x >= 110 && touch.x <= 356) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    pocket_ui::cal_quick_add_open() = true;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                if (id(cal_slot_1_name).empty() && touch.y >= 190 && touch.y <= 255 && touch.x >= 85 && touch.x <= 381) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    pocket_ui::cal_quick_add_open() = true;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                // Event Row Tap on Agenda List is handled on_release so vertical swiping never opens an event by mistake
                return;
              } else if (id(stuff_subpage) == 10) {
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(stuff_subpage) = 0;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                if (touch.y <= 72 && touch.x >= pocket_ui::SCREEN_CX - 120 && touch.x <= pocket_ui::SCREEN_CX + 120) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    pocket_ui::intercom_live_call_mode() = !pocket_ui::intercom_live_call_mode();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                int slot_idx = get_5slot_index(touch, pocket_ui::SCREEN_CX - 145, pocket_ui::SCREEN_CX + 145);
                if (slot_idx >= 0 && slot_idx <= 4 && (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON)) {
                  last_stuff_tap = now_stuff;
                  if (pocket_ui::intercom_live_call_mode()) {
                    std::string t_ids[5], t_lbls[5];
                    int cnt = pocket_ui::parse_intercom_targets_list(id(ha_latter_intercom_targets_summary).state, t_ids, t_lbls);
                    if (slot_idx == 4 && cnt < 5) {
                      id(cam_intercom_action) = "unlock_door";
                      id(cam_intercom_message) = "";
                      id(intercom_feedback_str) = "Unlocked Door / Gate";
                      id(intercom_feedback_ms) = now_stuff;
                      id(send_doorbell_intercom_cmd).execute();
                    } else if (slot_idx < cnt) {
                      id(cam_intercom_action) = "call_target";
                      id(cam_intercom_message) = t_ids[slot_idx];
                      id(intercom_feedback_str) = t_lbls[slot_idx];
                      id(intercom_feedback_ms) = now_stuff;
                      id(send_doorbell_intercom_cmd).execute();
                      pocket_ui::cam_quick_reply_open() = false;
                      id(stuff_subpage) = 12;
                      id(fetch_on_demand_camera).execute();
                      id(start_doorbell_call).execute();
                    }
                  } else {
                    static constexpr const char *kIntercomPresets[5] = {
                      "Dinner is ready!",
                      "Time to head out!",
                      "Kids, please come downstairs!",
                      "Could use a hand in here!",
                      "Movie time in the Living Room!"
                    };
                    id(intercom_message_str) = kIntercomPresets[slot_idx];
                    id(intercom_feedback_str) = std::string("Sent: ") + kIntercomPresets[slot_idx];
                    id(intercom_feedback_ms) = now_stuff;
                    id(send_intercom_broadcast).execute();
                  }
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
              } else if (id(stuff_subpage) == 11) {
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(stuff_subpage) = 0;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                std::string m_slots[pocket_ui::MAX_MACRO_ITEMS], m_names[pocket_ui::MAX_MACRO_ITEMS], m_acts[pocket_ui::MAX_MACRO_ITEMS];
                int m_total = pocket_ui::parse_custom_bindings_list(id(ha_latter_custom_bindings_summary).state, m_slots, m_names, m_acts);
                int m_pages = std::max(1, (m_total + 4) / 5);
                if (m_pages > 1 && is_right_chevron_zone(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_RAPID) {
                    int delta = (touch.y < 220) ? -1 : 1;
                    int next_pg = std::max(0, std::min(m_pages - 1, pocket_ui::macro_browse_page() + delta));
                    if (next_pg != pocket_ui::macro_browse_page()) {
                      last_stuff_tap = now_stuff;
                      pocket_ui::macro_browse_page() = next_pg;
                      pocket_ui::schedule_disp_update(&id(disp1));
                    }
                  }
                  return;
                }
                return;
              } else if (id(stuff_subpage) == 12) {
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    if (pocket_ui::cam_quick_reply_open()) {
                      pocket_ui::cam_quick_reply_open() = false;
                      pocket_ui::schedule_disp_update(&id(disp1));
                      return;
                    }
                    if (pocket_ui::cam_call_active() || pocket_ui::cam_intercom_ptt_active() || pocket_ui::cam_listen_active()) {
                      id(stop_doorbell_call).execute();
                    }
                    if (pocket_ui::tools_direct_home()) {
                      pocket_ui::tools_direct_home() = false;
                      id(stuff_subpage) = 0;
                      id(gui_page) = 1;
                      id(home_subpage) = 0;
                    } else {
                      id(stuff_subpage) = 0;
                    }
                    id(camera_snapshot_art).release();
                    id(sync_wake_word_state).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                // Camera Carousel horizontal swipe & release-tap handled in on_update & on_release
                return;
              }
            }

    on_update:
      then:
        - lambda: |-
            if (touches.empty()) return;
            auto &gest = pocket_ui::touch_gesture();
            if (!gest.active) return;
            uint32_t now_u = millis();
            gest.last_touch_ms = now_u;
            if (touches[0].x != gest.last_x || touches[0].y != gest.last_y) {
              gest.sample_count++;
            }
            gest.last_x = touches[0].x;
            gest.last_y = touches[0].y;
            int dx = gest.last_x - gest.start_x;
            int dy = gest.last_y - gest.start_y;
            int cur_travel = std::abs(dx) + std::abs(dy);
            if (cur_travel > gest.max_travel) {
              gest.max_travel = cur_travel;
            }

            int cur_ctx_u = pocket_ui::compute_touch_context(
                id(gui_page), id(home_subpage), id(music_overlay_mode), id(active_game),
                id(system_menu_mode), id(sky_weather_subpage), id(room_subpage),
                id(remote_subpage), id(stuff_subpage));
            if (cur_ctx_u != gest.start_context) {
              // Page or subpage changed during on_touch -> ignore remaining motion of this touch!
              return;
            }

            if (id(gui_page) == 4 && id(system_menu_mode) == 13 && (now_u - pocket_ui::last_disp_update_ms() >= 42U)) {
              int dx_w = gest.last_x - pocket_ui::SCREEN_CX;
              int dy_w = gest.last_y - 180;
              float dist_w = std::sqrt(static_cast<float>(dx_w * dx_w + dy_w * dy_w));
              if (dist_w >= 46.0f && dist_w <= 168.0f) {
                float hue = std::atan2(static_cast<float>(dy_w), static_cast<float>(dx_w)) * (180.0f / 3.14159265f);
                if (hue < 0.0f) hue += 360.0f;
                float sat = std::max(0.35f, std::min(1.0f, 0.35f + ((dist_w - 58.0f) / 90.0f) * 0.65f));
                pocket_ui::color_wheel_hue_deg() = hue;
                pocket_ui::color_wheel_sat() = sat;
                esphome::Color c = pocket_ui::hsv_to_rgb(hue / 360.0f, sat, 1.0f);
                id(custom_theme_rgb) = (static_cast<uint32_t>(c.r) << 16) |
                                       (static_cast<uint32_t>(c.g) << 8) |
                                       static_cast<uint32_t>(c.b);
                pocket_ui::apply_custom_rgb_harmony(id(custom_theme_rgb), id(theme_primary), id(theme_secondary));
                pocket_ui::schedule_disp_update(&id(disp1));
              }
              return;
            }



            if (gest.swipe_committed) return;
            if (now_u - gest.last_swipe_ms < 200U) return;

            // 1. UNIVERSAL BOTTOM HOME BAR SWIPE-UP TO EXIT TO HOME (Top-Level Apps ONLY, start_y >= 412)
            bool tools_direct_root = (id(gui_page) == 8 && pocket_ui::tools_direct_home() &&
                                      ((id(stuff_subpage) == 1 && pocket_ui::timer_view_slot() == 0) ||
                                       (id(stuff_subpage) == 2 && id(alarm_edit_idx) == 0) ||
                                       (id(stuff_subpage) == 3)));
            bool can_swipe_home = (id(gui_page) != 1) &&
                                  !(id(gui_page) == 4 && id(system_menu_mode) > 0) &&
                                  !(id(gui_page) == 3 && id(active_game) > 0) &&
                                  !(id(gui_page) == 2 && id(music_overlay_mode) > 0) &&
                                  !(id(gui_page) == 6 && (id(room_subpage) > 0 || id(room_browse_mode) == "areas")) &&
                                  !(id(gui_page) == 7 && id(remote_subpage) > 0) &&
                                  !(id(gui_page) == 8 && id(stuff_subpage) > 0 && !tools_direct_root) &&
                                  !(id(alarm_ringing) || id(timer_ringing) || id(find_my_active));

            if (can_swipe_home && gest.start_y >= (pocket_ui::SCREEN_H - 54) && dy <= -26 && std::abs(dy) > std::abs(dx)) {
              gest.swipe_committed = true;
              gest.last_swipe_ms = now_u;
              if (id(active_game) > 0) id(stop_alarm_sound).execute();
              pocket_ui::tools_direct_home() = false;
              pocket_ui::timer_view_slot() = 0;
              id(alarm_edit_idx) = 0;
              pocket_ui::cal_quick_add_open() = false;
              id(gui_page) = 1;
              id(home_subpage) = 0;
              id(music_overlay_mode) = 0; id(system_menu_mode) = 0; id(active_game) = 0; id(music_direct_nav) = false;
              id(sleep_menu_page) = 1; id(display_menu_page) = 1; id(system_dashboard_page) = 1; id(menu_scroll_active) = false;
              id(music_hud_active) = false; id(remote_subpage) = 0; id(stuff_subpage) = 0; id(stuff_menu_page) = 0;
              id(sky_weather_subpage) = 0;
              ESP_LOGI("touch", "Swipe-Up Home Bar -> Home");
              pocket_ui::schedule_disp_update(&id(disp1));
              return;
            }

            // 2. HOME SCREEN (PAGE 1) 4-ICON APP DOCK HORIZONTAL SWIPE (y >= 320)
            if (id(gui_page) == 1 && id(home_subpage) == 0 && gest.start_y >= 320) {
              if (std::abs(dx) >= 22 && std::abs(dx) >= std::abs(dy)) {
                int dock_apps[8] = {0, 0, 0, 0, 0, 0, 0, 0};
                int dock_count = pocket_ui::collect_home_dock_apps(
                    id(home_dock_music_switch).state, id(home_dock_remote_switch).state,
                    id(home_dock_tools_switch).state, id(home_dock_games_switch).state,
                    dock_apps, id(home_dock_room_switch).state, id(home_dock_alarm_switch).state);
                int total_pages = (dock_count + 3) / 4;
                if (total_pages > 1) {
                  gest.swipe_committed = true;
                  gest.last_swipe_ms = now_u;
                  if (dx < 0) {
                    pocket_ui::home_dock_page() = (pocket_ui::home_dock_page() + 1) % total_pages;
                  } else {
                    pocket_ui::home_dock_page() = (pocket_ui::home_dock_page() + total_pages - 1) % total_pages;
                  }
                  ESP_LOGI("touch", "Home Dock Swipe (dx=%d) -> dock_page=%d", dx, pocket_ui::home_dock_page());
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
                return;
              }
            }

            // 3. MUSIC LIBRARY CATEGORIES (PAGE 2, mode == 2) VERTICAL SWIPE
            //    (Modes 1 & 3 evaluate velocity-scaled multi-page flicks on_release!)
            if (id(gui_page) == 2 && !id(menu_scroll_active) && id(music_overlay_mode) == 2 && gest.start_y < 404) {
              if (std::abs(dy) >= 26 && std::abs(dy) > std::abs(dx)) {
                gest.swipe_committed = true;
                gest.last_swipe_ms = now_u;
                int target_pg = (dy < 0) ? 2 : 1;
                if (target_pg != id(music_category_page)) {
                  id(menu_scroll_active) = true;
                  id(menu_scroll_dir) = (target_pg == 2) ? 1 : -1;
                  id(menu_scroll_target_page) = target_pg;
                  id(menu_scroll_step) = 0;
                  id(menu_scroll_transition).execute();
                }
                return;
              }
            }

            // 4. GAMES LAUNCHER (PAGE 3, active_game == 0) HORIZONTAL CAROUSEL SWIPE
            if (id(gui_page) == 3 && id(active_game) == 0 && !id(menu_scroll_active) && gest.start_y < 410) {
              if (std::abs(dx) >= 26 && std::abs(dx) > std::abs(dy)) {
                gest.swipe_committed = true;
                gest.last_swipe_ms = now_u;
                int dir = (dx < 0) ? 1 : -1;
                id(menu_scroll_active) = true;
                id(menu_scroll_dir) = dir;
                id(menu_scroll_target_page) = step_wrap(id(game_carousel_idx), dir, 4);
                id(menu_scroll_step) = 0;
                ESP_LOGI("touch", "Games Carousel Swipe (dx=%d) -> game=%d", dx, id(menu_scroll_target_page));
                id(menu_scroll_transition).execute();
                return;
              }
            }

            // 5. SYSTEM MENU (PAGE 4, modes 0, 1, 2) VERTICAL PAGE SWIPE (Up = Page 2, Down = Page 1)
            if (id(gui_page) == 4 && !id(menu_scroll_active) &&
                (id(system_menu_mode) == 0 || id(system_menu_mode) == 1 || id(system_menu_mode) == 2) &&
                gest.start_y < 404) {
              if (std::abs(dy) >= 26 && std::abs(dy) > std::abs(dx)) {
                int cur_pg = (id(system_menu_mode) == 0) ? id(system_dashboard_page)
                           : ((id(system_menu_mode) == 1) ? id(sleep_menu_page) : id(display_menu_page));
                int target_pg = (dy < 0) ? 2 : 1;
                gest.swipe_committed = true;
                gest.last_swipe_ms = now_u;
                if (target_pg != cur_pg) {
                  id(menu_scroll_active) = true;
                  id(menu_scroll_dir) = (target_pg == 2) ? 1 : -1;
                  id(menu_scroll_target_page) = target_pg;
                  id(menu_scroll_step) = 0;
                  ESP_LOGI("touch", "System Menu Vertical Swipe (dy=%d) -> page=%d", dy, target_pg);
                  id(menu_scroll_transition).execute();
                }
                return;
              }
            }

            // 6. SKY & WEATHER (PAGE 5) HORIZONTAL SUBPAGE SWIPE
            if (id(gui_page) == 5 && gest.start_y < 410) {
              if (std::abs(dx) >= 30 && std::abs(dx) > std::abs(dy)) {
                gest.swipe_committed = true;
                gest.last_swipe_ms = now_u;
                if (dx < 0) {
                  id(sky_weather_subpage) = (id(sky_weather_subpage) + 1) % 4;
                } else {
                  id(sky_weather_subpage) = (id(sky_weather_subpage) + 3) % 4;
                }
                ESP_LOGI("touch", "Page 5 Horizontal Swipe (dx=%d) -> subpage=%d", dx, id(sky_weather_subpage));
                pocket_ui::schedule_disp_update(&id(disp1));
                return;
              }
            }

            // 7A. ROOM CONTROL (PAGE 6, SUBPAGE 2) LIGHT COLOR WHEEL & KELVIN LIVE DRAG
            if (id(gui_page) == 6 && id(room_subpage) == 2 && (now_u - pocket_ui::last_disp_update_ms() >= 45U)) {
              if (pocket_ui::light_insp_mode() == 0) {
                int dx_w = gest.last_x - pocket_ui::SCREEN_CX;
                int dy_w = gest.last_y - 212;
                float dist_w = std::sqrt(static_cast<float>(dx_w * dx_w + dy_w * dy_w));
                if (dist_w >= 44.0f && dist_w <= 154.0f) {
                  gest.swipe_committed = true;
                  float hue = std::atan2(static_cast<float>(dy_w), static_cast<float>(dx_w)) * (180.0f / 3.14159265f);
                  if (hue < 0.0f) hue += 360.0f;
                  float sat = std::max(0.35f, std::min(1.0f, 0.35f + ((dist_w - 66.0f) / 68.0f) * 0.65f));
                  pocket_ui::light_insp_hue_deg() = hue;
                  pocket_ui::light_insp_sat() = sat;
                  esphome::Color c = pocket_ui::hsv_to_rgb(hue / 360.0f, sat, 1.0f);
                  uint32_t rgb_v = (static_cast<uint32_t>(c.r) << 16) | (static_cast<uint32_t>(c.g) << 8) | static_cast<uint32_t>(c.b);
                  pocket_ui::room_color_hex_param() = pocket_ui::format_hex_rgb(rgb_v); id(room_target_code) = pocket_ui::room_color_hex_param();
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
              } else {
                if (gest.start_y >= 120 && gest.start_y <= 204 && gest.last_x >= 84 && gest.last_x <= 382) {
                  gest.swipe_committed = true;
                  int k_val = 2700 + ((gest.last_x - 92) * (6500 - 2700)) / 264;
                  pocket_ui::light_insp_kelvin() = std::max(2700, std::min(6500, (k_val / 100) * 100));
                  pocket_ui::schedule_disp_update(&id(disp1));
                } else if (gest.start_y >= 218 && gest.start_y <= 298 && gest.last_x >= 84 && gest.last_x <= 382) {
                  gest.swipe_committed = true;
                  int b_val = ((gest.last_x - 85) * 100) / 296;
                  pocket_ui::light_insp_bri_pct() = std::max(5, std::min(100, ((b_val + 2) / 5) * 5));
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
              }
              return;
            }

            // 7. ROOM CONTROL (PAGE 6) HORIZONTAL CATEGORY SWIPE (Just like Sky & Weather!) & VERTICAL LIST SWIPE
            if (id(gui_page) == 6 && id(room_subpage) == 0 && gest.start_y > 88 && gest.start_y < 408) {
              if (std::abs(dx) >= 30 && std::abs(dx) > std::abs(dy)) {
                std::string cats[7];
                int cat_cnt = pocket_ui::collect_room_categories(id(room_show_all_category_switch).state, cats);
                if (cat_cnt > 1) {
                  gest.swipe_committed = true;
                  gest.last_swipe_ms = now_u;
                  int cur_i = 0;
                  for (int i = 0; i < cat_cnt; i++) {
                    if (cats[i] == id(room_domain_filter)) { cur_i = i; break; }
                  }
                  int next_i = (dx < 0) ? ((cur_i + 1) % cat_cnt) : ((cur_i + cat_cnt - 1) % cat_cnt);
                  id(room_domain_filter) = cats[next_i];
                  // Keep the 4-icon bottom category dock window synced with the active category!
                  pocket_ui::room_cat_dock_page() = (next_i >= 4) ? 1 : 0;
                  id(room_browse_mode) = "entities";
                  id(room_browse_page) = 1;
                  id(fetch_room_browse).execute();
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
                return;
              }
            }
            if (id(gui_page) == 6 && gest.start_y > 88 && gest.start_y < 324) {
              if (std::abs(dy) >= 26 && std::abs(dy) > std::abs(dx)) {
                gest.swipe_committed = true;
                gest.last_swipe_ms = now_u;
                int delta = (dy < 0) ? 1 : -1;
                if (id(room_subpage) == 1 && id(room_area_total_pages) > 1) {
                  int next_pg = std::max(1, std::min(id(room_area_total_pages), id(room_area_page) + delta));
                  if (next_pg != id(room_area_page)) {
                    id(room_area_page) = next_pg;
                    id(fetch_room_areas_browse).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                } else if (id(room_subpage) == 0 && id(room_browse_total_pages) > 1) {
                  int next_pg = std::max(1, std::min(id(room_browse_total_pages), id(room_browse_page) + delta));
                  if (next_pg != id(room_browse_page)) {
                    id(room_browse_page) = next_pg;
                    id(fetch_room_browse).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                }
                return;
              }
            }

            // 7B. REMOTE CONTROL (PAGE 7, SUBPAGE 1) VERTICAL LIST SWIPE (UP TO 10 REMOTES)
            if (id(gui_page) == 7 && id(remote_subpage) == 1 && gest.start_y > 140 && gest.start_y < 404) {
              if (std::abs(dy) >= 26 && std::abs(dy) > std::abs(dx)) {
                const std::string rem_ents_u[4] = {
                  id(remote_slot_0_ent), id(remote_slot_1_ent),
                  id(remote_slot_2_ent), id(remote_slot_3_ent)
                };
                int valid_slots_u[pocket_ui::MAX_REMOTE_SLOTS] = {0};
                int valid_cnt_u = pocket_ui::collect_configured_remote_slots(rem_ents_u, valid_slots_u);
                int total_pg_u = std::max(1, (valid_cnt_u + 3) / 4);
                if (total_pg_u > 1) {
                  gest.swipe_committed = true;
                  gest.last_swipe_ms = now_u;
                  int delta = (dy < 0) ? 1 : -1;
                  int next_pg = std::max(0, std::min(total_pg_u - 1, pocket_ui::remote_control_page() + delta));
                  if (next_pg != pocket_ui::remote_control_page()) {
                    pocket_ui::remote_control_page() = next_pg;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                }
                return;
              }
            }

            // 8. TOOLS SUITE (PAGE 8) LAUNCHER (subpage 0), CALENDAR (subpage 9) & MACROS (subpage 11) VERTICAL SWIPE
            if (id(gui_page) == 8 && !id(menu_scroll_active) && gest.start_y < 404) {
              if (id(stuff_subpage) == 0 && std::abs(dy) >= 26 && std::abs(dy) > std::abs(dx)) {
                gest.swipe_committed = true;
                gest.last_swipe_ms = now_u;
                int target_pg = (dy < 0) ? 1 : 0;
                if (target_pg != id(stuff_menu_page)) {
                  id(menu_scroll_active) = true;
                  id(menu_scroll_dir) = (target_pg == 1) ? 1 : -1;
                  id(menu_scroll_target_page) = target_pg;
                  id(menu_scroll_step) = 0;
                  id(menu_scroll_transition).execute();
                }
                return;
              } else if (id(stuff_subpage) == 9 && !pocket_ui::cal_quick_add_open() &&
                         id(cal_browse_total_pages) > 1 && std::abs(dy) >= 26 && std::abs(dy) > std::abs(dx)) {
                gest.swipe_committed = true;
                gest.last_swipe_ms = now_u;
                int delta = (dy < 0) ? 1 : -1;
                int next_pg = std::max(1, std::min(id(cal_browse_total_pages), id(cal_browse_page) + delta));
                if (next_pg != id(cal_browse_page)) {
                  id(cal_browse_page) = next_pg;
                  id(fetch_calendar_browse).execute();
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
                return;
              } else if (id(stuff_subpage) == 12 && !pocket_ui::cam_quick_reply_open() &&
                         std::abs(dx) >= 28 && std::abs(dx) > std::abs(dy)) {
                std::string c_ids[pocket_ui::MAX_CAMERA_SLOTS], c_names[pocket_ui::MAX_CAMERA_SLOTS];
                int c_total = pocket_ui::parse_cameras_summary_list(id(ha_latter_cameras_summary).state, c_ids, c_names);
                if (c_total > 1) {
                  gest.swipe_committed = true;
                  gest.last_swipe_ms = now_u;
                  int dir = (dx < 0) ? 1 : -1;
                  pocket_ui::cam_carousel_idx() = step_wrap(pocket_ui::cam_carousel_idx(), dir, c_total);
                  id(camera_snapshot_art).release();
                  id(fetch_on_demand_camera).execute();
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
                return;
              } else if (id(stuff_subpage) == 11 && std::abs(dy) >= 26 && std::abs(dy) > std::abs(dx)) {
                std::string m_slots[pocket_ui::MAX_MACRO_ITEMS], m_names[pocket_ui::MAX_MACRO_ITEMS], m_acts[pocket_ui::MAX_MACRO_ITEMS];
                int m_total = pocket_ui::parse_custom_bindings_list(id(ha_latter_custom_bindings_summary).state, m_slots, m_names, m_acts);
                int m_pages = std::max(1, (m_total + 4) / 5);
                if (m_pages > 1) {
                  gest.swipe_committed = true;
                  gest.last_swipe_ms = now_u;
                  int delta = (dy < 0) ? 1 : -1;
                  int next_pg = std::max(0, std::min(m_pages - 1, pocket_ui::macro_browse_page() + delta));
                  if (next_pg != pocket_ui::macro_browse_page()) {
                    pocket_ui::macro_browse_page() = next_pg;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                }
                return;
              }
            }

    on_release:
      then:
        - lambda: |-
            id(hud_wake_finger_released) = true;
            auto &gest = pocket_ui::touch_gesture();
            uint32_t now_rel = millis();
            gest.last_touch_ms = now_rel;
            int cur_ctx_rel = pocket_ui::compute_touch_context(
                id(gui_page), id(home_subpage), id(music_overlay_mode), id(active_game),
                id(system_menu_mode), id(sky_weather_subpage), id(room_subpage),
                id(remote_subpage), id(stuff_subpage));

            if (gest.active && cur_ctx_rel == gest.start_context) {
              int dx = gest.last_x - gest.start_x;
              int dy = gest.last_y - gest.start_y;
              uint32_t touch_dur_ms = now_rel - gest.start_ms;
              esphome::touchscreen::TouchPoint tp;
              tp.x = gest.last_x;
              tp.y = gest.last_y;

              bool tools_direct_root = (id(gui_page) == 8 && pocket_ui::tools_direct_home() &&
                                        ((id(stuff_subpage) == 1 && pocket_ui::timer_view_slot() == 0) ||
                                         (id(stuff_subpage) == 2 && id(alarm_edit_idx) == 0) ||
                                         (id(stuff_subpage) == 3)));
              bool can_swipe_home = (id(gui_page) != 1) &&
                                    !(id(gui_page) == 4 && id(system_menu_mode) > 0) &&
                                    !(id(gui_page) == 3 && id(active_game) > 0) &&
                                    !(id(gui_page) == 2 && id(music_overlay_mode) > 0) &&
                                    !(id(gui_page) == 6 && (id(room_subpage) > 0 || id(room_browse_mode) == "areas")) &&
                                    !(id(gui_page) == 7 && id(remote_subpage) > 0) &&
                                    !(id(gui_page) == 8 && id(stuff_subpage) > 0 && !tools_direct_root) &&
                                    !(id(alarm_ringing) || id(timer_ringing) || id(find_my_active));

              if (!gest.swipe_committed && can_swipe_home &&
                  gest.start_y >= (pocket_ui::SCREEN_H - 54) && dy <= -24 && std::abs(dy) > std::abs(dx)) {
                gest.swipe_committed = true;
                gest.last_swipe_ms = now_rel;
                if (id(active_game) > 0) id(stop_alarm_sound).execute();
                pocket_ui::tools_direct_home() = false;
                pocket_ui::timer_view_slot() = 0;
                id(alarm_edit_idx) = 0;
                pocket_ui::cal_quick_add_open() = false;
                id(gui_page) = 1;
                id(home_subpage) = 0;
                id(music_overlay_mode) = 0; id(system_menu_mode) = 0; id(active_game) = 0; id(music_direct_nav) = false;
                id(sleep_menu_page) = 1; id(display_menu_page) = 1; id(system_dashboard_page) = 1; id(menu_scroll_active) = false;
                id(music_hud_active) = false; id(remote_subpage) = 0; id(stuff_subpage) = 0; id(stuff_menu_page) = 0;
                id(sky_weather_subpage) = 0;
                pocket_ui::schedule_disp_update(&id(disp1));
              } else if (!gest.swipe_committed && id(gui_page) == 1 && id(home_subpage) == 0 && gest.start_y >= 320) {
                int dock_apps[8] = {0, 0, 0, 0, 0, 0, 0, 0};
                int dock_count = pocket_ui::collect_home_dock_apps(
                    id(home_dock_music_switch).state, id(home_dock_remote_switch).state,
                    id(home_dock_tools_switch).state, id(home_dock_games_switch).state,
                    dock_apps, id(home_dock_room_switch).state, id(home_dock_alarm_switch).state);
                int total_pages = (dock_count + 3) / 4;

                if (std::abs(dx) >= 18 && std::abs(dx) >= std::abs(dy) && total_pages > 1) {
                  gest.swipe_committed = true;
                  gest.last_swipe_ms = now_rel;
                  pocket_ui::home_dock_page() = (dx < 0)
                      ? ((pocket_ui::home_dock_page() + 1) % total_pages)
                      : ((pocket_ui::home_dock_page() + total_pages - 1) % total_pages);
                  pocket_ui::schedule_disp_update(&id(disp1));
                } else if (gest.max_travel < 24 && dock_count > 0) {
                  // Stationary Release-Tap on Dock Icon (generous y in [324..408] buffer; paging is strictly via horizontal swipe!)
                  if (gest.last_y >= 324 && gest.last_y <= 408) {
                    int win_xs[4] = {0, 0, 0, 0};
                    bool dummy_l = false, dummy_r = false;
                    pocket_ui::get_home_dock_window_xs(dock_count, pocket_ui::home_dock_page(), pocket_ui::SCREEN_CX, win_xs, dummy_l, dummy_r);
                    int start_idx = pocket_ui::get_home_dock_start_index(dock_count, pocket_ui::home_dock_page());
                    int vis_count = std::min(4, dock_count - start_idx);
                    int best_i = -1;
