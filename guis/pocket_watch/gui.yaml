      uint32_t end_draw_ms = millis();
      pocket_ui::last_disp_update_ms() = end_draw_ms;
      pocket_ui::record_ambient_frame_ms(end_draw_ms);


touchscreen:
  - id: !extend touch_screen
    on_touch:
      then:
        - lambda: |-
            ESP_LOGI("touch", ">>> Touch Down: x=%d y=%d page=%d", touch.x, touch.y, id(gui_page));
            if (id(is_hibernating)) {
              if (id(hibernate_countdown_val) > 0) {
                id(is_hibernating) = false;
                id(hibernate_countdown_val) = 0;
                id(wake_to_active_state).execute();
              }
              return;
            }
            uint32_t now_touch = millis();

            if (id(display_power_state) != 0 || !id(display_brightness).current_values.is_on()) {
              auto tw_mode = id(tap_wake_mode).current_option();
              if (tw_mode == "Disabled") return;
              #if !defined(CONFIG_IDF_TARGET_ESP32P4) && !(defined(POCKET_UI_NO_PMU_IRQ_PIN) && POCKET_UI_NO_PMU_IRQ_PIN)
              if (tw_mode == "Docked Only" && !id(usb_connected).state) return;
              #endif

              id(wake_to_active_state).execute();
              return;
            }

            if (now_touch - pocket_ui::last_screen_wake_ms() < TOUCH_DEBOUNCE_WAKE) {
              return;
            }

            static uint32_t last_touch_activity = 0;
            if (now_touch - last_touch_activity > 1000U) {
              last_touch_activity = now_touch;
              id(screen_sleep_timer).execute();
            }

            if (id(va_active) || !id(va_status_text).empty()) {
              pocket_ui::last_screen_wake_ms() = now_touch;
              id(cancel_voice_assistant).execute();
              return;
            }

            if (id(notif_active)) {
              pocket_ui::last_screen_wake_ms() = now_touch;
              bool has_notif_cam = (!id(notif_camera_url).empty() && id(notif_camera_url) != "none" &&
                                    id(notif_camera_url) != "unknown" && id(notif_camera_url) != "unavailable");
              if (has_notif_cam && ((touch.y >= 390 && touch.x < pocket_ui::SCREEN_CX) || touch.y < 380)) {
                // 1-Tap 'Answer' button (or camera image) -> Open live Camera view AND immediately start 2-Way Call with ANC!
                id(notif_active) = false;
                pocket_ui::tools_direct_home() = true;
                pocket_ui::cam_quick_reply_open() = false;
                id(gui_page) = 8;
                id(stuff_subpage) = 12;
                id(fetch_on_demand_camera).execute();
                id(start_doorbell_call).execute();
                pocket_ui::schedule_disp_update(&id(disp1));
                return;
              }
              id(dismiss_notification).execute();
              return;
            }

            if (id(alarm_ringing) || id(timer_ringing) || id(find_my_active)) {
              if (id(find_my_active)) {
                id(find_my_active) = false;
                pocket_ui::last_screen_wake_ms() = now_touch;
                id(stop_alarm_sound).execute();
                id(sync_display_brightness).execute();
                pocket_ui::schedule_disp_update(&id(disp1));
                return;
              }
              if (id(alarm_ringing)) {
                if (touch.y >= 268 && touch.y <= 324 && touch.x >= 100 && touch.x <= 366) {
                  auto now = id(ha_time).now();
                  if (now.is_valid()) {
                    id(alarm_snooze_until) = now.timestamp + 300;
                  } else {
                    id(alarm_snooze_until) = (now_touch / 1000) + 300;
                  }
                  id(alarm_ringing) = false;
                  pocket_ui::last_screen_wake_ms() = now_touch;
                  id(stop_alarm_sound).execute();
                  pocket_ui::schedule_disp_update(&id(disp1));
                  return;
                }
                if (touch.y >= 336 && touch.y <= 420 && touch.x >= 95 && touch.x <= 371) {
                  id(alarm_ringing) = false;
                  pocket_ui::last_screen_wake_ms() = now_touch;
                  id(stop_alarm_sound).execute();
                  pocket_ui::schedule_disp_update(&id(disp1));
                  return;
                }
              } else if (id(timer_ringing)) {
                if (touch.y >= 290 && touch.y <= 395 && touch.x >= 90 && touch.x <= 376) {
                  id(timer_ringing) = false;
                  pocket_ui::last_screen_wake_ms() = now_touch;
                  id(stop_alarm_sound).execute();
                  pocket_ui::schedule_disp_update(&id(disp1));
                  return;
                }
              }
              return;
            }

            auto &gest = pocket_ui::touch_gesture();
            gest.start_x = touch.x;
            gest.start_y = touch.y;
            gest.last_x = touch.x;
            gest.last_y = touch.y;
            gest.max_travel = 0;
            gest.sample_count = 1;
            gest.start_ms = now_touch;
            gest.last_touch_ms = now_touch;
            gest.start_page = id(gui_page);
            gest.start_context = pocket_ui::compute_touch_context(
                id(gui_page), id(home_subpage), id(music_overlay_mode), id(active_game),
                id(system_menu_mode), id(sky_weather_subpage), id(room_subpage),
                id(remote_subpage), id(stuff_subpage));
            gest.active = true;
            gest.swipe_committed = false;

            static uint32_t last_back_tap = 0;

            bool music_clean_touch = (id(gui_page) == 2 && id(music_overlay_mode) == 0 &&
                                      id(music_overlay_style).current_option() != "Always Visible" &&
                                      !id(music_hud_active));
            bool tools_direct_root = (id(gui_page) == 8 && pocket_ui::tools_direct_home() &&
                                      ((id(stuff_subpage) == 1 && pocket_ui::timer_view_slot() == 0) ||
                                       (id(stuff_subpage) == 2 && id(alarm_edit_idx) == 0) ||
                                       (id(stuff_subpage) == 3)));
            bool is_top_level_home_bar = (id(gui_page) != 1) &&
                                         !music_clean_touch &&
                                         !(id(gui_page) == 4 && id(system_menu_mode) > 0) &&
                                         !(id(gui_page) == 3 && id(active_game) > 0) &&
                                         !(id(gui_page) == 2 && id(music_overlay_mode) > 0) &&
                                         !(id(gui_page) == 6 && (id(room_subpage) > 0 || id(room_browse_mode) == "areas")) &&
                                         !(id(gui_page) == 7 && id(remote_subpage) > 0) &&
                                         !(id(gui_page) == 8 && id(stuff_subpage) > 0 && !tools_direct_root) &&
                                         !(id(alarm_ringing) || id(timer_ringing) || id(find_my_active));

            // Top-level apps use the bottom Swipe-Up Home Indicator Bar (taps at y >= 412 are ignored so they never misfire)
            if (is_top_level_home_bar && touch.y >= (pocket_ui::SCREEN_H - 54)) {
              return;
            }

            // UNIVERSAL RIGHT-FLANK CHEVRON TAP (x >= 384, y = 70..395)
            // Steps 1 page cleanly on single taps (or 2 pages on rapid-fire <260ms taps) without erratic jumps!
            if (is_right_chevron_zone(touch)) {
              static uint32_t last_rapid_chev_ms = 0;
              int sign = (touch.y < 220) ? -1 : 1;
              if (id(gui_page) == 2 && (id(music_overlay_mode) == 1 || id(music_overlay_mode) == 3) &&
                  id(music_browse_total_pages) > 1) {
                gest.swipe_committed = true;
                gest.last_swipe_ms = now_touch;
                pocket_ui::music_scroll_tap_lockout_until_ms() = now_touch + 550U;
                uint32_t gap_c = now_touch - last_rapid_chev_ms;
                if (gap_c >= 110U) {
                  last_rapid_chev_ms = now_touch;
                  int delta = sign * ((gap_c < 260U && id(music_browse_total_pages) >= 12) ? 2 : 1);
                  bool wrap_list = (id(music_overlay_mode) == 3) &&
                                   (id(selected_category_mode) == "artist" || id(selected_category_mode) == "album");
                  int next_pg = wrap_list
                      ? step_wrap_1based(id(music_browse_page), delta, id(music_browse_total_pages))
                      : std::max(1, std::min(id(music_browse_total_pages), id(music_browse_page) + delta));
                  if (next_pg != id(music_browse_page)) {
                    id(music_browse_page) = next_pg;
                    pocket_ui::last_music_page_req_ms() = now_touch;
                    id(menu_scroll_active) = true;
                    id(menu_scroll_dir) = sign;
                    id(menu_scroll_target_page) = next_pg;
                    id(menu_scroll_step) = 0;
                    id(menu_scroll_transition).execute();
                    id(fetch_music_browse).execute();
                  }
                }
                return;
              }
            }

            if (id(gui_page) == 1) {
              static uint32_t last_home_tap = 0;
              uint32_t now_hm = millis();

              if (id(home_subpage) == 1) {
                int slot_idx = get_5slot_index(touch, 90, 376);
                if (slot_idx >= 0 && slot_idx <= 4 && (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON)) {
                  last_home_tap = now_hm;
                  if (slot_idx == 0) id(home_dock_music_switch).toggle();
                  else if (slot_idx == 1) id(home_dock_room_switch).toggle();
                  else if (slot_idx == 2) id(home_dock_remote_switch).toggle();
                  else if (slot_idx == 3) id(home_dock_games_switch).toggle();
                  else if (slot_idx == 4) id(home_dock_tools_switch).toggle();
                  pocket_ui::home_dock_page() = 0;
                  pocket_ui::schedule_disp_update(&id(disp1));
                  return;
                }
                if (is_back_button(touch) || touch.y <= 72) {
                  if (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_home_tap = now_hm;
                    id(home_subpage) = 0;
                    id(gui_page) = 4;
                    id(system_menu_mode) = 0;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                return;
              }

              // Top Date Bar & Bottom Battery Chin are intentionally non-clickable on Page 1
              if (id(home_subpage) == 0) {

              // 3. Upper-Right Sun / Moon Celestial Shortcut at (360, 86) -> Open Sun (2) or Moon (3)
              if (id(home_weather_bg_switch).state && touch.x >= 312 && touch.y <= 124) {
                if (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_home_tap = now_hm;
                  std::string s_state = id(ha_sun_state).state;
                  std::string cond = id(ha_weather_condition).state;
                  bool is_night = (s_state == "below_horizon" || cond == "clear-night" || cond == "clearnight" || (cond.find("night") != std::string::npos));
                  apply_weather_sim_override(id(weather_sim_condition).current_option(), cond, is_night);
                  id(sky_weather_subpage) = is_night ? 3 : 2;
                  id(gui_page) = 5;
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
                return;
              }

              // 4. Hero Digital Clock Tap (y in [79..175], x in [95..355]) -> Open Full Clock Page (Page 0)
              if (touch.y >= 79 && touch.y <= 175 && touch.x >= 95 && touch.x <= 355) {
                if (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_home_tap = now_hm;
                  id(gui_page) = 0;
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
                return;
              }

              // 5. Weather Temperature & Condition Line Tap (y in [176..229], x in [70..396]) -> Open Sky & Weather (Current Conditions Subpage 0)
              if (touch.y >= 176 && touch.y <= 229 && touch.x >= 70 && touch.x <= 396) {
                if (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_home_tap = now_hm;
                  id(sky_weather_subpage) = 0;
                  id(gui_page) = 5;
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
                return;
              }

              }

              pocket_ui::HomeActivityItem act_items[8];
              bool is_rem_h = (id(active_speaker_entity) != "${local_player_id}");
              bool loc_play_h = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
              bool mus_play_h = pocket_ui::is_music_playing_effective(is_rem_h, loc_play_h, id(ha_target_state).state, now_hm);
              std::string m_title_h = (is_rem_h || id(track_title).state.empty() || id(track_title).state == "None")
                                          ? id(ha_track_title).state : id(track_title).state;
              std::string m_artist_h = (is_rem_h || id(track_artist).state.empty() || id(track_artist).state == "None")
                                           ? id(ha_track_artist).state : id(track_artist).state;
              auto now_t_hm = id(ha_time).now();
              int act_count = pocket_ui::collect_home_activities(
                  now_hm, id(is_24h_format),
                  id(stopwatch_running), id(stopwatch_start_time), id(stopwatch_elapsed_ms),
                  mus_play_h, m_title_h, m_artist_h,
                  id(alarm_snooze_until),
                  id(alarm1_hour), id(alarm1_minute), id(alarm1_enabled),
                  id(alarm2_hour), id(alarm2_minute), id(alarm2_enabled),
                  id(alarm3_hour), id(alarm3_minute), id(alarm3_enabled),
                  act_items,
                  now_t_hm.is_valid() ? now_t_hm.hour : -1,
                  now_t_hm.is_valid() ? now_t_hm.minute : -1,
                  id(ha_calendar_agenda_raw).state);

              auto handle_activity_item_action = [&](int item_i, bool is_inline_btn) {
                int kind = act_items[item_i].kind;
                int s_idx = act_items[item_i].slot_idx;
                if (is_inline_btn && kind != 5) {
                  if (kind == 1) {
                    auto *t_slots = pocket_ui::timer_slots();
                    int ti = (s_idx >= 0 && s_idx < 3) ? s_idx : 0;
                    auto &s = t_slots[ti];
                    if (s.running) {
                      s.running = false;
                      s.paused = true;
                      s.remaining_sec = (s.target_ms > now_hm) ? static_cast<int>((s.target_ms - now_hm + 999U) / 1000U) : 0;
                    } else {
                      s.running = true;
                      s.paused = false;
                      s.target_ms = now_hm + static_cast<uint32_t>(s.remaining_sec) * 1000U;
                    }
                    pocket_ui::sync_multi_timer_globals(
                        id(timer_running), id(timer_paused), id(timer_remaining_sec),
                        id(timer_duration_sec), id(timer_target_ms));
                  } else if (kind == 2) {
                    if (!id(stopwatch_running)) {
                      id(stopwatch_running) = true;
                      id(stopwatch_start_time) = now_hm - id(stopwatch_elapsed_ms);
                      id(sleep_start_time) = 0;
                    } else {
                      id(stopwatch_running) = false;
                      id(stopwatch_elapsed_ms) = now_hm - id(stopwatch_start_time);
                    }
                  } else if (kind == 3) {
                    id(toggle_ha_music).execute();
                  } else if (kind == 4) {
                    if (s_idx == 0 && id(alarm_snooze_until) > 0) {
                      id(alarm_snooze_until) = 0;
                    } else if (s_idx == 1) {
                      id(alarm1_enabled) = false;
                    } else if (s_idx == 2) {
                      id(alarm2_enabled) = false;
                    } else if (s_idx == 3) {
                      id(alarm3_enabled) = false;
                    }
                  }
                  // If we're in the Translucent Activity Overlay (home_subpage == 2) and fewer than 2 items remain, return to Home!
                  if (id(home_subpage) == 2) {
                    pocket_ui::HomeActivityItem rem_items[8];
                    int rem_cnt = pocket_ui::collect_home_activities(
                        now_hm, id(is_24h_format),
                        id(stopwatch_running), id(stopwatch_start_time), id(stopwatch_elapsed_ms),
                        mus_play_h, m_title_h, m_artist_h,
                        id(alarm_snooze_until),
                        id(alarm1_hour), id(alarm1_minute), id(alarm1_enabled),
                        id(alarm2_hour), id(alarm2_minute), id(alarm2_enabled),
                        id(alarm3_hour), id(alarm3_minute), id(alarm3_enabled),
                        rem_items,
                        now_t_hm.is_valid() ? now_t_hm.hour : -1,
                        now_t_hm.is_valid() ? now_t_hm.minute : -1,
                        id(ha_calendar_agenda_raw).state);
                    if (rem_cnt < 2) {
                      id(home_subpage) = 0;
                      pocket_ui::home_activity_overlay_page() = 0;
                    }
                  }
                  pocket_ui::schedule_disp_update(&id(disp1));
                  return;
                }

                // Left Body Tap -> Open App/Subpage (with tools_direct_home() = true so bottom chin says "Home"!)
                id(home_subpage) = 0;
                pocket_ui::home_dock_page() = 0;
                if (kind == 1) {
                  pocket_ui::tools_direct_home() = true;
                  id(gui_page) = 8;
                  id(stuff_subpage) = 1;
                  pocket_ui::timer_view_slot() = (s_idx >= 0 && s_idx < 3) ? (s_idx + 1) : 0;
                } else if (kind == 2) {
                  pocket_ui::tools_direct_home() = true;
                  id(gui_page) = 8;
                  id(stuff_subpage) = 3;
                } else if (kind == 3) {
                  pocket_ui::tools_direct_home() = false;
                  id(gui_page) = 2;
                  id(music_overlay_mode) = 0;
                  id(music_hud_active) = true;
                  id(music_hud_timer) = now_hm;
                  if (id(active_speaker_entity) != "${local_player_id}" &&
                      id(ha_target_art_url).state != id(current_loaded_art_url)) {
                    id(fetch_remote_art_debounced).execute();
                  }
                } else if (kind == 4) {
                  pocket_ui::tools_direct_home() = true;
                  id(gui_page) = 8;
                  id(stuff_subpage) = 2;
                  id(alarm_edit_idx) = (s_idx >= 1 && s_idx <= 3) ? s_idx : 0;
                } else if (kind == 5) {
                  pocket_ui::tools_direct_home() = true;
                  id(gui_page) = 8;
                  id(stuff_subpage) = 9;
                  id(cal_browse_page) = 1;
                  id(fetch_calendar_browse).execute();
                }
                pocket_ui::schedule_disp_update(&id(disp1));
              };

              // SUBPAGE 2: TRANSLUCENT AUTO-CENTERED LIVE ACTIVITY OVERLAY TOUCH ROUTING
              if (id(home_subpage) == 2) {
                if (is_back_button(touch)) {
                  if (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_home_tap = now_hm;
                    id(home_subpage) = 0;
                    pocket_ui::home_activity_overlay_page() = 0;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                if (act_count > 5 && is_right_chevron_zone(touch)) {
                  if (now_hm - last_home_tap > TOUCH_DEBOUNCE_SCROLL) {
                    last_home_tap = now_hm;
                    pocket_ui::home_activity_overlay_page() = (touch.y < 220) ? 0 : 1;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }
                int start_i = pocket_ui::home_activity_overlay_page() * 5;
                int vis_cnt = std::min(5, act_count - start_i);
                int hit_row = -1;
                if (touch.x >= 90 && touch.x <= 376 && vis_cnt > 0) {
                  for (int r = 0; r < vis_cnt; r++) {
                    int cy_r = pocket_ui::get_activity_overlay_card_y(vis_cnt, r);
                    if (touch.y >= cy_r - 28 && touch.y <= cy_r + 32) {
                      hit_row = r;
                      break;
                    }
                  }
                }
                if (hit_row >= 0 && (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON)) {
                  last_home_tap = now_hm;
                  handle_activity_item_action(start_i + hit_row, (touch.x >= 320));
                  return;
                }
                // Tapping outside the centered cards on the translucent scrim dismisses the overlay!
                if (now_hm - last_home_tap > TOUCH_DEBOUNCE_DISMISS) {
                  last_home_tap = now_hm;
                  id(home_subpage) = 0;
                  pocket_ui::home_activity_overlay_page() = 0;
                  pocket_ui::schedule_disp_update(&id(disp1));
                }
                return;
              }

              // 7. Live Activity Card Tap on Home (y in [232..296], only active once Wake Greeting has finished):
              //    Acts on feat_idx (the currently rotated or urgency-pinned item shown on the card!)
              const bool greet_blocking = id(home_wake_greeting_switch).state &&
                                          pocket_ui::wake_greeting_latched() &&
                                          (now_hm >= pocket_ui::wake_greeting_start_ms()) &&
                                          (now_hm - pocket_ui::wake_greeting_start_ms() < 10500U);
              if (!greet_blocking && act_count > 0 && touch.y >= 230 && touch.y <= 318 && touch.x >= 35 && touch.x <= 440) {
                if (now_hm - last_home_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_home_tap = now_hm;
                  int feat_idx = pocket_ui::resolve_home_featured_activity_idx(act_items, act_count, now_hm);
                  if (act_count > 1) {
                    if (touch.x >= pocket_ui::SCREEN_CX + 127) {
                      pocket_ui::home_activity_overlay_page() = 0;
                      id(home_subpage) = 2;
                      pocket_ui::schedule_disp_update(&id(disp1));
                      return;
                    }
                    handle_activity_item_action(feat_idx, (touch.x >= pocket_ui::SCREEN_CX + 63));
                  } else {
                    handle_activity_item_action(0, (touch.x >= pocket_ui::SCREEN_CX + 123));
                  }
                }
                return;
              }

              // 8. Bottom Swipeable App Dock & Page Pips Zone (y >= 320):
              //    Handled in on_update (horizontal page swipe) and on_release (stationary icon tap)
              if (touch.y >= 320) {
                return;
              }
              return;
            } else if (id(gui_page) == 2) {
              if (id(music_overlay_mode) == 0) {
                if (touch.x >= 100 && touch.x <= 366 && touch.y <= 85) {
                  static uint32_t last_hdr_tap = 0;
                  uint32_t now_hdr = millis();
                  if (now_hdr - last_hdr_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_hdr_tap = now_hdr;
                    id(music_direct_nav) = false;
                    id(music_overlay_mode) = 5;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }

                std::string overlay_mode = id(music_overlay_style).current_option();
                if (overlay_mode.empty()) overlay_mode = "Art Only";
                bool hud_enabled = (overlay_mode != "Always Visible");
                static uint32_t hud_just_woken_time = 0;

                if (!id(music_hud_active) && overlay_mode == "Art + Metadata" &&
                    touch.x >= 135 && touch.x <= 331 && touch.y >= 340 && touch.y < 405) {
                  static uint32_t last_meta_direct_tap = 0;
                  uint32_t now_md = millis();
                  if (now_md - last_meta_direct_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_meta_direct_tap = now_md;
                    id(music_overlay_mode) = 6;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }

                if (hud_enabled && !id(music_hud_active)) {
                  id(music_hud_active) = true;
                  id(music_hud_timer) = millis();
                  hud_just_woken_time = millis();
                  id(hud_wake_finger_released) = false;
                  pocket_ui::schedule_disp_update(&id(disp1));
                  return;
                }

                if (hud_enabled && (!id(hud_wake_finger_released) || (millis() - hud_just_woken_time < 50))) {
                  return;
                }

                if (touch.x >= 182 && touch.x <= 284 && touch.y >= 180 && touch.y <= 280) {
                  static uint32_t last_pp_tap = 0;
                  uint32_t now_pp = millis();
                  if (now_pp - last_pp_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_pp_tap = now_pp;
                    bool is_remote = (id(active_speaker_entity) != "${local_player_id}");
                    bool local_playing = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
                    bool is_playing = pocket_ui::is_music_playing_effective(is_remote, local_playing, id(ha_target_state).state, now_pp);
                    id(music_action_feedback) = is_playing ? "Pausing..." : "Playing...";
                    id(music_feedback_timer) = now_pp;
                    id(music_hud_timer) = now_pp;
                    id(toggle_ha_music).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }

                if (id(music_show_speaker_shortcut).state &&
                    ((touch.x <= 130 && touch.y >= 70 && touch.y < 192) ||
                     (touch.x > 130 && touch.x <= 176 && touch.y >= 70 && touch.y < 178))) {
                  static uint32_t last_sc_spk_tap = 0;
                  uint32_t now_sc = millis();
                  if (now_sc - last_sc_spk_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_sc_spk_tap = now_sc;
                    id(selected_category_mode) = "speakers";
                    id(selected_category_title) = "SPEAKERS";
                    id(music_browse_page) = 1;
                    id(music_direct_nav) = true;
                    id(music_overlay_mode) = 1;
                    id(fetch_music_browse).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }

                if (id(music_show_library_shortcut).state &&
                    ((touch.x <= 134 && touch.y >= 280 && touch.y < 405) ||
                     (touch.x > 134 && touch.x <= 172 && touch.y >= 284 && touch.y < 360))) {
                  static uint32_t last_sc_lib_tap = 0;
                  uint32_t now_sc = millis();
                  if (now_sc - last_sc_lib_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_sc_lib_tap = now_sc;
                    id(music_category_page) = 1;
                    id(menu_scroll_active) = false;
                    id(menu_scroll_step) = 0;
                    id(music_direct_nav) = true;
                    id(music_overlay_mode) = 2;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }

                if (touch.x >= 332 && touch.y >= 70 && touch.y < 188) {
                  static uint32_t last_vol_up_tap = 0;
                  uint32_t now_vol_tap = millis();
                  if (now_vol_tap - last_vol_up_tap > TOUCH_DEBOUNCE_RAPID) {
                    last_vol_up_tap = now_vol_tap;
                    id(music_hud_timer) = now_vol_tap;
                    int v_step = (int)id(volume_step_size).state;
                    bool is_rem_vol = (id(active_speaker_entity) != "${local_player_id}");
                    if (is_rem_vol) {
                      id(music_action_feedback) = "Volume +";
                    } else {
                      int v_next = std::min(100, (int)std::round(id(pocket_music_player).volume * 100.0f) + v_step);
                      id(music_action_feedback) = "Volume: " + to_string(v_next) + "%";
                    }
                    id(music_feedback_timer) = now_vol_tap;
                    id(music_vol_up).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }

                if (touch.x >= 332 && touch.y >= 282 && touch.y < 405) {
                  static uint32_t last_vol_dn_tap = 0;
                  uint32_t now_vol_tap = millis();
                  if (now_vol_tap - last_vol_dn_tap > TOUCH_DEBOUNCE_RAPID) {
                    last_vol_dn_tap = now_vol_tap;
                    id(music_hud_timer) = now_vol_tap;
                    int v_step = (int)id(volume_step_size).state;
                    bool is_rem_vol = (id(active_speaker_entity) != "${local_player_id}");
                    if (is_rem_vol) {
                      id(music_action_feedback) = "Volume -";
                    } else {
                      int v_next = std::max(0, (int)std::round(id(pocket_music_player).volume * 100.0f) - v_step);
                      id(music_action_feedback) = "Volume: " + to_string(v_next) + "%";
                    }
                    id(music_feedback_timer) = now_vol_tap;
                    id(music_vol_down).execute();
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }

                if (touch.x >= 285 && touch.x <= 455 && touch.y >= 188 && touch.y < 282) {
                  static uint32_t last_next_tap = 0;
                  uint32_t now_tap = millis();
                  if (now_tap - last_next_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_next_tap = now_tap;
                    bool is_speech_media = (id(active_playback_media_type) == "podcast" ||
                                            id(active_playback_media_type) == "podcast_episode" ||
                                            id(active_playback_media_type) == "audiobook");
                    if (is_speech_media) {
                      id(music_seek_relative).execute(1);
                    } else {
                      id(music_action_feedback) = "Next Track >>";
                      id(music_next_track).execute();
                    }
                    id(music_feedback_timer) = now_tap;
                    id(music_hud_timer) = now_tap;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }

                bool prev_hit = (id(music_show_speaker_shortcut).state || id(music_show_library_shortcut).state) ?
                                (touch.x >= 75 && touch.x <= 181 && touch.y >= 188 && touch.y < 282) :
                                (touch.x <= 181 && touch.y >= 150 && touch.y <= 316);
                if (prev_hit) {
                  static uint32_t last_prev_tap = 0;
                  uint32_t now_tap = millis();
                  if (now_tap - last_prev_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_prev_tap = now_tap;
                    bool is_speech_media = (id(active_playback_media_type) == "podcast" ||
                                            id(active_playback_media_type) == "podcast_episode" ||
                                            id(active_playback_media_type) == "audiobook");
                    if (is_speech_media) {
                      id(music_seek_relative).execute(-1);
                    } else {
                      id(music_action_feedback) = "<< Prev Track";
                      id(music_prev_track).execute();
                    }
                    id(music_feedback_timer) = now_tap;
                    id(music_hud_timer) = now_tap;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }

                if (touch.x >= 135 && touch.x <= 331 && touch.y >= 338 && touch.y < 405) {
                  static uint32_t last_meta_tap = 0;
                  uint32_t now_mt = millis();
                  if (now_mt - last_meta_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_meta_tap = now_mt;
                    id(music_overlay_mode) = 6;
                    pocket_ui::schedule_disp_update(&id(disp1));
                  }
                  return;
                }

                if (hud_enabled && id(music_hud_active)) {
                  if (touch.x >= 160 && touch.x <= 306 && (touch.y < 150 || (touch.y > 274 && touch.y < 400))) {
                    if (millis() - id(music_hud_timer) >= TOUCH_GUARD_DISMISS) {
                      static uint32_t last_dismiss_tap = 0;
                      uint32_t now_dis = millis();
                      if (now_dis - last_dismiss_tap > TOUCH_DEBOUNCE_DISMISS) {
                        last_dismiss_tap = now_dis;
                        id(music_hud_active) = false;
                        pocket_ui::schedule_disp_update(&id(disp1));
                      }
                    }
                  }
                  return;
                }
              } else if (id(music_overlay_mode) == 5) {
                uint32_t now_hub = millis();
                if (is_back_button(touch)) {
                  static uint32_t last_hub_back = 0;
                  if (now_hub - last_hub_back > TOUCH_DEBOUNCE_BUTTON) {
                    last_hub_back = now_hub;
                    id(music_overlay_mode) = 0;
                    id(music_hud_active) = true;
