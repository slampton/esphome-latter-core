                                ((id(stuff_subpage) == 1 && pocket_ui::timer_view_slot() == 0) ||
                                 (id(stuff_subpage) == 2 && id(alarm_edit_idx) == 0) ||
                                 (id(stuff_subpage) == 3) ||
                                 (id(stuff_subpage) == 12 && !pocket_ui::cam_quick_reply_open())));

      bool show_top_level_back = !id(is_hibernating) && !id(ota_in_progress) && !id(va_active) &&
